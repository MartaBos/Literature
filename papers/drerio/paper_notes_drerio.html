271% at 24 hpf) means nuclei came from pooled embryos; useful trick for estimating coverage from DNA content (4.6 pg per cell), but it means a cell state present in only some embryos is still only partially sampled."}, {"type": "note", "section": "Results - In vivo validation of putative cell type-specific enhancer elements", "text": "The cdh5 enhancer dissection (Etv2 plus Sox7 site removal) is a clean template for testing cavefish or zebrafish candidate enhancers: accessibility alone does not predict activity, and stepwise motif deletion shows which sites carry it."}], "key": "drerio/Sun_2024_NatCellBiol_zebrafish_chromatin_accessibility_atlas", "shared": "Damir · 2025", "preprint": "", "tags": [], "star": false, "source_note": ""}, {"id": "Capek_2023", "title": "EmbryoNet: using deep learning to link embryonic phenotypes to signaling pathways", "category": "Embryo development & nutrition", "link": "https://doi.org/10.1038/s41592-023-01873-4", "note": "", "source_pdf": "papers/drerio/Capek_2023_NatMethods_EmbryoNet_deep_learning_phenotypes.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What problem does EmbryoNet address?", "a": "Classifying embryonic defects to find the responsible signaling pathway needs expert knowledge and the classification schemes are not standardized. EmbryoNet is a deep convolutional neural network that identifies zebrafish signaling mutants automatically and in an unbiased way.", "kw": ["EmbryoNet", "CNN"], "info": "Combined with a model of time-dependent developmental trajectories it classifies defects from loss of function of the seven major signaling pathways of vertebrate development.", "concl": "Deep learning can link embryonic phenotypes to the underlying signaling pathway with high precision."}, {"type": "qa", "section": "Abstract", "q": "What further applications and resources does the paper provide?", "a": "EmbryoNet identifies signaling defects in evolutionarily distant species and, in high-throughput drug screens, resolves the mechanism of action of pharmaceutical substances. The authors freely provide the more than 2 million images used for training and testing.", "kw": ["drug screen", "open data"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which seven signaling pathways shape the zebrafish body plan and what do they do?", "a": "BMP, retinoic acid (RA), Wnt, FGF and Nodal pattern the germ layers and the anterior-posterior and dorsal-ventral axes. Shh and planar cell polarity (PCP) control elongation and morphogenesis of the body axis and later tissue formation.", "kw": ["BMP", "Nodal", "PCP"], "info": "The ligands activating these pathways are dynamically expressed from specific source tissues in the embryo.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why are signaling phenotypes hard to tell apart by eye?", "a": "The defects overlap. Nodal and Shh mutants both show cyclopia, and BMP, Wnt, RA, FGF and PCP mutants all have malformed, shortened tails.", "kw": ["cyclopia"], "info": "Cyclopia in Nodal mutants comes from an early lack of mesoderm, in Shh mutants from a late midline patterning defect. Wnt mutants additionally have an enlarged head.", "concl": "Even the most experienced developmental biologists can confuse these phenotypes, which motivates automated unbiased phenotyping."}, {"type": "qa", "section": "Introduction", "q": "What phenotypes do the individual classes show (Fig. 1b)?", "a": "-BMP: reduced and often curled tails; +RA: no head structures and shortened tails; -Wnt: enlarged heads, shortened tails; -FGF: loss of mesoderm and tail tissue; -Nodal: no mesoderm plus cyclopia; -Shh: mispatterned somites and cyclopia; -PCP: shortened and widened body axis with shorter somites.", "kw": ["phenotype classes"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What were the limits of earlier machine learning work on embryos?", "a": "Previous approaches were limited to staging, segmentation and classification of specific embryos and organs, and could not uncover the molecular basis of the morphological changes.", "kw": ["machine learning"], "info": "CNNs had already been used for bioimage restoration, cell detection and classification, and image segmentation.", "concl": ""}, {"type": "qa", "section": "Results - signaling defects in zebrafish embryos", "q": "Why start the proof of concept with Nodal?", "a": "The pathway components and their functions during the first day of zebrafish embryogenesis are well described, and a specific small molecule, SB-505124, targets the ATP-binding pocket of the receptor kinase.", "kw": ["Nodal", "SB-505124"], "info": "SB-505124 recapitulated the known Nodal loss-of-function phenotype: cyclopia and loss of all endoderm and head-trunk mesoderm.", "concl": ""}, {"type": "qa", "section": "Results - signaling defects in zebrafish embryos", "q": "What data and architecture were used for the Nodal proof of concept?", "a": "Bright-field movies of treated and untreated embryos in random orientations, 342,559 images between 2 and 26 hours post-fertilization, used to train a modified ResNet18 CNN that includes an image timestamp.", "kw": ["ResNet18", "timestamp"], "info": "It identified normal and Nodal-defective embryos independent of orientation and of whether the phenotype came from SB-505124 or from maternal zygotic oep (MZoep) mutants.", "concl": ""}, {"type": "qa", "section": "Results - signaling defects in zebrafish embryos", "q": "How was the full seven-pathway training set built and labeled?", "a": "A chemical genetics approach with specific pathway modulators produced more than 2 million images of loss-of-function phenotypes (gain of function for RA). Curators who knew each treatment assigned the class at the timepoint when the phenotype first became apparent.", "kw": ["chemical genetics", "annotation"], "info": "Classes: Normal, -BMP, +RA, -Wnt, -FGF, -Nodal, -Shh, -PCP, plus Unknown (image lacks information to classify) and Dead (embryo disintegrated). Each image also carried a timestamp.", "concl": ""}, {"type": "qa", "section": "Results - signaling defects in zebrafish embryos", "q": "What is the model transition logic and what did it achieve?", "a": "Rules from developmental knowledge: early embryos are Unknown and can transition to a phenotype class or to Dead at any time, while impossible transitions such as Dead to Normal are penalized. A cost is assigned to every transition in a track and the lowest-cost sequence is chosen.", "kw": ["transition logic", "tracking"], "info": "This approach yielded a classification performance of 89%.", "concl": ""}, {"type": "qa", "section": "Results - signaling defects in zebrafish embryos", "q": "Does EmbryoNet recognize phenotypes produced by other means than the training inhibitors?", "a": "Yes. It robustly classified Nodal and BMP loss of function caused by injected mRNAs for the inhibitors Lefty1 and Chordin and by mutants, also in mixed populations of embryos.", "kw": ["lefty1", "chordin", "MZoep"], "info": "Extended Data Fig. 1: -Nodal accuracy 98% (SB-505124, n=33), 99% (lefty1 mRNA, n=27), 98% (MZoep, n=27); -BMP 96% (LDN-193189, n=45), 85% (chordin mRNA, n=26), 100% (swirl mutant, n=13). In the mixed experiment (n=85) the calls matched the dextran color labels.", "concl": "The classification does not depend on how the pathway was disrupted."}, {"type": "qa", "section": "Results - EmbryoNet is proficient, fast and accurate", "q": "How was EmbryoNet benchmarked against humans?", "a": "With stacks of 98 embryo images covering the full spectrum of phenotype classes, none of which had been used for training, and with the treatments hidden from the assessors.", "kw": ["benchmark"], "info": "Random guessing gave 9% accuracy (F-score 0.09), generated with the MATLAB R2022a function randi.", "concl": ""}, {"type": "qa", "section": "Results - EmbryoNet is proficient, fast and accurate", "q": "How did non-experts, an expert and EmbryoNet compare on the 98 images?", "a": "55 non-expert teams of two reached 53% accuracy (F 0.52) without and 54% (F 0.52) with time information. An experienced developmental biologist reached 79% (F 0.78). EmbryoNet reached 91% (F 0.90) within a few seconds.", "kw": ["human vs AI", "F-score"], "info": "Non-experts had 1 day of developmental biology training and confidently recognized only the class Dead. 31 teams worked without and 24 with time information.", "concl": "EmbryoNet outperformed both expert and non-expert human assessors."}, {"type": "qa", "section": "Results - EmbryoNet is proficient, fast and accurate", "q": "Did context from time series help the human experts?", "a": "Only slightly: two experts who knew that all embryos in a movie had the same treatment reached 83% accuracy (F 0.84), while EmbryoNet reached 90% (F 0.90).", "kw": ["time-lapse"], "info": "The gap was largest for the subtlest phenotypes: -PCP F-score 0.54 for EmbryoNet vs 0.04 for humans, -Shh 0.72 vs 0.36.", "concl": "EmbryoNet is particularly strong on the difficult -Shh and -PCP classes."}, {"type": "qa", "section": "Results - EmbryoNet is proficient, fast and accurate", "q": "Can EmbryoNet handle phenotypes that are not fully penetrant?", "a": "Yes, it accurately identified weaker BMP and Nodal defects produced by lower inhibitor doses, although its performance was lower on mild than on severe phenotypes, especially for Nodal.", "kw": ["penetrance", "LDN-193189"], "info": "Extended Data Fig. 5: a second human labeler was also inconsistent with the accepted ground truth on mild phenotypes. EmbryoNet-Prime was better on weak Nodal but worse on -BMP and on average.", "concl": ""}, {"type": "qa", "section": "Results - EmbryoNet is proficient, fast and accurate", "q": "What is EmbryoNet-Prime?", "a": "EmbryoNet retrained with each treatment class label shifted 4 hours earlier than the timepoint where a human annotator could see the phenotype. It identified Nodal loss of function at the beginning of gastrulation with 90% accuracy (F-score 0.93).", "kw": ["EmbryoNet-Prime", "early detection"], "info": "It detected -BMP, +RA, -Wnt, -Shh and -PCP on average 2 to 3 hours earlier than humans, consistent with the known expression and activation profiles of the signaling molecules.", "concl": "Artificial intelligence can detect embryonic defects hours before human experts can."}, {"type": "qa", "section": "Results - known and latent defect features", "q": "What is a class activation map (CAM) and why was it used?", "a": "A CAM projects the probability of the trained classes onto the input image, localizing the discriminative regions without extra annotation. Positive domains support a class, negative domains oppose it.", "kw": ["CAM", "interpretability"], "info": "Used to ask which features allow EmbryoNet-Prime to classify earlier than humans.", "concl": ""}, {"type": "qa", "section": "Results - known and latent defect features", "q": "How did the authors validate that CAMs reflect the network's decisions?", "a": "By following sudden classification switches: when BMP-inhibited embryos disintegrate, the CAM in the -BMP channel turns negative at once while the Dead channel becomes positively activated.", "kw": ["CAM", "-BMP"], "info": "", "concl": "CAM visualization gives insight into the logic of phenotype classification."}, {"type": "qa", "section": "Results - known and latent defect features", "q": "Which features drove early -Wnt classification?", "a": "At late stages the network was activated in the tail bud and head, the known defect regions at 24 hpf. During early segmentation the whole body axis was already activated, and head and tail defects were picked up as early as bud stage.", "kw": ["Wnt"], "info": "This is why -Wnt embryos were detected earlier by EmbryoNet-Prime than by human assessors.", "concl": ""}, {"type": "qa", "section": "Results - known and latent defect features", "q": "What latent features allowed early -Nodal classification?", "a": "At around 6 hpf detection started with activation at the margin and continued with activation spots at the border between yolk and blastoderm, directly next to the embryo proper. Late-stage calls relied on defects in ectodermal thickening and in head, tail and trunk.", "kw": ["Nodal", "margin"], "info": "The regions fit known sites of Nodal expression and activity, but the authors say it remains to be determined how these molecular signatures manifest as latent cellular and morphological features.", "concl": ""}, {"type": "qa", "section": "Results - drug screen", "q": "How was the drug screen done?", "a": "About 1,000 FDA-approved and bioactive compounds were screened in 96-well plates with several zebrafish embryos per well, spanning 2 to 26 hpf, with automatic classification by EmbryoNet.", "kw": ["drug screen", "phenomics"], "info": "The Results state four to five embryos per well and the Methods three to five. Manual assessment of such screens is limited by the number of images, ambiguity of defects and variability between assessors.", "concl": ""}, {"type": "qa", "section": "Results - drug screen", "q": "Did the screen recover compounds with known effects?", "a": "Yes. Known viability modulators were classified as Dead while mock-treated embryos were Normal, and the RA agonists all-trans-retinoic acid and TTNPB were correctly detected as +RA.", "kw": ["controls", "TTNPB"], "info": "Viability modulators tested: aphidicolin, bafilomycin A1, blebbistatin, brefeldin A, cycloheximide, cytochalasin B, latrunculin B, staurosporin, trichostatin A, tunicamycin and vinblastine.", "concl": ""}, {"type": "qa", "section": "Results - drug screen", "q": "What new signaling effect did the screen uncover?", "a": "Several statins (HMG-CoA reductase inhibitors), including simvastatin, atorvastatin and lovastatin, were classified as -FGF.", "kw": ["statins", "FGF"], "info": "Simvastatin in well H-02 of BML-2843 plate 2 was the classified example shown in Fig. 4b.", "concl": "EmbryoNet can link compounds to signaling pathways that were not previously associated with them."}, {"type": "qa", "section": "Results - drug screen", "q": "How was the -FGF call for statins validated?", "a": "Statin-treated embryos showed dorsal-ventral patterning defects and loss of posterior tissues typical of -FGF embryos, and the activity of the FGF signal transducer pErk was reduced compared with untreated embryos.", "kw": ["pErk", "statins"], "info": "The authors suggest this could be due to dampened isoprenylation of the upstream small GTPase Ras.", "concl": ""}, {"type": "qa", "section": "Results - drug screen", "q": "What is the clinical relevance of the statin finding?", "a": "Lovastatin is not recommended during pregnancy and lactation, and simvastatin is recommended as a substitute, yet EmbryoNet detected the same defects with simvastatin.", "kw": ["teratogenicity"], "info": "The authors caution that the bioavailability in zebrafish compared with human cells is currently unclear.", "concl": ""}, {"type": "qa", "section": "Results - generalization to other species", "q": "Which other species were tested and how were conditions adapted?", "a": "Medaka (Oryzias latipes) and three-spined stickleback (Gasterosteus aculeatus), which diverged from zebrafish hundreds of millions of years ago. Imaging length was adapted to their slower development, and temperature, embryos per well and drug concentration were adjusted.", "kw": ["medaka", "stickleback"], "info": "Medaka and stickleback eggs have large lipid droplets and more yolk relative to the embryo, and medaka eggs have adhesive filaments, so embryos had to be imaged until late segmentation stages.", "concl": ""}, {"type": "qa", "section": "Results - generalization to other species", "q": "What were the cross-species results?", "a": "In both species wild types had well-formed somites and eyes, while Nodal-inhibited embryos lost somites and had severe central nervous system defects and frequent cyclopia. After training on these datasets EmbryoNet robustly identified wild-type and Nodal-inhibited individuals.", "kw": ["Nodal"], "info": "Confusion matrices: medaka Normal 1.00, Nodal 0.97 (n=39 and n=35); stickleback Normal 1.00, Nodal 0.94 (n=4 and n=4).", "concl": "The approach generalizes to signaling-based phenotypic defects in evolutionarily distant species."}, {"type": "qa", "section": "Methods - embryo preparation", "q": "How were the zebrafish embryos handled?", "a": "TE strain embryos were collected within 1 hour of fertilization at the 2- to 8-cell stage, and 10 to 20 embryos were placed per well of a 24- or 48-well plate in 1 ml embryo medium, then treated with the small-molecule modulators.", "kw": ["TE strain"], "info": "All zebrafish embryos were between 0 and 48 hpf.", "concl": ""}, {"type": "qa", "section": "Methods - embryo preparation", "q": "How were PCP and Shh phenotypes made, and which injections were used for Nodal and BMP?", "a": "PCP: 1 ng vangl2-targeting morpholino at the one-cell stage. Shh: cyclopamine incubation or gli3R-GFP mRNA injection. Nodal: 10 pg lefty1 mRNA with Alexa647-dextran. BMP: 75 pg chordin mRNA with Alexa488-dextran.", "kw": ["vangl2", "cyclopamine", "gli3R"], "info": "0.1 ng of 10 kDa dextran was co-injected as a label. Phenotypes were validated with swirl homozygous mutants and maternal zygotic oep mutants.", "concl": ""}, {"type": "qa", "section": "Methods - embryo preparation", "q": "What were the conditions for medaka and stickleback?", "a": "Medaka (Cab strain) at 28 C, antagonists at 7.5 micromolar from early blastula, imaged 8 to 45 hpf every 5 min, about 500 embryos. Stickleback (Little Campbell River and Tyne River strains) at 16 C, antagonists at 15 micromolar, imaged 120 h every 5 min at 15-18 C, about 200 embryos.", "kw": ["medaka", "stickleback"], "info": "Stickleback embryos came from in vitro fertilization and covered 0 to 140 hpf; medaka 0 to 48 hpf.", "concl": ""}, {"type": "qa", "section": "Methods - image acquisition", "q": "How were the images acquired?", "a": "On an ACQUIFER Imaging Machine with white LED bright-field and a 2,048 x 2,048 sCMOS camera, 2x objective (NA 0.06), 110 ms exposure at 100% LED, 28 C, 720 iterations at 120 s intervals.", "kw": ["ACQUIFER"], "info": "Images were stored as 12-bit TIFF, 2,048 x 2,048 pixels, 0.31 pixels per micrometer, then converted to JPEG or PNG. Imaging Machine software v4.00.21.", "concl": ""}, {"type": "qa", "section": "Methods - image acquisition", "q": "How did they show the method is not tied to one microscope?", "a": "A second microscope, the Keyence BZ-X810 (2x apochromat objective, 3.7 W LED, BZ-X800 viewer v01.03.00.01), was also used, with 0.1 ms exposure at 50% intensity and 8-bit JPEG images of 1,920 x 1,440 pixels.", "kw": ["Keyence BZ-X810"], "info": "Extended Data Fig. 4d,e shows performance of EmbryoNet and EmbryoNet-Prime separately for each microscope's test data.", "concl": ""}, {"type": "qa", "section": "Methods - detection and tracking", "q": "How are individual embryos found and followed over time?", "a": "Embryos are detected per frame with a standard Hough-transform object detection that returns bounding boxes as JSON files, and the detections are linked across consecutive frames with the DeepSort algorithm without re-identification.", "kw": ["Hough transform", "DeepSort"], "info": "The radius range in pixels is set per experiment from the acquisition parameters. The Hough detector can be swapped for other methods such as watershed segmentation to handle non-spherical species like Drosophila.", "concl": ""}, {"type": "qa", "section": "Methods - manual labeling", "q": "How were the training labels assigned and how many classes were there?", "a": "All embryos started as Unknown and each track was annotated with its phenotypic class from the timepoint the phenotype was visible to an experienced annotator; disintegrating embryos were labeled Dead. Altogether 14 classes were used.", "kw": ["FishLabeler", "14 classes"], "info": "Labeling used the GUI FishLabeler; 90% of images were used for training and 10% for validation, with an independent annotated test set. Partially visible or unspecific embryos were labeled Cut and excluded.", "concl": ""}, {"type": "qa", "section": "Methods - manual labeling", "q": "How were severity levels defined for -BMP and -Nodal?", "a": "Three levels: weak about 30%, intermediate about 60% and severe about 100% phenotype severity. For Nodal the bins came from the inhibitor concentration, with 100% being the lowest concentration giving full penetrance; for BMP the classes C3, C4 and C5 of a previous scheme corresponded to 30%, 60% and 100%.", "kw": ["severity bins"], "info": "Using drug concentration as ground truth accepts a certain spread of actual phenotypes.", "concl": ""}, {"type": "qa", "section": "Methods - manual labeling", "q": "How was EmbryoNet-Prime's training data generated?", "a": "The original annotations were used to find the timepoint when most embryos were correctly classified, and the class was then assigned 120 frames (4 h) earlier, when the phenotype could not be identified by eye. Cut and Dead labels were left unchanged.", "kw": ["EmbryoNet-Prime"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - model training", "q": "What are the network inputs?", "a": "Four channels of 224 x 224 pixels: three standard RGB image channels plus a timestamp channel giving the time since the start of the experiment, linearly mapped to [0, 1] with 0 about 2 hpf and 1 about 26 hpf.", "kw": ["timestamp channel"], "info": "The time input was added because embryo images alone can be confused between phenotypes that look similar at different developmental stages. Time was also fed into the last fully connected layer.", "concl": "Developmental time is used as an explicit second input, not just image content."}, {"type": "qa", "section": "Methods - model training", "q": "How was ResNet18 modified and how was class imbalance handled?", "a": "ResNet18 was chosen for its easy and fast convergence; it was modified to take four instead of three input channels and its last classification layer was replaced. The overrepresented class Unknown was undersampled and the 13 remaining classes were replicated.", "kw": ["ResNet18", "class imbalance"], "info": "Weights were updated by back-propagation while the architecture stayed fixed.", "concl": ""}, {"type": "qa", "section": "Methods - model training", "q": "Which optimizer, loss and augmentations were used?", "a": "The Adam optimizer with softmax cross-entropy loss, L = -1/n sum ln p_i. Augmentations from the Albumentations library included random horizontal and vertical flips, rotations from 1 to 90 degrees in 1 degree steps, crops and salt-and-pepper noise.", "kw": ["Adam", "Albumentations", "cross-entropy"], "info": "During training one random augmentation per group was picked and applied to the input image.", "concl": ""}, {"type": "qa", "section": "Methods - model training", "q": "Why and how was progressive training used?", "a": "The CNN did not converge when all datasets and augmentations were used from the start, so training was split into sequential steps that progressively added data and augmentations. Eight steps with 10 to 20 epochs each gave 152 epochs in total.", "kw": ["progressive training"], "info": "Initial learning rate 10^-3, decayed by a factor of 0.1 after each epoch and restored to 10^-3 at the beginning of each iteration; batch size n = 350; trained on an NVIDIA RTX 3090 under Ubuntu 20.04.4 LTS.", "concl": ""}, {"type": "qa", "section": "Methods - model training", "q": "How is rotation and mirror invariance exploited at prediction time?", "a": "Each detected embryo is run through the trained network eight times (original, horizontal flip, vertical flip, diagonal mirror, and each of these rotated by 90 degrees), the class probabilities are averaged, and the embryo is assigned the class with the highest probability.", "kw": ["test-time augmentation"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - model transition logic", "q": "Which transitions are allowed in a track, and how are severity calls corrected?", "a": "Only Unknown to a phenotype class, phenotype class to Dead, and Unknown to Dead; any other transition is penalized. Nodal and BMP severity is corrected by taking the severity class seen most often over the time course.", "kw": ["transition logic"], "info": "Model quality is scored by the number of frames between transition points that match the expected class, the least-cost sequence is taken as correct, and outliers are ignored in the track history.", "concl": ""}, {"type": "qa", "section": "Methods - model transition logic", "q": "What was special about the medaka training, and what did it show?", "a": "Semi-supervised training was used: a transition point from which phenotypes were easy to tell apart was set and applied automatically to all training data. Because medaka experiments started at blastula rather than cleavage stages, the transition point was timepoint 1 and the Unknown class was not used at all.", "kw": ["medaka", "semi-supervised"], "info": "Medaka embryos disintegrated if treated with Nodal inhibitor before blastula stages. Leaving out Unknown did not reduce training or classification efficiency.", "concl": "An Unknown state for early stages is not unconditionally required."}, {"type": "qa", "section": "Methods - evaluation", "q": "Which performance metrics were used?", "a": "Subset accuracy, the fraction of images classified correctly, and the F-score, 2 x precision x recall / (precision + recall).", "kw": ["accuracy", "F-score"], "info": "The class Unknown was left out of the confusion matrices but was included in the overall accuracy and F-score; the numbers including Unknown are in the supplementary tables.", "concl": ""}, {"type": "qa", "section": "Methods - CAMs", "q": "How were the CAMs computed and displayed?", "a": "The weights of the final output layer in a fully connected layer were projected using global max pooling, CAMs were computed for all classes and normalized so the minimum and maximum across classes were -1 and +1.", "kw": ["CAM"], "info": "Values were remapped as sign(V) x sqrt(V) to emphasize strongly positive or negative regions, then mapped to 8-bit and shown with the jet colormap.", "concl": ""}, {"type": "qa", "section": "Methods - drug screening", "q": "Which libraries were screened and how were the plates set up?", "a": "The Screen-Well ICCB Known Bioactives library BML-2840 and the FDA-approved drug library BML-2843. Compounds were diluted 1:25 in PBS, and 15 microlitres were added to wells holding three to five embryos in 135 microlitres of embryo medium.", "kw": ["BML-2840", "BML-2843"], "info": "Plates were imaged on the ACQUIFER machine with intervals of 135 to 192 s; images were sorted per well and classified with the custom FishClassifier software, with detections stored as JSON and summarized in Excel. The majority phenotype of a well is the class with the most embryo images.", "concl": ""}, {"type": "qa", "section": "Methods - statin retest", "q": "How were the statin hits retested and pErk measured?", "a": "Embryos were treated from 1.5-2 hpf with 20 micromolar simvastatin, 40 micromolar atorvastatin or 0.4 micromolar lovastatin at 28 C, imaged live at 28 hpf, and fixed at shield stage for anti-pERK immunostaining (1:5,000) with Cy3-TSA amplification and DRAQ7 nuclear staining.", "kw": ["pErk", "immunostaining"], "info": "Stained embryos were imaged on a ZEISS Lightsheet Z.1 (10x objective, 0.9 zoom, 5 micrometre z-steps). Intensity profiles from the margin to the animal pole were taken from maximum intensity projections of 75 slices in Fiji, with background subtracted in MATLAB 2022a; embryos with tilted dorsal-ventral axes were excluded.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What is a phenome and why does phenomics need machine learning?", "a": "The phenome is the entire set of phenotypes of an organism over time, and phenomics connects phenotypes with genotypes and environmental influences. It requires processing large amounts of high-dimensional data, which makes computer vision and machine learning promising.", "kw": ["phenomics"], "info": "Such approaches are already increasingly used in plant and crop phenomics.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What are the main claims the authors make for EmbryoNet?", "a": "It outcompeted human assessors in speed, accuracy and sensitivity, linked zebrafish phenotypes to major signaling pathways including incompletely penetrant ones, could be retrained for species separated from zebrafish by hundreds of millions of years, and correctly associated compounds with signaling functions in a proof-of-concept screen.", "kw": ["EmbryoNet"], "info": "The authors suggest it can speed up characterization of developmental mutants in multiple species and support drug repurposing.", "concl": "Automated phenotyping links morphology to signaling pathways across species and compounds."}, {"type": "qa", "section": "Discussion", "q": "What limitations do the authors list?", "a": "It is uncertain whether EmbryoNet can beat humans on very mild phenotypes, for example from low drug concentrations, and its reliance on a library of manual annotations limits classification of novel phenotypes, especially those from combinatorial disruption of several pathways.", "kw": ["limitations"], "info": "They expect rapid progress in deep learning to help address these limits and eventually help bridge the genotype-phenotype gap.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Where are the code and data available?", "a": "EmbryoNet is open source with Python packages, a GitHub repository and GUIs for labeling and classification at github.com/mueller-lab/EmbryoNet, and training, testing and drug screen imaging data are provided at embryonet.uni-konstanz.de.", "kw": ["open source"], "info": "Code is archived at zenodo 10.5281/zenodo.7531593; datasets have DOIs under 10.48606. The modular design should allow adaptation to other species and to organoids.", "concl": ""}, {"type": "note", "section": "Results - known and latent defect features", "text": "The early -Nodal activation at the margin and at the yolk-blastoderm border is said to fit known Nodal expression domains, but what the network actually sees there in cellular or morphological terms is unresolved - could be worth checking the CAM videos (Supplementary Videos 19-20)."}, {"type": "note", "section": "Methods - detection and tracking", "text": "Detection uses a Hough transform assuming round embryos; the authors say it can be swapped for watershed for non-spherical species. Relevant if one wanted to apply this pipeline to Astyanax embryos."}, {"type": "note", "section": "Discussion", "text": "The annotation-dependence limit means novel or combinatorial phenotypes cannot be classified - an interesting direction would be unsupervised or self-supervised phenotype discovery rather than fixed classes."}], "key": "drerio/Capek_2023_NatMethods_EmbryoNet_deep_learning_phenotypes", "shared": "Damir · 2025", "preprint": "", "tags": [], "star": false, "source_note": ""}, {"id": "Xu_2025", "title": "Epigenetic regulation in early embryo development: from zygotic genome activation to the first lineage specification", "category": "ZGA & early embryo", "link": "https://doi.org/10.1016/j.tig.2025.05.005", "note": "", "source_pdf": "papers/drerio/Xu_2025_TrendsGenet_epigenetics_ZGA_to_lineage.txt", "items": [{"type": "qa", "section": "Abstract", "q": "What kind of paper is this and where was it published?", "a": "It is a review by Xu R, Li Y, Wu Y, Liu X and Gao S, published in Trends in Genetics in 2025.", "kw": ["review"], "info": "PMID 40480920. These notes are based only on the abstract and metadata because the full text was not accessible.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What role does epigenetic regulation play in early embryo development?", "a": "It plays a pivotal role in orchestrating early embryo development and guides the transition from a totipotent zygote to a complex multicellular organism.", "kw": ["totipotency", "zygote"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which developmental window does the review focus on?", "a": "The dynamic landscape of epigenetic reprogramming during preimplantation embryo development, from zygotic genome activation (ZGA) to the first lineage specification.", "kw": ["zygotic genome activation", "preimplantation embryo", "lineage specification"], "info": "The window is taken from the title and the keywords. The abstract does not say which species are covered. The MeSH terms list Humans and Animals.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which epigenetic layers does the review cover?", "a": "DNA methylation, histone modifications, higher-order chromatin, transposable elements (TEs) and RNA modifications.", "kw": ["DNA methylation", "histone modifications", "transposable elements"], "info": "The review stresses how these layers interact with each other, not each one on its own.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the goal of epigenetic reprogramming in the early embryo, according to the review?", "a": "Resetting the parental epigenome, which comes about through the interplay of DNA methylation, histone modifications, higher-order chromatin, TEs and RNA modifications.", "kw": ["epigenetic reprogramming", "parental epigenome"], "info": "The abstract gives no details about the specific mechanisms.", "concl": "Resetting the parental epigenome depends on several epigenetic layers acting together."}, {"type": "qa", "section": "Abstract", "q": "In which artificial settings does the review discuss abnormal epigenetic reprogramming?", "a": "In somatic cell nuclear transfer (SCNT) and in assisted reproductive technologies (ART).", "kw": ["SCNT", "ART"], "info": "The abstract does not say which specific defects are described.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Does the review link epigenetic defects to disease?", "a": "Yes. It summarizes clinical disorders that result from abnormal epigenetic reprogramming and discusses possible therapeutic strategies.", "kw": ["clinical disorders"], "info": "The abstract does not name the disorders or the therapeutic strategies.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the overall aim of the review?", "a": "To clarify the role of epigenetic modifications in developmental defects and to offer perspectives that help both developmental biology research and the clinical use of assisted reproduction.", "kw": ["developmental defects"], "info": "The review also discusses future research directions.", "concl": "The review connects basic epigenetic reprogramming in early embryos with clinical problems in ART and SCNT."}, {"type": "note", "section": "Abstract", "text": "Get the full text to check which species are covered, especially whether zebrafish or other non-mammalian models are discussed alongside the mammalian preimplantation embryo, and how TEs and RNA modifications act at ZGA."}], "key": "drerio/Xu_2025_TrendsGenet_epigenetics_ZGA_to_lineage", "shared": "Damir · 2026", "preprint": "", "tags": [], "star": false, "source_note": "Not the full paper: no access to the full text, so these notes are based only on the publicly available abstract and metadata (PubMed). Details from the main text and figures are missing."}, {"id": "Riddle_2021", "title": "Fish models for investigating nutritional regulation of embryonic development", "category": "Embryo development & nutrition", "link": "https://doi.org/10.1016/j.ydbio.2021.03.012", "note": "", "source_pdf": "papers/drerio/Riddle_2021_DevBiol_fish_nutrition_embryo_development.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this review address?", "a": "Maternal diet clearly affects fetal development, but it is not fully understood how nutrients such as lipids and vitamins change developmental programs. Over recent decades, developmental biology has focused mostly on the spatiotemporal regulation and function of genes.", "kw": ["maternal nutrition"], "info": "This is a review in a Developmental Biology special issue on nutritional, hormonal and metabolic drivers of development. It contains no new experimental data, so it has no Methods or Results sections.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Why are fish embryos good systems for studying nutrition in development?", "a": "Most fish eggs develop outside the mother and depend on a finite amount of yolk. The embryo is therefore a closed system that is easy to analyse biochemically, visualise and manipulate.", "kw": ["yolk", "closed system"], "info": "This setup lets researchers study the role of nutrients in tissue specification, organogenesis and growth.", "concl": "Natural variation in yolk composition across fish species may be linked to their different developmental strategies."}, {"type": "qa", "section": "Abstract", "q": "Which three fish species does the review highlight, and why each one?", "a": "Zebrafish (Danio rerio) for its many molecular tools and nutritional datasets. The African killifish (Nothobranchius furzeri) for its annual life cycle, which lets you study developmental timing and lifespan. The Mexican tetra (Astyanax mexicanus) because you can directly compare morphotypes adapted to different nutritional landscapes.", "kw": ["Danio rerio", "Nothobranchius furzeri", "Astyanax mexicanus"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What happens to the fetus when maternal nutrition is poor?", "a": "Micronutrient deficiencies cause defects in neural tube closure, bone mineralization and immune system development. Caloric deficiency restricts fetal growth and is linked to low birth weight and a predisposition to diabetes, obesity and heart disease.", "kw": ["malnutrition"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is maternal nutrition hard to study in humans and mice?", "a": "Human studies need large cohorts and long timeframes, because environmental and genetic variables cannot be controlled and gestation is long. Mouse studies are costly, and nutrient use in the mouse embryo is hard to control and visualise.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What practical advantages do fish offer for nutrition research?", "a": "Fish produce many embryos, sometimes continuously. Egg composition can be changed through the maternal diet or by injection, and embryos can be immersed in chemicals for large-scale screens. Embryos are transparent and develop quickly, and some species are very short lived.", "kw": ["CRISPR/Cas9", "chemical screening"], "info": "Other advantages: many sequenced genomes with well-understood phylogeny, efficient CRISPR/Cas9 editing in diverse species, existing aquaculture research on fecundity and egg quality, and embryonic development and gene function that are fairly well conserved with humans.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the common problem that all teleost fishes face?", "a": "Teleosts comprise more than 26,000 species. Most of them produce eggs that develop outside the mother and rely on yolk until the larvae can feed. Although their diets differ greatly, all of them must make yolk that can support the growth of the next generation.", "kw": ["Teleostei"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What is fish egg yolk made of?", "a": "Mostly proteins, lipids and water, with smaller amounts of carbohydrates and vitamins. These nutrients accumulate during oogenesis.", "kw": ["yolk", "oogenesis"], "info": "Yolk concentrations of lipids, fat-soluble vitamins, inorganic phosphate, iron, calcium and magnesium vary both within and between species.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "How is vitellogenin production switched on?", "a": "Environmental cues such as temperature or diet cause the ovary to release estrogen. In the liver, estrogen binds the estrogen receptor, which interacts with estrogen response elements (EREs) in the promoters of vitellogenin (vtg) genes.", "kw": ["vitellogenin", "estrogen response element"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What is vitellogenin, and how does it get into the oocyte?", "a": "Vitellogenin (Vtg) is a high molecular weight lipoprotein made of polypeptide homodimers that carry carbohydrate and lipid cargo. The lipids carry minerals, fat-soluble vitamins and hormones. Vtg travels from the liver to the ovary in the blood and enters oocytes by receptor-mediated endocytosis through the Vtg receptor (VTGR).", "kw": ["vitellogenin", "VTGR", "receptor-mediated endocytosis"], "info": "Oocytes can also take up lipids from circulating VLDL. Fluorescently labelled VLDL lipids accumulate in the oocyte but the VLDL proteins do not. This suggests that extracellular lipases release free fatty acids, which enter by passive diffusion or through lipid transporters.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What is vitellogenesis?", "a": "Vitellogenesis is the process of Vtg synthesis and the accumulation of nutrients during oocyte growth.", "kw": ["vitellogenesis"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "How is internalized vitellogenin broken down?", "a": "In two steps. During oocyte growth, cathepsins in lower-pH vesicles cut Vtg at specific sites into five yolk proteins: lipovitellin heavy chain (LvH), phosvitin (Pv), lipovitellin light chain (LvL), beta-prime component and C-terminal component (Ct). During oocyte maturation, some of these domains are cut further into free amino acids.", "kw": ["cathepsin", "lipovitellin", "phosvitin"], "info": "Free amino acids and vesicular pH create an osmotic effect that draws water into the oocyte through aquaporins. This hydrates the egg and makes it buoyant. LvH and LvL carry lipids that contain minerals and fat-soluble vitamins.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What types of Vtg genes do teleosts have?", "a": "Teleosts have two A-type paralogs (VtgAa and VtgAb) that contain all five yolk protein domains. They also have one incomplete C-type Vtg that contains only the LvL and LvH domains. Duplications and deletions have produced variation in Vtg gene number and sequence.", "kw": ["VtgAa", "VtgAb", "VtgC"], "info": "Zebrafish have eight vtg genes, and some lack the beta-prime and Ct domains. In rainbow trout, one vtg gene is duplicated twenty times in tandem. At the time of writing, the vtg repertoires of African killifish and Mexican tetra had not been described.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "Why might Vtg sequence evolution matter for development?", "a": "The Vtg sequence determines which yolk proteins are made and how strongly they bind lipids and fat-soluble vitamins. It could therefore change embryo physiology, for example membrane properties or the amount of vitamin-derived signalling molecules.", "kw": ["vitellogenin evolution"], "info": "Regulatory changes in Vtg promoters could change Vtg synthesis rates. Different combinations of Vtg receptors in endocytosed vesicles might route them to specific yolk granules. That could change the order in which granules are used, and with it tissue growth or signalling.", "concl": "Vtg sequence evolution drives differences in yolk nutrition. Whether Vtg evolution parallels changes in developmental strategy is still open."}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "Which yolk nutrients vary most within and between species?", "a": "Nutrients derived from carotenoids. Carotenoids are yellow to orange pigments made by plants, fungi, algae and bacteria. Animals convert them into 11-cis-retinal and vitamin A for vision, and into retinoic acid (RA), which regulates gene expression.", "kw": ["carotenoids", "vitamin A", "retinoic acid"], "info": "In humans, vitamin A deficiency can cause childhood blindness, and excess vitamin A is teratogenic. In fish, RA is involved in symmetry formation, heart development, hematopoiesis, bone and tooth formation, and neural crest migration.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "How does egg carotenoid content relate to egg viability?", "a": "The relationship between carotenoid level and hatching rate is non-linear. There appears to be a critical level for viability, above 1 to 3 micrograms per gram.", "kw": ["carotenoids", "hatching rate"], "info": "This comes from older work across several species, reviewed by Craik (1985).", "concl": "Species differences in carotenoid assimilation, storage and metabolism probably contribute to developmental diversity."}, {"type": "qa", "section": "Introduction - yolk utilization", "q": "Which yolk nutrients does the embryo use first, and what is its main energy source?", "a": "Free amino acids are used first, during early blastomere formation. Overall, fatty acids are the main source of ATP, because oxidising them yields more ATP than glucose does.", "kw": ["free amino acids", "fatty acid oxidation"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - yolk utilization", "q": "What is the yolk syncytial layer (YSL), and what does it do?", "a": "At the 500 to 1000 cell stage (512 to 1024 cells in zebrafish), blastomeres next to the yolk collapse and deposit their nuclei and cytoplasm into the yolk cell cortex. This forms a multinucleated layer that wraps around the yolk and mediates the transfer of nutrients from the yolk to the embryo.", "kw": ["YSL", "yolk syncytial layer"], "info": "Lipoproteins are made from yolk granule stores in the endoplasmic reticulum of the YSL and enter the embryo's circulation. They are routed to different tissues according to which lipoprotein receptors those tissues express.", "concl": ""}, {"type": "qa", "section": "Zebrafish", "q": "Why is zebrafish a strong model for studying nutrition in development?", "a": "Zebrafish reach sexual maturity at 3 months, and females produce hundreds of embryos every few days (200 to 300 per spawn). Available resources include the complete egg proteome with egg quality biomarkers, lipidome data across development, methods for studying oogenesis, and genomic data on zfin.org.", "kw": ["zebrafish", "proteome", "lipidome"], "info": "Adults are 2.5 to 4 cm long. Fluorescent molecules have been used to follow nutrients from mother to yolk and from yolk to embryo. Large screens for mutations or toxicants that affect yolk composition and use are feasible.", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "How many vitellogenin genes do zebrafish have, and how are they grouped?", "a": "Eight vtg genes, which can produce up to nineteen splice variants. Type I (vtg1, 4, 5, 6, 7) are incomplete VtgA forms lacking the beta-prime and Ct domains. Type II (vtg2, vtg8) are complete VtgA forms. Type III (vtg3) is a typical VtgC that lacks the Pv, beta-prime and Ct domains.", "kw": ["vtg1", "vtg3", "splice variants"], "info": "Based on the detailed survey of sequences, expression and protein abundance in liver and egg by Yilmaz et al. (2018).", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "Which Vtg-derived proteins are most abundant in the early zebrafish embryo?", "a": "Vtg1 is the most abundant (39%), followed by Vtg7 (23.7%), Vtg2 (17.5%), Vtg6 (8.1%), Vtg4 (6.6%) and Vtg5 (2.9%). Vtg3 is the least abundant (2.1%).", "kw": ["Vtg1", "Vtg3"], "info": "Values are from Fig. 2B, adapted from Yilmaz et al. (2018), and represent the Vtg composition associated with good egg quality at the 1-cell stage. Vtg8 is not shown in the figure.", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "What happens when type I vtg genes are knocked out in zebrafish?", "a": "Combined knockout of three type I vtg genes (vtg1-KO) increases egg number without lowering fertilization rate, and egg size is unchanged. However, hatching rate drops by about 20%. About half of hatched larvae die by 9 dpf, and none survive past 16 dpf.", "kw": ["vtg1-KO", "fecundity"], "info": "vtg1 mutant larvae fail to start feeding, so they probably die because they cannot obtain external nutrition.", "concl": "Some Vtgs appear to restrict fecundity."}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "What is the phenotype of zebrafish vtg3 knockouts?", "a": "Hatching is strongly delayed: wild-type embryos hatch around 3 dpf, but most vtg3-KO embryos do not finish hatching until 9 dpf. About 70% of vtg3-KO embryos die around 24 hpf, and only 10% survive beyond 16 dpf.", "kw": ["vtg3", "hatching"], "info": "The most common defects in Vtg mutants are abdominal edema and spinal lordosis.", "concl": "Vtg3 contributes the least yolk protein (2.1%), yet losing it seriously harms hatching and viability."}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "What lipids are in the zebrafish yolk at fertilization?", "a": "At the 1-cell stage, cholesterol makes up 40% of total yolk lipids. The rest is phosphatidylcholine (17%), triacylglycerol (9%), phosphatidylinositol (8%), phosphatidylethanolamine (5%), diacylglycerol (4%), cholesteryl esters (3%), sphingomyelins (3%) and other lipids (11%).", "kw": ["lipidome", "cholesterol"], "info": "From Fig. 2C, adapted from Fraher et al. (2016).", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "How do yolk and body lipids change during zebrafish development?", "a": "Most lipids decrease linearly in the yolk between 0 and 120 hpf and increase similarly in the body between 24 and 120 hpf, which suggests simple transfer. The exceptions are phosphatidylcholine and triacylglycerol, which rise in the yolk from 0 to 24 hpf and then fall, and diglyceride, which stays constant in the yolk but rises in the embryo from 24 to 120 hpf.", "kw": ["lipidome", "de novo lipid synthesis"], "info": "Free fatty acids injected into the yolk appear in the embryo after 6 h as part of different lipid species.", "concl": "Lipids can be synthesized de novo in the yolk before they are transported into the embryo, so the yolk cell is metabolically active."}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "Does retinoic acid signalling affect embryonic lipid levels?", "a": "Yes. Immersing embryos in RA signalling modulators from 26 to 55 hpf changes neutral lipid levels in developing tissues, as shown by oil-red O staining. Blocking RA synthesis reduces staining because lipoprotein lipases are upregulated.", "kw": ["retinoic acid", "oil-red O", "lipoprotein lipase"], "info": "", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk utilization", "q": "How do yolk lipoproteins reach the zebrafish embryo?", "a": "Lipoproteins are produced in the endoplasmic reticulum of the YSL and enter the circulatory system through direct contact with the caudal vein. Microsomal triglyceride transfer protein (MTP) is essential for assembling ApoB-containing lipoproteins in the YSL.", "kw": ["MTP", "ApoB", "caudal vein"], "info": "", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk utilization", "q": "What happens in zebrafish mttp mutants, and how is it visualized?", "a": "The normally clear YSL turns dark because triglycerides build up in cytoplasmic lipid droplets, and lipoprotein formation is reduced. The ApoBb.1-NanoLuc transgene, in which ApoB is fused to a luciferase, shows the reduced lipoprotein signal in the body.", "kw": ["mttp", "ApoBb.1-NanoLuc", "LipoGlo"], "info": "The c655 mutation (G863V) is milder than stalactite (L475P). Both abolish MTP triglyceride transfer, but c655 keeps phospholipid transfer activity and still allows small lipoproteins to form. The text calls NanoLuc a luciferase, while the Fig. 3 legend calls it fluorescent, so the readout is described inconsistently.", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk utilization", "q": "What developmental defects result from reduced lipoprotein transport?", "a": "The full range has not been explored. One study found excessive angiogenesis in Mtp mutants, because ApoB normally inhibits blood vessel formation through VEGF signalling. Injecting diffusible ApoB rescued the angiogenic defects.", "kw": ["angiogenesis", "VEGF", "ApoB"], "info": "The authors suggest using different Mtp mutants to control the timing and amount of nutrients delivered to the embryo.", "concl": ""}, {"type": "qa", "section": "African killifish", "q": "What is the annual life cycle of the African turquoise killifish?", "a": "The fish live in seasonal ponds that hold water only during the short rainy season. They mature within 2 to 3 weeks of hatching and have the shortest known lifespan of any vertebrate. Newly laid embryos enter diapause after somitogenesis and survive in dry sediment for months or years, then resume development when the ponds refill.", "kw": ["diapause", "annual killifish"], "info": "The paper gives the median lifespan as 4 to 6 months in one place and 5 to 6 months in another.", "concl": ""}, {"type": "qa", "section": "African killifish", "q": "What triggers hatching in the killifish, and what is delayed hatching?", "a": "Hatching needs two cues: water and humic acid from decaying plants. If either is missing, for example if embryos do not sense water through osmotic water permeability, they enter a second, shorter diapause-like state called delayed hatching.", "kw": ["delayed hatching", "humic acid"], "info": "Time from fertilization to hatching ranges from 2 to 3 weeks without diapause to more than 2.5 years with diapause at mid-embryogenesis and at the end of embryogenesis.", "concl": ""}, {"type": "qa", "section": "African killifish", "q": "Why is the killifish especially useful for nutrition research?", "a": "It combines a fixed pre-deposited nutrient supply with variable developmental trajectories. Its very short lifespan also makes it possible to follow how embryonic nutrition affects growth, fecundity, health, lifespan and transgenerational epigenetic inheritance.", "kw": ["lifespan", "transgenerational inheritance"], "info": "Lifespans of mice and zebrafish are about 4 and 5.5 years. Available resources include a de novo assembled and annotated genome, transcriptome and epigenome, Tol2 transgenesis, CRISPR/Cas9 editing and CRISPR/Cas13d mRNA knockdown. Maternal intake and embryo nutrient content (by microinjection) can both be manipulated.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk composition", "q": "Is there a maternal effect on whether killifish embryos enter diapause?", "a": "Yes, a strong one. Most embryos obligatorily enter diapause, but more than 95% of embryos from very young mothers escape it. Because maternal mRNAs are already heavily diluted by mid-embryogenesis, the authors propose that young and old mothers may deposit different nutrients in the egg.", "kw": ["maternal effect", "diapause"], "info": "This is a hypothesis; the guiding nutrient or chemical has not been identified.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk composition", "q": "What are oil droplets in killifish eggs, and how do they behave during development?", "a": "Oil droplets (oil globules) are rich in lipids and unsaturated fatty acids. Medaka eggs have them but zebrafish eggs do not. In killifish, droplet volume does not change significantly during embryonic development, including diapause, but the droplets darken during delayed hatching.", "kw": ["oil droplets", "triglycerides"], "info": "Oil droplets usually hold 50 to 60% of total egg lipids, and up to 90% in annual killifish, mostly as triglycerides. Medaka embryos develop normally after their oil droplets are removed. In the South American killifish Austrolebias bellottii, triglyceride levels did not decline even after six years of diapause. The killifish genome annotation contains 3 vtg genes, corresponding to zebrafish Vtg2, 3 and 7 by protein similarity.", "concl": "Oil droplets may serve as an energy reserve before hatching and in newly hatched fry."}, {"type": "qa", "section": "African killifish - yolk composition", "q": "How do annual killifish embryos cope with drying out?", "a": "A specialised chorion structure limits water loss, and downregulation of aquaporins in the enveloping layer is thought to help regulate water permeability. In the first few days in air, embryos lose about half of their extraembryonic water, but the loss then stabilises and the embryo body stays fully hydrated.", "kw": ["desiccation", "aquaporins", "EVL"], "info": "Transcriptomes of embryos in aerial versus aquatic conditions during delayed hatching differ in signalling (MAPKs), protein metabolism (USP5, UCH11) and lipid metabolism (LPL) genes. Whether diapause length differs between these conditions has not been studied.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk utilization", "q": "How does killifish developmental timing compare with zebrafish?", "a": "Killifish embryos are similar in size to zebrafish embryos but have a much larger yolk sac. Embryogenesis is much slower (2 to 3 weeks vs 2 to 3 days), but post-hatching development is much faster (2 to 3 weeks vs 2 to 3 months).", "kw": ["developmental timing"], "info": "", "concl": "This switch from slow pre-hatching to fast post-hatching development may reflect differences in how nutrients are used."}, {"type": "qa", "section": "African killifish - yolk utilization", "q": "What is unusual about epiboly and gastrulation in annual killifish?", "a": "Epiboly and gastrulation are interrupted by a phase in which epiblast cells disperse and migrate randomly over the yolk surface. After as long as several days, the cells reaggregate and form the three germ layers.", "kw": ["dispersion-reaggregation", "epiboly"], "info": "The YSL can be identified during epiboly, but its activity has not been studied in detail in this species.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk utilization", "q": "Is yolk used during diapause?", "a": "No visible yolk consumption occurs during diapause, even after 5 to 6 months. Starvation-related genes (IGF and lysosomal pathway genes) are upregulated, and heart contractions stop completely. Both development and rapid yolk consumption resume after diapause exit.", "kw": ["diapause", "IGF", "yolk consumption"], "info": "Yolk is consumed at the embryo-yolk interface, especially beneath the head near the heart tube. Embryos in delayed hatching are fully developed and need active circulation, so they must keep consuming yolk.", "concl": "Embryonic development, diapause and delayed hatching are three phases that use nutrition differently."}, {"type": "qa", "section": "Mexican tetra", "q": "How do the two Astyanax morphotypes differ in habitat and diet?", "a": "Surface fish live in rivers from southern Texas to central Mexico and eat a fairly even mix of plants and insects all year. Eyeless cavefish live in permanently dark limestone caves in northeastern Mexico and eat bat guano and material washed in by seasonal floods.", "kw": ["cavefish", "surface fish"], "info": "There are at least 32 geographically separate cave populations. Whole-genome sequencing suggests that at least some, such as Tinaja, Pachón and Molino, evolved independently from surface fish.", "concl": ""}, {"type": "qa", "section": "Mexican tetra", "q": "What resources make A. mexicanus a tractable model?", "a": "Surface and cave fish breed easily in the lab and are interfertile, so hybrids can be made by natural spawning or in vitro fertilization. The surface fish and Pachón genomes are sequenced and annotated, and whole-genome data from wild populations exist. Detailed transgenesis and gene editing methods are available.", "kw": ["hybrids", "QTL mapping", "genome"], "info": "Hybrids have been used to map morphological, physiological and behavioural traits. Cavefish genetic changes can be tested in zebrafish or surface fish. Staging tables and anatomical atlases are also available.", "concl": ""}, {"type": "qa", "section": "Mexican tetra", "q": "Why is A. mexicanus promising for nutrition research even though it has not been studied that way?", "a": "Many morph differences appear before feeding starts, including pigmentation loss, eye regression, expanded neurosensory structures, altered brain morphology, symmetry reversals and craniofacial changes. Cavefish embryos have more yolk with more carotenoids, and eye regression and brain morphology show a maternal effect in hybrids.", "kw": ["maternal effect", "carotenoids"], "info": "The maternal effect suggests that instructive components are deposited in the yolk.", "concl": "Linking cave traits to yolk composition could show how evolution has changed nutritional control of development as animals adapted to new diets."}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Does yolk composition differ between surface fish and Pachón cavefish?", "a": "The basic composition, as a percentage of dry mass, is the same: 21% fat, 61% protein and 9% ash. However, Pachón yolk is strikingly more yellow, which hints at a difference in nutrient content.", "kw": ["yolk composition", "Pachón"], "info": "", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Is the yellow yolk colour inherited maternally?", "a": "Yes, it depends on the mother. Cavefish female x surface male crosses give embryos with yellow yolk, while surface female x cavefish male crosses give clear yolk. The yellow colour may reflect more carotenoids from the diet.", "kw": ["reciprocal cross", "parent of origin"], "info": "The authors suggest these reciprocal crosses as a tool for studying how maternally provided yolk nutrients affect development. The Fig. 6 legend labels the surface fish panel as C, but it appears to be D.", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Why might Pachón cavefish make carotenoid-rich eggs?", "a": "In other fish, eggs exposed to limited oxygen have more carotenoids, for example salmon eggs that settle in mud. Dissolved oxygen in Pachón cave water is very low compared with surface rivers, so carotenoids may protect eggs in a low-oxygen environment.", "kw": ["carotenoids", "hypoxia"], "info": "Pachón adults show altered expression of genes for carotenoid absorption, cleavage and transport in the gut, and they accumulate carotenoids in visceral tissues. The protective role is a hypothesis.", "concl": "The difference in egg composition may start with nutrient assimilation in the mother."}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Is carotenoid accumulation just a consequence of eye loss?", "a": "No. Eyeless Molino cavefish neither have yellow eggs nor accumulate carotenoids in visceral tissues.", "kw": ["Molino", "eye loss"], "info": "", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Which cavefish traits could be linked to retinoid levels?", "a": "Eye degeneration is one: in zebrafish, reducing RA causes small eyes, and in Pachón the lens starts to undergo apoptosis around hatching (24 hpf). Heart laterality, visceral organ symmetry and hypothalamic neuron differentiation are others. All of these differ between Pachón and surface fish, show a maternal effect, and are linked to retinoids in other species.", "kw": ["retinoic acid", "lens apoptosis", "laterality"], "info": "Ma et al. (2018) found that F1 hybrids from Pachón females have more lens apoptosis, smaller eyes and smaller sclera than hybrids from surface females. Torres-Paz et al. (2019) found no difference in lens size or apoptosis but did find maternally controlled retina morphogenesis. A link to retinoids has never been tested directly.", "concl": "The authors propose comparing yolk retinoid levels between morphs, mapping where RA modulators are expressed, and manipulating RA signalling."}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "What is known about vitellogenins and maternal metabolism in A. mexicanus?", "a": "The vtg gene repertoire, the Vtg protein composition of the egg and details of oogenesis have not been described. The authors suggest comparing the sequences and expression of genes for Vtgs, Vtg receptors and Vtg proteases between morphs.", "kw": ["vtg", "liver transcriptome"], "info": "Existing lab and wild liver transcriptomes of both morphs could be used to study vtg expression. Cavefish have elevated blood sugar and triglyceride levels, which raises the question of how their embryos avoid harm from the unusual maternal metabolism.", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk utilization", "q": "How does the larger yolk of cavefish affect development?", "a": "Pachón eggs have about 15% more yolk, yet both morphs pass developmental milestones in sync, including YSL formation at around the 1000-cell stage, somitogenesis and early eye formation. At hatching (24.5 to 28 hpf), Pachón larvae are longer (3.00 mm vs 2.75 mm).", "kw": ["yolk volume", "body size"], "info": "Cavefish still have more yolk at hatching, and it decreases at the same rate in both morphs. External feeding starts at about 5 dpf, so cavefish can still draw on yolk when surface fish depend entirely on food. Yolk volume and its use have not been measured in Tinaja or Molino, and YSL activity has not been compared between populations. Methods to manipulate yolk volume exist (Torres-Paz and Retaux, 2020).", "concl": "Extra yolk may let cavefish survive longer without feeding and/or produce larger larvae that can eat bigger food, without changing tissue specification or patterning."}, {"type": "qa", "section": "Summary and future directions", "q": "What do the authors conclude about each of the three models?", "a": "Zebrafish offer Vtg mutants, yolk-transport mutants, a lipidome and easy transgenesis. Killifish offer multiple developmental trajectories, long embryogenesis, a short lifespan and high stress resistance. Cavefish offer natural variation in nutrient loading produced by adaptation to a nutrient-poor environment.", "kw": [], "info": "The authors note that cavefish research has so far been gene-centric and often overlooks diet. Cavefish traits such as excess fat, high blood sugar and altered vitamin A levels mirror nutritional problems that affect human fetal development.", "concl": "Using natural diversity across species is likely to give a more complete understanding of how nutrition controls embryonic development."}, {"type": "note", "section": "Mexican tetra - yolk composition", "text": "Do maternally supplied yolk carotenoids or retinoids explain the maternal effects on lens apoptosis, retina morphogenesis and laterality in Pachón? Comparing vtg genes and their promoter ERE landscape between morphs, and yolk retinoid levels between Pachón and Molino (eyeless but not yellow), would be a natural regulatory genomics angle."}, {"type": "note", "section": "African killifish - yolk composition", "text": "Which nutrient or chemical in eggs from very young killifish mothers lets more than 95% of embryos skip diapause, and did yolk composition co-evolve with diapause length?"}, {"type": "note", "section": "Mexican tetra - yolk utilization", "text": "Yolk volume, rate of yolk use and YSL activity have never been measured in Tinaja and Molino. Do independently evolved cave populations converge on larger, carotenoid-rich yolk?"}], "key": "drerio/Riddle_2021_DevBiol_fish_nutrition_embryo_development", "shared": "Damir · 2026", "preprint": "", "tags": [], "star": false, "source_note": ""}, {"id": "Neaverson_2025", "title": "Coordinating tissue development to build body and brain: Lessons from the gastrula organiser and its derivatives", "category": "Embryo development & nutrition", "link": "https://doi.org/10.1016/j.cdev.2025.204042", "note": "", "source_pdf": "papers/drerio/Neaverson_2025_CellsDev_gastrula_organiser.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "How has the Spemann-Mangold organiser mostly been studied, and what is still unknown?", "a": "It has been a central paradigm for over a century and was studied mainly through its ability to induce secondary axes in transplantation experiments. It is still unknown how the organiser and its derivatives act together to build a well-proportioned body axis.", "kw": ["Spemann-Mangold organiser", "secondary axis"], "info": "This is a review in a special issue for the Spemann-Mangold centenary (Cells & Development, Spemann-Mangold Issue Part II). It has no original data or methods section.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the scope of the review and how do the authors approach it?", "a": "They compare evidence from four vertebrate models (Xenopus, zebrafish, chick and mouse) to work out what the organiser is needed for at each stage of neural development and body axis formation. They focus mostly on experiments in which the organiser or its derivatives were removed.", "kw": ["organiser deletion", "comparative embryology"], "info": "The deletion experiments include surgical ablations, mutants and explants. The authors argue that these show the organiser's role in normal development better than graft assays do.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the consensus view the review presents?", "a": "Initial neural specification and anterior-posterior patterning happen before the morphological organiser forms. They are driven by planar signals from pre-organiser cells, plus species-specific contributions from extraembryonic tissues. Later, the anterior axial mesendoderm maintains anterior identity and tissue proportions, and the notochord patterns the dorsal-ventral axis and coordinates posterior elongation through mechanical coupling.", "kw": ["planar signals", "pre-organiser", "axial mesendoderm"], "info": "", "concl": "The pace of axial mesoderm extension is proposed as a key coordinator of proportional body axis development."}, {"type": "qa", "section": "Introduction", "q": "What did the original 1924 organiser experiment show?", "a": "Hilde Mangold grafted the dorsal blastopore lip of one newt embryo into another, and the host formed an ectopic secondary body axis. She used newt species with different pigmentation, so graft and host cells could be told apart. The graft became axial mesendoderm, and the secondary neural tube was induced from host tissue.", "kw": ["dorsal blastopore lip", "induction"], "info": "Spemann called the dorsal lip an 'organisation centre'. The view at the time was that the whole animal hemisphere was 'indifferent' and needed the organiser to tell it what to become.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Apart from induction, what else does the organiser graft reveal, and what is 'individuation'?", "a": "It shows that the organiser and the tissue responding to it can self-assemble a well-patterned, proportional body axis. Individuation (Waddington and Needham, 1936) is the idea that this needs long-term interactions between signalling and responding tissues.", "kw": ["individuation", "self-assembly"], "info": "Mechanical interactions are now known to work together with inductive signals in multi-tissue self-assembly, as described for the posterior body axis.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What key gap do the authors want to address?", "a": "How morphogenesis dynamics are coordinated across tissues: the rate of progenitor expansion and commitment, and how tissues change shape. Both must be matched between tissues to build proportional multi-tissue structures.", "kw": ["morphogenesis", "proportion"], "info": "The authors say this work could also help morphogenetic engineering of multicellular systems in vitro. They use three terms throughout: organiser precursor cells, the morphological organiser, and organiser derivatives (prechordal mesendoderm and notochord).", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "In zebrafish, when are the pre-organiser, organiser and organiser-derived stages (Table 1)?", "a": "Pre-organiser: blastula, about 3 hpf, when the mid-blastula transition and zygotic transcription begin. The shield (morphological organiser) forms at 50% epiboly, about 6 hpf. Prechordal mesendoderm and notochord emerge at 50-75% epiboly (about 6-8 hpf), and the notochord becomes a visible rod at about 90% epiboly.", "kw": ["shield", "gsc", "chordin"], "info": "The 'shield marker genes' are already expressed before the shield forms: gsc and chordin on the future dorsal side, and lim1 along the whole margin. This suggests organiser precursor cells are already present. Organiser cells sit in the superficial shield and also in deeper layers.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are the equivalent organiser stages in Xenopus, chick and mouse (Table 1)?", "a": "Xenopus: pre-organiser NF8-NF10 (about 5-9 hpf), with precursors in the BCNE centre; organiser at NF10 (about 9 hpf). Chick: pre-organiser EGK-X to HH3; central and posterior precursors meet at HH3+ to HH4 (about 15-19 h). Mouse: organiser cells in the EGO and then the MGO from E6.5; the node becomes morphologically visible only at E7.5.", "kw": ["BCNE", "Hensen's node", "EGO/MGO"], "info": "BCNE = blastula Chordin- and Noggin-expressing centre. In mouse, prechordal plate cells have already left by the time the node is visible, so the morphological-organiser stage and the derivative stage are hard to separate.", "concl": ""}, {"type": "qa", "section": "Early neural specification - planar signals", "q": "What is the organiser called in birds and mammals, and how do mouse node grafts differ?", "a": "It is Hensen's node (the node), at the tip of the primitive streak. Waddington showed this by grafting it from chick, duck or rabbit into chick hosts. A mouse node graft also induces a secondary axis, but the axis lacks the most anterior (forebrain) structures.", "kw": ["Hensen's node", "primitive streak"], "info": "", "concl": ""}, {"type": "qa", "section": "Early neural specification - planar signals", "q": "Why do the authors say the term 'neural induction' is often misused?", "a": "Induction means a change of fate, but in the normal embryo the responding cells are already fated to become neural plate. It has therefore been suggested that 'neural induction' should only describe graft assays, where the organiser is placed next to prospective non-neural tissue.", "kw": ["neural induction"], "info": "Many textbooks still say the organiser does neural induction in normal development, which mixes up what a graft can do with what the organiser does in situ. Supporting evidence: in chick, the earliest neural genes induced by a node graft are expressed before the node forms.", "concl": ""}, {"type": "qa", "section": "Early neural specification - planar signals", "q": "What is the difference between planar and vertical signals?", "a": "Planar signals come from the early gastrula organiser and spread through the plane of the ectoderm. Vertical signals come from mesoderm lying underneath the ectoderm after it has involuted.", "kw": ["planar signals", "vertical signals"], "info": "", "concl": "In every species reviewed, neural induction and AP patterning of brain regions happen early, through planar signals from the organiser."}, {"type": "qa", "section": "Early neural specification - Xenopus", "q": "What happens when the organiser is deleted in Xenopus?", "a": "The embryo is ventralised. It lacks head, trunk, tail, somites, kidney, nervous system and placodes, but still makes ventral tissues from all three germ layers, such as ciliated epidermis, red blood cells and posterior gut.", "kw": ["ventralisation", "organiser deletion"], "info": "Changing the amount of organiser tissue changes how far dorsal and anterior development extends. This supports a role for the organiser in patterning both the AP and DV axes.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Xenopus", "q": "How are head and trunk organiser functions separated in amphibians?", "a": "The anterior part of the organiser becomes prechordal plate and induces head structures. The posterior part becomes notochord and induces trunk and tail. Ablating prechordal mesendoderm precursors removes head structures, and removing notochord precursors removes trunk structures.", "kw": ["head organiser", "prechordal plate", "notochord"], "info": "Over time the organiser loses its ability to induce anterior structures, but keeps its tail-inducing ability for longer. The ectoderm receives AP instructions before any axial mesoderm involutes.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Xenopus", "q": "What do Keller explants and exogastrulae show about planar signalling?", "a": "In Keller explants, mesoderm and ectoderm lie side by side in one plane and are never stacked vertically. Extensive AP neural patterning still happens, even in a recombinate of dorsal mesoderm with ventral ectoderm. In exogastrulae, AP patterning reaches only the midbrain level: forebrain (eyes) and ventral neurons of the hindbrain and spinal cord do not form.", "kw": ["Keller explant", "exogastrula"], "info": "A recent transcriptomic study confirmed that AP neural patterning can happen without vertical signals.", "concl": "Planar organiser-derived signals are partially responsible for AP patterning."}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "When and how does the zebrafish shield form, and what can it do when grafted?", "a": "Epiboly starts at about 4 hpf, and gastrulation begins at about 5 hpf at 50% epiboly, when the germ ring forms. Convergence packs cells together on the dorsal side of the germ ring, where the shield forms at 50-60% epiboly. A full-thickness shield graft into the ventral germ ring gives a complete ectopic axis with all brain tissues.", "kw": ["shield", "germ ring", "epiboly"], "info": "The shield contains a mix of neurectodermal and chordamesodermal progenitors.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "What happened when the shield was removed microsurgically (Shih and Fraser)?", "a": "The embryos developed normal nervous systems with normal AP and DV patterning. They were shorter and wider than controls and arched dorsally. However, most still had notochord cells, mostly in the tail.", "kw": ["shield ablation", "chordin"], "info": "One possible explanation is that chordin is switched on before gastrulation and before the shield forms, so neural development may already be under way.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "What shows that neural induction and AP patterning start before the shield forms?", "a": "Removing the whole presumptive shield in late blastula embryos removed opl (zic1), an early forebrain marker. Dorsal ectoderm explants taken at early gastrula already had a latent AP pattern: anterior explants expressed opl, and posterior explants (closer to the shield) expressed less opl plus fkh5 (foxb1), a midbrain-to-spinal-cord gene.", "kw": ["opl/zic1", "fkh5/foxb1"], "info": "", "concl": "Neural commitment and AP patterni
