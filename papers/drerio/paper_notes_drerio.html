ng are already visible at early gastrula stage."}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "Why did different shield removal studies give different phenotypes?", "a": "Removing only the morphological shield leaves some gsc+ and noto+ cells. Removing the shield together with neighbouring marginal tissue (Saude et al.) caused complete loss of notochord and prechordal plate, major loss of floor plate and motor neurons, cyclopia and disrupted somite patterning. This resembles the bozozok (dharma) mutant, which loses axial mesoderm and forebrain and has a reduced midbrain.", "kw": ["bozozok", "dharma", "gsc"], "info": "The differences probably reflect how much tissue was removed. Saude et al. concluded that the deeper gsc+ cells matter most for anterior structures.", "concl": "The morphological shield is not the whole zebrafish organiser region."}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "Which signals other than the organiser can pattern the zebrafish neural AP axis?", "a": "Varga et al. found that organiser-deficient embryos make the full AP pattern as long as BMP signalling is blocked. Wnts from mesendodermal precursors at the lateral margin act as posteriorising signals: grafting these cells to the animal pole or the prospective forebrain gives ectopic hindbrain. Posterior spinal cord progenitors depend on FGF rather than on BMP antagonists.", "kw": ["BMP", "Wnt", "FGF"], "info": "Spinal cord progenitors are spread widely along the DV axis and lie far from the shield, so shield deletion is unlikely to affect posterior neural tissue.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "Why do Thisse and Thisse suggest the whole blastoderm margin is the zebrafish organiser?", "a": "A shield grafted to the animal pole of a blastula host only makes axial mesoderm and does not recruit or pattern host cells. The full ectopic axis seen after ventral margin grafts comes from reorganised Nodal/BMP gradients along the margin. A high BMP to Nodal ratio gives tail, a 1:1 ratio gives posterior head, and no BMP gives anterior fates.", "kw": ["Nodal/BMP ratio", "dorsal patterning centre"], "info": "They propose calling the shield the 'dorsal patterning centre'.", "concl": "The zebrafish organiser patterns the AP axis mainly by planar induction, not by vertical signals from derivatives after involution."}, {"type": "qa", "section": "Early neural specification - Chick", "q": "Which cell populations form Hensen's node, and what comes out of it?", "a": "Two populations: 'central' cells in the pre-streak epiblast, which have no specific markers, and 'posterior' cells from Koller's sickle, which express Chordin and Goosecoid. Only the posterior cells have some neural-inducing ability, and full ability appears when the two meet at mid-streak stage. The first cells to ingress through the node make definitive endoderm, then head process; later cells make notochord, medial half-somites and floor plate.", "kw": ["Koller's sickle", "Goosecoid", "Chordin"], "info": "", "concl": ""}, {"type": "qa", "section": "Early neural specification - Chick", "q": "Why is it hard to test whether the chick node is required?", "a": "The node regulates very strongly. Embryos look normal after the node is ablated, reversed or replaced with other tissue. When the node and the anterior 40% of the primitive streak were removed at HH3+, embryos restored all node marker expression except Goosecoid.", "kw": ["regulation", "node ablation"], "info": "When the node is ablated in older embryos, the head and notochord anterior to the regressing node form normally, but the wound does not close and somites form on both sides of the gap. Even after removing the whole streak, notochord forms on either side of the gap, possibly from regenerated node tissue.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Chick", "q": "What starts neural development in chick, if not the node?", "a": "When the egg is laid, before gastrulation, the epiblast is already in a primed 'pre-neural' state, induced by FGF signals from the hypoblast. Explants of medial pre-streak epiblast cultured alone become committed neural tissue without added growth factors. AP patterning into forebrain, midbrain, hindbrain and spinal cord may be complete by HH4.", "kw": ["hypoblast", "FGF", "pre-neural state"], "info": "Paraxial mesoderm has a caudalising effect and gives midbrain and hindbrain identity to tissue that would otherwise become forebrain. The node and paraxial mesoderm probably work together, and the head process later refines the pattern. Caveat: the explant assays need serum containing growth factors and are not equivalent to removing the organiser.", "concl": "It has not yet been possible to fully assess whether the chick organiser is required."}, {"type": "qa", "section": "Early neural specification - Mouse", "q": "Why do mouse node grafts lack anterior structures, and which grafts do induce them?", "a": "The node only becomes visible at late gastrula, and by then prechordal and head process mesendoderm have already left it (equivalent to chick HH4+ to 5). An EGO graft induces neural tissue only up to the hindbrain. A combined graft of EGO, AVE and anterior epiblast induces anterior neural tissue.", "kw": ["EGO", "AVE", "MGO"], "info": "Node-derived cells mostly form trunk notochord from hindbrain level backwards, while anterior axial mesendoderm comes mainly from the EGO and MGO. The MGO has been claimed to have full ability, but grafts only show induction of forebrain and midbrain genes.", "concl": "Full organiser ability in mouse may need several tissues acting together."}, {"type": "qa", "section": "Early neural specification - Mouse", "q": "What did FOXA2 (HNF-3beta) mutant mice reveal about node requirement?", "a": "FOXA2-/- embryos form no node and no notochord but still make neural tissue. Half of them weakly expressed Otx2 in forebrain and midbrain, and the other half had no Otx2. Those with Otx2 tended to express Engrailed and, weakly, Hoxb1, but anterior head structures were abnormal in all embryos.", "kw": ["FOXA2", "Otx2", "AVE"], "info": "Caveat: FOXA2 is also needed in the AVE (for Wnt antagonists and Otx2) and is expressed in prechordal mesendoderm, so the defect cannot be pinned on one tissue. A conditional knockout restricted to embryonic tissues showed that the AVE alone cannot maintain anterior neural character.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Mouse", "q": "Is early BMP antagonism needed for mouse neural development?", "a": "Yes, probably. Chordin;Noggin double mutants lose anterior notochord and forebrain. FOXA2 mutants lack Chordin and Noggin at gastrula stage but still express Chordin earlier in the anterior streak. Mutations that block formation of the primitive streak and EGO/MGO give no neural tissue at all.", "kw": ["Chordin", "Noggin", "BMP antagonism"], "info": "Surgical node ablation at late gastrula still gave an intact neural tube with Otx2 anterior and Hoxb1 posterior, and unlike in chick the node does not regenerate. By that stage the neural plate is probably already committed.", "concl": "AP neural specification starts before the node forms, through EGO/MGO planar signals and vertical signals from the AVE. The node then patterns tissue posterior to the hindbrain."}, {"type": "qa", "section": "Early neural specification - Summary", "q": "What is the consensus from Section 2 across species?", "a": "In all four species, neural development starts before the morphological organiser forms. It uses signals from an early pre-organiser structure, plus extraembryonic endoderm in chick (hypoblast) and mouse (AVE). The pre-organiser starts AP patterning through planar signals in the ectoderm, and the morphological organiser continues it.", "kw": ["pre-organiser", "extraembryonic endoderm"], "info": "", "concl": "The full range of AP neural tissues can only develop through coordination of several tissues."}, {"type": "qa", "section": "Organiser derivatives - neural maintenance", "q": "In what order are axial mesendoderm tissues internalised?", "a": "In all four species the order is broadly the same: prechordal mesendoderm precursors first, then anterior notochord (head process), then trunk notochord.", "kw": ["prechordal mesendoderm", "head process"], "info": "The posterior notochord forms differently, from NMPs in the tailbud, and is outside the scope of the review.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Xenopus", "q": "How does Xenopus axial mesendoderm form, and which markers define each part?", "a": "The first cells to involute are leading edge mesendoderm (xhesx1), which forms anterior endoderm. Next come prechordal mesendoderm (xgsc) and then notochord progenitors (xtbxt). The PME migrates collectively in a fan shape under the anterior neural plate, and notochord cells converge and extend to form a rod.", "kw": ["xhesx1", "xgsc", "xtbxt"], "info": "The tail notochord forms after involution ends, by further mediolateral intercalation. PME and head process keep expressing the BMP and Wnt antagonists first made in the organiser.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Xenopus", "q": "Which experiments separate PME function from the earlier organiser in Xenopus?", "a": "Disrupting cholesterol-rich membrane microdomains (Reis et al.) altered PME cell shape and shh and goosecoid expression without affecting the earlier organiser. It caused severe head loss, which was partly rescued by injecting the Wnt antagonist Dkk-1. Surgical PME ablation caused cyclopia, with one large Pax6+ eye field, but did not change AP patterning.", "kw": ["Dkk-1", "cyclopia", "Pax6"], "info": "Nodal inhibition and early organiser ablations cannot separate the PME from its precursors. Overexpressing Wnt inhibitors (Frzb1, Dkk-1) expands anterior neural tissue, while overactive Wnt posteriorises it.", "concl": "The PME probably keeps signalling to maintain anterior fate that is already specified, and may ensure correct forebrain proportions."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "How do zebrafish shield cells give rise to prechordal plate and notochord?", "a": "Deep gsc+ shield cells make prechordal mesendoderm, and more superficial noto-expressing cells make notochord. Prechordal plate cells ingress first and migrate towards the animal pole as a collective, between the ectoderm and the yolk syncytial layer.", "kw": ["gsc", "noto", "collective migration"], "info": "The motility and directionality are intrinsic and do not depend on external cues, but only the collective has them; isolated prechordal plate cells do not. Prechordal plate and head process keep expressing shield genes, including gsc, chordin and dkk1.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "What do Nodal pathway mutants lacking a prechordal plate show about forebrain development?", "a": "oep (tdgf1) mutants have smaller anterior neural structures but normal AP neural patterning. squint;cyclops double mutants lack most mesoderm, including prechordal plate and notochord, yet AP patterning is mostly normal. The smaller forebrain in oep is due to missing Dkk1, which the prechordal plate normally secretes.", "kw": ["oep", "squint/cyclops", "Dkk1"], "info": "squint and cyclops are secreted Nodal-related ligands, and oep is an essential cofactor of the pathway. Overexpressing Dkk1 expands forebrain at the expense of midbrain, and transplanting Dkk1-expressing cells rescues the oep forebrain.", "concl": "Prechordal plate signals do not set AP pattern, but they matter for brain regions reaching the right size."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "How long does Wnt antagonism need to last for normal forebrain development in zebrafish?", "a": "Until at least mid-somitogenesis. A heat-inducible dominant-negative Frizzled-8a rescued the oep forebrain defects even when induced at 16 hpf.", "kw": ["Frizzled-8a", "Wnt antagonism"], "info": "Study by Kim et al. (2009).", "concl": "Continuous Wnt antagonism is important for forebrain development."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "What DV defects follow loss of the prechordal plate in zebrafish?", "a": "Cyclopia, because prechordal plate signals split the eye field in two, and complete loss of ventral forebrain regions such as the hypothalamus, as well as loss of the floor plate. Ethanol, which impairs prechordal plate migration, also causes cyclopia.", "kw": ["cyclopia", "hypothalamus", "floor plate"], "info": "Correct positioning of the prechordal plate is therefore important.", "concl": "Without a prechordal plate, DV patterning is far more affected than AP patterning."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "How might the speed of mesendoderm migration affect brain proportions?", "a": "Dkk1 morphants internalise and migrate axial mesendoderm faster. Dkk1 overexpression slows migration and shifts the anterior limit of the neural plate caudally. Friction between prechordal plate and neurectoderm also affects where the brain forms.", "kw": ["Dkk1", "friction", "migration speed"], "info": "Dkk1 may control how fast mesendoderm advances, so that the overlying neural plate gets the right signals at the right time.", "concl": "The timing, speed and possibly direction of prechordal plate migration may set the final positions and proportions of brain regions."}, {"type": "qa", "section": "Organiser derivatives - Chick", "q": "Can chick head process and prechordal plate still pattern the brain after HH4?", "a": "Partly. At HH5, young head process grafts induce organised ectopic forebrain and midbrain. By HH6, prechordal plate and head process have separated, and grafts induce only forebrain or only midbrain, respectively.", "kw": ["head process", "prechordal plate", "goosecoid"], "info": "Cells leave the node from late HH4 to form goosecoid+ prechordal plate and head process. The notochord forms as the node regresses from about HH6. Brain AP regionalisation is considered complete by HH4.", "concl": "This fits a maintenance role through continued vertical induction."}, {"type": "qa", "section": "Organiser derivatives - Chick", "q": "What is the 'conveyor belt' movement and why does it matter?", "a": "As the neural tube develops, it moves anteriorly over the head process like a conveyor belt, so each part of the head process touches the overlying neural tissue only briefly. This explains why anterior head process grafts induce midbrain and hindbrain in competent epiblast but cannot change the forebrain fate of the tissue above them at HH6-7.", "kw": ["conveyor belt", "head process"], "info": "Posterior neural plate explants at HH6-7 express hindbrain and spinal cord genes, but combined with posterior head process they express only spinal cord markers. The proposed reason is that the head process represses neural genes from levels anterior to its own.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Chick", "q": "Does anterior mesendoderm change neural fate or neural tissue morphogenesis?", "a": "Grafts of anterior mesendoderm into the epiblast marginal zone gathered host neural cells on top of the graft, and these formed a secondary regionalised brain. The type of brain tissue depended on where the graft sat along the host AP axis.", "kw": ["convergence", "neural tube morphogenesis"], "info": "The chick neural tube elongates by contraction-based convergent extension: actomyosin builds up along the mediolateral axis, junctions shrink, and cells converge to the midline.", "concl": "Anterior mesendoderm can promote neural convergence without changing neural fate."}, {"type": "qa", "section": "Organiser derivatives - Mouse", "q": "Which mouse organiser regions form which axial tissues, and what happens without anterior axial mesendoderm?", "a": "The EGO forms prechordal plate and anterior notochord, the node forms trunk notochord, and the MGO contributes to both. Mutants lacking anterior axial mesendoderm have anterior truncations. Gdf1-/- Nodal+/- embryos have major forebrain defects, and in Hex1 mutants the mesendoderm forms but does not migrate properly, so the forebrain cannot maintain itself.", "kw": ["Gdf1", "Hex1", "anterior truncation"], "info": "Chordin-/- Noggin-/+ embryos also fail to maintain forebrain. Loss of prechordal mesendoderm causes DV defects: expanded dorsal markers, reduced hypothalamic genes and sometimes cyclopia.", "concl": "In normal mouse development, anterior axial mesendoderm maintains AP pattern rather than inducing it."}, {"type": "qa", "section": "Organiser derivatives - Summary", "q": "What is the consensus role of early organiser derivatives in brain development?", "a": "They maintain and refine AP neural patterning that planar organiser signals have already set up before gastrulation. They probably also regulate progenitor renewal and differentiation, helping set the right size of brain territories.", "kw": ["maintenance", "brain size"], "info": "How this is coordinated with continued development of the posterior body is largely unknown.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body", "q": "How does the notochord act as an organiser of the posterior body?", "a": "It secretes Shh, forming a gradient that patterns the neural tube DV axis in all vertebrates. It induces the floor plate through close contact, and the floor plate then also secretes Shh. It does not seem to affect AP patterning, but it does affect physical elongation of the AP axis.", "kw": ["Shh", "floor plate", "axis elongation"], "info": "Force for elongation is thought to come mostly from paraxial mesoderm and neural tube, but this varies between species. In anamniotes, notochord vacuolation provides hydraulic force for extension and straightening. Vacuole function is understudied in chick and mouse, so the review does not cover it there.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Xenopus", "q": "What are the neural defects in notochordless Xenopus embryos?", "a": "UV irradiation of eggs reduces mesoderm in a dose-dependent way. Embryos lacking only the notochord have spinal cord defects, cyclopia, no floor plate cells and an altered balance of dorsal and ventral neuron types. They also have no dopaminergic neurons in the ventral spinal cord, and left-right laterality is disrupted, with some axons projecting the wrong way.", "kw": ["UV irradiation", "dopaminergic neurons", "laterality"], "info": "Disrupting notochord-neural tube contact later did not stop dopaminergic neuron induction but reduced their number, so these neurons are probably induced by notochord precursors during gastrulation.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Xenopus", "q": "Does the Xenopus notochord generate force for axis elongation?", "a": "Not during convergent extension. In agarose force-sensor assays, dorsal explants without notochord produced about as much force as explants with it, and more paraxial mesoderm gave more stress. Yet notochordless embryos were on average 25% shorter than controls, probably because notochord vacuolation drives later elongation.", "kw": ["force sensor", "vacuolation", "dystroglycan"], "info": "Neural explants elongated at the same rate as full dorsal explants. From early tailbud stages, vacuoles swell osmotically. Dystroglycan mutations disrupt notochord extension and vacuolation and affect body length and straightness.", "concl": "Paraxial mesoderm and neural tissue drive early elongation, and later elongation depends on the notochord."}, {"type": "qa", "section": "Notochord and posterior body - Zebrafish", "q": "What do zebrafish notochordless mutants show about DV and AP neural patterning?", "a": "Mutants lacking a notochord include flh (noto), mom (momo), doc and ntl (tbxta). Unlike in frog, a ventral floor plate still forms, but it is truncated and made of patches of cells in the trunk. AP neural patterning is largely unaffected.", "kw": ["flh/noto", "ntl/tbxta", "floor plate"], "info": "Floor-plate-inducing Shh is still present in the midline of ntl and flh gastrulae, but its source without a notochord is unclear. Brief Shh exposure may be enough to specify primary motor neurons, while secondary motor neurons need longer exposure.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Zebrafish", "q": "How does midline and mesoderm loss affect somite and neural morphogenesis in zebrafish?", "a": "Notochordless mutants lack tail structures. After shield removal, somites fused across the midline and were rectangular instead of chevron-shaped. Neural tube morphogenesis is normal in midline mutants, but maternal-zygotic oep mutants, which lack all mesoderm, show slower, disoriented convergent extension and disorganised neural tissue.", "kw": ["MZoep", "convergent extension", "silberblick/Wnt11"], "info": "Friction between somitic mesoderm and neighbouring tissues helps shape somites. In silberblick (Wnt11) mutants, paraxial mesoderm convergent extension is disrupted, which affects axial extension and causes cyclopia.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Zebrafish", "q": "What role does notochord vacuolation play in zebrafish axis elongation?", "a": "Vacuolation starts at early tailbud, just after convergent extension ends. Disrupting vacuolated cells gives shorter embryos with wavy spines, and doc mutant notochords do not vacuolate and have shorter axes. Somite elongation after tailbud stage is coordinated with the expansion of vacuolated notochord cells.", "kw": ["notochord vacuoles", "doc"], "info": "Fig. 2A, about 22-somite stage: expanding anterior notochord cells push against the unexpanded posterior notochord. The resulting stress passes to neighbouring somites, which stretch along the AP axis.", "concl": "The authors hypothesise that notochord development acts as a timer that matches the elongation rate of paraxial mesoderm and spinal cord."}, {"type": "qa", "section": "Notochord and posterior body - Chick", "q": "What did chick node ablations show about the cranial notochord?", "a": "The chick notochord grows mainly by adding cells at its caudal end. Embryos that failed to regenerate cranial notochord still had normal head morphology with En2 expression. However, many showed an 'inverted head' phenotype, with two half En2+ neural tubes that still expressed En2 at the right position.", "kw": ["En2", "cranial notochord", "inverted head"], "info": "The paper gives '85% compared to 20% displaying good or fair morphology'; how these percentages compare is not clearly stated. Embryos lacking cranial notochord also lack floor plate and show ventral expansion of En2. Excising node subregions disrupts DV patterning only at AP levels missing midline tissue.", "concl": "AP patterning is unaffected without cranial notochord, but the midline may give structural integrity to neural tube morphogenesis."}, {"type": "qa", "section": "Notochord and posterior body - Chick", "q": "How are axial and paraxial tissues mechanically coupled in the chick tail bud?", "a": "Presomitic mesoderm (PSM) squeezes the axial tissues from both sides, which promotes their elongation. The axial tissues then push on the tail bud progenitor domain, moving PSM progenitors out laterally and creating a positive feedback loop. The loop starts from a random cell motility gradient in the PSM, driven by FGF that is highest posteriorly.", "kw": ["presomitic mesoderm", "mechanical coupling", "FGF"], "info": "Deleting the axial region has a much weaker effect on elongation speed than deleting posterior PSM. Proliferation of cells after they enter the PSM is needed for timely elongation, and FGF-triggered extracellular hyaluronic acid drives PSM volume growth.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Chick", "q": "Which notochord and node regions matter most for chick axis elongation and posterior survival?", "a": "Removing posterior notochord or the tail bud progenitor domain slows elongation, but removing anterior notochord does not. Removing posterior notochord together with posterior neural tube slows it further. Removing the posterior subregion of the node causes abrupt axial truncation and widespread apoptosis in the posterior body, which a graft of SHH-producing cells can rescue.", "kw": ["SHH", "apoptosis", "axial truncation"], "info": "The chick neural tube can elongate without axial mesoderm, which suggests each tissue can elongate on its own to some extent.", "concl": "Axial and paraxial tissues act together in chick elongation, and the notochord may promote posterior survival and keep all tissues at the same pace."}, {"type": "qa", "section": "Notochord and posterior body - Mouse", "q": "What happens to the body axis in mice lacking a notochord?", "a": "FOXA2-/- embryos have severely disrupted neural tube DV polarity, probably because ventral SHH is missing, and node-ablated embryos have no floor plate. AP order of genes is often normal. The axis is much shorter, ablated embryos tend to have fewer somites, and sometimes the neural tube fails to elongate at all.", "kw": ["FOXA2", "notochordal plate", "SHH"], "info": "The mouse notochord first forms as an epithelial notochordal plate on the endoderm surface. It elongates by convergent extension, then sinks inwards and rounds up into a rod.", "concl": "This fits the chick model in which notochord elongation coordinates the other tissues, but this has not been tested much in mouse."}, {"type": "qa", "section": "Conclusions and perspectives", "q": "What are the authors' overall conclusions about the organiser's role in normal development?", "a": "Organiser precursor cells, together with early extraembryonic endoderm (hypoblast in chick, AVE in mouse), start neural development and set up AP pattern by planar signals before axial mesendoderm lies under the neural tissue. Anterior axial mesendoderm has a relatively minor role in maintaining or refining AP pattern. However, loss of the prechordal plate or its Wnt antagonists consistently reduces forebrain size.", "kw": ["planar signals", "forebrain expansion"], "info": "Graft-based neural induction, the most studied aspect, does not reflect what the organiser does in normal development. Continued signalling may also make patterning robust during neural plate convergent extension.", "concl": "The authors propose that the embryo uses the pace of axial mesoderm extension to coordinate the extension of other tissues and so produce a proportional body axis."}, {"type": "qa", "section": "Conclusions and perspectives", "q": "Why does this matter for organoid and gastruloid engineering?", "a": "Gastruloids express many early embryonic markers but lack embryo-like morphology. Simply embedding them in matrigel can produce trunk-like structures and well-patterned somites, which shows that mechanical forces and tissue-ECM interactions matter.", "kw": ["gastruloids", "matrigel", "mechanotransduction"], "info": "Limitation: little is known about how forces act at the multi-tissue level, because this requires understanding development from the whole organism down to gene regulation.", "concl": "A multi-scale understanding of how organiser derivatives tune multi-tissue forces is needed to engineer organoids."}, {"type": "note", "section": "Organiser derivatives - Summary", "text": "How is the size of anterior brain territories, set by organiser derivatives, coordinated with continued development of the posterior body? The authors say this is largely unknown."}, {"type": "note", "section": "Notochord and posterior body - Zebrafish", "text": "Which tissue makes the floor-plate-inducing Shh in the midline of ntl and flh notochordless zebrafish gastrulae? The paper says the source is unclear."}, {"type": "note", "section": "Notochord and posterior body - Mouse", "text": "Does the chick tail bud mechanical-coupling model, where notochord pace coordinates PSM and neural tube elongation, apply to mouse and other vertebrates? Also worth checking the zebrafish notochord-as-timer hypothesis."}], "key": "drerio/Neaverson_2025_CellsDev_gastrula_organiser", "shared": "Damir · 2026", "preprint": "", "tags": [], "star": false, "source_note": ""}, {"id": "Li_2026", "title": "Transcriptomic profiling reveals tetrabromobisphenol A-induced dysregulation of hepatic lipid homeostasis in common carp (Cyprinus carpio).", "category": "Toxicology & exposures", "link": "https://doi.org/10.1016/j.cbpc.2025.110336", "note": "", "source_pdf": "papers/drerio/Li_2026_CBPC_TBBPA_carp_hepatic_lipids.txt", "items": [{"type": "qa", "section": "Abstract", "q": "What is TBBPA and why is it a concern?", "a": "TBBPA (tetrabromobisphenol A) is a brominated flame retardant found almost everywhere in the environment. It is an ecological risk because it can bioaccumulate and is toxic.", "kw": ["TBBPA", "brominated flame retardant"], "info": "These notes are based only on the abstract and metadata. The full text was not available.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What gap does this study address?", "a": "Earlier work mostly used untargeted metabolomics and lipidomics to describe how TBBPA changes metabolic end products. There is little data on the mechanisms by which TBBPA disrupts lipid metabolism in aquatic organisms.", "kw": ["lipid metabolism", "metabolomics", "lipidomics"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What organism and exposure design did they use?", "a": "They used common carp (Cyprinus carpio). The fish were exposed for 14 days to TBBPA at 0, 0.005, 0.05 and 0.5 mg/L, which the authors describe as environmentally relevant concentrations.", "kw": ["Cyprinus carpio", "dose-response"], "info": "The abstract does not give sample sizes, the exposure route or which tissues were sequenced beyond liver and serum.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which approaches did they combine?", "a": "They combined serum biochemistry, histochemistry of the liver (Oil Red O staining) and transcriptomic profiling to study dose-dependent effects on lipid metabolism.", "kw": ["transcriptomics", "Oil Red O"], "info": "The abstract gives no sequencing platform, software or analysis parameters.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did serum biochemistry show after TBBPA exposure?", "a": "There was dose-dependent hyperlipidemia, with higher TG and T-CHO. SOD and CAT activities went down and MDA went up.", "kw": ["hyperlipidemia", "oxidative stress"], "info": "The abstract does not spell out these abbreviations and does not give exact values or fold changes. The SOD, CAT and MDA results match the paper's keyword 'oxidative stress'.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did liver histology and hepatic lipid content show?", "a": "Oil Red O staining showed lipid droplets building up in the liver. Even so, TG and T-CHO content inside the liver did not change significantly (P > 0.05). The 0.5 mg/L group had the most severe histopathology.", "kw": ["Oil Red O", "lipid droplets", "liver"], "info": "Lipid droplets accumulated even though bulk hepatic TG and T-CHO did not change. The abstract does not explain this mismatch.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which pathways did the transcriptomics point to?", "a": "The AMPK and PPAR signaling pathways came out as the key regulators of TBBPA-induced metabolic dysregulation.", "kw": ["AMPK", "PPAR"], "info": "The abstract gives no numbers of differentially expressed genes and no thresholds.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What happened at the low dose (0.05 mg/L)?", "a": "Lipid accumulation set off a compensatory activation of the AMPK/PPAR-alpha/CPT1 axis. This boosted fatty acid beta-oxidation and partly offset lipid deposition.", "kw": ["AMPK", "PPAR-alpha", "CPT1"], "info": "The abstract calls 0.05 mg/L 'low-dose' even though 0.005 mg/L was the lowest concentration tested. It does not report results for the 0.005 mg/L group.", "concl": "Low-dose TBBPA triggers an adaptive increase in beta-oxidation."}, {"type": "qa", "section": "Abstract", "q": "What happened at the high dose (0.5 mg/L)?", "a": "Genes for lipid synthesis, transport and storage were upregulated together. This disrupted lipid metabolism and led to pathological lipid deposition.", "kw": ["lipid synthesis", "lipid storage"], "info": "The abstract does not name the specific genes.", "concl": "High-dose TBBPA overwhelms compensation and drives pathological hepatic lipid deposition."}, {"type": "qa", "section": "Abstract", "q": "What is the authors' overall conclusion?", "a": "TBBPA disrupts hepatic lipid homeostasis in carp in a dose-dependent way. The study sheds light on the molecular cascades behind TBBPA-induced metabolic dysregulation in aquatic species.", "kw": ["lipid homeostasis", "dose-dependent"], "info": "", "concl": "Response switches with dose: compensatory AMPK/PPAR-alpha/CPT1 beta-oxidation at low dose, and coordinated lipogenic, transport and storage gene upregulation at high dose."}, {"type": "note", "section": "Abstract", "text": "Why did Oil Red O show lipid droplet accumulation when intrahepatic TG and T-CHO did not change significantly? Check the full text for how lipids were measured and for statistical power."}, {"type": "note", "section": "Abstract", "text": "What happened in the 0.005 mg/L group, and were the AMPK/PPAR-alpha/CPT1 changes confirmed at the protein level or only seen in the transcriptome?"}], "key": "drerio/Li_2026_CBPC_TBBPA_carp_hepatic_lipids", "shared": "Damir · 2026", "preprint": "", "tags": [], "star": false, "source_note": "Not the full paper: no access to the full text, so these notes are based only on the publicly available abstract and metadata (PubMed). Details from the main text and figures are missing."}, {"id": "JimenezGonzalez_2023", "title": "Zebrafish regulatory genomic resources for disease modelling and regeneration", "category": "Genomic resources", "link": "https://doi.org/10.1242/dmm.050280", "note": "", "source_pdf": "papers/drerio/JimenezGonzalez_2023_DMM_zebrafish_regulatory_genomic_resources.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is this paper?", "a": "A Special Article (review/perspective) in Disease Models & Mechanisms discussing recent developments in generating functional annotation maps for regulatory elements of the zebrafish genome and how they can be applied to human disease.", "kw": ["review", "zebrafish", "regulatory genomics"], "info": "Not a primary data paper, so there are no new experiments or datasets of their own.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Why is zebrafish a popular disease model?", "a": "Fast development, easy genetic manipulation, simplicity for imaging, and sharing conserved disease-associated genes and pathways with humans.", "kw": ["disease modelling"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What gap do the authors address?", "a": "Disease studies increasingly focus on non-coding mutations, which require genome annotation maps of regulatory elements such as enhancers and promoters, and zebrafish lacked a centralised annotation comparable to human resources.", "kw": ["non-coding mutations"], "info": "", "concl": "Expanding zebrafish regulatory genomic resources is needed to interpret non-coding disease variants."}, {"type": "qa", "section": "Abstract", "q": "What two data types do the authors argue must be integrated?", "a": "Multiomic bulk sequencing data, which gives chromatin characterisation, and fast-expanding single-cell methods such as single-cell ATAC-seq, which give cell-type resolution.", "kw": ["scATAC-seq", "multiomics"], "info": "They also call for standardised genomics protocols, bioinformatic pipelines, and new analysis and visualisation tools.", "concl": "Integration tools combining bulk multiomics with single-cell resolution are essential."}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "How widely is zebrafish used?", "a": "It is a vertebrate model used by nearly 1000 laboratories worldwide.", "kw": [], "info": "Most human disease-associated genes have at least one zebrafish orthologue.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "Where do many disease-associated variants fall, according to GWAS?", "a": "A large proportion of disease-associated gene variants occur in non-coding regions that include cis-regulatory elements such as promoters and enhancers.", "kw": ["GWAS", "CRE"], "info": "Their mechanisms and role in disease are still mostly unknown and require extensive functional annotation.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What is the NEUROD1 example of an enhancer mutation?", "a": "NEUROD1, a transcription factor associated with diabetes, binds less efficiently to a variant enhancer sequence in pancreatic islets, reducing enhancer activity and increasing susceptibility to type 2 diabetes in East Asian populations.", "kw": ["NEUROD1", "type 2 diabetes"], "info": "Example of a non-coding variant acting through altered TF binding.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "How can variants act through chromatin looping?", "a": "In Alzheimer's disease, SNPs disrupt CTCF binding sites, a key factor in chromatin loop formation, leading to misexpression of the disease-associated genes GATS (CASTOR3P) and PILRB.", "kw": ["CTCF", "enhancer looping"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What other two ways can non-coding variation cause disease?", "a": "Variants can create new promoters, as for the variant upstream of the globin genes in alpha-thalassemia patients, and larger chromosomal rearrangements can misplace enhancers and deregulate non-target genes, as seen in neuroblastomas.", "kw": ["alpha-thalassemia", "neuroblastoma"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "Why are zebrafish embryos good for testing human non-coding elements?", "a": "Ease of transgenesis and evolutionarily conserved cis-regulatory logic during development allow in vivo reporter assays to detect the effects of human-disease-associated non-coding elements.", "kw": ["reporter assay", "transgenesis"], "info": "These assays rely on extreme sequence conservation of candidate elements, which is enriched near developmental regulator genes often associated with disease.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What did the gata2a enhancer deletion show?", "a": "Deletion of a highly conserved zebrafish gata2a enhancer mimics the dysregulated haematopoiesis characteristic of human GATA2 deficiency.", "kw": ["gata2a", "GATA2 deficiency"], "info": "Combined with single-cell RNA-seq and single-cell ATAC-seq, this showed that lack of gata2a favours the erythroid lineage by reducing accessibility of certain TFs in myeloid cells.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What can be done when sequence conservation is too low to find homologous enhancers?", "a": "Conserved transcription factor binding sites may still predict shared function; transgenic manipulation of enhancers with conserved TF binding site combinations pinpointed a shared mechanism for pancreatic hypoplasia.", "kw": ["TF binding sites", "pancreatic hypoplasia"], "info": "A dual fluorescence reporter system can simultaneously report the effect of a SNP alongside a common variant in conserved enhancers.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "Which organs can zebrafish regenerate that humans cannot?", "a": "Zebrafish can completely regenerate spinal cord, brain, heart, kidney and fins, whereas humans readily regenerate only skin, liver and fingertips, not whole limbs or full organs.", "kw": ["regeneration"], "info": "Regenerative mechanisms differ between organs but often include reactivation of developmental pathways.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What are regeneration-responsive enhancers?", "a": "Enhancers likely to mediate regeneration programmes; they have been described in heart, fin, retina and inner ear hair cells of zebrafish.", "kw": ["regeneration enhancers"], "info": "The long-term promise is inducing gene reactivation in human organs for regenerative therapies.", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "Why do transgenic gain-of-function models need annotated CREs?", "a": "Spatio-temporally controlled transgenic gain-of-function models require annotated, functionally validated cis-regulatory elements to drive expression in the right cells at the right time.", "kw": ["CRE", "transgenesis"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "How do loss-of-function approaches benefit from CRE annotation?", "a": "Tissue-specific knockout with Cre/lox or cell-type-specific transgenic expression of Cas9 and guide RNAs avoids early embryonic lethality, reduces pleiotropy, and models tissue- and time-specific gene regulation in disease.", "kw": ["Cre/lox", "Cas9"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "Why does dCas9 knockdown depend on promoter annotation?", "a": "Targeting nuclease-deficient Cas9 to promoters, or deleting promoters, requires precise annotation of transcription start sites for efficient inhibition of gene expression.", "kw": ["dCas9", "TSS"], "info": "dCas9 offers an alternative to genetic lesions and morpholino knockdown.", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "What is the position effect and why does it matter for transgenesis?", "a": "The chromatin environment where a transgene lands influences how efficiently it is expressed; this matters because transposon-mediated transgenesis predominantly occurs in active genomic regions.", "kw": ["position effect"], "info": "To avoid it, safe harbour landing sites should be identified and targeted by site-specific recombination.", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "Which maps help find safe harbour landing sites?", "a": "Maps of accessible chromatin and chromatin interaction topology, including zebrafish Hi-C interaction maps and interaction boundaries informed by CTCF- and Cohesin-binding sites.", "kw": ["Hi-C", "safe harbour"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 1 - Glossary", "q": "What are COPEs and DOPEs?", "a": "A constitutive orphan predicted element (COPE) is open throughout development but lacks an active chromatin mark at any stage; a dynamic orphan predicted element (DOPE) is open at some point in development but also lacks an active chromatin mark at any stage.", "kw": ["COPE", "DOPE"], "info": "Both are ATAC-seq signal without observable CRE-associated chromatin marks; they have dedicated DANIO-CODE tracks.", "concl": ""}, {"type": "qa", "section": "Box 1 - Glossary", "q": "What are PADREs?", "a": "Predicted ATAC-seq-supported developmental regulatory elements: regulatory elements defined with ATAC-seq chromatin accessibility data whose function is determined from integration of key histone modification ChIP-seq data and predicted by ChromHMM.", "kw": ["PADRE", "ChromHMM"], "info": "", "concl": "PADREs are the core regulatory element annotation of DANIO-CODE."}, {"type": "qa", "section": "Box 1 - Glossary", "q": "Syntenic anchors versus synteny?", "a": "Syntenic anchors are conserved non-repetitive sequences in two genomes showing a high degree of similarity; synteny refers to blocks of such anchors appearing in the same order on a chromosome between organisms.", "kw": ["synteny", "syntenic anchors"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 1 - Glossary", "q": "What is nf-core?", "a": "A community-created resource for developing pipelines following standardised guidelines under the Nextflow system, allowing reproducibility between analyses using the same tools and versions.", "kw": ["nf-core", "Nextflow"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "What does CAGE-seq do?", "a": "CAGE-seq sequences specifically the 5' end of capped RNA, allowing accurate recognition of transcription start sites and analysis of the transcriptome.", "kw": ["CAGE-seq", "TSS"], "info": "TSS positions should be used for the identification of promoters.", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "How are eRNAs recognised?", "a": "Enhancer RNAs are long non-coding RNAs transcribed from active enhancers, detectable by CAGE-seq signal; most are transcribed bidirectionally from both DNA strands.", "kw": ["eRNA"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "What does ATAC-seq measure and how?", "a": "It measures chromatin accessibility, using a hyperactive mutant transposase to incorporate sequencing adaptors while simultaneously cleaving the DNA; open regions are found in active enhancers or promoters.", "kw": ["ATAC-seq"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "What advantages do CUT&RUN and FitCUT&RUN have over ChIP-seq?", "a": "CUT&RUN uses a protein A-Tn5 transposase fusion targeting antibody-bound chromatin, allowing extremely low input, no crosslinking artifacts and fewer sequencing reads; FitCUT&RUN is an antibody-free variation using Fc fragment of IgG tagging.", "kw": ["CUT&RUN", "FitCUT&RUN"], "info": "FitCUT&RUN addresses the lack of ChIP-seq- and CUT&RUN-compatible antibodies.", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "Which histone marks mean what here?", "a": "H3K4me3 marks promoters, H3K4me1 marks active or primed enhancers, H3K27ac marks active enhancers and promoters, and H3K27me3 marks polycomb-repressed, compacted chromatin.", "kw": ["H3K4me1", "H3K27ac", "H3K27me3"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "Difference between 4C-seq and Hi-C?", "a": "4C-seq studies all genomic regions interacting with one selected locus, while Hi-C measures interaction frequencies genome-wide, including TADs.", "kw": ["4C-seq", "Hi-C", "TAD"], "info": "TADs are regions of high internal interaction demarcated by topology-defining boundaries; CTCF is often found at TAD boundaries.", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "What is DANIO-CODE?", "a": "An international network established by the zebrafish community to generate regulatory genomics resources, analogous to ENCODE in humans and modENCODE in C. elegans and Drosophila.", "kw": ["DANIO-CODE", "ENCODE"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "How much data does DANIO-CODE hold?", "a": "It collated and reanalysed about 1800 genomics datasets with standardised pipelines, made available in the DANIO-CODE Data Coordination Center, covering 38 developmental stages, 21 assay types and 34 tissues.", "kw": ["DCC"], "info": "Raw and analysed data are shared with public visualisation tracks at https://danio-code.zfin.org.", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "How many candidate regulatory elements has DANIO-CODE annotated?", "a": "140,000 developmental candidate regulatory non-coding elements, identified by combining histone modification marks with ATAC-seq-supported open chromatin during zebrafish development.", "kw": ["PADRE", "140000"], "info": "These include precisely defined developmental promoteromes with an alternative promoter catalogue verified by CAGE-seq.", "concl": "DANIO-CODE provides a centralised, standardised catalogue of zebrafish regulatory elements."}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "What are the ChromHMM states used for PADREs?", "a": "Ten states: 1_TssA1, 2_TssA2, 3_TssFlank1, 4_TssFlank2, 5_EnhA1, 6_EnhFlank, 7_EnhWk1, 8_Pois, 9_ReprPC and 10_Quies, each defined by different levels of H3K4me3, H3K27ac, H3K4me1 and H3K27me3.", "kw": ["ChromHMM"], "info": "TssA1/TssA2 are promoters, EnhA1 and EnhFlank are active enhancers, EnhWk1 is a primed enhancer with H3K4me1 only, ReprPC is polycomb repressed.", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "How is cell-type specificity added to PADREs?", "a": "By integrating PADREs with enhancer annotations emerging from developmental single-cell ATAC-seq, which provides cell cluster resolution and cell-type assignment.", "kw": ["scATAC-seq"], "info": "Additional support for enhancer candidates comes from CAGE-detected eRNAs and sequence conservation tracks such as cyprinid PhastCons.", "concl": ""}, {"type": "qa", "section": "Box 3 - Guidance on DANIO-CODE resources", "q": "Which genome assemblies do the DANIO-CODE track hubs use?", "a": "Two versions of the zebrafish genome assembly, danRer10 and danRer11, available as public track hubs in the UCSC Genome Browser.", "kw": ["danRer10", "danRer11"], "info": "A WashU Epigenome Browser session and video tutorials are also provided.", "concl": ""}, {"type": "qa", "section": "Box 3 - Guidance on DANIO-CODE resources", "q": "Why should users look at raw signal, not just the called elements?", "a": "The DANIO-CODE atlas uses strict thresholds to call regulatory regions in order to minimise background, so users should explore the underlying signals and manually curate potentially missing regulatory elements.", "kw": ["thresholds"], "info": "This is an explicit caveat from the authors about sensitivity versus specificity of the atlas.", "concl": "The atlas is conservative; absence of a called element is not evidence of absence."}, {"type": "qa", "section": "Box 3 - Guidance on DANIO-CODE resources", "q": "Which assay tracks are in the DANIO-CODE Track Hub?", "a": "ATAC-seq, bisulfite sequencing, CAGE-seq, ChIP-seq, Hi-C, MNase-seq and RNA-seq, plus cell type, consensus promoter, conservation and CRISPR target, COPE/DOPE, distal PADRE SOM class, enhancer validation, H3K27ac ensemble, mouse H3K27me3 on zebrafish coordinates and stage type tracks.", "kw": ["track hub"], "info": "Distal PADRE SOM classes are PADREs away from promoters clustered by their openness pattern across development; H3K27ac ensembles are clusters of early developmental PADREs connected by uninterrupted H3K27ac signal.", "concl": ""}, {"type": "qa", "section": "Results and discussion - expanding non-coding elements", "q": "What marks are missing from the current annotation?", "a": "Marks reflecting sites of active transcription (H3K36me3) and marks of heterochromatin (H3K9me2/3); the candidate elements are currently classified by a limited number of chromatin marks.", "kw": ["H3K36me3", "H3K9me2/3"], "info": "", "concl": "Functional annotation needs refining with more chromatin marks."}, {"type": "qa", "section": "Results and discussion - expanding non-coding elements", "q": "What is ISMARA used for?", "a": "ISMARA models TF activity dynamics from bulk expression or ChIP-seq data to build gene regulatory networks, informing which motifs to target in conserved regulatory elements; it has been applied to zebrafish promoter data.", "kw": ["ISMARA", "MARA"], "info": "ISMARA was also used to identify type 2 diabetes-associated regulatory elements in humans that were then validated in zebrafish. DANIO-CODE results are at ismara.unibas.ch/danio-code.", "concl": ""}, {"type": "qa", "section": "Results and discussion - enhancer-target matchmaking", "q": "Why is assigning an enhancer to its target gene so hard?", "a": "Enhancers can act up to two megabases away from their targets and can reside in the introns of unaffected bystander genes.", "kw": ["enhancer-target"], "info": "", "concl": "Target gene assignment is a key bottleneck in interpreting disease-associated non-coding variants."}, {"type": "qa", "section": "Results and discussion - enhancer-target matchmaking", "q": "What data help assign targets in zebrafish, and what is their limitation?", "a": "4C-seq promoter-enhancer interaction maps give sufficient resolution but are available only for a selected set of long-range regulated genes in DANIO-CODE; Hi-C-derived TADs plus TAD-boundary CTCF maps can instead delimit the likely interaction span.", "kw": ["4C-seq", "TAD"], "info": "Zebrafish TADs are minable in the UCSC Genome Browser or in HiGlass.", "concl": ""}, {"type": "qa", "section": "Results and discussion - species conservation tracks", "q": "Which comparative genomics tools do they highlight?", "a": "VISTA for alignment of genomic sequences, Ancora as a catalogue and density viewer of highly conserved non-coding elements, and the Genomicus browser for homology prediction and synteny analysis.", "kw": ["VISTA", "Ancora", "Genomicus"], "info": "VISTA was used to predict disease-associated regulatory variants later tested in vivo, identifying novel enhancers associated with the craniofacial abnormality Pierre Robin sequence.", "concl": ""}, {"type": "qa", "section": "Results and discussion - species conservation tracks", "q": "What did synteny analysis contribute to disease models?", "a": "It informed a zebrafish model of poikiloderma with neutropenia that closely recapitulated the human syndrome, gave insights into Krabbe's disease via galactocerebrosidase cloning and knockdown, and supported a zebrafish Pompe disease model of glycogen storage.", "kw": ["synteny", "Krabbe", "Pompe"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - species conservation tracks", "q": "What is Independent Point Projection (IPP)?", "a": "A multispecies comparison approach that improves the resolution of synteny by increasing the number of syntenic anchors between fish and mammals, narrowing the search space for enhancers that are not alignable but share TF binding site composition.", "kw": ["IPP", "syntenic anchors"], "info": "It uses 'bridging' species as anchors. Not available as a web tool; available on GitHub (github.com/tobiaszehnder/IPP).", "concl": "IPP increases the predictability of functional equivalence between candidate CREs in different species."}, {"type": "qa", "section": "Results and discussion - expanding the reference genome", "q": "What is the state of the zebrafish reference genome?", "a": "It is in its 11th iteration (GRCz11), but an end-to-end full-length reference genome has yet to be achieved.", "kw": ["GRCz11"], "info": "Long-read sequencing offers high-confidence assembly of repeat-rich sequences, as shown by the finalised human genome; in zebrafish it improved the poorly assembled chromosome 4 and filled some gaps.", "concl": ""}, {"type": "qa", "section": "Results and discussion - expanding the reference genome", "q": "What is AQUA-FAANG and why does it matter for zebrafish?", "a": "A project adapting nf-core pipeline development to annotate regulatory elements in farmed teleosts, including the cyprinid common carp; when published it will offer teleost comparative genomic resources for zebrafish laboratories.", "kw": ["AQUA-FAANG", "nf-core"], "info": "The authors were supported by AQUA-FAANG (Horizon 2020, 817923).", "concl": ""}, {"type": "qa", "section": "Results and discussion - expanding the reference genome", "q": "What additions to DANIO-CODE are planned?", "a": "Adding enhancers identified in zebrafish adult tissues was in progress at the time of writing, and integration of recently acquired high-resolution chromatin conformation datasets and fast-expanding non-coding RNA annotations is planned.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What will bulk-based atlases inevitably miss?", "a": "Regulatory elements that are active in highly dynamic, stage-specific cells or in lineages with small cell numbers.", "kw": ["bulk data"], "info": "Combining single-cell open chromatin atlases and context-specific atlases such as regeneration atlases with more granular multiomic bulk data will improve cell-type resolution.", "concl": "Bulk and single-cell data are complementary, neither alone is sufficient."}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What is deconvolution needed for, and what is missing?", "a": "Integrating bulk and sorted-cell data with single-cell ATAC data allows estimating cell-type proportions and their contribution to the bulk signal; packages exist for bulk RNA-seq deconvolution, but deconvoluting single-cell ATAC-seq still needs computational tool development.", "kw": ["deconvolution"], "info": "Popular browsers (UCSC, Ensembl, WashU) are optimised for bulk data.", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What is the pressing antibody limitation?", "a": "There is a general lack of high-quality antibodies recognising zebrafish transcription factors and other chromatin-associated proteins.", "kw": ["antibodies"], "info": "Workaround: single-cell RNA-seq gives high-resolution TF activity, which integrated with single-cell chromatin accessibility can link TFs to enhancer targets, as demonstrated with CellOracle in zebrafish.", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What does the proposed integration pipeline (Fig. 2) look like?", "a": "ATAC-seq CRE classification plus ChIP-seq annotation via ChromHMM feeds PADREs; single-cell ATAC-seq adds cell cluster resolution and cell-type assignment, giving cell-type-specific CREs; single-cell RNA-seq adds TF expression and conservation tracks add disease-associated human CREs.", "kw": ["pipeline", "PADRE"], "info": "Once cell type, target gene, TF and TF binding site are defined, a mutant or reporter zebrafish line can be generated as a human disease model.", "concl": "Combining bulk and single-cell chromatin plus transcriptome annotation is the route to predictive regulatory atlases."}, {"type": "qa", "section": "Concluding remarks", "q": "What is the authors' overall assessment?", "a": "Zebrafish regulatory genomics has not yet advanced disease modelling to the same degree as other aspects of zebrafish genetics, but improved regulatory resources are expected to clarify disease-related molecular pathways and their transcriptional targets.", "kw": [], "info": "", "concl": "Zebrafish regulatory genomics currently lags behind other areas of zebrafish genetics."}, {"type": "qa", "section": "Concluding remarks", "q": "What three benefits do they list for profiling functional non-coding elements?", "a": "More refined control of gene editing and transgenesis tools; identification, characterisation and manipulation of specific disease-associated cell populations; and molecular understanding of conserved human disease and regeneration mechanisms that may support future treatment and diagnosis.", "kw": [], "info": "", "concl": "Regulatory element annotation underpins both better tools and better mechanistic insight."}, {"type": "note", "section": "Results and discussion - enhancer-target matchmaking", "text": "4C-seq coverage in DANIO-CODE is limited to selected long-range regulated genes - worth checking which loci are covered before assuming an enhancer-target map exists for a gene of interest."}, {"type": "note", "section": "Results and discussion - species conservation tracks", "text": "IPP could be relevant for projecting non-alignable cavefish or other teleost regulatory regions onto zebrafish/mammal coordinates; it is GitHub-only, so usability and documentation need checking."}, {"type": "note", "section": "Box 3 - Guidance on DANIO-CODE resources", "text": "COPE and DOPE tracks (open chromatin without any active chromatin mark) are an unexplained category - the paper does not say what these elements are functionally, which is an open question."}], "key": "drerio/JimenezGonzalez_2023_DMM_zebrafish_regulatory_genomic_resources", "shared": "", "preprint": "", "tags": ["Damir's paper"], "star": true, "source_note": ""}, {"id": "Fukushima_2025", "title": "Coordinated action of multiple active histone modifications shapes the zygotic genome activation in teleost embryos", "category": "ZGA & early embryo", "link": "https://doi.org/10.1038/s41467-025-60246-x", "note": "", "source_pdf": "papers/drerio/Fukushima_2025_NatCommun_histone_marks_ZGA_teleost.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What question does the paper address?", "a": "Many active histone modifications build up at zygotic genome activation (ZGA) and have long been linked to it, but whether they actually matter there was unclear. The authors tested the role of these marks and of the enzymes that write them during ZGA in teleost embryos (medaka and zebrafish).", "kw": ["ZGA", "histone modifications"], "info": "ZGA is described as the rapid, near-simultaneous activation of chromatin that was silenced across the whole genome.", "concl": "Several histone modifications act together to produce the gene activation program specific to ZGA in non-mammalian vertebrates."}, {"type": "qa", "section": "Abstract", "q": "What are the main findings in one sentence each?", "a": "CBP/P300 activity is needed to activate developmental genes, while housekeeping genes depend on acetylations not made by CBP/P300 (H3K9ac, H4K16ac, H3K14ac). H3K4me2/3 accumulation is not required for ZGA. Temporary accumulation of H3.3S31ph boosts CBP/P300 activity specifically at ZGA.", "kw": ["CBP/P300", "H3K4me2/3", "H3.3S31ph"], "info": "The H3K4me2/3 result contrasts with earlier reports from cell lines.", "concl": "Developmental genes and housekeeping genes are regulated differently during ZGA."}, {"type": "qa", "section": "Introduction", "q": "What happens to the embryo before ZGA in non-mammalian vertebrates?", "a": "Embryos go through rapid cleavages driven by maternal factors, with no zygotic transcription, and most histone modifications are erased. After about the tenth cleavage, at the blastula stage, pioneer factors start transcription across the genome within a very narrow time window.", "kw": ["cleavage", "pioneer factors", "maternal factors"], "info": "Before ZGA, chromatin is inaccessible, there is no canonical nucleosome patterning, and Pol II does not accumulate on chromatin. In mammals, histone marks are rarely fully erased. Instead, a non-canonical pattern is set up at ZGA, and ZGA lasts relatively long.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was already known about H3K27ac and CBP/P300 at ZGA?", "a": "H3K27ac builds up during ZGA in zebrafish and is strongly remodeled in mouse and human. Inhibiting CBP/P300 blocks ZGA in mouse, zebrafish and medaka, and overexpressing CBP/P300 in zebrafish causes premature but partial ZGA.", "kw": ["H3K27ac", "CBP/P300"], "info": "H3K27ac marks active promoters and enhancers. How CBP/P300 and H3K27ac regulate ZGA was not understood.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the gap regarding the other active marks?", "a": "H3K9ac, H4K16ac and H3K4me2/3 also accumulate during ZGA in zebrafish, medaka and Xenopus, and were proposed to prime genes for activation. Whether they are actually needed for ZGA had never been tested.", "kw": ["H3K9ac", "H4K16ac", "H3K4me2/3"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "When does ZGA happen in medaka?", "a": "From the tenth round of cell division, at the early blastula stage (about 1000 cells, 6.5 hpf).", "kw": ["medaka", "early blastula"], "info": "Blastomeres stay pluripotent until the late blastula stage (about 4000 cells, 8.5 hpf). Differentiation starts at the pre-early gastrula stage (6000 to 7000 cells, 10.5 hpf).", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "How did they inhibit CBP/P300?", "a": "They treated embryos with A485, which inhibits the HAT (acetyltransferase) activity, and with SGC-CBP30, which inhibits the bromodomain. Treatment ran from the 4-cell stage (2 hpf) to the late blastula stage (8.5 hpf).", "kw": ["A485", "SGC-CBP30"], "info": "Both treatments strongly reduced H3K27ac at late blastula and stopped development before gastrulation. A fractionation assay showed that A485 did not affect CBP/P300 binding to chromatin.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "How many genes changed after CBP/P300 inhibition?", "a": "With 20 µM A485, 767 genes went down and 10 went up. With SGC-CBP30, 527 went down and 22 went up. The downregulated genes were mostly ZGA genes, including both Maternal-ZGA and Pure ZGA genes.", "kw": ["RNA-seq", "DEGs"], "info": "DEG thresholds: |log2FC| > 1, adjusted p < 0.01, RPKM > 1.5. Two biological replicates each. In PCA, the samples from the two inhibitors clustered together and away from normal embryos.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "What are CBP/P300-dependent and CBP/P300-independent genes?", "a": "Dependent genes are ZGA genes downregulated by both A485 and SGC-CBP30; the two downregulated sets overlapped almost completely. About half of the ZGA genes were not affected by either inhibitor and are called CBP/P300-independent.", "kw": ["CBP/P300-dependent", "CBP/P300-independent"], "info": "In the Venn diagram, 412 genes are shared by ZGA genes and both inhibitor sets, and 634 ZGA genes are affected by neither.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "Could the CBP/P300-independent genes be a technical artefact of conventional RNA-seq?", "a": "The authors argue they are not. Their ZGA genes covered most of the highly expressed nascent or zygotic transcripts from earlier medaka data, and a re-analysis of zebrafish nascent RNA-seq with SGC-CBP30 also found many zygotic genes that did not respond to CBP/P300 inhibition.", "kw": ["nascent RNA-seq"], "info": "Limitation: conventional RNA-seq cannot separate maternal mRNA from newly transcribed mRNA.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "What kinds of genes are CBP/P300-dependent and which are independent?", "a": "GO terms for development and differentiation were enriched in dependent genes. Terms for recombination and nucleosomes, which relate to cell maintenance, were enriched in independent genes. Developmental genes such as bmp4, chrd, fgf8a, gata6, sox2, zic1 and wnt5b were CBP/P300-dependent in medaka.", "kw": ["GO analysis", "developmental genes", "housekeeping genes"], "info": "GO thresholds: FDR < 0.05, fold enrichment > 2, top 10 terms. A re-analysis of zebrafish data also showed that developmental genes respond to CBP/P300 inhibition.", "concl": "CBP/P300 is needed to activate developmental genes but not housekeeping genes during ZGA in fish."}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "How do the promoters of the two gene groups differ?", "a": "Dependent genes show a sharper boundary between untranscribed and transcribed regions around the TSS than independent genes. This fits the mammalian pattern of sharp promoters (single TSS) in developmental genes and broad promoters (multiple TSSs) in housekeeping genes.", "kw": ["sharp promoter", "broad promoter", "TSS"], "info": "Based on aggregate RNA-seq signal around the TSS, not on TSS mapping such as CAGE.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "Which genes were used for the chromatin analyses, and why?", "a": "Only CBP/P300-dependent and independent genes with an H3K27ac peak near the promoter (TSS ± 3 kb): 703 dependent and 398 independent. Downregulation of dependent genes without such a peak is probably a secondary effect downstream of direct targets.", "kw": ["H3K27ac proximal peaks"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "How did histone marks change after A485 treatment?", "a": "H3K27ac decreased at both dependent and independent promoters. H3K4me2 was lost specifically at dependent genes, and some dependent genes gained H3K27me3 too early. H2AK119ub1 decreased in both groups.", "kw": ["H3K4me2", "H3K27me3", "H2AK119ub1"], "info": "For the genes that gained H3K27me3, the mark normally appears at the onset of gastrulation. Expression of the H3K4 methylation, H3K27me3 and H2AK119ub modifiers was unchanged after A485. H2AK119ub1 was profiled with new spike-in ChIP-seq.", "concl": "CBP/P300 activity is needed to set up the normal epigenetic landscape during ZGA."}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "Which chromatin change best tracks the loss of expression?", "a": "Loss of H3K4me2. Its Pearson correlation with RNA change was 0.44 for A485 and 0.27 for SGC-CBP30. For H3K27me3 it was 0.07 and 0.0024, and for H2AK119ub 0.14 and 0.051.", "kw": ["Pearson correlation", "H3K4me2"], "info": "Among proximal peaks, H3K4me2 fold change after A485 was lower at dependent than at independent genes (p < 2.6 × 10^-27, Wilcoxon).", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "Is the H3K4me2 accumulation a cause or a consequence of transcription?", "a": "Blocking all transcription with alpha-amanitin did not reduce H3K27ac or H3K4me2. So H3K4me2 accumulation at developmental genes depends on CBP/P300 activity, not on zygotic transcription itself.", "kw": ["alpha-amanitin"], "info": "Alpha-amanitin was injected at the one-cell stage at 10 ng/µL. New spike-in ChIP-seq reproduced the earlier data.", "concl": ""}, {"type": "qa", "section": "Results - H3K4me2/3 is not prerequisite for ZGA", "q": "How did they deplete H3K4me2/3?", "a": "They injected mRNA for human KDM5B, a demethylase that removes H3K4me2/3, or treated embryos with MM-102, which blocks the WDR5-MLL1 interaction the H3K4 writer complex needs. Both lowered global H3K4me2 at late blastula, and KDM5B also lowered H3K4me3.", "kw": ["KDM5B", "MM-102", "WDR5-MLL1"], "info": "KDM5B mRNA was injected at 700 ng/µL and MM-102 used at 100 µM. Depletion was confirmed by Western blot and immunofluorescence.", "concl": ""}, {"type": "qa", "section": "Results - H3K4me2/3 is not prerequisite for ZGA", "q": "What happened to ZGA after H3K4me2/3 depletion?", "a": "Nothing. KDM5B changed only 4 genes up and 2 down, and MM-102 changed none. KDM5B-injected embryos also developed normally.", "kw": ["H3K4me2/3"], "info": "In PCA (PC1 78.3% of variance), the depleted samples clustered with normal late blastula and the inhibitor controls, while CBP/P300-inhibited samples were far away.", "concl": "Both H3K4me2/3 accumulation and ZGA depend on CBP/P300, but they are independent of each other."}, {"type": "qa", "section": "Results - CBP/P300 and BRD4 drive Pol II initiation and elongation", "q": "How does CBP/P300 inhibition affect Pol II?", "a": "In Pol II spike-in ChIP-seq after A485, Pol II was lost at both the TSS and the gene body of CBP/P300-dependent genes. This points to CBP/P300 being needed for Pol II initiation.", "kw": ["Pol II", "initiation"], "info": "Pol II density was measured as the TSS ± 250 bp region and the gene body as TSS + 500 bp to TES − 250 bp. Genes of 750 bp or shorter were excluded.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 and BRD4 drive Pol II initiation and elongation", "q": "What is the role of BRD4?", "a": "BRD4 reads CBP/P300-made acetylation and controls Pol II pause-release. Inhibiting it with JQ1 downregulated 1059 genes (40 up), mostly CBP/P300-dependent ZGA genes; 693 genes were shared by ZGA, CBP/P300-dependent and JQ1-down. After JQ1, Pol II dropped in gene bodies but not at the TSS.", "kw": ["BRD4", "JQ1", "pause-release"], "info": "JQ1 was used at 40 µM. Pol II Ser2P, an elongation mark, was reduced in the gene bodies of dependent genes after both A485 and JQ1.", "concl": "CBP/P300 drives Pol II initiation and BRD4 drives elongation at developmental genes."}, {"type": "qa", "section": "Results - CBP/P300 and BRD4 drive Pol II initiation and elongation", "q": "Does CBP/P300 act through chromatin accessibility?", "a": "Probably not. Re-analysis of ATAC-seq from A485-treated embryos showed that global H3K27ac loss only modestly reduced the gain in accessibility at ZGA, including at dependent-gene promoters.", "kw": ["ATAC-seq", "chromatin accessibility"], "info": "The authors note this matches earlier results in Drosophila ZGA.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Why are CBP/P300-independent genes still expressed after inhibition?", "a": "A485 and JQ1 also lowered Pol II at independent genes, but much less than at dependent genes, and their expression stayed largely unchanged. This is true even though CBP/P300 does act at their promoters (H3K27ac is lost there).", "kw": ["Pol II occupancy"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Which marks are enriched at CBP/P300-independent promoters?", "a": "In normal late blastula, H3K9ac, H4K16ac and H3K14ac are higher at independent than at dependent promoters. Their correlation with RNA change after A485 was 0.38, 0.4 and 0.27, compared with 0.2 for H3K27ac.", "kw": ["H3K9ac", "H4K16ac", "H3K14ac"], "info": "Wilcoxon p values: below 6.1 × 10^-15 for H3K9ac, below 1.1 × 10^-21 for H4K16ac, and below 1.1 × 10^-10 for H3K14ac. These ChIP-seq experiments had no spike-in.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Which HATs might activate housekeeping genes?", "a": "GCN5 (kat2a), MOF (kat8) and HBO1 (kat7b). These non-CBP/P300 HATs write H3K9ac, H4K16ac and H3K14ac and are expressed in early medaka development.", "kw": ["GCN5", "MOF", "HBO1"], "info": "This is a correlation only. None of these HATs was inhibited in the study.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Does the same pattern hold in zebrafish and mouse?", "a": "In zebrafish, H3K9ac and H4K16ac were enriched at independent promoters but not dependent ones. In mouse there was no such correlation, mouse dependent genes were not developmental genes, and the medaka developmental genes were not expressed at mouse ZGA.", "kw": ["zebrafish", "mouse", "re-analysis"], "info": "The authors suggest that in mammalian ZGA another mechanism activates the CBP/P300-independent genes.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Are different transcription factors linked to the two gene groups?", "a": "Motif analysis found PRDM9, HOXB13 and SOX15 motifs specific to dependent promoters, and Twist2, Tcf12, Olig2 and Neurod2 motifs (CAGCTG) specific to independent promoters. This supports a model where different TF groups recruit different HATs.", "kw": ["motif enrichment", "AME", "JASPAR2022"], "info": "Thresholds: log2 fold change of p value > 1 and log2 fold change of enrichment > 0.1. Earlier zebrafish work showed pioneer TFs recruit HATs at ZGA.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "Is H3K27ac per cell higher at ZGA than at later stages?", "a": "Yes. Quantitative Western blots with equal cell numbers showed H3K27ac 2 to 3 times higher at late blastula than at late neurula, 6-somite, 24-somite or in fibroblasts. H3K18ac, also made by CBP/P300, showed the same ZGA-specific peak.", "kw": ["quantitative Western blot", "H3K18ac"], "info": "Cell number was estimated from relative genome copy number by qPCR. H3K9ac, H4K16ac, H3K4me2 and H3K4me3 showed no ZGA-specific accumulation. In zebrafish, H3K27ac was 2 to 3 times higher at sphere (4 hpf) than at bud (10 hpf).", "concl": "CBP/P300 activity is specifically boosted during ZGA."}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "Which explanations for the enhanced CBP/P300 activity were ruled out?", "a": "CBP/P300 expression is similar between ZGA and later stages in medaka and zebrafish, and protein levels are similar in zebrafish. TSA treatment caused strong H3K27ac deposition, so HDACs are active at ZGA. Acetyl-CoA is probably not limiting, because acetylations made by other HATs are not raised.", "kw": ["TSA", "HDAC", "acetyl-CoA"], "info": "TSA was used at 20 or 100 nM. The acetyl-CoA argument is indirect; acetyl-CoA was not measured.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "What is H3.3S31ph and how does it behave at ZGA?", "a": "It is phosphorylation of serine 31 on histone variant H3.3, made by kinases such as Chk1, and it is known to boost CBP/P300 activity. Per cell, H3.3S31ph was much higher at late blastula than at late neurula or 6-somite, and ChIP-seq showed it at H3K27ac promoter peaks of both gene groups.", "kw": ["H3.3S31ph", "Chk1"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "What happened when chek1 was overexpressed?", "a": "Injecting chek1 mRNA increased H3.3S31ph and H3K27ac and activated CBP/P300-dependent genes early, at late morula (before ZGA). 577 genes went up and 90 down; 429 of the upregulated genes were CBP/P300-dependent and 103 were independent.", "kw": ["chek1", "precocious ZGA"], "info": "chek1 mRNA was injected at 20 ng/µL, with n = 7 Western blot replicates. In PCA, Chk1-injected morulae moved toward post-ZGA stages.", "concl": "Proposed model: a Chk1-driven rise in H3.3S31ph boosts CBP/P300 activity during ZGA."}, {"type": "qa", "section": "Discussion", "q": "Why would developmental genes depend on H3K27ac in particular?", "a": "H3K27ac is the acetylation that directly regulates both H3K27me3, which it opposes, and H3K4 methylation, which it promotes at some promoters. That makes it suited to the spatiotemporal control of developmental genes. Here, losing H3K27ac led to H3K27me3 gain and H3K4me2 loss.", "kw": ["H3K27ac", "H3K27me3 antagonism"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why would housekeeping genes use several HATs?", "a": "Housekeeping genes must stay robustly expressed throughout life, so their activation should not depend on CBP/P300 alone. Inhibiting several HATs at once would be needed to test this in future work.", "kw": ["housekeeping genes", "HAT redundancy"], "info": "This fits cell-line data where A485-sensitive genes are cell-type specific and insensitive genes are broadly expressed. In Drosophila, early developmental
