They maintain and refine AP neural patterning that planar organiser signals have already set up before gastrulation. They probably also regulate progenitor renewal and differentiation, helping set the right size of brain territories.", "kw": ["maintenance", "brain size"], "info": "How this is coordinated with continued development of the posterior body is largely unknown.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body", "q": "How does the notochord act as an organiser of the posterior body?", "a": "It secretes Shh, forming a gradient that patterns the neural tube DV axis in all vertebrates. It induces the floor plate through close contact, and the floor plate then also secretes Shh. It does not seem to affect AP patterning, but it does affect physical elongation of the AP axis.", "kw": ["Shh", "floor plate", "axis elongation"], "info": "Force for elongation is thought to come mostly from paraxial mesoderm and neural tube, but this varies between species. In anamniotes, notochord vacuolation provides hydraulic force for extension and straightening. Vacuole function is understudied in chick and mouse, so the review does not cover it there.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Xenopus", "q": "What are the neural defects in notochordless Xenopus embryos?", "a": "UV irradiation of eggs reduces mesoderm in a dose-dependent way. Embryos lacking only the notochord have spinal cord defects, cyclopia, no floor plate cells and an altered balance of dorsal and ventral neuron types. They also have no dopaminergic neurons in the ventral spinal cord, and left-right laterality is disrupted, with some axons projecting the wrong way.", "kw": ["UV irradiation", "dopaminergic neurons", "laterality"], "info": "Disrupting notochord-neural tube contact later did not stop dopaminergic neuron induction but reduced their number, so these neurons are probably induced by notochord precursors during gastrulation.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Xenopus", "q": "Does the Xenopus notochord generate force for axis elongation?", "a": "Not during convergent extension. In agarose force-sensor assays, dorsal explants without notochord produced about as much force as explants with it, and more paraxial mesoderm gave more stress. Yet notochordless embryos were on average 25% shorter than controls, probably because notochord vacuolation drives later elongation.", "kw": ["force sensor", "vacuolation", "dystroglycan"], "info": "Neural explants elongated at the same rate as full dorsal explants. From early tailbud stages, vacuoles swell osmotically. Dystroglycan mutations disrupt notochord extension and vacuolation and affect body length and straightness.", "concl": "Paraxial mesoderm and neural tissue drive early elongation, and later elongation depends on the notochord."}, {"type": "qa", "section": "Notochord and posterior body - Zebrafish", "q": "What do zebrafish notochordless mutants show about DV and AP neural patterning?", "a": "Mutants lacking a notochord include flh (noto), mom (momo), doc and ntl (tbxta). Unlike in frog, a ventral floor plate still forms, but it is truncated and made of patches of cells in the trunk. AP neural patterning is largely unaffected.", "kw": ["flh/noto", "ntl/tbxta", "floor plate"], "info": "Floor-plate-inducing Shh is still present in the midline of ntl and flh gastrulae, but its source without a notochord is unclear. Brief Shh exposure may be enough to specify primary motor neurons, while secondary motor neurons need longer exposure.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Zebrafish", "q": "How does midline and mesoderm loss affect somite and neural morphogenesis in zebrafish?", "a": "Notochordless mutants lack tail structures. After shield removal, somites fused across the midline and were rectangular instead of chevron-shaped. Neural tube morphogenesis is normal in midline mutants, but maternal-zygotic oep mutants, which lack all mesoderm, show slower, disoriented convergent extension and disorganised neural tissue.", "kw": ["MZoep", "convergent extension", "silberblick/Wnt11"], "info": "Friction between somitic mesoderm and neighbouring tissues helps shape somites. In silberblick (Wnt11) mutants, paraxial mesoderm convergent extension is disrupted, which affects axial extension and causes cyclopia.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Zebrafish", "q": "What role does notochord vacuolation play in zebrafish axis elongation?", "a": "Vacuolation starts at early tailbud, just after convergent extension ends. Disrupting vacuolated cells gives shorter embryos with wavy spines, and doc mutant notochords do not vacuolate and have shorter axes. Somite elongation after tailbud stage is coordinated with the expansion of vacuolated notochord cells.", "kw": ["notochord vacuoles", "doc"], "info": "Fig. 2A, about 22-somite stage: expanding anterior notochord cells push against the unexpanded posterior notochord. The resulting stress passes to neighbouring somites, which stretch along the AP axis.", "concl": "The authors hypothesise that notochord development acts as a timer that matches the elongation rate of paraxial mesoderm and spinal cord."}, {"type": "qa", "section": "Notochord and posterior body - Chick", "q": "What did chick node ablations show about the cranial notochord?", "a": "The chick notochord grows mainly by adding cells at its caudal end. Embryos that failed to regenerate cranial notochord still had normal head morphology with En2 expression. However, many showed an 'inverted head' phenotype, with two half En2+ neural tubes that still expressed En2 at the right position.", "kw": ["En2", "cranial notochord", "inverted head"], "info": "The paper gives '85% compared to 20% displaying good or fair morphology'; how these percentages compare is not clearly stated. Embryos lacking cranial notochord also lack floor plate and show ventral expansion of En2. Excising node subregions disrupts DV patterning only at AP levels missing midline tissue.", "concl": "AP patterning is unaffected without cranial notochord, but the midline may give structural integrity to neural tube morphogenesis."}, {"type": "qa", "section": "Notochord and posterior body - Chick", "q": "How are axial and paraxial tissues mechanically coupled in the chick tail bud?", "a": "Presomitic mesoderm (PSM) squeezes the axial tissues from both sides, which promotes their elongation. The axial tissues then push on the tail bud progenitor domain, moving PSM progenitors out laterally and creating a positive feedback loop. The loop starts from a random cell motility gradient in the PSM, driven by FGF that is highest posteriorly.", "kw": ["presomitic mesoderm", "mechanical coupling", "FGF"], "info": "Deleting the axial region has a much weaker effect on elongation speed than deleting posterior PSM. Proliferation of cells after they enter the PSM is needed for timely elongation, and FGF-triggered extracellular hyaluronic acid drives PSM volume growth.", "concl": ""}, {"type": "qa", "section": "Notochord and posterior body - Chick", "q": "Which notochord and node regions matter most for chick axis elongation and posterior survival?", "a": "Removing posterior notochord or the tail bud progenitor domain slows elongation, but removing anterior notochord does not. Removing posterior notochord together with posterior neural tube slows it further. Removing the posterior subregion of the node causes abrupt axial truncation and widespread apoptosis in the posterior body, which a graft of SHH-producing cells can rescue.", "kw": ["SHH", "apoptosis", "axial truncation"], "info": "The chick neural tube can elongate without axial mesoderm, which suggests each tissue can elongate on its own to some extent.", "concl": "Axial and paraxial tissues act together in chick elongation, and the notochord may promote posterior survival and keep all tissues at the same pace."}, {"type": "qa", "section": "Notochord and posterior body - Mouse", "q": "What happens to the body axis in mice lacking a notochord?", "a": "FOXA2-/- embryos have severely disrupted neural tube DV polarity, probably because ventral SHH is missing, and node-ablated embryos have no floor plate. AP order of genes is often normal. The axis is much shorter, ablated embryos tend to have fewer somites, and sometimes the neural tube fails to elongate at all.", "kw": ["FOXA2", "notochordal plate", "SHH"], "info": "The mouse notochord first forms as an epithelial notochordal plate on the endoderm surface. It elongates by convergent extension, then sinks inwards and rounds up into a rod.", "concl": "This fits the chick model in which notochord elongation coordinates the other tissues, but this has not been tested much in mouse."}, {"type": "qa", "section": "Conclusions and perspectives", "q": "What are the authors' overall conclusions about the organiser's role in normal development?", "a": "Organiser precursor cells, together with early extraembryonic endoderm (hypoblast in chick, AVE in mouse), start neural development and set up AP pattern by planar signals before axial mesendoderm lies under the neural tissue. Anterior axial mesendoderm has a relatively minor role in maintaining or refining AP pattern. However, loss of the prechordal plate or its Wnt antagonists consistently reduces forebrain size.", "kw": ["planar signals", "forebrain expansion"], "info": "Graft-based neural induction, the most studied aspect, does not reflect what the organiser does in normal development. Continued signalling may also make patterning robust during neural plate convergent extension.", "concl": "The authors propose that the embryo uses the pace of axial mesoderm extension to coordinate the extension of other tissues and so produce a proportional body axis."}, {"type": "qa", "section": "Conclusions and perspectives", "q": "Why does this matter for organoid and gastruloid engineering?", "a": "Gastruloids express many early embryonic markers but lack embryo-like morphology. Simply embedding them in matrigel can produce trunk-like structures and well-patterned somites, which shows that mechanical forces and tissue-ECM interactions matter.", "kw": ["gastruloids", "matrigel", "mechanotransduction"], "info": "Limitation: little is known about how forces act at the multi-tissue level, because this requires understanding development from the whole organism down to gene regulation.", "concl": "A multi-scale understanding of how organiser derivatives tune multi-tissue forces is needed to engineer organoids."}, {"type": "note", "section": "Organiser derivatives - Summary", "text": "How is the size of anterior brain territories, set by organiser derivatives, coordinated with continued development of the posterior body? The authors say this is largely unknown."}, {"type": "note", "section": "Notochord and posterior body - Zebrafish", "text": "Which tissue makes the floor-plate-inducing Shh in the midline of ntl and flh notochordless zebrafish gastrulae? The paper says the source is unclear."}, {"type": "note", "section": "Notochord and posterior body - Mouse", "text": "Does the chick tail bud mechanical-coupling model, where notochord pace coordinates PSM and neural tube elongation, apply to mouse and other vertebrates? Also worth checking the zebrafish notochord-as-timer hypothesis."}], "key": "drerio/Neaverson_2025_CellsDev_gastrula_organiser", "shared": "Damir · 2026", "preprint": "", "tags": [], "source_note": ""}, {"id": "Li_2026", "title": "Transcriptomic profiling reveals tetrabromobisphenol A-induced dysregulation of hepatic lipid homeostasis in common carp (Cyprinus carpio).", "category": "Toxicology & exposures", "link": "https://doi.org/10.1016/j.cbpc.2025.110336", "note": "", "source_pdf": "papers/drerio/Li_2026_CBPC_TBBPA_carp_hepatic_lipids.txt", "items": [{"type": "qa", "section": "Abstract", "q": "What is TBBPA and why is it a concern?", "a": "TBBPA (tetrabromobisphenol A) is a brominated flame retardant found almost everywhere in the environment. It is an ecological risk because it can bioaccumulate and is toxic.", "kw": ["TBBPA", "brominated flame retardant"], "info": "These notes are based only on the abstract and metadata. The full text was not available.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What gap does this study address?", "a": "Earlier work mostly used untargeted metabolomics and lipidomics to describe how TBBPA changes metabolic end products. There is little data on the mechanisms by which TBBPA disrupts lipid metabolism in aquatic organisms.", "kw": ["lipid metabolism", "metabolomics", "lipidomics"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What organism and exposure design did they use?", "a": "They used common carp (Cyprinus carpio). The fish were exposed for 14 days to TBBPA at 0, 0.005, 0.05 and 0.5 mg/L, which the authors describe as environmentally relevant concentrations.", "kw": ["Cyprinus carpio", "dose-response"], "info": "The abstract does not give sample sizes, the exposure route or which tissues were sequenced beyond liver and serum.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which approaches did they combine?", "a": "They combined serum biochemistry, histochemistry of the liver (Oil Red O staining) and transcriptomic profiling to study dose-dependent effects on lipid metabolism.", "kw": ["transcriptomics", "Oil Red O"], "info": "The abstract gives no sequencing platform, software or analysis parameters.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did serum biochemistry show after TBBPA exposure?", "a": "There was dose-dependent hyperlipidemia, with higher TG and T-CHO. SOD and CAT activities went down and MDA went up.", "kw": ["hyperlipidemia", "oxidative stress"], "info": "The abstract does not spell out these abbreviations and does not give exact values or fold changes. The SOD, CAT and MDA results match the paper's keyword 'oxidative stress'.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did liver histology and hepatic lipid content show?", "a": "Oil Red O staining showed lipid droplets building up in the liver. Even so, TG and T-CHO content inside the liver did not change significantly (P > 0.05). The 0.5 mg/L group had the most severe histopathology.", "kw": ["Oil Red O", "lipid droplets", "liver"], "info": "Lipid droplets accumulated even though bulk hepatic TG and T-CHO did not change. The abstract does not explain this mismatch.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which pathways did the transcriptomics point to?", "a": "The AMPK and PPAR signaling pathways came out as the key regulators of TBBPA-induced metabolic dysregulation.", "kw": ["AMPK", "PPAR"], "info": "The abstract gives no numbers of differentially expressed genes and no thresholds.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What happened at the low dose (0.05 mg/L)?", "a": "Lipid accumulation set off a compensatory activation of the AMPK/PPAR-alpha/CPT1 axis. This boosted fatty acid beta-oxidation and partly offset lipid deposition.", "kw": ["AMPK", "PPAR-alpha", "CPT1"], "info": "The abstract calls 0.05 mg/L 'low-dose' even though 0.005 mg/L was the lowest concentration tested. It does not report results for the 0.005 mg/L group.", "concl": "Low-dose TBBPA triggers an adaptive increase in beta-oxidation."}, {"type": "qa", "section": "Abstract", "q": "What happened at the high dose (0.5 mg/L)?", "a": "Genes for lipid synthesis, transport and storage were upregulated together. This disrupted lipid metabolism and led to pathological lipid deposition.", "kw": ["lipid synthesis", "lipid storage"], "info": "The abstract does not name the specific genes.", "concl": "High-dose TBBPA overwhelms compensation and drives pathological hepatic lipid deposition."}, {"type": "qa", "section": "Abstract", "q": "What is the authors' overall conclusion?", "a": "TBBPA disrupts hepatic lipid homeostasis in carp in a dose-dependent way. The study sheds light on the molecular cascades behind TBBPA-induced metabolic dysregulation in aquatic species.", "kw": ["lipid homeostasis", "dose-dependent"], "info": "", "concl": "Response switches with dose: compensatory AMPK/PPAR-alpha/CPT1 beta-oxidation at low dose, and coordinated lipogenic, transport and storage gene upregulation at high dose."}, {"type": "note", "section": "Abstract", "text": "Why did Oil Red O show lipid droplet accumulation when intrahepatic TG and T-CHO did not change significantly? Check the full text for how lipids were measured and for statistical power."}, {"type": "note", "section": "Abstract", "text": "What happened in the 0.005 mg/L group, and were the AMPK/PPAR-alpha/CPT1 changes confirmed at the protein level or only seen in the transcriptome?"}], "key": "drerio/Li_2026_CBPC_TBBPA_carp_hepatic_lipids", "shared": "Damir · 2026", "preprint": "", "tags": [], "source_note": "Not the full paper: no access to the full text, so these notes are based only on the publicly available abstract and metadata (PubMed). Details from the main text and figures are missing."}, {"id": "JimenezGonzalez_2023", "title": "Zebrafish regulatory genomic resources for disease modelling and regeneration", "category": "Genomic resources", "link": "https://doi.org/10.1242/dmm.050280", "note": "", "source_pdf": "papers/drerio/JimenezGonzalez_2023_DMM_zebrafish_regulatory_genomic_resources.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is this paper?", "a": "A Special Article (review/perspective) in Disease Models & Mechanisms discussing recent developments in generating functional annotation maps for regulatory elements of the zebrafish genome and how they can be applied to human disease.", "kw": ["review", "zebrafish", "regulatory genomics"], "info": "Not a primary data paper, so there are no new experiments or datasets of their own.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Why is zebrafish a popular disease model?", "a": "Fast development, easy genetic manipulation, simplicity for imaging, and sharing conserved disease-associated genes and pathways with humans.", "kw": ["disease modelling"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What gap do the authors address?", "a": "Disease studies increasingly focus on non-coding mutations, which require genome annotation maps of regulatory elements such as enhancers and promoters, and zebrafish lacked a centralised annotation comparable to human resources.", "kw": ["non-coding mutations"], "info": "", "concl": "Expanding zebrafish regulatory genomic resources is needed to interpret non-coding disease variants."}, {"type": "qa", "section": "Abstract", "q": "What two data types do the authors argue must be integrated?", "a": "Multiomic bulk sequencing data, which gives chromatin characterisation, and fast-expanding single-cell methods such as single-cell ATAC-seq, which give cell-type resolution.", "kw": ["scATAC-seq", "multiomics"], "info": "They also call for standardised genomics protocols, bioinformatic pipelines, and new analysis and visualisation tools.", "concl": "Integration tools combining bulk multiomics with single-cell resolution are essential."}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "How widely is zebrafish used?", "a": "It is a vertebrate model used by nearly 1000 laboratories worldwide.", "kw": [], "info": "Most human disease-associated genes have at least one zebrafish orthologue.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "Where do many disease-associated variants fall, according to GWAS?", "a": "A large proportion of disease-associated gene variants occur in non-coding regions that include cis-regulatory elements such as promoters and enhancers.", "kw": ["GWAS", "CRE"], "info": "Their mechanisms and role in disease are still mostly unknown and require extensive functional annotation.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What is the NEUROD1 example of an enhancer mutation?", "a": "NEUROD1, a transcription factor associated with diabetes, binds less efficiently to a variant enhancer sequence in pancreatic islets, reducing enhancer activity and increasing susceptibility to type 2 diabetes in East Asian populations.", "kw": ["NEUROD1", "type 2 diabetes"], "info": "Example of a non-coding variant acting through altered TF binding.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "How can variants act through chromatin looping?", "a": "In Alzheimer's disease, SNPs disrupt CTCF binding sites, a key factor in chromatin loop formation, leading to misexpression of the disease-associated genes GATS (CASTOR3P) and PILRB.", "kw": ["CTCF", "enhancer looping"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What other two ways can non-coding variation cause disease?", "a": "Variants can create new promoters, as for the variant upstream of the globin genes in alpha-thalassemia patients, and larger chromosomal rearrangements can misplace enhancers and deregulate non-target genes, as seen in neuroblastomas.", "kw": ["alpha-thalassemia", "neuroblastoma"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "Why are zebrafish embryos good for testing human non-coding elements?", "a": "Ease of transgenesis and evolutionarily conserved cis-regulatory logic during development allow in vivo reporter assays to detect the effects of human-disease-associated non-coding elements.", "kw": ["reporter assay", "transgenesis"], "info": "These assays rely on extreme sequence conservation of candidate elements, which is enriched near developmental regulator genes often associated with disease.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What did the gata2a enhancer deletion show?", "a": "Deletion of a highly conserved zebrafish gata2a enhancer mimics the dysregulated haematopoiesis characteristic of human GATA2 deficiency.", "kw": ["gata2a", "GATA2 deficiency"], "info": "Combined with single-cell RNA-seq and single-cell ATAC-seq, this showed that lack of gata2a favours the erythroid lineage by reducing accessibility of certain TFs in myeloid cells.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What can be done when sequence conservation is too low to find homologous enhancers?", "a": "Conserved transcription factor binding sites may still predict shared function; transgenic manipulation of enhancers with conserved TF binding site combinations pinpointed a shared mechanism for pancreatic hypoplasia.", "kw": ["TF binding sites", "pancreatic hypoplasia"], "info": "A dual fluorescence reporter system can simultaneously report the effect of a SNP alongside a common variant in conserved enhancers.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "Which organs can zebrafish regenerate that humans cannot?", "a": "Zebrafish can completely regenerate spinal cord, brain, heart, kidney and fins, whereas humans readily regenerate only skin, liver and fingertips, not whole limbs or full organs.", "kw": ["regeneration"], "info": "Regenerative mechanisms differ between organs but often include reactivation of developmental pathways.", "concl": ""}, {"type": "qa", "section": "Introduction - zebrafish models", "q": "What are regeneration-responsive enhancers?", "a": "Enhancers likely to mediate regeneration programmes; they have been described in heart, fin, retina and inner ear hair cells of zebrafish.", "kw": ["regeneration enhancers"], "info": "The long-term promise is inducing gene reactivation in human organs for regenerative therapies.", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "Why do transgenic gain-of-function models need annotated CREs?", "a": "Spatio-temporally controlled transgenic gain-of-function models require annotated, functionally validated cis-regulatory elements to drive expression in the right cells at the right time.", "kw": ["CRE", "transgenesis"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "How do loss-of-function approaches benefit from CRE annotation?", "a": "Tissue-specific knockout with Cre/lox or cell-type-specific transgenic expression of Cas9 and guide RNAs avoids early embryonic lethality, reduces pleiotropy, and models tissue- and time-specific gene regulation in disease.", "kw": ["Cre/lox", "Cas9"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "Why does dCas9 knockdown depend on promoter annotation?", "a": "Targeting nuclease-deficient Cas9 to promoters, or deleting promoters, requires precise annotation of transcription start sites for efficient inhibition of gene expression.", "kw": ["dCas9", "TSS"], "info": "dCas9 offers an alternative to genetic lesions and morpholino knockdown.", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "What is the position effect and why does it matter for transgenesis?", "a": "The chromatin environment where a transgene lands influences how efficiently it is expressed; this matters because transposon-mediated transgenesis predominantly occurs in active genomic regions.", "kw": ["position effect"], "info": "To avoid it, safe harbour landing sites should be identified and targeted by site-specific recombination.", "concl": ""}, {"type": "qa", "section": "Introduction - gene manipulation benefits", "q": "Which maps help find safe harbour landing sites?", "a": "Maps of accessible chromatin and chromatin interaction topology, including zebrafish Hi-C interaction maps and interaction boundaries informed by CTCF- and Cohesin-binding sites.", "kw": ["Hi-C", "safe harbour"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 1 - Glossary", "q": "What are COPEs and DOPEs?", "a": "A constitutive orphan predicted element (COPE) is open throughout development but lacks an active chromatin mark at any stage; a dynamic orphan predicted element (DOPE) is open at some point in development but also lacks an active chromatin mark at any stage.", "kw": ["COPE", "DOPE"], "info": "Both are ATAC-seq signal without observable CRE-associated chromatin marks; they have dedicated DANIO-CODE tracks.", "concl": ""}, {"type": "qa", "section": "Box 1 - Glossary", "q": "What are PADREs?", "a": "Predicted ATAC-seq-supported developmental regulatory elements: regulatory elements defined with ATAC-seq chromatin accessibility data whose function is determined from integration of key histone modification ChIP-seq data and predicted by ChromHMM.", "kw": ["PADRE", "ChromHMM"], "info": "", "concl": "PADREs are the core regulatory element annotation of DANIO-CODE."}, {"type": "qa", "section": "Box 1 - Glossary", "q": "Syntenic anchors versus synteny?", "a": "Syntenic anchors are conserved non-repetitive sequences in two genomes showing a high degree of similarity; synteny refers to blocks of such anchors appearing in the same order on a chromosome between organisms.", "kw": ["synteny", "syntenic anchors"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 1 - Glossary", "q": "What is nf-core?", "a": "A community-created resource for developing pipelines following standardised guidelines under the Nextflow system, allowing reproducibility between analyses using the same tools and versions.", "kw": ["nf-core", "Nextflow"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "What does CAGE-seq do?", "a": "CAGE-seq sequences specifically the 5' end of capped RNA, allowing accurate recognition of transcription start sites and analysis of the transcriptome.", "kw": ["CAGE-seq", "TSS"], "info": "TSS positions should be used for the identification of promoters.", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "How are eRNAs recognised?", "a": "Enhancer RNAs are long non-coding RNAs transcribed from active enhancers, detectable by CAGE-seq signal; most are transcribed bidirectionally from both DNA strands.", "kw": ["eRNA"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "What does ATAC-seq measure and how?", "a": "It measures chromatin accessibility, using a hyperactive mutant transposase to incorporate sequencing adaptors while simultaneously cleaving the DNA; open regions are found in active enhancers or promoters.", "kw": ["ATAC-seq"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "What advantages do CUT&RUN and FitCUT&RUN have over ChIP-seq?", "a": "CUT&RUN uses a protein A-Tn5 transposase fusion targeting antibody-bound chromatin, allowing extremely low input, no crosslinking artifacts and fewer sequencing reads; FitCUT&RUN is an antibody-free variation using Fc fragment of IgG tagging.", "kw": ["CUT&RUN", "FitCUT&RUN"], "info": "FitCUT&RUN addresses the lack of ChIP-seq- and CUT&RUN-compatible antibodies.", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "Which histone marks mean what here?", "a": "H3K4me3 marks promoters, H3K4me1 marks active or primed enhancers, H3K27ac marks active enhancers and promoters, and H3K27me3 marks polycomb-repressed, compacted chromatin.", "kw": ["H3K4me1", "H3K27ac", "H3K27me3"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Chromatin features and technologies", "q": "Difference between 4C-seq and Hi-C?", "a": "4C-seq studies all genomic regions interacting with one selected locus, while Hi-C measures interaction frequencies genome-wide, including TADs.", "kw": ["4C-seq", "Hi-C", "TAD"], "info": "TADs are regions of high internal interaction demarcated by topology-defining boundaries; CTCF is often found at TAD boundaries.", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "What is DANIO-CODE?", "a": "An international network established by the zebrafish community to generate regulatory genomics resources, analogous to ENCODE in humans and modENCODE in C. elegans and Drosophila.", "kw": ["DANIO-CODE", "ENCODE"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "How much data does DANIO-CODE hold?", "a": "It collated and reanalysed about 1800 genomics datasets with standardised pipelines, made available in the DANIO-CODE Data Coordination Center, covering 38 developmental stages, 21 assay types and 34 tissues.", "kw": ["DCC"], "info": "Raw and analysed data are shared with public visualisation tracks at https://danio-code.zfin.org.", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "How many candidate regulatory elements has DANIO-CODE annotated?", "a": "140,000 developmental candidate regulatory non-coding elements, identified by combining histone modification marks with ATAC-seq-supported open chromatin during zebrafish development.", "kw": ["PADRE", "140000"], "info": "These include precisely defined developmental promoteromes with an alternative promoter catalogue verified by CAGE-seq.", "concl": "DANIO-CODE provides a centralised, standardised catalogue of zebrafish regulatory elements."}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "What are the ChromHMM states used for PADREs?", "a": "Ten states: 1_TssA1, 2_TssA2, 3_TssFlank1, 4_TssFlank2, 5_EnhA1, 6_EnhFlank, 7_EnhWk1, 8_Pois, 9_ReprPC and 10_Quies, each defined by different levels of H3K4me3, H3K27ac, H3K4me1 and H3K27me3.", "kw": ["ChromHMM"], "info": "TssA1/TssA2 are promoters, EnhA1 and EnhFlank are active enhancers, EnhWk1 is a primed enhancer with H3K4me1 only, ReprPC is polycomb repressed.", "concl": ""}, {"type": "qa", "section": "Results and discussion - state-of-the-art resources", "q": "How is cell-type specificity added to PADREs?", "a": "By integrating PADREs with enhancer annotations emerging from developmental single-cell ATAC-seq, which provides cell cluster resolution and cell-type assignment.", "kw": ["scATAC-seq"], "info": "Additional support for enhancer candidates comes from CAGE-detected eRNAs and sequence conservation tracks such as cyprinid PhastCons.", "concl": ""}, {"type": "qa", "section": "Box 3 - Guidance on DANIO-CODE resources", "q": "Which genome assemblies do the DANIO-CODE track hubs use?", "a": "Two versions of the zebrafish genome assembly, danRer10 and danRer11, available as public track hubs in the UCSC Genome Browser.", "kw": ["danRer10", "danRer11"], "info": "A WashU Epigenome Browser session and video tutorials are also provided.", "concl": ""}, {"type": "qa", "section": "Box 3 - Guidance on DANIO-CODE resources", "q": "Why should users look at raw signal, not just the called elements?", "a": "The DANIO-CODE atlas uses strict thresholds to call regulatory regions in order to minimise background, so users should explore the underlying signals and manually curate potentially missing regulatory elements.", "kw": ["thresholds"], "info": "This is an explicit caveat from the authors about sensitivity versus specificity of the atlas.", "concl": "The atlas is conservative; absence of a called element is not evidence of absence."}, {"type": "qa", "section": "Box 3 - Guidance on DANIO-CODE resources", "q": "Which assay tracks are in the DANIO-CODE Track Hub?", "a": "ATAC-seq, bisulfite sequencing, CAGE-seq, ChIP-seq, Hi-C, MNase-seq and RNA-seq, plus cell type, consensus promoter, conservation and CRISPR target, COPE/DOPE, distal PADRE SOM class, enhancer validation, H3K27ac ensemble, mouse H3K27me3 on zebrafish coordinates and stage type tracks.", "kw": ["track hub"], "info": "Distal PADRE SOM classes are PADREs away from promoters clustered by their openness pattern across development; H3K27ac ensembles are clusters of early developmental PADREs connected by uninterrupted H3K27ac signal.", "concl": ""}, {"type": "qa", "section": "Results and discussion - expanding non-coding elements", "q": "What marks are missing from the current annotation?", "a": "Marks reflecting sites of active transcription (H3K36me3) and marks of heterochromatin (H3K9me2/3); the candidate elements are currently classified by a limited number of chromatin marks.", "kw": ["H3K36me3", "H3K9me2/3"], "info": "", "concl": "Functional annotation needs refining with more chromatin marks."}, {"type": "qa", "section": "Results and discussion - expanding non-coding elements", "q": "What is ISMARA used for?", "a": "ISMARA models TF activity dynamics from bulk expression or ChIP-seq data to build gene regulatory networks, informing which motifs to target in conserved regulatory elements; it has been applied to zebrafish promoter data.", "kw": ["ISMARA", "MARA"], "info": "ISMARA was also used to identify type 2 diabetes-associated regulatory elements in humans that were then validated in zebrafish. DANIO-CODE results are at ismara.unibas.ch/danio-code.", "concl": ""}, {"type": "qa", "section": "Results and discussion - enhancer-target matchmaking", "q": "Why is assigning an enhancer to its target gene so hard?", "a": "Enhancers can act up to two megabases away from their targets and can reside in the introns of unaffected bystander genes.", "kw": ["enhancer-target"], "info": "", "concl": "Target gene assignment is a key bottleneck in interpreting disease-associated non-coding variants."}, {"type": "qa", "section": "Results and discussion - enhancer-target matchmaking", "q": "What data help assign targets in zebrafish, and what is their limitation?", "a": "4C-seq promoter-enhancer interaction maps give sufficient resolution but are available only for a selected set of long-range regulated genes in DANIO-CODE; Hi-C-derived TADs plus TAD-boundary CTCF maps can instead delimit the likely interaction span.", "kw": ["4C-seq", "TAD"], "info": "Zebrafish TADs are minable in the UCSC Genome Browser or in HiGlass.", "concl": ""}, {"type": "qa", "section": "Results and discussion - species conservation tracks", "q": "Which comparative genomics tools do they highlight?", "a": "VISTA for alignment of genomic sequences, Ancora as a catalogue and density viewer of highly conserved non-coding elements, and the Genomicus browser for homology prediction and synteny analysis.", "kw": ["VISTA", "Ancora", "Genomicus"], "info": "VISTA was used to predict disease-associated regulatory variants later tested in vivo, identifying novel enhancers associated with the craniofacial abnormality Pierre Robin sequence.", "concl": ""}, {"type": "qa", "section": "Results and discussion - species conservation tracks", "q": "What did synteny analysis contribute to disease models?", "a": "It informed a zebrafish model of poikiloderma with neutropenia that closely recapitulated the human syndrome, gave insights into Krabbe's disease via galactocerebrosidase cloning and knockdown, and supported a zebrafish Pompe disease model of glycogen storage.", "kw": ["synteny", "Krabbe", "Pompe"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - species conservation tracks", "q": "What is Independent Point Projection (IPP)?", "a": "A multispecies comparison approach that improves the resolution of synteny by increasing the number of syntenic anchors between fish and mammals, narrowing the search space for enhancers that are not alignable but share TF binding site composition.", "kw": ["IPP", "syntenic anchors"], "info": "It uses 'bridging' species as anchors. Not available as a web tool; available on GitHub (github.com/tobiaszehnder/IPP).", "concl": "IPP increases the predictability of functional equivalence between candidate CREs in different species."}, {"type": "qa", "section": "Results and discussion - expanding the reference genome", "q": "What is the state of the zebrafish reference genome?", "a": "It is in its 11th iteration (GRCz11), but an end-to-end full-length reference genome has yet to be achieved.", "kw": ["GRCz11"], "info": "Long-read sequencing offers high-confidence assembly of repeat-rich sequences, as shown by the finalised human genome; in zebrafish it improved the poorly assembled chromosome 4 and filled some gaps.", "concl": ""}, {"type": "qa", "section": "Results and discussion - expanding the reference genome", "q": "What is AQUA-FAANG and why does it matter for zebrafish?", "a": "A project adapting nf-core pipeline development to annotate regulatory elements in farmed teleosts, including the cyprinid common carp; when published it will offer teleost comparative genomic resources for zebrafish laboratories.", "kw": ["AQUA-FAANG", "nf-core"], "info": "The authors were supported by AQUA-FAANG (Horizon 2020, 817923).", "concl": ""}, {"type": "qa", "section": "Results and discussion - expanding the reference genome", "q": "What additions to DANIO-CODE are planned?", "a": "Adding enhancers identified in zebrafish adult tissues was in progress at the time of writing, and integration of recently acquired high-resolution chromatin conformation datasets and fast-expanding non-coding RNA annotations is planned.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What will bulk-based atlases inevitably miss?", "a": "Regulatory elements that are active in highly dynamic, stage-specific cells or in lineages with small cell numbers.", "kw": ["bulk data"], "info": "Combining single-cell open chromatin atlases and context-specific atlases such as regeneration atlases with more granular multiomic bulk data will improve cell-type resolution.", "concl": "Bulk and single-cell data are complementary, neither alone is sufficient."}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What is deconvolution needed for, and what is missing?", "a": "Integrating bulk and sorted-cell data with single-cell ATAC data allows estimating cell-type proportions and their contribution to the bulk signal; packages exist for bulk RNA-seq deconvolution, but deconvoluting single-cell ATAC-seq still needs computational tool development.", "kw": ["deconvolution"], "info": "Popular browsers (UCSC, Ensembl, WashU) are optimised for bulk data.", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What is the pressing antibody limitation?", "a": "There is a general lack of high-quality antibodies recognising zebrafish transcription factors and other chromatin-associated proteins.", "kw": ["antibodies"], "info": "Workaround: single-cell RNA-seq gives high-resolution TF activity, which integrated with single-cell chromatin accessibility can link TFs to enhancer targets, as demonstrated with CellOracle in zebrafish.", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell and multiomic integration", "q": "What does the proposed integration pipeline (Fig. 2) look like?", "a": "ATAC-seq CRE classification plus ChIP-seq annotation via ChromHMM feeds PADREs; single-cell ATAC-seq adds cell cluster resolution and cell-type assignment, giving cell-type-specific CREs; single-cell RNA-seq adds TF expression and conservation tracks add disease-associated human CREs.", "kw": ["pipeline", "PADRE"], "info": "Once cell type, target gene, TF and TF binding site are defined, a mutant or reporter zebrafish line can be generated as a human disease model.", "concl": "Combining bulk and single-cell chromatin plus transcriptome annotation is the route to predictive regulatory atlases."}, {"type": "qa", "section": "Concluding remarks", "q": "What is the authors' overall assessment?", "a": "Zebrafish regulatory genomics has not yet advanced disease modelling to the same degree as other aspects of zebrafish genetics, but improved regulatory resources are expected to clarify disease-related molecular pathways and their transcriptional targets.", "kw": [], "info": "", "concl": "Zebrafish regulatory genomics currently lags behind other areas of zebrafish genetics."}, {"type": "qa", "section": "Concluding remarks", "q": "What three benefits do they list for profiling functional non-coding elements?", "a": "More refined control of gene editing and transgenesis tools; identification, characterisation and manipulation of specific disease-associated cell populations; and molecular understanding of conserved human disease and regeneration mechanisms that may support future treatment and diagnosis.", "kw": [], "info": "", "concl": "Regulatory element annotation underpins both better tools and better mechanistic insight."}, {"type": "note", "section": "Results and discussion - enhancer-target matchmaking", "text": "4C-seq coverage in DANIO-CODE is limited to selected long-range regulated genes - worth checking which loci are covered before assuming an enhancer-target map exists for a gene of interest."}, {"type": "note", "section": "Results and discussion - species conservation tracks", "text": "IPP could be relevant for projecting non-alignable cavefish or other teleost regulatory regions onto zebrafish/mammal coordinates; it is GitHub-only, so usability and documentation need checking."}, {"type": "note", "section": "Box 3 - Guidance on DANIO-CODE resources", "text": "COPE and DOPE tracks (open chromatin without any active chromatin mark) are an unexplained category - the paper does not say what these elements are functionally, which is an open question."}], "key": "drerio/JimenezGonzalez_2023_DMM_zebrafish_regulatory_genomic_resources", "shared": "", "preprint": "", "tags": ["Damir's paper"], "source_note": ""}, {"id": "Fukushima_2025", "title": "Coordinated action of multiple active histone modifications shapes the zygotic genome activation in teleost embryos", "category": "ZGA & early embryo", "link": "https://doi.org/10.1038/s41467-025-60246-x", "note": "", "source_pdf": "papers/drerio/Fukushima_2025_NatCommun_histone_marks_ZGA_teleost.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What question does the paper address?", "a": "Many active histone modifications build up at zygotic genome activation (ZGA) and have long been linked to it, but whether they actually matter there was unclear. The authors tested the role of these marks and of the enzymes that write them during ZGA in teleost embryos (medaka and zebrafish).", "kw": ["ZGA", "histone modifications"], "info": "ZGA is described as the rapid, near-simultaneous activation of chromatin that was silenced across the whole genome.", "concl": "Several histone modifications act together to produce the gene activation program specific to ZGA in non-mammalian vertebrates."}, {"type": "qa", "section": "Abstract", "q": "What are the main findings in one sentence each?", "a": "CBP/P300 activity is needed to activate developmental genes, while housekeeping genes depend on acetylations not made by CBP/P300 (H3K9ac, H4K16ac, H3K14ac). H3K4me2/3 accumulation is not required for ZGA. Temporary accumulation of H3.3S31ph boosts CBP/P300 activity specifically at ZGA.", "kw": ["CBP/P300", "H3K4me2/3", "H3.3S31ph"], "info": "The H3K4me2/3 result contrasts with earlier reports from cell lines.", "concl": "Developmental genes and housekeeping genes are regulated differently during ZGA."}, {"type": "qa", "section": "Introduction", "q": "What happens to the embryo before ZGA in non-mammalian vertebrates?", "a": "Embryos go through rapid cleavages driven by maternal factors, with no zygotic transcription, and most histone modifications are erased. After about the tenth cleavage, at the blastula stage, pioneer factors start transcription across the genome within a very narrow time window.", "kw": ["cleavage", "pioneer factors", "maternal factors"], "info": "Before ZGA, chromatin is inaccessible, there is no canonical nucleosome patterning, and Pol II does not accumulate on chromatin. In mammals, histone marks are rarely fully erased. Instead, a non-canonical pattern is set up at ZGA, and ZGA lasts relatively long.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was already known about H3K27ac and CBP/P300 at ZGA?", "a": "H3K27ac builds up during ZGA in zebrafish and is strongly remodeled in mouse and human. Inhibiting CBP/P300 blocks ZGA in mouse, zebrafish and medaka, and overexpressing CBP/P300 in zebrafish causes premature but partial ZGA.", "kw": ["H3K27ac", "CBP/P300"], "info": "H3K27ac marks active promoters and enhancers. How CBP/P300 and H3K27ac regulate ZGA was not understood.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the gap regarding the other active marks?", "a": "H3K9ac, H4K16ac and H3K4me2/3 also accumulate during ZGA in zebrafish, medaka and Xenopus, and were proposed to prime genes for activation. Whether they are actually needed for ZGA had never been tested.", "kw": ["H3K9ac", "H4K16ac", "H3K4me2/3"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "When does ZGA happen in medaka?", "a": "From the tenth round of cell division, at the early blastula stage (about 1000 cells, 6.5 hpf).", "kw": ["medaka", "early blastula"], "info": "Blastomeres stay pluripotent until the late blastula stage (about 4000 cells, 8.5 hpf). Differentiation starts at the pre-early gastrula stage (6000 to 7000 cells, 10.5 hpf).", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "How did they inhibit CBP/P300?", "a": "They treated embryos with A485, which inhibits the HAT (acetyltransferase) activity, and with SGC-CBP30, which inhibits the bromodomain. Treatment ran from the 4-cell stage (2 hpf) to the late blastula stage (8.5 hpf).", "kw": ["A485", "SGC-CBP30"], "info": "Both treatments strongly reduced H3K27ac at late blastula and stopped development before gastrulation. A fractionation assay showed that A485 did not affect CBP/P300 binding to chromatin.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "How many genes changed after CBP/P300 inhibition?", "a": "With 20 µM A485, 767 genes went down and 10 went up. With SGC-CBP30, 527 went down and 22 went up. The downregulated genes were mostly ZGA genes, including both Maternal-ZGA and Pure ZGA genes.", "kw": ["RNA-seq", "DEGs"], "info": "DEG thresholds: |log2FC| > 1, adjusted p < 0.01, RPKM > 1.5. Two biological replicates each. In PCA, the samples from the two inhibitors clustered together and away from normal embryos.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "What are CBP/P300-dependent and CBP/P300-independent genes?", "a": "Dependent genes are ZGA genes downregulated by both A485 and SGC-CBP30; the two downregulated sets overlapped almost completely. About half of the ZGA genes were not affected by either inhibitor and are called CBP/P300-independent.", "kw": ["CBP/P300-dependent", "CBP/P300-independent"], "info": "In the Venn diagram, 412 genes are shared by ZGA genes and both inhibitor sets, and 634 ZGA genes are affected by neither.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "Could the CBP/P300-independent genes be a technical artefact of conventional RNA-seq?", "a": "The authors argue they are not. Their ZGA genes covered most of the highly expressed nascent or zygotic transcripts from earlier medaka data, and a re-analysis of zebrafish nascent RNA-seq with SGC-CBP30 also found many zygotic genes that did not respond to CBP/P300 inhibition.", "kw": ["nascent RNA-seq"], "info": "Limitation: conventional RNA-seq cannot separate maternal mRNA from newly transcribed mRNA.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "What kinds of genes are CBP/P300-dependent and which are independent?", "a": "GO terms for development and differentiation were enriched in dependent genes. Terms for recombination and nucleosomes, which relate to cell maintenance, were enriched in independent genes. Developmental genes such as bmp4, chrd, fgf8a, gata6, sox2, zic1 and wnt5b were CBP/P300-dependent in medaka.", "kw": ["GO analysis", "developmental genes", "housekeeping genes"], "info": "GO thresholds: FDR < 0.05, fold enrichment > 2, top 10 terms. A re-analysis of zebrafish data also showed that developmental genes respond to CBP/P300 inhibition.", "concl": "CBP/P300 is needed to activate developmental genes but not housekeeping genes during ZGA in fish."}, {"type": "qa", "section": "Results - CBP/P300 is essential for developmental but not housekeeping genes", "q": "How do the promoters of the two gene groups differ?", "a": "Dependent genes show a sharper boundary between untranscribed and transcribed regions around the TSS than independent genes. This fits the mammalian pattern of sharp promoters (single TSS) in developmental genes and broad promoters (multiple TSSs) in housekeeping genes.", "kw": ["sharp promoter", "broad promoter", "TSS"], "info": "Based on aggregate RNA-seq signal around the TSS, not on TSS mapping such as CAGE.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "Which genes were used for the chromatin analyses, and why?", "a": "Only CBP/P300-dependent and independent genes with an H3K27ac peak near the promoter (TSS ± 3 kb): 703 dependent and 398 independent. Downregulation of dependent genes without such a peak is probably a secondary effect downstream of direct targets.", "kw": ["H3K27ac proximal peaks"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "How did histone marks change after A485 treatment?", "a": "H3K27ac decreased at both dependent and independent promoters. H3K4me2 was lost specifically at dependent genes, and some dependent genes gained H3K27me3 too early. H2AK119ub1 decreased in both groups.", "kw": ["H3K4me2", "H3K27me3", "H2AK119ub1"], "info": "For the genes that gained H3K27me3, the mark normally appears at the onset of gastrulation. Expression of the H3K4 methylation, H3K27me3 and H2AK119ub modifiers was unchanged after A485. H2AK119ub1 was profiled with new spike-in ChIP-seq.", "concl": "CBP/P300 activity is needed to set up the normal epigenetic landscape during ZGA."}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "Which chromatin change best tracks the loss of expression?", "a": "Loss of H3K4me2. Its Pearson correlation with RNA change was 0.44 for A485 and 0.27 for SGC-CBP30. For H3K27me3 it was 0.07 and 0.0024, and for H2AK119ub 0.14 and 0.051.", "kw": ["Pearson correlation", "H3K4me2"], "info": "Among proximal peaks, H3K4me2 fold change after A485 was lower at dependent than at independent genes (p < 2.6 × 10^-27, Wilcoxon).", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 shapes the epigenetic landscape at ZGA", "q": "Is the H3K4me2 accumulation a cause or a consequence of transcription?", "a": "Blocking all transcription with alpha-amanitin did not reduce H3K27ac or H3K4me2. So H3K4me2 accumulation at developmental genes depends on CBP/P300 activity, not on zygotic transcription itself.", "kw": ["alpha-amanitin"], "info": "Alpha-amanitin was injected at the one-cell stage at 10 ng/µL. New spike-in ChIP-seq reproduced the earlier data.", "concl": ""}, {"type": "qa", "section": "Results - H3K4me2/3 is not prerequisite for ZGA", "q": "How did they deplete H3K4me2/3?", "a": "They injected mRNA for human KDM5B, a demethylase that removes H3K4me2/3, or treated embryos with MM-102, which blocks the WDR5-MLL1 interaction the H3K4 writer complex needs. Both lowered global H3K4me2 at late blastula, and KDM5B also lowered H3K4me3.", "kw": ["KDM5B", "MM-102", "WDR5-MLL1"], "info": "KDM5B mRNA was injected at 700 ng/µL and MM-102 used at 100 µM. Depletion was confirmed by Western blot and immunofluorescence.", "concl": ""}, {"type": "qa", "section": "Results - H3K4me2/3 is not prerequisite for ZGA", "q": "What happened to ZGA after H3K4me2/3 depletion?", "a": "Nothing. KDM5B changed only 4 genes up and 2 down, and MM-102 changed none. KDM5B-injected embryos also developed normally.", "kw": ["H3K4me2/3"], "info": "In PCA (PC1 78.3% of variance), the depleted samples clustered with normal late blastula and the inhibitor controls, while CBP/P300-inhibited samples were far away.", "concl": "Both H3K4me2/3 accumulation and ZGA depend on CBP/P300, but they are independent of each other."}, {"type": "qa", "section": "Results - CBP/P300 and BRD4 drive Pol II initiation and elongation", "q": "How does CBP/P300 inhibition affect Pol II?", "a": "In Pol II spike-in ChIP-seq after A485, Pol II was lost at both the TSS and the gene body of CBP/P300-dependent genes. This points to CBP/P300 being needed for Pol II initiation.", "kw": ["Pol II", "initiation"], "info": "Pol II density was measured as the TSS ± 250 bp region and the gene body as TSS + 500 bp to TES − 250 bp. Genes of 750 bp or shorter were excluded.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 and BRD4 drive Pol II initiation and elongation", "q": "What is the role of BRD4?", "a": "BRD4 reads CBP/P300-made acetylation and controls Pol II pause-release. Inhibiting it with JQ1 downregulated 1059 genes (40 up), mostly CBP/P300-dependent ZGA genes; 693 genes were shared by ZGA, CBP/P300-dependent and JQ1-down. After JQ1, Pol II dropped in gene bodies but not at the TSS.", "kw": ["BRD4", "JQ1", "pause-release"], "info": "JQ1 was used at 40 µM. Pol II Ser2P, an elongation mark, was reduced in the gene bodies of dependent genes after both A485 and JQ1.", "concl": "CBP/P300 drives Pol II initiation and BRD4 drives elongation at developmental genes."}, {"type": "qa", "section": "Results - CBP/P300 and BRD4 drive Pol II initiation and elongation", "q": "Does CBP/P300 act through chromatin accessibility?", "a": "Probably not. Re-analysis of ATAC-seq from A485-treated embryos showed that global H3K27ac loss only modestly reduced the gain in accessibility at ZGA, including at dependent-gene promoters.", "kw": ["ATAC-seq", "chromatin accessibility"], "info": "The authors note this matches earlier results in Drosophila ZGA.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Why are CBP/P300-independent genes still expressed after inhibition?", "a": "A485 and JQ1 also lowered Pol II at independent genes, but much less than at dependent genes, and their expression stayed largely unchanged. This is true even though CBP/P300 does act at their promoters (H3K27ac is lost there).", "kw": ["Pol II occupancy"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Which marks are enriched at CBP/P300-independent promoters?", "a": "In normal late blastula, H3K9ac, H4K16ac and H3K14ac are higher at independent than at dependent promoters. Their correlation with RNA change after A485 was 0.38, 0.4 and 0.27, compared with 0.2 for H3K27ac.", "kw": ["H3K9ac", "H4K16ac", "H3K14ac"], "info": "Wilcoxon p values: below 6.1 × 10^-15 for H3K9ac, below 1.1 × 10^-21 for H4K16ac, and below 1.1 × 10^-10 for H3K14ac. These ChIP-seq experiments had no spike-in.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Which HATs might activate housekeeping genes?", "a": "GCN5 (kat2a), MOF (kat8) and HBO1 (kat7b). These non-CBP/P300 HATs write H3K9ac, H4K16ac and H3K14ac and are expressed in early medaka development.", "kw": ["GCN5", "MOF", "HBO1"], "info": "This is a correlation only. None of these HATs was inhibited in the study.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Does the same pattern hold in zebrafish and mouse?", "a": "In zebrafish, H3K9ac and H4K16ac were enriched at independent promoters but not dependent ones. In mouse there was no such correlation, mouse dependent genes were not developmental genes, and the medaka developmental genes were not expressed at mouse ZGA.", "kw": ["zebrafish", "mouse", "re-analysis"], "info": "The authors suggest that in mammalian ZGA another mechanism activates the CBP/P300-independent genes.", "concl": ""}, {"type": "qa", "section": "Results - non-CBP/P300 acetylation at independent genes", "q": "Are different transcription factors linked to the two gene groups?", "a": "Motif analysis found PRDM9, HOXB13 and SOX15 motifs specific to dependent promoters, and Twist2, Tcf12, Olig2 and Neurod2 motifs (CAGCTG) specific to independent promoters. This supports a model where different TF groups recruit different HATs.", "kw": ["motif enrichment", "AME", "JASPAR2022"], "info": "Thresholds: log2 fold change of p value > 1 and log2 fold change of enrichment > 0.1. Earlier zebrafish work showed pioneer TFs recruit HATs at ZGA.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "Is H3K27ac per cell higher at ZGA than at later stages?", "a": "Yes. Quantitative Western blots with equal cell numbers showed H3K27ac 2 to 3 times higher at late blastula than at late neurula, 6-somite, 24-somite or in fibroblasts. H3K18ac, also made by CBP/P300, showed the same ZGA-specific peak.", "kw": ["quantitative Western blot", "H3K18ac"], "info": "Cell number was estimated from relative genome copy number by qPCR. H3K9ac, H4K16ac, H3K4me2 and H3K4me3 showed no ZGA-specific accumulation. In zebrafish, H3K27ac was 2 to 3 times higher at sphere (4 hpf) than at bud (10 hpf).", "concl": "CBP/P300 activity is specifically boosted during ZGA."}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "Which explanations for the enhanced CBP/P300 activity were ruled out?", "a": "CBP/P300 expression is similar between ZGA and later stages in medaka and zebrafish, and protein levels are similar in zebrafish. TSA treatment caused strong H3K27ac deposition, so HDACs are active at ZGA. Acetyl-CoA is probably not limiting, because acetylations made by other HATs are not raised.", "kw": ["TSA", "HDAC", "acetyl-CoA"], "info": "TSA was used at 20 or 100 nM. The acetyl-CoA argument is indirect; acetyl-CoA was not measured.", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "What is H3.3S31ph and how does it behave at ZGA?", "a": "It is phosphorylation of serine 31 on histone variant H3.3, made by kinases such as Chk1, and it is known to boost CBP/P300 activity. Per cell, H3.3S31ph was much higher at late blastula than at late neurula or 6-somite, and ChIP-seq showed it at H3K27ac promoter peaks of both gene groups.", "kw": ["H3.3S31ph", "Chk1"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - CBP/P300 activity is enhanced at ZGA", "q": "What happened when chek1 was overexpressed?", "a": "Injecting chek1 mRNA increased H3.3S31ph and H3K27ac and activated CBP/P300-dependent genes early, at late morula (before ZGA). 577 genes went up and 90 down; 429 of the upregulated genes were CBP/P300-dependent and 103 were independent.", "kw": ["chek1", "precocious ZGA"], "info": "chek1 mRNA was injected at 20 ng/µL, with n = 7 Western blot replicates. In PCA, Chk1-injected morulae moved toward post-ZGA stages.", "concl": "Proposed model: a Chk1-driven rise in H3.3S31ph boosts CBP/P300 activity during ZGA."}, {"type": "qa", "section": "Discussion", "q": "Why would developmental genes depend on H3K27ac in particular?", "a": "H3K27ac is the acetylation that directly regulates both H3K27me3, which it opposes, and H3K4 methylation, which it promotes at some promoters. That makes it suited to the spatiotemporal control of developmental genes. Here, losing H3K27ac led to H3K27me3 gain and H3K4me2 loss.", "kw": ["H3K27ac", "H3K27me3 antagonism"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why would housekeeping genes use several HATs?", "a": "Housekeeping genes must stay robustly expressed throughout life, so their activation should not depend on CBP/P300 alone. Inhibiting several HATs at once would be needed to test this in future work.", "kw": ["housekeeping genes", "HAT redundancy"], "info": "This fits cell-line data where A485-sensitive genes are cell-type specific and insensitive genes are broadly expressed. In Drosophila, early developmental genes are CBP-dependent and late ones depend on other HATs.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why might boosted CBP/P300 activity be essential in non-mammalian ZGA?", "a": "It allows rapid, simultaneous gene activation across the genome, unlike the asynchronous activation of selected genes in differentiated cells. Chk1 activity is tightly timed at the mid-blastula transition, so embryos may couple epigenetic activation to developmental timing through H3.3S31ph.", "kw": ["mid-blastula transition", "developmental timing"], "info": "The authors note that Chk1 overexpression had already been shown to start ZGA early and partially in medaka and zebrafish.", "concl": "Non-mammalian embryos may achieve ZGA by coupling epigenetic activation with developmental timing."}, {"type": "qa", "section": "Discussion", "q": "How do the authors reconcile the H3K4me2/3 result with cell-line studies?", "a": "Cell-line studies showed H3K4me3 is needed for Pol II initiation and pause-release while genes stay active, not for activating silenced genes. H3K4me2/3 may matter for maintaining activity during differentiation or gastrulation, or for activation at later stages when CBP/P300 activity is much lower.", "kw": ["H3K4me3", "maintenance"], "info": "The authors say this is the first demonstration that H3K4me2/3 is dispensable for gene activation during ZGA. They call for further work on H3K4 methylation in early development.", "concl": ""}, {"type": "qa", "section": "Methods - Animals and treatments", "q": "Which fish strains and conditions were used?", "a": "Medaka d-rR strain raised at 28 °C, and zebrafish RW strain raised at 28.5 °C. Inhibitors were applied to dechorionated medaka embryos in Yamamoto ringer from the four-cell stage (2 hpf) to late blastula (8.5 hpf).", "kw": ["medaka d-rR", "zebrafish RW"], "info": "Concentrations: A485 0.5 to 20 µM, SGC-CBP30 10 µM, TSA 20 or 100 nM, JQ1 40 µM, MM-102 100 µM. Injected at one-cell stage: KDM5B mRNA 700 ng/µL, chek1 mRNA 20 ng/µL, FLAG-ep300a mRNA 280 ng/µL, alpha-amanitin 10 ng/µL.", "concl": ""}, {"type": "qa", "section": "Methods - Animals and treatments", "q": "Which cell lines were used and for what?", "a": "A medaka fibroblast line, cultured at 30 °C with 10% FBS, served as the differentiated-cell comparison. The zebrafish fibroblast line BRF41 (RIKEN RCB0804), cultured at 33 °C with 15% FBS, supplied spike-in chromatin.", "kw": ["BRF41", "fibroblast"], "info": "Both lines were grown in L-15 medium.", "concl": ""}, {"type": "qa", "section": "Methods - Sequencing", "q": "How were RNA-seq and ChIP-seq libraries made?", "a": "RNA-seq: total RNA extracted with ISOGEN and RNeasy, rRNA removed with RiboMinus Eukaryote System v2 (1 µg input), libraries made with KAPA RNA HyperPrep. ChIP-seq: medaka chromatin mixed with zebrafish BRF41 spike-in chromatin, libraries made with KAPA Hyper Prep. Both were sequenced on Illumina HiSeq1500 or HiSeqX.", "kw": ["spike-in ChIP-seq", "RNA-seq"], "info": "No spike-in was used for Pol II Ser2P, H3K9ac, H4K16ac, H3K14ac or H3.3S31ph ChIP-seq.", "concl": ""}, {"type": "qa", "section": "Methods - Data processing", "q": "How were RNA-seq data processed and DEGs defined?", "a": "Only the first 50 bp of forward reads were used. Reads were trimmed with Trimmomatic, aligned with STAR to medaka HdrR or zebrafish GRCz11, and filtered to MAPQ of at least 20 with SAMtools; DESeq2 gave RPKM and adjusted p values. Medaka DEGs: RPKM > 1.5, adjusted p < 0.01 and |log2FC| > 1.", "kw": ["STAR", "DESeq2", "Trimmomatic"], "info": "Software versions are not given. Zebrafish dependent genes: log2FC below −2 after normalizing to mitochondrial reads. Mouse: fastp, STAR, RSEM against mm10, FPKM > 2. PCA used the 500 most variable genes in scikit-learn.", "concl": ""}, {"type": "qa", "section": "Methods - Data processing", "q": "How were ZGA, Maternal and Pure ZGA genes defined?", "a": "ZGA genes are genes upregulated at late blastula compared with late morula. Maternal genes have RPKM > 5 at late morula. Maternal-ZGA genes are maternal genes that are also ZGA genes; the remaining ZGA genes are Pure ZGA.", "kw": ["ZGA genes", "maternal genes"], "info": "Paternal ZGA genes came from paternal reads in earlier hybrid medaka data: normal versus alpha-amanitin-injected embryos, log2FC > 1.", "concl": ""}, {"type": "qa", "section": "Methods - Data processing", "q": "How were H3K27ac peaks called?", "a": "With macs2 callpeak using -g 600000000 -q 0.01 --keep-dup all --nomodel. Peaks with fold change above 6.5 were kept and merged with bedtools merge -d 150, then annotated with Homer annotatePeaks. Peaks within 3 kb of a TSS counted as promoter-proximal.", "kw": ["macs2", "Homer", "bedtools"], "info": "ChIP reads were extended by 200 bp, and bigwig files were scaled by the spike-in factor. Replicates were checked by Pearson correlation in 10 kb bins (deepTools multiBigwigSummary). ATAC-seq peaks used fold change > 4, and differential accessibility was called with DiffBind (p < 0.05, |log2FC| > 1).", "concl": ""}, {"type": "qa", "section": "Methods - Data processing", "q": "Which statistical tests were used?", "a": "Normality was tested with Shapiro-Wilk and equal variance with an F-test. If both passed, a two-sided Student t test was used; if only the F-test failed, Welch's t test; otherwise a two-sided Wilcoxon rank-sum test.", "kw": ["Wilcoxon", "Welch's t test"], "info": "GO analysis was done with PANTHER. Data are in DDBJ under PRJDB18921.", "concl": ""}, {"type": "note", "section": "Results - non-CBP/P300 acetylation at independent genes", "text": "Housekeeping genes are only linked to GCN5, MOF and HBO1 through correlation. No HAT other than CBP/P300 was inhibited, so the authors' proposed test of inhibiting several HATs at once is still open."}, {"type": "note", "section": "Discussion", "text": "Some figure references in the Discussion do not match the figures. Enhanced CBP/P300 activity and H3.3S31ph are cited as Fig. 5A-G and 5I,J, but the data are in Fig. 6. BRD4 and Pol II are cited as Fig. 3D-F, but the data are in Fig. 4. Check the correct panels when going back to the figures."}, {"type": "note", "section": "Discussion", "text": "Is H3K4me2/3 needed later, for keeping genes active during gastrulation or differentiation, when CBP/P300 activity drops? Worth following up, along with whether the CBP/P300 split between developmental and housekeeping genes is the same in other teleosts such as Astyanax."}], "key": "drerio/Fukushima_2025_NatCommun_histone_marks_ZGA_teleost", "shared": "Damir · 2026", "preprint": "", "tags": [], "source_note": ""}, {"id": "CampoBes_2026", "title": "Zygotic genome activation is timed by the egg DNA-to-cytoplasm ratio across animals", "category": "ZGA & early embryo", "link": "https://doi.org/10.64898/2026.04.16.718233", "note": "", "source_pdf": "papers/drerio/CampoBes_2026_bioRxiv_ZGA_timing_DNA_cytoplasm_ratio.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is zygotic genome activation (ZGA) and why study it across many animals?", "a": "ZGA is the shift in gene expression control from maternally deposited products to newly transcribed RNA from the embryo's own genome. It is essential and universal, but it is poorly understood outside a few model species.", "kw": ["ZGA", "maternal-to-zygotic transition"], "info": "They built a transcriptomic atlas of early embryogenesis for 61 animal species from 13 phyla. They used one unified computational framework to infer ZGA timing.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What are the two main findings of the paper?", "a": "ZGA onset varies widely across animals, but the ratio between genome size and egg cytoplasmic volume (a proxy for the nuclear-to-cytoplasmic ratio) robustly predicts when it begins. Zygotic genes also differ from maternal transcripts in genomic architecture, function and evolutionary conservation.", "kw": ["DNA-to-cytoplasm ratio", "N/C ratio"], "info": "", "concl": "ZGA follows a conserved molecular logic even though its transcriptomic output is flexible."}, {"type": "qa", "section": "Introduction", "q": "What are the 'minor' and 'major' ZGA waves, and how does the paper define ZGA?", "a": "ZGA is traditionally thought to start with transcription of a few loci (the minor wave) and then progress to widespread zygotic transcription (the major wave). Recent work suggests the two waves form a continuum, so the authors use 'ZGA' to mean the period of large-scale activation of the zygotic genome.", "kw": ["minor wave", "major wave"], "info": "ZGA is essential for later cell fate determination and morphogenesis. Defects in ZGA lead to developmental arrest.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How much does ZGA timing differ between classic model organisms?", "a": "Mice and C. elegans start large-scale zygotic transcription very early, after 1 and 3 cleavage cycles. Frogs, zebrafish and fruit flies start much later, after about 9, 10 and 14 cell cycles.", "kw": ["cell cycle", "zebrafish"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which candidate mechanisms had been proposed to set ZGA timing?", "a": "The candidates are the DNA-to-cytoplasm ratio (related to the nuclear-to-cytoplasmic volume ratio), cell cycle lengthening, developmental time, and translation of maternal transcripts. These are partly interconnected and have had varying impacts in different model systems.", "kw": ["N/C ratio", "cell cycle lengthening"], "info": "It was unclear how far these factors are shared across animals or specific to particular lineages.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was known about the genes activated at ZGA before this study?", "a": "In mice, zebrafish and fruit flies, the earliest transcribed zygotic genes are on average shorter and evolutionarily younger, and the gene sets overlap very little between the three species. Some studies had compared ZGA and maternal genes between closely related species (mammals, flies, annelids).", "kw": ["zygotic genes", "gene age"], "info": "Gap: knowledge was limited to a small set of model organisms, which prevented robust evolutionary conclusions about ZGA timing and about which genes are activated.", "concl": ""}, {"type": "qa", "section": "Results - Identification of ZGA timing across 61 species", "q": "What dataset did they assemble?", "a": "A time-course transcriptomic dataset for 61 animal species from 13 phyla, spanning more than 700 million years of divergence since the ctenophore-mammal common ancestor. For most species it has eight early stages, from oocyte or 1-cell to post-gastrulation.", "kw": ["comparative transcriptomics", "bulk RNA-seq"], "info": "23 species were sequenced in-house, often to fill phylogenetic gaps, and 38 came from public sources. Samples were bulk RNA-seq with either ribo-depletion or polyA selection. Most data for this study used one ribo-depletion protocol with multi-species pooling to minimize batch effects.", "concl": ""}, {"type": "qa", "section": "Results - Identification of ZGA timing across 61 species", "q": "How was the 'maternal' (MAT) stage defined?", "a": "The earliest sampled stage in each species, usually the oocyte or zygote, was taken as the MAT stage. The assumption is that it most closely captures the maternally deposited transcriptome.", "kw": ["MAT stage"], "info": "Reads were mapped with STAR to each species' genome, and TPM values plus intron and exon read counts were extracted for every protein-coding gene.", "concl": ""}, {"type": "qa", "section": "Results - Identification of ZGA timing across 61 species", "q": "Which three metrics did they use to detect the onset of large-scale zygotic transcription?", "a": "(i) Abrupt changes in transcriptome structure in a PCA of the most variable genes. (ii) The appearance of strongly upregulated genes that were absent or weak at the MAT stage. (iii) An increase in the intron/exon read count ratio, which indicates nascent transcription.", "kw": ["PCA", "intron/exon ratio", "nascent transcription"], "info": "Each metric was scaled to a maximum of 1 within each species. The three were then combined to call the ZGA stage automatically as the first stage with evidence of substantial new transcription.", "concl": ""}, {"type": "qa", "section": "Results - Identification of ZGA timing across 61 species", "q": "How variable is ZGA onset across the 61 species?", "a": "Onset ranged from 1 to 14 cell cycles. Most mammals and nematodes started within the first 2 or 3 cleavages, while many insects and non-mammalian vertebrates activated much later. Half of the species (31/61) had ZGA around cycles 3 to 5.", "kw": ["ZGA timing"], "info": "ZGA timing was more consistent within clades and had a significant phylogenetic signal (Pagel's lambda = 0.99, Blomberg's K = 0.92, P <= 1e-4).", "concl": ""}, {"type": "qa", "section": "Results - Identification of ZGA timing across 61 species", "q": "Could they reconstruct the ancestral ZGA timing for animals?", "a": "Not confidently. Ancestral state reconstruction put the root at about cell cycle 6, but the 95% confidence interval was wide (3.7 to 8.3) because the trait is so variable.", "kw": ["ancestral state reconstruction"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - The egg DNA-to-cytoplasm ratio is a universal timer of ZGA", "q": "Is ZGA timing in cell cycles inversely related to developmental speed in hours?", "a": "No. Across all species there was no significant correlation between ZGA timing in cell cycles and in hours (adjusted R2 OLS = 0.017, P PGLS = 0.916). Analyzed separately, slow and fast developers showed a mild positive correlation (slow: R2 = 0.236, P PGLS = 0.008; fast: R2 = 0.221, P PGLS = 0.205).", "kw": ["developmental time", "PGLS"], "info": "The expected inverse pattern is that fast developers (frogs, zebrafish, flies) have many quick cycles without G phase before ZGA, while slow mammals have few cycles with G phase. But some fast developers (annelids, nematodes) activate after only a couple of cycles, and the slow-developing lamprey activates after 8 cycles and 77 hours.", "concl": ""}, {"type": "qa", "section": "Results - The egg DNA-to-cytoplasm ratio is a universal timer of ZGA", "q": "How does ZGA timing relate to gastrulation?", "a": "In 58 of 61 species, ZGA happens before gastrulation begins. The exceptions are the fast-developing Oikopleura dioica, Brachionus plicatilis and Hydractinia symbiolongicarpus, where the first signs of gastrulation appear around the same time as ZGA.", "kw": ["gastrulation", "mid-blastula transition"], "info": "The authors reasoned that the mid-blastula transition and gastrulation need zygotic control, so ZGA must come first.", "concl": "Gastrulation may set an upper time limit on ZGA, but it is unlikely to explain when ZGA starts."}, {"type": "qa", "section": "Results - The egg DNA-to-cytoplasm ratio is a universal timer of ZGA", "q": "Which ecological and developmental traits were associated with ZGA onset?", "a": "Ecological traits were not associated after phylogenetic correction (internal vs external fertilization, aquatic vs terrestrial habitat; phylANOVA P > 0.05). Cleavage type (holoblastic vs meroblastic) and yolk distribution (isolecithal vs non-isolecithal) were both significant (P = 1e-04 each). Species with little, evenly distributed yolk and holoblastic cleavage had much earlier ZGA (median 4 vs 9 to 10 cell cycles).", "kw": ["phylANOVA", "isolecithal", "holoblastic cleavage"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - The egg DNA-to-cytoplasm ratio is a universal timer of ZGA", "q": "Which quantitative trait correlated with ZGA onset on its own?", "a": "Egg volume showed a robust positive correlation (adjusted R2 OLS = 0.491, P PGLS = 8.4e-7). Genome size alone was not correlated (adjusted R2 OLS = -0.003, P PGLS = 0.196).", "kw": ["egg volume", "genome size"], "info": "Most other genomic traits were not significant: GC%, number of CDS, exons per CDS, total CDS length, number of genes, total, mean gene and mean intron length. Because egg size mainly reflects cytoplasmic volume, this pointed to the amount of cytoplasm relative to nuclear content.", "concl": ""}, {"type": "qa", "section": "Results - The egg DNA-to-cytoplasm ratio is a universal timer of ZGA", "q": "How well does the egg DNA-to-cytoplasm ratio predict ZGA timing?", "a": "The log of genome size divided by egg volume showed a strong negative correlation with ZGA timing in cell cycles (adjusted R2 OLS = 0.753, P PGLS = 2.6e-11). This was stronger than egg volume alone, even though genome size by itself was not correlated.", "kw": ["DNA-to-cytoplasm ratio", "N/C ratio"], "info": "The correlation stayed robust in subsets: ribo-depletion vs polyA data, in-house vs public data, and slow vs fast developers. For fast developers the nlme PGLS fit failed, but the c
