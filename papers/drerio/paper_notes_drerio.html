<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2632; --muted:#5A6878; --rule:#D3DAE1; --hover:#E3E8ED;
  --focus:#2F6FB3; --good:#2E7D4F; --again:#B4562E;
  --c-mex:#C9DAF8; --c-mex-d:#3D6DBF;
  --c-emb:#FCE5CD; --c-emb-d:#C47A2C;
  --c-gen:#D9EAD3; --c-gen-d:#4E8A3E;
  --c-dam:#EAD1DC; --c-dam-d:#A3527A;
  --c-oth:#D8D1EE; --c-oth-d:#6B57B0;
  --c-ali:#FFF2CC; --c-ali-d:#B08A12;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
    --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
    --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
    --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
    --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
  --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
  --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
  --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
  --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--rule);padding:22px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{padding:0 22px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0;letter-spacing:-.01em;cursor:pointer}
.brand small{color:var(--muted);font-size:.82rem}
.search{margin:0 22px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px}
.cat{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 10px 4px 8px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist{list-style:none;margin:0;padding:0 12px}
.pitem{display:grid;grid-template-columns:6px 1fr auto;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 10px 10px 8px;align-items:start}
.pitem:hover{background:var(--hover)}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--rule)}
.pitem .tab{align-self:stretch;border-radius:3px}
.pitem b{display:block;font-weight:600;font-size:.92rem}
.pitem span.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.pitem .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.theme{margin:auto 22px 0;align-self:flex-start;background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--muted)}

main{padding:40px clamp(20px,5vw,64px) 80px;max-width:900px;width:100%}
.mtop{display:none}
.phead{border-left:6px solid var(--cd);padding-left:20px;margin-bottom:28px}
.phead .who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.9rem}
.tag{background:var(--cl);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.8rem}
.shared{border:1px solid var(--rule);border-radius:6px;padding:1px 8px;font-size:.8rem;color:var(--muted)}
.badge{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:600}
.star{color:var(--cd);margin-left:4px}
.phead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;letter-spacing:-.015em;margin:10px 0 12px;max-width:34ch}
.phead .srcnote{font-size:.88rem;color:var(--again);border-left:3px solid var(--again);padding:2px 0 2px 10px;margin:8px 0 6px;max-width:68ch}
.phead .note{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 4px;max-width:62ch}
.phead a.open{font-size:.9rem;font-weight:500;color:var(--cd);text-decoration:none;border-bottom:1px solid currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 26px}
.secnav button{text-align:left;background:none;border:0;border-bottom:1px dashed var(--rule);padding:2px 0;margin-right:12px;font-size:.84rem;color:var(--muted)}
.secnav button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.prog{font-size:.85rem;color:var(--muted);margin-left:auto}

h3.sec{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.qa{border-bottom:1px solid var(--rule)}
.qa:last-child{border-bottom:0}
.qbtn{display:grid;grid-template-columns:1fr auto;gap:16px;width:100%;text-align:left;background:none;border:0;padding:14px 0;font-weight:500;font-size:1rem;line-height:1.4}
.qbtn:hover .qt{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.qmeta{display:flex;gap:8px;align-items:center;padding-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
.qa.open .chev{transform:rotate(90deg)}
.known{font-size:.72rem;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.novel{font-size:.72rem;color:var(--cd);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.ans{display:none;padding:0 0 18px}
.qa.open .ans{display:block;animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ans p.a{font-family:var(--serif);font-size:1.04rem;line-height:1.65;margin:0 0 12px;max-width:66ch}
.extra{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;font-size:.92rem;margin:0 0 12px;max-width:72ch}
.extra dt{color:var(--muted);font-size:.84rem;padding-top:2px}
.extra dd{margin:0;line-height:1.55}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:var(--cl);border:0;border-radius:6px;padding:2px 9px;font-size:.8rem}
.kw:hover{outline:1px solid var(--cd)}
.notep{font-family:var(--serif);font-style:italic;color:var(--muted);padding:12px 0 12px 14px;border-left:2px solid var(--rule);margin:8px 0}
.empty{font-family:var(--serif);color:var(--muted);padding:30px 0;max-width:52ch}
.comments{margin-top:44px}
.comments textarea{width:100%;min-height:140px;resize:vertical;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);font-family:var(--serif);font-size:1rem;line-height:1.6}
.comments textarea[readonly]{opacity:.8}
.cmtstatus{font-size:.82rem;color:var(--muted);margin-top:6px}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:2px}

/* home */
.home h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em;margin:0 0 6px}
.home .lead{color:var(--muted);margin:0 0 34px;max-width:58ch}
.grp{margin-bottom:30px}
.grp h3{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;margin:0 0 8px}
.prow{display:grid;grid-template-columns:120px 1fr 120px;gap:16px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:12px 4px;text-align:left}
.prow:hover{background:var(--hover)}
.prow b{font-weight:600;font-size:.92rem}
.prow span{font-family:var(--serif);font-size:.95rem;line-height:1.35}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cd)}
.barlab{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* search results */
.rgroup{margin-bottom:26px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0 0 4px}
.rgroup h3 button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}

/* flashcards */
.study{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.study.on{display:flex}
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stop .ttl{font-weight:600}
.stop .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stop .x{margin-left:auto}
.track{height:4px;background:var(--rule);border-radius:2px;margin:14px 0 0;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stage{flex:1;display:grid;place-items:center;perspective:1600px;padding:24px 0;min-height:0}
.card{width:min(720px,100%);height:min(440px,100%);position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:18px;border:1px solid var(--rule);border-top:10px solid var(--cd);padding:28px clamp(20px,4vw,40px);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .src{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.face .q{font-family:var(--serif);font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.3;font-weight:500;margin:auto 0;letter-spacing:-.01em}
.face .bq{font-size:.9rem;color:var(--muted);margin:12px 0 10px}
.face .ba{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.25rem);line-height:1.6;margin:0 0 14px}
.face .hint{font-size:.82rem;color:var(--muted);text-align:center}
.sctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.again{color:var(--again);border-color:currentColor}
.btn.good{color:var(--good);border-color:currentColor}
.done{text-align:center;font-family:var(--serif)}
.done h3{font-size:1.8rem;font-weight:500;margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 20px}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

@media (max-width:820px){
  .shell{display:block}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);height:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  body.drawer .scrim{display:block}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px;align-items:center;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .mtop b{font-family:var(--serif);font-weight:600}
  main{padding-top:24px}
  .prow{grid-template-columns:1fr;gap:6px}
  .extra{grid-template-columns:1fr;gap:2px}
  .extra dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const DATA = {"page": {"label": "Danio rerio", "folder": "drerio", "updated": "2026-11-19"}, "legend": ["ZGA & early embryo", "Embryo development & nutrition", "Toxicology & exposures", "Genomic resources"], "catKeys": {"ZGA & early embryo": "mex", "Embryo development & nutrition": "gen", "Toxicology & exposures": "emb", "Genomic resources": "oth"}, "papers": [{"id": "Xu_2025", "title": "Epigenetic regulation in early embryo development: from zygotic genome activation to the first lineage specification", "category": "ZGA & early embryo", "link": "https://doi.org/10.1016/j.tig.2025.05.005", "note": "", "source_pdf": "papers/drerio/Xu_2025_TrendsGenet_epigenetics_ZGA_to_lineage.txt", "items": [{"type": "qa", "section": "Abstract", "q": "What kind of paper is this and where was it published?", "a": "It is a review by Xu R, Li Y, Wu Y, Liu X and Gao S, published in Trends in Genetics in 2025.", "kw": ["review"], "info": "PMID 40480920. These notes are based only on the abstract and metadata because the full text was not accessible.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What role does epigenetic regulation play in early embryo development?", "a": "It plays a pivotal role in orchestrating early embryo development and guides the transition from a totipotent zygote to a complex multicellular organism.", "kw": ["totipotency", "zygote"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which developmental window does the review focus on?", "a": "The dynamic landscape of epigenetic reprogramming during preimplantation embryo development, from zygotic genome activation (ZGA) to the first lineage specification.", "kw": ["zygotic genome activation", "preimplantation embryo", "lineage specification"], "info": "The window is taken from the title and the keywords. The abstract does not say which species are covered. The MeSH terms list Humans and Animals.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which epigenetic layers does the review cover?", "a": "DNA methylation, histone modifications, higher-order chromatin, transposable elements (TEs) and RNA modifications.", "kw": ["DNA methylation", "histone modifications", "transposable elements"], "info": "The review stresses how these layers interact with each other, not each one on its own.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the goal of epigenetic reprogramming in the early embryo, according to the review?", "a": "Resetting the parental epigenome, which comes about through the interplay of DNA methylation, histone modifications, higher-order chromatin, TEs and RNA modifications.", "kw": ["epigenetic reprogramming", "parental epigenome"], "info": "The abstract gives no details about the specific mechanisms.", "concl": "Resetting the parental epigenome depends on several epigenetic layers acting together."}, {"type": "qa", "section": "Abstract", "q": "In which artificial settings does the review discuss abnormal epigenetic reprogramming?", "a": "In somatic cell nuclear transfer (SCNT) and in assisted reproductive technologies (ART).", "kw": ["SCNT", "ART"], "info": "The abstract does not say which specific defects are described.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Does the review link epigenetic defects to disease?", "a": "Yes. It summarizes clinical disorders that result from abnormal epigenetic reprogramming and discusses possible therapeutic strategies.", "kw": ["clinical disorders"], "info": "The abstract does not name the disorders or the therapeutic strategies.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the overall aim of the review?", "a": "To clarify the role of epigenetic modifications in developmental defects and to offer perspectives that help both developmental biology research and the clinical use of assisted reproduction.", "kw": ["developmental defects"], "info": "The review also discusses future research directions.", "concl": "The review connects basic epigenetic reprogramming in early embryos with clinical problems in ART and SCNT."}, {"type": "note", "section": "Abstract", "text": "Get the full text to check which species are covered, especially whether zebrafish or other non-mammalian models are discussed alongside the mammalian preimplantation embryo, and how TEs and RNA modifications act at ZGA."}], "key": "drerio/Xu_2025_TrendsGenet_epigenetics_ZGA_to_lineage", "shared": "Damir · 2026", "preprint": "", "tags": [], "source_note": "Not the full paper: no access to the full text, so these notes are based only on the publicly available abstract and metadata (PubMed). Details from the main text and figures are missing."}, {"id": "Riddle_2021", "title": "Fish models for investigating nutritional regulation of embryonic development", "category": "Embryo development & nutrition", "link": "https://doi.org/10.1016/j.ydbio.2021.03.012", "note": "", "source_pdf": "papers/drerio/Riddle_2021_DevBiol_fish_nutrition_embryo_development.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this review address?", "a": "Maternal diet clearly affects fetal development, but it is not fully understood how nutrients such as lipids and vitamins change developmental programs. Over recent decades, developmental biology has focused mostly on the spatiotemporal regulation and function of genes.", "kw": ["maternal nutrition"], "info": "This is a review in a Developmental Biology special issue on nutritional, hormonal and metabolic drivers of development. It contains no new experimental data, so it has no Methods or Results sections.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Why are fish embryos good systems for studying nutrition in development?", "a": "Most fish eggs develop outside the mother and depend on a finite amount of yolk. The embryo is therefore a closed system that is easy to analyse biochemically, visualise and manipulate.", "kw": ["yolk", "closed system"], "info": "This setup lets researchers study the role of nutrients in tissue specification, organogenesis and growth.", "concl": "Natural variation in yolk composition across fish species may be linked to their different developmental strategies."}, {"type": "qa", "section": "Abstract", "q": "Which three fish species does the review highlight, and why each one?", "a": "Zebrafish (Danio rerio) for its many molecular tools and nutritional datasets. The African killifish (Nothobranchius furzeri) for its annual life cycle, which lets you study developmental timing and lifespan. The Mexican tetra (Astyanax mexicanus) because you can directly compare morphotypes adapted to different nutritional landscapes.", "kw": ["Danio rerio", "Nothobranchius furzeri", "Astyanax mexicanus"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What happens to the fetus when maternal nutrition is poor?", "a": "Micronutrient deficiencies cause defects in neural tube closure, bone mineralization and immune system development. Caloric deficiency restricts fetal growth and is linked to low birth weight and a predisposition to diabetes, obesity and heart disease.", "kw": ["malnutrition"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is maternal nutrition hard to study in humans and mice?", "a": "Human studies need large cohorts and long timeframes, because environmental and genetic variables cannot be controlled and gestation is long. Mouse studies are costly, and nutrient use in the mouse embryo is hard to control and visualise.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What practical advantages do fish offer for nutrition research?", "a": "Fish produce many embryos, sometimes continuously. Egg composition can be changed through the maternal diet or by injection, and embryos can be immersed in chemicals for large-scale screens. Embryos are transparent and develop quickly, and some species are very short lived.", "kw": ["CRISPR/Cas9", "chemical screening"], "info": "Other advantages: many sequenced genomes with well-understood phylogeny, efficient CRISPR/Cas9 editing in diverse species, existing aquaculture research on fecundity and egg quality, and embryonic development and gene function that are fairly well conserved with humans.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the common problem that all teleost fishes face?", "a": "Teleosts comprise more than 26,000 species. Most of them produce eggs that develop outside the mother and rely on yolk until the larvae can feed. Although their diets differ greatly, all of them must make yolk that can support the growth of the next generation.", "kw": ["Teleostei"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What is fish egg yolk made of?", "a": "Mostly proteins, lipids and water, with smaller amounts of carbohydrates and vitamins. These nutrients accumulate during oogenesis.", "kw": ["yolk", "oogenesis"], "info": "Yolk concentrations of lipids, fat-soluble vitamins, inorganic phosphate, iron, calcium and magnesium vary both within and between species.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "How is vitellogenin production switched on?", "a": "Environmental cues such as temperature or diet cause the ovary to release estrogen. In the liver, estrogen binds the estrogen receptor, which interacts with estrogen response elements (EREs) in the promoters of vitellogenin (vtg) genes.", "kw": ["vitellogenin", "estrogen response element"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What is vitellogenin, and how does it get into the oocyte?", "a": "Vitellogenin (Vtg) is a high molecular weight lipoprotein made of polypeptide homodimers that carry carbohydrate and lipid cargo. The lipids carry minerals, fat-soluble vitamins and hormones. Vtg travels from the liver to the ovary in the blood and enters oocytes by receptor-mediated endocytosis through the Vtg receptor (VTGR).", "kw": ["vitellogenin", "VTGR", "receptor-mediated endocytosis"], "info": "Oocytes can also take up lipids from circulating VLDL. Fluorescently labelled VLDL lipids accumulate in the oocyte but the VLDL proteins do not. This suggests that extracellular lipases release free fatty acids, which enter by passive diffusion or through lipid transporters.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What is vitellogenesis?", "a": "Vitellogenesis is the process of Vtg synthesis and the accumulation of nutrients during oocyte growth.", "kw": ["vitellogenesis"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "How is internalized vitellogenin broken down?", "a": "In two steps. During oocyte growth, cathepsins in lower-pH vesicles cut Vtg at specific sites into five yolk proteins: lipovitellin heavy chain (LvH), phosvitin (Pv), lipovitellin light chain (LvL), beta-prime component and C-terminal component (Ct). During oocyte maturation, some of these domains are cut further into free amino acids.", "kw": ["cathepsin", "lipovitellin", "phosvitin"], "info": "Free amino acids and vesicular pH create an osmotic effect that draws water into the oocyte through aquaporins. This hydrates the egg and makes it buoyant. LvH and LvL carry lipids that contain minerals and fat-soluble vitamins.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "What types of Vtg genes do teleosts have?", "a": "Teleosts have two A-type paralogs (VtgAa and VtgAb) that contain all five yolk protein domains. They also have one incomplete C-type Vtg that contains only the LvL and LvH domains. Duplications and deletions have produced variation in Vtg gene number and sequence.", "kw": ["VtgAa", "VtgAb", "VtgC"], "info": "Zebrafish have eight vtg genes, and some lack the beta-prime and Ct domains. In rainbow trout, one vtg gene is duplicated twenty times in tandem. At the time of writing, the vtg repertoires of African killifish and Mexican tetra had not been described.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "Why might Vtg sequence evolution matter for development?", "a": "The Vtg sequence determines which yolk proteins are made and how strongly they bind lipids and fat-soluble vitamins. It could therefore change embryo physiology, for example membrane properties or the amount of vitamin-derived signalling molecules.", "kw": ["vitellogenin evolution"], "info": "Regulatory changes in Vtg promoters could change Vtg synthesis rates. Different combinations of Vtg receptors in endocytosed vesicles might route them to specific yolk granules. That could change the order in which granules are used, and with it tissue growth or signalling.", "concl": "Vtg sequence evolution drives differences in yolk nutrition. Whether Vtg evolution parallels changes in developmental strategy is still open."}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "Which yolk nutrients vary most within and between species?", "a": "Nutrients derived from carotenoids. Carotenoids are yellow to orange pigments made by plants, fungi, algae and bacteria. Animals convert them into 11-cis-retinal and vitamin A for vision, and into retinoic acid (RA), which regulates gene expression.", "kw": ["carotenoids", "vitamin A", "retinoic acid"], "info": "In humans, vitamin A deficiency can cause childhood blindness, and excess vitamin A is teratogenic. In fish, RA is involved in symmetry formation, heart development, hematopoiesis, bone and tooth formation, and neural crest migration.", "concl": ""}, {"type": "qa", "section": "Introduction - oogenesis and yolk composition", "q": "How does egg carotenoid content relate to egg viability?", "a": "The relationship between carotenoid level and hatching rate is non-linear. There appears to be a critical level for viability, above 1 to 3 micrograms per gram.", "kw": ["carotenoids", "hatching rate"], "info": "This comes from older work across several species, reviewed by Craik (1985).", "concl": "Species differences in carotenoid assimilation, storage and metabolism probably contribute to developmental diversity."}, {"type": "qa", "section": "Introduction - yolk utilization", "q": "Which yolk nutrients does the embryo use first, and what is its main energy source?", "a": "Free amino acids are used first, during early blastomere formation. Overall, fatty acids are the main source of ATP, because oxidising them yields more ATP than glucose does.", "kw": ["free amino acids", "fatty acid oxidation"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - yolk utilization", "q": "What is the yolk syncytial layer (YSL), and what does it do?", "a": "At the 500 to 1000 cell stage (512 to 1024 cells in zebrafish), blastomeres next to the yolk collapse and deposit their nuclei and cytoplasm into the yolk cell cortex. This forms a multinucleated layer that wraps around the yolk and mediates the transfer of nutrients from the yolk to the embryo.", "kw": ["YSL", "yolk syncytial layer"], "info": "Lipoproteins are made from yolk granule stores in the endoplasmic reticulum of the YSL and enter the embryo's circulation. They are routed to different tissues according to which lipoprotein receptors those tissues express.", "concl": ""}, {"type": "qa", "section": "Zebrafish", "q": "Why is zebrafish a strong model for studying nutrition in development?", "a": "Zebrafish reach sexual maturity at 3 months, and females produce hundreds of embryos every few days (200 to 300 per spawn). Available resources include the complete egg proteome with egg quality biomarkers, lipidome data across development, methods for studying oogenesis, and genomic data on zfin.org.", "kw": ["zebrafish", "proteome", "lipidome"], "info": "Adults are 2.5 to 4 cm long. Fluorescent molecules have been used to follow nutrients from mother to yolk and from yolk to embryo. Large screens for mutations or toxicants that affect yolk composition and use are feasible.", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "How many vitellogenin genes do zebrafish have, and how are they grouped?", "a": "Eight vtg genes, which can produce up to nineteen splice variants. Type I (vtg1, 4, 5, 6, 7) are incomplete VtgA forms lacking the beta-prime and Ct domains. Type II (vtg2, vtg8) are complete VtgA forms. Type III (vtg3) is a typical VtgC that lacks the Pv, beta-prime and Ct domains.", "kw": ["vtg1", "vtg3", "splice variants"], "info": "Based on the detailed survey of sequences, expression and protein abundance in liver and egg by Yilmaz et al. (2018).", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "Which Vtg-derived proteins are most abundant in the early zebrafish embryo?", "a": "Vtg1 is the most abundant (39%), followed by Vtg7 (23.7%), Vtg2 (17.5%), Vtg6 (8.1%), Vtg4 (6.6%) and Vtg5 (2.9%). Vtg3 is the least abundant (2.1%).", "kw": ["Vtg1", "Vtg3"], "info": "Values are from Fig. 2B, adapted from Yilmaz et al. (2018), and represent the Vtg composition associated with good egg quality at the 1-cell stage. Vtg8 is not shown in the figure.", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "What happens when type I vtg genes are knocked out in zebrafish?", "a": "Combined knockout of three type I vtg genes (vtg1-KO) increases egg number without lowering fertilization rate, and egg size is unchanged. However, hatching rate drops by about 20%. About half of hatched larvae die by 9 dpf, and none survive past 16 dpf.", "kw": ["vtg1-KO", "fecundity"], "info": "vtg1 mutant larvae fail to start feeding, so they probably die because they cannot obtain external nutrition.", "concl": "Some Vtgs appear to restrict fecundity."}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "What is the phenotype of zebrafish vtg3 knockouts?", "a": "Hatching is strongly delayed: wild-type embryos hatch around 3 dpf, but most vtg3-KO embryos do not finish hatching until 9 dpf. About 70% of vtg3-KO embryos die around 24 hpf, and only 10% survive beyond 16 dpf.", "kw": ["vtg3", "hatching"], "info": "The most common defects in Vtg mutants are abdominal edema and spinal lordosis.", "concl": "Vtg3 contributes the least yolk protein (2.1%), yet losing it seriously harms hatching and viability."}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "What lipids are in the zebrafish yolk at fertilization?", "a": "At the 1-cell stage, cholesterol makes up 40% of total yolk lipids. The rest is phosphatidylcholine (17%), triacylglycerol (9%), phosphatidylinositol (8%), phosphatidylethanolamine (5%), diacylglycerol (4%), cholesteryl esters (3%), sphingomyelins (3%) and other lipids (11%).", "kw": ["lipidome", "cholesterol"], "info": "From Fig. 2C, adapted from Fraher et al. (2016).", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "How do yolk and body lipids change during zebrafish development?", "a": "Most lipids decrease linearly in the yolk between 0 and 120 hpf and increase similarly in the body between 24 and 120 hpf, which suggests simple transfer. The exceptions are phosphatidylcholine and triacylglycerol, which rise in the yolk from 0 to 24 hpf and then fall, and diglyceride, which stays constant in the yolk but rises in the embryo from 24 to 120 hpf.", "kw": ["lipidome", "de novo lipid synthesis"], "info": "Free fatty acids injected into the yolk appear in the embryo after 6 h as part of different lipid species.", "concl": "Lipids can be synthesized de novo in the yolk before they are transported into the embryo, so the yolk cell is metabolically active."}, {"type": "qa", "section": "Zebrafish - yolk composition", "q": "Does retinoic acid signalling affect embryonic lipid levels?", "a": "Yes. Immersing embryos in RA signalling modulators from 26 to 55 hpf changes neutral lipid levels in developing tissues, as shown by oil-red O staining. Blocking RA synthesis reduces staining because lipoprotein lipases are upregulated.", "kw": ["retinoic acid", "oil-red O", "lipoprotein lipase"], "info": "", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk utilization", "q": "How do yolk lipoproteins reach the zebrafish embryo?", "a": "Lipoproteins are produced in the endoplasmic reticulum of the YSL and enter the circulatory system through direct contact with the caudal vein. Microsomal triglyceride transfer protein (MTP) is essential for assembling ApoB-containing lipoproteins in the YSL.", "kw": ["MTP", "ApoB", "caudal vein"], "info": "", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk utilization", "q": "What happens in zebrafish mttp mutants, and how is it visualized?", "a": "The normally clear YSL turns dark because triglycerides build up in cytoplasmic lipid droplets, and lipoprotein formation is reduced. The ApoBb.1-NanoLuc transgene, in which ApoB is fused to a luciferase, shows the reduced lipoprotein signal in the body.", "kw": ["mttp", "ApoBb.1-NanoLuc", "LipoGlo"], "info": "The c655 mutation (G863V) is milder than stalactite (L475P). Both abolish MTP triglyceride transfer, but c655 keeps phospholipid transfer activity and still allows small lipoproteins to form. The text calls NanoLuc a luciferase, while the Fig. 3 legend calls it fluorescent, so the readout is described inconsistently.", "concl": ""}, {"type": "qa", "section": "Zebrafish - yolk utilization", "q": "What developmental defects result from reduced lipoprotein transport?", "a": "The full range has not been explored. One study found excessive angiogenesis in Mtp mutants, because ApoB normally inhibits blood vessel formation through VEGF signalling. Injecting diffusible ApoB rescued the angiogenic defects.", "kw": ["angiogenesis", "VEGF", "ApoB"], "info": "The authors suggest using different Mtp mutants to control the timing and amount of nutrients delivered to the embryo.", "concl": ""}, {"type": "qa", "section": "African killifish", "q": "What is the annual life cycle of the African turquoise killifish?", "a": "The fish live in seasonal ponds that hold water only during the short rainy season. They mature within 2 to 3 weeks of hatching and have the shortest known lifespan of any vertebrate. Newly laid embryos enter diapause after somitogenesis and survive in dry sediment for months or years, then resume development when the ponds refill.", "kw": ["diapause", "annual killifish"], "info": "The paper gives the median lifespan as 4 to 6 months in one place and 5 to 6 months in another.", "concl": ""}, {"type": "qa", "section": "African killifish", "q": "What triggers hatching in the killifish, and what is delayed hatching?", "a": "Hatching needs two cues: water and humic acid from decaying plants. If either is missing, for example if embryos do not sense water through osmotic water permeability, they enter a second, shorter diapause-like state called delayed hatching.", "kw": ["delayed hatching", "humic acid"], "info": "Time from fertilization to hatching ranges from 2 to 3 weeks without diapause to more than 2.5 years with diapause at mid-embryogenesis and at the end of embryogenesis.", "concl": ""}, {"type": "qa", "section": "African killifish", "q": "Why is the killifish especially useful for nutrition research?", "a": "It combines a fixed pre-deposited nutrient supply with variable developmental trajectories. Its very short lifespan also makes it possible to follow how embryonic nutrition affects growth, fecundity, health, lifespan and transgenerational epigenetic inheritance.", "kw": ["lifespan", "transgenerational inheritance"], "info": "Lifespans of mice and zebrafish are about 4 and 5.5 years. Available resources include a de novo assembled and annotated genome, transcriptome and epigenome, Tol2 transgenesis, CRISPR/Cas9 editing and CRISPR/Cas13d mRNA knockdown. Maternal intake and embryo nutrient content (by microinjection) can both be manipulated.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk composition", "q": "Is there a maternal effect on whether killifish embryos enter diapause?", "a": "Yes, a strong one. Most embryos obligatorily enter diapause, but more than 95% of embryos from very young mothers escape it. Because maternal mRNAs are already heavily diluted by mid-embryogenesis, the authors propose that young and old mothers may deposit different nutrients in the egg.", "kw": ["maternal effect", "diapause"], "info": "This is a hypothesis; the guiding nutrient or chemical has not been identified.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk composition", "q": "What are oil droplets in killifish eggs, and how do they behave during development?", "a": "Oil droplets (oil globules) are rich in lipids and unsaturated fatty acids. Medaka eggs have them but zebrafish eggs do not. In killifish, droplet volume does not change significantly during embryonic development, including diapause, but the droplets darken during delayed hatching.", "kw": ["oil droplets", "triglycerides"], "info": "Oil droplets usually hold 50 to 60% of total egg lipids, and up to 90% in annual killifish, mostly as triglycerides. Medaka embryos develop normally after their oil droplets are removed. In the South American killifish Austrolebias bellottii, triglyceride levels did not decline even after six years of diapause. The killifish genome annotation contains 3 vtg genes, corresponding to zebrafish Vtg2, 3 and 7 by protein similarity.", "concl": "Oil droplets may serve as an energy reserve before hatching and in newly hatched fry."}, {"type": "qa", "section": "African killifish - yolk composition", "q": "How do annual killifish embryos cope with drying out?", "a": "A specialised chorion structure limits water loss, and downregulation of aquaporins in the enveloping layer is thought to help regulate water permeability. In the first few days in air, embryos lose about half of their extraembryonic water, but the loss then stabilises and the embryo body stays fully hydrated.", "kw": ["desiccation", "aquaporins", "EVL"], "info": "Transcriptomes of embryos in aerial versus aquatic conditions during delayed hatching differ in signalling (MAPKs), protein metabolism (USP5, UCH11) and lipid metabolism (LPL) genes. Whether diapause length differs between these conditions has not been studied.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk utilization", "q": "How does killifish developmental timing compare with zebrafish?", "a": "Killifish embryos are similar in size to zebrafish embryos but have a much larger yolk sac. Embryogenesis is much slower (2 to 3 weeks vs 2 to 3 days), but post-hatching development is much faster (2 to 3 weeks vs 2 to 3 months).", "kw": ["developmental timing"], "info": "", "concl": "This switch from slow pre-hatching to fast post-hatching development may reflect differences in how nutrients are used."}, {"type": "qa", "section": "African killifish - yolk utilization", "q": "What is unusual about epiboly and gastrulation in annual killifish?", "a": "Epiboly and gastrulation are interrupted by a phase in which epiblast cells disperse and migrate randomly over the yolk surface. After as long as several days, the cells reaggregate and form the three germ layers.", "kw": ["dispersion-reaggregation", "epiboly"], "info": "The YSL can be identified during epiboly, but its activity has not been studied in detail in this species.", "concl": ""}, {"type": "qa", "section": "African killifish - yolk utilization", "q": "Is yolk used during diapause?", "a": "No visible yolk consumption occurs during diapause, even after 5 to 6 months. Starvation-related genes (IGF and lysosomal pathway genes) are upregulated, and heart contractions stop completely. Both development and rapid yolk consumption resume after diapause exit.", "kw": ["diapause", "IGF", "yolk consumption"], "info": "Yolk is consumed at the embryo-yolk interface, especially beneath the head near the heart tube. Embryos in delayed hatching are fully developed and need active circulation, so they must keep consuming yolk.", "concl": "Embryonic development, diapause and delayed hatching are three phases that use nutrition differently."}, {"type": "qa", "section": "Mexican tetra", "q": "How do the two Astyanax morphotypes differ in habitat and diet?", "a": "Surface fish live in rivers from southern Texas to central Mexico and eat a fairly even mix of plants and insects all year. Eyeless cavefish live in permanently dark limestone caves in northeastern Mexico and eat bat guano and material washed in by seasonal floods.", "kw": ["cavefish", "surface fish"], "info": "There are at least 32 geographically separate cave populations. Whole-genome sequencing suggests that at least some, such as Tinaja, Pachón and Molino, evolved independently from surface fish.", "concl": ""}, {"type": "qa", "section": "Mexican tetra", "q": "What resources make A. mexicanus a tractable model?", "a": "Surface and cave fish breed easily in the lab and are interfertile, so hybrids can be made by natural spawning or in vitro fertilization. The surface fish and Pachón genomes are sequenced and annotated, and whole-genome data from wild populations exist. Detailed transgenesis and gene editing methods are available.", "kw": ["hybrids", "QTL mapping", "genome"], "info": "Hybrids have been used to map morphological, physiological and behavioural traits. Cavefish genetic changes can be tested in zebrafish or surface fish. Staging tables and anatomical atlases are also available.", "concl": ""}, {"type": "qa", "section": "Mexican tetra", "q": "Why is A. mexicanus promising for nutrition research even though it has not been studied that way?", "a": "Many morph differences appear before feeding starts, including pigmentation loss, eye regression, expanded neurosensory structures, altered brain morphology, symmetry reversals and craniofacial changes. Cavefish embryos have more yolk with more carotenoids, and eye regression and brain morphology show a maternal effect in hybrids.", "kw": ["maternal effect", "carotenoids"], "info": "The maternal effect suggests that instructive components are deposited in the yolk.", "concl": "Linking cave traits to yolk composition could show how evolution has changed nutritional control of development as animals adapted to new diets."}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Does yolk composition differ between surface fish and Pachón cavefish?", "a": "The basic composition, as a percentage of dry mass, is the same: 21% fat, 61% protein and 9% ash. However, Pachón yolk is strikingly more yellow, which hints at a difference in nutrient content.", "kw": ["yolk composition", "Pachón"], "info": "", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Is the yellow yolk colour inherited maternally?", "a": "Yes, it depends on the mother. Cavefish female x surface male crosses give embryos with yellow yolk, while surface female x cavefish male crosses give clear yolk. The yellow colour may reflect more carotenoids from the diet.", "kw": ["reciprocal cross", "parent of origin"], "info": "The authors suggest these reciprocal crosses as a tool for studying how maternally provided yolk nutrients affect development. The Fig. 6 legend labels the surface fish panel as C, but it appears to be D.", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Why might Pachón cavefish make carotenoid-rich eggs?", "a": "In other fish, eggs exposed to limited oxygen have more carotenoids, for example salmon eggs that settle in mud. Dissolved oxygen in Pachón cave water is very low compared with surface rivers, so carotenoids may protect eggs in a low-oxygen environment.", "kw": ["carotenoids", "hypoxia"], "info": "Pachón adults show altered expression of genes for carotenoid absorption, cleavage and transport in the gut, and they accumulate carotenoids in visceral tissues. The protective role is a hypothesis.", "concl": "The difference in egg composition may start with nutrient assimilation in the mother."}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Is carotenoid accumulation just a consequence of eye loss?", "a": "No. Eyeless Molino cavefish neither have yellow eggs nor accumulate carotenoids in visceral tissues.", "kw": ["Molino", "eye loss"], "info": "", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "Which cavefish traits could be linked to retinoid levels?", "a": "Eye degeneration is one: in zebrafish, reducing RA causes small eyes, and in Pachón the lens starts to undergo apoptosis around hatching (24 hpf). Heart laterality, visceral organ symmetry and hypothalamic neuron differentiation are others. All of these differ between Pachón and surface fish, show a maternal effect, and are linked to retinoids in other species.", "kw": ["retinoic acid", "lens apoptosis", "laterality"], "info": "Ma et al. (2018) found that F1 hybrids from Pachón females have more lens apoptosis, smaller eyes and smaller sclera than hybrids from surface females. Torres-Paz et al. (2019) found no difference in lens size or apoptosis but did find maternally controlled retina morphogenesis. A link to retinoids has never been tested directly.", "concl": "The authors propose comparing yolk retinoid levels between morphs, mapping where RA modulators are expressed, and manipulating RA signalling."}, {"type": "qa", "section": "Mexican tetra - yolk composition", "q": "What is known about vitellogenins and maternal metabolism in A. mexicanus?", "a": "The vtg gene repertoire, the Vtg protein composition of the egg and details of oogenesis have not been described. The authors suggest comparing the sequences and expression of genes for Vtgs, Vtg receptors and Vtg proteases between morphs.", "kw": ["vtg", "liver transcriptome"], "info": "Existing lab and wild liver transcriptomes of both morphs could be used to study vtg expression. Cavefish have elevated blood sugar and triglyceride levels, which raises the question of how their embryos avoid harm from the unusual maternal metabolism.", "concl": ""}, {"type": "qa", "section": "Mexican tetra - yolk utilization", "q": "How does the larger yolk of cavefish affect development?", "a": "Pachón eggs have about 15% more yolk, yet both morphs pass developmental milestones in sync, including YSL formation at around the 1000-cell stage, somitogenesis and early eye formation. At hatching (24.5 to 28 hpf), Pachón larvae are longer (3.00 mm vs 2.75 mm).", "kw": ["yolk volume", "body size"], "info": "Cavefish still have more yolk at hatching, and it decreases at the same rate in both morphs. External feeding starts at about 5 dpf, so cavefish can still draw on yolk when surface fish depend entirely on food. Yolk volume and its use have not been measured in Tinaja or Molino, and YSL activity has not been compared between populations. Methods to manipulate yolk volume exist (Torres-Paz and Retaux, 2020).", "concl": "Extra yolk may let cavefish survive longer without feeding and/or produce larger larvae that can eat bigger food, without changing tissue specification or patterning."}, {"type": "qa", "section": "Summary and future directions", "q": "What do the authors conclude about each of the three models?", "a": "Zebrafish offer Vtg mutants, yolk-transport mutants, a lipidome and easy transgenesis. Killifish offer multiple developmental trajectories, long embryogenesis, a short lifespan and high stress resistance. Cavefish offer natural variation in nutrient loading produced by adaptation to a nutrient-poor environment.", "kw": [], "info": "The authors note that cavefish research has so far been gene-centric and often overlooks diet. Cavefish traits such as excess fat, high blood sugar and altered vitamin A levels mirror nutritional problems that affect human fetal development.", "concl": "Using natural diversity across species is likely to give a more complete understanding of how nutrition controls embryonic development."}, {"type": "note", "section": "Mexican tetra - yolk composition", "text": "Do maternally supplied yolk carotenoids or retinoids explain the maternal effects on lens apoptosis, retina morphogenesis and laterality in Pachón? Comparing vtg genes and their promoter ERE landscape between morphs, and yolk retinoid levels between Pachón and Molino (eyeless but not yellow), would be a natural regulatory genomics angle."}, {"type": "note", "section": "African killifish - yolk composition", "text": "Which nutrient or chemical in eggs from very young killifish mothers lets more than 95% of embryos skip diapause, and did yolk composition co-evolve with diapause length?"}, {"type": "note", "section": "Mexican tetra - yolk utilization", "text": "Yolk volume, rate of yolk use and YSL activity have never been measured in Tinaja and Molino. Do independently evolved cave populations converge on larger, carotenoid-rich yolk?"}], "key": "drerio/Riddle_2021_DevBiol_fish_nutrition_embryo_development", "shared": "Damir · 2026", "preprint": "", "tags": [], "source_note": ""}, {"id": "Neaverson_2025", "title": "Coordinating tissue development to build body and brain: Lessons from the gastrula organiser and its derivatives", "category": "Embryo development & nutrition", "link": "https://doi.org/10.1016/j.cdev.2025.204042", "note": "", "source_pdf": "papers/drerio/Neaverson_2025_CellsDev_gastrula_organiser.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "How has the Spemann-Mangold organiser mostly been studied, and what is still unknown?", "a": "It has been a central paradigm for over a century and was studied mainly through its ability to induce secondary axes in transplantation experiments. It is still unknown how the organiser and its derivatives act together to build a well-proportioned body axis.", "kw": ["Spemann-Mangold organiser", "secondary axis"], "info": "This is a review in a special issue for the Spemann-Mangold centenary (Cells & Development, Spemann-Mangold Issue Part II). It has no original data or methods section.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the scope of the review and how do the authors approach it?", "a": "They compare evidence from four vertebrate models (Xenopus, zebrafish, chick and mouse) to work out what the organiser is needed for at each stage of neural development and body axis formation. They focus mostly on experiments in which the organiser or its derivatives were removed.", "kw": ["organiser deletion", "comparative embryology"], "info": "The deletion experiments include surgical ablations, mutants and explants. The authors argue that these show the organiser's role in normal development better than graft assays do.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the consensus view the review presents?", "a": "Initial neural specification and anterior-posterior patterning happen before the morphological organiser forms. They are driven by planar signals from pre-organiser cells, plus species-specific contributions from extraembryonic tissues. Later, the anterior axial mesendoderm maintains anterior identity and tissue proportions, and the notochord patterns the dorsal-ventral axis and coordinates posterior elongation through mechanical coupling.", "kw": ["planar signals", "pre-organiser", "axial mesendoderm"], "info": "", "concl": "The pace of axial mesoderm extension is proposed as a key coordinator of proportional body axis development."}, {"type": "qa", "section": "Introduction", "q": "What did the original 1924 organiser experiment show?", "a": "Hilde Mangold grafted the dorsal blastopore lip of one newt embryo into another, and the host formed an ectopic secondary body axis. She used newt species with different pigmentation, so graft and host cells could be told apart. The graft became axial mesendoderm, and the secondary neural tube was induced from host tissue.", "kw": ["dorsal blastopore lip", "induction"], "info": "Spemann called the dorsal lip an 'organisation centre'. The view at the time was that the whole animal hemisphere was 'indifferent' and needed the organiser to tell it what to become.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Apart from induction, what else does the organiser graft reveal, and what is 'individuation'?", "a": "It shows that the organiser and the tissue responding to it can self-assemble a well-patterned, proportional body axis. Individuation (Waddington and Needham, 1936) is the idea that this needs long-term interactions between signalling and responding tissues.", "kw": ["individuation", "self-assembly"], "info": "Mechanical interactions are now known to work together with inductive signals in multi-tissue self-assembly, as described for the posterior body axis.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What key gap do the authors want to address?", "a": "How morphogenesis dynamics are coordinated across tissues: the rate of progenitor expansion and commitment, and how tissues change shape. Both must be matched between tissues to build proportional multi-tissue structures.", "kw": ["morphogenesis", "proportion"], "info": "The authors say this work could also help morphogenetic engineering of multicellular systems in vitro. They use three terms throughout: organiser precursor cells, the morphological organiser, and organiser derivatives (prechordal mesendoderm and notochord).", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "In zebrafish, when are the pre-organiser, organiser and organiser-derived stages (Table 1)?", "a": "Pre-organiser: blastula, about 3 hpf, when the mid-blastula transition and zygotic transcription begin. The shield (morphological organiser) forms at 50% epiboly, about 6 hpf. Prechordal mesendoderm and notochord emerge at 50-75% epiboly (about 6-8 hpf), and the notochord becomes a visible rod at about 90% epiboly.", "kw": ["shield", "gsc", "chordin"], "info": "The 'shield marker genes' are already expressed before the shield forms: gsc and chordin on the future dorsal side, and lim1 along the whole margin. This suggests organiser precursor cells are already present. Organiser cells sit in the superficial shield and also in deeper layers.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are the equivalent organiser stages in Xenopus, chick and mouse (Table 1)?", "a": "Xenopus: pre-organiser NF8-NF10 (about 5-9 hpf), with precursors in the BCNE centre; organiser at NF10 (about 9 hpf). Chick: pre-organiser EGK-X to HH3; central and posterior precursors meet at HH3+ to HH4 (about 15-19 h). Mouse: organiser cells in the EGO and then the MGO from E6.5; the node becomes morphologically visible only at E7.5.", "kw": ["BCNE", "Hensen's node", "EGO/MGO"], "info": "BCNE = blastula Chordin- and Noggin-expressing centre. In mouse, prechordal plate cells have already left by the time the node is visible, so the morphological-organiser stage and the derivative stage are hard to separate.", "concl": ""}, {"type": "qa", "section": "Early neural specification - planar signals", "q": "What is the organiser called in birds and mammals, and how do mouse node grafts differ?", "a": "It is Hensen's node (the node), at the tip of the primitive streak. Waddington showed this by grafting it from chick, duck or rabbit into chick hosts. A mouse node graft also induces a secondary axis, but the axis lacks the most anterior (forebrain) structures.", "kw": ["Hensen's node", "primitive streak"], "info": "", "concl": ""}, {"type": "qa", "section": "Early neural specification - planar signals", "q": "Why do the authors say the term 'neural induction' is often misused?", "a": "Induction means a change of fate, but in the normal embryo the responding cells are already fated to become neural plate. It has therefore been suggested that 'neural induction' should only describe graft assays, where the organiser is placed next to prospective non-neural tissue.", "kw": ["neural induction"], "info": "Many textbooks still say the organiser does neural induction in normal development, which mixes up what a graft can do with what the organiser does in situ. Supporting evidence: in chick, the earliest neural genes induced by a node graft are expressed before the node forms.", "concl": ""}, {"type": "qa", "section": "Early neural specification - planar signals", "q": "What is the difference between planar and vertical signals?", "a": "Planar signals come from the early gastrula organiser and spread through the plane of the ectoderm. Vertical signals come from mesoderm lying underneath the ectoderm after it has involuted.", "kw": ["planar signals", "vertical signals"], "info": "", "concl": "In every species reviewed, neural induction and AP patterning of brain regions happen early, through planar signals from the organiser."}, {"type": "qa", "section": "Early neural specification - Xenopus", "q": "What happens when the organiser is deleted in Xenopus?", "a": "The embryo is ventralised. It lacks head, trunk, tail, somites, kidney, nervous system and placodes, but still makes ventral tissues from all three germ layers, such as ciliated epidermis, red blood cells and posterior gut.", "kw": ["ventralisation", "organiser deletion"], "info": "Changing the amount of organiser tissue changes how far dorsal and anterior development extends. This supports a role for the organiser in patterning both the AP and DV axes.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Xenopus", "q": "How are head and trunk organiser functions separated in amphibians?", "a": "The anterior part of the organiser becomes prechordal plate and induces head structures. The posterior part becomes notochord and induces trunk and tail. Ablating prechordal mesendoderm precursors removes head structures, and removing notochord precursors removes trunk structures.", "kw": ["head organiser", "prechordal plate", "notochord"], "info": "Over time the organiser loses its ability to induce anterior structures, but keeps its tail-inducing ability for longer. The ectoderm receives AP instructions before any axial mesoderm involutes.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Xenopus", "q": "What do Keller explants and exogastrulae show about planar signalling?", "a": "In Keller explants, mesoderm and ectoderm lie side by side in one plane and are never stacked vertically. Extensive AP neural patterning still happens, even in a recombinate of dorsal mesoderm with ventral ectoderm. In exogastrulae, AP patterning reaches only the midbrain level: forebrain (eyes) and ventral neurons of the hindbrain and spinal cord do not form.", "kw": ["Keller explant", "exogastrula"], "info": "A recent transcriptomic study confirmed that AP neural patterning can happen without vertical signals.", "concl": "Planar organiser-derived signals are partially responsible for AP patterning."}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "When and how does the zebrafish shield form, and what can it do when grafted?", "a": "Epiboly starts at about 4 hpf, and gastrulation begins at about 5 hpf at 50% epiboly, when the germ ring forms. Convergence packs cells together on the dorsal side of the germ ring, where the shield forms at 50-60% epiboly. A full-thickness shield graft into the ventral germ ring gives a complete ectopic axis with all brain tissues.", "kw": ["shield", "germ ring", "epiboly"], "info": "The shield contains a mix of neurectodermal and chordamesodermal progenitors.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "What happened when the shield was removed microsurgically (Shih and Fraser)?", "a": "The embryos developed normal nervous systems with normal AP and DV patterning. They were shorter and wider than controls and arched dorsally. However, most still had notochord cells, mostly in the tail.", "kw": ["shield ablation", "chordin"], "info": "One possible explanation is that chordin is switched on before gastrulation and before the shield forms, so neural development may already be under way.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "What shows that neural induction and AP patterning start before the shield forms?", "a": "Removing the whole presumptive shield in late blastula embryos removed opl (zic1), an early forebrain marker. Dorsal ectoderm explants taken at early gastrula already had a latent AP pattern: anterior explants expressed opl, and posterior explants (closer to the shield) expressed less opl plus fkh5 (foxb1), a midbrain-to-spinal-cord gene.", "kw": ["opl/zic1", "fkh5/foxb1"], "info": "", "concl": "Neural commitment and AP patterning are already visible at early gastrula stage."}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "Why did different shield removal studies give different phenotypes?", "a": "Removing only the morphological shield leaves some gsc+ and noto+ cells. Removing the shield together with neighbouring marginal tissue (Saude et al.) caused complete loss of notochord and prechordal plate, major loss of floor plate and motor neurons, cyclopia and disrupted somite patterning. This resembles the bozozok (dharma) mutant, which loses axial mesoderm and forebrain and has a reduced midbrain.", "kw": ["bozozok", "dharma", "gsc"], "info": "The differences probably reflect how much tissue was removed. Saude et al. concluded that the deeper gsc+ cells matter most for anterior structures.", "concl": "The morphological shield is not the whole zebrafish organiser region."}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "Which signals other than the organiser can pattern the zebrafish neural AP axis?", "a": "Varga et al. found that organiser-deficient embryos make the full AP pattern as long as BMP signalling is blocked. Wnts from mesendodermal precursors at the lateral margin act as posteriorising signals: grafting these cells to the animal pole or the prospective forebrain gives ectopic hindbrain. Posterior spinal cord progenitors depend on FGF rather than on BMP antagonists.", "kw": ["BMP", "Wnt", "FGF"], "info": "Spinal cord progenitors are spread widely along the DV axis and lie far from the shield, so shield deletion is unlikely to affect posterior neural tissue.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Zebrafish", "q": "Why do Thisse and Thisse suggest the whole blastoderm margin is the zebrafish organiser?", "a": "A shield grafted to the animal pole of a blastula host only makes axial mesoderm and does not recruit or pattern host cells. The full ectopic axis seen after ventral margin grafts comes from reorganised Nodal/BMP gradients along the margin. A high BMP to Nodal ratio gives tail, a 1:1 ratio gives posterior head, and no BMP gives anterior fates.", "kw": ["Nodal/BMP ratio", "dorsal patterning centre"], "info": "They propose calling the shield the 'dorsal patterning centre'.", "concl": "The zebrafish organiser patterns the AP axis mainly by planar induction, not by vertical signals from derivatives after involution."}, {"type": "qa", "section": "Early neural specification - Chick", "q": "Which cell populations form Hensen's node, and what comes out of it?", "a": "Two populations: 'central' cells in the pre-streak epiblast, which have no specific markers, and 'posterior' cells from Koller's sickle, which express Chordin and Goosecoid. Only the posterior cells have some neural-inducing ability, and full ability appears when the two meet at mid-streak stage. The first cells to ingress through the node make definitive endoderm, then head process; later cells make notochord, medial half-somites and floor plate.", "kw": ["Koller's sickle", "Goosecoid", "Chordin"], "info": "", "concl": ""}, {"type": "qa", "section": "Early neural specification - Chick", "q": "Why is it hard to test whether the chick node is required?", "a": "The node regulates very strongly. Embryos look normal after the node is ablated, reversed or replaced with other tissue. When the node and the anterior 40% of the primitive streak were removed at HH3+, embryos restored all node marker expression except Goosecoid.", "kw": ["regulation", "node ablation"], "info": "When the node is ablated in older embryos, the head and notochord anterior to the regressing node form normally, but the wound does not close and somites form on both sides of the gap. Even after removing the whole streak, notochord forms on either side of the gap, possibly from regenerated node tissue.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Chick", "q": "What starts neural development in chick, if not the node?", "a": "When the egg is laid, before gastrulation, the epiblast is already in a primed 'pre-neural' state, induced by FGF signals from the hypoblast. Explants of medial pre-streak epiblast cultured alone become committed neural tissue without added growth factors. AP patterning into forebrain, midbrain, hindbrain and spinal cord may be complete by HH4.", "kw": ["hypoblast", "FGF", "pre-neural state"], "info": "Paraxial mesoderm has a caudalising effect and gives midbrain and hindbrain identity to tissue that would otherwise become forebrain. The node and paraxial mesoderm probably work together, and the head process later refines the pattern. Caveat: the explant assays need serum containing growth factors and are not equivalent to removing the organiser.", "concl": "It has not yet been possible to fully assess whether the chick organiser is required."}, {"type": "qa", "section": "Early neural specification - Mouse", "q": "Why do mouse node grafts lack anterior structures, and which grafts do induce them?", "a": "The node only becomes visible at late gastrula, and by then prechordal and head process mesendoderm have already left it (equivalent to chick HH4+ to 5). An EGO graft induces neural tissue only up to the hindbrain. A combined graft of EGO, AVE and anterior epiblast induces anterior neural tissue.", "kw": ["EGO", "AVE", "MGO"], "info": "Node-derived cells mostly form trunk notochord from hindbrain level backwards, while anterior axial mesendoderm comes mainly from the EGO and MGO. The MGO has been claimed to have full ability, but grafts only show induction of forebrain and midbrain genes.", "concl": "Full organiser ability in mouse may need several tissues acting together."}, {"type": "qa", "section": "Early neural specification - Mouse", "q": "What did FOXA2 (HNF-3beta) mutant mice reveal about node requirement?", "a": "FOXA2-/- embryos form no node and no notochord but still make neural tissue. Half of them weakly expressed Otx2 in forebrain and midbrain, and the other half had no Otx2. Those with Otx2 tended to express Engrailed and, weakly, Hoxb1, but anterior head structures were abnormal in all embryos.", "kw": ["FOXA2", "Otx2", "AVE"], "info": "Caveat: FOXA2 is also needed in the AVE (for Wnt antagonists and Otx2) and is expressed in prechordal mesendoderm, so the defect cannot be pinned on one tissue. A conditional knockout restricted to embryonic tissues showed that the AVE alone cannot maintain anterior neural character.", "concl": ""}, {"type": "qa", "section": "Early neural specification - Mouse", "q": "Is early BMP antagonism needed for mouse neural development?", "a": "Yes, probably. Chordin;Noggin double mutants lose anterior notochord and forebrain. FOXA2 mutants lack Chordin and Noggin at gastrula stage but still express Chordin earlier in the anterior streak. Mutations that block formation of the primitive streak and EGO/MGO give no neural tissue at all.", "kw": ["Chordin", "Noggin", "BMP antagonism"], "info": "Surgical node ablation at late gastrula still gave an intact neural tube with Otx2 anterior and Hoxb1 posterior, and unlike in chick the node does not regenerate. By that stage the neural plate is probably already committed.", "concl": "AP neural specification starts before the node forms, through EGO/MGO planar signals and vertical signals from the AVE. The node then patterns tissue posterior to the hindbrain."}, {"type": "qa", "section": "Early neural specification - Summary", "q": "What is the consensus from Section 2 across species?", "a": "In all four species, neural development starts before the morphological organiser forms. It uses signals from an early pre-organiser structure, plus extraembryonic endoderm in chick (hypoblast) and mouse (AVE). The pre-organiser starts AP patterning through planar signals in the ectoderm, and the morphological organiser continues it.", "kw": ["pre-organiser", "extraembryonic endoderm"], "info": "", "concl": "The full range of AP neural tissues can only develop through coordination of several tissues."}, {"type": "qa", "section": "Organiser derivatives - neural maintenance", "q": "In what order are axial mesendoderm tissues internalised?", "a": "In all four species the order is broadly the same: prechordal mesendoderm precursors first, then anterior notochord (head process), then trunk notochord.", "kw": ["prechordal mesendoderm", "head process"], "info": "The posterior notochord forms differently, from NMPs in the tailbud, and is outside the scope of the review.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Xenopus", "q": "How does Xenopus axial mesendoderm form, and which markers define each part?", "a": "The first cells to involute are leading edge mesendoderm (xhesx1), which forms anterior endoderm. Next come prechordal mesendoderm (xgsc) and then notochord progenitors (xtbxt). The PME migrates collectively in a fan shape under the anterior neural plate, and notochord cells converge and extend to form a rod.", "kw": ["xhesx1", "xgsc", "xtbxt"], "info": "The tail notochord forms after involution ends, by further mediolateral intercalation. PME and head process keep expressing the BMP and Wnt antagonists first made in the organiser.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Xenopus", "q": "Which experiments separate PME function from the earlier organiser in Xenopus?", "a": "Disrupting cholesterol-rich membrane microdomains (Reis et al.) altered PME cell shape and shh and goosecoid expression without affecting the earlier organiser. It caused severe head loss, which was partly rescued by injecting the Wnt antagonist Dkk-1. Surgical PME ablation caused cyclopia, with one large Pax6+ eye field, but did not change AP patterning.", "kw": ["Dkk-1", "cyclopia", "Pax6"], "info": "Nodal inhibition and early organiser ablations cannot separate the PME from its precursors. Overexpressing Wnt inhibitors (Frzb1, Dkk-1) expands anterior neural tissue, while overactive Wnt posteriorises it.", "concl": "The PME probably keeps signalling to maintain anterior fate that is already specified, and may ensure correct forebrain proportions."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "How do zebrafish shield cells give rise to prechordal plate and notochord?", "a": "Deep gsc+ shield cells make prechordal mesendoderm, and more superficial noto-expressing cells make notochord. Prechordal plate cells ingress first and migrate towards the animal pole as a collective, between the ectoderm and the yolk syncytial layer.", "kw": ["gsc", "noto", "collective migration"], "info": "The motility and directionality are intrinsic and do not depend on external cues, but only the collective has them; isolated prechordal plate cells do not. Prechordal plate and head process keep expressing shield genes, including gsc, chordin and dkk1.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "What do Nodal pathway mutants lacking a prechordal plate show about forebrain development?", "a": "oep (tdgf1) mutants have smaller anterior neural structures but normal AP neural patterning. squint;cyclops double mutants lack most mesoderm, including prechordal plate and notochord, yet AP patterning is mostly normal. The smaller forebrain in oep is due to missing Dkk1, which the prechordal plate normally secretes.", "kw": ["oep", "squint/cyclops", "Dkk1"], "info": "squint and cyclops are secreted Nodal-related ligands, and oep is an essential cofactor of the pathway. Overexpressing Dkk1 expands forebrain at the expense of midbrain, and transplanting Dkk1-expressing cells rescues the oep forebrain.", "concl": "Prechordal plate signals do not set AP pattern, but they matter for brain regions reaching the right size."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "How long does Wnt antagonism need to last for normal forebrain development in zebrafish?", "a": "Until at least mid-somitogenesis. A heat-inducible dominant-negative Frizzled-8a rescued the oep forebrain defects even when induced at 16 hpf.", "kw": ["Frizzled-8a", "Wnt antagonism"], "info": "Study by Kim et al. (2009).", "concl": "Continuous Wnt antagonism is important for forebrain development."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "What DV defects follow loss of the prechordal plate in zebrafish?", "a": "Cyclopia, because prechordal plate signals split the eye field in two, and complete loss of ventral forebrain regions such as the hypothalamus, as well as loss of the floor plate. Ethanol, which impairs prechordal plate migration, also causes cyclopia.", "kw": ["cyclopia", "hypothalamus", "floor plate"], "info": "Correct positioning of the prechordal plate is therefore important.", "concl": "Without a prechordal plate, DV patterning is far more affected than AP patterning."}, {"type": "qa", "section": "Organiser derivatives - Zebrafish", "q": "How might the speed of mesendoderm migration affect brain proportions?", "a": "Dkk1 morphants internalise and migrate axial mesendoderm faster. Dkk1 overexpression slows migration and shifts the anterior limit of the neural plate caudally. Friction between prechordal plate and neurectoderm also affects where the brain forms.", "kw": ["Dkk1", "friction", "migration speed"], "info": "Dkk1 may control how fast mesendoderm advances, so that the overlying neural plate gets the right signals at the right time.", "concl": "The timing, speed and possibly direction of prechordal plate migration may set the final positions and proportions of brain regions."}, {"type": "qa", "section": "Organiser derivatives - Chick", "q": "Can chick head process and prechordal plate still pattern the brain after HH4?", "a": "Partly. At HH5, young head process grafts induce organised ectopic forebrain and midbrain. By HH6, prechordal plate and head process have separated, and grafts induce only forebrain or only midbrain, respectively.", "kw": ["head process", "prechordal plate", "goosecoid"], "info": "Cells leave the node from late HH4 to form goosecoid+ prechordal plate and head process. The notochord forms as the node regresses from about HH6. Brain AP regionalisation is considered complete by HH4.", "concl": "This fits a maintenance role through continued vertical induction."}, {"type": "qa", "section": "Organiser derivatives - Chick", "q": "What is the 'conveyor belt' movement and why does it matter?", "a": "As the neural tube develops, it moves anteriorly over the head process like a conveyor belt, so each part of the head process touches the overlying neural tissue only briefly. This explains why anterior head process grafts induce midbrain and hindbrain in competent epiblast but cannot change the forebrain fate of the tissue above them at HH6-7.", "kw": ["conveyor belt", "head process"], "info": "Posterior neural plate explants at HH6-7 express hindbrain and spinal cord genes, but combined with posterior head process they express only spinal cord markers. The proposed reason is that the head process represses neural genes from levels anterior to its own.", "concl": ""}, {"type": "qa", "section": "Organiser derivatives - Chick", "q": "Does anterior mesendoderm change neural fate or neural tissue morphogenesis?", "a": "Grafts of anterior mesendoderm into the epiblast marginal zone gathered host neural cells on top of the graft, and these formed a secondary regionalised brain. The type of brain tissue depended on where the graft sat along the host AP axis.", "kw": ["convergence", "neural tube morphogenesis"], "info": "The chick neural tube elongates by contraction-based convergent extension: actomyosin builds up along the mediolateral axis, junctions shrink, and cells converge to the midline.", "concl": "Anterior mesendoderm can promote neural convergence without changing neural fate."}, {"type": "qa", "section": "Organiser derivatives - Mouse", "q": "Which mouse organiser regions form which axial tissues, and what happens without anterior axial mesendoderm?", "a": "The EGO forms prechordal plate and anterior notochord, the node forms trunk notochord, and the MGO contributes to both. Mutants lacking anterior axial mesendoderm have anterior truncations. Gdf1-/- Nodal+/- embryos have major forebrain defects, and in Hex1 mutants the mesendoderm forms but does not migrate properly, so the forebrain cannot maintain itself.", "kw": ["Gdf1", "Hex1", "anterior truncation"], "info": "Chordin-/- Noggin-/+ embryos also fail to maintain forebrain. Loss of prechordal mesendoderm causes DV defects: expanded dorsal markers, reduced hypothalamic genes and sometimes cyclopia.", "concl": "In normal mouse development, anterior axial mesendoderm maintains AP pattern rather than inducing it."}, {"type": "qa", "section": "Organiser derivatives - Summary", "q": "What is the consensus role of early organiser derivatives in brain development?", "a": "
