aper PGLS gave P = 1.3e-12.", "concl": "The egg DNA-to-cytoplasm ratio, which rises with every cleavage cycle, acts as a universal timer of ZGA across animals."}, {"type": "qa", "section": "Results - The egg DNA-to-cytoplasm ratio is a universal timer of ZGA", "q": "Can ZGA timing be predicted for a new species?", "a": "Yes, if genome size and egg volume are known: ZGA time (cell cycle) = -2.370 * log10(GS/EV) + 11.734, where GS is genome size in bp and EV is egg volume in um3.", "kw": ["predictive model"], "info": "The model is a simple linear fit (OLS formula shown in Fig. 3G).", "concl": ""}, {"type": "qa", "section": "Results - Genes transcribed at ZGA share distinctive features", "q": "How were ZGA genes and MAT genes defined for comparison across species?", "a": "A ZGAscore ranks all genes in each species by how strongly they are activated at ZGA, comparing expression at ZGA and the next stage with expression at MAT and pre-ZGA. The top 500 genes by ZGAscore are the 'ZGA genes', and genes with TPM >= 50 at the MAT stage are the 'MAT genes'.", "kw": ["ZGAscore", "ZGA genes", "MAT genes"], "info": "The score was designed to handle large differences between species in ZGA timing, gene number and RNA-seq type and coverage. As expected, ZGA genes rose sharply at the ZGA stage, while MAT genes declined mildly.", "concl": ""}, {"type": "qa", "section": "Results - Genes transcribed at ZGA share distinctive features", "q": "How do ZGA genes differ from MAT genes in genomic architecture?", "a": "ZGA genes are shorter, have fewer introns and shorter 3' UTRs, and have higher codon usage bias. Except in mammals, they also have larger intergenic regions. In 48 of 61 species (79%) they have higher GC content, although this difference is smaller than the others.", "kw": ["gene length", "codon usage bias", "intergenic region"], "info": "The authors' interpretations: short, intron-poor genes allow rapid transcription during short cleavage cycles. Short 3' UTRs and high codon bias suggest simpler regulation of translation and mRNA stability than for MAT genes. Larger intergenic regions suggest more complex transcriptional regulation.", "concl": ""}, {"type": "qa", "section": "Results - Genes transcribed at ZGA share distinctive features", "q": "Which functions are enriched at the MAT, ZGA, ZGA+1 and ZGA+2 stages?", "a": "MAT: DNA damage response, microtubule-based processes, mitotic cell cycle, RNA localization and post-transcriptional regulation. ZGA and ZGA+1: RNA processing and gene expression, including chromatin, transcription by RNA polymerase II, mRNA binding and splicing. ZGA+2: post-cleavage programs such as patterning and axis formation, morphogenesis and gastrulation, organogenesis, and structural and signaling processes.", "kw": ["GSEA", "Gene Ontology"], "info": "GSEA was run on ranked lists for each species and stage (MAT expression, ZGAscore, ZGA+1score, ZGA+2score) using standardized GO annotations.", "concl": "There is a conserved functional switch: maternal control of cell division, then zygotic reprogramming of transcription and chromatin, then embryogenesis and organogenesis."}, {"type": "qa", "section": "Results - Zygotic genes show low genomic and regulatory conservation", "q": "Are ZGA genes genomically conserved, meaning do they have orthologs in other species?", "a": "Less than expected. In every species, MAT genes were more conserved than the background, while ZGA genes were globally less conserved than the background and always less conserved than MAT genes.", "kw": ["genomic conservation", "orthogroups"], "info": "A query gene counted as conserved in a target species if at least one ortholog was present there. A phylostratigraphic analysis gave similar but noisier results, with ZGA genes overall newer than MAT genes. The fraction of ZGA genes in any orthogroup was also much lower than for MAT genes.", "concl": ""}, {"type": "qa", "section": "Results - Zygotic genes show low genomic and regulatory conservation", "q": "Are orthologs of ZGA genes also activated at ZGA in other species (regulatory conservation)?", "a": "Mostly only within certain groups, such as mammals, ambulacrarians and cnidarians, with minimal conservation between groups. The top maternally deposited genes had higher fractions of conserved expression across the phylogeny.", "kw": ["regulatory conservation"], "info": "Measured pairwise as the fraction of a query species' ZGA genes that have at least one ortholog that is also a ZGA gene in the target species.", "concl": ""}, {"type": "qa", "section": "Results - Zygotic genes show low genomic and regulatory conservation", "q": "What do group-specific ZGA orthogroups look like?", "a": "ZGA genes belonged to more group-specific orthogroups than MAT genes, and these orthogroups usually had no homologs in other animal groups. This suggests a strong link between gene emergence and the acquisition of ZGA regulation.", "kw": ["TRIM43", "gene emergence"], "info": "Mammal-specific ZGA orthogroups were enriched for response to stimuli, transcriptional activation and RNA biosynthesis. One example is human TRIM43 and its homologs, a family of ubiquitin-ligating proteins that arose in the mammalian ancestor and are known markers of mammalian ZGA.", "concl": ""}, {"type": "qa", "section": "Results - Zygotic genes show low genomic and regulatory conservation", "q": "Is any gene family activated at ZGA in all animal groups?", "a": "Only one orthogroup: the FET genes (human FUS, EWSR1 and TAF15) and their homologs. These RNA-binding proteins mediate co-transcriptional RNA processing. By contrast, 522 MAT orthogroups were broadly shared.", "kw": ["FET genes", "FUS", "EWSR1"], "info": "Previous perturbation work links FET genes to splicing defects affecting gastrulation (Fus in clawed frog), mitotic defects (ewsr1a and ewsr1b in zebrafish), and differential post-ZGA RNA binding (caz in fruit fly). Shared MAT genes include Ezrin and Radixin, whose combined knockdown in mouse reduces fertilization success.", "concl": "ZGA genes tend to be group- or even species-specific, whereas a common set of MAT genes, mainly for cell cycle and RNA processing, is deposited in eggs across animals."}, {"type": "qa", "section": "Discussion", "q": "What caveats of the dataset do the authors acknowledge?", "a": "Actual times for equivalent stages vary widely (first cleavage under 20 minutes in O. dioica vs 20 to 24 hours in mammals). Other caveats are the mix of RNA-seq types (ribo-depletion vs polyA), the lack of nascent RNA-seq, and the bulk nature of the data, which is especially problematic for late activators and for embryos with very unequal blastomere sizes.", "kw": ["limitations"], "info": "It is also hard to estimate the 'active' cytoplasmic volume (containing maternal mRNAs and proteins) relative to 'inactive' yolk. The authors argue the true association could therefore be even stronger than reported.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Does the DNA-to-cytoplasm rule extend beyond animals?", "a": "Adding two plants, Arabidopsis and maize, gave a pattern consistent with animals and strengthened the negative correlation (adjusted R2 OLS = 0.772, P PGLS = 2.1e-18). This suggests the relationship may hold across other multicellular eukaryotes.", "kw": ["Arabidopsis", "maize"], "info": "A recent study in brown algae showed a surprisingly contrasting pattern. In the plant fit, both angiosperms sit at ZGA cycle 0 with high DNA-to-cytoplasm ratios (Fig. S10).", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How could the egg DNA-to-cytoplasm ratio act as a ZGA timer?", "a": "During early cleavages DNA doubles each cycle while total embryo volume stays roughly constant, so the DNA-to-cytoplasm proportion rises exponentially. ZGA may start once a maternally deposited factor acting on DNA has been titrated enough by repeated genome replication.", "kw": ["titration model"], "info": "Supporting evidence: triploid and haploid cybrid frog embryos show earlier and later ZGA than diploids, and haploid honeybee males activate their genome later than diploid females.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Which molecular factors might be titrated, and how does cell cycle length fit in?", "a": "Histones are long-standing candidates. Histone titration helps set ZGA timing in frog, and in zebrafish ZGA depends on the balance between histones and transcription factors, with fewer free histones letting transcription factors compete better for DNA. The ratio is also tied to cell cycle lengthening, for example through histones inhibiting cell cycle regulators (fly) or dilution of replication factors (frog).", "kw": ["histones", "transcription factors", "cell cycle length"], "info": "The ratio could therefore act directly (titration) or indirectly (by lengthening the cell cycle, which then triggers ZGA). The authors think a combination likely operates to different extents in each species.", "concl": "Whatever the mechanism, the comparative atlas supports the egg DNA-to-cytoplasm ratio as a universal timer, with conserved functional logic despite extensive turnover of the underlying genes."}, {"type": "qa", "section": "Methods - Phylogenetic framework", "q": "How was the species tree built, and how were taxa grouped?", "a": "A time-calibrated tree was built mainly from the TimeTree database. Missing species were replaced by the closest congener or sister lineage, or placed from the primary literature. Taxon groups were deliberately non-equivalent in rank and include the paraphyletic 'non-mammalian vertebrates'.", "kw": ["TimeTree"], "info": "The grouping balances uneven taxon sampling (especially mammals and nematodes) and reflects developmental divergence, for example large differences within Chordata vs the conserved spiral cleavage of Spiralia. The acoel position is marked as uncertain. In the species list, Macaca mulatta and Mus musculus are both abbreviated 'Mmu' in the Methods text; the figures use 'Mma' for macaque.", "concl": ""}, {"type": "qa", "section": "Methods - Sample collection and RNA-seq", "q": "How were the in-house libraries prepared and sequenced?", "a": "For most species, RNA from several species was pooled to increase RNA quantity and reduce batch effects, and libraries were made by ribo-depletion with the Illumina TruSeq Stranded Total RNA Kit. C. plicata and L. anatina used poly(A) selection. Sequencing was on an Illumina NovaSeq 6000 with 150 bp paired-end reads.", "kw": ["ribo-depletion", "NovaSeq 6000"], "info": "In-house data are under NCBI BioProject PRJNA1402383. Public data came from 29 NCBI BioProjects and one CNGBdb project. Zebrafish embryos were raised at 28 C in batches of 100, stored in RNAlater, and extracted with the RNeasy Mini kit.", "concl": ""}, {"type": "qa", "section": "Methods - Mapping and quantification", "q": "Which tools and parameters were used for mapping and quantification?", "a": "Reads were aligned with STAR v2.7.11a in two-pass mode with permissive multimapping (--winAnchorMultimapNmax 200). Only protein-coding genes were quantified, with featureCounts v2.0.2: fragment-level (-p) counts over CDS with MAPQ >= 30 for exons, and over introns with MAPQ >= 30 and >= 30 bp intron overlap.", "kw": ["STAR", "featureCounts"], "info": "Replicates were aggregated per stage. Counts were converted to length-scaled TPMs, genes with TPM > 100,000 were removed as artifacts, and samples were renormalized to 1e6 TPM.", "concl": ""}, {"type": "qa", "section": "Methods - Detection of ZGA timing", "q": "How was the PCA metric computed?", "a": "A PCA was run on rlog-transformed (DESeq2, design ~1) TPM values of the 500 most variable genes. ZGA should show up as the first large jump between consecutive stages, measured as a variance-weighted Euclidean distance in the PC1-PC2 plane.", "kw": ["DESeq2", "rlog", "PCA"], "info": "In most species, stages followed a horseshoe-shaped trajectory in PC1-PC2 that recapitulated developmental order. PC1 and PC2 were weighted by their proportion of explained variance.", "concl": ""}, {"type": "qa", "section": "Methods - Detection of ZGA timing", "q": "How were 'newly transcribed' and 'strongly upregulated' genes defined?", "a": "Newly transcribed genes had < 1 TPM at MAT and > 5 TPM at stage i. Strongly upregulated genes had log2 fold change > 3 vs MAT, among genes with MAT expression >= 10 TPM. The union of the two sets per stage was the activation readout.", "kw": ["upregulated genes"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Detection of ZGA timing", "q": "How was the intron/exon ratio metric filtered?", "a": "Only intron-containing genes with >= 50 exonic counts at every stage were used. A maternal mask kept only genes with MAT-stage I/E <= 0.05 and no more than 1.5 times the ratio at the last stage. Change was measured as I/E delta = ratio at stage i minus ratio at MAT, trimming the top and bottom 1%.", "kw": ["intron/exon ratio", "maternal masking"], "info": "Rationale: new pre-mRNAs carry intronic signal before splicing, while maternal transcripts are deposited fully processed. Masking deals with poor annotations in non-model species, residual intronic signal from abundant maternal transcripts, and low depth.", "concl": ""}, {"type": "qa", "section": "Methods - Detection of ZGA timing", "q": "How were the three metrics combined into a ZGA call, and how was the threshold chosen?", "a": "Each metric was scaled to its species maximum and the three were averaged per stage. ZGA delta is the change in this composite between consecutive stages, and the ZGA stage is the first stage where ZGA delta exceeds 0.1. The threshold was chosen by scanning 0.001 to 1 (step 0.001) on seven model species with well-known ZGA.", "kw": ["ZGA delta", "calibration"], "info": "Calibration species: human, mouse, zebrafish, medaka, Xenopus tropicalis, C. elegans and D. melanogaster. A cutoff of 0.1 recovered the correct stage in all 7 (100%). All calls were checked visually, and 7 species with noisy metrics or weaker secondary waves were manually curated (Table S3).", "concl": ""}, {"type": "qa", "section": "Methods - Cell cycle and time units", "q": "How was ZGA onset converted into cell cycles when cleavages are asynchronous?", "a": "For early, synchronous ZGA the cycle came directly from cell counts. For asynchronous cleavages (e.g., nematodes) or later stages, the mean cell cycle was inferred from total cell number; for example, about 300 cells was assigned cycle 8 (2^8 = 256).", "kw": ["mean cell cycle"], "info": "Absolute time is labelled 'hpf' throughout, but some public sources used other reference points (hours post copula, after ootheca formation, after egg extrusion), listed in Table S4. Slow developers were mammals, two nematodes and one jawless vertebrate; all others were classed as fast. This split is a practical, data-driven category, not a strict biological class.", "concl": ""}, {"type": "qa", "section": "Methods - Phylogenetic comparative statistics", "q": "Which phylogenetic comparative methods were used?", "a": "Phylogenetic signal was measured with Blomberg's K and Pagel's lambda (phytools v1.9-16 phylosig; 10,000 randomizations for K, likelihood-ratio test for lambda). Ancestral states were estimated with contMap and fastAnc under Brownian motion. Categorical traits were tested with phylANOVA (10,000 simulations).", "kw": ["phytools", "Pagel's lambda", "Blomberg's K"], "info": "Continuous traits: R2 values come from OLS and P values from PGLS. PGLS was fitted with nlme v3.1-155 gls using ape v5.7-1 corPagel (lambda starting at 0.5) and with caper v1.0.3 pgls under Brownian motion. Pseudo-R2 came from rr2 v1.1.1, and phylogenetically independent contrasts from ape pic.", "concl": ""}, {"type": "qa", "section": "Methods - Estimation of egg volume", "q": "How was egg volume estimated, especially for yolky fish eggs?", "a": "Spherical eggs were modelled as spheres (V = pi*d^3/6) and elongated eggs as prolate spheroids (V = pi*L*W^2/6). For chicken, zebrafish and medaka, where yolk is concentrated in a distinct region, only the non-yolk embryonic cell volume was used.", "kw": ["egg volume", "yolk", "ImageJ"], "info": "When no measurements were published, egg dimensions were taken from published microscopy images with ImageJ v1.54g. All values are in Table S4.", "concl": ""}, {"type": "qa", "section": "Methods - ZGA-related scores and gene sets", "q": "How is the ZGAscore calculated?", "a": "Genes with 1 to 5,000 TPM were kept and renormalized. Sharp onsets (ZGApre or MAT < 1 TPM with ZGA >= 10 TPM, or ZGApre or MAT < 5 TPM with ZGA >= 25 TPM) score 50 + ZGA/MAT. Other genes score 2*(ZGA/MAT + ZGA/ZGApre) + ZGA+1/MAT + ZGA+1/ZGApre.", "kw": ["ZGAscore"], "info": "Scores are capped at 0 to 100 and use +1 smoothed ratios. ZGA+1 and ZGA+2 scores use the same logic relative to the previous stage. ZGA+2 could not be computed for 5 species (Bgr, Bbu, Oar, Csa, Cpl). MATtop = top 500 genes by MAT expression, used where equal set sizes were needed.", "concl": ""}, {"type": "qa", "section": "Methods - Genomic features and GO", "q": "How were genomic features and GO annotations computed?", "a": "One representative transcript (longest CDS) per gene was used to compute intron number, gene length, 3' UTR length, codon usage bias (SCUO in coRdon v1.27.0), GC content and mean intergenic distance. GO terms came from eggNOG-mapper v2.1.12 and were reduced to 2,172 non-redundant human GO categories.", "kw": ["eggNOG-mapper", "coRdon", "fgsea"], "info": "GSEA used fgsea (scoreType = pos) on percentile ranks, testing categories with 10 to 1,000 genes. A term counted as universally enriched if significant in >= 60 species (MAT), >= 45 (ZGA, ZGA+1) or >= 40 (ZGA+2). Networks were drawn with Revigo v1.8.2.", "concl": ""}, {"type": "qa", "section": "Methods - Orthology and conservation", "q": "How were orthology and genomic or regulatory conservation defined?", "a": "Broccoli v1.2 on the 61 proteomes gave 28,578 orthogroups; genes with max expression < 1 TPM were removed. G-conservation is the log2 ratio of the proportion of conserved ZGA or MAT genes vs background in each target species, summarized by the median. R-conservation requires a target ortholog that is itself a ZGA or MATtop gene.", "kw": ["Broccoli", "genEra", "phylostratigraphy"], "info": "Gene ages came from genEra v1.4.1 (--query-cover 50). Group-specific orthogroups: >= 1 ZGA or MATtop gene, regulated in >= 50% of the group's species and in no other group. 'Regulated' means a ZGA or MATtop gene, or in the top 30th percentile. Only orthogroups with <= 250 genes were used. GO enrichment used a hypergeometric test, with a term assigned to an orthogroup if >= 20% of its genes carried it.", "concl": ""}, {"type": "note", "section": "Discussion", "text": "Direct or indirect timer? The paper cannot tell whether the DNA-to-cytoplasm ratio acts by titrating a maternal factor (histones, replication factors) or by lengthening the cell cycle. It suggests a species-specific mix."}, {"type": "note", "section": "Methods - Estimation of egg volume", "text": "Only the non-yolk volume was used for zebrafish, medaka and chicken, and the authors say 'active' vs yolk cytoplasm is hard to estimate. Check the Table S4 volumes for fish and how sensitive the fit is to this choice."}, {"type": "note", "section": "Results - Zygotic genes show low genomic and regulatory conservation", "text": "ZGA genes are young, group-specific and poorly conserved, yet ZGA functions (chromatin, Pol II transcription, splicing) are shared. How does new gene emergence become tied to ZGA regulation, and why are FET genes the only universally ZGA-activated family?"}], "key": "drerio/CampoBes_2026_bioRxiv_ZGA_timing_DNA_cytoplasm_ratio", "shared": "Damir · 2026", "preprint": "", "tags": [], "source_note": ""}, {"id": "Baranasic_2022", "title": "Multiomic atlas with functional stratification and developmental dynamics of zebrafish cis-regulatory elements", "category": "Genomic resources", "link": "https://doi.org/10.1038/s41588-022-01089-w", "note": "", "source_pdf": "papers/drerio/Baranasic_2022_NatGenet_zebrafish_CRE_multiomic_atlas.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this paper address?", "a": "Zebrafish is widely used for development and disease modelling but, unlike other animal models, it had no systematic functional annotation programme. The authors set up the international DANIO-CODE consortium and a central repository to store and process zebrafish developmental functional genomic data.", "kw": ["DANIO-CODE", "functional annotation"], "info": "The comparison programmes named are ENCODE, Roadmap Epigenome and modENCODE.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What are the main outputs of the paper?", "a": "A Data Coordination Center with 1,802 unpublished and reanalysed datasets, and more than 140,000 cis-regulatory elements identified across development. The paper also shows that elements active at zygotic genome activation differ from those active during organogenesis, and it matches regulatory elements between zebrafish and mouse beyond sequence similarity.", "kw": ["cis-regulatory elements", "DCC"], "info": "The DCC is at danio-code.zfin.org.", "concl": "Zebrafish developmental genomics can be extended to mammals through comparison that does not depend on sequence alignment."}, {"type": "qa", "section": "Introduction", "q": "Why was a zebrafish functional annotation effort needed even though zebrafish genomic studies already existed?", "a": "Separate zebrafish genomic datasets were largely out of reach for thousands of labs. Promoters and enhancers had been annotated for some adult tissues, but embryonic and larval stages, where most zebrafish research happens, had no functional annotation.", "kw": ["embryonic stages"], "info": "Zebrafish is used in more than 1,200 labs worldwide. DANIO-CODE started as a multinational bottom-up effort.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What were the aims of DANIO-CODE?", "a": "(i) Collect published and new genomic data from 38 labs with standardised metadata. (ii) Build a single data coordination center (DCC). (iii) Develop standard pipelines and remap all sequencing data. (iv) Build an integrated track hub for common genome browsers.", "kw": ["DCC", "track hub"], "info": "Further aims were integrated analysis to classify functional elements and their developmental dynamics, and new methods for comparing zebrafish with mammalian genomic data.", "concl": ""}, {"type": "qa", "section": "Results - The DANIO-CODE Data Coordination Center", "q": "What data does the DCC contain?", "a": "1,438 published datasets plus 366 datasets generated by consortium members to fill gaps. The new datasets are 15 CAGE-seq, 18 ChIP-seq, 11 ATAC-seq, 2 Hi-C and 320 4C-seq.", "kw": ["DCC", "CAGE-seq", "4C-seq"], "info": "1,438 + 366 = 1,804, which is slightly different from the 1,802 in the abstract. The paper does not explain the difference. Figure 1a summarises it as 1,802 samples, 38 stages, 38 labs and 19 assay types.", "concl": ""}, {"type": "qa", "section": "Results - The DANIO-CODE Data Coordination Center", "q": "How did they make datasets from different labs comparable?", "a": "All data were reprocessed from raw reads with standard pipelines: ENCODE pipelines for ChIP-seq and ATAC-seq, FANTOM for CAGE-seq, and the producers' pipelines for Hi-C, 4C-seq and other data. Quality and comparability checks were run within each data type.", "kw": ["ENCODE pipeline", "FANTOM"], "info": "Pipelines are on GitLab (gitlab.com/danio-code). Results are a public UCSC track hub that can also be uploaded to Ensembl, plus a WashU Epigenome Browser session. The DCC is updated periodically and is open for both download and upload.", "concl": ""}, {"type": "qa", "section": "Results - The DANIO-CODE Data Coordination Center", "q": "What is a PADRE?", "a": "A Predicted ATAC-seq-supported Developmental Regulatory Element. About 140,000 PADREs are in the track hub, annotated with ChromHMM chromatin-state categories.", "kw": ["PADRE", "ChromHMM"], "info": "These bulk-based predictions are supplemented with cell-type specificity from single-cell ATAC-seq.", "concl": ""}, {"type": "qa", "section": "Results - Transcript annotation and core promoter characterization", "q": "How did they improve transcript annotation?", "a": "Genome-wide transcriptome analyses annotate 5' UTRs poorly, so they used 139 developmental RNA-seq samples to identify 31,458 genes with 55,596 transcripts. These include 167 novel transcripts of uncertain coding potential (TUCP) and 726 lncRNA genes that are new to Ensembl and supported by CAGE.", "kw": ["TUCP", "lncRNA", "5' UTR"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Transcript annotation and core promoter characterization", "q": "How many promoters did CAGE identify?", "a": "TSSs were mapped from 34 CAGE samples covering 16 developmental stages. On average each sample had 22,500 active promoters, corresponding to 16,303 genes, and 4,070 novel promoters were added to 18,461 previously annotated Ensembl TSSs (GRCz10).", "kw": ["CAGE", "TSS", "promoterome"], "info": "They also curated 581 regulatory motifs representing 814 zebrafish TFs and predicted binding sites for them in all promoters.", "concl": ""}, {"type": "qa", "section": "Results - Transcript annotation and core promoter characterization", "q": "Why does an exact TSS position matter in practice?", "a": "Ensembl's RNA-seq-based TSSs were often far from the CAGE-defined TSSs, which affects guide RNA design. In dCas inhibition experiments, knockdown was more efficient when guides were designed against the dominant CAGE TSS rather than the Ensembl TSS.", "kw": ["dCas9", "CRISPRi", "TSS"], "info": "Targeting promoters to block transcription can avoid genetic compensation triggered by mutant RNA, which can mask mutant phenotypes. Expression reduction fell as the distance between guide and dominant CAGE TSS increased. 26 genes were tested (Fig. 2c).", "concl": "CAGE is more accurate than the current Ensembl pipeline for promoter detection."}, {"type": "qa", "section": "Results - Transcript annotation and core promoter characterization", "q": "How common are multi-promoter genes, and what do alternative promoters change?", "a": "They found 1,293 multi-promoter genes: 1,176 with one reference and one alternative promoter, and 117 with two or more alternative promoters. Of 978 transcript pairs with full CDS, 373 (38%) of the alternative promoters changed only the 5' UTR (e.g. dag1) and 605 changed the N-terminal protein sequence (e.g. bmp6).", "kw": ["alternative promoters", "dag1", "bmp6"], "info": "Reference and alternative promoter pairs showed both convergent and divergent expression dynamics. Reference promoters were on average more highly expressed.", "concl": ""}, {"type": "qa", "section": "Results - Transcript annotation and core promoter characterization", "q": "Is alternative promoter use conserved in mouse?", "a": "Mouse CAGE data from comparable embryonic stages gave 1,779 multi-promoter genes. Of the 974 (75%) zebrafish multi-promoter genes with a mouse ortholog, 294 (30%) used alternative promoters in mouse. These orthologs were more likely to be expressed at similar stages (P = 2.7e-5) and highly likely to have multiple promoters in mouse (P = 3.24e-58, Fisher's exact test).", "kw": ["FANTOM5", "KEGG"], "info": "Multi-promoter genes were enriched in KEGG signalling pathways in both zebrafish and mouse.", "concl": "Alternative promoters in signal transduction-associated genes appear to be conserved across vertebrates."}, {"type": "qa", "section": "Results - Transcript annotation and core promoter characterization", "q": "What is MARA, and what did it show?", "a": "Motif Activity Response Analysis models promoter expression dynamics from annotated TF binding sites to infer which TFs drive expression changes. Tead3 targets were upregulated from gastrulation onwards, Tgif1 targets were transiently downregulated, and NF-Y targets were downregulated from sphere stage onwards, consistent with the known activities of these TFs.", "kw": ["MARA", "ISMARA", "Tead3"], "info": "Tgif1 motif activity was anti-correlated with tgif1 mRNA (r = -0.92), supporting Tgif1 as a repressor. NF-Y motif activity correlated positively with nfyal (0.86) and negatively with nfya (-0.77), which suggests Nfya may replace Nfyal in the complex. The zebrafish annotation was added to the ISMARA webserver so any RNA-seq data can be analysed.", "concl": ""}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "How were PADREs defined and classified?", "a": "PADREs are reproducible ATAC-seq peaks from 4 pre-ZGA and 7 post-ZGA stages. They were then classified with ChromHMM using four histone marks at 5 post-ZGA stages.", "kw": ["PADRE", "ATAC-seq", "ZGA"], "info": "The four marks are H3K4me3, H3K27ac, H3K4me1 and H3K27me3.", "concl": ""}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "What did the UMAP of PADREs reveal?", "a": "It separated most ChromHMM functional classes, including promoters from enhancers. Near-symmetry around the y-axis reflected strand directionality, most clearly for promoters. Two clusters without chromatin marks were enriched for the CTCF motif with well-positioned flanking nucleosomes.", "kw": ["UMAP", "CTCF"], "info": "The method was developed to find known functional classes and possible new subclasses during development.", "concl": ""}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "How were enhancer predictions validated?", "a": "With two independent sets: enhancers with bidirectional eRNA signals called from nuclear CAGE, and a manually curated catalogue of published enhancers validated in transgenic reporter assays. Both co-localised with enhancer-classified PADREs on the UMAP.", "kw": ["eRNA", "transgenic reporter"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "How does DNA methylation behave at PADREs?", "a": "CG-rich promoter PADREs stayed hypomethylated across all stages. Less CG-dense enhancer PADREs became gradually hypermethylated during development and were then hypomethylated in adult somatic tissue.", "kw": ["DNA methylation"], "info": "Dynamically methylated PADREs varied in when and how strongly methylation changed. For example, conserved phylotypic enhancers started becoming hypomethylated at Prim-5.", "concl": ""}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "Which PADRE classes are most evolutionarily conserved?", "a": "Early-acting enhancers were less conserved than enhancers activated later. Enhancers had higher average phastCons than promoters, and poised elements were the most conserved.", "kw": ["phastCons", "poised enhancers", "hourglass model"], "info": "Conservation was measured by overlap with human CNEs and by cyprinid phastCons (grass carp, common carp, goldfish, zebrafish). Extended Data Fig. 5b also shows PADRE overlap with Mexican cavefish CNEs per stage. Wilcoxon P = 2.2e-16 for promoters vs enhancers and for enhancers vs Polycomb elements.", "concl": "Polycomb-bound enhancers may be a specific class important for differentiation and organogenesis, consistent with the hourglass model."}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "How was cell-type specificity assigned to PADREs, and what did it show?", "a": "PADREs were integrated with Prim-5 single-cell ATAC-seq. PADREs active in CNS neural precursors had 3-fold more H3K27ac than those in differentiating neurons. Muscle PADREs had H3K27ac and H3K4me1 levels similar to neural precursors but different accessibility profiles.", "kw": ["scATAC-seq", "Prim-5"], "info": "Of 155 transgenically validated enhancers active at Prim-5, 117 had a cell-type assignment. In 72 (62%) of those, the scATAC annotation matched at least one activity domain of the transgenic reporter.", "concl": ""}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "What are cPADREs, and what temporal classes did they show?", "a": "Consensus PADREs are about 140k regions open in at least two neighbouring stages. Non-promoter cPADREs were clustered by accessibility into 16 SOM classes, for example class 4 (active early, then decommissioned), class 6 (active from ZGA onwards) and class 14 (late). Only the early elements lacked H3K27ac at their peak.", "kw": ["cPADRE", "SOM"], "info": "", "concl": "Early and late enhancers have distinct chromatin and conservation profiles and form two separate classes of enhancers."}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "What are COPEs?", "a": "Constitutive Orphan Predicted Elements: 2,109 regions that are open throughout development but carry no observed chromatin marks at any stage. They co-localised with constitutive SOM class 6, and 40% contained a CTCF motif.", "kw": ["COPE", "CTCF"], "info": "Methods definition: constitutive distal PADREs (present at every stage) that are annotated as quiescent at every stage.", "concl": ""}, {"type": "qa", "section": "Results - Classification of genomic regulatory regions in development", "q": "What are DOPEs, and why are they interesting?", "a": "Dynamic Orphan Predicted Elements: 11,044 unmarked open regions that are open only at specific stages. Only 65 (0.6%) overlapped CAGE promoters. 2,513 carried active marks later in adult tissues but were already as open as active enhancers in the embryo.", "kw": ["DOPE", "primed enhancers"], "info": "Methods definition: cPADREs annotated as quiescent at every stage. They are called adult-marked DOPEs if they overlap H3K27ac regions in any adult tissue.", "concl": "Their opening precedes, or is uncoupled from, enhancer histone mark deposition, so they may be a previously unknown subtype of primed enhancers."}, {"type": "qa", "section": "Results - Developmental specialization of Pol II gene promoters", "q": "How were Pol II promoters classified by chromatin architecture?", "a": "CAGE-defined promoters at Dome and Prim-5 were clustered by nucleosome-resolution ATAC accessibility into 8 classes. Similar clusters were found in human embryonic stem cells, which indicates the architecture classes are conserved.", "kw": ["promoter architecture", "NFR"], "info": "The 8 classes are upstream offset, double NFR, wide, strong open, medium zygotic, narrow, medium constitutive and weak open.", "concl": ""}, {"type": "qa", "section": "Results - Developmental specialization of Pol II gene promoters", "q": "How do the promoter classes differ?", "a": "Mainly in their upstream configuration: width of the nucleosome-free region (NFR), strength of the central NFR signal, and presence of upstream open regions, all of which followed GC content. They also differed in histone marks, and every class except weak open produced antisense transcription (PROMPTs).", "kw": ["PROMPTs", "GC content"], "info": "Medium constitutive and weak open differed only in NFR amplitude. Weak open could reflect lower promoter activity or activity in only a subset of cells. Double NFR, wide and upstream offset had CAGE signal from both the main NFR and an upstream region, with sense stronger than antisense.", "concl": ""}, {"type": "qa", "section": "Results - Developmental specialization of Pol II gene promoters", "q": "Are promoter classes stable over development, and are they linked to particular gene sets?", "a": "Classes stayed stable from Dome to Prim-5, so they seem to reflect distinct regulatory mechanisms rather than stage-dependent activity states. Wide and strong open had the most conserved promoters and were enriched for transcription regulator genes. Double NFR was enriched for maternally expressed genes, while weak open and medium zygotic were mainly early and late zygotic respectively.", "kw": ["maternal genes", "GO enrichment"], "info": "Each class also had its own GO enrichment categories.", "concl": "Promoter classes show functional specialisation and are conserved across vertebrates."}, {"type": "qa", "section": "Results - Developmental dynamics and locus organization of enhancers", "q": "What are GRBs and bystander genes?", "a": "Genomic regulatory blocks are regions where many long-range enhancers of key developmental genes overlap highly conserved noncoding elements (HCNEs). They also contain bystander genes that do not respond to those enhancers, and GRB extent coincides with the TADs around developmental genes.", "kw": ["GRB", "HCNE", "TAD"], "info": "GRB TADs have a high density of extreme noncoding conservation. Non-GRB TADs do not.", "concl": ""}, {"type": "qa", "section": "Results - Developmental dynamics and locus organization of enhancers", "q": "How does chromatin opening differ between GRB and non-GRB TADs?", "a": "TAD boundaries (as defined in late Long-pec embryos) began opening as early as Dome and stayed open. Accessibility rose strongly across the whole TAD in GRB TADs, but only mildly and later in non-GRB TADs.", "kw": ["GRB TADs", "chromatin accessibility"], "info": "TADs started forming early but were fully formed only at later stages. Promoter-proximal enhancers were more common early and distal enhancers late.", "concl": ""}, {"type": "qa", "section": "Results - Developmental dynamics and locus organization of enhancers", "q": "What are H3K27ac ensembles?", "a": "Clusters of early-active (Dome stage) PADREs joined by uninterrupted H3K27ac signal. About 1,600 were detected, about 1,300 of them in TADs, and they were enriched in GRB TADs.", "kw": ["H3K27ac ensembles", "super-enhancers", "ROSE"], "info": "They resemble super-enhancers but are more numerous (231 super-enhancers reported in mouse and 411 in zebrafish) and appear early, before lineage determination. They were called with the ROSE algorithm on Dome-stage H3K27ac with TSS exclusion set to 500 bp.", "concl": "Because of their scale and early appearance, they are treated as distinct from super-enhancers."}, {"type": "qa", "section": "Results - Developmental dynamics and locus organization of enhancers", "q": "What features link H3K27ac ensembles to chromatin topology?", "a": "Promoters were enriched at ensemble boundaries, and ensembles contained most early enhancer PADREs. At Dome there were more Hi-C contacts within ensembles; by Prim-5 strong contacts spread across the whole TAD and H3K27ac narrowed to individual PADRE peaks. TADs with Dome ensembles were in the active A-compartment at Prim-5.", "kw": ["Hi-C", "A-compartment"], "info": "In GRB TADs, H3K27ac spread from the ensembles to fill the whole TAD at later stages. Late-only PADREs were long-range enhancers spread across the TAD and were not enriched in ensembles.", "concl": "Ensembles may help open chromatin in their host TADs on time."}, {"type": "qa", "section": "Results - Developmental dynamics and locus organization of enhancers", "q": "How do ensembles relate to gene expression?", "a": "Ensemble-associated promoters fell mostly into SOM clusters with peak expression in early post-ZGA stages: the Blastula-Gastrula Transition (BGT) and Gastrula-Segmentation Transition (GST) classes. GRB target genes associated with ensembles were expressed earlier than other GRB target genes.", "kw": ["BGT", "GST", "GRB target genes"], "info": "GRB TADs mainly contain ubiquitously expressed bystanders and late zygotic target genes. The BGT class appeared only in GRB TADs with an ensemble.", "concl": "Ensembles help activate early developmental genes. A target gene not in contact with an ensemble is expressed only once long-range interactions are in place."}, {"type": "qa", "section": "Results - Functional conservation of epigenetic subdomains", "q": "Why did they need a new method to compare zebrafish and mouse regulatory elements?", "a": "Existing methods depend on direct alignment, but noncoding sequence similarity is lost over the large fish-mammal distance. The new method uses the fact that functional elements often keep collinear syntenic positions while their spacing scales with genome size, especially in GRB TADs.", "kw": ["synteny", "bridging species", "anchors"], "info": "13 high-quality bridging species genomes and stepped pairwise alignments give multi-species anchors. Syntenic positions are then interpolated between anchors.", "concl": ""}, {"type": "qa", "section": "Results - Functional conservation of epigenetic subdomains", "q": "How much did the multi-species approach improve mapping?", "a": "GRB TADs were defined as the 1,000 TADs with the highest CNE density, split into 1-kb bins, and the bin centres were mapped from zebrafish to mouse. Compared with direct alignment, the multi-species approach cut the distance from bin centres to the nearest anchor 16-fold in zebrafish and 29-fold in mouse.", "kw": ["GRB TADs", "projection"], "info": "Zebrafish and mouse GRB TADs differ about two-fold in size. Fig. 6b used n = 528,830 bin centres.", "concl": ""}, {"type": "qa", "section": "Results - Functional conservation of epigenetic subdomains", "q": "Is H3K27me3 distribution conserved between zebrafish and mouse?", "a": "Using phylotypic stages (zebrafish Prim-5, mouse E10.5), shared H3K27me3 enrichment was significantly more likely in both directly alignable and non-alignable regions, for example at the irx3a locus without direct sequence conservation. Some TADs, such as those with her9 or celf5a, showed more species-specific signal.", "kw": ["H3K27me3", "irx3a", "phylotypic stage"], "info": "Extended Data Fig. 10e: alignable bins n = 22,403 and non-alignable n = 97,767, both P < 2.2e-16. Shuffled control P = 0.39 (Fisher's exact test). Mouse data were merged from 6 tissues (fore-, mid-, hindbrain, facial prominence, heart, limb) to create a virtual embryo, and the signal was quantile-normalised.", "concl": "Epigenomic subdomains can be conserved in location and span without sequence conservation."}, {"type": "qa", "section": "Results - Functional conservation of epigenetic subdomains", "q": "What are DC, IC and NC elements, and how conserved are they functionally?", "a": "Zebrafish ATAC peaks in GRB TADs were classed as directly conserved (DC, in direct alignment with mouse: 16,188, 11.5%), indirectly conserved (IC, alignable only through bridging species: 6,137, 4.4%) or non-conserved (NC). DC and IC elements shared DNase hypersensitivity, ChromHMM state and TFBS motifs with their mouse counterparts more than NC elements did.", "kw": ["indirectly conserved", "DNase-seq", "TFBS"], "info": "The IC count is 6,137 in the text but 6,173 in Fig. 6f, which also gives 118,272 NC peaks. Methods: IC means projected with score > 0.99, i.e. a summed distance to anchors under 150 bp along the optimal species path.", "concl": "IC elements are functionally conserved to a similar degree as DC elements even though they cannot be aligned directly."}, {"type": "qa", "section": "Results - Functional conservation of epigenetic subdomains", "q": "Are H3K27ac ensembles conserved in mouse?", "a": "Yes. Mouse H3K27ac signal was significantly enriched within the projected zebrafish ensembles (P < 2.2e-16, Fisher's exact test).", "kw": ["H3K27ac ensembles", "conservation"], "info": "Bins compared: n = 11,083 within and 93,020 outside ensembles, with enrichment defined as signal at or above the 80th percentile. Example: the ensemble next to the zebrafish aktip gene. Mouse data were previously published.", "concl": "Ensembles appear to be evolutionarily conserved epigenetic subdomains in vertebrates."}, {"type": "qa", "section": "Discussion", "q": "What do the authors suggest H3K27ac ensembles do?", "a": "They propose that ensembles organise nuclear topology as local interaction hubs around early active loci while TADs are first forming. They describe ensembles as distinct from super-enhancers that target lineage-determining genes.", "kw": ["H3K27ac ensembles", "TAD formation"], "info": "This is a proposed model based on correlation. The paper does not test it functionally.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What are the main limitations?", "a": "All datasets are bulk whole-embryo samples, which can hide chromatin dynamics of rare cell populations or different cell-cycle states. Enhancer marks from small cell numbers may also be lost through thresholding.", "kw": ["bulk samples", "limitations"], "info": "The authors argue that comparing intersections of independent chromatin features reduces averaging artefacts. They note COPEs and DOPEs may carry histone marks that have not been mapped yet.", "concl": "More single-cell data will be needed to further stratify cis-regulatory classes."}, {"type": "qa", "section": "Discussion", "q": "What practical uses do the authors foresee for the resource?", "a": "A foundation for single-cell transcriptome and open-chromatin studies, and targeted manipulation of genomic elements. The high-resolution promoter annotation can guide reagent design for gene regulation assays, transgenic cell labelling and transcription blocking.", "kw": ["applications"], "info": "The anchoring approach also lets zebrafish annotations add to mammalian and modENCODE functional maps.", "concl": ""}, {"type": "qa", "section": "Methods - Data collection", "q": "How were data collected and annotated in the DCC?", "a": "Community members uploaded demultiplexed FASTQ files and annotated them through the DCC web interface. Curators added strategically selected published datasets for under-represented stages or assays.", "kw": ["DCC", "metadata"], "info": "The data model is derived from SRA data structures and uses controlled vocabularies based on ZFIN nomenclature. Workflows ran on DNAnexus, and data freezes keep snapshots as new data are added.", "concl": ""}, {"type": "qa", "section": "Methods - Transcripts identification", "q": "Which pipeline was used to identify transcripts?", "a": "Wild-type paired-end stranded RNA-seq (6 datasets selected from 528) was aligned to GRCz10 with STAR v2.5.1b. Transcripts were called with StringTie v1.33b, merged with TACO (194,508 transcripts) and quantified with Salmon v0.11.2.", "kw": ["STAR", "StringTie", "Salmon"], "info": "Filters removed read-through and mono-exonic transcripts and those overlapping 3 or more Ensembl genes. Protein-coding transcripts over 200 kb and lncRNAs over 100 kb were excluded. Robust set = expressed in at least 2 closest stages. CAGE TCs within 500 bp were also considered, giving 70,354 permissive and 55,596 robust transcripts, which cover 23,568 and 22,065 of 35,117 Ensembl v91 genes. Exactly how the CAGE step defines the sets is worded unclearly.", "concl": ""}, {"type": "qa", "section": "Methods - Promoterome construction", "q": "How did they handle differences between CAGE protocols?", "a": "nAnTi CAGE samples had more signal from annotated exons (exon painting, attributed to recapping of degraded mRNAs) and more initiation at non-YC/YR dinucleotides than tagging CAGE. All CAGE tags not initiated at YC or YR dinucleotides were removed.", "kw": ["CAGEr", "nAnTi CAGE", "exon painting"], "info": "Signal was power-law normalised (alpha = 1.1, fit range 5 to 1,000 tags). CAGEr settings: threshold 0.7 TPM, distclu, maxDist 20, singletons removed unless above 5. Consensus clusters (tpmThreshold 1, maxDist 20) had to be expressed at 1 TPM or more in at least 2 consecutive stages, giving 27,781 consensus clusters.", "concl": ""}, {"type": "qa", "section": "Methods - Annotation of alternative transcript and alternative promoter", "q": "How were reference and alternative promoters defined?", "a": "As in Ensembl, the longest CAGE-supported transcript is the reference transcript and its promoter is the reference promoter. Transcripts with TSSs within 300 nt were excluded; the longest remaining distal transcript became an alternative transcript, and the process was repeated.", "kw": ["alternative promoters"], "info": "Transcript models came from Ensembl, RefSeq and DANIO-CODE RNA-seq. Mouse used FANTOM5 CAGE at E11 to E14 and the Ensembl ortholog table.", "concl": ""}, {"type": "qa", "section": "Methods - Motif activity analysis", "q": "How was the zebrafish motif set built and TFBSs predicted?", "a": "Zebrafish DNA-binding domains were found with HMMER and Pfam models, then aligned with BLAT to human and mouse DBDs with known motifs, assigning 814 zebrafish TFs to 581 motifs. TFBSs were predicted with MotEvo in promoter regions (500 bp either side of the CAGE TSR) aligned to goldfish, common carp and grass carp.", "kw": ["MotEvo", "HMMER", "BLAT"], "info": "Orthologous regions were found with LAST and aligned with T-Coffee. Motifs whose site counts correlated above r = 0.6 were merged into 489 motif groups, and ISMARA was run on the CAGE time course.", "concl": ""}, {"type": "qa", "section": "Methods - Functional segmentation of the genome", "q": "How was ChromHMM set up and which states were defined?", "a": "ChromHMM was run on H3K4me3, H3K27ac, H3K4me1 and H3K27me3 at Dome, 75%-epiboly, 5-9 somites, Prim-5 and Long-pec. They found 10 optimal states, labelled by reference to Roadmap: 2 active TSS, 2 TSS flanking, active enhancer, enhancer flanking, primed enhancer, poised, Polycomb repressed and quiescent.", "kw": ["ChromHMM", "histone marks"], "info": "Active enhancer = strong H3K27ac and H3K4me1 without H3K4me3. Primed = H3K4me1 only. Poised = H3K27me3 together with active marks. Most of the genome carries no marks. New data were generated for 5-9 somites and Long-pec.", "concl": ""}, {"type": "qa", "section": "Methods - PADREs", "q": "How exactly were PADREs called, and why not call them cCREs?", "a": "Stage-specific open regions were kept if consistent between replicates (IDR < 0.1). The authors used a new name rather than ENCODE cCREs because PADREs include open regions without functional marks and to emphasise the developmental focus.", "kw": ["IDR", "cPADRE"], "info": "The permissive cPADRE set (all PADREs merged) has about 240k elements. The strict set (open in at least 2 neighbouring stages) has about 140k and was used for all cPADRE analyses. New ATAC data were produced for the pre-ZGA stages and 30%-epiboly.", "concl": ""}, {"type": "qa", "section": "Methods - UMAP visualization", "q": "How was the UMAP feature matrix built?", "a": "Each ATAC peak summit was extended 750 bp each way and split into 13 bins. ATAC, H3K4me3, H3K27ac and H3K4me1 tags plus NucleoATAC nucleosome signal were counted per bin, standardised, concatenated into 65 features and reduced to 2 dimensions with UMAP.", "kw": ["UMAP", "NucleoATAC", "genomation"], "info": "Nucleosome signal was included because some factors, such as CTCF, have well-positioned nucleosomes around their sites.", "concl": ""}, {"type": "qa", "section": "Methods - Promoter classification by open chromatin", "q": "How were promoter architecture classes computed?", "a": "For each TSR, the dominant TSS (highest mean post-MBT expression, at least 0.2 TPM) was the reference, leaving 21,914 promoters. Prim-5 ATAC Tn5 cut sites were Gaussian-smoothed (SD 3 bp), log-transformed and clustered with k-means (k = 8) within 800 bp of the dominant TSS.", "kw": ["k-means", "Tn5 cut sites"], "info": "Post-MBT expression was measured from Shield to Long-pec.", "concl": ""}, {"type": "qa", "section": "Methods - Genomic coordinate projection", "q": "How does the multi-species projection choose bridging species?", "a": "A non-alignable position is projected by interpolating between two alignable anchors. Each species gets a score that decays exponentially with distance to the nearest anchor, scaled by genome size, and the best combination of bridging species is the shortest path through a 15-species graph, found with Dijkstra's algorithm.", "kw": ["Dijkstra", "anchor points", "projection"], "info": "The scaling factor comes from a distance half-life, the distance at which the score is 0.5. Path length = 1 minus the product of the scores. The 15 species include zebrafish and mouse plus bridging species such as Xenopus, spotted gar, chicken, human, medaka and carps.", "concl": ""}, {"type": "note", "section": "Results - Classification of genomic regulatory regions in development", "text": "DOPEs and COPEs are open with no detected histone marks. Do they carry unmapped marks, or is opening really uncoupled from mark deposition? Also, Extended Data Fig. 5b gives per-stage PADRE overlap with Mexican cavefish CNEs, worth going back to for Astyanax regulatory work."}, {"type": "note", "section": "Results - Developmental dynamics and locus organization of enhancers", "text": "Do H3K27ac ensembles cause early TAD formation and early target-gene activation, or only coincide with them? The evidence is correlative (Hi-C contacts, compartments, expression timing)."}, {"type": "note", "section": "Results - Functional conservation of epigenetic subdomains", "text": "The anchor-based synteny projection (bridging species, shortest path) could in principle map regulatory elements between distant fish such as Astyanax and zebrafish. How well does the IC class hold up with functional tests, not just shared chromatin features?"}], "key": "drerio/Baranasic_2022_NatGenet_zebrafish_CRE_multiomic_atlas", "shared": "", "preprint": "", "tags": ["Damir's paper"], "source_note": ""}], "comments": {}};
const CAT = DATA.catKeys;
const catVars = c => { const k = CAT[c]||"gen"; return `--cl:var(--c-${k});--cd:var(--c-${k}-d)`; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const papers = DATA.papers.map(p => {
  let n = 0;
  p.items.forEach(it => { if (it.type==="qa") it.uid = p.id + ":" + (n++); });
  return {...p, slug: slug(p.id), qas: p.items.filter(i => i.type==="qa")};
});
const bySlug = Object.fromEntries(papers.map(p => [p.slug, p]));
const cats = DATA.legend.filter(c => papers.some(p => p.category===c));

/* storage */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let known = new Set(store.get("pn-known", []));
const saveKnown = () => store.set("pn-known", [...known]);
let theme = store.get("pn-theme", "auto");
function applyTheme(){
  if (theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = "Theme: " + theme;
}
document.getElementById("theme").onclick = () => {
  theme = theme==="auto" ? "light" : theme==="light" ? "dark" : "auto";
  store.set("pn-theme", theme); applyTheme();
};
applyTheme();

const totalQ = papers.reduce((a,p) => a + p.qas.length, 0);
document.getElementById("tot").textContent = `${papers.length} papers, ${totalQ} questions`;

/* state */
let activeCats = new Set();
let current = null;
let query = "";
const main = document.getElementById("main");

function renderCats(){
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat" style="${catVars(c)}" aria-pressed="${activeCats.has(c)}" data-cat="${esc(c)}"><span class="dot" style="background:var(--cd)"></span>${esc(c)}</button>`).join("");
}
document.getElementById("cats").onclick = e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  const c = b.dataset.cat; activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
  renderCats(); renderList(); if (!current && !query) renderHome();
};
const visible = () => papers.filter(p => !activeCats.size || activeCats.has(p.category));

function renderList(){
  document.getElementById("plist").innerHTML = visible().map(p => {
    const k = p.qas.filter(q => known.has(q.uid)).length;
    return `<li><button class="pitem" style="${catVars(p.category)}" data-p="${p.slug}" aria-current="${current===p}">
      <span class="tab" style="background:var(--cd)"></span>
      <span><b>${esc(p.id.replace("_"," "))}${(p.tags||[]).length ? `<span class="star" title="${esc(p.tags.join(", "))}">★</span>` : ""}</b><span class="t">${esc(p.title)}</span></span>
      <span class="n">${p.qas.length ? (k ? k+"/" : "") + p.qas.length : "—"}</span></button></li>`;
  }).join("");
}
document.getElementById("plist").onclick = e => {
  const b = e.target.closest("[data-p]"); if (b) go(b.dataset.p);
};

function go(s){
  document.body.classList.remove("drawer");
  if (location.hash.slice(1) !== s) location.hash = s; else route();
}
function route(){
  const h = location.hash.slice(1);
  if (query){ clearSearch(); }
  current = bySlug[h] || null;
  renderList();
  current ? renderPaper(current) : renderHome();
  document.getElementById("mtitle").textContent = current ? current.id.replace("_"," ") : DATA.page.label;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
const homeEl = document.getElementById("home");
homeEl.onclick = () => { history.pushState(null,"",location.pathname); route(); };
homeEl.onkeydown = e => { if (e.key==="Enter") homeEl.click(); };

function renderHome(){
  const list = visible();
  const groups = cats.filter(c => list.some(p => p.category===c));
  const k = papers.reduce((a,p) => a + p.qas.filter(q => known.has(q.uid)).length, 0);
  main.innerHTML = `<div class="home">
    <h2>${esc(DATA.page.label)}</h2>
    <p class="lead">${totalQ} questions across ${papers.length} papers. Open a paper to quiz yourself one answer at a time, or study the whole set as flashcards. You know ${k} of them so far. Last updated ${esc(DATA.page.updated)}.</p>
    <div class="toolbar"><button class="btn primary" id="studyAll">Study ${activeCats.size ? "these categories" : "everything"}</button></div>
    ${groups.map(c => `<div class="grp" style="${catVars(c)}"><h3><span class="dot" style="background:var(--cd)"></span>${esc(c)}</h3>
      ${list.filter(p => p.category===c).map(p => {
        const kn = p.qas.filter(q => known.has(q.uid)).length, pct = p.qas.length ? kn/p.qas.length*100 : 0;
        return `<button class="prow" data-p="${p.slug}"><b>${esc(p.id.replace("_"," "))}${(p.tags||[]).length ? `<span class="star" title="${esc(p.tags.join(", "))}">★</span>` : ""}</b><span>${esc(p.title)}</span>
          <div>${p.qas.length ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="barlab">${kn} of ${p.qas.length} known</div>` : `<div class="barlab">${p.missing_pdf ? "PDF missing" : "No notes yet"}</div>`}</div></button>`;
      }).join("")}</div>`).join("")}
  </div>`;
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => go(b.dataset.p));
  document.getElementById("studyAll").onclick = () => startStudy(list.flatMap(p => p.qas.map(q => [p,q])), activeCats.size ? [...activeCats].join(", ") : "All papers");
}

function hl(text){
  text = esc(text);
  if (!query) return text;
  const re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","gi");
  return text.replace(re, "<mark>$1</mark>");
}
function qaHTML(p, it, open){
  const extra = [["Details", it.info], ["Takeaway", it.concl]].filter(x => x[1]);
  return `<div class="qa${open ? " open" : ""}" style="${catVars(p.category)}">
    <button class="qbtn" aria-expanded="${!!open}"><span class="qt">${hl(it.q || "Note")}</span>
      <span class="qmeta">${it.novel ? `<span class="novel">New to me</span>` : ""}${known.has(it.uid) ? `<span class="known">Known</span>` : ""}
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></span></button>
    <div class="ans">
      ${it.a ? `<p class="a">${hl(it.a)}</p>` : ""}
      ${extra.length ? `<dl class="extra">${extra.map(([k,v]) => `<dt>${k}</dt><dd>${hl(v)}</dd>`).join("")}</dl>` : ""}
      ${it.kw.length ? `<div class="kws">${it.kw.map(k => `<button class="kw" data-kw="${esc(k)}" title="Search for ${esc(k)}">${esc(k)}</button>`).join("")}</div>` : ""}
    </div></div>`;
}
function bindQA(root){
  root.querySelectorAll(".qbtn").forEach(b => b.onclick = () => {
    const qa = b.parentElement; qa.classList.toggle("open"); b.setAttribute("aria-expanded", qa.classList.contains("open"));
  });
  root.querySelectorAll("[data-kw]").forEach(b => b.onclick = () => { qInput.value = b.dataset.kw; doSearch(); });
}

function renderPaper(p){
  const kn = p.qas.filter(q => known.has(q.uid)).length;
  const secs = [];
  p.items.forEach(it => { const s = it.section || "Notes"; if (!secs.includes(s)) secs.push(s); });
  let body = "";
  if (!p.items.length) body = `<p class="empty">${p.missing_pdf ? `The PDF is not in the folder yet (it needs a subscription). Download it with Open paper and save it as ${esc(p.missing_pdf)}. Notes are written in the next weekly update (Wednesdays 04:00).` : `There are no notes for this paper yet. They are generated in the weekly update (Wednesdays 04:00) from ${esc(p.source_pdf || "the PDF")}.`}</p>`;
  secs.forEach((s,i) => {
    body += `<h3 class="sec" id="s-${i}">${esc(s)}</h3>`;
    p.items.filter(it => (it.section || "Notes")===s).forEach(it => {
      body += it.type==="note" ? `<p class="notep">${esc(it.text)}</p>` : qaHTML(p, it, false);
    });
  });
  main.innerHTML = `<header class="phead" style="${catVars(p.category)}">
      <div class="who"><span>${esc(p.id.replace("_",", "))}</span><span class="tag">${esc(p.category)}</span>${(p.tags||[]).map(t => `<span class="badge">${esc(t)}</span>`).join("")}${p.shared ? `<span class="shared">Shared by ${esc(p.shared)}</span>` : ""}${p.link ? `<a class="open" href="${esc(p.link)}" target="_blank" rel="noopener">Open paper</a>` : ""}${p.preprint ? `<a class="open" href="${esc(p.preprint)}" target="_blank" rel="noopener" title="Earlier preprint version">Preprint</a>` : ""}</div>
      <h2>${esc(p.title)}</h2>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}${p.source_note ? `<p class="srcnote">⚠ ${esc(p.source_note)}</p>` : ""}
    </header>
    ${p.qas.length ? `<div class="toolbar">
      <button class="btn primary" id="studyP">Study as flashcards</button>
      <button class="btn" id="toggleAll">Show all answers</button>
      <span class="prog">${kn} of ${p.qas.length} known</span></div>` : ""}
    ${secs.length > 2 ? `<nav class="secnav" aria-label="Sections">${secs.map((s,i) => `<button data-s="${i}">${esc(s)}</button>`).join("")}</nav>` : ""}
    <div id="items">${body}</div>${commentHTML(p)}`;
  bindQA(main);
  bindComments(p);
  main.querySelectorAll("[data-s]").forEach(b => b.onclick = () => document.getElementById("s-"+b.dataset.s).scrollIntoView({behavior:"smooth"}));
  const t = document.getElementById("toggleAll");
  if (t) t.onclick = () => {
    const all = main.querySelectorAll(".qa"), open = t.textContent.startsWith("Show");
    all.forEach(q => { q.classList.toggle("open", open); q.querySelector(".qbtn").setAttribute("aria-expanded", open); });
    t.textContent = open ? "Hide all answers" : "Show all answers";
  };
  const sp = document.getElementById("studyP");
  if (sp) sp.onclick = () => startStudy(p.qas.map(q => [p,q]), p.id.replace("_"," "));
}

/* comments */
const COMMENTS = Object.assign({}, DATA.comments || {});
let serverOK = null;  // true when served by serve_notes.py (comments editable)
const cmtStamp = c => c && c.updated ? c.updated.replace("T", " ").slice(0, 16) : "";
function commentHTML(p){
  const c = COMMENTS[p.key] || {};
  const ro = serverOK === false;
  const status = ro ? `Read-only here: open the page through the notes server (start_notes_server.sh) to edit.${c.updated ? " Last saved " + cmtStamp(c) + "." : ""}`
               : (c.updated ? `Saved · ${cmtStamp(c)}` : "Comments are saved automatically as you type.");
  return `<section class="comments"><h3 class="sec">My comments</h3>
    <textarea id="cmtText" placeholder="Your thoughts on this paper and on its notes…"${ro ? " readonly" : ""}>${esc(c.text || "")}</textarea>
    <div class="cmtstatus" id="cmtStatus">${esc(status)}</div></section>`;
}
function bindComments(p){
  const ta = document.getElementById("cmtText"), st = document.getElementById("cmtStatus");
  if (!ta || serverOK === false) return;
  let timer, last = ta.value;
  const save = async () => {
    clearTimeout(timer);
    if (ta.value === last) return;
    const text = ta.value; st.textContent = "Saving…";
    try {
      const r = await fetch("/api/comments", {method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify({key: p.key, text})});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); last = text; COMMENTS[p.key] = {text, updated: j.updated};
      st.textContent = "Saved · " + cmtStamp(COMMENTS[p.key]);
    } catch (e) { st.textContent = "Not saved (" + e.message + "). Is the notes server running?"; }
  };
  ta.addEventListener("input", () => { st.textContent = "Unsaved changes…"; clearTimeout(timer); timer = setTimeout(save, 800); });
  ta.addEventListener("blur", save);
}
(async () => {  // detect the notes server and load the newest comments
  try {
    const r = await fetch("/api/comments?folder=" + encodeURIComponent(DATA.page.folder), {credentials: "same-origin"});
    if (!r.ok) throw 0;
    Object.assign(COMMENTS, await r.json()); serverOK = true;
  } catch (e) { serverOK = false; }
  if (current && !query) renderPaper(current);
})();

/* search */
const qInput = document.getElementById("q");
let tmr;
qInput.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(doSearch, 120); });
function clearSearch(){ query = ""; qInput.value = ""; }
function doSearch(){
  query = qInput.value.trim();
  document.body.classList.remove("drawer");
  if (!query){ route(); return; }
  const ql = query.toLowerCase();
  const res = visible().map(p => [p, p.qas.filter(it =>
    [it.q, it.a, it.info, it.concl, ...it.kw].join(" ").toLowerCase().includes(ql))]).filter(r => r[1].length);
  const n = res.reduce((a,r) => a + r[1].length, 0);
  main.innerHTML = `<div class="home"><h2>“${esc(query)}”</h2>
    <p class="lead">${n ? `${n} matching question${n>1?"s":""} in ${res.length} paper${res.length>1?"s":""}.` : "Nothing matches. Try a shorter word or a tool name, such as BUSCO or QTL."}</p>
    ${res.map(([p, its]) => `<div class="rgroup" style="${catVars(p.category)}"><h3><span class="dot" style="background:var(--cd)"></span><button data-p="${p.slug}">${esc(p.id.replace("_"," "))}</button></h3>
      ${its.map(it => qaHTML(p, it, true)).join("")}</div>`).join("")}</div>`;
  bindQA(main);
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { clearSearch(); go(b.dataset.p); });
}

/* flashcards */
const study = document.getElementById("study"), stage = document.getElementById("stage");
let deckAll = [], deck = [], pos = 0, flipped = false, sLabel = "";
const sShuffle = document.getElementById("sShuffle"), sNew = document.getElementById("sNew");
function startStudy(cards, label){
  deckAll = cards; sLabel = label; buildDeck();
  study.classList.add("on"); document.body.style.overflow = "hidden";
  document.getElementById("bFlip").focus();
}
function buildDeck(){
  deck = deckAll.filter(([,q]) => !sNew.checked || !known.has(q.uid));
  if (sShuffle.checked) for (let i = deck.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
  pos = 0; showCard();
}
sShuffle.onchange = buildDeck; sNew.onchange = buildDeck;
function showCard(){
  flipped = false;
  document.getElementById("sTitle").textContent = sLabel;
  document.getElementById("sTrack").style.width = (deck.length ? pos/deck.length*100 : 100) + "%";
  const ctl = document.getElementById("sctl");
  if (pos >= deck.length){
    const k = deckAll.filter(([,q]) => known.has(q.uid)).length;
    document.getElementById("sCount").textContent = "";
    ctl.style.visibility = "hidden";
    stage.innerHTML = `<div class="done"><h3>${deck.length ? "Deck finished" : "Nothing left to review"}</h3>
      <p>You know ${k} of ${deckAll.length} cards in this set.</p>
      <button class="btn primary" id="again">Go through again</button> <button class="btn" id="fin">Close</button></div>`;
    document.getElementById("again").onclick = buildDeck;
    document.getElementById("fin").onclick = closeStudy;
    return;
  }
  ctl.style.visibility = "visible";
  document.getElementById("sCount").textContent = `${pos+1} / ${deck.length}`;
  const [p, q] = deck[pos];
  const src = `<div class="src"><span class="tag">${esc(p.id.replace("_"," "))}</span><span>${esc(q.section)}</span></div>`;
  stage.innerHTML = `<div class="card" id="card" style="${catVars(p.category)}" role="button" tabindex="0" aria-label="Flip card">
    <div class="face">${src}<p class="q">${esc(q.q)}</p><p class="hint">Tap the card or press space to see the answer</p></div>
    <div class="face back">${src}<p class="bq">${esc(q.q)}</p><p class="ba">${esc(q.a || "")}</p>
      ${q.concl ? `<dl class="extra"><dt>Takeaway</dt><dd>${esc(q.concl)}</dd></dl>` : ""}</div></div>`;
  document.getElementById("card").onclick = flip;
}
function flip(){ const c = document.getElementById("card"); if (!c) return; flipped = !flipped; c.classList.toggle("flip", flipped); }
function mark(good){
  if (pos >= deck.length) return;
  const q = deck[pos][1];
  good ? known.add(q.uid) : known.delete(q.uid);
  saveKnown(); pos++; showCard();
}
document.getElementById("bFlip").onclick = flip;
document.getElementById("bGood").onclick = () => mark(true);
document.getElementById("bAgain").onclick = () => mark(false);
function closeStudy(){
  study.classList.remove("on"); document.body.style.overflow = "";
  renderList(); if (query) doSearch(); else current ? renderPaper(current) : renderHome();
}
document.getElementById("sClose").onclick = closeStudy;
document.addEventListener("keydown", e => {
  if (!study.classList.contains("on")) return;
  if (e.target.tagName==="INPUT") return;
  if (e.key===" "){ e.preventDefault(); flip(); }
  else if (e.key==="1" || e.key==="ArrowLeft") mark(false);
  else if (e.key==="2" || e.key==="ArrowRight") mark(true);
  else if (e.key==="Escape") closeStudy();
});

/* mobile drawer */
document.getElementById("menu").onclick = () => document.body.classList.add("drawer");
document.getElementById("scrim").onclick = () => document.body.classList.remove("drawer");

renderCats(); route();
</script>
</body>
</html>
