<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper notes · Danio rerio</title>
<script data-pn="font">try{if(JSON.parse(localStorage.getItem("pn-font"))==="verdana")document.documentElement.setAttribute("data-font","verdana")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2632; --muted:#5A6878; --rule:#D3DAE1; --hover:#E3E8ED;
  --focus:#2F6FB3; --good:#2E7D4F; --again:#B4562E;
  --c-mex:#C9DAF8; --c-mex-d:#3D6DBF;
  --c-emb:#FCE5CD; --c-emb-d:#C47A2C;
  --c-gen:#D9EAD3; --c-gen-d:#4E8A3E;
  --c-dam:#EAD1DC; --c-dam-d:#A3527A;
  --c-oth:#D8D1EE; --c-oth-d:#6B57B0;
  --c-ali:#FFF2CC; --c-ali-d:#B08A12;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
    --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
    --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
    --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
    --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
  --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
  --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
  --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
  --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
  color-scheme:dark;
}
:root[data-font="verdana"]{--serif:Verdana, Geneva, "DejaVu Sans", sans-serif; --sans:Verdana, Geneva, "DejaVu Sans", sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--rule);padding:22px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{padding:0 22px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0;letter-spacing:-.01em;cursor:pointer}
.brand small{color:var(--muted);font-size:.82rem}
.search{margin:0 22px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px}
.cat{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 10px 4px 8px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist{list-style:none;margin:0;padding:0 12px}
.pitem{display:grid;grid-template-columns:6px 1fr auto;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 10px 10px 8px;align-items:start}
.pitem:hover{background:var(--hover)}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--rule)}
.pitem .tab{align-self:stretch;border-radius:3px}
.pitem b{display:block;font-weight:600;font-size:.92rem}
.pitem span.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.pitem .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:0 22px}
.sortl{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.sortl select{border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);padding:4px 6px;font-size:.82rem;max-width:160px}
.tagf{font-size:.82rem}
.tagf[open]{flex-basis:100%}
.tagf summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:8px;padding:4px 10px;color:var(--muted)}
.tagf summary::-webkit-details-marker{display:none}
.tagf summary::after{content:"\25BE";font-size:.7rem;margin-left:2px}
.tagf[open] summary::after{content:"\25B4"}
.tagf.on summary{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.tagbody{margin-top:8px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.tmode{display:inline-flex;align-self:flex-start;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tmode button{background:none;border:0;padding:3px 12px;font-size:.8rem;color:var(--muted)}
.tmode button+button{border-left:1px solid var(--rule)}
.tmode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.thint{color:var(--muted);font-size:.78rem;margin:-2px 0 0}
.taglist{display:flex;flex-direction:column;gap:4px}
.tagi{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink)}
.tagi input{accent-color:var(--ink);margin:0}
.tagi small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--rule);padding-top:8px}
.tfoot button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.8rem}
.tfoot button:hover{color:var(--ink)}
.tfoot button:disabled{opacity:.45;cursor:default;text-decoration:none}
.sfoot{margin:auto 22px 0;display:flex;flex-wrap:wrap;gap:8px}
.theme{background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--muted)}

main{padding:40px clamp(20px,5vw,64px) 80px;max-width:900px;width:100%}
.mtop{display:none}
.phead{border-left:6px solid var(--cd);padding-left:20px;margin-bottom:28px}
.phead .who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.9rem}
.tag{background:var(--cl);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.8rem}
.shared{border:1px solid var(--rule);border-radius:6px;padding:1px 8px;font-size:.8rem;color:var(--muted)}
.badge{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:600}
.star{color:var(--cd);margin-left:4px}
.phead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;letter-spacing:-.015em;margin:10px 0 12px;max-width:34ch}
.phead .srcnote{font-size:.88rem;color:var(--again);border-left:3px solid var(--again);padding:2px 0 2px 10px;margin:8px 0 6px;max-width:68ch}
.phead .note{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 4px;max-width:62ch}
.phead a.open{font-size:.9rem;font-weight:500;color:var(--cd);text-decoration:none;border-bottom:1px solid currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 26px}
.secnav button{text-align:left;background:none;border:0;border-bottom:1px dashed var(--rule);padding:2px 0;margin-right:12px;font-size:.84rem;color:var(--muted)}
.secnav button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.prog{font-size:.85rem;color:var(--muted);margin-left:auto}

h3.sec{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.qa{border-bottom:1px solid var(--rule)}
.qa:last-child{border-bottom:0}
.qbtn{display:grid;grid-template-columns:1fr auto;gap:16px;width:100%;text-align:left;background:none;border:0;padding:14px 0;font-weight:500;font-size:1rem;line-height:1.4}
.qbtn:hover .qt{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.qmeta{display:flex;gap:8px;align-items:center;padding-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
.qa.open .chev{transform:rotate(90deg)}
.known{font-size:.72rem;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.novel{font-size:.72rem;color:var(--cd);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.ans{display:none;padding:0 0 18px}
.qa.open .ans{display:block;animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ans p.a{font-family:var(--serif);font-size:1.04rem;line-height:1.65;margin:0 0 12px;max-width:66ch}
.extra{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;font-size:.92rem;margin:0 0 12px;max-width:72ch}
.extra dt{color:var(--muted);font-size:.84rem;padding-top:2px}
.extra dd{margin:0;line-height:1.55}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:var(--cl);border:0;border-radius:6px;padding:2px 9px;font-size:.8rem}
.kw:hover{outline:1px solid var(--cd)}
.notep{font-family:var(--serif);font-style:italic;color:var(--muted);padding:12px 0 12px 14px;border-left:2px solid var(--rule);margin:8px 0}
.empty{font-family:var(--serif);color:var(--muted);padding:30px 0;max-width:52ch}
.comments{margin-top:44px}
.comments textarea{width:100%;min-height:140px;resize:vertical;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);font-family:var(--serif);font-size:1rem;line-height:1.6}
.comments textarea[readonly]{opacity:.8}
.cmtstatus{font-size:.82rem;color:var(--muted);margin-top:6px}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:2px}

/* home */
.home h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em;margin:0 0 6px}
.home .lead{color:var(--muted);margin:0 0 34px;max-width:58ch}
.grp{margin-bottom:30px}
.grp h3{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;margin:0 0 8px}
.prow{display:grid;grid-template-columns:120px 1fr 120px;gap:16px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:12px 4px;text-align:left}
.prow:hover{background:var(--hover)}
.prow b{font-weight:600;font-size:.92rem}
.prow span{font-family:var(--serif);font-size:.95rem;line-height:1.35}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cd)}
.barlab{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* search results */
.rgroup{margin-bottom:26px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0 0 4px}
.rgroup h3 button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}

/* flashcards */
.study{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.study.on{display:flex}
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stop .ttl{font-weight:600}
.stop .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stop .x{margin-left:auto}
.track{height:4px;background:var(--rule);border-radius:2px;margin:14px 0 0;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stage{flex:1;display:grid;place-items:center;perspective:1600px;padding:24px 0;min-height:0}
.card{width:min(720px,100%);height:min(440px,100%);position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:18px;border:1px solid var(--rule);border-top:10px solid var(--cd);padding:28px clamp(20px,4vw,40px);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .src{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.face .q{font-family:var(--serif);font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.3;font-weight:500;margin:auto 0;letter-spacing:-.01em}
.face .bq{font-size:.9rem;color:var(--muted);margin:12px 0 10px}
.face .ba{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.25rem);line-height:1.6;margin:0 0 14px}
.face .hint{font-size:.82rem;color:var(--muted);text-align:center}
.sctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.again{color:var(--again);border-color:currentColor}
.btn.good{color:var(--good);border-color:currentColor}
.done{text-align:center;font-family:var(--serif)}
.done h3{font-size:1.8rem;font-weight:500;margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 20px}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

@media (max-width:820px){
  .shell{display:block}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);height:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  body.drawer .scrim{display:block}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px;align-items:center;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .mtop b{font-family:var(--serif);font-weight:600}
  main{padding-top:24px}
  .prow{grid-template-columns:1fr;gap:6px}
  .extra{grid-template-columns:1fr;gap:2px}
  .extra dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mtop"><button class="btn" id="menu" aria-label="Show paper list">Papers</button><b id="mtitle">Danio rerio</b></div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="side">
    <div class="brand"><h1 id="home" tabindex="0" role="link">Danio rerio</h1><small id="tot"></small></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search all notes" aria-label="Search all notes"></label>
    <div class="tools">
      <label class="sortl">Sort <select id="sort"><option value="default">Default</option><option value="author-az">Author A→Z</option><option value="author-za">Author Z→A</option><option value="year-new">Year, newest first</option><option value="year-old">Year, oldest first</option></select></label>
      <details class="tagf" id="tagf"><summary>Tags<span id="tagsum"></span></summary>
        <div class="tagbody">
          <div class="tmode" id="tmode" role="group" aria-label="Tag filter mode"><button type="button" data-mode="only" aria-pressed="true">Only</button><button type="button" data-mode="except" aria-pressed="false">Except</button></div>
          <p class="thint" id="thint"></p>
          <div class="taglist" id="taglist"></div>
          <div class="tfoot"><span id="vcount"></span><button type="button" id="tclear">clear</button></div>
        </div>
      </details>
    </div>
    <div class="cats" id="cats"></div>
    <ul class="plist" id="plist"></ul>
    <div class="sfoot"><button class="theme" id="theme">Theme: auto</button><button class="theme" id="font">Font: Literata</button></div>
  </aside>
  <main id="main"></main>
</div>

<section class="study" id="study" aria-label="Flashcards">
  <div class="stop">
    <span class="ttl" id="sTitle"></span><span class="count" id="sCount"></span>
    <div class="opts"><label><input type="checkbox" id="sShuffle"> Shuffle</label><label><input type="checkbox" id="sNew"> Skip cards I know</label></div>
    <button class="btn x" id="sClose">Close</button>
  </div>
  <div class="track"><i id="sTrack"></i></div>
  <div class="stage" id="stage"></div>
  <div class="sctl" id="sctl">
    <button class="btn again" id="bAgain">Review again <small>(1)</small></button>
    <button class="btn" id="bFlip">Flip <small>(space)</small></button>
    <button class="btn good" id="bGood">Got it <small>(2)</small></button>
  </div>
</section>

<script>
const DATA = {"page": {"label": "Danio rerio", "folder": "drerio", "updated": "2026-11-25"}, "legend": ["ZGA & early embryo", "Embryo development & nutrition", "Toxicology & exposures", "Genomic resources"], "catKeys": {"ZGA & early embryo": "mex", "Embryo development & nutrition": "gen", "Toxicology & exposures": "emb", "Genomic resources": "oth"}, "papers": [{"id": "Yang_2020", "title": "A map of cis-regulatory elements and 3D genome structures in zebrafish", "category": "Genomic resources", "link": "https://doi.org/10.1038/s41586-020-2962-9", "note": "", "source_pdf": "papers/drerio/Yang_2020_Nature_zebrafish_CRE_3D_genome_map.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this paper address?", "a": "About 70% of human protein-coding genes are conserved in zebrafish, but zebrafish studies are held back by sparse annotation of functional control elements in its genome.", "kw": ["cis-regulatory elements", "annotation"], "info": "Most earlier zebrafish genomic studies used whole embryos, so little was known about tissue-specific regulators.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did they generate overall?", "a": "Maps of transcriptomes, cis-regulatory elements, heterochromatin, methylomes and 3D genome organization in up to eleven adult and two embryonic tissues of the Tübingen reference strain. They used RNA-seq, ATAC-seq, ChIP-seq, WGBS and Hi-C.", "kw": ["Tübingen", "multi-omics"], "info": "They also did scATAC-seq in brain, which gave 25 cell clusters, and a de novo assembly of chromosome 4 from long-read sequencing plus Hi-C.", "concl": "An epigenomic anchor for functional annotation of vertebrate genomes and for studying conserved 3D genome organization."}, {"type": "qa", "section": "Abstract", "q": "What is the main evolutionary finding about TADs?", "a": "Evolutionary breakpoints are enriched at TAD boundaries, and these boundaries have strong H3K4me3 and CTCF signals.", "kw": ["TAD", "evolutionary breakpoints", "CTCF"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is zebrafish a useful vertebrate model?", "a": "It has high fecundity, external embryogenesis, rapid embryonic development and nearly transparent embryos.", "kw": ["model organism"], "info": "It is used for vertebrate development and ageing, comparative genomics and human disease modelling.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which histone marks did they profile and why?", "a": "They profiled H3K4me3, H3K27ac, H3K9me2 and H3K9me3, because combinations of histone modifications can predict classes of regulatory elements such as enhancers and repressors.", "kw": ["H3K27ac", "H3K4me3", "H3K9me3"], "info": "Hi-C was done only in adult brain and muscle, to study higher-order structure and link distal enhancers to their target genes.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why did they re-assemble chromosome 4?", "a": "Chromosome 4 is regarded as the rudimentary sex chromosome in zebrafish, but its current assembly is poor because it contains so much heterochromatin.", "kw": ["chromosome 4", "sex chromosome"], "info": "They did nanopore, 10X Genomics and Bionano optical mapping on one Tübingen female.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How large is the dataset?", "a": "161 genomic datasets comprising over 10 billion reads, which the authors describe as the most comprehensive analysis of candidate cis-regulatory elements in zebrafish to date.", "kw": [], "info": "The reporting summary lists 160 datasets (11 WGBS, 26 RNA-seq, 95 ChIP-seq, 22 ATAC-seq, 4 Hi-C, 2 scATAC-seq), which differs slightly from the 161 in the main text.", "concl": ""}, {"type": "qa", "section": "Results - Transcriptome analysis", "q": "How many transcripts did RNA-seq detect, and how many were novel?", "a": "They detected 39,188 transcripts, 14,764 of them tissue-specific. They also found 13,285 previously unknown transcripts, of which 8,311 were supported by H3K4me3 peaks at their promoters.", "kw": ["novel transcripts", "RNA-seq"], "info": "The 8,311 include 976 lncRNAs, 3,596 previously unknown isoforms and 3,739 potential previously uncharacterized protein-coding genes.", "concl": ""}, {"type": "qa", "section": "Results - Transcriptome analysis", "q": "Is tissue-specific expression conserved between zebrafish and human?", "a": "Partly. Of the 14,764 tissue-specific zebrafish transcripts, 3,737 have a one-to-one human orthologue, and 1,747 of these (47%) are also tissue-specific in human.", "kw": ["orthologues", "GTEx"], "info": "Example: myh6 in zebrafish and MYH6 in human are both heart-specific. Human data came from GTEx.", "concl": "These genes may have critical, conserved roles in the tissues where they are uniquely expressed."}, {"type": "qa", "section": "Results - Accessibility, promoter and enhancer dynamics", "q": "How many ATAC-seq peaks did they find?", "a": "66,771 to 180,788 peaks per tissue, merged into 436,036 non-redundant peaks across the 11 adult tissues. Of these, 116,353 had not been found in previous whole-embryo studies.", "kw": ["ATAC-seq", "chromatin accessibility"], "info": "Distal peaks were more tissue-specific than proximal peaks. The Methods give 436,035 representative open chromatin regions, one fewer than the main text.", "concl": ""}, {"type": "qa", "section": "Results - Accessibility, promoter and enhancer dynamics", "q": "How did they define classes of cis-regulatory elements?", "a": "Active promoter: H3K27ac + H3K4me3 + ATAC-seq. Weak promoter: H3K4me3 + ATAC-seq. Active enhancer: distal H3K27ac + ATAC-seq. Heterochromatin: H3K9me2 or H3K9me3 sites.", "kw": ["active enhancer", "weak promoter", "heterochromatin"], "info": "Across tissues this gave 25,593 active promoters, 40,220 weak promoters, 58,065 active enhancers and 112,445 heterochromatin sites.", "concl": ""}, {"type": "qa", "section": "Results - Accessibility, promoter and enhancer dynamics", "q": "How many of the predicted elements are new, and how tissue-specific are the enhancers?", "a": "40.9% of the predicted promoters and 62.5% of the predicted enhancers had not been found in previous reports. Of the enhancers, 71.3% were tissue-specific and also had tissue-specific ATAC-seq signal.", "kw": ["tissue-specific enhancers"], "info": "GO analysis put tissue-specific enhancers near genes with relevant tissue functions. The previous data were from the AB strain, while this study used Tübingen.", "concl": ""}, {"type": "qa", "section": "Results - Accessibility, promoter and enhancer dynamics", "q": "How did they validate the predicted enhancers?", "a": "With a GFP reporter assay in zebrafish embryos. 28 of the 32 tissue-specific enhancers tested (87.5%) gave restricted GFP expression.", "kw": ["reporter assay", "GFP"], "info": "Examples: brain enhancer 5 near elavl3 (112 of 143 surviving embryos), heart enhancer near gata6, muscle enhancer near musk, kidney enhancer 1 (47 of 82 embryos).", "concl": "Most predicted tissue-specific enhancers drive tissue-restricted expression in vivo."}, {"type": "qa", "section": "Results - Single-cell ATAC-seq in zebrafish brain", "q": "What did scATAC-seq in the adult brain give?", "a": "654 million usable reads from 19,955 cells and 268,268 non-redundant peaks. These covered 98.7% of the bulk brain ATAC-seq peaks, and 73,264 peaks were found only by scATAC-seq.", "kw": ["scATAC-seq", "brain"], "info": "Aggregated scATAC-seq correlated with bulk ATAC-seq at PCC = 0.878, using 10-kb bins.", "concl": "The zebrafish genome probably has more regulatory elements than bulk tissue data predict."}, {"type": "qa", "section": "Results - Single-cell ATAC-seq in zebrafish brain", "q": "How were the brain cell clusters annotated?", "a": "They found 25 clusters and inferred likely cell types from key cell-type-specific transcription factor motifs, for example oligodendrocyte progenitor cells.", "kw": ["motif enrichment", "SOX9", "OLIG2"], "info": "Neuronal TFs such as SOX9 and OLIG2 were enriched in different clusters. Cell type labels come only from motif inference, not from marker gene expression. The authors also name 'prefrontal cortex cells' as an inferred type without further explanation.", "concl": ""}, {"type": "qa", "section": "Results - Heterochromatin and DNA methylation", "q": "Do H3K9me2 and H3K9me3 mark the same regions?", "a": "Mostly not. There were 73,777 non-redundant H3K9me2 sites and 68,798 H3K9me3 sites, with only about 10% overlap in the same tissue.", "kw": ["H3K9me2", "H3K9me3"], "info": "SINEs were enriched in both marks. LTRs were enriched only in H3K9me2 sites.", "concl": ""}, {"type": "qa", "section": "Results - Heterochromatin and DNA methylation", "q": "Can heterochromatin in one tissue be active in another?", "a": "Yes. Heterochromatin sites lacked active marks within the same tissue, but 20% of them overlapped ATAC-seq peaks or other active marks in other tissues.", "kw": ["heterochromatin", "tissue specificity"], "info": "", "concl": "Heterochromatin regions in one tissue may be active regulatory elements in another."}, {"type": "qa", "section": "Results - Heterochromatin and DNA methylation", "q": "What does the zebrafish methylome look like across tissues?", "a": "Genome-wide CpG methylation was about 80% in all tissues except testis, which was higher. Brain had more CAC methylation, as reported in human and mouse.", "kw": ["WGBS", "CpG methylation", "non-CpG methylation"], "info": "WGBS coverage was about 30x per tissue. Mean mCG/CG was 0.777 to 0.804 in most tissues and 0.859 in testis. Unmethylated CpGs were mainly in CpG islands, promoters and 5' UTRs, while gene bodies and repeats were heavily methylated.", "concl": ""}, {"type": "qa", "section": "Results - Heterochromatin and DNA methylation", "q": "What are UMRs, LMRs and hypoDMRs, and what do they mark?", "a": "UMRs (unmethylated regions) mostly overlapped promoters and proximal ATAC-seq peaks. LMRs (low-methylated regions) overlapped more with enhancers and distal peaks. Tissue-specific hypomethylated DMRs were enriched for tissue-specific H3K27ac and ATAC-seq signal.", "kw": ["UMR", "LMR", "hypoDMR"], "info": "There were 17,654 tissue-specific hypoDMRs in total, for example 1,912 in muscle, 1,708 in heart and 3,386 in liver.", "concl": "Tissue-specific hypoDMRs can help identify tissue-specific cis-regulatory elements."}, {"type": "qa", "section": "Results - De novo assembly of chromosome 4", "q": "What was wrong with chromosome 4 in GRCz10/GRCz11?", "a": "The long arm is strongly enriched for H3K9me3, H3K9me2 and DNA methylation. Hi-C mapped to GRCz10/GRCz11 showed many aberrant off-diagonal signals, which indicate structural variants between the reference and the study fish.", "kw": ["structural variation", "Hi-C", "GRCz11"], "info": "The authors say these could come from assembly errors or from differences between individuals, and do not separate the two.", "concl": ""}, {"type": "qa", "section": "Results - De novo assembly of chromosome 4", "q": "Did the new chromosome 4 assembly fix the problem?", "a": "Largely. When Hi-C data were remapped to the de novo chromosome 4, most aberrant signals disappeared, and Bionano data showed fewer structural variant events.", "kw": ["de novo assembly", "Bionano"], "info": "The new chromosome 4 is about 74.5 Mb, compared with 78.1 Mb in GRCz11 and 76.6 Mb in GRCz10, based on the Fig. 3e labels.", "concl": "A resource for studying sex determination and other processes involving chromosome 4 genes."}, {"type": "qa", "section": "Results - Conservation of cis-regulatory elements", "q": "How conserved are zebrafish regulatory elements at the sequence level?", "a": "Promoters had the highest sequence conservation. Enhancers had much lower, but still significant, conservation. Of the enhancers not conserved in human or mouse, 88.6% were conserved in other fish.", "kw": ["sequence conservation", "PhyloP"], "info": "Enhancers with no detectable conservation in human still had higher fish PhyloP scores, so they may act as enhancers in other fish too.", "concl": ""}, {"type": "qa", "section": "Results - Conservation of cis-regulatory elements", "q": "Are human-conserved zebrafish enhancers also enhancers in human?", "a": "Often. 60 to 90% of zebrafish enhancers with human-conserved sequence were also predicted as candidate enhancers by NIH ENCODE and the Roadmap Epigenomics Project.", "kw": ["ENCODE", "Roadmap"], "info": "Mapping used liftOver of the central 100 bp of each element (minMatch >0.1). The chain files were modified using a zebrafish conserved noncoding element database.", "concl": ""}, {"type": "qa", "section": "Results - Conservation of cis-regulatory elements", "q": "What about ultra-conserved noncoding elements (UCNEs)?", "a": "69% of the 2,405 zebrafish UCNEs overlapped predicted cis-regulatory elements: 15% as promoters, 53% as enhancers and 1% as noncoding RNAs.", "kw": ["UCNE", "SALL3_Anna"], "info": "Example: UCNE SALL3_Anna is predicted as a brain enhancer in zebrafish, mouse and human, and was validated in mouse embryos (VISTA hs1056). FOXP1_Finn_1 is a second example.", "concl": "Enhancers in ultra-conserved regions were more likely to also be enhancers in mouse and human (30% vs 5.68%)."}, {"type": "qa", "section": "Results - Linking distal elements to target genes", "q": "How did they link distal elements to target genes, and how many links did they find?", "a": "They used correlation of activity across tissues. This gave 340,527 ATAC-seq peak-to-gene links (FDR < 0.01; 144,886 distal peaks, 18,792 genes) and 96,540 enhancer-to-gene links, of which 37,241 were also supported by ATAC links.", "kw": ["enhancer-gene linking", "correlation"], "info": "The enhancer-to-gene links involve 33,728 enhancers and 16,935 genes. Each gene has on average 4.85 linked enhancers, and each enhancer 2.67 genes. 34% of enhancers link to only one gene.", "concl": ""}, {"type": "qa", "section": "Results - Linking distal elements to target genes", "q": "Were the correlation-based links supported by 3D data?", "a": "Yes. Predicted enhancer-to-gene pairs had more Hi-C reads than expected at every genomic distance, in both brain and muscle.", "kw": ["Hi-C validation"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Tissue-specific transcriptional regulatory network", "q": "Are tissue TF networks similar between zebrafish and human?", "a": "Yes. Motifs enriched in tissue-specific enhancers were often shared with the same human tissues, and three-node network patterns were highly similar between the two species.", "kw": ["three-node network", "NEUROD", "MYOD"], "info": "In the three-node network, node A is the driver (regulates B and C), node B is the middle node (regulated by A, regulates C) and node C is the passenger (regulated by A and B). CTCF was the driver in most tissues. NEUROD and MYOD were middle or passenger nodes in brain and muscle. mef2d acts in both muscle and heart but is predicted to have different targets in each.", "concl": "Zebrafish is a valuable system for studying human TF regulatory circuits."}, {"type": "qa", "section": "Results - Higher-order genome structure", "q": "What Hi-C data did they generate, and what did compartment analysis show?", "a": "10-kb resolution Hi-C in adult brain (about 2.1 billion read pairs) and muscle (about 1.4 billion). Active marks were enriched in the A compartment and H3K9me2/me3 in the B compartment.", "kw": ["A/B compartments", "Hi-C"], "info": "5,348 regions switched compartment between brain and muscle. These switches were associated with changes in gene expression and H3K27ac.", "concl": ""}, {"type": "qa", "section": "Results - Higher-order genome structure", "q": "How many TADs did they find, and what is at their boundaries?", "a": "1,350 TADs in brain and 1,238 in muscle, most shared between the two tissues. Boundaries were enriched for CTCF-binding sites, SINEs and satellite elements.", "kw": ["TAD", "CTCF", "SINE"], "info": "The median TAD size used for profile plots was 2,800 kb (Methods). TADs were called from insulation scores on ICE-normalized matrices.", "concl": ""}, {"type": "qa", "section": "Results - Higher-order genome structure", "q": "What did the chromatin loop analysis show?", "a": "7,708 loops in brain and 5,312 in muscle. Most loop anchors had convergent CTCF motifs (63% in brain, 72% in muscle).", "kw": ["chromatin loops", "convergent CTCF"], "info": "In brain, 98.6% of loops linked regions containing at least one promoter or enhancer. 91.6% of enhancer-promoter loops overlapped the correlation-based linkages.", "concl": ""}, {"type": "qa", "section": "Results - Higher-order genome structure", "q": "Which TF motifs were enriched in shared versus tissue-specific loops?", "a": "CTCF and BORIS were enriched in shared loops. RFX and NeuroD2 were enriched in brain-specific loops, and Myf5 and Ascl1 in muscle-specific loops.", "kw": ["BORIS", "NeuroD2", "Myf5"], "info": "The authors call Myf5 and Ascl1 muscle-specific master regulators.", "concl": "Tissue-specific TFs may help form tissue-specific chromatin interactions."}, {"type": "qa", "section": "Results - Genome evolution and TADs", "q": "Where are evolutionary breakpoints located relative to TADs?", "a": "They are enriched near TAD boundaries and depleted towards TAD centres. 80.5% of zebrafish-to-human breakpoints (984 of 1,223) were near TAD boundaries.", "kw": ["evolutionary breakpoints", "synteny"], "info": "Breakpoints were found with progressiveMauve against human, mouse, chicken and 15 more vertebrates. The same pattern appeared in all of these comparisons.", "concl": "TAD boundaries are preferred sites of genome rearrangement during evolution."}, {"type": "qa", "section": "Results - Genome evolution and TADs", "q": "How do TADs with and without breakpoints differ?", "a": "TADs without breakpoints had stronger interactions in their middle. Their genes also had expression patterns more correlated with their human homologues (4,625 vs 3,918 gene pairs; P = 3.56e-26, Mann-Whitney U).", "kw": ["TAD stability", "expression conservation"], "info": "TAD sizes did not differ between the two groups (P = 0.098). The authors give two possible explanations: strong interactions stabilize TADs, or breaking TADs with strong, physiologically important interactions is selected against.", "concl": "TAD stability is associated with conserved expression patterns."}, {"type": "qa", "section": "Results - Genome evolution and TADs", "q": "What marks TAD boundaries that overlap breakpoints?", "a": "Much higher H3K4me3 than at boundaries without breakpoints. H3K27ac and ATAC-seq did not differ between the two boundary groups.", "kw": ["H3K4me3", "TAD boundary"], "info": "They saw the same H3K4me3 pattern at human and mouse ESC TAD boundaries with breakpoints. They mention an earlier report of H3K4me3 at mouse recombination hotspots.", "concl": "H3K4me3 may be associated with genome stability and evolution."}, {"type": "qa", "section": "Results - Genome evolution and TADs", "q": "Is there transcription at breakpoints that sit at CTCF TAD boundaries?", "a": "Yes. In human GM12878 and K562 cells, Pol2 ChIP-seq and GRO-seq signals were much higher at breakpoints overlapping CTCF-containing TAD boundaries (639) than at breakpoints without them (625).", "kw": ["GRO-seq", "Pol2"], "info": "This used public human cell line data, not zebrafish data. Previous work linked transcription at CTCF boundaries to translocations.", "concl": ""}, {"type": "qa", "section": "Results - Genome evolution and TADs", "q": "How do TADs relate to expression of paralogues from the teleost genome duplication?", "a": "Across 2,456 Ensembl paralogue pairs, the median expression correlation was 0.458. Paralogues in the same TAD were more correlated than those in different TADs.", "kw": ["paralogues", "genome duplication"], "info": "The same-TAD comparison is small: 17 pairs in the same TAD vs 65 in different TADs, all on the same chromosome.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What do the authors conclude overall?", "a": "They provide a comprehensive annotation of the zebrafish genome and describe both conserved and divergent gene-regulatory networks and 3D genome structures between zebrafish and human.", "kw": [], "info": "The data are in GEO GSE134055 and viewable on the WashU Epigenome Browser.", "concl": "The data give a genomic foundation for human disease modelling and biological studies in zebrafish."}, {"type": "qa", "section": "Methods - samples and ChIP-seq", "q": "What samples were used?", "a": "One-year-old adult Tübingen zebrafish from ZIRC, plus 1-dpf embryonic trunk and embryonic neurons sorted by FACS from Tg(HuC:Kaede) crossed to Tübingen.", "kw": ["Tübingen", "HuC:Kaede"], "info": "Sex information is in Supplementary Table 17. For RNA-seq, tissues from at least two fish were pooled per replicate. About 20,000 sorted neurons were used per embryonic neuron replicate.", "concl": ""}, {"type": "qa", "section": "Methods - samples and ChIP-seq", "q": "How was ChIP-seq done and how were peaks called?", "a": "Tissues were fixed in 1% formaldehyde, sonicated on a Covaris E220 to 100-300 bp, and immunoprecipitated with 3 ug antibody on about 200 ug chromatin. Reads were mapped to GRCz10 with BWA (MAPQ < 30 removed), and H3K27ac/H3K4me3 peaks were called with the ENCODE pipeline.", "kw": ["ChIP-seq", "BWA", "MACS2"], "info": "Peaks needed -logP > 5, -logQ > 2, RPM(IP) at least 2x RPM(input), and RPM(IP) - RPM(input) > 1. Broad H3K9 marks were called with HOMER (-region -size 1000) and merged within 5 kb. Kidney H3K27ac has only one replicate.", "concl": ""}, {"type": "qa", "section": "Methods - samples and ChIP-seq", "q": "How did they build a zebrafish blacklist?", "a": "They called peaks with MACS2 on ChIP input data against a whole-genome background, did the same for ChIP data, and defined overlapping peaks across all tissues as the blacklist.", "kw": ["blacklist"], "info": "Peaks with -log10(q) < 5 were dropped. Blacklisted regions such as centromeres, telomeres and satellites were removed from all ChIP-seq and ATAC-seq peak calling.", "concl": ""}, {"type": "qa", "section": "Methods - RNA-seq and novel transcripts", "q": "How were novel transcripts and lncRNAs identified?", "a": "Reads were mapped with TopHat2 to GRCz10 and assembled with Cufflinks. Novel transcripts were those with class code u, x, j or i present in both replicates. Multi-exon transcripts > 150 bp with CPAT coding score < 0.38 were called lncRNAs.", "kw": ["Cufflinks", "CPAT", "lncRNA"], "info": "Transcripts scoring above 0.38 were protein-coding candidates. ORFs were predicted with TransDecoder and searched with BLASTp against Xenopus, cattle, pig, chicken, mouse and human (cutoff 1e-3).", "concl": ""}, {"type": "qa", "section": "Methods - RNA-seq and novel transcripts", "q": "How were tissue-specific genes defined?", "a": "STAR alignment, RSEM quantification and limma batch correction on log2(TPM+1). Genes with Z-score > 2 and at least threefold change were tissue-specific.", "kw": ["STAR", "RSEM", "limma"], "info": "Genes with TPM < 1 in both replicates in all tissues were filtered out. Human comparisons used GTEx median TPM and BioMart one-to-one orthologues.", "concl": ""}, {"type": "qa", "section": "Methods - ATAC-seq and CRE identification", "q": "How was ATAC-seq processed?", "a": "Adapters were trimmed with cutadapt, reads aligned with bowtie2 (-X2000), and duplicates removed with Picard. Peaks were called with the ENCODE ATAC pipeline, filtered at P < 1e-5 and q < 0.01, and fixed to 500 bp.", "kw": ["bowtie2", "ENCODE pipeline", "HINT"], "info": "Proximal peaks overlap the TSS region (2.5 kb upstream to 500 bp downstream): on average 23,233 per tissue, versus 122,979 distal. Footprints were called with HINT v0.13.0 and motifs matched with MOODS using HOCOMOCO.", "concl": ""}, {"type": "qa", "section": "Methods - ATAC-seq and CRE identification", "q": "How were tissue-specific CREs and testis promoters handled?", "a": "Union CRE sets were quantile-normalized on H3K27ac RPM, and elements with Z > 2 and at least twofold change were called tissue-specific. In testis, where H3K4me3 is broad across the genome, annotated TSSs were used instead of H3K4me3 peaks to define promoters.", "kw": ["Z-score", "GREAT", "HOMER"], "info": "About 96% of H3K27ac and H3K4me3 peaks overlapped ATAC peaks (plus or minus 500 bp). Merged elements were fixed to 2 kb. GO analysis used GREAT 3.0.0 after liftOver to danRer7.", "concl": ""}, {"type": "qa", "section": "Methods - WGBS", "q": "How was WGBS processed and how were DMRs called?", "a": "Reads were trimmed with Trim Galore 0.6.1 and mapped with Bismark v0.18.1 to GRCz10. UMRs and LMRs were called with MethylSeekR v1.22.0, and DMRs with DSS v2.14.0 without replicates.", "kw": ["Bismark", "MethylSeekR", "DSS"], "info": "DSS settings: delta = 0.2, p = 0.05, minlen = 200, minCG = 5. Tissue-specific hypoDMRs had to be hypomethylated in at least 8 of 10 pairwise comparisons. Only CpGs with at least 5 reads were used. The replicate table lists one WGBS replicate per tissue.", "concl": ""}, {"type": "qa", "section": "Methods - genome assembly", "q": "What was the chromosome 4 assembly pipeline?", "a": "About 50x nanopore reads were assembled with Canu, polished twice with Nanopolish and twice with Pilon using 10X reads, scaffolded with Bionano Solve, and finally scaffolded to chromosome level with 3d-dna using brain Hi-C.", "kw": ["Canu", "3d-dna", "Pilon"], "info": "1,325 contigs (N50 9.418 Mb), then 114 arm-level scaffolds (N50 29.725 Mb), then a final 1,519 Mb assembly (N50 56.768 Mb). Bionano used 407 Gb of data from female muscle DNA. Canu is listed as v1.8 in the Methods but 2.0 in the reporting summary.", "concl": ""}, {"type": "qa", "section": "Methods - linking and networks", "q": "How was the significance of peak-to-gene correlations assessed?", "a": "They computed the Pearson correlation between peak log2(RPM) and gene log2(TPM+1) for genes within 500 kb. The null came from 10,000 random peaks correlated with genes on other chromosomes, and z-score P values were corrected with Benjamini-Hochberg.", "kw": ["Pearson correlation", "FDR"], "info": "Peaks with normalized RPM < 1 in all tissues were removed first. H3K27ac links used FDR < 0.01 and PCC cutoff 0.56142. The network analysis scanned nucleosome-free regions within 10 kb of the TSS of 661 TF genes with FIMO (P < 1e-5).", "concl": ""}, {"type": "qa", "section": "Methods - Hi-C and breakpoints", "q": "Which tools were used for Hi-C features?", "a": "HiC-Pro v2.9.0 for mapping to GRCz10, HOMER for A/B compartments, insulation score on ICE-normalized matrices for TADs, and HiCCUPS at 10 kb for loops. HiCRep was used for replicate reproducibility.", "kw": ["HiC-Pro", "HiCCUPS", "insulation score"], "info": "Insulation parameters: -is 480,000, -ids 320,000. Compartment switches are sign changes in PC1 between brain and muscle. TADs with breakpoints were defined with bedtools intersect -f 0.3. The reporting summary lists HiC-Pro 2.11.1.", "concl": ""}, {"type": "qa", "section": "Methods - single-cell analysis", "q": "How was scATAC-seq quality-controlled and clustered?", "a": "From 781 million reads and 23,871 cells (10X Chromium), cells were kept with log10(UMI) between 3 and 5 and 10-65% of reads in promoters, leaving 19,955 cells. Clustering used a 5-kb bin matrix with SnapATAC, and scAlign removed the batch effect between replicates.", "kw": ["SnapATAC", "scAlign", "chromVAR"], "info": "Peaks were called per cluster with MACS2. There were 171,159 differentially accessible peaks (Fisher's exact test, FDR < 0.05). Cell types came from HOMER motifs, confirmed with chromVAR. The two libraries came from one female and one male brain.", "concl": ""}, {"type": "qa", "section": "Methods - enhancer reporter assay", "q": "How was the enhancer reporter assay set up and scored?", "a": "Enhancers were cloned upstream of an hsp70 promoter-eGFP cassette in pT2HE and co-injected with Tol2 transposase mRNA into one-cell Tübingen embryos. A pattern was recorded only if at least 30-40% of embryos showed it, with about 100 embryos per enhancer.", "kw": ["Tol2", "hsp70", "eGFP"], "info": "Embryos were imaged at 24-36 hpf, 2 dpf, 3 dpf and 5 dpf.", "concl": ""}, {"type": "note", "section": "Results - Genome evolution and TADs", "text": "Why do breakpoint-containing TAD boundaries carry so much H3K4me3, and is it a cause or a consequence of rearrangement? Worth checking whether cavefish vs surface fish rearrangements also fall at TAD boundaries with high H3K4me3."}, {"type": "note", "section": "Results - Conservation of cis-regulatory elements", "text": "88.6% of zebrafish enhancers not conserved in mammals are conserved in other fish. This could be a useful filter for fish-specific enhancers in Astyanax comparisons."}, {"type": "note", "section": "Methods - WGBS", "text": "Limitations: WGBS and DMR calls have no biological replicates, Hi-C covers only brain and muscle, and enhancer-gene links are correlation-based across about 11 tissues. Treat the tissue-specific links as hypotheses."}], "key": "drerio/Yang_2020_Nature_zebrafish_CRE_3D_genome_map", "shared": "Damir · 2025", "preprint": "", "tags": [], "star": false, "source_note": ""}, {"id": "Sun_2024", "title": "Mapping the chromatin accessibility landscape of zebrafish embryogenesis at single-cell resolution by SPATAC-seq", "category": "Genomic resources", "link": "https://doi.org/10.1038/s41556-024-01449-0", "note": "", "source_pdf": "papers/drerio/Sun_2024_NatCellBiol_zebrafish_chromatin_accessibility_atlas.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is the main aim of this paper?", "a": "To present SPATAC-seq, a split-pool ligation-based single-cell ATAC-seq method, and use it to map chromatin accessibility in single cells across zebrafish embryogenesis.", "kw": ["SPATAC-seq", "scATAC-seq"], "info": "Published as a Resource, meant as an open resource for finding driver regulators of cell fate decisions.", "concl": "SPATAC-seq yields a single-cell open chromatin atlas of zebrafish embryogenesis covering more than 800,000 nuclei."}, {"type": "qa", "section": "Abstract", "q": "What does the atlas contain, in numbers?", "a": "More than 800,000 nuclei across 20 developmental stages from the sphere stage to the early larval protruding mouth stage, classified into 604 cell states, with 959,040 candidate cis-regulatory elements (cCREs).", "kw": ["cCREs", "cell states"], "info": "They also defined development-specific cCREs and cell identity transcription factors, tested enhancers in reporter assays, and studied pigment and notochord differentiation.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What gap does the paper address?", "a": "Many epigenomic and transcriptomic datasets already exist for zebrafish embryos, but the dynamic accessible regions that set up the regulatory program of each cell type during embryogenesis had not been studied in detail.", "kw": ["gene regulatory networks", "cell identity"], "info": "The broader goal named is identifying the gene regulatory networks underlying lineage commitment and cell differentiation.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is ZEPA?", "a": "The Zebrafish Embryogenesis Single-Cell Open Chromatin Atlas, the compendium of single-cell chromatin accessibility data built with SPATAC-seq in this study.", "kw": ["ZEPA"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Overview and validation of SPATAC-seq", "q": "What is SPATAC-seq and which methods does it build on?", "a": "A high-throughput scATAC-seq method that labels chromatin fragments in situ inside fixed nuclei through four rounds of combinatorial barcoding. It builds on sci-ATAC-seq (combinatorial indexing) and split-pool ligation-based transcriptome sequencing.", "kw": ["combinatorial indexing", "split-pool"], "info": "Compatible with standard Illumina sequencing recipes.", "concl": ""}, {"type": "qa", "section": "Results - Overview and validation of SPATAC-seq", "q": "How do the four barcoding rounds work?", "a": "Round 1: nuclei are tagmented in 48 wells with 48 uniquely barcoded Tn5 transposomes. Rounds 2 and 3: nuclei are pooled and split into two more 48-well plates where barcodes are ligated. Round 4: nuclei are pooled, split into sub-libraries, lysed, and given a fourth barcode by PCR.", "kw": ["Tn5", "ligation barcoding"], "info": "Three rounds give 48 x 48 x 48 = 110,592 combinations per sub-library; with 96 PCR wells Fig. 1a gives 10,616,832 combinations. Using 96 barcodes per round would give about 1 million combinations per sub-library. Transposome adaptors carry 5' phosphorylation at both ends, which enables the ligation rounds.", "concl": ""}, {"type": "qa", "section": "Results - Overview and validation of SPATAC-seq", "q": "How did they test whether barcodes stay specific to single cells?", "a": "A species-mixing experiment: human K562 and mouse Hepa cells mixed 1:1, profiled with only eight barcoded transposomes. Of 1,293 cells, 721 were human, 555 mouse and 17 doublets, an observed doublet rate of about 2.6%, close to theory.", "kw": ["species mixing", "doublet rate"], "info": "A barcode was called a doublet if fewer than 85% of unique fragments aligned to either hg38 or mm10; the observed rate was multiplied by 2 to estimate the true rate. Barcodes with fewer than 500 reads or TSS enrichment below 4 were excluded. Eight sub-libraries (SL-1 to SL-8) were made.", "concl": ""}, {"type": "qa", "section": "Results - Overview and validation of SPATAC-seq", "q": "How well does SPATAC-seq agree with bulk ATAC-seq and other single-cell methods?", "a": "Aggregated SPATAC-seq signal correlated with bulk K562 ATAC-seq at r = 0.919 and with bulk Hepa ATAC-seq at r = 0.955, was enriched at TSSs, and fragment sizes showed nucleosome phasing.", "kw": ["TSS enrichment", "FRiP"], "info": "Correlation between sub-libraries was r = 0.917 (K562) and r = 0.944 (Hepa). Unique fragments per cell, FRiT, FRiP and TSS enrichment were comparable to published plate-based and Fluidigm C1 scATAC-seq; valid-barcode and debris fractions were comparable to optimized sci-ATAC-seq.", "concl": ""}, {"type": "qa", "section": "Results - Overview and validation of SPATAC-seq", "q": "How does SPATAC-seq compare with earlier zebrafish sci-ATAC-seq, and what does it cost?", "a": "Against published zebrafish sci-ATAC-seq at 24 hpf it showed much higher TSS enrichment with a similar number of unique fragments, indicating a better signal-to-noise ratio. The cost is about US$0.01 per cell.", "kw": ["sci-ATAC-seq", "cost"], "info": "The authors also claim higher cell throughput and a lower doublet rate than sci-ATAC-seq.", "concl": "SPATAC-seq is a reliable, low-cost, high-throughput scATAC-seq method."}, {"type": "qa", "section": "Methods - embryos and nuclei", "q": "How were embryos staged and nuclei prepared?", "a": "Wild-type Tubingen embryos were collected at the one-cell stage, raised in Holtfreter's solution at 28.5 C, dechorionated with Pronase (~10 min), and for time points under 24 h the yolk was removed before snap freezing.", "kw": ["Tubingen", "yolk removal"], "info": "Nuclei were released in a Dounce homogenizer in homogenization buffer with 0.1% NP-40, filtered through 40 um, fixed with 0.5% formaldehyde for exactly 10 min on ice, quenched with glycine, and diluted to 5,000 nuclei per ul.", "concl": ""}, {"type": "qa", "section": "Methods - embryos and nuclei", "q": "How was the number of cells per embryo estimated?", "a": "By DNA content: total genomic DNA of 30 to 100 embryos per stage was extracted (five technical replicates), quantified with a Qubit, and converted to cell number assuming 4.6 pg of DNA per zebrafish cell.", "kw": ["DNA content"], "info": "This underlies the 59 to 271% sampling-depth estimates.", "concl": ""}, {"type": "qa", "section": "Results - Single-cell chromatin accessibility in zebrafish embryogenesis", "q": "What samples were profiled and how many cells passed QC?", "a": "Whole embryos at 20 stages from 4 to 72 hpf. SPATAC-seq gave 808,046 high-quality cells, with a median of 3,664 unique nuclear fragments per cell and a mean TSS enrichment of 12.6 (plus or minus 3.7).", "kw": ["whole embryo"], "info": "SPATAC-seq data came from five experimental batches. All data are from nuclei, although the paper refers to cells.", "concl": ""}, {"type": "qa", "section": "Results - Single-cell chromatin accessibility in zebrafish embryogenesis", "q": "Which other datasets did they generate alongside SPATAC-seq?", "a": "10x Genomics scATAC-seq of 80,767 cells at 24, 48 and 72 hpf (two experiments), plus bulk ATAC-seq of whole embryos at all 20 stages.", "kw": ["10x Genomics", "bulk ATAC-seq"], "info": "The 10x kit was Chromium Next GEM Single Cell ATAC v1.1, targeting 10,000 cells per channel, sequenced on MGISEQ-2000.", "concl": ""}, {"type": "qa", "section": "Results - Single-cell chromatin accessibility in zebrafish embryogenesis", "q": "How many nuclei per stage, and what fraction of an embryo is that?", "a": "On average 44,440 nuclei per stage (median 36,627), corresponding to 59% (72 hpf) up to 271% (24 hpf) of the total cells in one embryo.", "kw": ["sampling depth"], "info": "The range is printed as 9,244 to '11,1471', apparently a typo for 111,471. Values above 100% arise because nuclei came from pooled embryos (100 per tube), but the paper does not comment on this.", "concl": ""}, {"type": "qa", "section": "Methods - data processing", "q": "How were the sequencing data processed?", "a": "Zebrafish SPATAC-seq reads were aligned to GRCz11 with BWA after merging barcodes into the read headers, and fragment files were made with Sinto. Species-mixing data were reformatted to Cell Ranger ATAC v1.2 format and run against GRCh38_and_mm10.", "kw": ["BWA", "Sinto", "Cell Ranger ATAC"], "info": "Bulk ATAC-seq reads were trimmed with trim_galore, mapped with BWA, filtered for MAPQ below 30 and duplicates with SAMtools; consensus bulk peaks were made with MSPC. 10x fastq files from MGISEQ were converted to 10x format and run with Cell Ranger ATAC v1.2 on a custom GRCz11 reference.", "concl": ""}, {"type": "qa", "section": "Methods - QC and clustering", "q": "What tool and parameters were used for single-cell QC and dimensionality reduction?", "a": "ArchR v1.0.1 in R v4.1.3, with a custom ArchRGenome built on the Lawson Lab Zebrafish Transcriptome Annotation v4.3.2. Doublets were scored with addDoubletScores (k = 10) and cells with doublet enrichment above 4 were removed.", "kw": ["ArchR", "iterative LSI"], "info": "Iterative LSI on the 501-bp tile matrix used three iterations, clustering resolution 2 (3 after the first iteration), 50,000 variable features, 100 dimensions, LSI method 1 and 10,000 sampled cells; batch effects were removed with addHarmony, clusters called at resolution 3.", "concl": ""}, {"type": "qa", "section": "Results - Cell type annotation for each stage", "q": "How were scATAC-seq cells assigned to cell types?", "a": "By label transfer from published annotated zebrafish scRNA-seq datasets (Farrell, Wagner, Farnsworth). Stages without a matching scRNA-seq dataset were annotated from their specifically accessible genes using the literature and ZFIN.", "kw": ["label transfer", "ZFIN"], "info": "Integration used ArchR addGeneIntegrationMatrix, transferring the expression matrix and labels onto ATAC cells. Stages 4-18, 24 and 48 hpf were annotated by integration; 20, 22, 30, 34, 38, 42 and 72 hpf from marker accessibility.", "concl": ""}, {"type": "qa", "section": "Results - Cell type annotation for each stage", "q": "What is a gene activity score?", "a": "A value ArchR computes for each gene from accessibility within and around the gene body, used as a proxy for gene expression.", "kw": ["gene activity score"], "info": "For t-SNE/UMAP visualization the scores were smoothed with MAGIC.", "concl": ""}, {"type": "qa", "section": "Results - Cell type annotation for each stage", "q": "What did annotation at 10 hpf show?", "a": "23 distinct cell types, with closely overlapping scRNA-seq and scATAC-seq distributions. Two ambiguous clusters were treated as doublets, and one cluster labelled mesodermal by label transfer was actually yolk syncytial layer (YSL) based on YSL marker accessibility.", "kw": ["YSL", "pax2a", "hesx1"], "info": "Examples: pax2a specifically accessible in midbrain, hesx1 in telencephalon. All scRNA-seq cell types were present in the SPATAC data, and cell-type proportions matched the scRNA-seq data (r = 0.955).", "concl": ""}, {"type": "qa", "section": "Results - Cell type annotation for each stage", "q": "How many cell states and cell types were defined across all stages?", "a": "604 cell states and 82 cell type annotations across 20 stages. Deeper profiling revealed more cell types at 24 hpf (for example lens and notochord) than the earlier sci-ATAC-seq dataset.", "kw": ["cell states"], "info": "SPATAC-seq captured slightly fewer unique fragments per cell than 10x Genomics, but cell-type abundances at 24, 48 and 72 hpf correlated highly between the two methods.", "concl": ""}, {"type": "qa", "section": "Results - Reconstruction of trajectories spanning zebrafish embryogenesis", "q": "How were all cells integrated and visualized together?", "a": "Harmony corrected experimental batch and platform effects, and 888,813 cells (SPATAC plus 10x) were embedded with UMAP, showing clear stage-dependent expansion of cellular diversity. Cells were grouped into 36 broad cell types.", "kw": ["Harmony", "UMAP"], "info": "The 82 major cell types were manually merged into 36 broad types for display, for example pigment cells into neural crest and EVL into periderm. The peak-matrix LSI used 100,000 variable features and the last 99 LSI dimensions for Harmony, giving 156 clusters at resolution 3.", "concl": ""}, {"type": "qa", "section": "Results - Reconstruction of trajectories spanning zebrafish embryogenesis", "q": "What did the retina example show?", "a": "Retinal cells followed progressive differentiation paths from early progenitors at 14 hpf to specialized types at 72 hpf: cones, rods, cone bipolar cells, horizontal cells, amacrine cells, retinal ganglion cells, Muller glia and retinal pigment epithelium.", "kw": ["retina"], "info": "Terminal branches were annotated with published markers such as fabp1a, ompa, cabp5b and gngt2a.", "concl": ""}, {"type": "qa", "section": "Results - Reconstruction of trajectories spanning zebrafish embryogenesis", "q": "How did they connect cell types between developmental stages?", "a": "With a k-nearest-neighbour heuristic (k = 5): cells from adjacent stages were co-embedded and, for each cell type, the cell types of the 5 nearest neighbours in the earlier stage were counted. Keeping edges with weight above 0.3 gave a directed acyclic graph of 603 nodes and 635 edges.", "kw": ["k-NN", "directed acyclic graph"], "info": "UMAP used minDist 0.3 and nNeighbors 100; 500 iterations with 80% subsampling, median ancestor ratios as edge weights. Repeating in LSI space (dims 1:30) gave weights correlating at r = 0.994 (604 nodes, 636 edges). Graphs were drawn in Cytoscape. Example: margin at 5 hpf linked to the deep cell layer (DEL) at 4 hpf.", "concl": ""}, {"type": "qa", "section": "Results - Reconstruction of trajectories spanning zebrafish embryogenesis", "q": "How do these trajectories differ from earlier scRNA-seq-based ones?", "a": "They cover longer periods and show more detail. Slow muscle cells derive from mesoderm adaxial cells, a path that terminated prematurely in a previous study, and the roof plate was inferred to come from the tailbud spinal cord rather than midbrain or hindbrain.", "kw": ["roof plate", "adaxial cells"], "info": "The authors note trajectories from accessibility or expression alone may be inaccurate, and suggest multiomics (SHARE-seq, Paired-Tag), dynamo and lineage tracing (GESTALT) as corrections.", "concl": "Inferred trajectories are hypotheses that need lineage-tracing validation."}, {"type": "qa", "section": "Results - An atlas of cCREs during zebrafish embryogenesis", "q": "How were the cCREs identified?", "a": "MACS2 called fixed-width 501-bp peaks on pseudobulk profiles aggregated per cell type, giving 39,963 to 404,504 peaks per stage, merged into a union set of 959,040 non-redundant cCREs.", "kw": ["MACS2", "pseudobulk", "cCREs"], "info": "Peak number per stage roughly followed developmental stage and the number of cell types. The 14 cell types with fewer than 100 cells were excluded from peak calling.", "concl": ""}, {"type": "qa", "section": "Results - An atlas of cCREs during zebrafish embryogenesis", "q": "Where in the genome are the cCREs?", "a": "They span more than 480 Mb, or 35.7% of the zebrafish reference genome. 46.4% are intronic and 38.6% distal intergenic, so most are distal elements.", "kw": ["distal elements"], "info": "The pie chart also shows 8.9% and 6.1% for exonic and promoter categories; the extracted text does not make clear which value belongs to which.", "concl": ""}, {"type": "qa", "section": "Results - An atlas of cCREs during zebrafish embryogenesis", "q": "How do the cCREs compare with bulk ATAC-seq and published enhancer sets?", "a": "The cCREs covered most previously mapped bulk adult-tissue ATAC-seq peaks and enhancers, but only 44% of the cCREs were found in the Yang et al. data and only 36% in their own bulk embryo ATAC-seq.", "kw": ["bulk vs single cell", "rare cell types"], "info": "Explanation: single-cell data detect peaks from rare cell types whose signal is drowned out in bulk. At 8 hpf, cCREs near frzb, sox32 and twist2 were open only in rare cell types. The main text says 11 adult tissues while the Fig. 4c legend says 12.", "concl": "Single-cell profiling recovers many regulatory elements that bulk ATAC-seq misses."}, {"type": "qa", "section": "Results - An atlas of cCREs during zebrafish embryogenesis", "q": "Are cCREs enriched in active chromatin states?", "a": "Yes. Relative to the quiescent state, cCREs from 4, 8, 12, 24 and 48 hpf were clearly enriched in ChromHMM active promoter and enhancer states, although about half of the peaks fall in regions without histone modifications.", "kw": ["ChromHMM", "DANIO-CODE"], "info": "Ten-state ChromHMM annotations came from Baranasic et al. (DANIO-CODE); overlaps were computed with bedtools and odds ratios with Fisher's exact test on overlapping nucleotides.", "concl": ""}, {"type": "qa", "section": "Results - An atlas of cCREs during zebrafish embryogenesis", "q": "Are the cCREs evolutionarily conserved?", "a": "Yes. Their cyprinid phastCons scores were clearly higher than those of randomly shuffled genomic regions (P = 7.98 x 10-36 for one comparison shown).", "kw": ["phastCons", "conservation"], "info": "One-sided Wilcoxon rank-sum test, stratified by annotation: distal n = 205,789, intronic n = 257,752, exonic n = 76,898, promoter n = 38,060, shuffled n = 132,885. Conserved elements came from the goldfish genome paper.", "concl": "Three lines of evidence support the cCREs: overlap with known elements, active chromatin states, and sequence conservation."}, {"type": "qa", "section": "Results - Cis-regulatory dynamics of zebrafish embryonic development", "q": "How does the chromatin landscape change over development?", "a": "Progressively: in principal component analysis of pseudobulk scATAC-seq and bulk ATAC-seq, samples ordered along developmental time. Many loci were differentially accessible between stages, for example sp5l, which lost accessibility over development.", "kw": ["PCA", "sp5l"], "info": "sp5l is involved in postanal tail morphogenesis and anteroposterior patterning of the neuroectoderm.", "concl": ""}, {"type": "qa", "section": "Results - Cis-regulatory dynamics of zebrafish embryonic development", "q": "How were development-associated dynamic cCREs defined?", "a": "By k-means clustering of cCRE accessibility across the 20 stages: 102,397 dynamic cCREs in 16 modules. Nearest-gene expression from published bulk RNA-seq (White et al.) over 12 stages showed matching dynamics.", "kw": ["k-means", "dynamic cCREs"], "info": "They started with 30 primary clusters and settled on 16 final ones; the cluster with invariant activity was excluded. For the heatmap, 500 random CREs per cluster were plotted. Module sizes range from 2,588 to 16,930 elements.", "concl": ""}, {"type": "qa", "section": "Results - Cis-regulatory dynamics of zebrafish embryonic development", "q": "Which functions are linked to the early, intermediate and late modules?", "a": "Early module 4: embryonic pattern specification and three-germ-layer development. Intermediate module 10 (18 to 24 hpf): myofibril assembly and actomyosin organization, enriched for myogenic motifs such as Myog. Late module 15 (48 to 72 hpf): synapse assembly and neurotransmitter secretion, enriched for Cux2 motifs.", "kw": ["GREAT", "HOMER", "Myog"], "info": "Module 10 is read as rapid muscle expansion in that window. The text calls Myog an 'LHX transcription factor', which is how it is written in the paper. Enrichment used GREAT v3.0.0 (binomial test, coordinates lifted to danRer7) and HOMER on danRer10 (hypergeometric test), with all tested cCREs as background.", "concl": "Temporal cCREs carry strong development-specific regulatory functions."}, {"type": "qa", "section": "Results - Cell type-specific transcription factors", "q": "How did they infer transcription factor activity in single cells?", "a": "With chromVAR bias-corrected motif deviation scores using DANIO-CODE position weight matrices. At 24 hpf, motif accessibility across 46 cell types showed cell type- and lineage-specific patterns, for example Hnf4a in endoderm and Gata5 in heart field.", "kw": ["chromVAR", "footprinting"], "info": "Run via ArchR addMotifAnnotations and addDeviationsMatrix; footprinting with getFootprints and plotFootprints showed Myog activity in muscle and Etv2 in endothelium. Motif activity for all 604 cell types is in Supplementary Table 4.", "concl": ""}, {"type": "qa", "section": "Results - Cell type-specific transcription factors", "q": "How did they separate putative activators from repressors?", "a": "By correlating each TF's motif deviation score with expression of the gene encoding it in matched scRNA-seq cell types. At 24 hpf across 46 cell types this gave 115 putative activators (r > 0.5, FDR < 0.01) and 16 putative repressors (r < -0.5, FDR < 0.01).", "kw": ["activators", "repressors", "sox10"], "info": "Across 200 shared cell types at 11 stages they found 382 putative activators and 48 putative repressors. etv2 was exclusively enriched in endothelial cells and sox10 in neural crest.", "concl": "Transcription factor activity is one of the prominent cell type-defining signatures."}, {"type": "qa", "section": "Results - In vivo validation of putative cell type-specific enhancer elements", "q": "How was the enhancer reporter assay designed?", "a": "A Tol2 transposon vector with a lens-specific promoter driving mCherry as injection control and a basic promoter driving eGFP; candidate elements were cloned upstream of the basal promoter and plasmids co-injected with transposase mRNA into one-cell embryos.", "kw": ["Tol2", "eGFP reporter"], "info": "Elements were PCR-amplified from Tubingen genomic DNA and cloned into the EcoRI site with a seamless cloning kit. eGFP was scored at 24 to 48 hpf only in morphologically normal embryos expressing lens mCherry; about 40 embryos per enhancer, assay performed once.", "concl": ""}, {"type": "qa", "section": "Results - In vivo validation of putative cell type-specific enhancer elements", "q": "How many tested cCREs acted as tissue-specific enhancers?", "a": "65 of 100 accessible chromatin regions (65%), tested across 40 cell type-specific genes, drove restricted eGFP expression. For example, 3 of 4 putative endothelial enhancers near flt1 drove eGFP specifically in the vascular system.", "kw": ["flt1", "enhancer validation"], "info": "Validated enhancers were specific to heart, neuron, notochord, eye, muscle, gut and otic tissue; reported ratios are embryos with tissue-specific GFP over lens-mCherry-positive embryos, for example muscle 48/49, notochord 43/55, eye 55/55.", "concl": "Most tested cell type-specific cCREs are functional tissue-restricted enhancers in vivo."}, {"type": "qa", "section": "Results - In vivo validation of putative cell type-specific enhancer elements", "q": "What did motif perturbation of the cdh5 enhancer show?", "a": "An endothelium-specific enhancer (ACR6) near cdh5 drove vascular GFP. Removing Etv2 binding sites largely impaired its activity, and removing both Etv2 and Sox7 sites abolished it completely.", "kw": ["cdh5", "Etv2", "Sox7"], "info": "Binding sites were found by motif scanning with FIMO; Etv2 and Sox7 are considered master regulators of endothelium. Wild-type, truncated and mutated constructs were compared.", "concl": "Enhancer activity depends on the specific TF binding-site architecture, not just on accessibility."}, {"type": "qa", "section": "Results - Regulatory activity during pigment and notochord differentiation", "q": "How was the pigment cell lineage subdivided?", "a": "Into four subsets: precursors starting at 18 hpf (C1) and three specialized types from 24 to 72 hpf, iridophore (C2), xanthophore (C3) and melanophore (C4).", "kw": ["pigment cells", "pseudotime"], "info": "Subsets were defined with ArchR gene module scores for iridophore (ltk, tfec, apoda.1, gpnmb, pnp4a), xanthophore (paics, gch2, aox5, xdh) and melanoblast gene sets; cells were ordered in pseudotime with addTrajectory.", "concl": ""}, {"type": "qa", "section": "Results - Regulatory activity during pigment and notochord differentiation", "q": "What are cCRE-to-gene links and how many were found in pigment cells?", "a": "Potential enhancer-gene interactions inferred by correlating peak accessibility with gene activity score. In the pigment lineage they found 37,277 high-confidence links, with a median of three cCREs per gene and one gene per cCRE.", "kw": ["peak-to-gene links"], "info": "Computed with ArchR addPeak2GeneLinks, keeping pairs with Pearson r > 0.5 (pigment) and FDR-adjusted P < 0.0001; for notochord the threshold was r > 0.7, giving 55,433 links. Example: linked cCREs near pmela were accessible specifically in melanophores.", "concl": ""}, {"type": "qa", "section": "Results - Regulatory activity during pigment and notochord differentiation", "q": "Which motifs are enriched in the pigment subset-specific modules?", "a": "Precursor-restricted cCREs were enriched for Cdx4 and Sox21 motifs, while cCREs restricted to the three pigment subsets were enriched for the sox10 motif, a key neural crest regulator. Melanophore cCREs also showed Tfap2e and Mitf motifs.", "kw": ["sox10", "Mitf", "Tfap2e"], "info": "Motif enrichment used HOMER with a one-sided hypergeometric test. Precursor cCREs were near genes for neural development, while subset cCREs were near pigment cell commitment genes.", "concl": ""}, {"type": "qa", "section": "Results - Regulatory activity during pigment and notochord differentiation", "q": "How was the notochord lineage subdivided?", "a": "Into four groups: C1 progenitors and C2 intermediate cells (almost all from 7 to 20 hpf), C3 ngs+ and pacsin3+ cells (vacuolated cells), and C4 cells with high accessibility at cartilage genes (col11a2, col2a1a, cnmd, sox9), representing late sheath cells.", "kw": ["notochord", "vacuolated cells", "sheath cells"], "info": "Notochord cells formed two temporally specified branches. Marker identity was cross-checked against scRNA-seq data including Zebrahub.", "concl": ""}, {"type": "qa", "section": "Results - Regulatory activity during pigment and notochord differentiation", "q": "What distinguishes the two terminal notochord cell types at the cCRE level?", "a": "7,117 differentially accessible cCREs separate C3 (ngs+) and C4 (col2a1a+). Both sets were enriched for notochord cell differentiation and embryonic organ development, but cartilage processes such as cartilage morphogenesis were specific to C4.", "kw": ["differentially accessible cCREs", "GREAT"], "info": "Called with ArchR getMarkerFeatures. The results text states FDR <= 0.001 and log2 fold change >= 1, while the Methods state FDR <= 0.01 and log2 fold change <= 1, so the exact cut-offs are inconsistent in the paper. GO used GREAT with a binomial test. C3 had 3,055 and C4 4,062 differentially accessible elements in the Fig. 7k labels.", "concl": ""}, {"type": "qa", "section": "Results - Regulatory activity during pigment and notochord differentiation", "q": "Which transcription factors were nominated for notochord specialization?", "a": "TEAD1/2/3/4 and NR2F1/2 for the cartilage-like (col2a1a+) notochord cells, and USF1/2 and MEF2B for the ngs+ notochord cells.", "kw": ["TEAD", "NR2F", "USF"], "info": "Several distal cCREs with increased accessibility in C4 relative to C3 were linked to the sox9b promoter region.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What do the authors claim SPATAC-seq contributes?", "a": "An up-scaled, low-cost, high-throughput combinatorial indexing scATAC-seq method with performance comparable to previous methods and compatibility with standard Illumina sequencing. They applied it both to zebrafish embryogenesis and to mouse organogenesis.", "kw": ["resource"], "info": "ZEPA is presented as a resource for finding CREs and transcription factors driving lineage specification, supported by motif enrichment and in vivo reporter assays.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What limitations do the authors list?", "a": "Cell type annotation via transfer learning still needs validation; some cell types such as primordial germ cells appeared only in scRNA-seq; and about half of their peaks fall in regions without histone modifications.", "kw": ["limitations", "primordial germ cells"], "info": "Reasons suggested for missing cell types include differences in cell isolation between technologies, limited cell numbers and unknown technical or biological factors. The reporter assay sample size was also called too small to estimate the function of all cCREs.", "concl": "The atlas is a resource with open questions about annotation accuracy and the nature of peaks lacking histone marks."}, {"type": "qa", "section": "Discussion", "q": "What follow-up work do the authors propose?", "a": "Applying single-cell histone modification technologies such as scCUT&Tag and nano-CT to zebrafish embryos from 4 to 72 hpf, to build per-cell-type ChromHMM annotations and further validate the regulatory roles of the cCREs.", "kw": ["scCUT&Tag", "nano-CT"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - data and code availability", "q": "Where are the data and code available?", "a": "Raw and processed sequencing data are in GEO under GSE215901 and GSE243256, BigWig tracks are in a UCSC Genome Browser session (ZEPA_danRer11), metadata and cCRE atlas files are on figshare, and the analysis code is on GitHub at Lan-lab/SPATAC-seq.", "kw": ["GEO", "UCSC track hub"], "info": "The authors state there are no restrictions on data availability or use.", "concl": ""}, {"type": "note", "section": "Results - An atlas of cCREs during zebrafish embryogenesis", "text": "About half of the cCREs fall in regions with no histone modifications in the DANIO-CODE ChromHMM data. Worth going back to: are these real but unmarked regulatory elements, bulk-level resolution limits of the ChromHMM data, or noise from pseudobulk peak calling?"}, {"type": "note", "section": "Results - Single-cell chromatin accessibility in zebrafish embryogenesis", "text": "Sampling depth above 100% of one embryo (
