<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper notes · Signaling pathways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2632; --muted:#5A6878; --rule:#D3DAE1; --hover:#E3E8ED;
  --focus:#2F6FB3; --good:#2E7D4F; --again:#B4562E;
  --c-mex:#C9DAF8; --c-mex-d:#3D6DBF;
  --c-emb:#FCE5CD; --c-emb-d:#C47A2C;
  --c-gen:#D9EAD3; --c-gen-d:#4E8A3E;
  --c-dam:#EAD1DC; --c-dam-d:#A3527A;
  --c-oth:#D8D1EE; --c-oth-d:#6B57B0;
  --c-ali:#FFF2CC; --c-ali-d:#B08A12;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
    --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
    --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
    --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
    --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
  --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
  --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
  --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
  --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--rule);padding:22px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{padding:0 22px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0;letter-spacing:-.01em;cursor:pointer}
.brand small{color:var(--muted);font-size:.82rem}
.search{margin:0 22px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px}
.cat{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 10px 4px 8px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist{list-style:none;margin:0;padding:0 12px}
.pitem{display:grid;grid-template-columns:6px 1fr auto;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 10px 10px 8px;align-items:start}
.pitem:hover{background:var(--hover)}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--rule)}
.pitem .tab{align-self:stretch;border-radius:3px}
.pitem b{display:block;font-weight:600;font-size:.92rem}
.pitem span.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.pitem .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.theme{margin:auto 22px 0;align-self:flex-start;background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--muted)}

main{padding:40px clamp(20px,5vw,64px) 80px;max-width:900px;width:100%}
.mtop{display:none}
.phead{border-left:6px solid var(--cd);padding-left:20px;margin-bottom:28px}
.phead .who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.9rem}
.tag{background:var(--cl);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.8rem}
.shared{border:1px solid var(--rule);border-radius:6px;padding:1px 8px;font-size:.8rem;color:var(--muted)}
.badge{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:600}
.star{color:var(--cd);margin-left:4px}
.phead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;letter-spacing:-.015em;margin:10px 0 12px;max-width:34ch}
.phead .srcnote{font-size:.88rem;color:var(--again);border-left:3px solid var(--again);padding:2px 0 2px 10px;margin:8px 0 6px;max-width:68ch}
.phead .note{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 4px;max-width:62ch}
.phead a.open{font-size:.9rem;font-weight:500;color:var(--cd);text-decoration:none;border-bottom:1px solid currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 26px}
.secnav button{text-align:left;background:none;border:0;border-bottom:1px dashed var(--rule);padding:2px 0;margin-right:12px;font-size:.84rem;color:var(--muted)}
.secnav button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.prog{font-size:.85rem;color:var(--muted);margin-left:auto}

h3.sec{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.qa{border-bottom:1px solid var(--rule)}
.qa:last-child{border-bottom:0}
.qbtn{display:grid;grid-template-columns:1fr auto;gap:16px;width:100%;text-align:left;background:none;border:0;padding:14px 0;font-weight:500;font-size:1rem;line-height:1.4}
.qbtn:hover .qt{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.qmeta{display:flex;gap:8px;align-items:center;padding-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
.qa.open .chev{transform:rotate(90deg)}
.known{font-size:.72rem;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.novel{font-size:.72rem;color:var(--cd);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.ans{display:none;padding:0 0 18px}
.qa.open .ans{display:block;animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ans p.a{font-family:var(--serif);font-size:1.04rem;line-height:1.65;margin:0 0 12px;max-width:66ch}
.extra{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;font-size:.92rem;margin:0 0 12px;max-width:72ch}
.extra dt{color:var(--muted);font-size:.84rem;padding-top:2px}
.extra dd{margin:0;line-height:1.55}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:var(--cl);border:0;border-radius:6px;padding:2px 9px;font-size:.8rem}
.kw:hover{outline:1px solid var(--cd)}
.notep{font-family:var(--serif);font-style:italic;color:var(--muted);padding:12px 0 12px 14px;border-left:2px solid var(--rule);margin:8px 0}
.empty{font-family:var(--serif);color:var(--muted);padding:30px 0;max-width:52ch}
.comments{margin-top:44px}
.comments textarea{width:100%;min-height:140px;resize:vertical;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);font-family:var(--serif);font-size:1rem;line-height:1.6}
.comments textarea[readonly]{opacity:.8}
.cmtstatus{font-size:.82rem;color:var(--muted);margin-top:6px}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:2px}

/* home */
.home h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em;margin:0 0 6px}
.home .lead{color:var(--muted);margin:0 0 34px;max-width:58ch}
.grp{margin-bottom:30px}
.grp h3{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;margin:0 0 8px}
.prow{display:grid;grid-template-columns:120px 1fr 120px;gap:16px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:12px 4px;text-align:left}
.prow:hover{background:var(--hover)}
.prow b{font-weight:600;font-size:.92rem}
.prow span{font-family:var(--serif);font-size:.95rem;line-height:1.35}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cd)}
.barlab{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* search results */
.rgroup{margin-bottom:26px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0 0 4px}
.rgroup h3 button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}

/* flashcards */
.study{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.study.on{display:flex}
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stop .ttl{font-weight:600}
.stop .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stop .x{margin-left:auto}
.track{height:4px;background:var(--rule);border-radius:2px;margin:14px 0 0;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stage{flex:1;display:grid;place-items:center;perspective:1600px;padding:24px 0;min-height:0}
.card{width:min(720px,100%);height:min(440px,100%);position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:18px;border:1px solid var(--rule);border-top:10px solid var(--cd);padding:28px clamp(20px,4vw,40px);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .src{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.face .q{font-family:var(--serif);font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.3;font-weight:500;margin:auto 0;letter-spacing:-.01em}
.face .bq{font-size:.9rem;color:var(--muted);margin:12px 0 10px}
.face .ba{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.25rem);line-height:1.6;margin:0 0 14px}
.face .hint{font-size:.82rem;color:var(--muted);text-align:center}
.sctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.again{color:var(--again);border-color:currentColor}
.btn.good{color:var(--good);border-color:currentColor}
.done{text-align:center;font-family:var(--serif)}
.done h3{font-size:1.8rem;font-weight:500;margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 20px}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

@media (max-width:820px){
  .shell{display:block}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);height:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  body.drawer .scrim{display:block}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px;align-items:center;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .mtop b{font-family:var(--serif);font-weight:600}
  main{padding-top:24px}
  .prow{grid-template-columns:1fr;gap:6px}
  .extra{grid-template-columns:1fr;gap:2px}
  .extra dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mtop"><button class="btn" id="menu" aria-label="Show paper list">Papers</button><b id="mtitle">Signaling pathways</b></div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="side">
    <div class="brand"><h1 id="home" tabindex="0" role="link">Signaling pathways</h1><small id="tot"></small></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search all notes" aria-label="Search all notes"></label>
    <div class="cats" id="cats"></div>
    <ul class="plist" id="plist"></ul>
    <button class="theme" id="theme">Theme: auto</button>
  </aside>
  <main id="main"></main>
</div>

<section class="study" id="study" aria-label="Flashcards">
  <div class="stop">
    <span class="ttl" id="sTitle"></span><span class="count" id="sCount"></span>
    <div class="opts"><label><input type="checkbox" id="sShuffle"> Shuffle</label><label><input type="checkbox" id="sNew"> Skip cards I know</label></div>
    <button class="btn x" id="sClose">Close</button>
  </div>
  <div class="track"><i id="sTrack"></i></div>
  <div class="stage" id="stage"></div>
  <div class="sctl" id="sctl">
    <button class="btn again" id="bAgain">Review again <small>(1)</small></button>
    <button class="btn" id="bFlip">Flip <small>(space)</small></button>
    <button class="btn good" id="bGood">Got it <small>(2)</small></button>
  </div>
</section>

<script>
const DATA = {"page": {"label": "Signaling pathways", "folder": "signaling", "updated": "2026-11-19"}, "legend": ["TGF-β / Nodal", "Wnt"], "catKeys": {"TGF-β / Nodal": "emb", "Wnt": "oth"}, "papers": [{"id": "Komiya_2008", "title": "Wnt signal transduction pathways", "category": "Wnt", "link": "https://doi.org/10.4161/org.4.2.5851", "note": "", "source_pdf": "papers/signaling/Komiya_2008_Organogenesis_wnt_signal_transduction.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What does this review cover?", "a": "The Wnt pathway is ancient and conserved and regulates cell fate, migration, polarity, neural patterning and organogenesis. Humans have 19 Wnt proteins. Downstream of Frizzled (Fz), signaling splits into the canonical (β-catenin-dependent) pathway and non-canonical (β-catenin-independent) pathways, which include Planar Cell Polarity (PCP) and Wnt/Ca2+.", "kw": ["Wnt", "canonical", "non-canonical"], "info": "Published in 2008, so it reflects the state of the field at that time.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Where does the name Wnt come from, and why does the pathway matter for disease?", "a": "Wnt fuses the Drosophila segment polarity gene wingless with its vertebrate homolog int-1. Deregulated Wnt signaling causes cancers of the breast, colon and skin, skeletal defects and birth defects, including the neural tube defect spina bifida.", "kw": ["wingless", "int-1", "disease"], "info": "Wnt proteins and antagonists are tightly restricted in space and time during development. Wnt signaling has also been implicated in stem cell renewal.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How is the Wnt signal received?", "a": "Wnts bind the N-terminal cysteine-rich domain of Frizzled receptors (10 in humans), which are seven-transmembrane proteins resembling G-protein coupled receptors. Co-receptors are also needed, for example LRP5/6 for canonical signaling. The signal passes to the phosphoprotein Dishevelled (Dsh/Dvl), which can bind Fz directly.", "kw": ["Frizzled", "LRP5/6", "Dishevelled"], "info": "Dsh is the first cytoplasmic protein used by all three branches, and the signal branches at the level of Dsh.", "concl": "How Dsh channels signaling into each branch remains unclear."}, {"type": "qa", "section": "Secretion and extracellular regulators", "q": "How are Wnts modified and secreted?", "a": "Wnts are glycosylated in the ER and lipid-modified (palmitoylated). Porcupine is important for this lipid modification, and secretion is regulated by Wntless/Evenness interrupted and the retromer complex. Outside the cell, heparan sulfate proteoglycans such as Dally and glypican 3 bind and stabilize Wnts, limiting diffusion and modulating signaling.", "kw": ["Porcupine", "Wntless", "HSPG"], "info": "", "concl": ""}, {"type": "qa", "section": "Secretion and extracellular regulators", "q": "Which extracellular proteins antagonize or activate Wnt signaling?", "a": "Antagonists include Dickkopf (Dkk), Wnt-inhibitor protein (WIF), soluble Frizzled-related proteins (SFRP), Cerberus, Frzb and the context-dependent Wise; the review describes them as preventing Wnt interaction with Fz or LRP5/6. Norrin and R-Spondin2 bind LRP5/6 and may activate signaling without a Wnt, while SOST binds LRP5/6 and inhibits it.", "kw": ["Dkk", "SFRP", "R-Spondin", "SOST"], "info": "These inhibitors are tightly regulated in the embryo and likely create Wnt signaling gradients for patterning.", "concl": ""}, {"type": "note", "section": "Secretion and extracellular regulators", "text": "Not from the paper: the review groups all antagonists as Wnt-binding, but Dkk is generally understood to act by binding LRP5/6 rather than Wnt itself. Worth checking against a newer source if this distinction matters."}, {"type": "qa", "section": "Canonical pathway", "q": "What happens to β-catenin without a Wnt signal?", "a": "Cytoplasmic β-catenin is degraded by a destruction complex of Axin, APC, PP2A, GSK3 and CK1α. CK1 and GSK3 phosphorylate β-catenin, which targets it for ubiquitination (via β-TrCP) and proteasomal destruction.", "kw": ["destruction complex", "GSK3", "Axin", "APC"], "info": "The hallmark of the canonical pathway is accumulation of β-catenin and its translocation into the nucleus.", "concl": ""}, {"type": "qa", "section": "Canonical pathway", "q": "How does Wnt binding inactivate the destruction complex?", "a": "Wnt binding to Fz and LRP5/6 recruits Axin to the membrane, where it binds a conserved sequence in the LRP5/6 cytoplasmic tail. This binding is promoted by phosphorylation of LRP5/6 by CK1γ or GSK3. Wnt also dephosphorylates Axin and lowers its cytoplasmic levels, and Dsh is recruited to Fz.", "kw": ["LRP6 phosphorylation", "Axin", "CK1γ"], "info": "MACF1 may help translocate Axin to the membrane, but the mechanism is unclear. CK1 and GSK3 act positively at LRP5/6 but negatively at β-catenin.", "concl": "The resulting membrane complex stabilizes β-catenin by sequestering and/or degrading Axin."}, {"type": "qa", "section": "Canonical pathway", "q": "What is the role of Dishevelled in canonical signaling?", "a": "Dsh is phosphorylated by CK1, CK2, Metastasis Associated Kinase, PKC and Par1, which probably controls its localization and partner choice. It has DIX, PDZ and DEP domains; DIX and PDZ are central for canonical signaling. Activated Dsh inhibits GSK3, which leads to β-catenin stabilization and accumulation.", "kw": ["Dsh", "DIX", "PDZ", "DEP"], "info": "Dsh also binds Axin and Fz.", "concl": "How Dsh is activated is still unresolved."}, {"type": "qa", "section": "Canonical pathway", "q": "How does β-catenin enter and leave the nucleus?", "a": "β-catenin has no nuclear localization sequence, and its import does not need importins or Ran. It may piggyback on other factors such as Axin, which also shuttles. It also has no nuclear export sequence; export uses either RanBP3 together with APC (which has an NES) or a Ran-independent route through nuclear pore proteins.", "kw": ["nuclear import", "RanBP3", "APC"], "info": "", "concl": "The import mechanism remains poorly understood."}, {"type": "qa", "section": "Canonical pathway", "q": "What does β-catenin do in the nucleus?", "a": "It acts as a transcriptional co-activator, best characterized with LEF/TCF DNA-binding factors. Targets include organizer genes Siamois and Twin and oncogenes Myc and CyclinD1. Legless and Pygopus affect its nuclear retention and transactivation.", "kw": ["LEF/TCF", "Siamois", "Pygopus", "Legless"], "info": "", "concl": ""}, {"type": "qa", "section": "Canonical pathway", "q": "How does canonical Wnt establish the Xenopus dorsal axis?", "a": "After fertilization, cortical rotation moves Dsh and other Wnt components to the future dorsal side, stabilizing β-catenin there and forming the Spemann-Mangold Organizer. β-catenin/TCF activates the homeodomain factors Twin and Siamois, which drive organizer genes. Ventral injection of Xwnt8, Dsh, β-catenin or dominant-negative GSK3 induces a secondary axis.", "kw": ["Spemann-Mangold Organizer", "cortical rotation", "Xenopus"], "info": "Whether a ligand was needed was long unclear; Tao et al. (2005) showed maternal Wnt11 activates canonical signaling for axis formation.", "concl": ""}, {"type": "qa", "section": "Canonical pathway", "q": "How does canonical Wnt pattern the anterior-posterior axis?", "a": "During gastrulation the organizer secretes Wnt inhibitors (Cerberus, WIF, Dkk, Frzb), which keep nuclear β-catenin low anteriorly and higher posteriorly. This gradient is needed for head formation and neuroectoderm patterning.", "kw": ["anterior-posterior", "head induction", "Wnt gradient"], "info": "Canonical Wnt also controls posterior and tail patterning and formation of heart, lungs, kidney, skin and bone.", "concl": "The authors note there seems to be no organ system whose formation canonical Wnt does not directly or indirectly regulate."}, {"type": "qa", "section": "Non-canonical PCP pathway", "q": "What is Planar Cell Polarity and how was it discovered?", "a": "PCP is polarity within the plane of an epithelium, on top of apical-basal polarity. It was found in Drosophila, where mutations in Fz and Dsh randomize the orientation of cuticle hairs, sensory bristles and ommatidia. In vertebrates it orients inner ear stereocilia and hair follicles and controls dorsal mesoderm migration in gastrulation.", "kw": ["planar cell polarity", "Drosophila"], "info": "Its defining feature is regulation of the actin cytoskeleton, and it appears to act independently of transcription.", "concl": ""}, {"type": "qa", "section": "Non-canonical PCP pathway", "q": "How does non-canonical Wnt control convergent extension?", "a": "In convergent extension, polarized cells intercalate mediolaterally, narrowing the tissue and lengthening it anterior-posteriorly. Wnt4, Wnt5a and Wnt11 signal non-canonically, and their overexpression disrupts convergent extension in Xenopus and zebrafish without strongly affecting cell fate. Dsh, Fz, Daam1, Rho, Rac, Prickle and Strabismus also affect it.", "kw": ["convergent extension", "Wnt11", "Wnt5a"], "info": "PKA is a negative regulator: it binds RhoA and inhibits Rho without affecting β-catenin transcription. The pathway also acts later in neural tube closure.", "concl": "The vertebrate non-canonical pathway is likely equivalent to Drosophila PCP because the core components are the same."}, {"type": "qa", "section": "Non-canonical PCP pathway", "q": "Which receptors and co-receptors mediate PCP signaling?", "a": "The signal is thought to go through Fz independently of LRP5/6, although LRP6 has been shown to regulate convergent extension. Candidate co-receptors are NRH1, Ryk, PTK7 and ROR2.", "kw": ["NRH1", "Ryk", "PTK7", "ROR2"], "info": "In Drosophila it is still unclear whether a Wnt ligand regulates PCP at all.", "concl": ""}, {"type": "qa", "section": "Non-canonical PCP pathway", "q": "What are the downstream branches of PCP signaling?", "a": "Dsh uses its PDZ and DEP domains to activate two parallel GTPase branches. Rho branch: Wnt induces a Dsh-Daam1 complex, and the formin Daam1 activates Rho via the GEF WGEF; Rho activates ROCK and myosin to rearrange actin. Rac branch: needs the DEP domain, is independent of Daam1, and activates JNK.", "kw": ["Daam1", "Rho", "ROCK", "Rac", "JNK"], "info": "Daam1 binds both Dsh and RhoA, suggesting a positive feedback loop. Figure 2 adds that Daam1 drives actin polymerization through Profilin.", "concl": "Factors downstream of JNK, whether any genes are transcribed, and how the opposing Rho and Rac activities are coordinated remain unclear."}, {"type": "qa", "section": "Non-canonical PCP pathway", "q": "How does protein localization relate to PCP?", "a": "In Drosophila, asymmetric localization of Fz, Flamingo, Dsh, Strabismus and Prickle mediates polarization. In vertebrates it is harder to see; Dsh, Rac and PKCδ localize along medial and lateral edges of Xenopus mesoderm cells, and Prickle is anterior in zebrafish. In convergent extension cells Dsh sits at the membrane and in lamellipodia, and its asymmetric membrane accumulation is required.", "kw": ["asymmetric localization", "Prickle", "Flamingo"], "info": "Overexpression or knockdown of Dsh disrupts its membrane localization and mediolateral polarity. Lack of good reagents limits vertebrate localization studies.", "concl": ""}, {"type": "qa", "section": "Non-canonical PCP pathway", "q": "Is non-canonical Wnt instructive or permissive for gastrulation movements?", "a": "Evidence from zebrafish suggests permissive: injecting Wnt11 RNA at the two-cell stage rescues the silberblick (wnt11) mutant, so localized Wnt11 expression is not required.", "kw": ["silberblick", "permissive"], "info": "", "concl": "The authors consider the question still open."}, {"type": "qa", "section": "Non-canonical Wnt/Ca2+ pathway", "q": "What defines the Wnt/Ca2+ pathway?", "a": "Some Wnts and Fz receptors release intracellular Ca2+ from the ER through trimeric G proteins. Wnt5a, Wnt11 and rat Fz2 release Ca2+ without stabilizing β-catenin, and this release is blocked by pertussis toxin and transducin α, which inhibit G protein signaling.", "kw": ["calcium", "G proteins", "Wnt5a"], "info": "Calcium waves occur in gastrulating zebrafish and Xenopus embryos and are thought to matter for early patterning.", "concl": "It shares components with PCP but is distinct enough to count as a separate branch."}, {"type": "qa", "section": "Non-canonical Wnt/Ca2+ pathway", "q": "What are the effectors of Wnt/Ca2+ signaling?", "a": "Ca2+ activates PKC and CamKII. CamKII (and calcineurin, per Figure 3) activates NFAT to promote ventral fates in Xenopus. CamKII also activates TAK1 and Nemo-like kinase (NLK), which antagonize β-catenin/TCF. PKC regulates tissue separation in gastrulation through CDC42.", "kw": ["PKC", "CamKII", "NFAT", "TAK1/NLK"], "info": "Figure 3: Dsh acts through PLC and IP3 to release Ca2+, and DAG activates PKC. Dsh also activates a phosphodiesterase (PDE) that inhibits PKG, linking cGMP to Ca2+ release.", "concl": ""}, {"type": "qa", "section": "Non-canonical Wnt/Ca2+ pathway", "q": "What does Wnt/Ca2+ do in the embryo?", "a": "It negatively regulates dorsal axis formation, promotes ventral fates, regulates tissue separation and convergent extension, and later heart formation. Pharmacological block of Ca2+ release stops convergent extension in Xenopus. Convergent extension defects from Wnt5a misexpression are partly rescued by CamKII in zebrafish, and CamKII overexpression alone inhibits Xenopus gastrulation.", "kw": ["dorsal axis", "convergent extension", "heart"], "info": "Dsh, through its PDZ and DEP domains, induces Ca2+ release and activates PKC and CamKII for heart formation, so it is part of this branch too.", "concl": "Wnt/Ca2+ acts as a modulator of both the canonical and PCP pathways."}, {"type": "qa", "section": "Other Wnt pathways", "q": "What other Wnt branches were emerging?", "a": "Microtubule regulation via GSK3 and Dsh in neuronal migration and synaptogenesis; Ryk and Src in axon repulsion; casein kinase inhibiting Rap1 in gastrulation; Dsh and GSK3 regulating TSC2 to inhibit mTor in cell growth; Dsh, aPKC, Par3, Par6 and Lgl in epithelial polarity; PKA and CREB inducing MyoD and Myf5 in myogenesis; ROR2 controlling PAPC via CDC42 and JNK.", "kw": ["Ryk", "mTor", "Rap1", "CREB"], "info": "", "concl": "How these branches relate to and integrate with the main three is obscure."}, {"type": "qa", "section": "Signal specificity", "q": "Does a given Wnt or Fz determine which pathway is activated?", "a": "Not simply. Wnt8 causes nuclear β-catenin but not Ca2+ signaling, Wnt5a induces Ca2+ flux but not β-catenin, and Wnt11 can activate both. Fz receptors also activate both branches, although rat Fz1 does not raise Ca2+ or activate PKC and CamKII in zebrafish, while rat Fz2 does.", "kw": ["signal specificity", "Wnt8", "Wnt11"], "info": "Co-receptors may decide: LRP5 and LRP6 are implicated only in canonical signaling, while NRH1, PTK7 and ROR2 selectively transduce non-canonical signaling.", "concl": "Specificity is probably not set by a ligand-receptor pair but by co-receptors, Dsh binding partners and Dsh localization."}, {"type": "qa", "section": "Signal specificity", "q": "How do Dsh domains, partners and localization direct signaling?", "a": "The DIX domain binds Axin and is essential for canonical but not non-canonical signaling. PDZ works in canonical, PCP and Wnt/Ca2+ signaling. DEP works in non-canonical signaling and is needed for Dsh membrane translocation. Dsh bound to Daam1, Strabismus or Prickle (via PDZ) acts in PCP, while Dsh bound to CK1, GSK3 or GBP acts in canonical signaling.", "kw": ["DIX", "PDZ", "DEP", "Dsh partners"], "info": "About 30 Dsh binding partners were known. Removing Dsh from the membrane blocks Rho activation and convergent extension but not canonical signaling. Dsh shuttles into the nucleus, but the importance of nuclear Dsh is unclear.", "concl": ""}, {"type": "qa", "section": "Conclusion", "q": "What is the overall conclusion?", "a": "Two decades of work built a molecular framework for the main Wnt branches and cemented Wnt's role in embryonic patterning. But the integration, specificity and biochemistry of Wnt signaling are still unclear, and deregulated Wnt is strongly linked to human disease.", "kw": ["integration", "specificity"], "info": "", "concl": ""}, {"type": "note", "section": "Conclusion", "text": "Recurring open questions in this review: how Dsh is activated and routes signals into each branch, how β-catenin enters the nucleus, what lies downstream of JNK, and whether non-canonical Wnt is instructive or permissive. Since this is a 2008 review, check newer literature before treating these as still open."}, {"type": "note", "section": "Canonical pathway", "text": "Wnt11 appears on both sides: it is a classic non-canonical/PCP ligand (silberblick, Ca2+ release) but maternal Wnt11 activates canonical signaling for the Xenopus dorsal axis. Good example for the point that ligands do not fix the branch."}], "key": "signaling/Komiya_2008_Organogenesis_wnt_signal_transduction", "shared": "", "preprint": "", "tags": ["External notes"], "source_note": ""}, {"id": "ElKholtei_2025", "title": "Nodal Signaling: A Paradigm for TGFβ Signaling in Embryonic Development", "category": "TGF-β / Nodal", "link": "https://doi.org/10.1146/annurev-cellbio-112122-030209", "note": "", "source_pdf": "papers/signaling/ElKholtei_2025_AnnuRevCellDevBiol_nodal_signaling_TGFb.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is the scope of this review?", "a": "Nodal ligands are TGFβ family members that arose early in bilaterian evolution. They regulate mesoderm and endoderm specification, body patterning, left-right (L-R) asymmetry and pluripotency maintenance. Many of their effects are tissue specific and depend on interactions with other signaling pathways.", "kw": ["Nodal", "TGFβ", "morphogen"], "info": "The review has three parts: evolution and molecular architecture of the pathway, developmental functions, and mechanisms of pattern formation.", "concl": "Nodal's developmental functions are largely conserved across vertebrates, but many mechanisms of transcriptional response and tissue patterning are still unclear."}, {"type": "qa", "section": "Abstract", "q": "Why is Nodal called a paradigm morphogen?", "a": "Nodal uses many patterning mechanisms at once: concentration- and duration-dependent effects, feedback regulation, reaction-diffusion interactions and scale invariance. Its targets specify cell types, remodel the intracellular and extracellular milieu, and drive cell movements and morphogenesis.", "kw": ["morphogen", "reaction-diffusion", "scale invariance"], "info": "", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Evolution of pathway players", "q": "How was Nodal discovered and which TGFβ subfamily does it belong to?", "a": "Nodal was found in mouse genetic studies as an embryonic lethal mutation affecting mesoderm (Conlon et al. 1994, Zhou et al. 1993). TGFβ ligands split into two subfamilies by the R-Smad they activate: TGFβ/Nodal/Activin (Smad2/3) and BMP/GDF/AMH (Smad1/5/8). Nodal belongs to the first.", "kw": ["Smad2/3", "R-Smad"], "info": "", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Evolution of pathway players", "q": "When did Nodal and its specific partners evolve?", "a": "Nodal evolved early in Bilateria. Orthologs are found across deuterostomes and in some lophotrochozoans, but none in ecdysozoans. Lefty and the EGF-CFC coreceptor are found in deuterostomes and lophotrochozoans, so they also originated in Bilateria. Vg1/Gdf1/3 has so far been described only in deuterostomes.", "kw": ["Bilateria", "Lefty", "EGF-CFC", "Vg1/Gdf1/3"], "info": "Figure 1 (adapted from Heger et al. 2020): the Nodal-related gene of Hydra belongs to a distinct orthogroup (OG_9136, GDF6), so Nodal is present only in Bilateria.", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Evolution of pathway players", "q": "Which pathway components are older than Nodal, and how does Activin differ?", "a": "Activin type I and type II receptors, the Activin ligand, Smad2/3 and Smad4 are conserved across metazoans. Activin signals through the same pathway as Nodal, but it does not need EGF-CFC coreceptors and is not inhibited by Lefty.", "kw": ["Activin", "metazoans"], "info": "Examples of why fine control matters: loss of Lefty misregulates mesoderm specification and allocation, and misexpression of EGF-CFC coreceptors extends responsiveness to Nodal.", "concl": "Nodal, Gdf3, EGF-CFC and Lefty all arose in Bilateria and may have enabled mesoderm and L-R axis functions, which need precise control of signaling range and intensity."}, {"type": "note", "section": "Evolution and architecture - Evolution of pathway players", "text": "Figure 1 says Nodal is restricted to Bilateria because the Hydra gene is GDF6-like, yet Section 3 still cites Watanabe et al. 2014 on Nodal signaling in Hydra for cnidarian roles. Worth keeping in mind when citing a 'Nodal in cnidarians' claim."}, {"type": "qa", "section": "Evolution and architecture - Biogenesis and processing", "q": "How are Nodal and Lefty regulated before translation?", "a": "The microRNA miR-430 represses both Nodal (agonist) and Lefty (antagonist) transcripts. Without miR-430, Nodal signaling is reduced.", "kw": ["miR-430"], "info": "", "concl": "Precise balancing of agonist and antagonist levels is needed for optimal signaling."}, {"type": "qa", "section": "Evolution and architecture - Biogenesis and processing", "q": "Why are Nodal-Gdf1/3 heterodimers considered the endogenous ligand?", "a": "In zebrafish, Gdf3 is maternally provided, ubiquitous, binds Nodal and is required for mesoderm and endoderm induction. GDF1 binds mouse Nodal and increases its activity in Xenopus assays and cultured cells. Heterodimers signal faster and more potently than Nodal homodimers, especially at low Nodal concentrations.", "kw": ["heterodimer", "Gdf3", "GDF1"], "info": "Throughout the review, 'Nodal signaling' means signaling by Nodal-Gdf1/3 heterodimers.", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Biogenesis and processing", "q": "How does heterodimerization control Gdf3 secretion and processing?", "a": "The Gdf3 monomer is retained in the ER by an exposed cysteine thiol, N-glycosylation sites and BiP-chaperone binding motifs. Heterodimerization with Nodal releases it. The secreted heterodimer is then cleaved by proprotein convertases Furin and Pace4 in the extracellular space.", "kw": ["ER retention", "Furin", "Pace4"], "info": "Intracellular processing can be induced synthetically but has little endogenous evidence. EGF-CFC was proposed to guide processing at the cell surface, but this is not confirmed in vivo. Gdf3 must be processed to signal, whereas heterodimers with unprocessed Nodal are partly functional.", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Biogenesis and processing", "q": "Is heterodimer-dependent secretion unique to Nodal?", "a": "No. In the Drosophila wing, Gbb and Dpp heterodimerize to be secreted and signal more strongly than Dpp homodimers. In zebrafish, BMP2-BMP7 works only as a heterodimer, and in Xenopus BMP2-BMP4 heterodimers are more potent than homodimers.", "kw": ["BMP heterodimers", "Dpp", "Gbb"], "info": "The structure of the Nodal-Gdf3 heterodimer bound to its receptors has not been solved, unlike BMP and Activin A complexes.", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Receptors", "q": "Which receptors does the Nodal heterodimer use?", "a": "It binds type I Activin receptors Alk4 and Alk7 and constitutively phosphorylated type II receptors ActrIIa and ActrIIb, forming heterotetrameric serine/threonine kinase complexes in which type II phosphorylates type I. Signaling also requires the GPI-linked EGF-CFC coreceptor Tdgf1/Cripto/Cryptic/One-eyed Pinhead, thought to bind Nodal and type I receptors.", "kw": ["Alk4", "Alk7", "ActrII", "Tdgf1/Cripto"], "info": "", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Receptors", "q": "How are Nodal receptors recycled or degraded?", "a": "In Xenopus, the Ras GTPase Rap2 recycles unbound Activin receptors (no evidence in other species). In fish and mammals, Nodal upregulates Dapper2 (Dpr2), which drives lysosomal degradation of endocytosed receptors. In mammalian cells, a Smurf2-Smad7 complex induces proteasomal or lysosomal degradation.", "kw": ["Dapper2", "Smurf2", "Rap2"], "info": "Smurf2 also negatively regulates mesoderm induction in Xenopus.", "concl": "It is unclear what decides which degradation route is used, or whether it is receptor specific."}, {"type": "qa", "section": "Evolution and architecture - Extracellular modulation", "q": "Which extracellular antagonists inhibit Nodal and how?", "a": "Lefty proteins and Cerberus/DAN family members (zebrafish Charon, Xenopus Coco, human Cerberus, mouse Cerl). Zebrafish, mouse and human have lefty1 and lefty2, which bind Nodal, Gdf3 and/or Tdgf1 and block EGF-CFC-receptor and Nodal-receptor interactions. DAN proteins bind Nodal directly and block receptor binding.", "kw": ["Lefty", "Cerberus", "Charon", "DAN family"], "info": "The binding sites and structural details of these interactions are largely unknown.", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Signal transduction", "q": "How is the signal transduced to the nucleus?", "a": "Receptor activation phosphorylates two serines at the C terminus of Smad2/3, which recruits Smad4. Smad2/3-Smad4 heterodimers or heterotrimers bind cofactors for specific targeting. Ectodermin monoubiquitinates Smad4 and limits responsiveness, while FAM/Usp9x deubiquitinates it and allows binding to pSmad2/3.", "kw": ["pSmad2/3", "Smad4", "Ectodermin", "FAM/Usp9x"], "info": "The E3 ligase Arkadia enhances signaling, probably by degrading the corepressor SNON, which forms inhibitory complexes with Smad2/3.", "concl": ""}, {"type": "qa", "section": "Evolution and architecture - Signal transduction", "q": "Which cofactors direct Smads to DNA, and how is signaling terminated?", "a": "Smad partners include FoxH1, Mixer, Tead, Oct4, Sox2, Nanog and Eomes. Nanog, Sox2 and Oct4 cooperate with Smads to maintain pluripotency, while FoxH1, Mixer or Eomes induce mesoderm and endoderm by priming chromatin at targets such as gsc, tbxta, sox32 and noto.", "kw": ["FoxH1", "Eomes", "Mixer"], "info": "Termination is poorly characterized. PPM1A dephosphorylates Smad2/3 and promotes nuclear export in human cell lines, but its embryonic role is unknown. Smad2 shuttling depends on signaling level, but how pSmad2 leaves the nucleus is unclear.", "concl": "Molecular details of pSmad-cofactor interactions and the cofactor combinations needed per target gene are poorly understood."}, {"type": "qa", "section": "Functions - Pluripotency", "q": "Is Nodal needed for pluripotency in the preimplantation epiblast?", "a": "No. Nodal is expressed in the ICM/epiblast of human and mouse blastocysts but is dispensable at this stage. In human blastocysts NANOG appears before Nodal signaling, and Nodal inhibition does not reduce NANOG, SOX2 or OCT4. Mouse ESCs with disrupted Smad2/3 and inhibitor-treated mouse blastocysts keep their pluripotency markers.", "kw": ["preimplantation", "epiblast", "mESC"], "info": "BMP4 and LIF are the main regulators of mESC pluripotency. In zebrafish and axolotl, Nodal is not needed for Nanog, SoxB1 or Pou5f1 expression. Inhibitor studies gave divergent results and had off-target effects on BMP, so genetic knockouts (for example of EGF-CFC) are suggested.", "concl": "Why Nodal is expressed at this stage is still a mystery."}, {"type": "qa", "section": "Functions - Pluripotency", "q": "What does Nodal do in the postimplantation mouse epiblast?", "a": "It maintains the pluripotent state and acts as a gatekeeper for allocation of cells to ectoderm. Nodal-null mouse embryos arrest early in gastrulation, express ectopic neural markers, lack mesoderm and endoderm, and have lower Oct4, Nanog, Crypto and Foxd3. Mouse EpiSCs also depend on Nodal.", "kw": ["postimplantation", "mEpiSC", "gatekeeper"], "info": "A Smad2/3 double knockout in mouse epiblast-like cells (mEpiLCs) fails to allocate the three germ layers properly, raises BMP target expression and derepresses extraembryonic genes.", "concl": ""}, {"type": "qa", "section": "Functions - Pluripotency", "q": "What is known about Nodal and human pluripotency?", "a": "In vivo function in the human postimplantation epiblast is unknown. hESCs and hiPSCs best match the postimplantation epiblast (between mEpiLCs and mEpiSCs). In these cells Activin/Nodal blocks neuroectoderm and promotes OCT4 and NANOG, and Nodal knockout in hESC micropattern colonies reduces NANOG.", "kw": ["hESC", "hiPSC", "primed pluripotency"], "info": "Activin A is used in vitro to maintain hESCs, mEpiSCs and hiPSCs. In cultured human embryos, Nodal expression drops slightly from pre- to postimplantation while core pluripotency markers remain.", "concl": ""}, {"type": "qa", "section": "Functions - Pluripotency", "q": "How does Smad2/3 maintain pluripotency at the transcriptional level?", "a": "Activated Smad2/3 binds with Oct4 at the Nanog proximal promoter. Inhibiting Smad2/3 or Nanog induces neuroectoderm markers, and Nanog overexpression blocks neuroectoderm. Nanog, Oct4 and Sox2 form positive feedback loops, and Smad2/3-Nanog protein complexes steer Nodal output toward pluripotency genes.", "kw": ["Nanog", "Oct4", "Sox2"], "info": "Constitutively active Smad2/3 increases the efficiency of iPSC generation.", "concl": "Binding to Nanog may restrict Smad2/3 access to mesoderm and endoderm regulatory elements and prevent premature differentiation."}, {"type": "qa", "section": "Functions - Pluripotency", "q": "How does FGF contribute to pluripotency maintenance?", "a": "FGF acts as a competence factor for Activin/Nodal signaling. hESC, mEpiSC and iPSC cultures need both Activin/Nodal and FGF2. ERK2 downstream of FGF2 binds pluripotency transcription factors at regulatory regions, and blocking both pathways reduces pluripotency factors more than blocking either alone.", "kw": ["FGF2", "ERK2"], "info": "Together the two pathways suppress BMP signaling and activate NANOG and OCT4. The in vivo role of FGF2 is largely unknown.", "concl": ""}, {"type": "qa", "section": "Functions - Pluripotency", "q": "How does Nodal switch from maintaining pluripotency to specifying lineages?", "a": "Three mechanisms are proposed: (a) Smad2/3 changes partners, (b) m6A is deposited on Smad2/3 targets, and (c) other pathways contribute. For example, definitive endoderm onset in mouse depends on a switch from SMAD2/3-NANOG to SMAD2/3-EOMES, and in mesendoderm induction Smad2/3 switches from Oct4 and Hippo components to FoxH1.", "kw": ["m6A", "EOMES", "PI3K/Akt"], "info": "m6A on Nanog transcripts promotes exit toward neuroectoderm. Inhibiting PI3K/Akt raises pSmad2/3 and activates mesendoderm markers, while active PI3K/Akt keeps pSmad2/3 low, so it mainly regulates pluripotency genes.", "concl": "How pSmad2/3 levels are read at developmental vs pluripotency enhancers, and what pluripotency factor levels are needed for the transition, is unclear."}, {"type": "qa", "section": "Functions - Mesendoderm in zebrafish", "q": "Where and how is Nodal expressed in zebrafish?", "a": "In three domains: the dorsal yolk syncytial layer (YSL), the ventrolateral YSL, and embryonic cells next to the margin. Dorsally, maternal Huluwa stabilizes β-catenin, which induces Nodal. Laterally and ventrally, expression depends on maternal Eomesa and zygotic Mxtx2. Nodal then induces its own expression, and a gradient forms from the margin.", "kw": ["YSL", "Huluwa", "Eomesa", "Mxtx2"], "info": "Because Gdf3 is maternal and ubiquitous, the timing and location of Nodal ligand expression determine where and when signaling happens.", "concl": ""}, {"type": "qa", "section": "Functions - Mesendoderm in zebrafish", "q": "What happens to zebrafish embryos without Nodal signaling?", "a": "They lack endoderm and head and trunk mesoderm derivatives such as kidney, heart, blood, liver, pancreas, gut and notochord. Margin cells no longer internalize and become ectoderm or tail mesoderm. Tail somites still form, so posterior mesoderm does not depend on Nodal.", "kw": ["loss of function", "internalization"], "info": "Transplants show Nodal is required cell-autonomously for prechordal plate, notochord, endoderm and anterior somite fates and for internalization. Ectopic Nodal induces and internalizes ectopic mesendoderm.", "concl": ""}, {"type": "qa", "section": "Functions - Mesendoderm in zebrafish", "q": "How do Nodal and FGF separate endoderm from mesoderm?", "a": "Endoderm progenitors arise close to the margin and mesoderm over a wider domain. Nodal induces FGF ligands and the intracellular FGF inhibitor Dusp4, so FGF/ERK is active over several cell tiers but inhibited in cells with high Nodal. ERK promotes mesoderm at the expense of endoderm, and blocking FGF increases endoderm progenitors.", "kw": ["FGF", "Dusp4", "ERK"], "info": "Blocking FGF does not cause major defects in nonposterior mesoderm induction.", "concl": "The exact relationship between Nodal and FGF in mesoderm formation is unclear."}, {"type": "qa", "section": "Functions - Mesendoderm in zebrafish", "q": "What is Nodal's role in the zebrafish dorsal organizer?", "a": "Nodal patterns the organizer but is not required to induce it. gsc expression is highest at the margin, while noto peaks several cell tiers away. Without Nodal these genes are reduced and dorsal midline mesoderm and endoderm do not form, while ectopic Nodal at the animal pole induces a secondary axis with a notochord but no second head.", "kw": ["organizer", "gsc", "noto"], "info": "Ventral Wnt and BMP restrict organizer genes dorsally. Dorsally, Nodal induces chordin (BMP inhibitor) and dkk (Wnt inhibitor). Nodal-deficient embryos still have dorsal-ventral polarity and anterior neural tissue because β-catenin-dependent Dharma partly maintains chordin.", "concl": ""}, {"type": "qa", "section": "Functions - Mesendoderm in other nonmammals", "q": "What is conserved and what differs in Xenopus, chick and killifish?", "a": "In Xenopus and chick, initial Nodal expression depends on maternal β-catenin and Wnt, respectively, and mesendoderm and organizer formation (Spemann-Mangold organizer, Hensen's node) need Nodal. Unlike zebrafish, Gdf3 is restricted (vegetal region in frog, posterior marginal zone in chick), so both Nodal and Gdf expression set where signaling happens.", "kw": ["Xenopus", "chick", "Nothobranchius furzeri"], "info": "In chick, GDF1 is restricted by long-range mechanical tension and by calcium waves through gap junctions. In the annual killifish N. furzeri, Huluwa is truncated and inactive, and Nodal is needed for directed migration of dispersed blastomeres as they aggregate.", "concl": ""}, {"type": "qa", "section": "Functions - Mesendoderm in mouse", "q": "How is Nodal expression regulated in the mouse embryo?", "a": "At E5.5 Nodal is expressed throughout the epiblast and in visceral endoderm, then restricted posteriorly and distally. Initial epiblast expression is likely driven by pluripotency factors. It is maintained by a FOXH1-dependent autoregulatory enhancer and by a loop in which Nodal induces BMP in extraembryonic ectoderm, and BMP induces Wnt3 and Nodal in the epiblast.", "kw": ["FOXH1 enhancer", "Wnt3", "BMP"], "info": "WNT3-driven increase of Nodal is needed for mesoderm induction. LEFTY1 and CER1 suppress Nodal distally, restricting it first to the proximal epiblast, then the primitive streak, then the node.", "concl": ""}, {"type": "qa", "section": "Functions - Mesendoderm in mouse", "q": "What are Nodal's functions during mouse gastrulation?", "a": "First, it induces the distal and anterior visceral endoderm (DVE/AVE) via SMAD2; these tissues produce Nodal, Wnt and BMP inhibitors that confine signaling to the posterior. Second, it induces anterior mesodermal and endodermal fates. Smad2 mutant epiblast cells form all mesoderm except notochord and node, and also removing one Smad3 copy eliminates axial midline tissues.", "kw": ["AVE", "Smad2", "axial mesoderm"], "info": "The spatial domain of Nodal-dependent regulation does not match its expression pattern, and high-resolution maps of Nodal activity are missing. Inhibiting glycolysis in gastruloids reduces Wnt, Nodal and FGF signaling and mesoderm, and acts upstream of these pathways. Embryos with increased Wnt lack anterior mesoderm, which BMP inhibition rescues.", "concl": "Nodal is needed for endoderm and, at lower levels, for axial mesoderm."}, {"type": "qa", "section": "Functions - Mesendoderm in humans", "q": "What is known about Nodal in human hypoblast and organizer formation?", "a": "In cultured human embryos and hiPSC 3D gastruloids, Nodal is expressed in the epiblast, signals to the hypoblast, and is needed to specify hypoblast populations. In patterned 2D hESC cultures, BMP induces Nodal via Wnt, and high Nodal is needed for organizer gene GSC; these tissues induce a secondary axis when grafted into chick.", "kw": ["hypoblast", "gastruloids", "GSC"], "info": "A subset of anterior hypoblast cells expresses LEFTY1/2 and CER1 (Molè et al. 2021), but other studies did not detect LEFTY1 in human anterior visceral endoderm. Hypoblast-like cultures treated with a Nodal inhibitor have fewer anterior hypoblast cells and more pSMAD1/5/9 (BMP activity).", "concl": ""}, {"type": "qa", "section": "Functions - Mesendoderm in humans", "q": "Which human germ-layer fates need Nodal?", "a": "Definitive endoderm needs Nodal: inhibited 2D and 3D hESC cultures do not express endoderm markers. Some mesoderm genes, including cardiac markers, are disrupted, but many others such as TBXT are unaffected and may depend on FGF. LEFTY2 is expressed in axial mesoderm but not lateral plate mesoderm, suggesting signaling mainly in anterior epiblast or primitive streak.", "kw": ["definitive endoderm", "TBXT", "cardiac mesoderm"], "info": "The duration of Nodal and BMP exposure decides whether hiPSCs become endoderm-, notochord- or ectoderm-like cells (Rito et al. 2025).", "concl": "As in zebrafish, posterior mesoderm forms without Nodal, while endoderm and cardiac/anterior/axial mesoderm depend on it. These conclusions rest on few stages and markers."}, {"type": "qa", "section": "Functions - Mesendoderm summary", "q": "What are the two general functions of Nodal in germ layer specification?", "a": "First, Nodal specifies and patterns anterior organizer tissues (zebrafish shield, mammalian node and AVE) that secrete BMP, Wnt and Nodal inhibitors needed for the most anterior tissues such as the brain. Second, together with BMP, Wnt and FGF it specifies mesoderm and endoderm: endoderm directly, axial mesoderm with organizer-dependent BMP/Wnt inhibition, while posterior mesoderm forms without Nodal.", "kw": ["organizer", "germ layers"], "info": "2D and 3D gastruloids recapitulate the BMP-Wnt-Nodal cascade and revealed new interactions, such as YAP attenuating Nodal signaling.", "concl": ""}, {"type": "qa", "section": "Functions - Downstream targets", "q": "What kinds of target genes does Nodal activate during gastrulation?", "a": "Cell-type transcription factors such as Noto (notochord), Sox32 (endoderm) and Tbx16 (anterior paraxial mesoderm), and differentiation factors such as Xbp1 (secretory machinery). Relay signals such as FGF and inhibitors such as Chordin and Dkk. Morphogenesis genes: Snail and Twist (EMT) and apelin receptors, activated by Apela/Toddler/Elabela to drive mesoderm internalization and migration.", "kw": ["Sox32", "Toddler/Apela", "EMT"], "info": "Nodal also suppresses BMP for axis elongation, induces matrix metalloproteinases that perforate the basement membrane for primitive streak extension, increases adhesion via planar cell polarity genes (reducing tissue porosity and its own diffusivity), and induces the micropeptide NEMEP-a, which promotes glucose uptake.", "concl": "Coordinated target activation couples cell fate to movement and differentiation."}, {"type": "qa", "section": "Functions - Left-right asymmetry", "q": "How is left-right symmetry broken upstream of Nodal?", "a": "In the left-right organizer (Kupffer's vesicle in zebrafish, node in mouse), tilted motile cilia rotate clockwise and create leftward flow. The flow bends mechanosensory cilia, which destabilizes mRNA of the Nodal inhibitor Cerl2 on the left. Nodal and GDF1 are expressed on both sides of the node, but Cerl2 inhibits them only on the right.", "kw": ["nodal flow", "cilia", "Cerl2/Dand5"], "info": "Artificial flow can reverse sidedness, and mechanically stimulating cilia with optical tweezers can restore or reverse asymmetry.", "concl": ""}, {"type": "qa", "section": "Functions - Left-right asymmetry", "q": "How is left-sided Nodal propagated and confined?", "a": "Left node signaling activates Nodal in the left lateral plate mesoderm (LPM). There Nodal heterodimerizes with symmetric GDF1 and induces its own expression, spreading anteriorly by relay. Nodal also induces Lefty in the left LPM and midline, a diffusible inhibitor that stops spread beyond the left LPM. Pitx2 is then activated as the regulator of left identity and morphogenesis.", "kw": ["lateral plate mesoderm", "Lefty1", "Pitx2"], "info": "In zebrafish, Cerl2/Dand5 and Lefty1 mutants show bilateral, precocious and accelerated Nodal. A Nodal inhibitor drug restores left-sided expression in lefty1 mutants, so Lefty1 mainly dampens Nodal. Follistatin in the LPM is another dampener.", "concl": ""}, {"type": "qa", "section": "Functions - Left-right asymmetry", "q": "What are the open questions in L-R patterning?", "a": "Four: (1) whether flow also carries signals or vesicles (chemosensory model) is unproven, and how chickens, turtles and pigs, which lack motile cilia, break symmetry is unknown; (2) evidence for calcium transmitting cilia mechanosensation is contradictory; (3) how node Nodal activates LPM Nodal is unclear; (4) pitx2 mutants still show L-R asymmetry, so other effectors exist.", "kw": ["open questions"], "info": "Myosin1G may promote laterality transfer via endosomal trafficking of pathway components, but LPM Nodal is still activated without it.", "concl": ""}, {"type": "qa", "section": "Functions - Adults and disease", "q": "Does Nodal have roles after embryogenesis?", "a": "Evidence is limited. Zebrafish mutants lacking One-eyed pinhead or Vg1/Gdf3 after embryogenesis are viable. A recent preprint suggests Nodal in pericytes regulates blood vessel growth and barrier function in the postnatal brain.", "kw": ["adult", "pericytes"], "info": "", "concl": ""}, {"type": "qa", "section": "Functions - Adults and disease", "q": "How is Nodal linked to cancer?", "a": "Nodal and Cripto are expressed in melanoma and in pancreatic and breast cancers, more so in metastatic cells. Proposed mechanisms are maintenance of cancer stem cells and promotion of EMT. In breast cancer, hypoxia, mTOR inhibitors and chemotherapy induce translation of NODAL, NANOG and SNAIL isoforms with alternative 5' UTRs, which increases stem-like plasticity.", "kw": ["cancer", "Cripto", "EMT"], "info": "", "concl": ""}, {"type": "qa", "section": "Pattern formation - Signaling domain", "q": "Does Nodal spread by diffusion or by a relay?", "a": "It depends on species. In zebrafish, Nodal from the YSL forms a pSmad2 gradient over several cell tiers within about 2 h, and cells far from producers express targets even without the relay, so ligands signal directly across cell layers. In human micropatterned 2D cultures, Nodal signals only to neighbors and a relay is needed.", "kw": ["diffusion", "production relay", "pSmad2 gradient"], "info": "The two zebrafish ligands differ in diffusion; whether the less diffusive Cyc/Ndr2 reaches nonadjacent cells without a relay is untested. In mouse, Nodal reaches distant cells during L-R patterning in the absence of Lefty2, but this is unclear for gastrulation. BMP4-treated confined hESCs show distinct Nodal-positive and Nodal-negative domains rather than a gradient.", "concl": "An in vivo Nodal activity gradient has been shown in zebrafish but not in mammals."}, {"type": "qa", "section": "Pattern formation - Signaling domain", "q": "What restricts the range of Nodal signaling?", "a": "Transient immobilization of ligands and Lefty. Binding to the EGF-CFC coreceptor or type I receptor Alk4 (Acvr1b-a/b in zebrafish) in nearby cells is needed to restrict the domain and form the gradient, consistent with a hindered-diffusion model. Without the coreceptor, ligands spread throughout the zebrafish embryo.", "kw": ["hindered diffusion", "EGF-CFC", "Alk4"], "info": "The coreceptor must be replenished. Without replenishment (e.g. zebrafish Zoep mutants), signaling moves as a traveling wave. Removing the coreceptor expands both ligands' range similarly, so their different diffusivity comes from receptor binding. Ligand stability and degradation also shape the gradient.", "concl": "Ligand-receptor interactions might explain species differences in range and mode of spread, but this is untested."}, {"type": "qa", "section": "Pattern formation - Signaling domain", "q": "How do Nodal and Lefty form a reaction-diffusion system?", "a": "Nodal induces Lefty, which inhibits Nodal (negative feedback). Lefty diffuses faster than Nodal in zebrafish, frog, chick and mouse embryos and human cells, because Nodal binds cell surfaces more readily. This makes Nodal a short-range activator of itself and of a long-range inhibitor, which has been used for synthetic pattern formation in human cells.", "kw": ["reaction-diffusion", "Lefty", "negative feedback"], "info": "Exceptions: Lefty acts at short range in micropatterned human gastruloids, and in mouse gastrulation Lefty1 is expressed distally from Nodal.", "concl": ""}, {"type": "qa", "section": "Pattern formation - Signaling domain", "q": "Is feedback necessary to form the zebrafish Nodal gradient?", "a": "No. smad2 mutant zebrafish lacking both positive and negative feedback still form near-wild-type gradients.", "kw": ["smad2 mutant", "feedback"], "info": "The authors suggest fast-developing species like zebrafish need rapid diffusion-based spreading, which juxtacrine signaling and relays cannot provide.", "concl": "Diffusion is sufficient for spreading the signal in zebrafish."}, {"type": "note", "section": "Pattern formation - Signaling domain", "text": "The section summary says the gradient comes from hindered diffusion, relay and Lefty together, but the smad2 mutant result says diffusion alone is enough in zebrafish, while human cultures need a relay. Whether these differences reflect species, in vitro vs in vivo, or receptor binding is untested."}, {"type": "qa", "section": "Pattern formation - Robustness", "q": "What does Lefty feedback contribute to robustness?", "a": "Lefty mutant zebrafish have an extended pSmad2 gradient and defects, but a Nodal inhibitor drug rescues them to adulthood, so Lefty coupling is not required under normal conditions. When Nodal levels are perturbed, wild-type embryos develop normally while drug-rescued lefty mutants have defects.", "kw": ["robustness", "Lefty mutants"], "info": "", "concl": "Nodal-Lefty negative feedback makes patterning robust to changes in signaling levels."}, {"type": "qa", "section": "Pattern formation - Robustness", "q": "How does the Nodal gradient scale with embryo size?", "a": "When 30% of cells are removed before gastrulation, the gradient length adjusts. This depends on diffusive Lefty: smaller embryos have higher Lefty concentration, which inhibits Nodal more and gives a shorter gradient.", "kw": ["scaling", "Lefty"], "info": "", "concl": ""}, {"type": "qa", "section": "Pattern formation - Interpretation", "q": "How many Nodal targets are known, and what is missing?", "a": "About 50-100 direct targets in early zebrafish and 30-140 in mouse cell lines, with very different expression domains. Most domains were mapped with colorimetric in situ hybridization, which is semiquantitative, on few genes.", "kw": ["target genes", "in situ hybridization"], "info": "Three proposed interpretation mechanisms: signaling level, signaling duration and interaction with other pathways (Figure 10 also shows time-integral and pathway cross-regulation models).", "concl": "A quantitative, comprehensive analysis of Nodal-induced expression patterns is missing."}, {"type": "qa", "section": "Pattern formation - Interpretation", "q": "What evidence supports interpretation by signaling level?", "a": "In zebrafish, sox32, gata5 and gsc are expressed near the margin and tbxta and noto farther away. Embryos with 50% or 25% ligand make less ventrolateral endoderm and muscle progenitors form closer to the margin. Low Lefty represses only gsc, while higher Lefty also represses noto. In mouse allelic series, higher Nodal is needed for prechordal plate and foregut and lower for notochord and hindgut.", "kw": ["French flag", "thresholds", "allelic series"], "info": "In Xenopus, dorsal mesoderm needs higher Nodal than ventral mesoderm. Enhancer binding affinity explains readouts of Drosophila bicoid, dorsal and Dpp, but few Nodal or Smad2 enhancers are known and their response to signal level is unknown.", "concl": "Graded Nodal signaling has not been demonstrated in mouse, so duration might explain the allelic series instead."}, {"type": "qa", "section": "Pattern formation - Interpretation", "q": "What evidence supports interpretation by signaling duration?", "a": "In zebrafish, blocking Nodal at 4.3 hpf still allows gsc and noto, hatching gland and notochord, but prevents sox32, heart and circulation. Cells transplanted into embryos with constant signaling need only short exposure for tbxta but longer exposure for gsc. In mESCs, however, target expression follows Smad2/3 activation proportionally over time.", "kw": ["duration", "time integral", "tbxta"], "info": "Hagos and Dougan (2007) proposed a cumulative dose (time integral) model. Nuclear Smad2 was equal after 1 or 2 h of constant signaling, so integration likely happens downstream of Smad2 accumulation.", "concl": "How thresholds on a time integral would be implemented molecularly is unknown."}, {"type": "qa", "section": "Pattern formation - Interpretation", "q": "Can Nodal act probabilistically or through competence?", "a": "Yes. sox32 is expressed in a salt-and-pepper pattern controlled by Nodal and FGF: high and prolonged Nodal induces sox32 in cells with low FGF. Competence is also timed: falling EGF-CFC coreceptor expression during gastrulation ends zebrafish cells' ability to respond.", "kw": ["sox32", "competence", "stochastic fate"], "info": "In micropatterned colonies, a rapid rise in Activin concentration enhances mesoderm differentiation; whether this happens in vivo is unknown.", "concl": ""}, {"type": "qa", "section": "Pattern formation - Interpretation", "q": "How do other pathways combine with Nodal to diversify fates?", "a": "In two ways: pathways cross-regulate each other's activity and domains, and genes are directly co-regulated by several pathways. For example, the Nodal:BMP ratio decides which genes, fates and movements cells adopt, and these two pathways can induce a complete embryo from uncommitted zebrafish cells and in vitro.", "kw": ["Nodal/BMP ratio", "combinatorial regulation"], "info": "Possible mechanisms: competition for Smad4, shared by Smad2 and Smad1/5; distinct Smad2 and Smad1/5 binding sites in the same gene; and direct partnering, as SMAD2/3 and β-catenin are found in the same complexes at primitive streak genes in hESCs.", "concl": "Comprehensive in vivo enhancer analyses are needed to test how widespread combinatorial regulation is."}, {"type": "qa", "section": "Conclusions", "q": "What are the main open questions?", "a": "(1) Which features let the bilaterian Nodal pathway become the driver of mesendoderm and L-R patterning? (2) How cofactors, coreceptors and inhibitors interact structurally. (3) How Nodal switches between contexts. (4) How diverse patterning mechanisms are integrated and why they differ between tissues and species. (5) Its precise roles in human development. (6) How cancer roles relate to embryonic ones. (7) How targets are activated at precise times, places and levels.", "kw": ["open questions"], "info": "Suggested tools: in vitro culture systems, large-scale high-resolution in vivo measurements (spatial genomics), deep learning, optogenetics, massively parallel reporter assays and precise perturbations.", "concl": ""}, {"type": "note", "section": "Conclusions", "text": "Much of the mechanistic picture (gradients, duration, scaling, feedback) comes from zebrafish. For mammals the review repeatedly notes that the in vivo gradient, signaling range and level-vs-duration readout are not yet demonstrated."}], "key": "signaling/ElKholtei_2025_AnnuRevCellDevBiol_nodal_signaling_TGFb", "shared": "", "preprint": "", "tags": ["External notes"], "source_note": ""}], "comments": {}};
const CAT = DATA.catKeys;
const catVars = c => { const k = CAT[c]||"gen"; return `--cl:var(--c-${k});--cd:var(--c-${k}-d)`; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const papers = DATA.papers.map(p => {
  let n = 0;
  p.items.forEach(it => { if (it.type==="qa") it.uid = p.id + ":" + (n++); });
  return {...p, slug: slug(p.id), qas: p.items.filter(i => i.type==="qa")};
});
const bySlug = Object.fromEntries(papers.map(p => [p.slug, p]));
const cats = DATA.legend.filter(c => papers.some(p => p.category===c));

/* storage */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let known = new Set(store.get("pn-known", []));
const saveKnown = () => store.set("pn-known", [...known]);
let theme = store.get("pn-theme", "auto");
function applyTheme(){
  if (theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = "Theme: " + theme;
}
document.getElementById("theme").onclick = () => {
  theme = theme==="auto" ? "light" : theme==="light" ? "dark" : "auto";
  store.set("pn-theme", theme); applyTheme();
};
applyTheme();

const totalQ = papers.reduce((a,p) => a + p.qas.length, 0);
document.getElementById("tot").textContent = `${papers.length} papers, ${totalQ} questions`;

/* state */
let activeCats = new Set();
let current = null;
let query = "";
const main = document.getElementById("main");

function renderCats(){
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat" style="${catVars(c)}" aria-pressed="${activeCats.has(c)}" data-cat="${esc(c)}"><span class="dot" style="background:var(--cd)"></span>${esc(c)}</button>`).join("");
}
document.getElementById("cats").onclick = e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  const c = b.dataset.cat; activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
  renderCats(); renderList(); if (!current && !query) renderHome();
};
const visible = () => papers.filter(p => !activeCats.size || activeCats.has(p.category));

function renderList(){
  document.getElementById("plist").innerHTML = visible().map(p => {
    const k = p.qas.filter(q => known.has(q.uid)).length;
    return `<li><button class="pitem" style="${catVars(p.category)}" data-p="${p.slug}" aria-current="${current===p}">
      <span class="tab" style="background:var(--cd)"></span>
      <span><b>${esc(p.id.replace("_"," "))}${(p.tags||[]).length ? `<span class="star" title="${esc(p.tags.join(", "))}">★</span>` : ""}</b><span class="t">${esc(p.title)}</span></span>
      <span class="n">${p.qas.length ? (k ? k+"/" : "") + p.qas.length : "—"}</span></button></li>`;
  }).join("");
}
document.getElementById("plist").onclick = e => {
  const b = e.target.closest("[data-p]"); if (b) go(b.dataset.p);
};

function go(s){
  document.body.classList.remove("drawer");
  if (location.hash.slice(1) !== s) location.hash = s; else route();
}
function route(){
  const h = location.hash.slice(1);
  if (query){ clearSearch(); }
  current = bySlug[h] || null;
  renderList();
  current ? renderPaper(current) : renderHome();
  document.getElementById("mtitle").textContent = current ? current.id.replace("_"," ") : DATA.page.label;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
const homeEl = document.getElementById("home");
homeEl.onclick = () => { history.pushState(null,"",location.pathname); route(); };
homeEl.onkeydown = e => { if (e.key==="Enter") homeEl.click(); };

function renderHome(){
  const list = visible();
  const groups = cats.filter(c => list.some(p => p.category===c));
  const k = papers.reduce((a,p) => a + p.qas.filter(q => known.has(q.uid)).length, 0);
  main.innerHTML = `<div class="home">
    <h2>${esc(DATA.page.label)}</h2>
    <p class="lead">${totalQ} questions across ${papers.length} papers. Open a paper to quiz yourself one answer at a time, or study the whole set as flashcards. You know ${k} of them so far. Last updated ${esc(DATA.page.updated)}.</p>
    <div class="toolbar"><button class="btn primary" id="studyAll">Study ${activeCats.size ? "these categories" : "everything"}</button></div>
    ${groups.map(c => `<div class="grp" style="${catVars(c)}"><h3><span class="dot" style="background:var(--cd)"></span>${esc(c)}</h3>
      ${list.filter(p => p.category===c).map(p => {
        const kn = p.qas.filter(q => known.has(q.uid)).length, pct = p.qas.length ? kn/p.qas.length*100 : 0;
        return `<button class="prow" data-p="${p.slug}"><b>${esc(p.id.replace("_"," "))}${(p.tags||[]).length ? `<span class="star" title="${esc(p.tags.join(", "))}">★</span>` : ""}</b><span>${esc(p.title)}</span>
          <div>${p.qas.length ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="barlab">${kn} of ${p.qas.length} known</div>` : `<div class="barlab">${p.missing_pdf ? "PDF missing" : "No notes yet"}</div>`}</div></button>`;
      }).join("")}</div>`).join("")}
  </div>`;
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => go(b.dataset.p));
  document.getElementById("studyAll").onclick = () => startStudy(list.flatMap(p => p.qas.map(q => [p,q])), activeCats.size ? [...activeCats].join(", ") : "All papers");
}

function hl(text){
  text = esc(text);
  if (!query) return text;
  const re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","gi");
  return text.replace(re, "<mark>$1</mark>");
}
function qaHTML(p, it, open){
  const extra = [["Details", it.info], ["Takeaway", it.concl]].filter(x => x[1]);
  return `<div class="qa${open ? " open" : ""}" style="${catVars(p.category)}">
    <button class="qbtn" aria-expanded="${!!open}"><span class="qt">${hl(it.q || "Note")}</span>
      <span class="qmeta">${it.novel ? `<span class="novel">New to me</span>` : ""}${known.has(it.uid) ? `<span class="known">Known</span>` : ""}
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></span></button>
    <div class="ans">
      ${it.a ? `<p class="a">${hl(it.a)}</p>` : ""}
      ${extra.length ? `<dl class="extra">${extra.map(([k,v]) => `<dt>${k}</dt><dd>${hl(v)}</dd>`).join("")}</dl>` : ""}
      ${it.kw.length ? `<div class="kws">${it.kw.map(k => `<button class="kw" data-kw="${esc(k)}" title="Search for ${esc(k)}">${esc(k)}</button>`).join("")}</div>` : ""}
    </div></div>`;
}
function bindQA(root){
  root.querySelectorAll(".qbtn").forEach(b => b.onclick = () => {
    const qa = b.parentElement; qa.classList.toggle("open"); b.setAttribute("aria-expanded", qa.classList.contains("open"));
  });
  root.querySelectorAll("[data-kw]").forEach(b => b.onclick = () => { qInput.value = b.dataset.kw; doSearch(); });
}

function renderPaper(p){
  const kn = p.qas.filter(q => known.has(q.uid)).length;
  const secs = [];
  p.items.forEach(it => { const s = it.section || "Notes"; if (!secs.includes(s)) secs.push(s); });
  let body = "";
  if (!p.items.length) body = `<p class="empty">${p.missing_pdf ? `The PDF is not in the folder yet (it needs a subscription). Download it with Open paper and save it as ${esc(p.missing_pdf)}. Notes are written in the next weekly update (Wednesdays 04:00).` : `There are no notes for this paper yet. They are generated in the weekly update (Wednesdays 04:00) from ${esc(p.source_pdf || "the PDF")}.`}</p>`;
  secs.forEach((s,i) => {
    body += `<h3 class="sec" id="s-${i}">${esc(s)}</h3>`;
    p.items.filter(it => (it.section || "Notes")===s).forEach(it => {
      body += it.type==="note" ? `<p class="notep">${esc(it.text)}</p>` : qaHTML(p, it, false);
    });
  });
  main.innerHTML = `<header class="phead" style="${catVars(p.category)}">
      <div class="who"><span>${esc(p.id.replace("_",", "))}</span><span class="tag">${esc(p.category)}</span>${(p.tags||[]).map(t => `<span class="badge">${esc(t)}</span>`).join("")}${p.shared ? `<span class="shared">Shared by ${esc(p.shared)}</span>` : ""}${p.link ? `<a class="open" href="${esc(p.link)}" target="_blank" rel="noopener">Open paper</a>` : ""}${p.preprint ? `<a class="open" href="${esc(p.preprint)}" target="_blank" rel="noopener" title="Earlier preprint version">Preprint</a>` : ""}</div>
      <h2>${esc(p.title)}</h2>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}${p.source_note ? `<p class="srcnote">⚠ ${esc(p.source_note)}</p>` : ""}
    </header>
    ${p.qas.length ? `<div class="toolbar">
      <button class="btn primary" id="studyP">Study as flashcards</button>
      <button class="btn" id="toggleAll">Show all answers</button>
      <span class="prog">${kn} of ${p.qas.length} known</span></div>` : ""}
    ${secs.length > 2 ? `<nav class="secnav" aria-label="Sections">${secs.map((s,i) => `<button data-s="${i}">${esc(s)}</button>`).join("")}</nav>` : ""}
    <div id="items">${body}</div>${commentHTML(p)}`;
  bindQA(main);
  bindComments(p);
  main.querySelectorAll("[data-s]").forEach(b => b.onclick = () => document.getElementById("s-"+b.dataset.s).scrollIntoView({behavior:"smooth"}));
  const t = document.getElementById("toggleAll");
  if (t) t.onclick = () => {
    const all = main.querySelectorAll(".qa"), open = t.textContent.startsWith("Show");
    all.forEach(q => { q.classList.toggle("open", open); q.querySelector(".qbtn").setAttribute("aria-expanded", open); });
    t.textContent = open ? "Hide all answers" : "Show all answers";
  };
  const sp = document.getElementById("studyP");
  if (sp) sp.onclick = () => startStudy(p.qas.map(q => [p,q]), p.id.replace("_"," "));
}

/* comments */
const COMMENTS = Object.assign({}, DATA.comments || {});
let serverOK = null;  // true when served by serve_notes.py (comments editable)
const cmtStamp = c => c && c.updated ? c.updated.replace("T", " ").slice(0, 16) : "";
function commentHTML(p){
  const c = COMMENTS[p.key] || {};
  const ro = serverOK === false;
  const status = ro ? `Read-only here: open the page through the notes server (start_notes_server.sh) to edit.${c.updated ? " Last saved " + cmtStamp(c) + "." : ""}`
               : (c.updated ? `Saved · ${cmtStamp(c)}` : "Comments are saved automatically as you type.");
  return `<section class="comments"><h3 class="sec">My comments</h3>
    <textarea id="cmtText" placeholder="Your thoughts on this paper and on its notes…"${ro ? " readonly" : ""}>${esc(c.text || "")}</textarea>
    <div class="cmtstatus" id="cmtStatus">${esc(status)}</div></section>`;
}
function bindComments(p){
  const ta = document.getElementById("cmtText"), st = document.getElementById("cmtStatus");
  if (!ta || serverOK === false) return;
  let timer, last = ta.value;
  const save = async () => {
    clearTimeout(timer);
    if (ta.value === last) return;
    const text = ta.value; st.textContent = "Saving…";
    try {
      const r = await fetch("/api/comments", {method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify({key: p.key, text})});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); last = text; COMMENTS[p.key] = {text, updated: j.updated};
      st.textContent = "Saved · " + cmtStamp(COMMENTS[p.key]);
    } catch (e) { st.textContent = "Not saved (" + e.message + "). Is the notes server running?"; }
  };
  ta.addEventListener("input", () => { st.textContent = "Unsaved changes…"; clearTimeout(timer); timer = setTimeout(save, 800); });
