"section": "Results - fine-mapping", "q": "What was found at the PRRC2A and LIMD2 loci?", "a": "At PRRC2A, several differentially methylated sites lay in an open chromatin region annotated as an intronic enhancer with Hi-C connectivity to PRRC2A; at LIMD2 an extended differentially methylated region covered a proximal enhancer and several exons and splice sites.", "kw": ["enhancer", "ATAC"], "info": "At PRRC2A, expression of 2 predicted TFs (ELK1 and ESSR) correlated with PRRC2A expression and explained over 30% of its variance. The open chromatin was specific to adipocyte precursors, absent in mature adipocytes and whole tissue.", "concl": ""}, {"type": "qa", "section": "Results - fine-mapping", "q": "What did the Motif 4 CG sites show in targeted sequencing?", "a": "The CG dinucleotides within Motif 4 were systematically hypomethylated in obesity (18 of 24, 75%, P = 0.01) and concordant with the adjacent sentinel differences (R = 0.63, P = 0.001).", "kw": ["Motif 4"], "info": "This supports the idea that binding motifs of methylation-sensitive TFs are enriched for obesity-associated methylation changes.", "concl": ""}, {"type": "qa", "section": "Methods - CRISPR-activation", "q": "How was CRISPR-activation performed?", "a": "Immortalised human adipose-derived stromal (ihASC) cells were transduced with lenti-dCAS9-VP64 then with dual guide RNA LentiGuide-Hygro vectors targeting a 150-bp window at the peak of the open chromatin sites, with AAVS1 guides as controls.", "kw": ["dCas9-VP64", "AAVS1"], "info": "Guides designed in CRISPOR and CHOPCHOP, 3 per gene paired in 3 combinations (F1/R2, F1/R3, F2/R3); selection with blasticidin then hygromycin left 2 PRRC2A, 3 LIMD2 and 2 AAVS1 guide pairs. Expression normalised to ACTB and GAPDH.", "concl": ""}, {"type": "qa", "section": "Results - CRISPR-activation", "q": "What did targeted activation show?", "a": "Activation at the LIMD2 regulatory region increased LIMD2 expression more than 2-fold (P < 0.0001) without affecting neighbouring genes, while activation at the PRRC2A region did not change PRRC2A or the TAD-sharing gene BAG6.", "kw": ["LIMD2"], "info": "The LIMD2 increase was seen with two of three guide pairs. The authors note the PRRC2A null result may be technical and does not exclude an effect there.", "concl": "The differentially methylated region at LIMD2 regulates LIMD2 transcription."}, {"type": "qa", "section": "Results - CRISPR-activation", "q": "What integrated model did the authors propose for the two genes?", "a": "Lower methylation at cg15809217 in obese subcutaneous adipocytes may promote insulin resistance and T2D through reduced PRRC2A expression and impaired adipogenesis, while reduced methylation at cg05941027 in obese visceral adipocytes may raise LIMD2 expression and lipid storage.", "kw": ["m6A"], "info": "PRRC2A was recently reported as a reader of N6-methyladenosine (m6A) that stabilises transcripts and regulates cell specification; LIMD2 is a structural protein needing further study.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How do the authors explain the depot specificity?", "a": "They surmise it is due to the local tissue microenvironment, since technical, genetic and other known confounding factors were excluded.", "kw": ["depot specificity"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What fraction of sites were causally implicated and what is the caveat?", "a": "Up to 26% of extreme obesity-associated 5mC sites were causally implicated, but the MR findings are causal estimates only for effects under genetic control.", "kw": ["Mendelian Randomisation"], "info": "Absence of MR evidence does not indicate absence of causation at environmentally determined loci, which make up the majority of the dataset.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What limitations and future directions do the authors raise?", "a": "The TF-methylation reciprocal relationships require experimental validation, and single-cell methylation and transcription technologies will be needed to address cellular epigenetic heterogeneity, dynamics and spatial microenvironment in obese adipose remodelling.", "kw": ["single cell"], "info": "They argue array-scale studies in many individuals remain valuable and should be combined with precision epigenome editing tools.", "concl": ""}, {"type": "note", "section": "Results - transcription factors", "text": "Array coverage of CG sites inside TF motifs was sparse (median 22%), so direct tests of methylation at TF binding sites were underpowered; worth checking whether whole-genome bisulphite or long-read methylation data would resolve this."}, {"type": "note", "section": "Results - genome-wide alterations", "text": "Why are there far fewer obesity-associated sites in visceral than subcutaneous adipocytes? Note that the Roadmap adipose/adipocyte chromatin states used for enrichment are derived from the subcutaneous depot, which may bias the comparison."}, {"type": "note", "section": "Results - CRISPR-activation", "text": "The PRRC2A CRISPR-activation negative result is attributed to technical factors; the open chromatin there was specific to adipocyte precursors, so cell state at the time of activation may matter."}], "key": "general/McAllan_2023_NatCommun_adipocyte_DNA_methylation_obesity", "shared": "", "preprint": "", "tags": ["Damir's paper"], "nostar": false, "source_note": ""}, {"id": "Liu_2025", "title": "Evolution of chromosomes and nuclear architectures of amniotes", "category": "Genome & chromosome evolution", "link": "https://doi.org/10.1038/s41467-025-67427-8", "note": "", "source_pdf": "papers/general/Liu_2025_NatCommun_amniote_chromosome_evolution.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What question does this paper address?", "a": "How chromosomes of mammals and reptiles diverged in sequence and 3D nuclear organization since their last common amniote ancestor. It also asks how chromosome rearrangements relate to 3D genome architecture.", "kw": ["amniote", "3D genome", "chromosome rearrangement"], "info": "Published online 10 December 2025 in Nature Communications (2026) 17:737. Two authors: Jing Liu and Qi Zhou (Zhejiang University).", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did they do, in one sentence?", "a": "They reconstructed the ancestral linkage groups (ALGs) of the amniote ancestor and its descendant nodes from chromosome-level assemblies of 36 species, two of them newly assembled. They then compared these with Hi-C, lamin-B1 and other chromatin data.", "kw": ["ALG", "Hi-C"], "info": "The abstract says 36 species. The Results describe 20 mammals, 16 reptiles and 1 amphibian outgroup (37 genomes, with 29/37 given as the long-read fraction).", "concl": "Mammals and reptiles show contrasting rearrangement regimes, but nuclear organization tied to the ancient split between micro- and macro-ALG chromatin is conserved, which suggests deep constraints on chromosome evolution."}, {"type": "qa", "section": "Introduction", "q": "What are A/B compartments, subcompartments and TADs?", "a": "Using Hi-C, the genome can be split into transcriptionally active (A) and inactive (B) compartments, which roughly match euchromatin and heterochromatin. These can be further divided into subcompartments A1, A2, B1, B2 and B3 that associate with particular nuclear bodies. At a finer scale, chromatin folds into topologically associated domains (TADs) through loop extrusion or self-organization.", "kw": ["A/B compartments", "subcompartments", "TAD"], "info": "Later in the paper, A1 is linked to speckles and B3 to the nuclear lamina (LAD).", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is a chromosome territory, and what decides the radial position of a chromosome?", "a": "FISH work by Thomas Cremer's group showed that each chromosome occupies its own territory in the interphase nucleus. Radial position was proposed to correlate with chromosome size, and gene density also contributes.", "kw": ["chromosome territory", "FISH", "radial position"], "info": "Human chr18 and chr19 are similar in size, but chr18 sits toward the periphery and chr19 in the interior, probably because of their different gene densities.", "concl": "Both size and gene density seem to matter. It was unclear whether the segregated layout seen in reptiles is ancestral or derived."}, {"type": "qa", "section": "Introduction", "q": "Where do reptile microchromosomes sit in the nucleus?", "a": "The short, gene-rich and GC-rich microchromosomes of reptiles (including birds) sit in the nuclear interior. The large, gene-poor macrochromosomes sit near the periphery.", "kw": ["microchromosomes"], "info": "In most reptiles, and especially in birds, microchromosomes also show strong interchromosomal (trans) interactions.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is a Muller element / ancestral linkage group (ALG)?", "a": "Muller's 1940s hypothesis, from Drosophila, is that gene content within the same chromosomal element stays mostly conserved during evolution. Such ancestral elements are called ALGs here, and they keep their gene content and sequence across most descendant lineages.", "kw": ["Muller element", "ALG"], "info": "The idea extends to many animal phyla, including amniotes.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How old are microchromosomes, and do mammals have them?", "a": "Microchromosomes have an ancient origin dating to the jawed vertebrate ancestor. They are widely present and conserved in extant reptiles, including birds, but absent in mammals.", "kw": ["microchromosomes", "jawed vertebrates"], "info": "The paper is not consistent on the dating. The Discussion says microchromosomes originated in the vertebrate ancestor over 500 MY ago through asymmetric loss after whole genome duplications. The Fig. 5 legend says the bony vertebrate ancestor, 450-460 MYA.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was the gap in knowledge?", "a": "Mammals were known to have more extensive rearrangements, but nobody had quantified how the tempo and mode of chromosome evolution differ between reptiles and mammals. It was also unclear how these different trajectories connect to nuclear architecture.", "kw": [], "info": "Earlier comparative 3D work mostly looked at conservation of TAD boundaries, not chromosome-level nuclear positioning. One exception is cytogenetic work showing human chr18 and chr19 positions are conserved across primates (20-30 MY).", "concl": ""}, {"type": "qa", "section": "Results - Reconstructing ancestral linkage groups", "q": "Which ancestral nodes did they reconstruct, and with which species?", "a": "They reconstructed Amniota, Mammalia, Reptilia, Archelosauria, Archosauria, Eutheria and Boreoeutheria. The input was 20 mammals, 16 reptiles and one amphibian outgroup (Xenopus tropicalis).", "kw": ["ancestral reconstruction"], "info": "Species were chosen for phylogenetic representation, karyotype diversity and assembly quality. They include small chromosome numbers (Tasmanian devil 2n = 14, aardvark 2n = 20) and large ones (echidna 2n = 64, horse 2n = 66). Tuatara was excluded because it lacks a chromosome-level assembly. 29/37 (78.4%) of assemblies were from long reads with contig N50 > 10 Mb.", "concl": ""}, {"type": "qa", "section": "Results - Reconstructing ancestral linkage groups", "q": "Which new genomes did they generate, and why?", "a": "They made chromosome-level assemblies of the Chinese softshell turtle (Pelodiscus sinensis, 2n = 66) and the Siamese crocodile (Crocodylus siamensis, 2n = 30). Testudines and Crocodilia were under-represented among high-quality genomes.", "kw": ["Pelodiscus sinensis", "Crocodylus siamensis"], "info": "Both lineages were reported to have relatively conserved karyotypes within the lineage.", "concl": ""}, {"type": "qa", "section": "Results - Reconstructing ancestral linkage groups", "q": "Why did they use reference-based reconstruction, and which references?", "a": "Reference-based reconstruction includes intergenic regions, unlike gene-based reference-free methods. Human T2T-CHM13v2.0 was the mammalian reference and chicken GGswu was the reptilian reference, as both are among the best genomes in their classes.", "kw": ["DESCHRAMBLER", "T2T-CHM13", "GGswu"], "info": "DESCHRAMBLER builds homologous syntenic blocks (HSBs) into reconstructed ancestral chromosome fragments (RACFs). RACFs were then manually oriented and joined into ALGs, following Damas et al.", "concl": ""}, {"type": "qa", "section": "Results - Reconstructing ancestral linkage groups", "q": "How many ALGs did each ancestor have?", "a": "The amniote ancestor had 44 ALGs (AALGs). The mammalian ancestor had 32, the reptilian ancestor 36, the Boreoeutherian ancestor 26 and the Archosaurian ancestor 38.", "kw": ["AALG"], "info": "72% to 89% of each analysed genome was included in the multi-species alignments (Results). Methods gives reconstructed ancestor coverage as 67.0-89.4%. Fig. 1a also shows n = 35 (Archelosauria) and n = 23 (Eutheria).", "concl": "The number of ALGs falls from the amniote ancestor to its descendant nodes."}, {"type": "qa", "section": "Results - Reconstructing ancestral linkage groups", "q": "How were AALGs grouped by size?", "a": "Macro-AALGs are A1-8 (>90 Mb), medium-AALGs are A9-15 (40-90 Mb) and micro-AALGs are A16-44 (<40 Mb). Sizes are based on the human-sequence reconstruction.", "kw": ["micro-AALG", "macro-AALG"], "info": "The authors call this split artificial. It was made to capture the size spectrum.", "concl": ""}, {"type": "qa", "section": "Results - Reconstructing ancestral linkage groups", "q": "What happened to micro-AALGs in the ancestral nodes?", "a": "Micro-AALGs remained mostly intact in the reptilian and mammalian ancestors. They only became fused or translocated into larger chromosomes after mammals diverged, for example in human.", "kw": ["micro-AALG"], "info": "Chicken macrochromosomes can be explained by six AALG fusions and chicken microchromosomes by only one fusion.", "concl": "The avian karyotype best recapitulates the proto-karyotype of the jawed vertebrate ancestor, and the karyotype stayed largely stable from jawed vertebrates to amniotes and birds."}, {"type": "qa", "section": "Results - Reconstructing ancestral linkage groups", "q": "How does the reconstruction compare with earlier ones?", "a": "It recovered all 14 previously reported associations between human chromosome segments inferred by FISH, and it identified the avian homologues of 10 previously inferred amniote ancestral macrochromosomes. It also found a new fusion, AALG10 with AALG19, in the Reptilia ancestor, which is confirmed in all reptiles studied.", "kw": ["validation"], "info": "Sacerdot et al. inferred 49 AALGs, compared with 44 here. The authors attribute this to scaffold-level genomes that break at common fragile sites. One sentence comparing with another recent reconstruction is truncated in the PDF and unclear.", "concl": ""}, {"type": "qa", "section": "Results - Rates and patterns of chromosome evolution", "q": "Do mammals and reptiles differ in the number of rearrangements since the amniote ancestor?", "a": "Yes. Few fusions and translocations occurred on the lineage to the reptile ancestor, compared with many more in mammalian ancestors, especially translocations (one-sided t-test, t = 16.901, p = 3.5e-15). Extant mammalian chromosomes also contain fragments from significantly more different AALGs (p = 0.000145).", "kw": ["translocation", "fusion"], "info": "The overall composition of the mammalian ancestor's ALGs is not very different from the AALGs. Translocations kept dominating as mammals diverged from each other, but not among reptiles.", "concl": ""}, {"type": "qa", "section": "Results - Rates and patterns of chromosome evolution", "q": "How do inversion rates compare between mammals and reptiles?", "a": "Mammals have on average more than 3-fold higher inversion rates than reptiles: 3.30 vs. 0.94 events per MY. The highest rate is on the Atlantogenata branch (elephants, anteaters), followed by Laurasiatheria.", "kw": ["inversion rate"], "info": "Rates are estimated per AALG per million years along each lineage.", "concl": "Mammals have about 3-fold higher inversion rates than reptiles."}, {"type": "qa", "section": "Results - Rates and patterns of chromosome evolution", "q": "Which kinds of interchromosomal rearrangement dominate in each class?", "a": "Reptilian chromosomes, especially crocodile ones, are mostly products of fusions between AALGs. Mammalian chromosomes are shaped mainly by fissions and translocations. Birds and turtles have the lowest rates of both inter- and intrachromosomal rearrangement among amniotes.", "kw": ["fusion", "fission", "translocation"], "info": "Each platypus chromosome contains fragments from 4.3 AALGs on average, compared with 2.7 for crocodile.", "concl": "Bird and turtle karyotypes best represent the amniote ancestor."}, {"type": "qa", "section": "Results - Rates and patterns of chromosome evolution", "q": "Do macro- and micro-AALGs behave differently in rearrangements?", "a": "In mammals, rearrangements between micro- and macro-sized AALGs are more frequent than in reptiles (p = 0.008473). Mammalian macro-AALGs tend to undergo translocations and fissions (6.3 vs. 1.5, p = 5.9e-15), while micro-AALGs tend to undergo fusions. Reptiles show neither tendency.", "kw": ["micro-AALG", "macro-AALG"], "info": "For micro-AALG fusions the paper reports 0.53 vs. 0.87 (W = 720.5, p = 1.0e-08). It is unclear which group each number refers to, since the order seems to contradict the claim.", "concl": ""}, {"type": "qa", "section": "Results - Rates and patterns of chromosome evolution", "q": "What are EBRs and HSBs, and how were EBRs classified?", "a": "HSBs (homologous syntenic blocks) are conserved syntenic blocks, and EBRs (evolutionary breakpoint regions) are the junctions between them. Class-level EBRs are shared by at least 80% of lineages, order-level EBRs by at least 80% of one lineage only, family-level EBRs are unique to one species, and reused EBRs are found in less than 80% of lineage species without being specific to one lineage.", "kw": ["EBR", "HSB"], "info": "The lineages are Monotremata, Atlantogenata, Laurasiatheria and Euarchontoglires for mammals, and Squamata, Pantestudines/Testudines, Crocodilia and Aves for reptiles.", "concl": ""}, {"type": "qa", "section": "Results - Rates and patterns of chromosome evolution", "q": "Which EBR classes shape extant chromosomes?", "a": "Eutherian chromosomes are shaped mostly by class-level EBRs, while monotreme and reptilian chromosomes are shaped mostly by order-level EBRs. 12-19% of EBRs are reused across eutherian lineages, but reused EBRs are rare in reptiles except squamates.", "kw": ["reused EBR", "fragile sites"], "info": "Many reused EBRs have higher GC content than HSBs. GC-rich regions are more prone to double-strand breaks, which supports the existence of genomic fragile sites.", "concl": ""}, {"type": "qa", "section": "Results - Rates and patterns of chromosome evolution", "q": "What sequence features do family-level (species-specific) EBRs have?", "a": "Compared with HSBs and class- or order-level EBRs, they have higher GC and repeat content and lower insulation scores, so they are more likely to overlap TAD borders. The authors suggest this reflects recent TE insertions that contributed to local 3D organization.", "kw": ["insulation score", "TE", "TAD boundary"], "info": "Reptile family-level EBRs are enriched for GC-rich LINEs (CR1, L2). Euarchontoglires EBRs have more AT-rich L1 and fewer Alu, so they have lower GC. Human-lineage EBRs are enriched in segmental duplications, many linked to psychiatric and cognitive disorders.", "concl": "Recent EBRs carry signatures of TE-associated fragility. Older or reused breakpoints show no shared sequence feature, which suggests diverse mechanisms."}, {"type": "qa", "section": "Results - Nuclear architecture of ancestral microchromosomes", "q": "Are platypus microchromosomes homologous to reptile microchromosomes?", "a": "No. Almost all of them (9/10) come from translocations between fragments of different macro- and micro-AALGs, so they have a different and more recent origin.", "kw": ["platypus", "microchromosomes"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Nuclear architecture of ancestral microchromosomes", "q": "Which predicts a chromosome's trans-interaction strength better: its size or its micro-AALG content?", "a": "Micro-AALG content. Size is negatively associated with trans-interaction (R = -0.57), but micro-AALG percentage has a stronger positive association (R = 0.59) and a much larger coefficient in multiple linear regression (0.35 vs. -0.0012 for size).", "kw": ["trans-interaction", "micro-AALG%"], "info": "751 extant chromosomes (df = 749). Among chromosomes under 100 Mb, those with more than 50% micro-AALG origin have significantly higher trans-interaction (p = 6.4e-16).", "concl": "Ancestral micro-AALG origin predicts nuclear position better than current chromosome size."}, {"type": "qa", "section": "Results - Nuclear architecture of ancestral microchromosomes", "q": "How did they test whether micro-AALG regions are in the nuclear interior?", "a": "They used lamin-B1 data, a marker of the nuclear periphery, from human and emu tissues. Micro-AALG-derived regions in human and emu microchromosomes had higher trans-interaction (p = 9.55e-05) and lower lamin-B1 signal (p < 2.2e-16) than other chromosomes.", "kw": ["lamin-B1", "nuclear periphery"], "info": "Emu lamin-B1 data were generated by CUT&Tag (ovary, brain) according to Methods, although the abstract and Results call it ChIP-seq. Human lamin-B1 ChIP-seq was public (hESC, epicardium, liver).", "concl": "Higher-order nuclear organization constrains micro-AALGs to keep their interior position despite rearrangements."}, {"type": "qa", "section": "Results - Nuclear architecture of ancestral microchromosomes", "q": "Are there exceptions to the micro-interior / macro-periphery rule?", "a": "Yes. Some macro-AALG-derived chromosomes that became small after fission (human chr21, platypus chr19) gained trans-interactions. Some large chromosomes made mostly of fused micro-AALGs (leopard gecko chr4, platypus chr3) lost them.", "kw": ["chr21", "outliers"], "info": "Micro-AALG chromosomes with weaker trans-interactions had higher repeat content (platypus) or lower GC (leopard gecko) than other micro-AALG chromosomes. The authors attribute this to chromosome-specific turnover of euchromatin and heterochromatin.", "concl": ""}, {"type": "qa", "section": "Results - Lineage-specific repeats tune nuclear architecture", "q": "What is GPSeq, and what did it show?", "a": "GPSeq (genomic loci positioning by sequencing) measures radial nuclear position. A higher score means farther from the periphery. In human HAP1 cells, regions with high GPSeq scores had stronger trans-interactions (p = 4.5e-11), and micro-AALG-derived regions had higher GPSeq scores than medium- or macro-derived regions (p < 2.2e-16).", "kw": ["GPSeq", "HAP1"], "info": "Translocated chr9 and chr22 in HAP1 were excluded. Public data GSE135882, at 100 kb and 1 Mb resolution.", "concl": ""}, {"type": "qa", "section": "Results - Lineage-specific repeats tune nuclear architecture", "q": "What new explanation do they give for the different positions of chr18 and chr19?", "a": "Previously this was attributed to gene density. Here they show chr19 (and chr17) is derived from micro-AALGs and kept an interior position dating back to the amniote ancestor, while chr18 comes from medium- or macro-AALGs.", "kw": ["chr18", "chr19", "evolutionary origin"], "info": "", "concl": "Evolutionary origin (micro- vs. macro-AALG) is an additional explanation for radial position."}, {"type": "qa", "section": "Results - Lineage-specific repeats tune nuclear architecture", "q": "Do micro-AALG regions differ in chromatin state and subcompartment?", "a": "Yes. They differ in H3K4me3 (euchromatin) and H3K9me3 (heterochromatin) levels in both human and emu. In human, micro-AALG regions are enriched for the speckle-associated A1 subcompartment, and macro-AALG regions for the lamina-associated B3 subcompartment (chi-square = 4699.20, p < 2.2e-16).", "kw": ["H3K4me3", "H3K9me3", "nuclear speckles"], "info": "The authors suggest these different sequence compositions and epigenomic states were already present in the amniote ancestor.", "concl": "Natural selection keeps micro-AALGs in the interior around speckles and macro-AALGs at the lamina-associated periphery."}, {"type": "qa", "section": "Results - Lineage-specific repeats tune nuclear architecture", "q": "What are the trans-interaction stripes in human Hi-C?", "a": "They are conserved trans-interactions (for example between chr19 and chr7) located where Alu SINEs are concentrated, but not where L1 LINEs are, whether or not the region is micro-AALG-derived. Genome-wide, GPSeq score correlates with Alu density (R = 0.452), and the correlation is strongest in micro-AALG regions.", "kw": ["Alu", "SINE", "trans-interaction"], "info": "The stripes are conserved across cell types and developmental stages. Correlation in Fig. 4e, using 100 kb bins: PCC 0.427 for micro, 0.355 for medium, 0.303 for macro.", "concl": ""}, {"type": "qa", "section": "Results - Lineage-specific repeats tune nuclear architecture", "q": "Which Alu subfamily drives the homotypic trans-interactions?", "a": "Only AluSx, the most abundant subfamily, which expanded in higher primates, shows significant trans-interactions with other members of the same subfamily. It shows weak interactions with AluSz and AluY.", "kw": ["AluSx"], "info": "AluSx is enriched in micro-AALG regions (chi-square = 645.44).", "concl": ""}, {"type": "qa", "section": "Results - Lineage-specific repeats tune nuclear architecture", "q": "Are AluSx interactions ancestral or new in primates?", "a": "Probably new. Some macro- and medium-AALG regions that should have few ancestral trans-interactions interact strongly at AluSx-enriched loci. The homologous flanking regions in emu, platypus and elephant show few or no trans-interactions.", "kw": ["AluSx", "de novo"], "info": "Genes within 2 kb of highly interacting AluSx have higher H3K36me3 (1.72 vs. 0.54, p = 1.4e-10). These genes are enriched for DNA/RNA metabolism, DNA damage response and chromatin organization GO terms. Alu-rich regions are more often A1/speckle and less often B3/LAD.", "concl": "Alu elements locally tune the conserved architecture, possibly by pulling nearby housekeeping genes from different chromosomes toward speckles."}, {"type": "qa", "section": "Results - Lineage-specific repeats tune nuclear architecture", "q": "Do other mammals show SINE-driven trans-interactions?", "a": "Yes. Mouse B1, B2 and B4 SINEs and Asian elephant MIR SINEs show significant trans-interactions. Human and mouse share less than 10% of the orthologous genes near interacting Alu and B1 elements.", "kw": ["B1", "MIR", "mouse"], "info": "These SINEs expanded independently in each lineage.", "concl": "Independent SINE expansions are a mechanism for the recent divergence of nuclear architecture between mammals."}, {"type": "qa", "section": "Discussion", "q": "What is the overall evolutionary model?", "a": "Ancient microchromosomes, the building blocks, were kept in the amniote, reptile and mammal ancestors and in most reptiles, but were integrated into larger chromosomes in extant mammals by fusions and translocations. Their interior position was nonetheless conserved.", "kw": ["building block chromosomes"], "info": "Mammals: more inversions (3-fold), translocations and fissions that break AALGs. Reptiles: mainly fusions that keep the AALG unit intact.", "concl": "Linear rearrangement regimes differ between the classes, but spatial organization is conserved."}, {"type": "qa", "section": "Discussion", "q": "Why might EBRs be reused across lineages?", "a": "EBRs cluster in fragile, repeat-rich regions. Recurrent breakpoint usage is probably related to the spatial proximity of breakpoints, which fits with the conserved nuclear positions of AALG sequences.", "kw": ["EBR reuse", "fragile sites"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How old is the conventional nucleus (euchromatin inside, heterochromatin at the periphery)?", "a": "Probably older than the vertebrate radiation. Microchromosomes of little skate and lungfish also interact strongly in trans, and the gene-rich, A-compartment middle parts of amphioxus chromosomes interact strongly with each other.", "kw": ["conventional nuclei", "amphioxus"], "info": "A similar pattern is reported in C. elegans but not in Drosophila. Amphioxus data are from adult muscle Hi-C.", "concl": "This ancient nuclear organization constrains the positions of micro-AALG regions against fusions in reptiles and translocations in mammals."}, {"type": "qa", "section": "Discussion", "q": "Which mechanisms can change the conserved architecture?", "a": "One is a change in chromosome size, which alters recombination rate and in turn repeat and heterochromatin content. The other is lineage-specific repeats such as AluSx and B1, which act through homotypic interactions. Human chr21 is an example of both acting together: a truncated macro-AALG fragment that accumulated AluSx and moved toward the interior.", "kw": ["recombination rate", "chr21", "AluSx"], "info": "Micro-AALG regions inside large chromosomes (human chr1, chr12) mostly stay in the interior. Fusion does not drag the whole micro-AALG to the periphery.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What limitations do the authors acknowledge?", "a": "TE contact signals could partly reflect lineage-specific bursts and the mappability of recent insertions. Filtering for uniquely mapped reads cannot fully exclude this. Causality and the predicted nuclear positions still need imaging and functional perturbation.", "kw": ["mappability", "limitations"], "info": "They argue that differences between TE subfamilies of similar age and abundance point to real biology beyond mapping bias.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What is SIRLOIN, and why is it relevant?", "a": "SIRLOIN (SINE-derived nuclear RNA localization) is a 42-nt GC-rich element found in AluSx. It promotes nuclear retention of lncRNAs and some mRNAs through hnRNPK, and may explain how Alu and B1 copies interact with speckles.", "kw": ["SIRLOIN", "hnRNPK"], "info": "It is found in different Alu subfamilies and in B1 with variable consensus sequences. Motifs were detected with FIMO. The authors propose precise excision of the interacting Alu/B1 elements as future work.", "concl": ""}, {"type": "qa", "section": "Methods - Genomic dataset collection", "q": "Where did the genomes come from?", "a": "Most were downloaded from NCBI or DNAzoo and were chosen to have both a chromosome-level assembly and Hi-C data. Examples are human T2T-CHM13v2.0, mouse GRCm39, chicken GGswu, emu ZJU2.0 and the outgroup Xenopus tropicalis UCB_Xtro_10.0.", "kw": ["DNAzoo", "NCBI"], "info": "Accessions are listed in Supplementary Table 1.", "concl": ""}, {"type": "qa", "section": "Methods - De novo assemblies", "q": "How were the turtle and crocodile genomes assembled?", "a": "HMW DNA was extracted from liver. The turtle (male) got 100x Nanopore GridION reads assembled with Flye v2.8 and scaffolded with 10x linked reads (Scaff10X). The crocodile (female) got 17x PacBio HiFi reads assembled with wtdbg2.5. Both were polished with Racon using 100x Illumina PE150 reads and scaffolded with Hi-C (MboI) using Juicer, 3D-DNA and manual curation in Juicer_tools.", "kw": ["Flye", "wtdbg2", "3D-DNA"], "info": "The final assemblies have 33 (turtle) and 15 (crocodile) chromosomes, with contig N50 of 15 Mb and 25.9 Mb. Data are in BioProject PRJNA1219809.", "concl": ""}, {"type": "qa", "section": "Methods - Chromatin data collection and analysis", "q": "What chromatin data did they generate for emu, and how were they processed?", "a": "From female emus they generated in situ Hi-C (MboI; liver, ovary, brain), native ChIP-seq for H3K4me3 and H3K9me3 (ovary, brain), and lamin-B1 CUT&Tag (Abcam ab16048; ovary, brain). Reads were trimmed with Trimmomatic v0.33, mapped with bwa-mem at MAPQ 20 or higher, and converted to RPKM-normalized IP/input ratios at 10 kb with bamCompare.", "kw": ["CUT&Tag", "ChIP-seq", "bamCompare"], "info": "Human data: GPSeq from GSE135882, Hi-C and subcompartments for GM12878, IMR90 and K562 from GSE63525, ENCODE GM12878 histone marks lifted over to T2T, and lamin-B1 from GSM5669226.", "concl": ""}, {"type": "qa", "section": "Methods - Ancestral chromosome reconstruction", "q": "What was the alignment and phylogeny pipeline?", "a": "Genomes were repeat-masked with RepeatMasker 4.1.2 and Tandem Repeat Finder, then aligned to human and chicken with LastZ 1.04.00 (H=2000 Y=3400 L=6000 K=2200). Alignments were converted to chain/net with UCSC tools and merged with Multiz 10.0. The tree was built from fourfold degenerate sites with IQ-Tree 2.0-rc1 (-m MFP -bb 1000), and divergence times came from TimeTree.", "kw": ["LastZ", "Multiz", "IQ-Tree"], "info": "DESCHRAMBLER requires the reference to be a descendant of the ancestor being reconstructed. Unanchored scaffolds were removed.", "concl": ""}, {"type": "qa", "section": "Methods - Ancestral chromosome reconstruction", "q": "How were RACFs built and joined into ALGs?", "a": "DESCHRAMBLER identified syntenic fragments at 300 kb resolution and built RACFs from adjacency probabilities, using a graph of syntenic fragments. Two RACFs were manually joined into one ALG if they were connected in at least 1 outgroup plus 4/16 reptiles plus 5/20 mammals, or in 0 outgroups plus 8/16 reptiles plus 10/20 mammals.", "kw": ["RACF", "adjacency score"], "info": "This is stricter than Damas et al., who joined 76 RACFs into 20 mammalian ALGs. Here 71 RACFs gave 32 mammalian ALGs. Human- and chicken-based results were combined for the amniote ancestor to reduce reference bias. Coverage is slightly lower than before because T2T-type genomes contain more unalignable repeats and more distant species shorten HSBs.", "concl": "The stricter joining rule is the main reason the mammalian ALG count (32) is higher than in Damas et al. (20)."}, {"type": "qa", "section": "Methods - Characterizing chromosome rearrangements", "q": "How were rearrangements and their rates inferred?", "a": "HSB order and orientation were compared between AALGs, internal nodes and extant species with GRIMM plus manual curation. A rearrangement shared by two related species with more than 80% overlap was placed in their common ancestor, iterating back to the amniote root, and counts were divided by TimeTree divergence times.", "kw": ["GRIMM", "rearrangement rate"], "info": "A fusion was called when more than 50% of two or more AALGs sat on one extant chromosome. Any other AALGs on that chromosome were counted as translocations or fissions. Inversion counts were scaled by reconstructed AALG size. For EBRs, HSBs within 50 kb were merged and the largest 5% of EBRs (complex regions such as pericentromeres) were excluded.", "concl": ""}, {"type": "qa", "section": "Methods - 3D chromatin interaction analysis", "q": "How was the Hi-C analysed?", "a": "Reads were trimmed with Trimmomatic v0.32, mapped with Bowtie2 keeping unique reads (MAPQ 20 or higher), and processed with HiC-Pro v2.10.0 with ICE normalization at 25 kb to 1 Mb. Trans-interaction was measured as observed/expected between chromosome pairs. Compartments were called with HiTC pca.hic using gene density as correction, and TADs with HiCExplorer hicCallTADs (FDR correction, delta 0.05, threshold 0.01).", "kw": ["HiC-Pro", "HiCExplorer", "O/E"], "info": "Repeat aggregation used 5 Mb flanks around repeat pairs from different AALGs. High trans-interaction bins were those in the top 5%. Highly interacting AluSx copies were those with more than 40 trans reads. Trimmomatic is given as v0.32 here but v0.33 in the emu section.", "concl": ""}, {"type": "note", "section": "Results - Lineage-specific repeats tune nuclear architecture", "text": "Do AluSx/B1 homotypic interactions actually cause the relocation of nearby genes to speckles, or do they just mark it? The authors propose excising the interacting copies and their SIRLOIN motifs."}, {"type": "note", "section": "Discussion", "text": "Does micro- vs. macro-ALG origin also predict nuclear position in teleosts (zebrafish, Astyanax), whose karyotypes went through an extra genome duplication? The paper only covers amniotes plus amphioxus, skate and lungfish."}, {"type": "note", "section": "Methods - Chromatin data collection and analysis", "text": "Check the inconsistencies: emu lamin-B1 is called ChIP-seq in the Abstract and Results but CUT&Tag in Methods; 36 vs. 37 genomes; the dating of microchromosome origin (jawed vertebrate vs. bony vertebrate 450-460 MYA vs. over 500 MYA)."}], "key": "general/Liu_2025_NatCommun_amniote_chromosome_evolution", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Dhandapany_2014", "title": "RAF1 mutations in childhood-onset dilated cardiomyopathy", "category": "Human genetics", "link": "https://doi.org/10.1038/ng.2963", "note": "", "source_pdf": "papers/general/Dhandapany_2014_NatGenet_RAF1_dilated_cardiomyopathy.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is dilated cardiomyopathy (DCM) genetically?", "a": "A highly heterogeneous trait in which sarcomeric gene mutations predominate, but the cause of a significant percentage of cases remains unknown and no gene-specific therapy exists.", "kw": ["DCM", "sarcomeric genes"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What was the study design in one sentence?", "a": "Resequencing in 513 DCM cases and 1,150 matched controls from several ethnically distinct cohorts, which uncovered rare functional RAF1 mutations in three cohorts (South India, North India, Japan).", "kw": ["RAF1", "resequencing"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "How common were RAF1 mutations in childhood-onset DCM?", "a": "About 9% of childhood-onset DCM cases in those three cohorts carried a RAF1 mutation.", "kw": ["RAF1"], "info": "", "concl": "RAF1 is the first gene strongly associated with isolated DCM that predominantly causes pediatric-onset disease."}, {"type": "qa", "section": "Abstract", "q": "What was the signalling signature of DCM-associated RAF1 mutants?", "a": "Altered kinase activity with largely unaltered ERK activation but AKT hyperactivation that was BRAF-dependent.", "kw": ["AKT", "ERK", "BRAF"], "info": "", "concl": "DCM-associated RAF1 alleles act through AKT, not ERK."}, {"type": "qa", "section": "Abstract", "q": "What did the zebrafish experiment show?", "a": "Constitutive expression of the DCM mutants in zebrafish embryos caused a heart failure phenotype with AKT hyperactivation, and the phenotype was rescued by rapamycin.", "kw": ["zebrafish", "rapamycin"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How is DCM defined clinically and how frequent is it?", "a": "DCM is left ventricular dilation with systolic dysfunction and affects approximately 1 in 250 people.", "kw": ["DCM"], "info": "Mutations in 40 different genes are known, many encoding sarcomeric and other structural proteins.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What fraction of DCM is genetically unexplained?", "a": "Roughly 50-60% of DCM cases have unknown underlying genetic causes.", "kw": [], "info": "This is the gap the paper addresses.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What overlap exists between DCM and HCM genes?", "a": "Many known DCM genes are also implicated in hypertrophic cardiomyopathy, including titin, cardiac actin, beta-myosin heavy chain, cardiac troponin T and alpha-tropomyosin.", "kw": ["HCM", "titin"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are RASopathies?", "a": "Several overlapping developmental syndromes caused by germ-line mutations in genes encoding RAS-MAPK pathway members, with a high prevalence of hypertrophic cardiomyopathy.", "kw": ["RASopathies", "RAS-MAPK"], "info": "RASopathy genes do not appear to play a significant causal role in non-syndromic HCM.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was already known about MAPK signalling and DCM?", "a": "Mouse genetic models showed that loss of SHP-2 or RAF1, or increased p38 activation, can induce DCM, but inherited RAS-MAPK abnormalities had never been implicated in human DCM.", "kw": ["SHP-2", "p38"], "info": "", "concl": "This paper tests whether RAS-MAPK genes contribute to non-syndromic human DCM."}, {"type": "qa", "section": "Results - discovery cohort (Group 1)", "q": "What was screened in the South Indian discovery cohort?", "a": "DNAs from 218 individuals with isolated DCM (Group 1) were screened for mutations in nine RAS-MAPK genes: PTPN11, HRAS, KRAS, RAF1, BRAF, SOS1, MEK1, MEK2 and SHOC2.", "kw": ["Group 1", "RAS-MAPK"], "info": "No changes were found in the other eight genes, only in RAF1.", "concl": ""}, {"type": "qa", "section": "Results - discovery cohort (Group 1)", "q": "Which RAF1 variants were found in South India?", "a": "Five novel missense variants: p.Pro332Ala, p.Leu603Pro (twice), p.His626Arg and p.Thr641Met.", "kw": ["RAF1"], "info": "Each altered residue is evolutionarily conserved among vertebrate RAF1 orthologs and was absent from 500 ethnically matched normal South Indians.", "concl": ""}, {"type": "qa", "section": "Results - discovery cohort (Group 1)", "q": "What did sequencing of additional South Indian controls show?", "a": "All RAF1 coding exons were sequenced in 420 South Indians (100 controls, 190 solid cancers, 100 coronary artery disease, 30 atrial septal defects) and only two synonymous alleles were found, T543T (n=1) and T638T (n=9).", "kw": ["synonymous variants"], "info": "Missense RAF1 mutation frequency was higher in the South Indian DCM cohort than controls (5/436 vs 0/840, p=0.0046).", "concl": ""}, {"type": "qa", "section": "Results - discovery cohort (Group 1)", "q": "Were the carriers excluded for other cardiomyopathy genes?", "a": "Yes. RAF1-positive individuals screened negative for mutations in 12 known cardiomyopathy genes: MYH7, MYH6, MYBPC3, TNNT2, TPM1, MYL3, MYL2, TNNI3, PRKAG2, LMNA, PLN and TTN.", "kw": ["MYBPC3", "TTN"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - discovery cohort (Group 1)", "q": "What did in silico prediction add?", "a": "DCM cases had significantly more variants predicted to alter RAF1 function than matched controls: PolyPhen-2 probably damaging 4/436 vs 0/840 (p=0.0135) and pMUT pathological 5/436 vs 0/840 (p=0.0046).", "kw": ["PolyPhen-2", "pMUT"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - discovery cohort (Group 1)", "q": "What did family analysis of three South Indian probands show?", "a": "The p.Pro332Ala allele was absent in both parents (paternity confirmed), consistent with a de novo change; in the two other families the relevant RAF1 variant was found in another symptomatic relative.", "kw": ["de novo"], "info": "Family members were assessed by ECG and echocardiography; families of the other 510 index cases were not assessed.", "concl": ""}, {"type": "qa", "section": "Results - replication cohorts (Groups 2-4)", "q": "What was found in the North Indian cohort (Group 2)?", "a": "In 200 North Indian DCM probands, two RAF1 variants were found: a single base-pair deletion causing truncation (p.R254fs) and a missense p.Thr641Met; neither was present in 350 matched North Indian controls.", "kw": ["p.R254fs"], "info": "North Indians are genetically distinct from South Indians.", "concl": ""}, {"type": "qa", "section": "Results - replication cohorts (Groups 2-4)", "q": "What was found in the Japanese cohort (Group 3)?", "a": "Two novel missense mutations, p.Ala237Thr and p.Thr310Ala, in 35 Japanese DCM probands; neither was detected among 300 Japanese controls.", "kw": [], "info": "Both were predicted to be tolerated in silico but had functional consequences in vitro, showing prediction tools can miss functional alleles.", "concl": ""}, {"type": "qa", "section": "Results - replication cohorts (Groups 2-4)", "q": "How did the mutation burden compare with public databases?", "a": "RAF1 missense or damaging mutations were more frequent in DCM than in ESP cohorts (9/1026 vs 29/13006, p=0.0004).", "kw": ["ESP"], "info": "Odds ratios: all DCM vs unmatched ESP OR=3.96 (95% CI 1.87-8.39); South Indian DCM vs matched controls OR=21.42 (95% CI 1.18-388.41). Variants were also absent from dbSNP and 1000 Genomes.", "concl": "RAF1 variants are strongly associated with non-syndromic DCM."}, {"type": "qa", "section": "Results - replication cohorts (Groups 2-4)", "q": "What was Group 4 and what did it contribute?", "a": "Group 4 was 60 Italian DCM patients diagnosed after age 18 who were negative for nine known DCM genes; no disease-associated RAF1 mutation was found in them.", "kw": ["Group 4"], "info": "Supports the childhood-onset specificity of RAF1 DCM.", "concl": ""}, {"type": "qa", "section": "Results - clinical features", "q": "What is the age profile of RAF1-associated DCM?", "a": "Of ten subjects with a RAF1 mutation and known age of onset, eight presented in childhood or adolescence, with an average age at presentation of 12.6 years versus about 20 years for sarcomeric DCM.", "kw": ["pediatric onset"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - clinical features", "q": "What is the key enrichment statistic for childhood onset?", "a": "RAF1 mutations occurred in 7 of 63 Indian childhood-onset cases (11%) versus 0 of 355 adult-onset cases (p<0.0001); adding one of 25 Japanese childhood cases gives 8 of 88 (9%) childhood-onset DCM with RAF1 mutations (p<0.0001).", "kw": [], "info": "All five South Indian RAF1 carriers were among the 33 childhood-onset cases, and both North Indian carriers among their 30 childhood-onset cases.", "concl": "RAF1 is the first gene strongly associated with isolated DCM that is predominantly pediatric-onset."}, {"type": "qa", "section": "Results - clinical features", "q": "How severe was disease in the mutation-positive subjects (Table 1)?", "a": "All ten were NYHA class III or IV, LVEF ranged from 12% to 31%, LVIDd from 52 to 85 mm, and all had mitral regurgitation (mild to severe); one subject (P6) was deceased.", "kw": ["LVEF", "NYHA"], "info": "Ages of onset ranged from 1 to 40 years.", "concl": ""}, {"type": "qa", "section": "Results - clinical features", "q": "Did carriers have RASopathy features?", "a": "No. None of the RAF1 mutation-positive subjects had facial dysmorphism, short stature, webbed neck, chest deformity or mental retardation, so the DCM was isolated/non-syndromic.", "kw": ["RASopathy"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - kinase activity and ERK", "q": "How did DCM-associated RAF1 mutants behave in kinase assays?", "a": "Five DCM mutants (p.Ala237Thr, p.Thr310Ala, p.Pro332Ala, p.His626Arg, p.Thr641Met) expressed in HEK293 cells had mildly increased kinase activity compared to wild type, but much less than the HCM-associated mutants p.Leu613Val and p.Ser257Leu.", "kw": ["HEK293", "kinase assay"], "info": "Kinase activity was measured as p-MEK/RAF1 after immunoprecipitation and a linked assay with inactive MEK1.", "concl": ""}, {"type": "qa", "section": "Results - kinase activity and ERK", "q": "Which DCM alleles were loss-of-function?", "a": "p.Leu603Pro showed impaired kinase activity and reduced ERK activation, as did the truncated p.R254fs protein.", "kw": ["p.Leu603Pro"], "info": "Leu603 sits in the kinase domain, so substitution by proline could plausibly render RAF1 non-functional.", "concl": "DCM RAF1 alleles can be either mildly activating or kinase-impaired."}, {"type": "qa", "section": "Results - kinase activity and ERK", "q": "What happened to ERK activation with DCM mutants?", "a": "ERK activation by DCM RAF1 mutants was similar to wild type and significantly less than with HCM mutants.", "kw": ["ERK"], "info": "", "concl": "DCM-associated mutants are biochemically distinct from RASopathy HCM mutants."}, {"type": "qa", "section": "Results - AKT/mTOR signalling", "q": "What pathway is activated by DCM-associated RAF1 mutants?", "a": "Overexpression in HEK293 cells caused excessive activation of AKT and of tuberin (TSC2), a downstream AKT/mTOR target, after EGF or IGF-1 stimulation, compared to wild type.", "kw": ["AKT/mTOR", "tuberin"], "info": "HCM-related mutants p.Leu613Val, p.Val263Ala and p.Ser257Leu did not excessively activate AKT or tuberin.", "concl": ""}, {"type": "qa", "section": "Results - BRAF dependence", "q": "How was BRAF dependence tested?", "a": "Two representative DCM mutants, p.Pro332Ala (kinase active) and p.Leu603Pro (kinase impaired), were transiently expressed in Raf1-/- and Braf-/- mouse embryonic fibroblasts and stimulated with EGF.", "kw": ["MEFs", "BRAF"], "info": "Erk activation by the DCM mutants was similar to wild type in both MEF types.", "concl": ""}, {"type": "qa", "section": "Results - BRAF dependence", "q": "What was the result of the MEF experiment?", "a": "Akt hyperactivation persisted in Raf1-/- MEFs but was markedly reduced in Braf-/- MEFs.", "kw": ["Akt", "Braf"], "info": "", "concl": "DCM-associated RAF1 mutants induce AKT hyperactivation in a BRAF-dependent way, possibly via heterodimerization."}, {"type": "qa", "section": "Results - zebrafish model", "q": "How was the zebrafish model made?", "a": "Human wild-type RAF1 and the two representative DCM mutants (p.Pro332Ala, p.Leu603Pro) were expressed by mRNA injection into one-cell-stage zebrafish embryos and hearts were examined 3 days later.", "kw": ["zebrafish", "mRNA injection"], "info": "Embryos expressing wild-type RAF1 had cardiac status indistinguishable from uninjected embryos.", "concl": ""}, {"type": "qa", "section": "Results - zebrafish model", "q": "What cardiac phenotype did the mutants produce in zebrafish?", "a": "Both mutants caused heart defects mimicking heart failure: elongated (string-like) ventricular and atrial chambers, profound pericardial edema, blood congestion at the cardiac inflow tract and impaired contractions, with severe bradycardia at 72 hpf.", "kw": ["pericardial edema", "bradycardia"], "info": "Heart rate measured in 30 embryos per group; phenotype percentage scored in n=150 embryos per group.", "concl": ""}, {"type": "qa", "section": "Results - zebrafish model", "q": "What did immunoblotting of zebrafish hearts show?", "a": "Hearts expressing the DCM-associated RAF1 proteins had Erk activation similar to uninjected or wild-type hearts but significantly hyperactivated Akt.", "kw": ["Akt", "Erk"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - zebrafish model", "q": "What was the effect of rapamycin?", "a": "Rapamycin (an AKT/mTOR inhibitor) partially rescued the heart defects in embryos expressing the DCM RAF1 mutants and normalized AKT activation.", "kw": ["rapamycin", "mTOR"], "info": "", "concl": "The cardiac failure caused by DCM-associated mutant RAF1 is mediated by increased AKT signalling and is pharmacologically reversible in the fish model."}, {"type": "qa", "section": "Discussion", "q": "How do HCM- and DCM-associated RAF1 mutations differ in position?", "a": "They are mutually exclusive: HCM mutations cluster in two hot spots at Ser259 and Ser612, whereas DCM mutations are more widely distributed and do not alter residues critical for RAF1 regulation, with Ser642 as an exception.", "kw": ["hot spots"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What is the overall contrast between the two allelic cardiomyopathies?", "a": "DCM mutants show modestly increased or impaired kinase activity, hyperactivate AKT but not ERK and respond to an AKT/mTOR inhibitor; HCM mutants show greatly enhanced kinase activity and robust ERK activation and are rescued by a MEK inhibitor in mouse models.", "kw": ["allelic"], "info": "The MEK-inhibitor rescue refers to a mouse model of RASopathy-associated Raf1 p.Leu613Val.", "concl": "The RAF1 cardiomyopathies are allelic but biologically distinct."}, {"type": "qa", "section": "Discussion", "q": "What parallel is drawn with PTPN11 and NSML?", "a": "Loss-of-function PTPN11 alleles in Noonan syndrome with multiple lentigines (formerly LEOPARD syndrome) cause HCM via Akt but not Erk1/2 hyperactivation in a knock-in mouse, with HCM transforming to DCM at older ages, and an mTOR inhibitor prevented or rescued that HCM.", "kw": ["PTPN11", "NSML"], "info": "This motivates a clinical trial of a rapamycin analog in LEOPARD syndrome with HCM.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What do the authors say is still needed before therapy?", "a": "Pre-clinical studies, most likely with a mouse model carrying a DCM-associated RAF1 mutation, must first recapitulate the cardiac disease and drug efficacy before a similar therapeutic route can be envisioned.", "kw": [], "info": "Acknowledged limitation: the rescue evidence so far comes only from transient mRNA overexpression in zebrafish.", "concl": ""}, {"type": "qa", "section": "Methods - clinical evaluations", "q": "Where did the 513 DCM patients come from?", "a": "Hospitals in South India (Madurai, Trivandrum, Kozhikode; Group 1), North India (Chandigarh, Mumbai; Group 2), Tokyo, Japan (Group 3) and Naples, Italy (Group 4), all recruited with informed written consent and IRB approval.", "kw": [], "info": "Plus 320 registered South Indian cases with other diseases (190 solid cancers, 100 coronary artery disease, 30 atrial septal defects) as additional controls.", "concl": ""}, {"type": "qa", "section": "Methods - diagnostic criteria", "q": "What echocardiographic criteria defined DCM?", "a": "Depressed LV systolic function (LVEF <0.45 and/or fractional shortening <0.25) plus a dilated LV (LV end-diastolic dimension >117% of the predicted value corrected for age and body surface area), with other cardiac or systemic causes excluded.", "kw": ["LVEF", "fractional shortening"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - cohort details", "q": "How were cases and controls matched?", "a": "By geographical region, self-reported ethnicity, sex and age in Groups 1-3; for example Group 1 was 67% vs 64% male and 40.02 +/- 22 vs 45 +/- 17.2 years.", "kw": ["matching"], "info": "Mean LVEF at enrollment was 29 +/- 11% (Group 1), 32 +/- 10% (Group 2) and 25 +/- 14% (Group 3). Population stratification had been assessed earlier with 50 ancestry-informative markers (AIMs).", "concl": ""}, {"type": "qa", "section": "Methods - sequencing", "q": "How was sequencing performed?", "a": "Genomic DNA from peripheral blood lymphocytes; exons and flanking intronic boundaries were PCR-amplified, gel-isolated with a QiaxII kit, sequenced with BigDye terminator chemistry on an ABI3730 DNA analyzer.", "kw": ["Sanger sequencing", "ABI3730"], "info": "This is targeted Sanger resequencing, not exome or genome sequencing.", "concl": ""}, {"type": "qa", "section": "Methods - cloning and cell assays", "q": "What constructs and cells were used for the biochemistry?", "a": "RAF1 mutations were introduced into a Flag-tagged human RAF1 construct by QuikChange site-directed mutagenesis and transfected with Lipofectamine into HEK293 cells or Raf1-/- and Braf-/- MEFs.", "kw": ["Flag-tag", "QuikChange"], "info": "Cells were serum-starved 16 h at 48 h post-transfection, stimulated with EGF 10 ng/ml, lysed in RIPA buffer, and ~30 ug protein per lane was immunoblotted on PVDF.", "concl": ""}, {"type": "qa", "section": "Methods - cloning and cell assays", "q": "How was RAF1 kinase activity measured?", "a": "Flag-tagged RAF1 was immunoprecipitated from 800 ug-1 mg of HEK293 lysate with anti-Flag and protein G-Sepharose, then incubated with inactive MEK1 at 30 degrees C for 1 h; phospho-MEK on blot was the readout.", "kw": ["immunoprecipitation", "p-MEK"], "info": "RAF1 kinase assay kit (Upstate 17-357); anti-p-MEK and anti-Flag used at 1:2,000.", "concl": ""}, {"type": "qa", "section": "Methods - in silico analysis", "q": "Which prediction and alignment tools were used?", "a": "Pathogenicity was predicted with PolyPhen2, SIFT and PMut; cross-species amino acid conservation was assessed by aligning vertebrate RAF1 protein sequences with ClustalW2.", "kw": ["PolyPhen2", "SIFT", "ClustalW2"], "info": "Species in the alignment included human, chimpanzee, macaque, dog, rat, mouse, cow, zebrafish and horse.", "concl": ""}, {"type": "qa", "section": "Methods - zebrafish", "q": "What are the zebrafish husbandry and injection details?", "a": "Wild-type TAB14, AB and TAB5 adults kept at 28 degrees C on a 14:10 light:dark cycle; embryos were injected with 4 nl using a Narishige IM-300 microinjector, 75 ng of mRNA per embryo at the one- to four-cell stage.", "kw": ["Danio rerio", "mMessage mMachine"], "info": "75 ng was identified by titration as the maximal tolerable and minimal effective dose. mRNA encoded Myc-tagged human RAF1 (six N-terminal Myc copies) made with mMessage mMachine. Tg(cmlc2:EGFP) fish expressing GFP in cardiomyocytes were generated with the Tol2 kit.", "concl": ""}, {"type": "qa", "section": "Methods - zebrafish", "q": "Was the animal work blinded?", "a": "No. The paper states explicitly that subsequent experiments were neither randomized nor blinded.", "kw": [], "info": "A limitation to keep in mind for the phenotype scoring.", "concl": ""}, {"type": "qa", "section": "Methods - statistics", "q": "How were the functional data analysed statistically?", "a": "Data are mean +/- standard error of the mean, compared between experimental groups by Student's t test, with p <= 0.05 considered significant.", "kw": ["Student's t test"], "info": "Figure legends instead report mean +/- SD of two to four independent experiments, so the paper is inconsistent about SEM vs SD.", "concl": ""}, {"type": "note", "section": "Results - BRAF dependence", "text": "BRAF dependence is inferred from Braf-/- MEFs and proposed to work through RAF1-BRAF heterodimerization, but heterodimerization itself was never directly measured here - worth checking the Wu et al. 2012 reference for the HCM-mutant evidence."}, {"type": "note", "section": "Results - zebrafish model", "text": "The zebrafish readout is transient overexpression of human RAF1 mRNA at 75 ng per embryo, not an endogenous knock-in, so dosage effects could contribute to the heart failure phenotype; a knock-in model is what the authors themselves say is needed next."}, {"type": "note", "section": "Discussion", "text": "Open question: how can both a mildly kinase-activating allele (p.Pro332Ala) and a kinase-dead allele (p.Leu603Pro, p.R254fs) converge on the same BRAF-dependent AKT hyperactivation and the same cardiac phenotype?"}], "key": "general/Dhandapany_2014_NatGenet_RAF1_dilated_cardiomyopathy", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Clark_2026", "title": "Establishing the ELIXIR Domestic Animals Genome and Phenome Community", "category": "Genomic resources & assembly", "link": "https://doi.org/10.12688/f1000research.177500.1", "note": "", "source_pdf": "papers/general/Clark_2026_F1000Res_ELIXIR_domestic_animals.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is the ELIXIR DAGP Community?", "a": "The ELIXIR Domestic Animals Genome and Phenome (DAGP) Community supports genome-to-phenome analyses for farmed and companion animal species. It aims to coordinate, discuss and explore data technology solutions for animal welfare, behaviour, health, infectious diseases, metabolism, nutritional efficiency, and the preservation of genetic diversity and the environment.", "kw": ["DAGP", "ELIXIR", "genome-to-phenome"], "info": "The paper frames animal well-being as part of sustainable agroecosystems, companionship and the One Health approach, which links the health of people, animals and the environment.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What kind of paper is this?", "a": "It is an opinion article (white paper) written by the ELIXIR DAGP Focus Group. It summarises the current data infrastructure, resources and tools for domestic animal genomics and phenomics, and sets out community-led plans and priorities.", "kw": ["white paper"], "info": "It has no data of its own (the data availability statement says there is no data associated with the manuscript). Version 1 had one peer review, which approved it.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What are the three key priority areas named in the abstract?", "a": "i) Expanding the FAANG Data Portal to hold phenotype data, together with ELIXIR Data Platforms. ii) Supporting submissions of new data types across ELIXIR Core Data Resources, including proprietary data from industry partners. iii) Strengthening connections to existing ELIXIR Communities and international consortia.", "kw": ["FAANG Data Portal", "ELIXIR Core Data Resources"], "info": "", "concl": "The community's main focus is linking omics data with phenotype data, including industry data, in shared ELIXIR infrastructure."}, {"type": "qa", "section": "Abstract", "q": "Which research fields is the community meant to strengthen?", "a": "Genome-enabled breeding, population genomics, pangenome analysis, functional genomics, genome editing, paleogenomics, phenotyping and bio-banking.", "kw": ["pangenome", "paleogenomics", "bio-banking"], "info": "This will be done through data standards, coordination, workflows and visualisation. The standards will follow the FAIR principles and use established ontologies.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How does the paper define domestic animals?", "a": "Animals that have been bred and adapted to meet human needs, for example as sources of food, workforce, transportation, leisure and companionship, and as parts of many human cultures.", "kw": ["domestic animals"], "info": "They also contribute to agroecosystems: they shape rural landscapes, improve soil fertility through manure and maintain biodiversity on marginal and grazing lands.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What challenges do domestic animals face, according to the paper?", "a": "Seven: sustainable production in a changing climate, emerging diseases and the need for genomic resilience, robustness, welfare problems caused by breeding and management, maintaining genetic diversity, meeting societal expectations, and implementing the 3Rs in research.", "kw": ["resilience", "robustness", "welfare"], "info": "On climate, the stated challenge is to produce the same amount of food from fewer, highly productive animals that need less input. Climate change also raises the risk of contagious and vector-borne diseases (some zoonotic), and increasing antimicrobial resistance adds to this.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is genetic diversity a concern in domestic animals?", "a": "Several companion animal breeds have high inbreeding and founder effects, which make genetic diseases more common and lead to more morbidity or early death. The same has been seen in some highly selected livestock breeds, including Holstein-Friesian dairy cattle.", "kw": ["inbreeding", "founder effect"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are the 3Rs?", "a": "Replacement, Reduction and Refinement: the principle for the use of live animals in research. Adopting it requires advanced in silico, in vitro and in vivo methods, which involve complex technology and protocol development.", "kw": ["3Rs"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What opportunities does the paper list for addressing these challenges?", "a": "FAIR data infrastructure such as the FAANG Data Portal; breeding for feed efficiency and smaller rumen size; using microbiome profiling in breeding; conserving locally adapted breeds; genetic screening in species that do not yet use it; paleogenomics; cellular technologies linking in vitro and in vivo; genome-wide CRISPR screens in vitro; and sensor-based, high-throughput phenotyping.", "kw": ["CRISPR screens", "microbiome", "high-throughput phenotyping"], "info": "Breeding for smaller rumen size in ruminants is aimed at lowering input use and greenhouse gas emissions. CRISPR screens are meant to find genome-editing targets for disease resistance and welfare traits.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How does the paper spell out FAIR?", "a": "Findable, Accessible, Interoperable, Reproducible.", "kw": ["FAIR"], "info": "This is the paper's own wording. The R is given as Reproducible.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What gap does the paper want to address?", "a": "Genome sequencing and functional annotation have improved, but much remains to be done to link genome information to real-world outcomes such as trait improvement. A holistic approach has been hard because data, tools and resources are shared poorly across fields.", "kw": ["genotype-to-phenotype"], "info": "The authors call for new collaborations across genetics, biochemistry, microbiology, physiology, nutrition, immunology and data science (quantitative biology, statistics, computer science, mathematics).", "concl": "The field needs to shift from descriptive to predictive work, which is a primary goal of data science."}, {"type": "qa", "section": "Introduction", "q": "What is ELIXIR?", "a": "A European life sciences infrastructure that supports the management of public research data and coordinates access to life science resources. Its goal is to maximise the impact of research on public health, the environment and the economy.", "kw": ["ELIXIR"], "info": "", "concl": ""}, {"type": "qa", "section": "DAGP community - organisational opportunities and role of ELIXIR", "q": "How was domestic animal research organised before EuroFAANG?", "a": "It was highly divided, mostly by specialisation on a single species. From 2018, six H2020 projects came together under the EuroFAANG umbrella. They were the first to connect species-specific projects, with the shared aim of providing genomic resources for precision breeding.", "kw": ["EuroFAANG"], "info": "", "concl": ""}, {"type": "qa", "section": "DAGP community - organisational opportunities and role of ELIXIR", "q": "Which EuroFAANG projects covered which species?", "a": "GENE-SWitCH and GEroNIMO covered pig and chicken, BovReg and Rumigen covered cattle, AQUA-FAANG covered six teleost fish species, and HoloRuminant covered the ruminant microbiome.", "kw": ["AQUA-FAANG", "GENE-SWitCH", "BovReg"], "info": "Together they produced very large omics datasets. The paper does not name the six teleost species.", "concl": ""}, {"type": "qa", "section": "DAGP community - organisational opportunities and role of ELIXIR", "q": "What infrastructure grew out of the EuroFAANG projects?", "a": "The nf-core special interest group in animal genomics and the Horizon Europe INFRA-DEV EuroFAANG Research Infrastructure concept development project. That project led to GenoPHEnix, a proposal to the 2026 update of the ESFRI Road Map.", "kw": ["nf-core", "GenoPHEnix", "ESFRI"], "info": "GenoPHEnix merges the EuroFAANG concepts with existing H2020 INFRAIA phenotyping infrastructures: PigWeb, SmartCow and AquaExcel 3.0. Figure 1 shows the INFRA-DEV project starting in January 2023.", "concl": ""}, {"type": "qa", "section": "DAGP community - organisational opportunities and role of ELIXIR", "q": "What are the three main aims of the FAANG initiative?", "a": "1. Standardise core assays and experimental protocols. 2. Coordinate and facilitate data sharing through its Data Portal. 3. Establish suitable infrastructure for data analysis.", "kw": ["FAANG"], "info": "FAANG (Functional Annotation of Animal Genomes) is a global initiative that studies genome function to decipher the genotype-to-phenotype link in farmed animals (Table 1).", "concl": ""}, {"type": "qa", "section": "DAGP community - organisational opportunities and role of ELIXIR", "q": "Which other projects with ELIXIR Node involvement does Table 1 list?", "a": "Examples: SalmoCode (single-cell RNA-seq map of organs and cells in developing salmon), SalmoStrong (salmon robustness), the DoGA Consortium Expression Atlas (promoter and gene expression atlas for the dog), the EB2 Engineering Biology Hub (genome-wide CRISPR screens) and Ensembl in a new era (pangenomes and breed-specific assemblies).", "kw": ["SalmoCode", "DoGA", "Ensembl"], "info": "SalmoStrong's long-term goal is to cut mortality during seawater production by 50% over the next ten years. Other entries: MuDiS4LS (holobiont data), BReIF (FAIR biobanks, pangenome pipelines), NFDI (Germany), and the COST Actions EU-LI-PHE (CA22112) and Insect-IMP (CA22140).", "concl": ""}, {"type": "qa", "section": "DAGP community - organisational opportunities and role of ELIXIR", "q": "Which activities are planned as the Focus Group becomes a Community?", "a": "(1) Cataloguing ELIXIR Services that support domestic animal genomics and phenomics. (2) Developing recommendations for connecting genomics and phenomics infrastructures through ELIXIR. (3) Coordinating ELIXIR Node participation in Horizon Europe proposals such as GenoPHEnix, Cluster 6 calls and COST Actions.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "DAGP community - connections with ELIXIR platforms and communities", "q": "When was the DAGP Focus Group set up, and which communities does it already work closely with?", "a": "It was set up in 2024. Its synergies are well established with the Biodiversity, Plant Sciences, Single-cell Omics and Federated Human Data communities.", "kw": ["Focus Group"], "info": "Table 2 also lists links with the Data, Interoperability, Tools and Training platforms, and with the Food and Nutrition, Galaxy, Human CNV, Metabolomics, Microbiome, Research Data Management and Systems Biology communities.", "concl": ""}, {"type": "qa", "section": "DAGP community - connections with ELIXIR platforms and communities", "q": "How do they plan to improve phenotyping metadata standards?", "a": "Recording standards for phenotyping studies in domestic animals, such as longitudinal observational studies, are minimal. They are aligning with the Plant Science Community's ISA standardisation for minimal information and adapting the Biodiversity community's ABCD (Access to Biological Collection Data) standard to domestic animals.", "kw": ["ISA", "ABCD", "MIAPPE"], "info": "Table 2 proposes developing an animal equivalent of the plant community's MIAPPE minimal information standard, partly through a shared biohackathon.", "concl": ""}, {"type": "qa", "section": "DAGP community - connections with ELIXIR platforms and communities", "q": "What is the problem with single-cell data submission?", "a": "The community cannot yet submit directly to the Single Cell Expression Atlas (scEA), and metadata gaps limit interoperability with other ELIXIR resources. The proposed fix is to align metadata standards between Annotare and the FAANG Data Portal before archiving.", "kw": ["scRNA-seq", "Single Cell Expression Atlas", "Annotare"], "info": "The aim is to find concrete opportunities for harmonisation between FAANG and scEA. A single-cell ingestion case study is planned with the Interoperability platform. The text writes 'DAGF Community' here, which looks like a typo for DAGP.", "concl": ""}, {"type": "qa", "section": "DAGP community - connections with ELIXIR platforms and communities", "q": "Why are they exploring data encryption?", "a": "Industry is reluctant to share genotype and phenotype data because of intellectual property and privacy concerns. This limits data reuse and joint analysis and slows food-security-relevant genomics. They are evaluating encryption as a solution for secure G2P data sharing, building on frameworks from the Federated Human Data community.", "kw": ["data encryption", "proprietary data", "Federated Human Data"], "info": "Table 2 lists a homomorphic data encryption case study and expanding the FAANG Data Portal to hold encrypted data. No technical details or results are given.", "concl": ""}, {"type": "qa", "section": "DAGP community - connections with ELIXIR platforms and communities", "q": "Which genomics links are planned with the Human CNV, Microbiome and Metabolomics communities?", "a": "Human CNV: pangenome methods and workflows, and interaction with EVA for structural variants and their functional consequences (for example with Ensembl VEP). Microbiome: MGnify and cataloguing ruminant MAGs for greenhouse gas research, plus antimicrobial resistance (AMR). Metabolomics: metadata standards and sharing animal data via MetaboLights.", "kw": ["structural variants", "MGnify", "MAGs"], "info": "From Table 2.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - overview", "q": "Which ELIXIR priority area will DAGP contribute to, and what are its objectives?", "a": "The Biodiversity, Food Security and Pathogens (BFSP) priority area. Its five broad objectives are Federation, FAIR Data, Analysis, Standards and Training.", "kw": ["BFSP"], "info": "", "concl": ""}, {"type": "qa", "section": "BFSP contribution - FAIR data and the FAANG Data Portal", "q": "What does the FAANG Data Portal currently do?", "a": "It automatically collects all FAANG data submitted to ELIXIR core resources into one searchable resource and allows direct download from repositories such as ENA and BioSamples. It offers predefined filters, predictive search, a catalogue of sampling and analysis protocols, and automatic linking of publications.", "kw": ["FAANG Data Portal", "ENA", "BioSamples"], "info": "It also validates metadata in context and brokers submissions to the underlying ELIXIR repositories. Options have been explored to add emerging species (including insects) and encrypted proprietary genotype and phenotype data.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - FAIR data and the FAANG Data Portal", "q": "What is the key strategic aim for expanding the FAANG Data Portal?", "a": "To include observational data such as phenotypic measurements and image data, bringing BioStudies and the BioImage Archive into the portal. This would mean fewer submissions to scattered repositories and one standardised submission system for all animal agriculture data.", "kw": ["phenotype data", "BioImage Archive", "BioStudies"], "info": "This needs new metadata standards for animal phenotypes in BioSamples, building on the FAANG standards, the Vertebrate Breed Ontology and the ELIXIR Plant Science standards. They also want to capture key information during data production to make pre-archive curation easier.", "concl": "The goal is a unified, searchable view that combines omics data with phenotypic and image data."}, {"type": "qa", "section": "BFSP contribution - analysis tools and pipelines", "q": "Why is ENCODE used as a model for FAANG?", "a": "One of ENCODE's main achievements is producing huge amounts of data that are fully comparable across sites and assays for human and mouse. Integration across datasets, experiments and species is crucial, so the initial FAANG white paper presented ENCODE and similar distributed projects as models.", "kw": ["ENCODE"], "info": "The challenge is that many sequencing technologies, acquisition methods and interpretation algorithms now coexist.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - analysis tools and pipelines", "q": "Why should domestic animal genomic data stay interoperable with wider animal genomics efforts such as the Earth BioGenome Project?", "a": "To identify evolutionary constraints, to understand how traits arose in wild species and were then harnessed through domestication (especially with paleogenomic time transects), and to use closely related wild species to study disease resistance and manage genetic diversity.", "kw": ["Earth BioGenome Project", "domestication", "interoperability"], "info": "Example: the DoGA Atlas provides an expression atlas of promoters and genes for 100 tissues from domestic dog breeds and wolves, which enables high-resolution disease mapping.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - analysis tools and pipelines", "q": "How is FAIR software being adopted in animal genomics?", "a": "The Darwin Tree of Life uses Nextflow pipelines that follow the nf-core standard, and the six EuroFAANG H2020 projects have jointly adopted nf-core. The transition is gradual, so fragmented ecosystems keep working while interoperability improves.", "kw": ["nf-core", "Nextflow", "Darwin Tree of Life"], "info": "Limitation: large-scale funding for a uniform move to one computational framework is unlikely, so DAGP must offer a pragmatic path to computational FAIRification with minimal constraints.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - analysis tools and pipelines", "q": "What are the four purposes of the EuroFAANG computational framework?", "a": "1. Practical solutions for managing data and getting the most value from it. 2. Datasets that can be compared and combined across consortia and species. 3. Long-term interoperability as sequencing improves, since older datasets still hold key information. 4. Compatibility with industrial developments.", "kw": ["computational framework"], "info": "", "concl": "Robust community-wide standards, developed bottom-up as with nf-core and the FAANG metadata standards, are a key mission of DAGP."}, {"type": "qa", "section": "BFSP contribution - standards for in vitro systems", "q": "Which in vitro systems are considered, and how are organoids and Organ-on-Chip defined?", "a": "Immortalised cell lines, primary cells, stem cell lines, organoids and microphysiological systems such as Organ-on-Chip (OoC). Organoids are miniaturised, simplified 3D versions of organs derived from adult or embryonic stem cells. OoCs are microfluidic devices with living cells arranged to simulate tissue- and organ-level physiology.", "kw": ["organoids", "Organ-on-Chip"], "info": "Organoids have been developed in the main farm animal species, but OoC development is still in its infancy. These systems can be perturbed (including by genome editing) and phenotyped with bulk and single-cell omics and imaging.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - standards for in vitro systems", "q": "What holds back the use of 3D and complex cell models in farm animal science?", "a": "Lab methods need to be adapted to each species, reproducibility needs to improve, and methods change quickly while biological and technical variation must be controlled.", "kw": ["reproducibility", "cryobanking"], "info": "One specific need for G2P research is cryobanking non-sterile tissues in a way that still allows organoids to be derived, so that 'in vitro populations' can be preserved.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - standards for in vitro systems", "q": "What are CRISPR screens in cell lines good for, and what are the limits of immortalised cell lines?", "a": "CRISPR screens can identify genetic determinants of host response to infectious diseases, nutrient uptake or other environmental challenges, including traits that are virtually
