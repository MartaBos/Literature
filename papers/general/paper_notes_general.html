 (comparing pre-mRNA with mRNA) to reconstruct trajectories of processing regulation.", "concl": ""}, {"type": "note", "section": "Long-read sequencing - coordination between maturation steps", "text": "How do TSSs constrain splicing and polyadenylation choices? The mechanism of promoter dominance is still unknown, despite its chromatin signature (p300, low H2A.Z, H3K18ac)."}, {"type": "note", "section": "Short-read RNA-seq - nascent RNA dynamics", "text": "Tissue-specific UPRT/4tU labelling (SLAM-ITseq) has been used in zebrafish only for transcription. The authors suggest it could also capture rapid changes in RNA processing and isoform switching. Worth revisiting for in vivo work in fish."}, {"type": "note", "section": "Future perspective", "text": "DNA LRS (chromatin fibre footprinting) has not yet been directly compared with RNA LRS from the same samples to define 'coordination states' at single-allele level."}], "key": "general/AlfonsoGonzalez_2025_NatRevMCB_RNA_processing_sequencing", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}], "comments": {}};
const CAT = DATA.catKeys;
const catVars = c => { const k = CAT[c]||"gen"; return `--cl:var(--c-${k});--cd:var(--c-${k}-d)`; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const papers = DATA.papers.map(p => {
  let n = 0;
  p.items.forEach(it => { if (it.type==="qa") it.uid = p.id + ":" + (n++); });
  return {...p, slug: slug(p.id), qas: p.items.filter(i => i.type==="qa")};
});
const bySlug = Object.fromEntries(papers.map(p => [p.slug, p]));
const cats = DATA.legend.filter(c => papers.some(p => p.category===c));

/* storage */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let known = new Set(store.get("pn-known", []));
const saveKnown = () => store.set("pn-known", [...known]);
let theme = store.get("pn-theme", "auto");
function applyTheme(){
  if (theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = "Theme: " + theme;
}
document.getElementById("theme").onclick = () => {
  theme = theme==="auto" ? "light" : theme==="light" ? "dark" : "auto";
  store.set("pn-theme", theme); applyTheme();
};
applyTheme();

const totalQ = papers.reduce((a,p) => a + p.qas.length, 0);
document.getElementById("tot").textContent = `${papers.length} papers, ${totalQ} questions`;

/* state */
let activeCats = new Set();
let current = null;
let query = "";
const main = document.getElementById("main");

function renderCats(){
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat" style="${catVars(c)}" aria-pressed="${activeCats.has(c)}" data-cat="${esc(c)}"><span class="dot" style="background:var(--cd)"></span>${esc(c)}</button>`).join("");
}
document.getElementById("cats").onclick = e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  const c = b.dataset.cat; activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
  renderCats(); renderList(); if (!current && !query) renderHome();
};
const visible = () => papers.filter(p => !activeCats.size || activeCats.has(p.category));

function renderList(){
  document.getElementById("plist").innerHTML = visible().map(p => {
    const k = p.qas.filter(q => known.has(q.uid)).length;
    return `<li><button class="pitem" style="${catVars(p.category)}" data-p="${p.slug}" aria-current="${current===p}">
      <span class="tab" style="background:var(--cd)"></span>
      <span><b>${esc(p.id.replace("_"," "))}${(p.tags||[]).length && !p.nostar ? `<span class="star" title="${esc(p.tags.join(", "))}">★</span>` : ""}</b><span class="t">${esc(p.title)}</span></span>
      <span class="n">${p.qas.length ? (k ? k+"/" : "") + p.qas.length : "—"}</span></button></li>`;
  }).join("");
}
document.getElementById("plist").onclick = e => {
  const b = e.target.closest("[data-p]"); if (b) go(b.dataset.p);
};

function go(s){
  document.body.classList.remove("drawer");
  if (location.hash.slice(1) !== s) location.hash = s; else route();
}
function route(){
  const h = location.hash.slice(1);
  if (query){ clearSearch(); }
  current = bySlug[h] || null;
  renderList();
  current ? renderPaper(current) : renderHome();
  document.getElementById("mtitle").textContent = current ? current.id.replace("_"," ") : DATA.page.label;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
const homeEl = document.getElementById("home");
homeEl.onclick = () => { history.pushState(null,"",location.pathname); route(); };
homeEl.onkeydown = e => { if (e.key==="Enter") homeEl.click(); };

function renderHome(){
  const list = visible();
  const groups = cats.filter(c => list.some(p => p.category===c));
  const k = papers.reduce((a,p) => a + p.qas.filter(q => known.has(q.uid)).length, 0);
  main.innerHTML = `<div class="home">
    <h2>${esc(DATA.page.label)}</h2>
    <p class="lead">${totalQ} questions across ${papers.length} papers. Open a paper to quiz yourself one answer at a time, or study the whole set as flashcards. You know ${k} of them so far. Last updated ${esc(DATA.page.updated)}.</p>
    <div class="toolbar"><button class="btn primary" id="studyAll">Study ${activeCats.size ? "these categories" : "everything"}</button></div>
    ${groups.map(c => `<div class="grp" style="${catVars(c)}"><h3><span class="dot" style="background:var(--cd)"></span>${esc(c)}</h3>
      ${list.filter(p => p.category===c).map(p => {
        const kn = p.qas.filter(q => known.has(q.uid)).length, pct = p.qas.length ? kn/p.qas.length*100 : 0;
        return `<button class="prow" data-p="${p.slug}"><b>${esc(p.id.replace("_"," "))}${(p.tags||[]).length && !p.nostar ? `<span class="star" title="${esc(p.tags.join(", "))}">★</span>` : ""}</b><span>${esc(p.title)}</span>
          <div>${p.qas.length ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="barlab">${kn} of ${p.qas.length} known</div>` : `<div class="barlab">${p.missing_pdf ? "PDF missing" : "No notes yet"}</div>`}</div></button>`;
      }).join("")}</div>`).join("")}
  </div>`;
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => go(b.dataset.p));
  document.getElementById("studyAll").onclick = () => startStudy(list.flatMap(p => p.qas.map(q => [p,q])), activeCats.size ? [...activeCats].join(", ") : "All papers");
}

function hl(text){
  text = esc(text);
  if (!query) return text;
  const re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","gi");
  return text.replace(re, "<mark>$1</mark>");
}
function qaHTML(p, it, open){
  const extra = [["Details", it.info], ["Takeaway", it.concl]].filter(x => x[1]);
  return `<div class="qa${open ? " open" : ""}" style="${catVars(p.category)}">
    <button class="qbtn" aria-expanded="${!!open}"><span class="qt">${hl(it.q || "Note")}</span>
      <span class="qmeta">${it.novel ? `<span class="novel">New to me</span>` : ""}${known.has(it.uid) ? `<span class="known">Known</span>` : ""}
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></span></button>
    <div class="ans">
      ${it.a ? `<p class="a">${hl(it.a)}</p>` : ""}
      ${extra.length ? `<dl class="extra">${extra.map(([k,v]) => `<dt>${k}</dt><dd>${hl(v)}</dd>`).join("")}</dl>` : ""}
      ${it.kw.length ? `<div class="kws">${it.kw.map(k => `<button class="kw" data-kw="${esc(k)}" title="Search for ${esc(k)}">${esc(k)}</button>`).join("")}</div>` : ""}
    </div></div>`;
}
function bindQA(root){
  root.querySelectorAll(".qbtn").forEach(b => b.onclick = () => {
    const qa = b.parentElement; qa.classList.toggle("open"); b.setAttribute("aria-expanded", qa.classList.contains("open"));
  });
  root.querySelectorAll("[data-kw]").forEach(b => b.onclick = () => { qInput.value = b.dataset.kw; doSearch(); });
}

function renderPaper(p){
  const kn = p.qas.filter(q => known.has(q.uid)).length;
  const secs = [];
  p.items.forEach(it => { const s = it.section || "Notes"; if (!secs.includes(s)) secs.push(s); });
  let body = "";
  if (!p.items.length) body = `<p class="empty">${p.missing_pdf ? `The PDF is not in the folder yet (it needs a subscription). Download it with Open paper and save it as ${esc(p.missing_pdf)}. Notes are written in the next weekly update (Wednesdays 04:00).` : `There are no notes for this paper yet. They are generated in the weekly update (Wednesdays 04:00) from ${esc(p.source_pdf || "the PDF")}.`}</p>`;
  secs.forEach((s,i) => {
    body += `<h3 class="sec" id="s-${i}">${esc(s)}</h3>`;
    p.items.filter(it => (it.section || "Notes")===s).forEach(it => {
      body += it.type==="note" ? `<p class="notep">${esc(it.text)}</p>` : qaHTML(p, it, false);
    });
  });
  main.innerHTML = `<header class="phead" style="${catVars(p.category)}">
      <div class="who"><span>${esc(p.id.replace("_",", "))}</span><span class="tag">${esc(p.category)}</span>${(p.tags||[]).map(t => `<span class="badge">${esc(t)}</span>`).join("")}${p.shared ? `<span class="shared">Shared by ${esc(p.shared)}</span>` : ""}${p.link ? `<a class="open" href="${esc(p.link)}" target="_blank" rel="noopener">Open paper</a>` : ""}${p.preprint ? `<a class="open" href="${esc(p.preprint)}" target="_blank" rel="noopener" title="Earlier preprint version">Preprint</a>` : ""}</div>
      <h2>${esc(p.title)}</h2>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}${p.source_note ? `<p class="srcnote">⚠ ${esc(p.source_note)}</p>` : ""}
    </header>
    ${p.qas.length ? `<div class="toolbar">
      <button class="btn primary" id="studyP">Study as flashcards</button>
      <button class="btn" id="toggleAll">Show all answers</button>
      <span class="prog">${kn} of ${p.qas.length} known</span></div>` : ""}
    ${secs.length > 2 ? `<nav class="secnav" aria-label="Sections">${secs.map((s,i) => `<button data-s="${i}">${esc(s)}</button>`).join("")}</nav>` : ""}
    <div id="items">${body}</div>${commentHTML(p)}`;
  bindQA(main);
  bindComments(p);
  main.querySelectorAll("[data-s]").forEach(b => b.onclick = () => document.getElementById("s-"+b.dataset.s).scrollIntoView({behavior:"smooth"}));
  const t = document.getElementById("toggleAll");
  if (t) t.onclick = () => {
    const all = main.querySelectorAll(".qa"), open = t.textContent.startsWith("Show");
    all.forEach(q => { q.classList.toggle("open", open); q.querySelector(".qbtn").setAttribute("aria-expanded", open); });
    t.textContent = open ? "Hide all answers" : "Show all answers";
  };
  const sp = document.getElementById("studyP");
  if (sp) sp.onclick = () => startStudy(p.qas.map(q => [p,q]), p.id.replace("_"," "));
}

/* comments */
const COMMENTS = Object.assign({}, DATA.comments || {});
let serverOK = null;  // true when served by serve_notes.py (comments editable)
const cmtStamp = c => c && c.updated ? c.updated.replace("T", " ").slice(0, 16) : "";
function commentHTML(p){
  const c = COMMENTS[p.key] || {};
  const ro = serverOK === false;
  const status = ro ? `Read-only here: open the page through the notes server (start_notes_server.sh) to edit.${c.updated ? " Last saved " + cmtStamp(c) + "." : ""}`
               : (c.updated ? `Saved · ${cmtStamp(c)}` : "Comments are saved automatically as you type.");
  return `<section class="comments"><h3 class="sec">My comments</h3>
    <textarea id="cmtText" placeholder="Your thoughts on this paper and on its notes…"${ro ? " readonly" : ""}>${esc(c.text || "")}</textarea>
    <div class="cmtstatus" id="cmtStatus">${esc(status)}</div></section>`;
}
function bindComments(p){
  const ta = document.getElementById("cmtText"), st = document.getElementById("cmtStatus");
  if (!ta || serverOK === false) return;
  let timer, last = ta.value;
  const save = async () => {
    clearTimeout(timer);
    if (ta.value === last) return;
    const text = ta.value; st.textContent = "Saving…";
    try {
      const r = await fetch("/api/comments", {method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify({key: p.key, text})});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); last = text; COMMENTS[p.key] = {text, updated: j.updated};
      st.textContent = "Saved · " + cmtStamp(COMMENTS[p.key]);
    } catch (e) { st.textContent = "Not saved (" + e.message + "). Is the notes server running?"; }
  };
  ta.addEventListener("input", () => { st.textContent = "Unsaved changes…"; clearTimeout(timer); timer = setTimeout(save, 800); });
  ta.addEventListener("blur", save);
}
(async () => {  // detect the notes server and load the newest comments
  try {
    const r = await fetch("/api/comments?folder=" + encodeURIComponent(DATA.page.folder), {credentials: "same-origin"});
    if (!r.ok) throw 0;
    Object.assign(COMMENTS, await r.json()); serverOK = true;
  } catch (e) { serverOK = false; }
  if (current && !query) renderPaper(current);
})();

/* search */
const qInput = document.getElementById("q");
let tmr;
qInput.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(doSearch, 120); });
function clearSearch(){ query = ""; qInput.value = ""; }
function doSearch(){
  query = qInput.value.trim();
  document.body.classList.remove("drawer");
  if (!query){ route(); return; }
  const ql = query.toLowerCase();
  const res = visible().map(p => [p, p.qas.filter(it =>
    [it.q, it.a, it.info, it.concl, ...it.kw].join(" ").toLowerCase().includes(ql))]).filter(r => r[1].length);
  const n = res.reduce((a,r) => a + r[1].length, 0);
  main.innerHTML = `<div class="home"><h2>“${esc(query)}”</h2>
    <p class="lead">${n ? `${n} matching question${n>1?"s":""} in ${res.length} paper${res.length>1?"s":""}.` : "Nothing matches. Try a shorter word or a tool name, such as BUSCO or QTL."}</p>
    ${res.map(([p, its]) => `<div class="rgroup" style="${catVars(p.category)}"><h3><span class="dot" style="background:var(--cd)"></span><button data-p="${p.slug}">${esc(p.id.replace("_"," "))}</button></h3>
      ${its.map(it => qaHTML(p, it, true)).join("")}</div>`).join("")}</div>`;
  bindQA(main);
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { clearSearch(); go(b.dataset.p); });
}

/* flashcards */
const study = document.getElementById("study"), stage = document.getElementById("stage");
let deckAll = [], deck = [], pos = 0, flipped = false, sLabel = "";
const sShuffle = document.getElementById("sShuffle"), sNew = document.getElementById("sNew");
function startStudy(cards, label){
  deckAll = cards; sLabel = label; buildDeck();
  study.classList.add("on"); document.body.style.overflow = "hidden";
  document.getElementById("bFlip").focus();
}
function buildDeck(){
  deck = deckAll.filter(([,q]) => !sNew.checked || !known.has(q.uid));
  if (sShuffle.checked) for (let i = deck.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
  pos = 0; showCard();
}
sShuffle.onchange = buildDeck; sNew.onchange = buildDeck;
function showCard(){
  flipped = false;
  document.getElementById("sTitle").textContent = sLabel;
  document.getElementById("sTrack").style.width = (deck.length ? pos/deck.length*100 : 100) + "%";
  const ctl = document.getElementById("sctl");
  if (pos >= deck.length){
    const k = deckAll.filter(([,q]) => known.has(q.uid)).length;
    document.getElementById("sCount").textContent = "";
    ctl.style.visibility = "hidden";
    stage.innerHTML = `<div class="done"><h3>${deck.length ? "Deck finished" : "Nothing left to review"}</h3>
      <p>You know ${k} of ${deckAll.length} cards in this set.</p>
      <button class="btn primary" id="again">Go through again</button> <button class="btn" id="fin">Close</button></div>`;
    document.getElementById("again").onclick = buildDeck;
    document.getElementById("fin").onclick = closeStudy;
    return;
  }
  ctl.style.visibility = "visible";
  document.getElementById("sCount").textContent = `${pos+1} / ${deck.length}`;
  const [p, q] = deck[pos];
  const src = `<div class="src"><span class="tag">${esc(p.id.replace("_"," "))}</span><span>${esc(q.section)}</span></div>`;
  stage.innerHTML = `<div class="card" id="card" style="${catVars(p.category)}" role="button" tabindex="0" aria-label="Flip card">
    <div class="face">${src}<p class="q">${esc(q.q)}</p><p class="hint">Tap the card or press space to see the answer</p></div>
    <div class="face back">${src}<p class="bq">${esc(q.q)}</p><p class="ba">${esc(q.a || "")}</p>
      ${q.concl ? `<dl class="extra"><dt>Takeaway</dt><dd>${esc(q.concl)}</dd></dl>` : ""}</div></div>`;
  document.getElementById("card").onclick = flip;
}
function flip(){ const c = document.getElementById("card"); if (!c) return; flipped = !flipped; c.classList.toggle("flip", flipped); }
function mark(good){
  if (pos >= deck.length) return;
  const q = deck[pos][1];
  good ? known.add(q.uid) : known.delete(q.uid);
  saveKnown(); pos++; showCard();
}
document.getElementById("bFlip").onclick = flip;
document.getElementById("bGood").onclick = () => mark(true);
document.getElementById("bAgain").onclick = () => mark(false);
function closeStudy(){
  study.classList.remove("on"); document.body.style.overflow = "";
  renderList(); if (query) doSearch(); else current ? renderPaper(current) : renderHome();
}
document.getElementById("sClose").onclick = closeStudy;
document.addEventListener("keydown", e => {
  if (!study.classList.contains("on")) return;
  if (e.target.tagName==="INPUT") return;
  if (e.key===" "){ e.preventDefault(); flip(); }
  else if (e.key==="1" || e.key==="ArrowLeft") mark(false);
  else if (e.key==="2" || e.key==="ArrowRight") mark(true);
  else if (e.key==="Escape") closeStudy();
});

/* mobile drawer */
document.getElementById("menu").onclick = () => document.body.classList.add("drawer");
document.getElementById("scrim").onclick = () => document.body.classList.remove("drawer");

renderCats(); route();
</script>
</body>
</html>
