"}, {"type": "qa", "section": "Abstract", "q": "What are the three main claims of the paper?", "a": "(1) lncRNA-BERT reaches state-of-the-art classification and does best on the hard RNAChallenge set. (2) Pre-training alone, with no labels, already separates mRNA from lncRNA, which shows that coding potential is a sequence-intrinsic property. (3) A new Convolutional Sequence Encoding (CSE) is more efficient and works better than K-mer tokenization and BPE for long RNAs.", "kw": ["coding potential", "CSE"], "info": "Pre-training on human GENCODE/RefSeq/NONCODE data works better than pre-training on the commonly used RNAcentral.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How are non-coding RNAs split by length?", "a": "Into short ncRNAs (miRNA, piRNA, snoRNA, tRNA) and long non-coding RNAs (lncRNAs), which are at least 200 nt long.", "kw": ["lncRNA"], "info": "NONCODE v6 holds 173,112 human lncRNA transcripts, compared with 197,151 mRNAs in RefSeq r225.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is it important to tell lncRNAs apart from mRNAs?", "a": "Their length ranges overlap and they are often detected together in RNA-seq. Novel transcripts need a correct biotype for good curation.", "kw": ["biotype classification"], "info": "Downstream uses the authors name: cancer biomarker discovery, modelling disease mechanisms, and understanding cell and tissue development.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How do classical coding-potential classifiers work?", "a": "They are machine learning models trained on RefSeq or GENCODE annotations. They use predefined features such as ORF length, protein database alignment hits and k-mer frequencies.", "kw": ["CPC", "CPAT", "CNCI"], "info": "CPC, CPC2 and CNCI use support vector machines and CPAT uses logistic regression. More than 40 algorithms exist. CPAT also provides a widely used benchmark of 4,000 human mRNAs and 4,000 lncRNAs.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is mRNA versus lncRNA classification inherently ambiguous?", "a": "Some lncRNAs contain short ORFs that are translated into small peptides, and some mRNA genes have non-coding isoforms.", "kw": ["small ORFs", "micro-peptides"], "info": "This ambiguity has driven the continued development of new classifiers: feature selection, boosting and neural networks.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What limits earlier sequence-only deep learning classifiers?", "a": "They use CNNs, which have limited receptive fields, or RNNs, which suffer from exploding or vanishing gradients. In a recent benchmark (Singh and Roy 2022) they were beaten by feature-based or hybrid methods.", "kw": ["CNN", "RNN", "transformer"], "info": "Transformers solve these problems with an attention mechanism and a non-recurrent design.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is a nucleotide language model (NLM)?", "a": "A large language model that is pre-trained and fine-tuned on genomic data. DNA NLMs can predict chromatin features, find promoters and prioritise variants. RNA NLMs can predict splice sites, secondary structure, interactions and modifications.", "kw": ["NLM", "LLM"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why might existing RNA language models be poor at detecting coding potential?", "a": "Most are trained on RNAcentral, which contains no mRNA, and their context length is limited to under 1024 nt.", "kw": ["RNAcentral", "context length"], "info": "An open question is which sequence encodings are least sensitive to frameshifts, because classical features such as ORF length depend on the reading frame.", "concl": "This is the gap: an RNA language model built specifically for mRNA versus lncRNA classification of long transcripts."}, {"type": "qa", "section": "Methods - Data", "q": "What data was used for pre-training?", "a": "All RNA sequences from GENCODE v46, NONCODE v6 and RefSeq, combined: 297,724 mRNAs and 238,470 lncRNAs, with an average length of 2,835 nt. A random 5% of GENCODE sequences was held out for validation.", "kw": ["GENCODE", "NONCODE", "RefSeq"], "info": "The RefSeq version is inconsistent in the paper: v255 in Methods, but r225 in the Introduction and the data availability statement. As an alternative, they also tried RNAcentral v24 for multi-species pre-training (about 37.9 million ncRNAs, average length 659, 2,500 held out for validation).", "concl": ""}, {"type": "qa", "section": "Methods - Data", "q": "How did they build a non-redundant fine-tuning set?", "a": "They ran CD-HIT at 90% sequence identity on the combined GENCODE and RefSeq human mRNA/lncRNA data. The representative sequences were split at random into 90% training, 5% validation and 5% test.", "kw": ["CD-HIT", "redundancy removal"], "info": "Fine-tuning set: 101,270 mRNAs and 48,785 lncRNAs. NONCODE was left out at this stage because its annotation reliability varies, and its well-supported entries are already in GENCODE/RefSeq.", "concl": ""}, {"type": "qa", "section": "Methods - Data", "q": "Which test sets were used?", "a": "(1) A GENCODE/RefSeq held-out set (5,650 mRNAs and 2,686 lncRNAs). (2) The CPAT benchmark (4,000 RefSeq mRNAs and 4,000 human lncRNAs). (3) RNAChallenge: 27,283 hard-to-classify RNAs (16,243 mRNA and 11,040 ncRNA) from animals, plants and fungi.", "kw": ["CPAT dataset", "RNAChallenge"], "info": "The authors expect the CPAT set to overlap partly with the training sets of the evaluated classifiers. RNAChallenge tests cross-species generalisation to ambiguous RNAs.", "concl": ""}, {"type": "qa", "section": "Methods - Encoding methods", "q": "Why does the choice of sequence encoding matter for transformers?", "a": "Attention has quadratic memory complexity, so standard GPUs only allow about 512 to 1024 input positions. Long RNAs have to be compressed to fit.", "kw": ["context window", "attention"], "info": "With most encodings, a medium context window of 768 tokens covers the majority of transcripts in the human pre-training set.", "concl": ""}, {"type": "qa", "section": "Methods - Encoding methods", "q": "What is the problem with nucleotide-level tokenization (NUC)?", "a": "It uses one token per nucleotide (vocabulary of 4). That works for short RNAs, but only 25% of the human pre-training sequences fit in a context of 768.", "kw": ["NUC"], "info": "By comparison, within 768 positions: 3-mer 58%, 6-mer 82%, 9-mer 92%, BPE 256/1024/4096 at 64/71/76%, CSE k=9 92%, CSE k=10 94%.", "concl": ""}, {"type": "qa", "section": "Methods - Encoding methods", "q": "What are the drawbacks of K-mer tokenization?", "a": "Non-overlapping k-mers shorten the sequence k-fold, but the vocabulary is 4^k. Large k leads to poor token sampling efficiency and a parameter explosion in the embedding layer.", "kw": ["k-mer tokenization"], "info": "Similar k-mers are learned independently, and the model has to learn every signal in k alternative reading frames.", "concl": ""}, {"type": "qa", "section": "Methods - Encoding methods", "q": "What is Byte Pair Encoding (BPE) for nucleotides?", "a": "A tokenizer that repeatedly merges the most frequent token pairs until a set vocabulary size is reached. This gives a fixed-size vocabulary of variable-length tokens.", "kw": ["BPE"], "info": "Compared with K-mer it compresses length more for the same vocabulary size, samples tokens more efficiently and is more robust to frameshifts. It still needs a large vocabulary to compress strongly.", "concl": ""}, {"type": "qa", "section": "Methods - Encoding methods", "q": "How does Convolutional Sequence Encoding (CSE) work?", "a": "The sequence is converted to a 4 x l position weight matrix (e.g. A = [1,0,0,0], N = [0.25 each]). A ReLU-activated 1D convolution with d_model learnable kernels of size k, and stride k, then embeds it into d_model dimensions. This shortens the sequence k-fold.", "kw": ["CSE", "position weight matrix", "convolution"], "info": "The idea comes from the Vision Transformer. Zero-padding is masked in attention. It keeps nucleotide-level resolution with few parameters and treats each input position as a combination of nucleotides, not as an independent token.", "concl": "This is the paper's new encoding method."}, {"type": "qa", "section": "Methods - Language model architecture", "q": "What is the model architecture?", "a": "A BERT-medium transformer encoder with 12 blocks, d_model 768, 3072 feedforward nodes, 12 attention heads and a context length of 768. It has 85 M trainable parameters.", "kw": ["BERT", "CLS token"], "info": "Classification head: one sigmoid-activated linear node on the CLS embedding. CSE models replace the CLS token with a learnable CLS embedding (as in ViT). Their MLM head uses a softmax-activated transposed convolution (stride and kernel k) to predict at nucleotide resolution.", "concl": ""}, {"type": "qa", "section": "Methods - Training", "q": "What compute did training need?", "a": "Pre-training took 7 days on an A100 MIG 4g.40GB GPU (Leiden ALICE cluster). Fine-tuning took about 20 h on the same GPU, or about 30 h on an L4 24 GB GPU.", "kw": [], "info": "The published models can classify on a CPU or a GPU with 6 GB memory. Checkpoints were chosen by validation performance.", "concl": ""}, {"type": "qa", "section": "Methods - Training", "q": "How was pre-training done?", "a": "With masked language modelling (MLM). 15% of tokens or nucleotides were selected; of these, 80% were masked and 10% randomly replaced. The model was trained with cross-entropy loss, batch size 8, Adam and the Vaswani learning-rate schedule with 32,000 warmup steps.", "kw": ["MLM", "self-supervised"], "info": "CSE models mask with the IUPAC symbol N, which means equal probability for all four bases.", "concl": ""}, {"type": "qa", "section": "Methods - Training", "q": "How was fine-tuning done?", "a": "All parameters were fine-tuned on 101,270 coding and 48,785 lncRNA sequences for 100 epochs of 10,000 random samples each. They used Adam at a fixed learning rate of 1e-5 and batch size 8.", "kw": ["fine-tuning", "class imbalance"], "info": "Binary cross-entropy loss was weighted by reciprocal class sizes to correct the imbalance. The small epoch size gives more frequent checks on progress.", "concl": ""}, {"type": "qa", "section": "Methods - Training", "q": "What is probing?", "a": "A test of how much coding potential the pre-trained embeddings already hold, without changing the network weights. A small MLP with one hidden layer of 256 nodes is trained on mean-pooled output embeddings.", "kw": ["probing", "MLP"], "info": "Same settings as fine-tuning, except the learning rate is 1e-4.", "concl": ""}, {"type": "qa", "section": "Methods - Experimental setup", "q": "What feature types do existing lncRNA classifiers use?", "a": "Five types: ORF (e.g. ORF length), sequence patterns (k-mer frequencies, Fickett score), database alignment (BLASTX hits), physicochemical (isoelectric point) and secondary structure (frequency of unpaired versus paired bases).", "kw": ["ORF", "Fickett score", "BLASTX"], "info": "ORF and sequence patterns are purely sequence-intrinsic, and most physicochemical and structural features can be inferred from sequence. Database alignment is extrinsic information that an NLM cannot learn.", "concl": ""}, {"type": "qa", "section": "Methods - Experimental setup", "q": "Which tools was lncRNA-BERT compared against?", "a": "Three classical ML tools: CPAT (logistic regression), LncFinder (SVM) and PredLnc-GFStack (random forest). Three deep learning tools: LncADeep (feature-based DBN), mRNN (sequence-only RNN) and RNAsamba (hybrid IGLOO).", "kw": ["LncADeep", "RNAsamba", "mRNN"], "info": "Out-of-the-box models were used for the main comparison. CPAT, RNAsamba and mRNN were also retrained on the authors' fine-tuning data. Configurations were selected after 500 pre-training epochs. The main metric was macro-averaged F1.", "concl": ""}, {"type": "qa", "section": "Results - Benchmark against existing classifiers", "q": "How did lncRNA-BERT score on the GENCODE/RefSeq test set?", "a": "Macro F1 was 0.940 with 3-mer and 0.943 with CSE k=9, the best value. Close competitors were PredLnc-GFStack (0.941) and LncADeep (0.930). CPAT scored 0.889.", "kw": ["macro F1"], "info": "The CSE model had the highest mRNA recall (0.971) and ncRNA precision (0.937).", "concl": ""}, {"type": "qa", "section": "Results - Benchmark against existing classifiers", "q": "How did it do on the CPAT test set?", "a": "All methods scored between 0.950 and 0.970 macro F1. lncRNA-BERT 3-mer scored 0.963 and CSE 0.947, while LncADeep was highest at 0.970.", "kw": ["CPAT dataset"], "info": "The CPAT set has been in use for years and has easier-to-separate sequences, so it hardly distinguishes the methods. LncADeep also uses protein database alignments, which lncRNA-BERT cannot access.", "concl": ""}, {"type": "qa", "section": "Results - Benchmark against existing classifiers", "q": "How did it do on the cross-species RNAChallenge set?", "a": "Macro F1 was 0.235 (3-mer) and 0.242 (CSE). The best out-of-the-box competitor was PredLnc at 0.173, and the others scored 0.005 to 0.155.", "kw": ["RNAChallenge", "generalisation"], "info": "Absolute scores are very low for every tool, and ncRNA precision and recall are about 0.05 to 0.07 even for lncRNA-BERT. The retrained mRNN (0.392) and retrained CPAT (0.321) scored higher than lncRNA-BERT on this set.", "concl": "The authors say lncRNA-BERT generalises across species better than out-of-the-box tools."}, {"type": "qa", "section": "Results - Benchmark against existing classifiers", "q": "How did they check for overfitting on the CPAT test set?", "a": "Using CD-HIT, they made a CPAT subset of 2,321 mRNAs and 527 lncRNAs that differ by more than 10% from every fine-tuning training sequence. On it, lncRNA-BERT reached a weighted average F1 of 0.954 (3-mer) and 0.932 (CSE).", "kw": ["CD-HIT", "overfitting"], "info": "Note that this is a weighted F1, not the macro F1 used elsewhere.", "concl": "Performance holds on independent human data."}, {"type": "qa", "section": "Results - Benchmark against existing classifiers", "q": "Does lncRNA-BERT use ORF information even though it is never given ORF features?", "a": "Indirectly, yes. mRNAs it classified correctly had higher ORF coverage (mean 0.502, SD 0.239) than misclassified mRNAs (mean 0.342, SD 0.211).", "kw": ["ORF coverage", "explainability"], "info": "This was their only interpretability check, because NLMs are hard to explain.", "concl": ""}, {"type": "qa", "section": "Results - Benchmark against existing classifiers", "q": "What happened when CPAT, RNAsamba and mRNN were retrained on the authors' data?", "a": "RNAsamba stayed about the same (e.g. 0.918 on GENCODE/RefSeq). CPAT and mRNN dropped from 0.889 to 0.962 down to 0.534 to 0.630 on the GENCODE/RefSeq and CPAT sets. On RNAChallenge, however, they improved to 0.321 and 0.392.", "kw": ["retraining"], "info": "The authors found this somewhat surprising. It matches the RNAChallenge study's observation that generally weaker tools can do relatively well on that benchmark. The paper does not explain the collapse further.", "concl": ""}, {"type": "qa", "section": "Results - Pre-training data", "q": "Can pre-training alone separate mRNA from lncRNA?", "a": "Yes. After MLM pre-training on human data, t-SNE of the embeddings already separates mRNA from ncRNA. Pre-training on human data also gives faster convergence and 0.01 to 0.08 higher fine-tuning F1 than RNAcentral or no pre-training.", "kw": ["self-supervised", "t-SNE"], "info": "The authors say this is the first method that can partly separate mRNA from lncRNA through a self-supervised pre-training step.", "concl": "Coding potential is a prominent sequence-intrinsic signal."}, {"type": "qa", "section": "Results - Pre-training data", "q": "What goes wrong when pre-training on RNAcentral?", "a": "The model becomes biased toward other ncRNA types. MLM accuracy is 70% on RNAcentral sequences but only 15% on human lncRNAs, compared with 18% for the human model, and mRNA and ncRNA are less clearly separated in its embeddings.", "kw": ["RNAcentral", "MLM accuracy"], "info": "On the ArchiveII dataset (multi-species ncRNAs from 10 structural families), the RNAcentral model separates the families and the human model does not. Possible causes: RNAcentral has many specific ncRNAs and no mRNA, and lncRNAs are poorly conserved across species.", "concl": "General-purpose RNA language models trained on RNAcentral may not suit lncRNA classification. Compare them with domain- and species-specific models."}, {"type": "qa", "section": "Results - Encoding methods", "q": "Which encodings worked best?", "a": "3-mer tokenization and CSE with k=9. Both reach a probing F1 of 0.93, and 3-mer reaches the highest fine-tuning F1 (0.94).", "kw": ["3-mer", "CSE k=9"], "info": "On validation fine-tuning, 3-mer scored 0.944 and CSE k=9 scored 0.941.", "concl": ""}, {"type": "qa", "section": "Results - Encoding methods", "q": "Why does CSE beat K-mer tokenization at large k?", "a": "Probing F1 for CSE versus K-mer was 0.93 vs 0.91 at k=6 and 0.93 vs 0.79 at k=9. K-mer suffers from its 4^9 vocabulary and an embedding layer of 4^9 x d_model parameters, while CSE uses only 4 x d_model x k parameters.", "kw": ["CSE", "k-mer tokenization"], "info": "BPE also treats tokens as independent, which helps explain why probed CSE beats it at vocabulary sizes 256, 1024 and 4096. The text cites Figure 3C for fine-tuning scores, but this is probably Figure 4C.", "concl": "CSE is the best choice when strong compression (6-fold or more) is needed."}, {"type": "qa", "section": "Results - Encoding methods", "q": "When is CSE worse than tokenizers?", "a": "With small token sizes and full fine-tuning. CSE k=3 reached 0.93 fine-tuning F1, compared with 0.94 for 3-mer, 0.93 for BPE 256 and 0.94 for BPE 1024.", "kw": [], "info": "Short, predefined tokens give higher-resolution attention. CSE has to learn its patterns before BERT can use them, which makes it less stable. Tokenizers gain more from probing to fine-tuning.", "concl": ""}, {"type": "qa", "section": "Results - Encoding methods", "q": "How many nucleotides are needed to judge coding potential?", "a": "With 3-mer tokenization the context is 3 x 768 = 2304 nt, and that was enough.", "kw": ["context length"], "info": "Longer coverage explains why 3-mer beats NUC. Too long a context may hurt learning of local signals, as seen for CSE k=10.", "concl": "Coding potential of long transcripts can usually be inferred from the first 2304 nucleotides."}, {"type": "qa", "section": "Results - Three-base periodicity", "q": "How does three-base periodicity affect the encodings?", "a": "Encodings whose k is a multiple of 3 match the codon reading frame and separate mRNA from lncRNA better (CSE k=6 and 9 beat k=7 and 10). The drawback is that their mRNA embeddings jump between three positions when the reading frame shifts.", "kw": ["reading frame", "frameshift", "three-base periodicity"], "info": "After trimming 0 to 9 nt from the start of a sequence, BPE and CSE k=10 embeddings stayed stable. K-mer, CSE with k divisible by 3 and Nucleotide Transformer (6-mer) shifted. No such effect was seen in non-coding sequences.", "concl": "Choosing k not divisible by 3 breaks the periodicity and reduces frameshift sensitivity."}, {"type": "qa", "section": "Results - Three-base periodicity", "q": "Why do three-base periodic models favour in-frame signals?", "a": "Signals whose periodicity lines up with the model's input positions are easier to learn. For example, from ACT TGA ACT it is easier to learn that TGA follows ACT than that GAA follows CTT.", "kw": [], "info": "lncRNAs show weaker three-base periodicity, which gives lower MLM accuracy but more consistent embeddings than mRNA.", "concl": ""}, {"type": "qa", "section": "Results - Comparison with other NLMs", "q": "How do other nucleotide language models compare in separating mRNA and ncRNA?", "a": "Embedding silhouette scores: RiNALMo 0.1001, HyenaDNA 0.0797, lncRNA-BERT 3-mer 0.0783, lncRNA-BERT CSE 0.0713, DNABERT-2 0.0622, BiRNA-BERT 0.0551, GENA-LM 0.0429, Nucleotide Transformer 0.0350.", "kw": ["RiNALMo", "HyenaDNA", "silhouette score"], "info": "RiNALMo separates best but has 650 M parameters (7.6 times more than lncRNA-BERT's 85 M) and a context under 1024 nt. ERNIE-RNA, RNABERT, RNAErnie and RNA-FM were left out because they were trained only on non-coding RNAcentral data.", "concl": "lncRNA-BERT is competitive and the most parameter-efficient. DNA NLMs, especially long-context HyenaDNA, show promise for RNA tasks."}, {"type": "qa", "section": "Discussion", "q": "Why didn't lncRNA-BERT clearly beat existing tools on human data?", "a": "Binary coding-potential classification may have hit a performance plateau. Even logistic regression (CPAT) reaches F1 0.89 on GENCODE/RefSeq.", "kw": ["performance plateau"], "info": "mRNA and lncRNA are not cleanly separable (lncRNAs encoding micro-peptides, mRNAs with lncRNA-like regulatory functions). So 100% accuracy is impossible without overfitting to the human annotation system.", "concl": "Because lncRNA-BERT works without annotations, it could support a more nuanced view of the two RNA classes in the future."}, {"type": "qa", "section": "Discussion", "q": "What do the authors conclude about encodings and pre-training data?", "a": "Both choices are critical. BPE's frequency-based vocabulary may not be biologically meaningful and breaks the three-base periodicity, while CSE compresses most strongly and keeps nucleotide resolution. Pre-training needs human mRNA and lncRNA data.", "kw": ["BPE", "CSE", "pre-training data"], "info": "They expect CSE to do better on tasks that need long context and nucleotide resolution, such as secondary structure or RNA-protein binding. They suggest de-redundancing RNAcentral (CD-HIT, MMSeqs2) and pre-training on a balanced set of all RNA types, including mRNA.", "concl": "The best encoding depends on the task. Finding a universal one needs systematic tests across many fine-tuning tasks."}, {"type": "qa", "section": "Discussion", "q": "What are the main limitations?", "a": "Compute limits meant they could not repeat training and evaluation over different splits, so there are no robust statistical estimates of performance. The model is also a black box, and it is unclear which sequence patterns drive classification.", "kw": ["explainability", "limitations"], "info": "They propose attention maps and Layer-Wise Relevance Propagation for future interpretability. They also suggest large centres train foundation models (possibly with federated learning) and smaller groups fine-tune them.", "concl": ""}, {"type": "note", "section": "Results - Benchmark against existing classifiers", "text": "The claim that lncRNA-BERT 'significantly outperformed all other methods' on RNAChallenge holds only for out-of-the-box tools. Retrained mRNN (0.392) and retrained CPAT (0.321) beat it there, and no significance test is reported. Also, ncRNA precision and recall are only about 0.05 on this set for all tools."}, {"type": "note", "section": "Discussion", "text": "The model is human-only, and lncRNAs are poorly conserved. How well would lncRNA-BERT classify novel transcripts in non-model fish (cavefish, zebrafish)? Would species-specific pre-training be needed, given how much worse it did on cross-species RNAChallenge?"}, {"type": "note", "section": "Results - Encoding methods", "text": "If 2304 nt is enough to call coding potential, is the signal mostly near the 5' end or the start codon? It is worth checking whether the 5' UTR length of a transcript affects misclassification."}], "key": "general/Romeijn_2026_ConnectSci_LncRNA-BERT", "shared": "Damir · 2026", "preprint": "https://doi.org/10.1101/2025.01.09.632168", "tags": [], "nostar": false, "source_note": ""}, {"id": "Miranda_2025", "title": "Selective remodelling of the adipose niche in obesity and weight loss", "category": "Human genetics", "link": "https://doi.org/10.1038/s41586-025-09233-2", "note": "", "source_pdf": "papers/general/Miranda_2025_Nature_adipose_niche_obesity.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What resource did this paper generate?", "a": "A spatially resolved single-nucleus atlas of human adipose tissue (AT) with 171,247 cells from 70 people. It covers leanness, obesity and therapeutic weight loss (WL).", "kw": ["snRNA-seq", "spatial transcriptomics", "adipose tissue"], "info": "It combines single-nucleus RNA-seq with Xenium in situ spatial transcriptomics. The total appears to include the primary cohort, a published atlas (Emont et al.) and the spatial cells.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What are the headline findings?", "a": "Metabolic, precursor and vascular cells are selectively vulnerable to senescence, and WL strongly reverses this. WL also reduces adipocyte hypertrophy and biomechanical constraint pathways and activates metabolic flux. It represses macrophage infiltration but does not fully reverse macrophage activation.", "kw": ["senescence", "weight loss", "macrophage activation"], "info": "The authors suggest that persistently primed macrophages could trigger weight regain and worsen metabolic dysfunction.", "concl": "WL reverses AT senescence and stress but leaves an immune memory of obesity."}, {"type": "qa", "section": "Introduction", "q": "What gap does the paper address?", "a": "WL clearly improves metabolic health, but the mechanisms by which it remodels AT are poorly understood. The molecular triggers, cell phenotypes and signalling pathways behind obese AT dysfunction in humans are also only partly known.", "kw": ["obesity", "AT remodelling"], "info": "Some AT responses to WL may be maladaptive and predispose people to weight regain.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What pathological AT remodelling happens in obesity?", "a": "Excess expansion limits AT flexibility and causes adipocyte hypertrophy, immune cell infiltration, pro-inflammatory cytokine release, impaired angiogenesis and fibrosis. Together these drive multiorgan inflammation, insulin resistance and metabolic disease.", "kw": ["adipocyte hypertrophy", "fibrosis", "inflammation"], "info": "Obesity affects more than one billion people. Increased AT mass is a main risk factor for type 2 diabetes, cardiovascular disease, some cancers and early death.", "concl": ""}, {"type": "qa", "section": "Results - Mapping AT remodelling dynamics", "q": "What was the primary cohort?", "a": "Single-nucleus RNA-seq of about 100,000 cells from people with extreme obesity (n = 25), sampled before and after WL surgery, plus healthy lean controls (n = 24). WL significantly improved metabolic parameters, but not back to the lean baseline.", "kw": ["bariatric surgery", "paired design"], "info": "Clinical traits measured were BMI, fasting insulin, HbA1c, HDL and diastolic blood pressure. 26 lean controls were recruited and 2 were removed.", "concl": ""}, {"type": "qa", "section": "Results - Mapping AT remodelling dynamics", "q": "Why abdominal subcutaneous AT?", "a": "Because it contributes to central obesity and has adverse metabolic effects compared with other subcutaneous AT depots.", "kw": ["subcutaneous AT"], "info": "Visceral AT was not studied. The authors list the single-depot focus as a limitation.", "concl": ""}, {"type": "qa", "section": "Results - Mapping AT remodelling dynamics", "q": "Which extra datasets were integrated?", "a": "About 50,000 nuclei from the largest published human subcutaneous adipose atlas (Emont et al.; 9 obese and 4 lean samples) were added to improve cell annotation. Spatial transcriptomics covered about 25,000 cells, with n = 4 per group.", "kw": ["Emont atlas", "data integration"], "info": "The integrated UMAP holds 145,452 cells: 74 primary samples and 13 Emont samples. Between-group exploratory analyses used the primary cohort.", "concl": ""}, {"type": "qa", "section": "Results - Mapping AT remodelling dynamics", "q": "How did tissue composition change in obesity?", "a": "Obese AT showed extensive immune cell infiltration, mainly macrophages but also lymphocytes. It also had fewer mature adipocytes, suggesting more cell death and/or failure to replenish adipocytes. WL mitigated these effects.", "kw": ["immune infiltration", "cell composition"], "info": "Cell-type proportions were correlated with clinical traits (Pearson, lean and obese samples only).", "concl": ""}, {"type": "qa", "section": "Results - Persistent macrophage activation", "q": "Which myeloid populations expand in obese AT?", "a": "Macrophages rose from a mean of 14% to 31%. Most of the increase was lipid-associated macrophages (LAMs; mature MYE2 and immature MYE3) expressing CD9, TREM2, LPL and LIPA. Classical monocytes (MYE5, VCAN) also increased, indicating constant recruitment from blood.", "kw": ["LAM", "TREM2", "CD9"], "info": "34,280 myeloid cells were clustered into MYE1 to MYE10. Marker patterns suggest a differentiation path from monocytes to immature and then mature LAMs.", "concl": ""}, {"type": "qa", "section": "Results - Persistent macrophage activation", "q": "What happens to tissue-resident macrophages (TRMs)?", "a": "TRMs (MYE1; LYVE1, FOLR2, MRC1) made up a smaller fraction in obesity. Neighbourhood graphs showed this was a relative, not absolute, reduction.", "kw": ["TRM", "LYVE1", "FOLR2"], "info": "Proliferating macrophages expressed MCP-1 (CCL2) together with both TRM and LAM markers. This supports low-level MCP-1-dependent expansion of both populations.", "concl": ""}, {"type": "qa", "section": "Results - Persistent macrophage activation", "q": "What LAM subtypes did they find?", "a": "LAM ST1 is adaptive, with a lysosomal and metabolic signature. LAM ST2 is maladaptive and inflammatory, expressing MHC II, NLRP3, TLR2 and TREM1. Inflammatory LAMs increased in obesity together with metabolic dysfunction.", "kw": ["TLR2", "TREM1", "NLRP3"], "info": "LAM abundance rose with metabolic dysfunction independent of adiposity. Adaptive LAMs gathered at crown-like structures (CLS, defined as 3 or more LAMs around transcriptionally empty adipocytes). Inflammatory LAMs were more often alone or in pairs.", "concl": ""}, {"type": "qa", "section": "Results - Persistent macrophage activation", "q": "What did flux modelling show for obese macrophages?", "a": "A global activation state seen only in obese macrophages: 1,495 of 1,895 reactions changed (binomial P = 3.1 x 10^-148). Glycolysis and respiration were both high, and the pentose phosphate pathway, TCA cycle, lipid synthesis and lipid oxidation were broadly activated.", "kw": ["COMPASS", "metabolic flux"], "info": "Fatty acid desaturation (FADS1, SCD) and mitochondrial beta-oxidation were activated. This fits with buffering and burning potentially toxic fatty acids. Activation was strongest in LAMs but also present in other myeloid classes.", "concl": ""}, {"type": "qa", "section": "Results - Persistent macrophage activation", "q": "How was the transcriptome-based flux prediction validated?", "a": "With SCENITH energetic profiling of macrophages from obese donors (n = 7). CD9+ LAMs had higher basal respiration and glycolytic capacity than FOLR2+ TRMs.", "kw": ["SCENITH", "HPG"], "info": "Reported P-values are 0.006 and 0.001 (paired t-test). The extracted text does not make clear which P-value belongs to which measure.", "concl": ""}, {"type": "qa", "section": "Results - Persistent macrophage activation", "q": "What does WL do to macrophages?", "a": "Myeloid cells fell from a mean of 31% to 18%, but the relative fractions of myeloid subtypes did not differ between obesity and WL. LAMs shifted towards less inflammatory subtypes, and inflammasome, cytokine and chemotaxis genes went down. Global metabolic activation was not fully reversed.", "kw": ["weight loss", "macrophage memory"], "info": "WL lowered fatty acid desaturases and acyl-CoA synthetases. Glycolysis, respiratory capacity and pentose phosphate flux increased, implying a switch to other energy sources as fatty acids decline. Network analysis showed WL improved inflammatory networks but not LAM transcriptional reprogramming.", "concl": "Obesity-induced myeloid cell states persist despite extensive WL."}, {"type": "qa", "section": "Results - Reduced lymphocyte infiltration", "q": "What happened to lymphocytes?", "a": "Obese AT had higher proportions of CD4+ and CD8+ T cells, NK cells and B cells, and WL reduced these. WL also downregulated lymphocyte activation and cytotoxicity genes (ETS1, SYTL3).", "kw": ["T cells", "ETS1", "SYTL3"], "info": "There were only 6,222 lymphoid cells (4%), so subclass-level changes could not be tested.", "concl": ""}, {"type": "qa", "section": "Results - Enhanced adipocyte metabolic flexibility", "q": "What mature adipocyte subpopulations were identified?", "a": "8 subpopulations (AD1 to AD8; 44,583 cells), including stressed AD3 (JUN/NFKBIZ-hi), lipogenic AD5 (PNPLA3/MOGAT1-hi), fibrotic AD6 (NOX4/LOX-hi) and beige AD8 (GATM-hi).", "kw": ["adipocyte heterogeneity", "JUN", "PNPLA3"], "info": "The others are AD1 basal, AD2 GRIA4-hi, AD4 intermediate and AD7 sphingolipid. Beige adipocytes were rare (1%) and did not differ between conditions.", "concl": ""}, {"type": "qa", "section": "Results - Enhanced adipocyte metabolic flexibility", "q": "How do adipocyte subtypes shift with obesity and WL?", "a": "Stressed and fibrotic adipocytes increased in obesity, while lipogenic AD5 unexpectedly decreased. WL cut stressed adipocytes from a mean of 55% to 14%, shifted fibrotic numbers lower and relatively increased lipogenic cells.", "kw": ["stressed adipocytes", "Milo"], "info": "Changes in the stressed and lipid biosynthetic populations were confirmed in the spatial data.", "concl": ""}, {"type": "qa", "section": "Results - Enhanced adipocyte metabolic flexibility", "q": "What does flux modelling show in adipocytes?", "a": "Obese adipocytes had defects in fatty acid and BCAA breakdown, suggesting impaired metabolic flexibility. WL caused a large global increase in flux: 1,485 of 1,895 reactions (binomial P = 1.4 x 10^-142).", "kw": ["BCAA catabolism", "metabolic flexibility"], "info": "The authors attribute the WL increase probably to negative energy balance.", "concl": ""}, {"type": "qa", "section": "Results - Enhanced adipocyte metabolic flexibility", "q": "What is lipid cycling and why does it matter here?", "a": "Lipid cycling is repeated breakdown and resynthesis of triglycerides. WL systematically increased both lipid synthesis and breakdown pathways, including DGAT2, which suggests WL may start triglyceride cycling. This process is highly energy-consuming and can quench toxic fatty acids.", "kw": ["triglyceride cycling", "DGAT2"], "info": "Activity scores and rate-limiting enzymes were compared across groups. WL also reversed BCAA catabolism defects, predicted to improve systemic BCAA clearance and insulin sensitivity. Lipid cycling was a feature of AD5, while AD3 had low metabolic turnover.", "concl": "WL engages cell-autonomous substrate cycling that may underlie better metabolic health."}, {"type": "qa", "section": "Results - Enhanced adipocyte metabolic flexibility", "q": "Which TFs drive WL-induced metabolic activation in adipocytes?", "a": "MLXIPL and SREBF1 ranked highly for triglyceride synthesis. Other top TFs were linked to redox biology and BCAA catabolism. 38 of 53 leading TFs overlapped human metabolic disease GWAS loci.", "kw": ["pySCENIC", "SREBF1", "MLXIPL"], "info": "The network analysis was limited to metabolic pathway genes. Leading TFs had P < 0.05 (Bonferroni) and more than 50 metabolic target genes. The main text spells it MLXILP, apparently a typo for MLXIPL as used in the figure.", "concl": ""}, {"type": "qa", "section": "Results - Enhanced adipocyte metabolic flexibility", "q": "How are biomechanics linked to adipocyte stress?", "a": "Obesity increased and WL decreased cytoskeletal tension, mechanotransduction, ECM and fibrosis genes (ACTA2, LOX, LOXL2, VGLL3). These genes were enriched in AD3 and AD6. Adipocyte size correlated positively with mechanosensitive, stress and fibrotic genes such as JUN, and negatively with homeostatic genes.", "kw": ["mechanotransduction", "VGLL3", "adipocyte size"], "info": "Sizes came from WGA-based segmentation: 4,850 lean, 3,315 obese and 3,909 WL adipocytes across 4 donors per group. Correlations were modest, so hypertrophy may be one of several factors or a driver within a degenerative cycle.", "concl": ""}, {"type": "qa", "section": "Results - Reversal of multicellular stress", "q": "What adipocyte progenitor (APC) subtypes were found?", "a": "Multipotent DPP4/CD55-hi progenitors (ASC/APC1), committed preadipocytes (APC2, APC3), adipogenesis-regulatory cells (APC4; KCNIP-hi, CD142/F3-hi) and profibrotic precursors (APC5; ADAM12-hi, POSTN-hi). APC3 had a stressed profile and higher NOCT.", "kw": ["APC", "NOCT", "DPP4"], "info": "NOCT may act as a restrictive gatekeeper of preadipocyte commitment. APC2 expressed late-stage maturation genes in one subregion.", "concl": ""}, {"type": "qa", "section": "Results - Reversal of multicellular stress", "q": "What role might HIF1A play in progenitors?", "a": "Stressed and profibrotic APCs expressed more HIF1A, which promotes fibrosis and suppresses adipogenesis in mice. WL downregulated hypoxia, profibrotic (TGF-beta) and anti-adipogenic (WNT) genes, and these cell numbers fell significantly.", "kw": ["HIF1A", "hypoxia", "TGF-beta"], "info": "In mice, HIF1A acts through PPARG phosphorylation. The authors conclude WL may relieve hypoxia-driven loss of differentiation capacity.", "concl": ""}, {"type": "qa", "section": "Results - Reversal of multicellular stress", "q": "Do vascular cells also have stressed states?", "a": "Yes. Capillary endothelial and mural cells each had basal and stressed profiles that changed in opposite directions with adiposity. Stressed endothelium (EC2) overexpressed APOLD1 and SNAI1, and stressed mural cells (Mu4) were enriched for ADAMTS1.", "kw": ["APOLD1", "SNAI1", "ADAMTS1"], "info": "These markers point to pathological neovascularisation, endothelial-to-mesenchymal transition, pericyte detachment and capillary loss. WL strongly reduced stressed vascular cells in both single-nucleus and spatial data.", "concl": ""}, {"type": "qa", "section": "Results - Reversal of multicellular stress", "q": "Is there a shared stress signature across cell types?", "a": "Yes. All stressed states (AD3, APC3, EC2, Mu4) upregulated a common set of 188 genes, with 15 genes commonly downregulated. This stress was highest in obesity but was also present in lean tissue, where it increased with age and metabolic dysfunction.", "kw": ["multicellular stress", "stress signature"], "info": "Proposed mediators are hypoxia, mechanical and oxidative stress, Gp130-mediated cytokines, DNA damage and cell cycle arrest.", "concl": ""}, {"type": "qa", "section": "Results - Reversal of multicellular stress", "q": "How did they test the DNA damage link in vitro?", "a": "They treated immortalised human adipose-derived stromal cells (iHASC) with etoposide. This reproduced the in vivo stress marker proteins (JUN, STAT3) and impaired adipocyte differentiation.", "kw": ["etoposide", "iHASC", "DNA damage"], "info": "Etoposide was given at 5 or 10 uM on days 1 to 5 of a 15-day differentiation. Differentiation was measured by Oil Red O staining.", "concl": ""}, {"type": "qa", "section": "Results - Altered tissue niches and cell crosstalk", "q": "Where are stressed cells located in tissue?", "a": "In 50-um bins, stressed cell states were generally enriched in high-stress zones, except stressed capillaries (EC2), which were spread throughout. Stress regions were strongly associated with immune cells (except TRMs and NK cells) and, unexpectedly, with arterial endothelial cells (EC4).", "kw": ["spatial zonation", "Xenium"], "info": "Bins were split into stress quantiles Q1 (low) to Q4 (high).", "concl": ""}, {"type": "qa", "section": "Results - Altered tissue niches and cell crosstalk", "q": "What tissue niches did they define?", "a": "Using proximity enrichment within 300 um, they found five niches: arterial, venous, adipocyte, stem and stress. Stem niches held multipotent ASC/APC1 and TRMs. Stress niches held AD3, APC3, LAMs, cMono, cDC2 and T cells.", "kw": ["tissue niche", "neighbourhood analysis"], "info": "No cell type was exclusive to one niche, so niches are gradations. Arterial ECs formed their own niche with APC3 and Mu4. Immune cells sat close to large veins and LAMs, possibly reflecting migration out of vessels towards CLS.", "concl": ""}, {"type": "qa", "section": "Results - Altered tissue niches and cell crosstalk", "q": "Which signals characterise the niches?", "a": "Adipocyte niches were enriched for adipokines and neurotrophic factors (ADIPOQ, LEP, NRXN3). Stem niches had WNT and ECM components (FN1, collagens, laminins). Stress and arterial niches had chemokines (CXCL2, CCL2, IL6) and stress cues (TGFB1, AREG, NAMPT, THBS1).", "kw": ["CellChat", "THBS1", "ADGRE5"], "info": "THBS1 (from AD3), ADGRE5 (pan-immune) and NAMPT (multicellular) were all amplified in obesity and reversed by WL. The Xenium panel lacked most ligand-receptor genes, so spatial data were imputed with ENVI.", "concl": ""}, {"type": "qa", "section": "Results - Repression of senescence", "q": "What genes did WL change in many cell types?", "a": "Genes changed by WL in 3 or more cell types were mostly downregulated: 213 of 333 (binomial P = 3.9 x 10^-7). They mapped to AT dysfunction pathways (TNFA and IFNG inflammation, hypoxia, fibrosis, immune recruitment, oxidative stress) and to cell cycle arrest.", "kw": ["differential expression", "cell cycle arrest"], "info": "Genes needed FC > 0.5 and P < 0.05 (Bonferroni). The cell cycle arrest signal led the authors to test senescence.", "concl": ""}, {"type": "qa", "section": "Results - Repression of senescence", "q": "What is the evidence that WL reverses senescence?", "a": "WL lowered CDKN1A (p21) and raised p21-repressed cell cycle progression genes in several cell types, and reduced senescence markers and scores. p21-positive cells were most common in stressed adipocyte, precursor and vascular states. WL almost completely removed them, while lean AT still had substantial (though fewer) p21+ cells.", "kw": ["p21", "CDKN1A", "senolytic"], "info": "This was confirmed by spatial transcriptomics and p21 immunohistochemistry (n = 5 lean, 4 obese, 4 WL). Repressed senescence tracked improved adipocyte energy metabolism.", "concl": "Human WL has previously undescribed, potent senolytic effects."}, {"type": "qa", "section": "Results - Repression of senescence", "q": "Which TF network controls the senescent, stressed state?", "a": "A tightly conserved network that increases in obesity and decreases with WL. It includes AP-1 factors, signal-dependent TFs that activate inflammation and SASP, Kruppel-like factors, ciliogenesis TFs (RFX2, RFX3), DNA damage-induced orphan nuclear receptors and several TFs not previously linked to senescence.", "kw": ["AP-1", "KLF", "SASP"], "info": "All 41 network TFs regulated themselves and they shared targets, including CDKN1A. The authors propose they cooperate in a degenerative cycle: stress, senescence, SASP, inflammation, tissue injury.", "concl": ""}, {"type": "qa", "section": "Results - Repression of senescence", "q": "What is the AT SASP and the role of NAMPT?", "a": "Comparing secreted proteins between stressed and basal states gave SASP candidates including AREG, ADAMTS1, OSMR, IL6ST and CXCL2, which localised to stress and arterial niches. NAMPT was strongly upregulated in senescent cells, obese macrophages and inflammatory LAMs. NAMPT protein rose in obesity and fell sharply with WL.", "kw": ["NAMPT", "visfatin", "SASP"], "info": "NAMPT drives SASP inside cells through the NAD salvage pathway and acts outside cells as the adipocytokine visfatin. Secreted proteins came from the Human Protein Atlas, with AREG added by hand.", "concl": "NAMPT is a likely driver of the AT SASP."}, {"type": "qa", "section": "Discussion", "q": "What is the main conclusion?", "a": "Metabolic, precursor and vascular cells, but not immune cells, are selectively susceptible to stress and senescence. This is amplified in obesity but also seen in ageing and metabolically unhealthy leanness. Reversing AT senescence may be central to the anti-inflammatory and metabolic benefits of WL.", "kw": ["senescence", "selective vulnerability"], "info": "They predict WL increases adipocyte metabolic flexibility, improves precursor differentiation and restores vasculature. MCL1 is highlighted as a possible therapeutic vulnerability.", "concl": "Reversal of AT senescence may underlie the multiorgan benefits of human WL."}, {"type": "qa", "section": "Discussion", "q": "Why is the WL metabolic activation surprising?", "a": "BCAA catabolism and lipid cycling both consume energy. This challenges the assumption that WL reduces energy expenditure, at least in AT, and suggests compensation elsewhere.", "kw": ["energy expenditure", "lipid cycling"], "info": "The authors say this needs further study. They propose substrate turnover affects insulin sensitivity and ectopic lipid.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why does persistent macrophage activation matter?", "a": "Obesity-induced macrophage states persist after WL and are probably epigenetically programmed. This could block full metabolic recovery, trigger weight regain and worsen long-term outcomes.", "kw": ["immune memory", "weight regain"], "info": "The TLR2-TREM1 inflammatory LAM signature resembles a proatherosclerotic LAM subtype. Mouse studies link AT immune and metabolic memory to weight regain. The epigenetic programming in human AT is inferred, not measured here.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What are the limitations?", "a": "WL was studied in its early phase, so the effects of negative energy balance, weight change and absolute fat mass cannot be separated. Other limits are the focus on people without diabetes, one abdominal subcutaneous depot and surgical WL, plus variable biopsy methods and incomplete capture of rare immune cells.", "kw": ["limitations"], "info": "Baseline samples were taken during surgery and follow-up samples by needle biopsy. The authors expect conserved but also context-dependent changes across depots and WL methods.", "concl": ""}, {"type": "qa", "section": "Methods - study design and samples", "q": "What were the WL interval, WL amount and inclusion criteria?", "a": "The WL interval was at least 5 months (median 7, range 5 to 18), and median WL was 22% (range 13 to 33%). Obese participants (BMI > 35) were having laparoscopic gastric bypass or sleeve. Lean controls (BMI < 26) were having non-bariatric laparoscopic abdominal surgery.", "kw": ["cohort", "bariatric surgery"], "info": "Participants were aged 20 to 70, from a multiethnic background and unrelated. Treated type 2 diabetes was excluded. Phenotyping was done after an overnight fast, and cases and controls were matched for age, sex and ethnicity.", "concl": ""}, {"type": "qa", "section": "Methods - single-nucleus sequencing and QC", "q": "How were nuclei isolated and pooled?", "a": "About 100 mg of frozen AT was homogenised with a dounce in lysis buffer containing 0.1% NP40. Nuclei from 4 to 5 participants of the same group were pooled (6 pools per group). Pools were cleaned of debris and doublets by DAPI-based FACS.", "kw": ["nucleus isolation", "FACS", "sample pooling"], "info": "Pools were processed in lean-obese-WL trios to reduce batch effects. Sorting used a BD FACS Aria SORP with an 85 um nozzle.", "concl": ""}, {"type": "qa", "section": "Methods - single-nucleus sequencing and QC", "q": "Which library chemistry and sequencing setup were used?", "a": "10x Chromium Single Cell 3' v3.1 with 5,000 to 10,000 nuclei per pool. Libraries were sequenced on an Illumina NextSeq2000 to more than 20,000 paired-end reads per nucleus.", "kw": ["10x Chromium", "CellRanger"], "info": "Read 1 was 28 bp and read 2 was 90 bp. Processing used CellRanger v5.0.1 and bcl2fastq v2.20.0, with alignment to GRCh38 (STAR) and introns counted. Sequencing ran in 3 balanced batches.", "concl": ""}, {"type": "qa", "section": "Methods - single-nucleus sequencing and QC", "q": "What QC filters and doublet removal were applied?", "a": "CellBender removed ambient RNA. Nuclei were then dropped if they had fewer than 1,000 UMIs or 400 genes, log10(genes per UMI) below 0.85, or mitochondrial/ribosomal fraction above 5%. Doublets were found with DoubletFinder, genotype-based Vireo and iterative clustering.", "kw": ["CellBender", "DoubletFinder", "sctransform"], "info": "CellBender settings were 150 to 200 epochs and learning rate 0.0001 to 0.00005. Data were processed in Seurat and normalised with sctransform v2.", "concl": ""}, {"type": "qa", "section": "Methods - single-nucleus sequencing and QC", "q": "How were pooled nuclei assigned to participants?", "a": "By genotype demultiplexing. Blood genotypes from Illumina OmniExpress-24 v1.2 were imputed, cell-level SNPs were called with cellsnp-lite (MAF > 0.05), and Vireo matched cells to participants.", "kw": ["Vireo", "cellsnp-lite", "IMPUTE2"], "info": "SNP QC removed call rate < 90%, MAF < 0.01, HWE P < 1e-6, sex-chromosome and duplicate SNPs, leaving 649,007 SNPs. Phasing used SHAPEIT v2.r900 and imputation used IMPUTE2 v2.3.2 with a 1000 Genomes phase 3 panel (5 Mb chunks, Ne = 20,000), giving 81,656,368 SNPs.", "concl": ""}, {"type": "qa", "section": "Methods - computational analyses", "q": "How were datasets integrated and cells annotated?", "a": "In Scanpy: Harmonypy corrected the PCA, BBKNN built batch-aware neighbourhoods and Leiden clustering found cell types (resolution 0.15). Each cell type was then reclustered twice, first at high resolution to flag mixed-lineage barcodes as unassigned, then at 0.65 or higher.", "kw": ["Scanpy", "Harmony", "BBKNN"], "info": "Myeloid cells needed resolution 2.25. Emont samples were reprocessed from raw counts and included only if whole tissue, nuclei, subcutaneous and BMI < 26 or > 30.", "concl": ""}, {"type": "qa", "section": "Methods - computational analyses", "q": "How were composition and differential expression tested?", "a": "Composition was tested with Milo neighbourhood differential abundance (neighbourhoods at least 90% one cell type, spatial FDR < 0.1). Differential expression used NEBULA negative binomial mixed models. Thresholds were P < 0.05 Bonferroni for paired obese-WL and FDR < 0.01 for lean-obese.", "kw": ["Milo", "NEBULA"], "info": "Mitochondrial and ribosomal fractions were technical covariates. Age, sex and ethnicity were covariates in lean-obese comparisons, and no biological covariates were used for paired samples. Results were repeated in the combined dataset.", "concl": ""}, {"type": "qa", "section": "Methods - computational analyses", "q": "How were metabolic flux and regulatory networks inferred?", "a": "Flux was modelled with COMPASS on per-sample mean expression for each cell type, comparing reactions by Wilcoxon test. Regulons came from pySCENIC on 20,000 nuclei per condition, using the ENCODE 2019/06/21 ChIP-seq hg38 refseq-r80 (10 kb up/down) database and requiring at least 5 targets.", "kw": ["COMPASS", "pySCENIC"], "info": "COMPASS covered 1,895 reactions in 83 pathways. Network scores were compared by Wilcoxon test (P < 0.05 Bonferroni). Note COMPASS infers flux from enzyme gene expression, not direct measurement.", "concl": ""}, {"type": "qa", "section": "Methods - computational analyses", "q": "How was cell-cell communication analysed?", "a": "With CellChat, run per condition on 20,000 barcodes each, using rankNet for differential signalling. For spatial niches, missing ligand-receptor genes were imputed with ENVI trained on single-nucleus data, repeated 10 times and averaged.", "kw": ["CellChat", "ENVI"], "info": "Cell-state communication was run without splitting by condition to keep rare states. Low-expressed imputed genes were removed.", "concl": ""}, {"type": "qa", "section": "Methods - spatial transcriptomics", "q": "How was the spatial experiment set up and analysed?", "a": "10x Xenium on 5 um FFPE sections, using the Human Multi-Tissue and Cancer Panel plus 100 custom genes, with transcripts of quality value above 35. Analysis used three approaches: segmentation-free 50-um bins, nucleus segmentation (transcripts within 2 um) for cell typing, and WGA-based boundary segmentation in ImageJ for adipocyte size.", "kw": ["Xenium", "CellTypist", "segmentation"], "info": "Bins needed more than 10 transcripts and nuclei more than 40. Adipocyte objects had to be 1,000 to 25,000 um2. Niches came from KDTree neighbour counts within 300 um, normalised to percentages because lean samples had about twice as many neighbours. LAM subtypes were transferred with CellTypist.", "concl": ""}, {"type": "qa", "section": "Methods - experimental validation", "q": "How did SCENITH measure macrophage metabolism?", "a": "Freshly digested AT cells were starved of methionine and treated with 2-DG (100 mM), oligomycin (2 uM) or both. HPG uptake was then read by click chemistry (AZDye 555) and spectral flow cytometry on a Sony ID7000.", "kw": ["SCENITH", "spectral flow cytometry"], "info": "Gating was live CD45+ cells, then FOLR2+ (TRM) versus CD9+ (LAM). HPG incorporation is a proxy for protein synthesis and energy use.", "concl": ""}, {"type": "qa", "section": "Methods - data availability", "q": "Where are the data and code?", "a": "Raw single-nucleus and spatial data are in GEO (GSE295708, GSE295862), and integrated objects are on the Single Cell Portal (SCP3116, SCP3117). Code is at github.com/WRScottImperial/WAT_single_cell_analysis_Nature_2024.", "kw": ["GEO", "Single Cell Portal"], "info": "The published Emont dataset is SCP1376 / GSE176171.", "concl": ""}, {"type": "note", "section": "Discussion", "text": "Is persistent macrophage activation after WL epigenetically programmed in humans, and does it actually predict weight regain? This needs longer follow-up and epigenomic data; it was not measured here."}, {"type": "note", "section": "Discussion", "text": "If WL activates energy-consuming lipid cycling and BCAA catabolism in adipocytes, where does the body compensate to lower total energy expenditure? These are flux predictions from gene expression and need direct measurement."}, {"type": "note", "section": "Results - Repression of senescence", "text": "Is senescence reversal a cause or a consequence of the metabolic benefits of WL? The early-phase design cannot separate negative energy balance, weight change and fat mass."}], "key": "general/Miranda_2025_Nature_adipose_niche_obesity", "shared": "", "preprint": "", "tags": ["Damir's paper"], "nostar": false, "source_note": ""}, {"id": "McAllan_2023", "title": "Integrative genomic analyses in adipocytes implicate DNA methylation in human obesity and diabetes", "category": "Human genetics", "link": "https://doi.org/10.1038/s41467-023-38439-z", "note": "", "source_pdf": "papers/general/McAllan_2023_NatCommun_adipocyte_DNA_methylation_obesity.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this paper address?", "a": "DNA methylation variations are prevalent in human obesity, but evidence that they cause disease is limited. The authors combine epigenome-wide association with integrative genomics to test the impact of adipocyte DNA methylation in human obesity.", "kw": ["DNA methylation", "obesity", "EWAS"], "info": "", "concl": "DNA methylation is an important determinant of human obesity and its metabolic complications."}, {"type": "qa", "section": "Abstract", "q": "How many loci were robustly associated with obesity?", "a": "In 190 samples they found 691 loci in subcutaneous and 173 loci in visceral adipocytes at P < 1 x 10-7.", "kw": ["sentinel 5mC"], "info": "Methylation variations were connected to transcriptomic changes at more than 500 target genes.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What causal evidence did they generate?", "a": "Through Mendelian Randomisation they inferred causal effects of methylation on obesity and obesity-induced metabolic disturbances at 59 independent loci.", "kw": ["Mendelian Randomisation"], "info": "Targeted methylation sequencing, CRISPR-activation and gene silencing added regional methylation detail, regulatory elements and cellular metabolic effects.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is blood a poor tissue for obesity methylation studies?", "a": "Obesity-associated DNA methylation changes in human blood are primarily a consequence rather than a cause of disease.", "kw": ["tissue selection"], "info": "Methylation in whole metabolic tissues also cannot be confidently linked to phenotype because of cellular and therefore epigenetic heterogeneity.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why study adipocytes specifically?", "a": "Adipocytes are the major cell type in adipose tissue and have roles in energy storage and expenditure, whole-body energy and glucose homoeostasis, and obesity and T2D pathogenesis.", "kw": ["adipocytes"], "info": "Adipocytes from different anatomical depots differ in methylation, transcriptome, function and impact on metabolic health; visceral adipocytes are considered more harmful than subcutaneous.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What proof-of-principle work motivated the study?", "a": "Experimental manipulation of DNA methylation enzymes in adipocytes can induce or prevent obesity and T2D through effects on energy expenditure and insulin sensitivity.", "kw": ["DNMT", "TET"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What were the three aims of the integrated genomic strategy?", "a": "To identify robust adipocyte methylation changes in extreme obesity, to predict the effector transcripts (cis-target genes) of these changes, and to infer the mechanisms underlying the methylation-expression relationships.", "kw": [], "info": "A subset of sites was then followed up with genetic association, targeted methylation sequencing and adipocyte genetic and epigenomic manipulation.", "concl": ""}, {"type": "qa", "section": "Methods - study design and samples", "q": "What was the study design and sample size?", "a": "Case-control DNA methylation analyses in 95 subcutaneous and 95 visceral adipocyte samples from people with extreme obesity and healthy controls, split into separate discovery and replication cohorts.", "kw": ["discovery", "replication"], "info": "44 participants in discovery and 42 in replication gave both subcutaneous and visceral samples; the rest came from distinct individuals. RNA sequencing was done in the replication cohort.", "concl": ""}, {"type": "qa", "section": "Methods - study design and samples", "q": "Who were the participants?", "a": "Morbidly obese individuals (mean BMI 44.8, sd 7.2 kg/m2) undergoing laparoscopic bariatric surgery and controls (mean BMI 24.9, sd 3.3 kg/m2) undergoing non-bariatric laparoscopic abdominal surgery.", "kw": ["BMI"], "info": "Aged 20-70, multi-ethnic, unrelated, matched for age within 3.5 years, sex and ethnicity. People with treated T2D were excluded because hypoglycaemic drugs can affect adipose metabolism.", "concl": ""}, {"type": "qa", "section": "Methods - study design and samples", "q": "How were adipocytes isolated?", "a": "Tissue was cut to 1-2 mm3, washed in HBSS, digested with type 1 collagenase (1 mg/ml) at 37 C shaking 100 rpm for about 30 min, filtered through 300-micron mesh and centrifuged at 500 g for 5 min at 4 C.", "kw": ["collagenase"], "info": "Floating mature adipocytes were collected after removal of the oil layer, washed three times and snap frozen at -80 C. Polypropylene plastics were used to minimise cell lysis.", "concl": ""}, {"type": "qa", "section": "Methods - methylation quantification", "q": "Which arrays were used and how was data processed?", "a": "Illumina Infinium HumanMethylation450 (96 discovery samples) and EPIC (96 replication samples) beadchips, processed with Minfi version 1.36.0 for signal retrieval and background correction.", "kw": ["Minfi", "EPIC"], "info": "Detection P >= 0.01 signals removed; samples with <95% detected CG sites excluded; quantile normalisation with limma. Methylation quantified 0-1.", "concl": ""}, {"type": "qa", "section": "Methods - methylation quantification", "q": "How did they control technical variation on the arrays?", "a": "Separate PCAs on the 450K and EPIC positive control probe intensities; the resulting principal components, which capture technical variability, were included as covariates.", "kw": ["control probe PCs"], "info": "The first 4 control probe PCs explained >95% of control probe technical variation.", "concl": ""}, {"type": "qa", "section": "Methods - RNA sequencing", "q": "How was RNA-seq done given poor RNA quality?", "a": "RIN values ranged 2.5 to 7.9 (median 5.8), so libraries were made with SMARTer Stranded Total RNA-Seq Kits (v2 Pico input), which use template switching and random priming for low-quality, low-input RNA.", "kw": ["SMARTer", "RIN"], "info": "10 ng total RNA input; libraries pooled at 4 nM; sequenced on HiSeq 4000 (16 lanes) to >80 million 100-bp paired-end reads per sample.", "concl": ""}, {"type": "qa", "section": "Methods - RNA sequencing", "q": "Which aligner and counting tools were used?", "a": "STAR version 2.6.0 against Ensembl GRCh37 v87 (options -outFilterMultimapNmax 20 -outFilterMismatchNoverReadLmax 0.04), with FeatureCounts (subread 1.6.2, options -M -fraction) for raw counts.", "kw": ["STAR", "FeatureCounts"], "info": "Samtools 1.9, Picard 2.18.12, RseQC 2.6.4 and MultiQC 1.9 for QC. After exclusions, 43 subcutaneous and 46 visceral samples and 24,187 genes remained.", "concl": ""}, {"type": "qa", "section": "Methods - EWAS", "q": "How many CG sites were tested and how were associations modelled?", "a": "401,595 single CG sites present on both 450K and EPIC arrays, tested by linear regression with obesity status as predictor and methylation as outcome.", "kw": ["linear regression"], "info": "44,101 probes were removed for cross-hybridisation or a common SNP in the probe. Covariates: age, sex, ethnicity and the first 4 control probe PCs. Discovery and replication combined by inverse variance weighted meta-analysis.", "concl": ""}, {"type": "qa", "section": "Methods - EWAS", "q": "What significance criteria defined a replicated locus?", "a": "FDR < 0.01 in discovery, then FDR < 0.01 in replication with consistent direction, plus combined P < 1 x 10-7 (epigenome-wide significance).", "kw": ["FDR", "EWS"], "info": "Markers within 5000 bp of each other were treated as one locus; the CG site with lowest P at each locus was the sentinel. 5 kb reflects known CpG island sizes.", "concl": ""}, {"type": "qa", "section": "Results - genome-wide alterations", "q": "How many obesity-associated sites were found in subcutaneous adipocytes?", "a": "4485 5mC sites at FDR < 1% in discovery, of which 905 replicated, giving 691 sentinel sites.", "kw": ["sentinels"], "info": "4363 of 4485 sites (97%) showed directional consistency in the replication sample (binomial sign test P < 1 x 10-300), suggesting these are only the strongest of a larger set.", "concl": ""}, {"type": "qa", "section": "Results - genome-wide alterations", "q": "How big were the methylation differences in subcutaneous adipocytes?", "a": "Median 5.8% difference between obese cases and controls (range 1.1-17.9%), with systematic hypomethylation in obese cases (binomial sign test P < 6.4 x 10-33).", "kw": ["hypomethylation"], "info": "More sentinels had intermediate (20-80%) methylation than low (<20%) or high (>80%).", "concl": ""}, {"type": "qa", "section": "Results - genome-wide alterations", "q": "Which loci had the largest differentially methylated regions?", "a": "RUNX3 (19 sites, 1174 bp), TBX5 (17 sites, 3187 bp) and ISLR2 (14 sites, 4050 bp) in subcutaneous adipocytes.", "kw": ["RUNX3", "TBX5", "ISLR2"], "info": "24 subcutaneous loci had at least 5 differentially methylated sites within 5 kb of the sentinel with consistent direction (Bonferroni adjusted P < 0.05).", "concl": ""}, {"type": "qa", "section": "Results - genome-wide alterations", "q": "What was found in visceral adipocytes?", "a": "445 sites at FDR < 1%, 220 replicated, giving 173 sentinels with median methylation difference 7.9% (range 2.9-21.5%), also preferentially hypomethylated in obesity (P = 3.8 x 10-7).", "kw": ["visceral"], "info": "Two visceral loci showed extended differential methylation: NFIA (5 sites, 2081 bp) and near ATG5 (5 sites, 831 bp). 440 of 445 sites (99%) were directionally concordant.", "concl": "Many fewer obesity-associated sites in visceral than subcutaneous adipocytes."}, {"type": "qa", "section": "Results - genome-wide alterations", "q": "Were the methylation differences driven by genetics or cell impurity?", "a": "No. Most sentinels remained associated after correction for genetic effects, fewer than 1% showed SNP-like methylation distributions, and adjusting for contaminating cell gene expression did not systematically change results.", "kw": ["Gaphunting", "SVA"], "info": "Purity was assessed with immune and stromovascular marker genes (PTPRC, CD68, ITGAM, CD14, CD19, CD4, CD8A, NCAM1, CD31, DLK1, CD34) and with surrogate variable analysis.", "concl": "The identified methylation differences are predominantly environmentally driven."}, {"type": "qa", "section": "Results - genome-wide alterations", "q": "How depot-specific were the changes?", "a": "Only 23 subcutaneous sentinels replicated in visceral adipocytes and 11 visceral sentinels in subcutaneous (consistent direction, Bonferroni P < 0.05).", "kw": ["depot specificity"], "info": "Directional concordance was weak: 374 of 671 subcutaneous in visceral (P = 0.003) and 105 of 173 visceral in subcutaneous (P = 0.006). In 538 whole subcutaneous adipose samples, 80% of subcutaneous versus 21% of visceral sentinels were enriched for BMI association.", "concl": "Most extreme obesity-associated methylation changes are adipose depot specific."}, {"type": "qa", "section": "Results - genomic annotation", "q": "Where in the genome did the subcutaneous sentinels sit?", "a": "They were significantly enriched in adipose tissue and adipocyte enhancers (Roadmap chromatin states, Reg2Map, FANTOM5) and in GeneHancer-predicted enhancers, and under-represented at promoter CpG islands.", "kw": ["enhancers", "GeneHancer"], "info": "Hypomethylated sentinels were also weakly enriched at regions flanking active TSS, bivalent enhancers and polycomb repressed regions; hypermethylated sentinels were enriched in actively transcribed genic regions.", "concl": "Obesity-associated methylation localises to cis-regulatory regions rather than CG-dense housekeeping promoters."}, {"type": "qa", "section": "Results - genomic annotation", "q": "Did the sentinel regions overlap obesity GWAS signals?", "a": "There was no evidence of enrichment, but 11 loci contained variants associated with BMI, 8 with waist-hip ratio adjusted for BMI and 4 with T2D at P < 5 x 10-8.", "kw": ["GWAS"], "info": "These included NRXN3 (BMI/adiposity), TBX15 (WHR) and TCF7L2 (T2D). Limited power and the known modest EWAS-GWAS overlap are offered as explanations.", "concl": ""}, {"type": "qa", "section": "Results - target genes", "q": "How were sentinel sites assigned to target genes?", "a": "Three ways: direct overlap for sentinels in promoters (within 5 kb), 5/3'UTRs and exons; functional assignment of intronic/intergenic sentinels using adipocyte promoter capture Hi-C and GeneHancer; and otherwise all genes within a shared adipocyte TAD.", "kw": ["promoter capture Hi-C", "TAD"], "info": "TADs were called with Arrowhead at 25-kb resolution from day 3 adipocyte differentiation Hi-C, giving 5323 domains of median 425 kb (range 125 kb to 4025 kb). Median 7 (range 1-46) target genes per TAD-assigned sentinel.", "concl": ""}, {"type": "qa", "section": "Results - target genes", "q": "How many methylation-expression associations were found at genic sentinels?", "a": "121 subcutaneous sentinels were associated with 126 unique cis-genes and 29 visceral sentinels with 32 cis-genes at FDR < 0.01.", "kw": ["cis-genes"], "info": "P ranges 9.1 x 10-3 to 1.9 x 10-24 (subcutaneous) and 4.6 x 10-3 to 1.6 x 10-12 (visceral). Effects on transcription were predominantly negative (binomial P = 0.004).", "concl": ""}, {"type": "qa", "section": "Results - target genes", "q": "How many distal and TAD-based associations were found?", "a": "84 subcutaneous and 14 visceral sentinels were linked to 135 and 16 distal target genes; 91 subcutaneous sentinels to 177 cis-genes and 21 visceral sentinels to 34 cis-genes within shared TADs (all FDR < 0.01).", "kw": [], "info": "Functionally assigned sentinels were enriched in enhancers (subcutaneous 1.8-fold, P = 8.4 x 10-4 in adipocytes), whereas TAD-assigned sentinels were enriched in polycomb repressed regions (1.5-fold, P = 0.007).", "concl": "Genomic context-specific regulatory mechanisms underlie the methylation-expression associations."}, {"type": "qa", "section": "Results - target genes", "q": "Were the target genes themselves differentially expressed in obesity?", "a": "Yes: 34% of subcutaneous target genes (background 6%, binomial P = 7 x 10-75) and 32% of visceral target genes (background 9%, P = 6 x 10-37) were differentially expressed at FDR < 0.01.", "kw": ["DESeq2"], "info": "Verified in GTEx whole adipose tissue (663 subcutaneous and 541 visceral samples) with consistent depot-specific enrichment against BMI.", "concl": ""}, {"type": "qa", "section": "Results - target genes", "q": "Which biologically notable target genes were identified?", "a": "Insulin signalling and metabolism genes such as IRS2, ADIPOR2, PLIN5, FABP3, SOCS3, RBP4 and AKT3 (subcutaneous), and KLF6, TULP3, DOC2B, ACOT11, PRKD2, SLC22A3 and KIF5C (visceral).", "kw": ["IRS2", "KLF6"], "info": "Also browning/beigeing genes PRDM16, EBF2, FGF9 and IL10RA, and neurite/axon genes NRN1, SEMA6B, SEMA4B, NRXN3. Most potential effector genes have unknown adipocyte functions.", "concl": ""}, {"type": "qa", "section": "Results - target genes", "q": "What novel micro-RNA finding was reported?", "a": "Methylation of the shared promoter of the MIR23A, MIR24-2 and MIR27A cluster in subcutaneous adipocytes was associated with expression of this adipogenesis-implicated cluster.", "kw": ["MIR27A", "adipogenesis"], "info": "Lower methylation in obesity was linked to increased expression of the cluster, whose members inhibit PPARG signalling, suppress adipogenesis and induce insulin resistance.", "concl": ""}, {"type": "qa", "section": "Results - pathway enrichment", "q": "Which pathways were enriched for genes near the sentinels?", "a": "Subcutaneous nearest genes were enriched in growth and development, inflammatory, metabolic and apoptosis pathways including TLR4 signalling, sphingolipid binding and vitamin D metabolism (FDR < 0.01 empirical).", "kw": ["TLR4", "MSigDB"], "info": "Visceral nearest genes were over-represented in endoderm development, body pattern formation and cell motility. gProfiler analyses of associated cis-genes highlighted transcriptional control and cell/tissue development gene sets.", "concl": "Target genes map to canonical enhancer functions: cell lineage and fate, tissue development, inflammation and metabolism."}, {"type": "qa", "section": "Results - transcription factors", "q": "How were transcription factor motifs identified at the sentinels?", "a": "De novo motif enrichment with Homer version 4.11.1 (findMotifsGenome.pl) in the plus/minus 150 bp around each sentinel, using permuted sentinel-matched regions and GC-matched regions as backgrounds.", "kw": ["Homer"], "info": "At each motif the 10 best-matching TFs were taken and then restricted to those expressed in the adipocyte RNA-seq data (counts >= 5 in >= 20% of samples).", "concl": ""}, {"type": "qa", "section": "Results - transcription factors", "q": "How many motifs were enriched and in which depot?", "a": "Seven distinct motifs were enriched around the subcutaneous sentinels (P range 1 x 10-9 to 1 x 10-13); 5 at hypomethylated and 2 at hypermethylated sentinels, with a median of 28 (range 16-86) sentinels per motif.", "kw": ["motif enrichment"], "info": "49 TFs able to bind these motifs were expressed in subcutaneous adipocytes (median 8, range 4-11 per motif). No visceral motif reached the stringent de novo threshold.", "concl": ""}, {"type": "qa", "section": "Results - transcription factors", "q": "Which motifs sat in which chromatin states?", "a": "Motif 1 was preferentially at tissue-specific enhancers, Motif 4 at regions flanking active TSS, and Motif 5 at both enhancers and active TSS flanking regions.", "kw": ["Roadmap chromatin states"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - transcription factors", "q": "What evidence suggested TF binding alters methylation?", "a": "TF expression correlated with sentinel methylation at each motif, most strongly for HOXA11 and HOXA13 (Motif 7), with weaker correlations for ATF3, FOSL1, JUN, SNAI1, KLF3/4/5, ELF1, ELK1, RUNX1, RUNX3, SPI1, SOX4, SOX6 and SOX10.", "kw": ["HOXA13", "KLF4"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - transcription factors", "q": "What evidence suggested methylation alters TF activity?", "a": "Motifs 2 and 4 contained CG sites in their binding sequences, Motif 4 was strongly enriched for genomic CG sites, and adjusting for sentinel methylation changed TF-target gene co-expression, most strongly for ELK1, ELK3 and ELF4.", "kw": ["ELK1", "ELF4"], "info": "ELK1 and ELF4 have been shown to be methylation-sensitive in vitro. Array coverage of CG sites around motifs was sparse (median 22%, IQR 14-33%), limiting direct testing.", "concl": "DNA methylation and TFs may act reciprocally at obesity-associated regulatory sites."}, {"type": "qa", "section": "Methods - Mendelian Randomisation", "q": "Why was whole adipose tissue used for the MR instruments?", "a": "They used 588 whole subcutaneous adipose tissue samples from Twins UK rather than isolated adipocytes to increase power to find independent cis-SNPs associated with each sentinel.", "kw": ["Twins UK", "mQTL"], "info": "Cis-SNPs within 500 kb, clumped at LD R2 < 0.01, Bonferroni-corrected P < 0.05 to reduce weak instrument bias. mQTLs called in MatrixEQTL version 2.1.0; MR run with TwoSampleMR version 0.5.1.", "concl": ""}, {"type": "qa", "section": "Methods - Mendelian Randomisation", "q": "Which GWAS were used as outcomes?", "a": "BMI (GIANT, N up to 795,640), WHR adjusted for BMI (GIANT, N up to 694,649), T2D and T2D adjusted for BMI (DIAGRAM, N up to 231,422), fasting glucose and insulin (MAGIC, N up to 138,589), HbA1c (MAGIC, N up to 159,940) and lipids (Global Lipids Genetics Consortium).", "kw": ["GIANT", "DIAGRAM"], "info": "Wald Ratio for single-SNP instruments, inverse variance weighted for multiple SNPs; Steiger directionality test for cause-consequence direction; both required at FDR < 0.01.", "concl": ""}, {"type": "qa", "section": "Results - causal inference", "q": "How many loci showed causal effects on obesity traits?", "a": "Causal effects on BMI at 10 subcutaneous and 4 visceral loci, on WHR at 12 loci, on T2D at 4 loci, and on fasting glucose, insulin and HbA1c at 3 loci (all subcutaneous).", "kw": ["Steiger test"], "info": "Only 191 subcutaneous and 34 visceral sentinels had significantly associated cis-SNPs, so causation could not be assessed at most sites.", "concl": "Causal effects were inferred at up to 28 independent loci for adiposity and metabolic traits, plus 31 further lipid loci."}, {"type": "qa", "section": "Results - causal inference", "q": "Which sites were causally linked to several phenotypes?", "a": "cg26906217 (BMI and WHR, near PIK3C2A), cg15809217 (WHR, T2D and fasting insulin, linked to PRRC2A expression) and cg05941027 (BMI, WHR and T2D, linked to LIMD2 expression in visceral adipocytes).", "kw": ["PRRC2A", "LIMD2"], "info": "cg21681030 was causally associated with BMI and with expression of RHOQ, a glucose receptor trafficking gene.", "concl": ""}, {"type": "qa", "section": "Results - causal inference", "q": "What did the MR sensitivity analyses show?", "a": "Of 44 loci with at least 3 correlated instrument SNPs, 30 replicated by MR IVW and 10 by the less powerful MR Egger; only 11 loci violated the assumption of no horizontal pleiotropy (MR Egger intercept P < 0.05).", "kw": ["horizontal pleiotropy"], "info": "Of 61 whole-adipose cis-SNPs, 21 replicated in adipocytes at P < 0.05 (binomial P = 8.2 x 10-13) and 50 had consistent direction (P = 4.6 x 10-7).", "concl": ""}, {"type": "qa", "section": "Methods - functional screens", "q": "How were PRRC2A and LIMD2 silenced?", "a": "3T3-L1 mouse pre-adipocytes were differentiated and reverse transfected at day 2 with two Silencer Select siRNAs per target (Prrc2a s79278/s79279; Limd2 s85672/s85674) or a non-silencing control, then assayed at day 6.", "kw": ["3T3-L1", "siRNA"], "info": "Lipid accumulation measured by Oil Red O eluted at 500 nm and normalised to crystal violet cell number; qPCR normalised to the geometric mean of Nono and Ywhaz. Each siRNA was also tested alone to exclude off-target effects, with cell viability checked by RealTime-Glo.", "concl": ""}, {"type": "qa", "section": "Results - functional screens", "q": "What happened when Prrc2a or Limd2 was knocked down?", "a": "Both knockdowns significantly reduced lipid accumulation during adipocyte differentiation (Prrc2a P = 3.5 x 10-5, Limd2 P = 0.0047), with a more marked effect for Prrc2a.", "kw": ["Oil Red O", "adipogenesis"], "info": "Results were independently replicated because adipocyte differentiation models are prone to variability.", "concl": ""}, {"type": "qa", "section": "Results - functional screens", "q": "How did the two knockdowns differ mechanistically?", "a": "Prrc2a knockdown consistently reduced Pparg, the master adipogenic transcription factor, and the lipid metabolism and insulin signalling genes it regulates, while Limd2 silencing did not change Pparg.", "kw": ["Pparg"], "info": "Limd2 silencing instead altered fat mobilising and lipid synthesis genes, but inconsistently across replicates.", "concl": ""}, {"type": "qa", "section": "Methods - targeted methylation sequencing", "q": "How was the targeted methylation sequencing done?", "a": "TWIST Bioscience Methylation Detection System with a custom panel covering 71 genomic regions (58.9 kb), on 94 adipocyte samples (23 obese and 24 control per depot), aiming for median coverage >100X.", "kw": ["TWIST", "EM-seq"], "info": "20 ng DNA fragmented to ~265 bp, enzymatic methylation conversion (NEB EM-seq), sequenced 100-bp paired-end on NovaSeq 6000 (pilot) and NextSeq 2000 P2. Aligned with bwameth 0.2.5, methylation called with MethylDackel (--minDepth 10 --maxVariantFrac 0.25).", "concl": ""}, {"type": "qa", "section": "Results - fine-mapping", "q": "What threshold defined differential methylation in the targeted sequencing?", "a": "A change greater than 5% at P < 0.05 at sites tagged by robust sentinel associations, chosen because targeted sequencing lacked the precision of arrays or whole-genome bisulphite sequencing.", "kw": [], "info": "Sentinels were enriched for obesity association in the sequencing data and effect sizes were highly concordant with the arrays.", "concl": ""}, {"type": "qa",
