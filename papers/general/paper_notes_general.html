logenetic relationships", "q": "Which relationships within Cyprinoidei were consistently supported?", "a": "Cyprinidae is sister to Psilorhynchidae in every dataset. Leptobarbidae and Xenocyprididae are successive sister groups to the clade Acheilognathidae, Gobionidae, Leuciscidae, Tanichthyidae and Tincidae.", "kw": ["Cyprinoidei", "Cyprinidae", "Psilorhynchidae"], "info": "These results agree with earlier molecular studies.", "concl": ""}, {"type": "qa", "section": "Results - Conflicting phylogenetic relationships", "q": "What are the three main zones of conflict in the tree?", "a": "(1) The early branching order of the four suborders. (2) The base of Cyprinoidei, specifically where Danionidae sits. (3) The relationships among Acheilognathidae, Gobionidae, Leuciscidae, Tanichthyidae and Tincidae.", "kw": ["incomplete lineage sorting", "short internal branches"], "info": "These regions show ILS, which is typical of very short internal branches and/or rapid diversification. The third zone had some of the lowest gCF and sCF values in the whole tree.", "concl": ""}, {"type": "qa", "section": "Results - Conflicting phylogenetic relationships", "q": "How do concatenation and coalescent methods differ on the suborder relationships?", "a": "Gyrinocheiloidei is sister to all other Cypriniformes in all concatenated and most coalescent trees. Concatenation puts Catostomoidei as sister to Cobitoidei+Cyprinoidei. No coalescent tree supports that; they mostly give Catostomoidei+Cobitoidei as sister to Cyprinoidei.", "kw": ["Gyrinocheiloidei", "Catostomoidei", "concatenation vs coalescent"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Conflicting phylogenetic relationships", "q": "Which alternative placements of Danionidae appeared at the base of Cyprinoidei?", "a": "Three placements, with Paedocyprididae excluded: (i) sister to all other Cyprinoidei, (ii) sister to Cyprinidae+Psilorhynchidae, or (iii) sister to all other Cyprinoidei except Cyprinidae+Psilorhynchidae.", "kw": ["Danionidae"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Zebrafish relatives", "q": "How well is Danionidae (the zebrafish family) sampled?", "a": "Danionidae has about 364 species in 39 genera. The study samples 34 genera, about 87% of all valid genera.", "kw": ["Danionidae", "zebrafish"], "info": "The authors call it one of the most comprehensive phylogenomic frameworks for the family so far, useful for comparative evolutionary and developmental work.", "concl": ""}, {"type": "qa", "section": "Results - Zebrafish relatives", "q": "Where does Danionella sit, and how do the Danionidae subfamilies relate?", "a": "Danionella is always sister to the rest of Danioninae, even though its rate is strongly elevated. Chedrinae is always sister to Danioninae, and that clade is sister to Rasborinae+Esominae or to Rasborinae alone in most analyses.", "kw": ["Danionella", "Danioninae", "Esominae"], "info": "Esominae moved between analyses: sister to Rasborinae in most concatenated and several coalescent trees, sister to the rest of Danionidae in others.", "concl": "A stable, close relationship between Danionella and Danio rerio gives a framework for comparative developmental genomics and the study of miniaturization."}, {"type": "qa", "section": "Results - Rate variation in progenetic miniatures", "q": "What is progenetic miniaturization?", "a": "Extreme developmental truncation, in which larval-like morphology is kept into adulthood. In Cypriniformes, four genera show it: Paedocypris, Danionella, Sundadanio and Fangfangia.", "kw": ["progenetic miniaturization", "developmental truncation"], "info": "These genera also show remarkable morphological innovation.", "concl": ""}, {"type": "qa", "section": "Results - Rate variation in progenetic miniatures", "q": "Do the miniature lineages evolve faster at the molecular level?", "a": "Yes. All four, especially Paedocypris and Danionella, had markedly higher substitution rates, measured as root-to-tip distances in rooted concatenated trees, in every dataset.", "kw": ["root-to-tip distance", "rate heterogeneity", "substitutional saturation"], "info": "Rate heterogeneity can cause LBA or increase saturation and erode phylogenetic signal. So the authors tested placements with CAT-GTR, RY-recoding and alternative outgroups.", "concl": ""}, {"type": "qa", "section": "Results - Position of Fangfangia", "q": "Where does Fangfangia spinicleithralis belong?", "a": "It is sister to Sundadanio in all datasets, with high statistical support and high gCF and sCF. This confirms a hypothesis that was previously based only on morphology.", "kw": ["Fangfangia", "Sundadanio", "Sundadanionidae"], "info": "It had never been in any genetic database before and was known only from its original morphological description.", "concl": "This is the first molecular confirmation of the Fangfangia+Sundadanio sister relationship."}, {"type": "qa", "section": "Results - Sundadanionidae and ILS", "q": "Where is Sundadanionidae placed, and how well supported is that?", "a": "In all datasets it is sister to the clade Leptobarbidae, Xenocyprididae, Acheilognathidae, Gobionidae, Leuciscidae, Tanichthyidae and Tincidae. Support is strong, but the internal branch is very short.", "kw": ["Sundadanionidae", "short internal branch"], "info": "Gene-level residual discordance was high in all analyses (psi4 > 78.5%). At site level, UCE, BUSCO.NT.C12, BUSCO.AA and MALMSTROM.AA had discordance psi2 = 47 to 67% above concordance psi1 = 19 to 33%. Quartet values were fairly even (psi1 = 34 to 40%, psi2 = 30 to 34%), and UCE was higher (psi1 = 42%).", "concl": ""}, {"type": "qa", "section": "Results - Sundadanionidae and ILS", "q": "What did hypothesis testing show for Sundadanionidae?", "a": "Across 8,208 constrained ML searches, GGI ranked H2 (sister to the Leptobarbidae-to-Tincidae group) highest, then H1 (with Danionidae), then H3. No hypothesis clearly dominated, and over 94% of loci did not significantly distinguish the alternatives.", "kw": ["GGI", "deltaGLS", "AU test"], "info": "Pairwise deltaGLS showed no strong outlier loci and balanced support. The placement did not change under CAT-GTR or RY-recoding, and gene properties did not differ between hypotheses.", "concl": "The conflict looks like genuine biological signal, from ILS during a rapid early radiation, rather than LBA or compositional artifacts."}, {"type": "qa", "section": "Results - Paedocyprididae placement", "q": "Where is Paedocyprididae placed?", "a": "In most analyses it is sister to all other Cyprinoidei, with strong support. Only the ASTRAL-IV and wASTRAL trees from the HUGHES.NT.C123 and MALMSTROM.NT.C123 datasets put it as sister to all other Cypriniformes.", "kw": ["Paedocypris", "Paedocyprididae"], "info": "Its internal branch was longer than that of Sundadanionidae in all datasets.", "concl": ""}, {"type": "qa", "section": "Results - Paedocyprididae placement", "q": "How much gene-tree conflict is there at the Paedocyprididae branch?", "a": "A lot. In HUGHES and MALMSTROM the residual discordance was over 79.8% and gene concordance was only psi1 = 4.5 to 10.8%. UCE was much more concordant (psi1 = 50.4%, psi4 = 38.8%).", "kw": ["concordance vectors"], "info": "At site level, discordance (psi2 = 34.7 to 64.9%) mostly exceeded concordance (psi1 = 20 to 33%). Quartet concordance was moderate to high (psi1 = 38.9 to 66.9%), highest for UCE.", "concl": ""}, {"type": "qa", "section": "Results - Paedocyprididae placement", "q": "What did GGI and deltaGLS show for Paedocyprididae?", "a": "Across 12,265 constrained ML analyses, H2 (Cyprinoidei monophyletic without Paedocyprididae) ranked highest in the H1 to H3 set, and H4 (Cypriniformes monophyletic without Paedocyprididae) ranked highest in the H1, H4, H5 set. Over 91% of loci were nonsignificant, so per-locus support was weak.", "kw": ["GGI", "deltaGLS"], "info": "deltaGLS: more loci favored H2 and H4. Between H1 and H3/H5, a modest majority favored H1. Gene properties did not differ, so there was no sign of locus-specific bias.", "concl": ""}, {"type": "qa", "section": "Results - Paedocyprididae placement", "q": "Is the Paedocyprididae placement an LBA or GC-content artifact?", "a": "There is no evidence for it. Paedocyprididae has markedly higher GC content that resembles the outgroups (possible compositional convergence). Still, its position as sister to the rest of Cyprinoidei stayed the same under CAT-GTR, RY-recoding, and with the high-GC outgroups removed.", "kw": ["GC content", "compositional convergence", "long-branch attraction"], "info": "In the reduced outgroup sets, only outgroups with GC content similar to Cypriniformes were kept (Clupeiformes and Siluriformes, or Siluriformes alone).", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What explains the persistent conflict zones?", "a": "The conflict sits on extremely short internodes with heterogeneous gene histories, which fits ILS from rapid successive speciation under the multispecies coalescent. Because this appears at both deep and shallow levels, the order may have gone through repeated bursts of diversification.", "kw": ["multispecies coalescent", "incomplete lineage sorting", "rapid radiation"], "info": "Ancestral polymorphisms persist through successive splits before fixation, which makes gene genealogies vary stochastically.", "concl": "Most topological conflict in Cypriniformes likely reflects biological processes (rapid divergence and ILS), not methodological artifacts."}, {"type": "qa", "section": "Discussion", "q": "Why might miniature lineages evolve faster?", "a": "The authors suggest it may reflect differences in life history, genome architecture, or metabolic constraints linked to extreme miniaturization and developmental truncation.", "kw": ["rate heterogeneity", "miniaturization"], "info": "This is speculative and was not tested in this paper.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How do the Sundadanionidae and Paedocyprididae problems differ?", "a": "For Sundadanionidae, balanced gene-tree support and very short internodes point to ILS during a rapid early radiation. For Paedocyprididae, the placement holds up under tests for LBA and composition, so its recalcitrance looks like weak, conflicting signal rather than a systematic-error artifact or ILS.", "kw": ["ILS", "LBA", "recalcitrant nodes"], "info": "", "concl": "Conflict within one radiation can come from distinct sources that produce superficially similar patterns."}, {"type": "qa", "section": "Discussion", "q": "What limitations and future directions do the authors name?", "a": "Genome-scale sequence data may still fail to resolve recalcitrant nodes. Progress may come from models that include recombination landscapes, from rare genomic changes or conserved synteny made possible by chromosome-level assemblies, and from new morphological data on early developmental stages.", "kw": ["synteny", "rare genomic changes", "chromosome-level assemblies"], "info": "Noise and systematic error in these newer approaches are still largely unexplored. They have already been applied to the early branching of the suborders (MacGuigan et al. 2026).", "concl": ""}, {"type": "qa", "section": "Methods - Taxon sampling", "q": "What new genomic data were generated?", "a": "New data for 257 species: Illumina short reads for 253, and PacBio HiFi long reads for 4 (Paedocypris sp. Kalimantan Tengah, Sundadanio atomus, Boraras brigittae and Rasbora kalochroma).", "kw": ["PacBio HiFi", "Illumina"], "info": "All four PacBio species live in Southeast Asian peat swamp blackwaters. Paedocypris and Sundadanio are progenetic miniatures, B. brigittae is a proportioned dwarf, and R. kalochroma is not miniature. The taxonomy came from the Catalog of Fishes (accessed 1 December 2020), compared with Tan and Armbruster 2018.", "concl": ""}, {"type": "qa", "section": "Methods - Taxon sampling", "q": "Which families get whole-genome data for the first time?", "a": "Barbuccidae, Ellopostomatidae, Leptobarbidae and Psilorhynchidae. Fangfangia spinicleithralis also gets its first molecular data.", "kw": ["Fangfangia"], "info": "Overall, the sampling covers about 30% of the roughly 527 described Cypriniformes genera.", "concl": ""}, {"type": "qa", "section": "Methods - Sequencing", "q": "How were the samples sequenced?", "a": "Illumina: DNA from museum specimens (DNeasy), TruSeq PCR-free libraries (or TruSeq Nano for under 1,000 ng), PE150 on NovaSeq 6000. Depth targeted about 30x for diploids and 60x for polyploids, assuming a 1 Gb genome.", "kw": ["NovaSeq 6000", "PacBio Revio", "Sequel IIe"], "info": "PacBio: HMW DNA from Qiagen Genomic-tips. Paedocypris had 6 to 7 kb inserts on Sequel IIe; the other three had 10 to 12 kb inserts on Revio. Sequencing was at the NGS Platform, University of Bern, except 15 Indian species at Agrigenome Labs.", "concl": ""}, {"type": "qa", "section": "Methods - QC and genome assembly", "q": "How were the short-read genomes assembled?", "a": "Reads were trimmed in two rounds with fastp (adapters, dedup, polyG/X, then a sliding window at Q20, window size 4). k-mer profiling used KMC 3 and GenomeScope 2.0 (k = 21 and 31). Assemblies were made with ABySS 2.0 (k = 90, kc = 2, chosen after testing k = 70 to 95 on 20 species) and SPAdes (default settings).", "kw": ["ABySS", "SPAdes", "compleasm"], "info": "Quality was checked with QUAST and BUSCO via compleasm (actinopterygii_odb10, n = 3,640). For each species, the assembly with the higher complete single-copy BUSCO score was kept.", "concl": ""}, {"type": "qa", "section": "Methods - QC and genome assembly", "q": "How were the PacBio HiFi genomes assembled?", "a": "Following the VGP standard workflow: HiFiAdapterFilt for cleaning, Meryl and GenomeScope 2.0 for k-mers, hifiasm in solo mode with light purge to get primary and alternate contigs, then two rounds of purge_dups to remove haplotypic duplications.", "kw": ["hifiasm", "purge_dups", "Merqury"], "info": "Quality was checked with Merqury (QV, k-mer completeness), QUAST and BUSCO. Full details are in a separate paper (Sudasinghe et al. 2026a).", "concl": ""}, {"type": "qa", "section": "Methods - Taxonomic validation", "q": "How did they check species identity and contamination?", "a": "They assembled mitogenomes with MITObim (carp or zebrafish reference), annotated them with MITOS, and BLASTed the roughly 650 bp cox1 barcode (or cytb) against NCBI, then built NJ trees. A match of at least 95% identity counted as correct. Samples where cox1 and cytb disagreed were treated as contaminated and removed.", "kw": ["MITObim", "cox1", "cytb"], "info": "Samples with hits below 95%, or with a mismatching identity, were rechecked with the taxonomic experts who provided them.", "concl": ""}, {"type": "qa", "section": "Methods - Dataset curation", "q": "How was the final set of 335 species reached?", "a": "389 assemblies were combined: new data, 95 public Cypriniformes genomes, 19 outgroup genomes and 18 SRA datasets. Removed were 2 contaminants, 1 hybrid and 4 low-quality samples; for the 47 species with several assemblies, only the one with the highest BUSCO score was kept.", "kw": ["outgroups", "data curation"], "info": "Outgroups were Characiformes, Gymnotiformes, Siluriformes, Gonorynchiformes and Clupeiformes (Otomorpha). The low-quality samples had more than 10% discrepancy between k = 21 and k = 31 genome size estimates and unrealistic heterozygosity. Public genomes were reviewed as of 1 July 2024.", "concl": ""}, {"type": "qa", "section": "Methods - Marker datasets", "q": "Which four marker sets were used?", "a": "Three exon sets and one UCE set. BUSCO uses actinopterygii_odb10 single-copy CDS. HUGHES uses the teleost exon probes, harvested with HMMER. MALMSTROM uses the teleost ortholog set via DIAMOND blastx. UCE uses the Ostariophysan 2.7K probe set with PHYLUCE and 500 bp flanks.", "kw": ["BUSCO", "UCE", "PHYLUCE"], "info": "BUSCO alignments: MACSE v2 codon-aware alignment, BMGE (BLOSUM30) and TAPER on amino acids, then masking, trimming, BMGE (-e 0.8 -g 0.2) and TAPER on nucleotides. HUGHES and MALMSTROM: MAFFT, BMGE, TAPER. UCE: MAFFT and Gblocks. The three exon sets overlapped little when mapped to zebrafish GRCz11, so they are largely independent.", "concl": ""}, {"type": "qa", "section": "Methods - Dataset filtering", "q": "How were loci filtered, and how many were left?", "a": "Taxa with over 50% missing data were removed, loci with more than two stop codons or shorter than 150 bp were dropped, alignments were inspected by hand in AliView, and loci present in fewer than 251 taxa (75%) were removed. This left 769 BUSCO, 866 HUGHES, 1,394 MALMSTROM and 896 UCE loci, cut by genesortR to 539, 607, 976 and 628.", "kw": ["genesortR", "missing data"], "info": "genesortR ran with outlier fraction 0.3 and topological similarity off. Each exon set was analyzed as NT.C123, NT.C12 and AA, giving ten datasets in total with UCE. Locus trees were built with IQ-TREE2 (ModelFinder, 1,000 ultrafast bootstraps).", "concl": ""}, {"type": "qa", "section": "Methods - Phylogenomic inference", "q": "Why were the results interpreted mainly from NT.C12, AA and UCE?", "a": "The NT.C123 datasets, which include third codon positions, gave some incongruent relationships, probably from substitutional saturation at third positions. NT.C12, AA and UCE had higher resolution and less homoplasy.", "kw": ["third codon position", "saturation"], "info": "genesortR showed NT.C123 had more saturation, faster rates, and higher bootstrap support and patristic distances.", "concl": ""}, {"type": "qa", "section": "Methods - Phylogenomic inference", "q": "Which tree inference methods were used?", "a": "Concatenation in IQ-TREE2 (ModelFinder MFP, --merge). Coalescent-aware ASTRAL-IV (with CASTLES-Pro branch lengths) and wASTRAL in ASTER. ROADIES, run three times in accurate mode with IDENTITY = 50, which builds multicopy gene trees and uses ASTRAL-Pro3.", "kw": ["IQ-TREE2", "ASTRAL-IV", "ROADIES"], "info": "CASTER-site and CASTER-pair were also run but gave biologically implausible topologies, likely because the reduced genomic data had limited power, so they are not reported. ROADIES pipeline: random subsequences, LASTZ, PASTA alignment, RAxML-NG gene trees, ASTRAL-Pro3.", "concl": ""}, {"type": "qa", "section": "Methods - Systematic error tests", "q": "How did they test for heterotachy, site heterogeneity and compositional bias?", "a": "GHOST in IQ-TREE2 on 140 representative species (BUSCO.NT.C12+UCE, ten models compared by AIC/BIC). CAT-GTR in PhyloBayes-MPI on amino acid data cut to 140 taxa and about 10,000 sites (two chains, maxdiff < 0.1). RY-recoding of NT.C123 with PhyKIT. Outgroup reduction to Clupeiformes+Siluriformes or Siluriformes only.", "kw": ["GHOST", "CAT-GTR", "PhyloBayes-MPI"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Support and concordance", "q": "How were support and concordance measured?", "a": "Ultrafast bootstrap (1,000) for concatenated trees and local posterior probabilities for ASTRAL-based trees. gCF and sCF were computed in IQ-TREE2 (--scfl 100) on the ASTRAL-IV tree, and qCF from ASTRAL-IV with -u 2. CFs were read as descriptions of topological variation, not as support.", "kw": ["gCF", "sCF", "qCF"], "info": "Root-to-tip distances were computed with ape in R after pruning outgroups. GC content came from AMAS. A neighbor-net from logDet distances was built in SplitsTree4 v4.18.3.", "concl": ""}, {"type": "qa", "section": "Methods - Hypothesis testing", "q": "What are concordance vectors?", "a": "Four proportions that add up to one for a focal branch. psi1 is the share supporting the branch, psi2 and psi3 are the two main alternative topologies (psi2 > psi3), and psi4 covers all other discordant topologies.", "kw": ["concordance vectors"], "info": "A low psi1 means most loci do not support the inferred branch even when species-tree support is high, which points to conflict or ILS.", "concl": ""}, {"type": "qa", "section": "Methods - Hypothesis testing", "q": "How do GGI and deltaGLS work?", "a": "GGI runs constrained ML searches per locus under each competing topology, changing only the focal lineage, and ranks them with the AU test (IQ-TREE2 -zb 20000 -au --sitelh --ntop 40). deltaGLS is the per-locus log-likelihood difference between two topologies; it shows whether a few loci drive the overall support.", "kw": ["GGI", "deltaGLS", "AU test"], "info": "Run on the BUSCO, HUGHES and MALMSTROM NT.C12 datasets and UCE. Trees were pruned with nw_prune. Nested hypotheses (H2/H4 and H3/H5 for Paedocyprididae) were not compared directly.", "concl": ""}, {"type": "note", "section": "Discussion", "text": "Why do Paedocypris and Danionella have elevated substitution rates and (for Paedocypris) high GC content? Life history, genome architecture or metabolic constraints are suggested but not tested."}, {"type": "note", "section": "Discussion", "text": "Would synteny or rare genomic changes from chromosome-level assemblies resolve the suborder branching order and the placement of Paedocyprididae? See MacGuigan et al. 2026."}, {"type": "note", "section": "Results - Zebrafish relatives", "text": "Look at the Danionidae tree (34 of 39 genera) as a comparative framework for zebrafish and Danionella work."}], "key": "general/Sudasinghe_2026_MolBiolEvol_Cypriniformes_phylogenomics", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Slemc_2022", "title": "Reference-Grade Genome and Large Linear Plasmid of Streptomyces rimosus: Pushing the Limits of Nanopore Sequencing", "category": "Genomic resources & assembly", "link": "https://doi.org/10.1128/spectrum.02434-21", "note": "", "source_pdf": "papers/general/Slemc_2022_MicrobiolSpectr_Streptomyces_rimosus_genome.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is Streptomyces rimosus ATCC 10970 and why does it matter?", "a": "It is the parental strain of the industrial strains used to produce the antibiotic oxytetracycline (OTC) commercially.", "kw": ["Streptomyces rimosus", "oxytetracycline"], "info": "Also known as NRRL 2234, WT5260 and R7. It is a Gram-positive, aerobic, filamentous actinobacterium. OTC was the first broad-spectrum antibiotic and is also the intermediate for making doxycycline semisynthetically.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Why are Streptomyces genomes hard to assemble?", "a": "They have a large linear chromosome with many long repeat regions, high GC content, rearrangements and extrachromosomal elements such as giant linear plasmids (GLPs).", "kw": ["giant linear plasmid", "repeats", "GC content"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What was the overall approach of the paper?", "a": "Hybrid sequencing with short reads (Illumina) and long reads (PacBio), plus whole-genome restriction analysis by pulsed-field gel electrophoresis (PFGE). PFGE was also used to isolate GLP DNA away from the chromosome, and the GLP was then sequenced with Nanopore reads alone.", "kw": ["PFGE", "Nanopore", "hybrid assembly"], "info": "They sequenced the GLPs of three strains: the parent ATCC 10970 and two semi-industrial progenitor strains, R6-500 and M4018.", "concl": "Rearrangements on the GLPs came with transposase genes, which suggests transposases drive plasmid and genome plasticity in S. rimosus."}, {"type": "qa", "section": "Introduction", "q": "What genome sequences of S. rimosus existed before this study?", "a": "The first ATCC 10970 genome came out in 2013 (Roche 454 shotgun), followed by the industrial strain R6. Over 38 S. rimosus genome projects are now in GenBank, but most are low quality and fragmented into several hundred contigs.", "kw": ["GenBank", "draft genomes"], "info": "The authors' earlier PacBio plus Illumina assembly is GCF_006229535.1. KAIST (GCF_008704655.1) and the University of Strathclyde (GCF_000331185.2) also produced genomes of this strain with similar approaches.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What does a typical Streptomyces genome look like?", "a": "It is mostly linear, can exceed 10 Mb and often has more than 70% GC. A highly syntenic central region is flanked by variable chromosomal arms.", "kw": ["linear chromosome", "chromosomal arms"], "info": "These genomes are known for plasticity and extensive DNA rearrangements. Repetitive DNA often sits in the terminal parts of the chromosome, next to simple telomeric structures.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is a giant linear plasmid (GLP)?", "a": "A linear plasmid in Streptomyces that can reach more than 1 Mb. OTC-producing S. rimosus strains carry a single GLP of about 300 kb.", "kw": ["GLP"], "info": "GLP size differs between strains. Examples: pSRM of about 43 kb in RCC 133, about 255 kb in strain NCL, 370 kb in the R6-501 derivatives MBVI and MBV14. Pfizer's strain also carries the sex-factor plasmid SRP1.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was already known about GLPs in the Pliva R6 strains?", "a": "R6-500 carries pPZG101 (387 kb), which has long inverted repeats of at least 95 kb. Its ancestor R6-65 carries the smaller pPZG102 (310 kb) without these repeats, so the repeats must have arisen during strain development.", "kw": ["pPZG101", "inverted repeats"], "info": "Among 20 morphological variants and 17 auxotrophic mutants of R6, two lost the plasmid completely and four integrated parts of it into the chromosome. One OTC-overproducing strain had a plasmid of about 1 Mb (pPZG103) because a chromosomal region containing the OTC BGC had integrated into it.", "concl": "There are strong plasmid-genome interactions, and plasmid instability correlates with mutant phenotypes."}, {"type": "qa", "section": "Results - genome assembly and validation", "q": "How much sequencing data did they get for ATCC 10970?", "a": "PacBio gave 155,548 reads (35 to 44,649 nt, average GC 69%, many reads of 1,000 to 2,999 bp). Illumina gave 186,867,024 short reads, 94.16% of them at Q20 or above and 86.78% at Q30 or above.", "kw": ["PacBio", "Illumina"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and validation", "q": "What did the final ATCC 10970 assembly look like?", "a": "One complete linear chromosome of 9,365,899 bp (72.0% GC, 8,085 CDS, 68 tRNAs, 21 rRNAs) and one linear plasmid of 292,604 bp (69.6% GC, 282 CDS). The total is 9,658,503 bp at 71.9% GC.", "kw": ["genome assembly"], "info": "The best result came from combining Hybrid SPAdes and Canu.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and validation", "q": "How did PFGE validate the assembly?", "a": "In silico DraI digestion predicted 14 fragments, and all were seen on the gel except three under 30 kb that the run conditions could not resolve. All 17 fragments predicted for AseI were detected on the gel.", "kw": ["PFGE", "DraI", "AseI"], "info": "This agreed with the PFGE analysis by Algora-Gallardo et al.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and validation", "q": "How complete was the assembly by BUSCO?", "a": "99.7%, the highest of all public S. rimosus assemblies, matched by GCF_000331185.2. Of 35 S. rimosus genomes, 20 were above 99%, but only four had complete genome status in NCBI.", "kw": ["BUSCO"], "info": "The Discussion says a third assembly (GCF_000717285.1) also reached 99.7%, which the Results section does not mention.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and validation", "q": "How did their assembly compare with the other ATCC 10970 assemblies?", "a": "All three ATCC 10970 assemblies aligned globally along the whole chromosome, and theirs was the largest. Compared with GCF_000331185.2, theirs had 14.6 kb more, including a 10-kb fragment with 13 CDS and a reversed 6.7-kb section with TnsA-like and Mn transposases.", "kw": ["dot plot", "transposase"], "info": "The 10-kb fragment (4,424,878 to 4,434,878 bp) encodes a GntR family regulator, conjugal transfer protein TraS, mobile element transfer, a replication initiation protein and a site-specific integrase. GCF_008704655.1 lacks the plasmid entirely. The R6-500 assembly (GCF_000707925.2) showed many rearrangements and inversions relative to ATCC 10970.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and validation", "q": "What did their assembly miss compared with GCF_000331185.2?", "a": "The complete chromosome telomeres: 324 bp at the right end and 1,771 bp at the left. On the plasmid, the right arm had a complete telomere but the left arm was missing a 20-bp terminal fragment.", "kw": ["telomeres"], "info": "The Discussion gives the missing plasmid telomere as 22 bp, not 20 bp. The paper is internally inconsistent here.", "concl": ""}, {"type": "qa", "section": "Results - GLP comparison with public genomes", "q": "How did other public assemblies cover the GLP?", "a": "Only GCF_000331185.2 had a plasmid sequence comparable to theirs. Several contig-level assemblies covered the whole plasmid but broke at certain points, and every one of those junctions contained a transposase gene.", "kw": ["transposase", "contig breaks"], "info": "The example shown is GCF_000716745.1 (strain NRRL B-8076), with junctions near 166.8, 196.0, 241.1 and 260.8 kb of their plasmid. The Discussion says 19 of 33 assemblies had a similar distribution of aligned contigs.", "concl": "Transposases are both rearrangement hotspots and the places where assemblies break."}, {"type": "qa", "section": "Results - PFGE plasmid isolation and Nanopore sequencing", "q": "How did they isolate the GLP for sequencing?", "a": "Total DNA was embedded in low-melting-point agarose blocks and run on PFGE without restriction digestion. This separated the plasmid band from chromosomal DNA, and the band was cut out and extracted.", "kw": ["PFGE", "plasmid isolation"], "info": "The extracted DNA was very dilute (below 5 ng/µL) but still enough for Nanopore sequencing.", "concl": ""}, {"type": "qa", "section": "Results - PFGE plasmid isolation and Nanopore sequencing", "q": "How did plasmid sizes compare on the PFGE gel?", "a": "The ATCC 10970 and M4018 plasmids looked about the same size. The R6-500 plasmid was about 48 kb larger, judged against a lambda PFG ladder.", "kw": ["lambda PFG ladder"], "info": "Earlier PFGE work estimated 312 kb for both the ATCC 10970 and M4018 plasmids. The assemblies here give 292.6 kb and 299.3 kb.", "concl": ""}, {"type": "qa", "section": "Results - PFGE plasmid isolation and Nanopore sequencing", "q": "What did the Canu assembly of the Nanopore plasmid reads give?", "a": "One large contig per strain: 299,081 bp for M4018 (39.35x), 291,520 bp for ATCC 10970 (53.11x) and 189,364 bp for R6-500 (86.45x). A few small low-coverage contigs (7, 14 and 3) were BLASTn-identified as chromosomal debris and removed.", "kw": ["Canu", "Nanopore"], "info": "Longest reads were 25,954 bp (M4018), 39,848 bp (ATCC 10970) and 253,123 bp (R6-500). Lambda control reads were removed before assembly.", "concl": "The ATCC 10970 Nanopore plasmid was identical to the PacBio plus Illumina hybrid plasmid, which validates the hybrid assembly."}, {"type": "qa", "section": "Results - PFGE plasmid isolation and Nanopore sequencing", "q": "Why was the R6-500 plasmid contig so short (189.4 kb)?", "a": "The assemblers could not separate the two copies of a long inverted repeat. The proposed 167-kb repeat had twice the read coverage of the central region (about 6000x versus about 3000x), so the plasmid is predicted to be about 356 kb with a central region of over 20 kb.", "kw": ["inverted repeat", "coverage"], "info": "Their PFGE estimate was about 340 kb and an earlier study said 387 kb. The central region is mostly scattered duplications. Its only non-duplicated CDS is an IS5 family transposase (R6500_083610) at 173.6 kb. Table 3 gives the R6 length as 189,563 bp, slightly different from the 189,364-bp contig in Table 2.", "concl": ""}, {"type": "qa", "section": "Results - comparison of linear plasmids", "q": "What are the general features of the three GLPs?", "a": "WT5260 (ATCC 10970): 292,604 bp, 282 CDS, 21 transposases, 148 hypothetical proteins. M4018: 299,299 bp, 291 CDS, 23 transposases. R6: 189,563 bp assembled (about 356 kb in total), 202 CDS (386 counting the inverted repeat), 14 transposases (24).", "kw": ["plasmid features"], "info": "GC content is about 69.5 to 69.8% for all three. More than half of the ATCC 10970 plasmid CDS are hypothetical proteins.", "concl": ""}, {"type": "qa", "section": "Results - comparison of linear plasmids", "q": "Does the GLP carry metabolic genes?", "a": "No. None of the ATCC 10970 plasmid genes matched predicted metabolism-related enzymes in an unpublished genome-scale metabolic model of S. rimosus.", "kw": ["genome-scale metabolic model"], "info": "", "concl": "GLPs do not seem to carry homologues of essential genes."}, {"type": "qa", "section": "Results - comparison of linear plasmids", "q": "How does the R6-500 plasmid differ from the parent plasmid?", "a": "The left arm (positions 1 to 168,654) is nearly identical to the first half of the ATCC 10970 plasmid, with only 14 mutations: none changed a protein and 9 disrupted a reading frame. The 20,910-bp central region shows rearrangements and inversions and contains 24 CDS, including 7 transposase genes (two of them duplicates).", "kw": ["R6-500", "rearrangements"], "info": "The conserved left arm ends in a transposase-dense region of the ATCC 10970 plasmid (160 to 200 kb) that holds 11 of 23 plasmid transposase genes. Table 3 lists 21 transposases for the ATCC 10970 plasmid, so the count of 23 is unclear.", "concl": ""}, {"type": "qa", "section": "Results - comparison of linear plasmids", "q": "Why is the M4018 plasmid larger than the parent plasmid?", "a": "It keeps all ATCC 10970 plasmid CDS and has an extra 6,708-bp chromosomal fragment inserted at position 204,853. The fragment has 9 CDS, including a Mu transposase domain.", "kw": ["Mu transposase", "M4018"], "info": "The ATCC 10970 chromosome has two copies of this region, at 4,680,190 to 4,686,883 and at 6,119,904 to 6,113,211 bp. progressiveMauve alignment found SNPs in M4018: six change the protein and two disrupt a reading frame.", "concl": ""}, {"type": "qa", "section": "Results - biosynthetic gene clusters", "q": "How many biosynthetic gene clusters (BGCs) does ATCC 10970 have, and where are they?", "a": "antiSMASH 6.0 plus manual curation found 46 putative BGCs on the chromosome and 2 on the plasmid. They make up about 14% of the genome and are enriched on both chromosome arms, which is typical of actinomycetes.", "kw": ["antiSMASH", "BGC"], "info": "The M4018 plasmid also has two BGCs. The R6-500 plasmid has only one, present in two copies because of the inverted repeat.", "concl": ""}, {"type": "qa", "section": "Results - biosynthetic gene clusters", "q": "Which known metabolites match BGCs in ATCC 10970?", "a": "Oxytetracycline (BGC 9, type II PKS, 100% similarity), rimocidin (BGC 6, type I PKS, called nystatin A1 by antiSMASH), rimosamide (BGC 14), tyrobetaine (BGC 23) and desferrioxamine (BGC 31). New compared with earlier work: geosmin (BGC 29) and ectoine (BGC 30), both with 100% similarity.", "kw": ["oxytetracycline", "geosmin", "ectoine"], "info": "BGCs fall into three groups: products already identified; very high similarity to clusters with known products in other actinomycetes; little or no homology to known BGCs. The phrase 'All 48 putative metabolites (2)' in the text is unclear.", "concl": ""}, {"type": "qa", "section": "Results - biosynthetic gene clusters", "q": "Which metabolites did they actually detect in ATCC 10970 extracts?", "a": "Major: oxytetracycline, rimocidin and CE108. Minor: rimosamides A to D, ectoine and hydroxyectoine, chymostatins A to C, tyrobetaines, pseudouridimycin and guanipiperazines A and B.", "kw": ["LC-MS", "LC-UV-HRMS"], "info": "The text links chymostatins to BGC 18, but Table 4 puts them under BGC 35 (deimino-antipain, 66%). The text also lists dichlorotyrobetaine, while Table 4 lists chlorotyrobetaine-2. Both look like internal inconsistencies.", "concl": ""}, {"type": "qa", "section": "Results - biosynthetic gene clusters", "q": "What was odd about pseudouridimycin production?", "a": "BGC 44 is only 68% similar to the known pseudouridimycin (PUM) cluster and lacks homologues of pumA, pumB, pumC and pumD. PUM was still detected.", "kw": ["pseudouridimycin", "pum genes"], "info": "PumA has unknown function, PumB is a putative exporter, PumC is a predicted DeoR regulator and PumD is a putative HAD hydrolase thought to act early in biosynthesis.", "concl": ""}, {"type": "qa", "section": "Results - biosynthetic gene clusters", "q": "How did they find the guanipiperazine cluster?", "a": "They purified guanipiperazines A and B and solved the structures by 1D and 2D NMR. A BLAST search with the noncanonical NRPS LnaA then found a 6,254-bp region (90,930 to 97,183), called rms, that antiSMASH had missed.", "kw": ["guanipiperazine", "rms", "LnaA"], "info": "rms (BGC 1) is nearly identical to the gup cluster. It encodes a noncanonical NRPS, two P450s and an F420H2-dependent reductase. Purification used SP207SS column chromatography and preparative reversed-phase HPLC.", "concl": "Manual analysis is needed on top of antiSMASH."}, {"type": "qa", "section": "Results - biosynthetic gene clusters", "q": "What are the two plasmid BGCs?", "a": "1P is a type I PKS present in all three strains. It has a single standalone PKS (KS-AT-DH-ER-KR-PCP) and is predicted to act iteratively. 2P is an NRPS (C-A-PCP-C-A-PCP-TE) predicted to incorporate Ser and Pro, found only in ATCC 10970 and M4018.", "kw": ["PKS", "NRPS", "iterative PKS"], "info": "1P (WT5260_008341): most BLAST hits are mycocerosic acid synthase-like PKSs from Myxobacteria, while MIBiG hits point to thaxteramide, chondramide and epothilone. 2P genes share 66 to 69% nucleotide identity with chromosomal cluster 46 at the right chromosome end.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How did their PFGE results fit with older PFGE studies?", "a": "Pandza et al. saw 14 AseI fragments from the chromosome. That fits their 17, because three of their fragments come from the plasmid.", "kw": ["PFGE"], "info": "Sizes of bands above 500 kb differed, probably because high GC content makes size estimation against markers harder. Small differences from Algora-Gallardo et al. come from the 10-kb fragment missing in GCF_000331185.2.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What BUSCO completeness should future S. rimosus assemblies be measured against?", "a": "99.7%, based on the Streptomycetales lineage. The three ATCC 10970 assemblies reached it with only marginal differences in duplicated, fragmented and missing BUSCOs.", "kw": ["BUSCO"], "info": "The reads showed marked redundancy and duplicated k-mers, which the authors attribute to long repeats in Streptomyces genomes.", "concl": "99.7% should serve as the reference value for judging future S. rimosus assemblies."}, {"type": "qa", "section": "Discussion", "q": "Which metabolites were found in S. rimosus ATCC 10970 for the first time?", "a": "The rimocidin analogues CE108 and amide CE108, previously known only from S. diastaticus var. 108; the osmolytes ectoine and hydroxyectoine; and guanipiperazines A and B, previously obtained only by heterologous expression in S. lividans.", "kw": ["CE108", "ectoine", "guanipiperazine"], "info": "Chymostatins were already reported from S. rimosus NRRL B-8076. Isorenieratene (BGC 3, 85%) and isocomplestatin (BGC 18, 93%) are hypothesised but not shown.", "concl": "The guanipiperazine cluster, cryptic in many Streptomyces, is expressed in ATCC 10970."}, {"type": "qa", "section": "Discussion", "q": "How enriched are transposase genes on the GLPs compared with the chromosome?", "a": "About 10-fold. The plasmids have about 78.9 (ATCC 10970), 83.6 (M4018) and 59.0 (R6-500) transposase genes per Mbp, against 5.7 per Mbp on the chromosome.", "kw": ["transposase density"], "info": "The chromosome (9.37 Mbp) has only 53 transposase homologues, while the at least 20-kb central region of the R6-500 plasmid has seven.", "concl": "Transposons and IS elements play a central role in plasmid and genome plasticity in S. rimosus."}, {"type": "qa", "section": "Discussion", "q": "Is the GLP essential?", "a": "Not under laboratory conditions. Gravius et al. isolated GLP-free mutants. Still, the GLP is stably kept through years of industrial strain selection despite drastic rearrangements, so the authors suggest it matters for the cell somehow.", "kw": ["plasmid stability"], "info": "Chromosome-plasmid recombination is common in Streptomyces. Examples: SCP1 integrating into the S. coelicolor chromosome, and SLP2 recombining with the S. lividans chromosome.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How does their R6-500 plasmid model compare with Pandza et al.?", "a": "Pandza et al. used an ordered cosmid library and Southern hybridisation to find inverted repeats of about 180 kb and a unique central region of about 30 to 32 kb. In silico digestion of the new assembly with the same enzymes (AseI, BfrI, XbaI) gave a very similar fragment pattern.", "kw": ["cosmid library", "in silico digestion"], "info": "", "concl": "One whole plasmid side was deleted while the other end was duplicated, which explains the doubled coverage."}, {"type": "qa", "section": "Discussion", "q": "What are the main limitations?", "a": "Neither Canu nor Flye could assemble the full R6-500 plasmid because they could not separate the large inverted repeats. The PFGE plus Nanopore approach also did not recover complete telomere sequences.", "kw": ["Canu", "Flye", "limitations"], "info": "The authors note there are few assemblers that handle large duplications.", "concl": "PFGE plus Nanopore gives high-quality sequence from a few nanograms of high-GC DNA. It could also be used to sequence individual fragments from rare-cutter digests."}, {"type": "qa", "section": "Methods - strains and DNA extraction", "q": "Which strains were used and how were they grown?", "a": "Wild-type ATCC 10970 (NRRL 2234, WT5260, R7), M4018 (DSM 105900, a Pfizer strain) and R6-500 (derived from Pliva R6-65). Spores were grown on soya-mannitol agar at 28°C for 7 days.", "kw": ["strains"], "info": "For gDNA, cultures in 5 mL TSB at 28°C and 220 rpm were harvested in mid-exponential phase (18 to 22 h) and extracted with the GenElute bacterial genomic DNA kit (Sigma-Aldrich). M4018 is a prototrophic medium OTC producer used commercially by Pfizer.", "concl": ""}, {"type": "qa", "section": "Methods - sequencing and assembly", "q": "Which platforms and libraries were used for the ATCC 10970 genome?", "a": "Illumina GAIIx short reads (TruSeq DNA PCR-free LT, at least 1 µg gDNA) and PacBio RS II long reads (20-kb SMRTbell, at least 2 µg gDNA), both run at Macrogen. Nanopore was used only for the plasmids.", "kw": ["Illumina GAIIx", "PacBio RS II"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - sequencing and assembly", "q": "What was the assembly pipeline?", "a": "QC with FastQC 0.11.5, subsampling with seqtk and trimming with Trimmomatic 0.36. They then tested SPAdes, Velvet 1.2.10, SOAPdenovo 2.04-r240 and Canu 1.6 across parameters such as k-mer and seed size, and assessed results with QUAST 4.4.", "kw": ["SPAdes", "Canu", "QUAST"], "info": "Runs were done on AWS r4.8xlarge (32 cores, 244 GB RAM) and a local workstation. Hybrid SPAdes plus Canu gave the best result.", "concl": ""}, {"type": "qa", "section": "Methods - PFGE", "q": "How was PFGE set up for genome validation and for plasmid extraction?", "a": "DNA blocks were digested overnight with AseI or DraI and run on a CHEF Mapper in 1% low-melting-point agarose with 0.5x TBE, then stained with ethidium bromide. For plasmid extraction, undigested blocks were run and the plasmid band was cut from at least 10 lanes, pooled and purified with the E.Z.N.A. gel extraction kit.", "kw": ["CHEF Mapper", "Geneious"], "info": "Virtual in silico gels were made in Geneious 11.1.5. Undigested blocks were stored at 4°C in 0.5 M EDTA.", "concl": ""}, {"type": "qa", "section": "Methods - Nanopore sequencing of plasmids", "q": "How were the isolated plasmids sequenced and assembled?", "a": "Libraries were made with ligation kit SQK-LSK109 and a long fragment buffer wash. They ran on reused MinION R9 flow cells (M4018, R6-500) or a Flongle (ATCC 10970) for 20 h. Basecalling used Guppy 4.2.2, lambda reads were removed with NanoLyse, and assembly used Canu 2.1.1 with Flye 2.6 as an alternative.", "kw": ["SQK-LSK109", "Guppy", "Flongle"], "info": "MinION flow cells were preloaded (24 h), washed with EXP-WSH003 and run at -210 mV. Flongle used default settings in MinKNOW.", "concl": ""}, {"type": "qa", "section": "Methods - annotation and BGC prediction", "q": "How was the genome annotated?", "a": "With NCBI PGAP v4.1 at submission, then re-annotated with local PGAP 4.3 and manually curated for 65 genes. The M4018 and R6-500 plasmids were annotated by transferring annotations at over 90% nucleotide identity to ATCC 10970 in Geneious Prime.", "kw": ["PGAP", "MORF"], "info": "The 65 curated genes cover OTC cluster and resistance genes, orthologues of S. coelicolor secondary-metabolism regulators and Pho regulon orthologues. Annotations are stored on MORF. BGCs were found with antiSMASH 6.0 and checked with BLAST and MIBiG, and the circular plot was made with Circa 1.2.2. Data: GCF_006229535.1, SRA PRJNA731353, plasmids MZ502218 (M4018) and MZ502219 (R6-500).", "concl": ""}, {"type": "note", "section": "Results - biosynthetic gene clusters", "text": "How is pseudouridimycin made without pumA to pumD homologues? Are these functions supplied by genes elsewhere in the genome?"}, {"type": "note", "section": "Discussion", "text": "Why is the GLP kept stably through years of industrial selection if it carries no essential or metabolic genes and GLP-free mutants survive? Does it have an unseen role in fitness or in OTC production?"}, {"type": "note", "section": "Discussion", "text": "Could PFGE isolation followed by Nanopore sequencing of single fragments help resolve repeat-rich or extrachromosomal regions in other high-GC or complex genomes? Assemblers still fail on large inverted repeats."}], "key": "general/Slemc_2022_MicrobiolSpectr_Streptomyces_rimosus_genome", "shared": "", "preprint": "", "tags": ["Damir's paper"], "nostar": false, "source_note": ""}, {"id": "Schoenle_2025", "title": "Protist genomics: key to understanding eukaryotic evolution", "category": "Genome & chromosome evolution", "link": "https://doi.org/10.1016/j.tig.2025.05.004", "note": "", "source_pdf": "papers/general/Schoenle_2025_TrendsGenet_protist_genomics.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What are protists?", "a": "Protists are all eukaryotes other than animals, plants and fungi. They are highly diverse, live in nearly all environments, have key roles in planetary health and biogeochemical cycles, and make up most of eukaryotic diversity.", "kw": ["protists"], "info": "The glossary calls them a polyphyletic group that is morphologically and ecologically diverse, mostly microbial, and collectively the majority of eukaryotic life.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What problem does this review address?", "a": "Protists are understudied, and protist genome generation lags far behind most multicellular lineages. Current genomic methods were designed mainly for animals and plants and are poorly suited to protists.", "kw": ["genomic standards"], "info": "This is a review and perspective paper from a large consortium of protistologists, not an original research paper.", "concl": "Advancing protist genomics requires re-evaluating plant- and animal-centric genomic standards and using emerging technologies and bioinformatics tools."}, {"type": "qa", "section": "Introduction", "q": "Which international genome initiatives are driving the increase in genomic data?", "a": "The Earth BioGenome Project (EBP), Darwin Tree of Life (DToL) and the European Reference Genome Atlas (ERGA). They aim to catalog and characterize the genomes of Earth's eukaryotic biodiversity.", "kw": ["EBP", "DToL", "ERGA"], "info": "EBP aims to sequence all described eukaryotic species within 10 years (started 2020). DToL aims to sequence 70 000 eukaryotic species in Britain and Ireland. ERGA is the pan-European partner of EBP. Both DToL and ERGA are affiliated with EBP.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How has the view of protists changed?", "a": "Protists were once seen as simple organisms. Advances in microscopy, transcriptomics and comparative genomics have revealed their genetic diversity and complex evolution in the Tree of Life.", "kw": [], "info": "The authors argue that protist genomics should be prioritized within genome initiatives such as the Aquatic Symbiosis Genomics Project. This would help explain protist biology and give context to fungi, plants and animals.", "concl": ""}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - tree of life", "q": "Why are single-gene markers not enough to reconstruct the eukaryotic tree?", "a": "Single-gene markers such as rRNA genes often fail to recover deep eukaryotic relationships, for example because their regions are too variable or too conserved. Phylogenomic approaches that use hundreds to thousands of loci and protein-coding genes are less prone to these biases.", "kw": ["phylogenomics", "rRNA genes"], "info": "Molecular sequence data started to replace morphology and metabolism for building trees in the 1970s. Phylogenomics has given insights into the acquisition and reduction of plastids and mitochondria, the origin of animals and the root of eukaryotes.", "concl": "Because protists make up nearly all eukaryotic phylogenetic diversity, more protist genomes and transcriptomes are needed to resolve eukaryotic evolution."}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - evolutionary transitions", "q": "What did genomes of free-living relatives of parasitic protists reveal about the evolution of parasitism?", "a": "Kinetoplastids, apicomplexans and holomycotans each evolved intracellular parasitism independently, with different adaptations. They still share common themes: flagellar loss, expansion of transporter gene families, and genome rearrangements that help diversification and faster proliferation.", "kw": ["parasitism", "symbiosis"], "info": "Most available protist genomes come from human or livestock parasites, which often have extreme genomic adaptations and host dependency. Parasitism is defined as a symbiosis in which one partner lowers the fitness of the other.", "concl": ""}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - evolutionary transitions", "q": "How did endosymbiosis shape organelle genomes?", "a": "Mitochondria and plastids came from one cell merging into another. Gene transfer from the organelles to the host nucleus greatly reduced organelle genome size, so these compartments now depend on importing nucleus-encoded proteins.", "kw": ["endosymbiosis", "organelles", "gene transfer"], "info": "Genomic data have blurred the line between what counts as an endosymbiont and what counts as an organelle.", "concl": "More organellar and nuclear genomes are needed to identify the interacting partners and the order of steps that turns an endosymbiont into a true organelle."}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - evolutionary transitions", "q": "What have protist genomes shown about the evolution of multicellularity?", "a": "Phylogenomics found simple clonal or aggregative stages in protists related to complex multicellular organisms, and back-and-forth switches between unicellular and multicellular states in streptophyte algae and fungi. Comparative genomics showed that gene family expansion, lateral gene transfer and domain shuffling were important drivers.", "kw": ["multicellularity", "domain shuffling", "lateral gene transfer"], "info": "Eukaryotic multicellularity evolved independently several times, in plants, animals, fungi and algae, alongside simpler clonal forms. The machinery for cell differentiation, adhesion and communication differs between multicellular lineages.", "concl": "Many genes once thought specific to multicellular organisms are found in unicellular relatives, so they predate multicellularity. Their patchy distribution means protist diversity must be considered when reconstructing ancestral multicellular states."}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - evolutionary transitions", "q": "Which lineages moved onto land, and what challenges did they face?", "a": "Terrestrialization happened independently in algae and plants, fungi, ciliates, rhizarians and stramenopiles, among others. These lineages faced unbuffered stressors (large temperature changes, more light and UV) and water scarcity (osmotic stress).", "kw": ["terrestrialization"], "info": "Comparative genomics of terrestrialization is just beginning, mostly by comparing plants with their closest streptophyte algal relatives.", "concl": ""}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - evolutionary transitions", "q": "How can protist genomes help study eukaryogenesis?", "a": "By comparing protist genomes with their prokaryotic relatives, archaea and bacteria. This helps explain the origin of eukaryotes and of eukaryotic cell structures.", "kw": ["eukaryogenesis"], "info": "The paper covers this in one short paragraph without detail.", "concl": ""}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - molecular features", "q": "Which molecular features were first discovered in protists?", "a": "RNA editing, trans-splicing, polycistronic transcription and variant surface proteins were all discovered in protists and later found in various multicellular organisms. Ciliates are well known for deviating from the standard genetic code, and the list of protists with noncanonical codes is growing fast.", "kw": ["noncanonical genetic code", "RNA editing", "trans-splicing"], "info": "A noncanonical genetic code is one where codon-to-amino-acid assignments differ from the canonical code. These codes are most common in certain protist lineages, mitochondria and plastids.", "concl": "Sequencing more protist genomes is expected to reveal further departures from what are considered typical features of the eukaryotic cell."}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - molecular features", "q": "What is a nitroplast?", "a": "A nitrogen-fixing organelle derived from a cyanobacterium that evolved independently of canonical plastids. The authors give it as an example of previously unrecognized organelles that protists may still reveal.", "kw": ["nitroplast"], "info": "", "concl": ""}, {"type": "qa", "section": "Protist genomes in eukaryotic evolution - ecosystem dynamics", "q": "How can protist genomes help decode ecosystem dynamics?", "a": "Metagenomics and metatranscriptomics show community composition, genomic potential and gene expression in mixed protist assemblages. These studies are currently limited by scarce, discontinuous and incomplete reference genomes.", "kw": ["metagenomics", "metatranscriptomics"], "info": "Metagenomics sequences DNA from multispecies samples, and metatranscriptomics sequences RNA. Combining high-quality genomes with omics data would allow tracing allele frequencies, community dynamics and food webs.", "concl": "Better reference genomes are needed to identify the key players in ecosystem function and to understand how global change affects ecosystem structure and stability."}, {"type": "qa", "section": "Particularities of protist genome research", "q": "How many protist species can be cultured?", "a": "About 3000 protist species were culturable as of 2014, which is only 0.03% of the predicted protist diversity. Many species remain uncultured and belong to previously unrecognized lineages.", "kw": ["culturing"], "info": "Two culture-independent approaches are emerging, single-cell genomics and metagenomics. Both are in their infancy for protists but benefit from developments in fields such as clinical research.", "concl": ""}, {"type": "qa", "section": "Particularities of protist genome research - life strategies", "q": "Why are symbiotic protists hard to sequence?", "a": "Many protists are symbionts of animals (e.g., apicomplexans) or plants (e.g., oomycetes), or host endosymbionts themselves (e.g., parabasalids). In vitro culture methods are mostly lacking, so isolates come from field-collected infected hosts and are often contaminated with host cells or environmental microbes.", "kw": ["symbionts", "contamination"], "info": "", "concl": ""}, {"type": "qa", "section": "Particularities of protist genome research - life strategies", "q": "What strategies separate symbiont DNA from host DNA?", "a": "First, in vivo isolation or enrichment of symbiont biomass: micropipetting, differential filtration, density gradient centrifugation, FACS followed by MDA, or microfluidics such as 10x Genomics Chromium. Second, in silico separation of reads using k-mer-based methods, GC content, trinucleotide composition, or mapping to the host genome when one is available.", "kw": ["FACS", "MDA", "in silico decontamination"], "info": "FACS (fluorescence-activated cell sorting) uses flow cytometry to sort cells one at a time by fluorescence (including natural autofluorescence) and light scattering. MDA (multiple displacement amplification) is isothermal whole-genome amplification with a high-fidelity polymerase, used for small inputs such as single cells.", "concl": ""}, {"type": "qa", "section": "Particularities of protist genome research - life strategies", "q": "Why are heterotrophic protists underrepresented in genomic data?", "a": "They need food, usually bacteria or other protists, which makes them harder to culture than algae or fungi. Not all can be grown with a single defined food organism, and not all prey are equivalent, even for bacterivores.", "kw": ["heterotrophic protists"], "info": "Bacteria release secondary metabolites to defend against predators, which selects for protists with specific resistances. As a result, food requirements can differ even between closely related protist species.", "concl": ""}, {"type": "qa", "section": "Particularities of protist genome research - life strategies", "q": "What is the culturing situation for radiolarians and foraminiferans?", "a": "Radiolarians make up to 5% of total planktonic biomass in surface oceans, but culturing them is rudimentary and only keeps them alive long enough to observe. Their life cycles have never been closed. Foraminiferans are similar, with some recent successes.", "kw": ["radiolarians", "foraminiferans"], "info": "Many large protists (>100 µm) host several symbionts. The paper says symbiont presence is obligatory for protists like dinoflagellates and haptophytes, but this sentence is ambiguous about which partner depends on which.", "concl": ""}, {"type": "qa", "section": "Particularities of protist genome research - life strategies", "q": "Why are phototrophic protists easier to sequence?", "a": "Phototrophs are generally easier to cultivate with the right nutrients and light, and many cultures are axenic. These cultures are easy to maintain long term and give plenty of fresh material for high-molecular-weight DNA and RNA extraction.", "kw": ["phototrophs", "axenic culture", "HMW DNA"], "info": "Archaeplastids got plastids from an ancient endosymbiosis with cyanobacteria. Secondary or higher-order endosymbioses spread red algal-derived plastids to cryptophytes, haptophytes, alveolates and stramenopiles. Some deep-branching plastid lineages remain completely uncultivated. Marine green algae (Viridiplantae) with fast division and complete genomes are models for land plant features.", "concl": "Thick cell walls with specialized compounds can still reduce nucleic acid extraction efficiency in some photosynthetic taxa."}, {"type": "qa", "section": "Box 1 - Beginner's guide to protists", "q": "How has the classification of protists changed over history?", "a": "In 1818 Goldfuß introduced Protozoa as a class of the simplest animals, grouped with bryozoans and rotifers. In 1866 Haeckel described Protista as a sister clade to animals and plants, uniting photoautotrophic and heterotrophic microbial eukaryotes. Their polyphyletic nature remained unclear until the late 20th century.", "kw": ["Protozoa", "Protista"], "info": "Better microscopy later challenged the view of protists as prototypes of multicellular organisms.", "concl": ""}, {"type": "qa", "section": "Box 1 - Beginner's guide to protists", "q": "How many protist species are described compared with the predicted total?", "a": "76 904 protist species had been described by 2007, against a predicted richness of up to 10.5 million species. Over 1 million species are predicted for apicomplexans alone.", "kw": ["18S rDNA", "diversity"], "info": "Mass sequencing of 18S rDNA amplicons revealed many unknown protist lineages in soil and marine habitats that culturing would have missed. Protists range from <1 µm to tens of centimeters and live in all environments, including the deep sea and the Atacama Desert. Their trophic modes include autotrophy, heterotrophy, mixotrophy, saprotrophy, parasitism and many symbioses.", "concl": ""}, {"type": "qa", "section": "Box 1 - Beginner's guide to protists", "q": "Which supergroups appear in the eukaryotic tree in Box 1, Figure I?", "a": "Stramenopiles, alveolates, rhizarians, haptists, cryptists, archaeplastids, opisthokonts, amoebozoans, discobids, metamonads and CRuMs. Several orphan lineages are also shown, such as telonemids, provorids, hemimastigotes, ancyromonads, malawimonads, breviates and apusomonads.", "kw": ["eukaryotic tree of life", "supergroups"], "info": "Fungi, animals and land plants are drawn with broken lines and no further resolution. The name charophytes was changed to streptophyte algae. At least two groups were proposed within the last decade, and the deeper phylogeny of several groups is still unresolved.", "concl": ""}, {"type": "qa", "section": "Snapshot of available protist genomes", "q": "When was the first protist genome sequenced, and how has the number grown?", "a": "One of the first was the genome of the apicomplexan parasite Plasmodium, published in 2002. The number of public protist genomes has risen steeply since 2022, especially for oomycete plant pathogens and diatoms, both stramenopiles.", "kw": ["Plasmodium"], "info": "Initiatives scaling up protist sequencing include the Protist 10,000 Genome Project, the Aquatic Symbiosis Genomics Project and DToL.", "concl": ""}, {"type": "qa", "section": "Snapshot of available protist genomes", "q": "How many protist genomes are available compared with all eukaryotes?", "a": "As of February 2025, GoaT lists 1 843 386 eukaryotic species, of which 72 599 are protists. There are 46 184 eukaryotic assemblies for 20 004 species, but only 2743 of these assemblies belong to 1121 protist species.", "kw": ["GoaT"], "info": "The Key figure (Figure 1) is labeled as retrieved in November 2024, while the text numbers are as of February 2025, so the two may not match exactly.", "concl": "Protists are strongly underrepresented among sequenced eukaryotic genomes."}, {"type": "qa", "section": "Snapshot of available protist genomes", "q": "Which protist groups dominate the available genomes, and why?", "a": "Most primary assemblies come from the SAR clade, mainly stramenopiles (mostly oomycetes such as Phytophthora) and alveolates (mostly apicomplexans such as Plasmodium, and ciliates), plus discobids (euglenozoans such as Leishmania). This reflects research focused on crop and livestock or human diseases.", "kw": ["SAR clade", "taxonomic bias"], "info": "Rhizarian genome assemblies are relatively few. A primary assembly is the best-resolved haplotype assembly for a taxon, and alleles that cannot be placed in it go into an alternate assembly.", "concl": ""}, {"type": "qa", "section": "Snapshot of available protist genomes", "q": "What is the assembly quality of current protist genomes?", "a": "Most protist genomes are assembled only to contig or scaffold level. Chromosome-level assemblies exist mainly for phototrophs (chlorophytes, diatoms) and parasitic groups (apicomplexans, euglenozoans, oomycetes).", "kw": ["assembly level"], "info": "Assembly spans vary widely. Figure 1B bins range from 10.0 kb to 4.12 Gb. Large genomes are especially common in dinoflagellates with a dinokaryon.", "concl": ""}, {"type": "qa", "section": "Snapshot of available protist genomes", "q": "How complete are protist genomes according to BUSCO?", "a": "BUSCO completeness varies a lot, and only about 2.7% of protist genomes are more than 90% complete.", "kw": ["BUSCO"], "info": "The authors note that BUSCO itself is limited for protists because protist genomic resources are scarce. Long-read protist genomes are also still rare.", "concl": "The protistology community is not yet fully benefiting from recent advances in sequencing technology."}, {"type": "qa", "section": "Box 2 - Practices with protist genomes", "q": "What are the three starting points for getting protist genomes?", "a": "Single cells, cultures and environmental samples (meta approaches). Single cells and cultures need cell isolation by manual methods (micromanipulation, pipetting) or high-throughput methods (FACS), followed by amplification and sequencing. Meta approaches extract DNA or RNA directly from the environment.", "kw": ["single-cell", "culture", "metagenomics"], "info": "For heterotrophic cultures, prey bacteria must be reduced, or axenic cultures made, by filtration, antibiotic treatment and repeated washing with FACS. PacBio HiFi and Arima Hi-C data are given as successful examples for assembly.", "concl": ""}, {"type": "qa", "section": "Box 2 - Practices with protist genomes", "q": "What are the pros and cons of single-cell versus meta approaches?", "a": "Single-cell approaches can analyze individual protists from minimal input, and co-assembly improves genome recovery up to 80%. However, single genomes are often partial (10-40% recovery for small protists) and less contiguous than telomere-to-telomere quality. Meta approaches are culture-independent and capture broad genetic diversity, but eukaryotic sequences make up less than 2% of reads.", "kw": ["co-assembly", "genome recovery"], "info": "", "concl": ""}, {"type": "qa", "section": "Box 2 - Practices with protist genomes", "q": "What are the pros and cons of culture-based approaches, and which future developments do the authors flag?", "a": "Cultures can give high-quality, complete genomes, and sample preparation can increase protist abundance and reduce bacteria. However, prokaryotic contamination can lead to poor gene annotation, and novel or small protists can be hard to culture.", "kw": ["Hi-C", "nuclei sorting"], "info": "The four long-term development ideas, marked with yellow stars in the figure, are nuclei sorting, protist-specific pipelines, low-input Hi-C libraries and protist BUSCO core sets.", "concl": ""}, {"type": "qa", "section": "Box 3 - Databases for protist genomes", "q": "What is Genomes on a Tree (GoaT)?", "a": "A platform built to support EBP that provides genome-related metadata and sequencing project information for eukaryotic species. It collects validated metadata such as genome sizes, karyotypes and sequencing status, and fills in missing values by phylogenetic comparison.", "kw": ["GoaT"], "info": "It can be used through an API, a web interface and command-line tools.", "concl": ""}, {"type": "qa", "section": "Box 3 - Databases for protist genomes", "q": "Which other databases hold protist genomic data?", "a": "P10K aims to sequence 10 000 protist species and offers a single-cell pipeline with protist-specific decontamination and annotation. EnsemblProtists is an annotated genome browser with Perl and REST APIs. VEuPathDB covers vector-borne and zoonotic pathogens, and EukProt holds predicted protein sets across eukaryotic supergroups.", "kw": ["P10K", "VEuPathDB", "EukProt"], "info": "EukProt places species within the UniEuk taxonomic framework and is designed for phylogenomics and gene family evolution.", "concl": ""}, {"type": "qa", "section": "Opportunities - sequencing from cultures", "q": "Which genome standards do the authors challenge?", "a": "Current reference genome standards expect chromosome-level resolution and maximal completeness for every species, and best practices and software are built around animals and plants. Protist genomes processed with current pipelines often fall short of these standards.", "kw": ["reference genome standards"], "info": "The authors say no single approach is likely to give high-quality genomes across all protist diversity.", "concl": "Both concepts and methods need to advance, in the wet lab and in bioinformatics."}, {"type": "qa", "section": "Opportunities - sequencing from cultures", "q": "How can contamination in protist cultures be reduced?", "a": "Antibiotic treatment (to get axenic or monoxenic cultures), size fractionation by filtration, and FACS. Bacterial sequences often persist in non-axenic cultures, which reduces sequencing depth and assembly accuracy. Targeting life-cycle stages with higher DNA or RNA yields and removing contaminants bioinformatically can help, as shown for the marine gregarine Porospora gigantea.", "kw": ["axenic culture", "decontamination"], "info": "", "concl": ""}, {"type": "qa", "section": "Opportunities - sequencing from cultures", "q": "What can be done when full genome sequencing is not yet feasible?", "a": "Combine transcriptomics with genome skimming, a cheap shallow sequencing approach. It captures high-copy regions, coding sequences and conventional DNA barcodes.", "kw": ["genome skimming"], "info": "Better high-molecular-weight DNA extraction (e.g., nuclei extraction) and high-quality Hi-C libraries from minimal input are urgently needed to study chromatin in few or single cells.", "concl": ""}, {"type": "qa", "section": "Box 4 - Complexity of protist genomes", "q": "What is the kinetoplast?", "a": "A massive body of mitochondrial DNA in kinetoplastids. In trypanosomatids it contains maxicircles (20-25 kb, encoding mitoribosomal RNAs and oxidative phosphorylation proteins) and thousands of minicircles (0.5-10 kb).", "kw": ["kinetoplast", "maxicircles", "minicircles"], "info": "Diplonemids have large, circular, non-catenated mtDNA that makes up to 60% of total cell DNA, the most DNA-rich organelles known. Both groups have extensive RNA editing: uridine insertions and deletions in kinetoplastids, nucleotide substitutions in diplonemids. Their Euglenida relatives have streamlined mitochondrial genomes.", "concl": ""}, {"type": "qa", "section": "Box 4 - Complexity of protist genomes", "q": "What is nuclear dualism in ciliates?", "a": "Ciliates have a small, diploid germline micronucleus (MIC) and a large, polyploid somatic macronucleus (MAC). The MIC is active during mating and holds internally eliminated sequences (IESs). The MAC carries out gene expression during vegetative growth.", "kw": ["micronucleus", "macronucleus", "IESs"], "info": "During sexual reproduction the old MAC is destroyed, and some daughter MICs become new MACs. In this process IESs are removed and chromosomes are fragmented, rearranged and amplified. In some ciliates the MAC genome encodes 18 500 genes on 16 000 chromosomes.", "concl": ""}, {"type": "qa", "section": "Box 4 - Complexity of protist genomes", "q": "What is unusual about dinoflagellate genomes?", "a": "Core dinoflagellates have a unique nucleus, the dinokaryon. They have abandoned histones for DNA packaging and use proteins of viral and bacterial origin instead, with liquid-crystalline chromosomes that stay condensed throughout the cell cycle. Their genomes range from 1000 to 215 000 Mb, with some genes in tandem arrays.", "kw": ["dinokaryon", "Symbiodinium"], "info": "Some of the smallest core dinoflagellate genomes (1100-1500 Mb) belong to the coral endosymbiont Symbiodinium. Noncore dinoflagellates such as the parasite Amoebophrya have much smaller genomes, around 100 Mb.", "concl": ""}, {"type": "qa", "section": "Opportunities - single-cell genomics", "q": "What has single-cell genomics achieved for protists so far?", "a": "Genomes of four ciliate species were sequenced from individual cells using two whole-genome amplification methods. Genomes of uncultured, dominant microeukaryotes have also been obtained.", "kw": ["single-cell genomics", "whole-genome amplification"], "info": "Single cells can be isolated by micromanipulation, FACS or laser-based methods (confocal microscopy, laser capture microdissection). These are technically demanding and need time, expertise and costly equipment.", "concl": ""}, {"type": "qa", "section": "Opportunities - single-cell genomics", "q": "What is selective lysis, and what problems remain for single-cell data?", "a": "Selective lysis is a cheaper, accessible way to enrich eukaryotic DNA by taking advantage of the protection the nuclear envelope gives. Combined with scRNA-seq, it helps with uneven genome amplification and with resolving repetitive regions.", "kw": ["selective lysis", "scRNA-seq"], "info": "Single-cell omics data can still contain prokaryotic contamination from ingested, endosymbiotic or surface-attached bacteria, which must be removed bioinformatically.", "concl": ""}, {"type": "qa", "section": "Opportunities - metagenomics", "q": "How far has metagenomics gone in recovering eukaryotic genomes?", "a": "Only a few eukaryotic MAGs have been reported, often from low-diversity communities. Hundreds of planktonic marine eukaryote MAGs were recently assembled from massive sequencing data and combined with single-cell amplified genomes (SAGs) to build a high-quality genomic repository.", "kw": ["MAG", "SAG", "EukHeist"], "info": "Metagenomics pipelines were first built for bacterial communities. Specialized pipelines such as EukHeist are being developed for eukaryotic genomes.", "concl": ""}, {"type": "qa", "section": "Opportunities - metagenomics", "q": "What are the limits of short-read eukaryotic MAGs, and what could solve them?", "a": "MAGs built from short reads are discontinuous, fragmented, contaminated or unphased. They cannot resolve gene synteny, repeats, polyploidy or large introns, and binning can miss parts of the genome such as organellar genomes. Long-read sequencing, now feasible for metagenomics with PacBio Revio and improved Oxford Nanopore chemistry, can overcome many of these problems.", "kw": ["long-read metagenomics", "binning"], "info": "", "concl": ""}, {"type": "qa", "section": "Opportunities - assembly and annotation", "q": "What do the authors say about decontaminating protist assemblies?", "a": "Software like Tiara can reduce bacterial contamination. Decontamination pipelines must also recognize horizontal and endosymbiotic gene transfer between protists and bacteria, so that real transferred genes are not removed.", "kw": ["Tiara", "horizontal gene transfer"], "info": "Assembly tools can produce high-quality assemblies from high-quality data, including giant and polyploid genomes. Chromatin-capture techniques are key to assembly quality and need low-input protocols.", "concl": "The authors call for protist group-specific decontamination tools."}, {"type": "qa", "section": "Opportunities - assembly and annotation", "q": "Why does BUSCO underestimate the completeness of protist genomes?", "a": "Quality is usually assessed with the general eukaryotic BUSCO core set, and few core sets exist for specific protist groups (e.g., stramenopiles, euglenozoans, apicomplexans, chlorophytes, alveolates). The cause is the scarcity and bias of available protist genomes and their high genetic divergence.", "kw": ["BUSCO", "core gene sets"], "info": "", "concl": "Expanding and refining taxon-specific BUSCO core gene sets is essential for evaluating assembly completeness properly."}, {"type": "qa", "section": "Opportunities - assembly and annotation", "q": "Why is gene annotation poor for protists, and what do the authors propose?", "a": "Annotation pipelines are built for the gene architectures of animal and plant model organisms, so they predict protist gene models poorly. Many protist genes also remain unclassified because databases and reference genomes are limited.", "kw": ["gene annotation"], "info": "The authors argue for publishing fragmented or incomplete transcriptome and genome assemblies to grow databases. They see these lower-quality resources as a necessary intermediate step.", "concl": "Incomplete databases are a major obstacle to high-quality annotation, so releasing suboptimal assemblies should be encouraged."}, {"type": "qa", "section": "Concluding remarks", "q": "What do the authors conclude?", "a": "Protist genomics needs global collaboration under EBP, ongoing funding, and taxonomists for taxonomic validation alongside molecular biologists and bioinformaticians. Since most protists cannot be cultured, priorities are better methods for small samples and optimized single-cell genomics and transcriptomics.", "kw": ["EBP", "referential genomes"], "info": "Single-cell genomes may not meet the strict EBP criteria for reference genomes, but the authors argue they can serve as valuable 'referential genomes'. Higher-quality MAGs from long-read metagenomics can also help.", "concl": "The long-term goal stays the highest-quality protist assemblies. The route there goes through releasing incomplete assemblies, better databases and taxon-specific BUSCO sets."}, {"type": "note", "section": "Concluding remarks", "text": "Is the current EBP definition of a reference genome too strict, and would broadening it speed up biodiversity genomics for difficult organism groups?"}, {"type": "note", "section": "Concluding remarks", "text": "How can chromatin-capture techniques such as Hi-C be adapted to ultra-low input or single-cell scale for protists?"}, {"type": "note", "section": "Concluding remarks", "text": "How much gene transfer, from endosymbionts (EGT) and from other sources (LGT), happened in different eukaryotic lineages, and how should decontamination pipelines tell transferred genes apart from contamination?"}], "key": "general/Schoenle_2025_TrendsGenet_protist_genomics", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Romeijn_2026", "title": "LncRNA-BERT: an RNA language model for classifying coding and long non-coding RNA", "category": "Computational methods", "link": "https://doi.org/10.1080/09540091.2026.2624131", "note": "", "source_pdf": "papers/general/Romeijn_2026_ConnectSci_LncRNA-BERT.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is lncRNA-BERT?", "a": "An RNA language model that is pre-trained and fine-tuned on human RNAs from GENCODE, RefSeq and NONCODE. It classifies transcripts as protein-coding (mRNA) or long non-coding RNA (lncRNA).", "kw": ["lncRNA-BERT", "nucleotide language model"], "info": "It is implemented in the Python package lncRNA-Py (github.com/luukromeijn/lncRNA-Py). The trained models are on Hugging Face.", "concl": "It matches or beats state-of-the-art classifiers on three test sets, including the cross-species RNAChallenge benchmark.
