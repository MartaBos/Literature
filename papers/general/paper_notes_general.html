<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper notes · General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2632; --muted:#5A6878; --rule:#D3DAE1; --hover:#E3E8ED;
  --focus:#2F6FB3; --good:#2E7D4F; --again:#B4562E;
  --c-mex:#C9DAF8; --c-mex-d:#3D6DBF;
  --c-emb:#FCE5CD; --c-emb-d:#C47A2C;
  --c-gen:#D9EAD3; --c-gen-d:#4E8A3E;
  --c-dam:#EAD1DC; --c-dam-d:#A3527A;
  --c-oth:#D8D1EE; --c-oth-d:#6B57B0;
  --c-ali:#FFF2CC; --c-ali-d:#B08A12;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
    --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
    --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
    --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
    --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
  --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
  --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
  --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
  --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--rule);padding:22px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{padding:0 22px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0;letter-spacing:-.01em;cursor:pointer}
.brand small{color:var(--muted);font-size:.82rem}
.search{margin:0 22px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px}
.cat{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 10px 4px 8px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist{list-style:none;margin:0;padding:0 12px}
.pitem{display:grid;grid-template-columns:6px 1fr auto;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 10px 10px 8px;align-items:start}
.pitem:hover{background:var(--hover)}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--rule)}
.pitem .tab{align-self:stretch;border-radius:3px}
.pitem b{display:block;font-weight:600;font-size:.92rem}
.pitem span.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.pitem .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.theme{margin:auto 22px 0;align-self:flex-start;background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--muted)}

main{padding:40px clamp(20px,5vw,64px) 80px;max-width:900px;width:100%}
.mtop{display:none}
.phead{border-left:6px solid var(--cd);padding-left:20px;margin-bottom:28px}
.phead .who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.9rem}
.tag{background:var(--cl);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.8rem}
.shared{border:1px solid var(--rule);border-radius:6px;padding:1px 8px;font-size:.8rem;color:var(--muted)}
.badge{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:600}
.star{color:var(--cd);margin-left:4px}
.phead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;letter-spacing:-.015em;margin:10px 0 12px;max-width:34ch}
.phead .srcnote{font-size:.88rem;color:var(--again);border-left:3px solid var(--again);padding:2px 0 2px 10px;margin:8px 0 6px;max-width:68ch}
.phead .note{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 4px;max-width:62ch}
.phead a.open{font-size:.9rem;font-weight:500;color:var(--cd);text-decoration:none;border-bottom:1px solid currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 26px}
.secnav button{text-align:left;background:none;border:0;border-bottom:1px dashed var(--rule);padding:2px 0;margin-right:12px;font-size:.84rem;color:var(--muted)}
.secnav button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.prog{font-size:.85rem;color:var(--muted);margin-left:auto}

h3.sec{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.qa{border-bottom:1px solid var(--rule)}
.qa:last-child{border-bottom:0}
.qbtn{display:grid;grid-template-columns:1fr auto;gap:16px;width:100%;text-align:left;background:none;border:0;padding:14px 0;font-weight:500;font-size:1rem;line-height:1.4}
.qbtn:hover .qt{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.qmeta{display:flex;gap:8px;align-items:center;padding-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
.qa.open .chev{transform:rotate(90deg)}
.known{font-size:.72rem;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.novel{font-size:.72rem;color:var(--cd);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.ans{display:none;padding:0 0 18px}
.qa.open .ans{display:block;animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ans p.a{font-family:var(--serif);font-size:1.04rem;line-height:1.65;margin:0 0 12px;max-width:66ch}
.extra{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;font-size:.92rem;margin:0 0 12px;max-width:72ch}
.extra dt{color:var(--muted);font-size:.84rem;padding-top:2px}
.extra dd{margin:0;line-height:1.55}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:var(--cl);border:0;border-radius:6px;padding:2px 9px;font-size:.8rem}
.kw:hover{outline:1px solid var(--cd)}
.notep{font-family:var(--serif);font-style:italic;color:var(--muted);padding:12px 0 12px 14px;border-left:2px solid var(--rule);margin:8px 0}
.empty{font-family:var(--serif);color:var(--muted);padding:30px 0;max-width:52ch}
.comments{margin-top:44px}
.comments textarea{width:100%;min-height:140px;resize:vertical;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);font-family:var(--serif);font-size:1rem;line-height:1.6}
.comments textarea[readonly]{opacity:.8}
.cmtstatus{font-size:.82rem;color:var(--muted);margin-top:6px}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:2px}

/* home */
.home h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em;margin:0 0 6px}
.home .lead{color:var(--muted);margin:0 0 34px;max-width:58ch}
.grp{margin-bottom:30px}
.grp h3{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;margin:0 0 8px}
.prow{display:grid;grid-template-columns:120px 1fr 120px;gap:16px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:12px 4px;text-align:left}
.prow:hover{background:var(--hover)}
.prow b{font-weight:600;font-size:.92rem}
.prow span{font-family:var(--serif);font-size:.95rem;line-height:1.35}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cd)}
.barlab{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* search results */
.rgroup{margin-bottom:26px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0 0 4px}
.rgroup h3 button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}

/* flashcards */
.study{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.study.on{display:flex}
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stop .ttl{font-weight:600}
.stop .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stop .x{margin-left:auto}
.track{height:4px;background:var(--rule);border-radius:2px;margin:14px 0 0;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stage{flex:1;display:grid;place-items:center;perspective:1600px;padding:24px 0;min-height:0}
.card{width:min(720px,100%);height:min(440px,100%);position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:18px;border:1px solid var(--rule);border-top:10px solid var(--cd);padding:28px clamp(20px,4vw,40px);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .src{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.face .q{font-family:var(--serif);font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.3;font-weight:500;margin:auto 0;letter-spacing:-.01em}
.face .bq{font-size:.9rem;color:var(--muted);margin:12px 0 10px}
.face .ba{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.25rem);line-height:1.6;margin:0 0 14px}
.face .hint{font-size:.82rem;color:var(--muted);text-align:center}
.sctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.again{color:var(--again);border-color:currentColor}
.btn.good{color:var(--good);border-color:currentColor}
.done{text-align:center;font-family:var(--serif)}
.done h3{font-size:1.8rem;font-weight:500;margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 20px}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

@media (max-width:820px){
  .shell{display:block}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);height:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  body.drawer .scrim{display:block}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px;align-items:center;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .mtop b{font-family:var(--serif);font-weight:600}
  main{padding-top:24px}
  .prow{grid-template-columns:1fr;gap:6px}
  .extra{grid-template-columns:1fr;gap:2px}
  .extra dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mtop"><button class="btn" id="menu" aria-label="Show paper list">Papers</button><b id="mtitle">General</b></div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="side">
    <div class="brand"><h1 id="home" tabindex="0" role="link">General</h1><small id="tot"></small></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search all notes" aria-label="Search all notes"></label>
    <div class="cats" id="cats"></div>
    <ul class="plist" id="plist"></ul>
    <button class="theme" id="theme">Theme: auto</button>
  </aside>
  <main id="main"></main>
</div>

<section class="study" id="study" aria-label="Flashcards">
  <div class="stop">
    <span class="ttl" id="sTitle"></span><span class="count" id="sCount"></span>
    <div class="opts"><label><input type="checkbox" id="sShuffle"> Shuffle</label><label><input type="checkbox" id="sNew"> Skip cards I know</label></div>
    <button class="btn x" id="sClose">Close</button>
  </div>
  <div class="track"><i id="sTrack"></i></div>
  <div class="stage" id="stage"></div>
  <div class="sctl" id="sctl">
    <button class="btn again" id="bAgain">Review again <small>(1)</small></button>
    <button class="btn" id="bFlip">Flip <small>(space)</small></button>
    <button class="btn good" id="bGood">Got it <small>(2)</small></button>
  </div>
</section>

<script>
const DATA = {"page": {"label": "General", "folder": "general", "updated": "2026-11-23"}, "legend": ["Genome & chromosome evolution", "Computational methods", "RNA & transcriptomics", "Human genetics", "Genomic resources & assembly"], "catKeys": {"Genome & chromosome evolution": "gen", "Computational methods": "oth", "RNA & transcriptomics": "mex", "Human genetics": "dam", "Genomic resources & assembly": "ali"}, "papers": [{"id": "Zhao_2026", "title": "DECODE: deep learning-based common deconvolution framework for various omics data", "category": "Computational methods", "link": "https://doi.org/10.1038/s41592-026-03007-y", "note": "", "source_pdf": "papers/general/Zhao_2026_NatMethods_DECODE_omics_deconvolution.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What does a deconvolution algorithm do?", "a": "It estimates cell-type abundances from tissue-level (bulk) data, using single-cell data as a reference. This allows cellular analysis of large cohorts without single-cell profiling of every sample.", "kw": ["deconvolution", "cell abundance"], "info": "Cell abundance is defined as the proportional distribution of cell types within a tissue.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is DECODE and what makes it different from earlier tools?", "a": "DECODE is a universal deep learning deconvolution framework for both cell types and cell states. It works on transcriptomic, proteomic and metabolomic data and can integrate multiomics tissue datasets at the cellular level.", "kw": ["DECODE", "multiomics"], "info": "Most earlier tools were built for a single omics type.", "concl": "DECODE fills the gap in metabolomics deconvolution and stays robust when the single-cell reference is incomplete."}, {"type": "qa", "section": "Introduction", "q": "Why use deconvolution instead of single-cell profiling for large cohorts?", "a": "Single-cell technologies are too expensive for large cohort studies, and many preserved tissue samples cannot be made into single-cell suspensions. Deconvolution is a cost-effective way to bring tissue-level cohort data to the cellular level.", "kw": ["single-cell", "cohort"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the problem with existing deconvolution methods?", "a": "Each method is built for one omics type: MuSiC and CIBERSORTx for bulk transcriptomics, RCTD and SPOTlight for spatial transcriptomics, and scpDeconv for proteomics. Many transcriptomic methods assume Poisson or negative binomial distributions, which do not suit other omics.", "kw": ["MuSiC", "CIBERSORTx", "scpDeconv"], "info": "Spatial methods may also attribute biological variation in nonspatial data to spatial effects. Using a different tool for each omics layer adds systematic biases that cannot be quantified and makes workflows fragmented.", "concl": "No dedicated deconvolution tool existed for metabolomics, even though the authors state that metabolomics correlates most closely with clinical phenotypes."}, {"type": "qa", "section": "Introduction", "q": "What are the three technical challenges for a universal deconvolution framework?", "a": "First, omics types differ in scale, distribution, sparsity and feature dimensionality. Second, the single-cell reference may miss cell types that are in the tissue. Third, reference and tissue data come from different donors, technologies and health states, which creates strong batch effects.", "kw": ["batch effect", "cell-type mismatch"], "info": "The mismatch problem is framed as estimating the relative abundances of n known cell types in tissue that contains n + m cell types (m at least 1), with a reference that has only n types.", "concl": ""}, {"type": "qa", "section": "Results - Overview of DECODE", "q": "What does DECODE do in stage 1?", "a": "It generates pseudotissue training samples. For each sample, cell-type proportions are drawn from a uniform distribution, cells are randomly sampled from the single-cell data in those proportions, and their profiles are summed. Repeating this many times gives the training set.", "kw": ["pseudotissue", "pseudo-bulk"], "info": "The proportions are updated after rounding the per-type cell counts, so labels match the cells actually sampled. Rules for choosing cells per pseudotissue (m) and the number of pseudotissues (U) are in the Supplementary Information.", "concl": ""}, {"type": "qa", "section": "Results - Overview of DECODE", "q": "How does DECODE remove batch effects between pseudotissue and real target data (stage 2)?", "a": "With adversarial training. An encoder, a discriminator and a shallow deconvolution module (eDeconvolver) are trained together with L1 and binary cross-entropy losses. The aim is that the discriminator cannot tell whether a feature came from train-tissue or target-tissue, while the deconvolution signal is kept.", "kw": ["adversarial training", "discriminator"], "info": "After stage 2 the encoder parameters are frozen and passed to stage 3.", "concl": ""}, {"type": "qa", "section": "Results - Overview of DECODE", "q": "What happens in stage 3?", "a": "Noise of up to 10% is added twice to each train-tissue sample to make training pairs. These pass through the frozen encoder and a dimension-expansion module (DimExpander). An attention-based denoiser then splits the embedding into noise features and purified tissue features.", "kw": ["denoiser", "contrastive learning", "DimExpander"], "info": "Purified features pass through linear attention and a deconvolver to predict proportions. Training is supervised by L1 loss plus a contrastive learning loss.", "concl": "Stage 3 is what makes DECODE robust to noise and to cell types missing from the reference."}, {"type": "qa", "section": "Results - Overview of DECODE", "q": "What are the two inference pathways in stage 4?", "a": "Standard deconvolution is used when the reference covers all cell types in the tissue. Relative deconvolution through the denoiser is used when the tissue contains unknown cell types, which the authors call the common real-world case.", "kw": ["inference", "relative deconvolution"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Transcriptomic and proteomic deconvolution", "q": "Which methods was DECODE compared against, and with which metrics?", "a": "TAPE, CIBERSORTx, MuSiC, scpDeconv, Scaden, RCTD, Seurat, SPOTlight, Tangram, ucdselect and cell2location. The metrics were Lin's concordance correlation coefficient (CCC), root mean square error (RMSE) and Pearson's r.", "kw": ["CCC", "RMSE", "benchmark"], "info": "The Methods text says 12 state-of-the-art methods but lists only 11 names; the figures show 12 bars because DECODE is included.", "concl": ""}, {"type": "qa", "section": "Results - Transcriptomic and proteomic deconvolution", "q": "Which 7 benchmark scenarios were used across the 15 datasets?", "a": "1: cross-donor (human lung RNA). 2: cross-disease (human breast RNA, ER-positive train, ER-negative test). 3: cross-health state (breast CyTOF proteomics, premenopausal train, postmenopausal test). 4: cross-dataset and cross-platform (mouse islet RNA and mouse cell line proteomics). 5: spatial (STARmap visual cortex, Slide-seqV2 hippocampus). 6: many cell types (human retina, 17 types). 7: real blood tissue with ground truth.", "kw": ["benchmark scenarios"], "info": "Scenarios 1-6 used pseudotissues made by mixing single cells. Scenario 7 used three real peripheral blood transcriptomic datasets (Monaco, Newman, SDY67).", "concl": ""}, {"type": "qa", "section": "Results - Transcriptomic and proteomic deconvolution", "q": "How did DECODE perform against the other methods in scenarios 1-7?", "a": "DECODE had the top CCC in the cross-donor, cross-disease, cross-health state, cross-dataset, spatial and many-cell-type tasks. In a few cases other methods had slightly higher Pearson correlation (scenarios 1, 2, 4 and 5), and on the real Monaco data DECODE had slightly higher RMSE than TAPE and Scaden.", "kw": ["CCC"], "info": "In scenario 7 each dataset has only about 10-20 samples with very concentrated proportions, so the authors say per-cell-type metrics are unstable and overall performance is more reliable.", "concl": "The authors conclude that DECODE is currently the most effective deconvolution method for both transcriptomics and proteomics."}, {"type": "qa", "section": "Results - Transcriptomic and proteomic deconvolution", "q": "Is DECODE computationally efficient?", "a": "On the scenario 1 dataset it ranked fifth in peak memory and fourth in runtime among the methods compared, which the authors call reasonable efficiency.", "kw": ["runtime", "memory"], "info": "From the figure: about 2,000 MB peak RAM and well under 100 s. TAPE used close to 9,000 MB, and Scaden took over 1,000 s.", "concl": ""}, {"type": "qa", "section": "Results - Metabolomics deconvolution", "q": "Which single-cell metabolomics datasets were used?", "a": "Mouse liver (244 metabolite features; hepatocytes, Kupffer cells, endothelial cells), mouse bone marrow (107 features; GMPs, B, T, myeloid, erythroid cells) and human colorectal cancer (112 features; cancer cells, fibroblasts, B, myeloid, T cells).", "kw": ["single-cell metabolomics"], "info": "Liver and bone marrow had no donor information, so each was split equally into train and test halves. For colorectal cancer, the model was trained on mismatch repair-deficient samples and tested on conventional samples. Cell numbers were 724, 1,428 and 57,078.", "concl": ""}, {"type": "qa", "section": "Results - Metabolomics deconvolution", "q": "Why is metabolomics harder to deconvolve than transcriptomics or proteomics?", "a": "There are far fewer features: hundreds of metabolites, compared with tens of thousands of RNAs or about 1,000-3,000 proteins per cell with SCoPE or nanoPOTS. Metabolomic profiles are also very similar between cell types.", "kw": ["feature similarity", "Kendall similarity"], "info": "Kendall similarity between mouse liver cell types was 0.93-0.95 for metabolomics, 0.57-0.68 for proteomics and about -0.08 to 0.16 for transcriptomics. In bone marrow, only GMPs had clearly distinct metabolites.", "concl": "DECODE has to pick up subtle signals of difference between cells."}, {"type": "qa", "section": "Results - Metabolomics deconvolution", "q": "How did DECODE perform on metabolomics?", "a": "DECODE was only slightly below MuSiC in CCC on mouse liver and outperformed all other methods on every other metric and dataset. Its predicted-versus-true points lie close to the 1:1 line.", "kw": ["MuSiC", "metabolomics"], "info": "CIBERSORTx failed to run on the liver and colorectal cancer data, and MuSiC failed on colorectal cancer. For poorly characterized cell types, other methods showed truncated x axes on the predicted-versus-true plots, meaning they could not separate weak signals between cells.", "concl": ""}, {"type": "qa", "section": "Results - Cell state deconvolution", "q": "What is a cell state, and which cell state datasets were used?", "a": "Cell states are conditions such as differentiation, activation or apoptosis, as opposed to cell types. Three datasets were used: monocyte pseudotime from scRNA-seq (10 states), melanoma and monocyte cell cycle proteomics (G1, S, G2), and melanoma drug treatment with 20 proteins and metabolites (days 0, 1, 3, 5).", "kw": ["cell state", "pseudotime", "cell cycle"], "info": "Pseudotime values (0-1) were split into 10 bins. For the cell cycle data, the model trained on melanoma and tested on monocytes; only 39 differential proteins across phases were used, out of 2,844. Melanoma cells carried BRAF V600E.", "concl": ""}, {"type": "qa", "section": "Results - Cell state deconvolution", "q": "How well did DECODE recover cell state abundances?", "a": "DECODE had the best performance on all three cell state datasets. This includes MeDuSA, a method designed specifically for pseudotime state abundance, on the monocyte dataset.", "kw": ["MeDuSA"], "info": "MeDuSA needs continuous pseudotime labels, so it was compared only on dataset 1. CIBERSORTx failed on datasets 2 and 3.", "concl": "DECODE can recover state abundances related to pseudotime, the cell cycle and responses to drugs."}, {"type": "qa", "section": "Results - Cell state deconvolution", "q": "Why could a model trained on melanoma cell cycle data be tested on monocytes?", "a": "Differentially expressed proteins between phases overlapped strongly between the two cell types. Cell cycle state gave highly consistent protein expression regardless of cell type.", "kw": ["cell cycle"], "info": "Differential proteins were tested with a two-sided Wilcoxon rank-sum test with Benjamini-Hochberg correction.", "concl": ""}, {"type": "qa", "section": "Results - Incomplete single-cell references", "q": "Why are single-cell references often incomplete?", "a": "Some cell populations are lost during library preparation, and dissociation steps such as enzymatic digestion can destroy specific cell types (for example podocytes). Single-cell proteomics and metabolomics are mostly mass spectrometry-based and often use in vitro cell lines, so rare cell types are missing.", "kw": ["reference incompleteness"], "info": "Scaden examined how unknown cell types affect stability but did not solve the problem.", "concl": ""}, {"type": "qa", "section": "Results - Incomplete single-cell references", "q": "How did they test robustness to unknown cells and noise?", "a": "Unknown cell types were added step by step to the test data: neutrophils in lung transcriptomics, vascular lymphatic cells held out of training in breast proteomics, and hematopoietic stem cells in bone marrow metabolomics. Three perturbations were also applied: random scaling by 0.9-1.1, scaling by 0.8 or 1.2, and zeroing or deleting features.", "kw": ["perturbation", "unknown cell types"], "info": "For the low-dimensional, continuous proteomic and metabolomic data, features were removed and the models retrained instead of zeroing test features, because these data are very sensitive to missing values. The proportion of unknown cells went from 3.3% to 20%, and perturbed features from 5% to 20%.", "concl": ""}, {"type": "qa", "section": "Results - Incomplete single-cell references", "q": "What did the robustness tests show?", "a": "DECODE outperformed other methods in most comparisons, especially in CCC, with a few suboptimal cases in transcriptomics. On metabolomics, every method except DECODE gave unusable results.", "kw": ["robustness"], "info": "Bone marrow metabolomics: DECODE CCC fell from about 0.77 to about 0.57 as unknown cells increased to 20%; the next best was about 0.45 or lower (read from the figure).", "concl": "Metabolomic data are the most sensitive to noise because they have few features and low cell-type specificity."}, {"type": "qa", "section": "Results - Incomplete single-cell references", "q": "Was DECODE also the most stable method (lowest coefficient of variation)?", "a": "Not always. In transcriptomics, Scaden, scpDeconv and RCTD had lower CVs than DECODE for all three metrics in all four scenarios. In proteomics, Scaden and scpDeconv usually had lower CVs, except at the 0.8 or 1.2 noise level, but DECODE still had the highest accuracy.", "kw": ["coefficient of variation"], "info": "CV was compared only among competitive methods, because stability means little when accuracy is very low. CVs were rescaled to [0.1, 1] for plotting. In metabolomics, only DECODE gave usable results, so stability was not compared.", "concl": "DECODE is the most accurate method, but not always the most stable one."}, {"type": "qa", "section": "Results - Consistency across omics", "q": "How did they test whether DECODE gives consistent results across omics?", "a": "With a PBMC CITE-seq dataset (43,791 cells; transcriptome plus surface proteins; CD4 T, CD8 T, B, NK and myeloid cells). Training pseudotissues came from donor HS1, and transcriptomic and proteomic test pseudocohorts from donor HS5.", "kw": ["CITE-seq", "PBMC"], "info": "1,101 highly variable genes and 205 protein features were used. GEO accession GSE253721.", "concl": ""}, {"type": "qa", "section": "Results - Consistency across omics", "q": "What were the cross-omics consistency results?", "a": "DECODE outperformed all other methods and performed almost identically on both omics (CCC about 0.95 on each, read from the figure). Across 1,000 test samples, its predictions from RNA and protein had low KL divergence and high Spearman correlation.", "kw": ["KL divergence", "Spearman"], "info": "Significance was tested with a one-tailed Wilcoxon test with Bonferroni correction on sample-wise CCC values. TAPE was the least consistent between omics.", "concl": "One method for all omics layers reduces error accumulation when cell abundances are compared across omics and cohorts."}, {"type": "qa", "section": "Results - Consistency across omics", "q": "Which real multiomics cohorts did they apply DECODE to?", "a": "Human breast cancer: 238 samples (transcriptomics and proteomics, 4 studies): nonmetastatic primary (n = 99), primary with brain metastasis (n = 45) and brain metastatic lesions (n = 94), with 9 cell types. Mouse liver: 285 samples (transcriptomics, proteomics and metabolomics, 10 studies): chow (208), HFD (63), HFD-TLC (4), NASH (6) and WDA (4), with 3 cell types.", "kw": ["breast cancer", "mouse liver", "NASH"], "info": "The breast reference was single-cell multiomics data from the Wu et al. breast cancer atlas. The liver references were single-cell transcriptomic, proteomic and metabolomic data from three studies. Some liver groups are very small (n = 4-6).", "concl": ""}, {"type": "qa", "section": "Results - Consistency across omics", "q": "What did DECODE find in the breast cancer cohorts?", "a": "Nonmetastatic primary tumors had more T cells (1.14-fold vs metastatic primaries, 1.23-fold vs brain metastases) and more perivascular-like (PVL) cells (1.48- and 1.64-fold). They had fewer B cells (1.70- and 1.47-fold lower). Plasmablasts were 1.14-fold higher than in metastatic primaries but 1.36-fold lower than in brain metastases.", "kw": ["T cells", "PVL cells", "B cells"], "info": "Example P values: PVL vs brain metastasis P = 2.85e-20; B cells vs metastatic primaries P = 6.79e-21. Two-sided unpaired t-test with no multiple-testing adjustment (figure legend).", "concl": "The authors suggest protective roles for T cells and PVL cells and an association of higher B cell abundance with metastatic progression."}, {"type": "qa", "section": "Results - Consistency across omics", "q": "What did DECODE find in the mouse liver cohorts?", "a": "In chow mice, estimates from all omics agreed with consensus values of about 70% hepatocytes and 15% Kupffer cells. Kupffer cells increased 1.23-fold in WDA (P = 1.38e-2) and 1.61-fold in NASH (P = 2.06e-13), and stayed stable in HFD. Hepatocytes fell 1.12-fold in NASH (P = 1.87e-3) and rose slightly in HFD (1.03-fold, P = 1.48e-2).", "kw": ["Kupffer cells", "hepatocytes", "NASH"], "info": "The decreases in hepatocytes in the HFD-TLC and WDA groups were not significant. The average hepatocyte share was 70.1% in chow, 72.5% in HFD, 66.1% in HFD-TLC, 69.3% in WDA and 62.6% in NASH.", "concl": "The authors suggest that sugar, cholesterol and alcohol together (WDA) activate Kupffer cells more than high-fat intake alone."}, {"type": "qa", "section": "Discussion", "q": "What do stages 2 and 3 each contribute, according to the authors?", "a": "Stage 2 (transferred adversarial training) aligns data across platforms, health states and sample types, which removes batch effects. Stage 3 (contrastive learning plus self-attention) corrects measurement bias and reconstructs purified features from noisy input.", "kw": ["ablation"], "info": "Their individual contributions were tested by splitting DECODE into three components (ablation, Supplementary Table 9).", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How did subtype-level deconvolution refine the breast cancer findings?", "a": "CD4+ T cells, CD8+ T cells and cycling T cells all tended to increase in nonmetastatic tumors. The B cell increase in metastatic tumors and brain metastases came mainly from naive B cells, not memory B cells.", "kw": ["naive B cells", "CD8+ T cells"], "info": "The authors link elevated naive B cells to impaired immune function in late-stage tumors but say causality needs experimental confirmation. Plasmablast enrichment in brain metastases was also flagged as needing validation.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Was there a sex effect in the NASH liver data?", "a": "Yes. Female NASH mice had more Kupffer cells than both controls and male NASH mice. This agrees with an earlier study reporting a stronger inflammatory response in female mice with NASH.", "kw": ["sex differences", "Kupffer cells"], "info": "Shown in Supplementary Fig. 19b; the NASH group had only n = 6.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What limitations of DECODE do the authors list?", "a": "Training needs artificial noise cells made by combining features from different single-cell types, which adds computational cost that grows with feature dimensionality. Also, few single-cell metabolomics datasets exist, and they mostly come from tissues other than blood, so robustness cannot be fully evaluated and use with cohort metabolomics is limited.", "kw": ["limitations"], "info": "The noise-cell step runs once per task, so the authors think it will not block clinical use. Future work: a dedicated spatial module and extension to other layers such as DNA methylation.", "concl": ""}, {"type": "qa", "section": "Methods - Data preprocessing", "q": "How were the single-cell transcriptomic data preprocessed?", "a": "With the Scanpy workflow: genes found in fewer than 3 cells were removed, and so were cells with fewer than 200 genes or counts, or with more than 20% mitochondrial reads. Counts were normalized to 10,000 per cell and log-transformed, and usually only highly variable genes were kept.", "kw": ["Scanpy", "highly variable genes"], "info": "Scanpy v1.9.8 (reporting summary). Each pseudotissue dataset was scaled to [0, 1] by dividing by its largest eigenvalue, and real bulk data were processed the same way. The eigenvalue-based scaling is stated without further explanation.", "concl": ""}, {"type": "qa", "section": "Methods - Datasets", "q": "What were the dataset sizes in the main transcriptomic scenarios?", "a": "Lung: 12,971 cells, 3,346 HVGs, donor 296C (female) for training and 302C (male) for testing. Breast: 100,064 cells, 2,525 HVGs, donors CID3586 (ER+) and CID3921 (ER-). Retina: fovea (34,723 cells) for training and periphery (19,768 cells) for testing, with 3,789 HVGs.", "kw": ["datasets"], "info": "Islet: GSE211799, 2,558 HVGs, donors VSG_MUC13634 for training and STZ_G1 for testing. Scenario 7 blood: 11,328 shared genes, of which 982 HVGs were used. Lung cell types: type 2 alveolar cells, luminal macrophages, dendritic cells and fibroblasts.", "concl": ""}, {"type": "qa", "section": "Methods - Datasets", "q": "What were the proteomic and spatial datasets?", "a": "Breast CyTOF: 751,970 cells, 34 proteins, 6 cell types. Murine cell lines (RAW 264.7, C10, SVEC) measured on two platforms: 108 and 72 cells with 1,437 and 1,032 proteins, of which the 762 shared proteins were used. Spatial: STARmap (882 genes, 1,523 cells, 189 spots of 750 µm) with a Smart-seq2 reference, and Slide-seqV2 (41,786 cells, 1,892 spots of 100 µm).", "kw": ["CyTOF", "STARmap", "Slide-seqV2"], "info": "The STARmap reference was Allen Brain Atlas Smart-seq2 data (14,249 cells). Slide-seqV2 was loaded via Squidpy and gridded using the ucdselect framework.", "concl": ""}, {"type": "qa", "section": "Methods - Model", "q": "What are the encoder, discriminator and eDeconvolver made of, and how is stage 2 trained?", "a": "Each is a small network: a linear layer, leaky ReLU and dropout, with layer normalization in the encoder, a sigmoid on the discriminator and a softmax on the eDeconvolver. Training labels train-tissue as 1 and target as 0. Loss1 is BCE plus the L1 deconvolution loss; Loss2 is BCE with the labels swapped, which updates the encoder and discriminator.", "kw": ["adversarial loss", "binary cross-entropy"], "info": "Two loss calculations and two parameter updates happen per batch.", "concl": ""}, {"type": "qa", "section": "Methods - Model", "q": "How are the artificial impurity (noise) cells made in stage 3?", "a": "One cell is sampled from each of the n reference cell types, and their features are mixed with a random weight matrix whose columns are positive and sum to 1. This is repeated to make a pool, and up to 10% of the pseudotissue cell capacity (m x 0.1) is added to make two noisy versions of each sample.", "kw": ["artificial impurity cells"], "info": "The noise cells are blends of known cell types, used to imitate unknown cell types in the tissue.", "concl": ""}, {"type": "qa", "section": "Methods - Model", "q": "How does the contrastive loss in stage 3 work?", "a": "It is a noise contrastive estimation (NCE) loss. Features sampled at the same position from clean train-tissue and from purified (denoised) features are positive pairs. Clean features paired with noise features are negative pairs. Positives are pulled together and negatives pushed apart.", "kw": ["NCE loss", "contrastive learning"], "info": "S points are sampled from the same positions and passed through an MLP. Total stage 3 loss is the sum of three L1 deconvolution losses and the denoiser NCE loss.", "concl": ""}, {"type": "qa", "section": "Methods - Evaluation and software", "q": "What is Lin's CCC, and why use it alongside Pearson's r?", "a": "CCC = 2 r sigma_y sigma_yhat divided by (sigma_y squared + sigma_yhat squared + (mu_y - mu_yhat) squared). It ranges from -1 to 1. Unlike Pearson's r, it also penalizes differences in mean and scale, so it measures agreement with the true proportions, not only correlation.", "kw": ["CCC", "Pearson's r"], "info": "The authors explain their use of Kendall similarity (robust to outliers, sensitive to subtle differences) for similar cell types, cosine similarity for sparse transcriptomic data, and Spearman for trend consistency.", "concl": ""}, {"type": "qa", "section": "Methods - Evaluation and software", "q": "What software and hardware were used?", "a": "Ubuntu 20.04, Python 3.8, PyTorch 2.0.0 with CUDA 11.8, on one NVIDIA RTX 4090 (24 GB) GPU and an Intel Xeon Gold 6430 CPU with 16 vCPUs. Statistics used SciPy (ttest_ind, wilcoxon) with Bonferroni correction.", "kw": ["PyTorch", "SciPy"], "info": "Reporting summary versions: scipy 1.10.1, numpy 1.24.2, scanpy 1.9.8, scikit-learn 1.3.2, pandas 2.0.3. Code is at github.com/forceworker/DECODE. The Fig. 6 legend says no multiple-testing adjustment was applied for the cohort t-tests, while the Methods mention Bonferroni; it is unclear which applies where.", "concl": ""}, {"type": "note", "section": "Results - Metabolomics deconvolution", "text": "Most metabolomics benchmarks split cells from the same dataset into train and test halves because donor information was missing. How well does DECODE work on real bulk metabolomics with a reference from another lab or platform?"}, {"type": "note", "section": "Results - Consistency across omics", "text": "Several mouse liver groups were tiny (HFD-TLC n = 4, WDA n = 4, NASH n = 6), and the cohort t-tests were not corrected for multiple testing. Treat the liver and breast biology as hypotheses, not findings."}, {"type": "note", "section": "Discussion", "text": "Could this framework (adversarial batch correction plus contrastive denoising for missing reference types) be applied to bulk RNA-seq or ATAC-seq of cavefish or zebrafish tissues using single-cell atlases as references? The authors mention extending it to DNA methylation."}], "key": "general/Zhao_2026_NatMethods_DECODE_omics_deconvolution", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Zhang_2026", "title": "Highly accurate ab initio gene annotation with ANNEVO", "category": "Computational methods", "link": "https://doi.org/10.1038/s41592-026-03036-7", "note": "", "source_pdf": "papers/general/Zhang_2026_NatMethods_ANNEVO_gene_annotation.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is ANNEVO?", "a": "A genomic language model based on a mixture of experts (MoE). It predicts genes ab initio, from genome sequence alone, by modelling distal sequence dependencies and joint evolutionary relationships across diverse genomes.", "kw": ["ANNEVO", "mixture of experts", "ab initio annotation"], "info": "Benchmarked on 566 phylogenetically diverse species. Published in Nature Methods 23, 740-748 (April 2026).", "concl": "ANNEVO clearly outperforms existing ab initio methods and performs as well as state-of-the-art evidence-based annotation pipelines."}, {"type": "qa", "section": "Abstract", "q": "What gap in gene annotation does the paper address?", "a": "Current methods struggle to model complex patterns of gene transmission, such as vertical inheritance and horizontal gene transfer. Ab initio methods also have limited accuracy.", "kw": ["horizontal gene transfer", "vertical inheritance"], "info": "Because ANNEVO needs no external evidence, it can also give more complete annotations than the reference annotations for many species and correct errors in them.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is ab initio gene annotation, and how did the classical tools do it?", "a": "It infers gene structures from genomic sequence composition alone. Early tools such as Augustus and GeneMark used hidden Markov models (HMMs) with static parameters.", "kw": ["Augustus", "GeneMark", "HMM"], "info": "Because ab initio accuracy was limited, people turned to automated pipelines such as BRAKER3. These add repeat masking and extrinsic evidence such as known proteins and RNA-seq.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are the problems with evidence-based annotation pipelines?", "a": "Species with little wet-lab data get poor annotations. Relying on expression data can miss genes with rare spatial or temporal expression. Processing the evidence is also computationally expensive.", "kw": ["BRAKER3", "RNA-seq evidence"], "info": "Because of these limits, nearly half of the species in NCBI GenBank have no annotation. The Earth BioGenome Project, which aims to sequence more than 1 million genomes within a decade, will make this worse.", "concl": "There is an urgent need for fast, highly accurate, evidence-free annotation."}, {"type": "qa", "section": "Introduction", "q": "How do recent deep learning tools such as Helixer and Tiberius approach annotation, and what do they lack?", "a": "They treat annotation as nucleotide-level sequence labelling. Architectures such as LSTMs predict class probabilities for each base, and these are then post-processed into gene structures.", "kw": ["Helixer", "Tiberius", "LSTM"], "info": "According to the authors, these tools recognise general syntactic patterns well but do not account for differences in genomic semantics across divergent clades. They also do not consider vertical and horizontal evolutionary trajectories.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why are long genes a particular challenge for annotation?", "a": "Long genes, for example products of gene fusion or of exon and intron expansion, involve distal interactions and complex patterns of paired splice sites. Existing methods use this distal information poorly.", "kw": ["long-range dependencies", "gene fusion"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How exactly is the annotation task defined in ANNEVO?", "a": "As sequence-based prediction of the longest coding transcript of each protein-coding gene across phylogenetically diverse species.", "kw": ["longest transcript"], "info": "This means ANNEVO does not predict alternative isoforms. See the limitations in the Discussion.", "concl": ""}, {"type": "qa", "section": "Results - Overview of the ANNEVO framework", "q": "What are the three main components of ANNEVO?", "a": "Context extension (adds flanking sequence to each genome segment), a neural network (predicts gene structure classes at nucleotide resolution) and gene structure decoding (Viterbi algorithm to produce biologically valid gene models).", "kw": ["context extension", "Viterbi"], "info": "Context extension prevents bias at the edges of segments. A targeted loss masking strategy lets the model use flank and error-region sequence as input without training on their labels.", "concl": ""}, {"type": "qa", "section": "Results - Overview of the ANNEVO framework", "q": "How does ANNEVO handle deep evolutionary divergence between major groups?", "a": "It trains five separate clade-specific models: Fungi, Embryophyta, Invertebrates, Vertebrate_other and Mammalia, following RefSeq's taxonomic groups. You pick the model that matches the genome being annotated.", "kw": ["clade-specific model", "RefSeq"], "info": "Keeping distant groups in separate models prevents negative interference between them. Diversity within each clade is handled by the MoE architecture inside each model.", "concl": ""}, {"type": "qa", "section": "Results - Overview of the ANNEVO framework", "q": "Why is the distal information modelling module compared to Hi-C?", "a": "A convolutional tower first compresses subregions into bins. A Transformer then computes interactions between bins rather than between single nucleotides, similar to how Hi-C measures contacts between regions.", "kw": ["Transformer", "Hi-C analogy"], "info": "This lets ANNEVO model sequences up to about 40 kb long.", "concl": ""}, {"type": "qa", "section": "Results - Overview of the ANNEVO framework", "q": "What does the joint evolutionary modelling (MoE) module do?", "a": "Several expert subnetworks each specialise on a subclade. A controller weighs how much each expert contributes, based on the composition of the input sequence.", "kw": ["mixture of experts", "gating"], "info": "During training each expert becomes specialised for a subclade. During prediction the model adjusts its feature representation to the sequence automatically. There are eight experts, and the final representation is a weighted sum of their outputs.", "concl": ""}, {"type": "qa", "section": "Results - Overview of the ANNEVO framework", "q": "What does the resolution restorer module do?", "a": "It upsamples the coarse binned representation back to single-nucleotide resolution. It uses stacked transposed convolutions interleaved with normalisation and convolution layers.", "kw": ["transposed convolution", "resolution restorer"], "info": "This step is needed for exact base-level placement of features such as splice sites.", "concl": ""}, {"type": "qa", "section": "Results - Annotation across divergent clades", "q": "How many species were tested, and how was Augustus set up for a fair comparison?", "a": "566 RefSeq species: 288 Fungi, 128 Embryophyta and 50 each of Invertebrate, Vertebrate_other and Mammalia. Augustus was trained separately for each test species using evolutionarily close relatives.", "kw": ["Augustus", "benchmark"], "info": "ANNEVO, in contrast, uses one species-agnostic model per clade. For the animal clades, 50 species were randomly subsampled from the candidates, with model organisms and representative taxa prioritised.", "concl": ""}, {"type": "qa", "section": "Results - Annotation across divergent clades", "q": "How much better was ANNEVO than Augustus across the five clades?", "a": "Mean improvements were 8.8-25.6% in nucleotide-level F1, 13.5-45.2% in gene-level F1 and 11.6-37.8% in BUSCO score. Each range runs from the smallest to the largest clade mean.", "kw": ["F1 score", "BUSCO"], "info": "This held even though Augustus used a bespoke model for each species and ANNEVO used one model per clade.", "concl": "ANNEVO combines cross-species evolutionary signal into one predictor and does not need species-specific parameters."}, {"type": "qa", "section": "Results - Annotation across divergent clades", "q": "How fast is ANNEVO compared with Augustus?", "a": "About fivefold faster with the same 48-thread parallelisation. It annotated the Arabidopsis genome in 3.4 minutes and the human genome in 1.4 hours.", "kw": ["runtime"], "info": "Fitted runtime against genome size: Augustus y = 2.53x + 0.26 hours, ANNEVO y = 0.47x hours (x in Gb). The Augustus time counts decoding only, while the ANNEVO time includes network inference plus decoding. The speed comes from parallelisation in the decoding step.", "concl": ""}, {"type": "qa", "section": "Results - Length-robust gene prediction", "q": "In which clade did ANNEVO gain the most over Augustus, and why?", "a": "In Mammalia, likely because mammals have characteristically longer genes. The BUSCO advantage over Augustus grew with clade gene length, to almost 40 points in Mammalia (read from Fig. 2d).", "kw": ["gene length", "Mammalia"], "info": "Gene length was defined as the distance from start to stop codon of the longest transcript, including introns.", "concl": ""}, {"type": "qa", "section": "Results - Length-robust gene prediction", "q": "How did prediction accuracy change with gene length?", "a": "Augustus fully predicted 52.9% of mammalian genes of 0-10 kb but only 25.2% of genes over 100 kb. ANNEVO kept or even improved its accuracy for longer genes, at roughly 78-90% across the length bins.", "kw": ["length robustness"], "info": "The ANNEVO percentages are read from the Fig. 2e bar chart. The genes were mammalian protein-coding genes split into 0-10, 10-40, 40-100 and over 100 kb groups. The text gives 1,035,026 genes, but the Fig. 2d legend gives 1,035,058 for Mammalia, a small inconsistency in the paper. The authors attribute Augustus's decline to its short-term memory.", "concl": ""}, {"type": "qa", "section": "Results - Length-robust gene prediction", "q": "Which example long genes did ANNEVO reconstruct?", "a": "It fully reconstructed 13 genes longer than 400 kb, including human GMDS (621 kb, the longest case). It also exactly reconstructed DYNC2H1 (370 kb, 89 coding exons). Augustus split these genes into several fragments with misannotated splice sites.", "kw": ["GMDS", "DYNC2H1"], "info": "The authors credit this to the Hi-C-inspired long-range modelling.", "concl": ""}, {"type": "qa", "section": "Results - Comparison with evidence-based pipelines", "q": "Which tools was ANNEVO compared against in the 12-model-species benchmark?", "a": "Augustus-Evidence (with RefSeq repeat masking, RNA-seq and proteins), GeneMark-ETP and BRAKER3 (same evidence), and two sequence-only deep learning tools, Helixer and Tiberius.", "kw": ["BRAKER3", "GeneMark-ETP", "Helixer"], "info": "The 12 species were Aspergillus oryzae, Arabidopsis thaliana, Zea mays, Homo sapiens, Rattus norvegicus, Sus scrofa, Drosophila melanogaster, Bombyx mori, Danio rerio, Gallus gallus, Xenopus tropicalis and Oryzias latipes. The evidence-based tools were deliberately favoured with RNA-seq from five tissues and proteomes from close relatives. Tiberius was only run on the vertebrate clades.", "concl": ""}, {"type": "qa", "section": "Results - Comparison with evidence-based pipelines", "q": "How did ANNEVO do on Sus scrofa compared with BRAKER3?", "a": "Nucleotide-level F1 was 0.934 for ANNEVO versus 0.741 for BRAKER3. ANNEVO's gene completeness was 85.2%, 21.6 points higher than BRAKER3 at comparable precision. Its BUSCO was 96.0 versus 75.9.", "kw": ["Sus scrofa", "BRAKER3"], "info": "Other BUSCO scores on pig: Tiberius 89.6, Augustus-Evidence 88.4, GeneMark-ETP 81.4, Helixer 68.4. ANNEVO also kept lower false-positive rates.", "concl": ""}, {"type": "qa", "section": "Results - Comparison with evidence-based pipelines", "q": "What were the average scores across the 12 model species?", "a": "ANNEVO had NT-F1 0.92, gene-F1 0.82 and BUSCO 96.6. BRAKER3 had 0.85, 0.78 and 93.9. Helixer had 0.88, 0.71 and 90.3.", "kw": ["model species", "benchmark"], "info": "GeneMark-ETP: 0.66, 0.50, 95.0. Augustus-Evidence: 0.81, 0.60, 92.9. At the nucleotide level, ANNEVO recall was 0.922 versus 0.805 for BRAKER3, and precision was 0.919 versus 0.906.", "concl": "Using only genome sequence, ANNEVO outperformed BRAKER3, which used multi-tissue RNA-seq and protein evidence."}, {"type": "qa", "section": "Results - Comparison with evidence-based pipelines", "q": "How does ANNEVO compare with Tiberius?", "a": "Tiberius came closest to ANNEVO in Mammalia but dropped sharply in Vertebrate_other. Across 43 test mammals, ANNEVO was higher by 5.9% NT(CDS)-F1, 1.0% gene-F1 and 3.5% BUSCO.", "kw": ["Tiberius"], "info": "Tiberius is more conservative: gene precision 2.3% higher than ANNEVO but gene recall 4.5% lower. The authors suggest gene length modelling during decoding may explain this. Over six vertebrate model species, the averages were ANNEVO 0.92/0.81/95.7 and Tiberius 0.78/0.65/75.0. It is not explained why 43 mammals were used here when 50 mammalian test species are listed elsewhere.", "concl": ""}, {"type": "qa", "section": "Results - Comparison with evidence-based pipelines", "q": "How does ANNEVO compare in runtime and GPU memory with other tools?", "a": "On GPU it was about 5x faster than Tiberius, 24x faster than Helixer and 83x faster than BRAKER3. On CPU only, it was more than 10x faster than all others and more than 20x faster than Tiberius.", "kw": ["GPU memory", "runtime"], "info": "Average runtimes on GPU (4 species): BRAKER3 49.7 h, Helixer 14.4 h, Tiberius 2.8 h, ANNEVO 0.6 h. On CPU (7 species): BRAKER3 56.8 h, Helixer 57.3 h, Tiberius 110.3 h, ANNEVO 5.1 h. BRAKER3 time excludes RNA-seq alignment. GPU memory at batch size 8 for mammalian genomes: ANNEVO 3 GB, Helixer 8.6 GB, Tiberius more than 32 GB.", "concl": ""}, {"type": "qa", "section": "Results - Improving reference annotations", "q": "How often did ANNEVO beat the reference annotations in BUSCO completeness?", "a": "In 318 of 793 species (40.1%; 566 RefSeq and 227 Ensembl). Against Ensembl, it was better in 60% of Fungi (24/40), 72% of Embryophyta (60/83) and 68% of Vertebrate_other (34/50).", "kw": ["RefSeq", "Ensembl", "BUSCO"], "info": "For Embryophyta, mean BUSCO was 95.6% versus 91% (n = 83, P = 1.8 x 10^-6, two-sided Mann-Whitney U test). Against RefSeq, the mean differences were mostly slightly negative except in Fungi (Fig. 4b). So RefSeq references are generally harder to beat.", "concl": ""}, {"type": "qa", "section": "Results - Improving reference annotations", "q": "How were ANNEVO's corrections of Ensembl validated in Brassica oleracea?", "a": "ANNEVO found 55 additional BUSCO genes with full RNA-seq support, over 3% of all BUSCO orthologs. It also made 23 RNA-seq-supported corrections in nearby, mostly non-BUSCO, less conserved genes.", "kw": ["Brassica oleracea", "Iso-Seq"], "info": "Error types read from Fig. 4c: BUSCO genes had 43 gene losses, 10 erroneous fusions and 2 other; surrounding genes had 8 gene losses, 10 fusions and 5 other. Other errors included incomplete models due to premature stop codons and wrong start codons due to incorrect splice sites. Validation used short-read RNA-seq and Iso-Seq.", "concl": "The improvements are real biology, not artefacts limited to conserved BUSCO genes."}, {"type": "qa", "section": "Results - Improving reference annotations", "q": "What did the gene fusion example show?", "a": "On B. oleracea chromosome 5, Ensembl had merged two distinct genes into one transcript at a splice junction with no RNA-seq or Iso-Seq support. ANNEVO split them into the BUSCO gene and its neighbour.", "kw": ["gene fusion error"], "info": "The region is chr. 5:39558654-39563623, Ensembl transcript Bo5g127470.1, visualised in IGV.", "concl": ""}, {"type": "qa", "section": "Results - Model ablation and fine-tuning", "q": "Which module contributes most to performance according to the ablation?", "a": "The joint evolutionary (MoE) module. Removing it with parameter count unchanged dropped NT-F1, gene-F1 and BUSCO by 2.3%, 7.8% and 6.3% (0.93 to 0.90, 0.80 to 0.72, 95.8 to 89.5).", "kw": ["ablation", "mixture of experts"], "info": "Removing the resolution restorer and mapping features directly to nucleotides also reduced performance (0.91, 0.76, 93.7).", "concl": "Modelling cross-clade relationships with MoE is key to accuracy and generalisability."}, {"type": "qa", "section": "Results - Model ablation and fine-tuning", "q": "What happened when the distal modelling module was replaced by a SpliceAI-like architecture?", "a": "GPU requirement rose 2.5-fold and training speed fell 8.8-fold. The projected training time for the Mammalia model became an impractical 56 days.", "kw": ["SpliceAI", "computational efficiency"], "info": "GPU memory per sample was 5.1 GB versus 2.0 GB, and throughput was 12.3 versus 108.8 samples/s. The Extended Data legend calls the replacement a pure CNN-based architecture.", "concl": ""}, {"type": "qa", "section": "Results - Model ablation and fine-tuning", "q": "Does fine-tuning ANNEVO on a specific subclade help?", "a": "Full-parameter fine-tuning did not help, likely due to overfitting and MoE instability. Fine-tuning only the task-specific module gave modest gains.", "kw": ["fine-tuning"], "info": "Test species were Homo sapiens and Echinops telfairi, the mammal with the largest BUSCO gap between ANNEVO and RefSeq. For human, gene-F1 went from 0.772 to 0.793 and BUSCO from 95.7 to 96.5. For Echinops, gene-F1 went from 0.737 to 0.743 and BUSCO from 85.3 to 86.6. A fine-tuned non-MoE model stayed far lower (human 0.714/91.7, Echinops 0.682/79.1).", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How common is a lack of transcriptomic data among the test species?", "a": "Of the 566 RefSeq test species, 46% (261) have no transcriptomic data at all. 72% (410) have fewer than five transcriptomic datasets in NCBI SRA.", "kw": ["SRA", "data paucity"], "info": "Even well-sampled species can have incomplete annotations because of spatiotemporal variation in expression.", "concl": "ANNEVO serves two roles: a primary annotator for new genomes and a refinement tool for existing database annotations."}, {"type": "qa", "section": "Discussion", "q": "Why do the authors stress computational efficiency?", "a": "Genomic large language models are very computationally demanding, which limits their real-world use. Genome annotation needs high throughput on contig-scale inputs, unlike protein tasks where minutes per sequence is acceptable.", "kw": ["genomic LLM"], "info": "ANNEVO's efficiency comes from its distal modelling module and from decoding optimisations that constrain the search space and increase parallelism. This reduces its dependence on GPUs.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What are ANNEVO's main limitations?", "a": "It annotates only the longest transcript of protein-coding genes, with no multi-isoform output. It does not annotate noncoding RNAs. It struggles with regions underrepresented in training, such as UTRs and rare splice types like AT-AC introns.", "kw": ["isoforms", "UTR", "AT-AC introns"], "info": "Matching predictions to any annotated isoform instead of only the longest raised gene-F1 from 0.817 to 0.833 (recall 0.833 to 0.850, precision 0.804 to 0.820). UTRs are hard to benchmark because of alternative transcription start sites and polyadenylation. The authors note that SpliceAI also fails on AT-AC introns.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What are ANNEVO's false positives?", "a": "60.6% overlap fragmented mRNAs and 18.3% overlap annotated noncoding transcripts at exon level. This suggests many false positives are biologically relevant.", "kw": ["false positives"], "info": "Breakdown from Extended Data Fig. 7e: mRNA 60.64%, pseudogene 7.46%, other transcript 6.25%, lncRNA 4.55%, no overlap with any known transcript 21.10%.", "concl": "Extending ANNEVO to noncoding RNAs is a promising future direction, possibly using seq2img-style representation learning to capture RNA secondary structure."}, {"type": "qa", "section": "Methods - Data sources and processing", "q": "Which genome and annotation data were used?", "a": "The latest assemblies and annotations as of July 2024: RefSeq from the NCBI FTP site (1,828 species) and Ensembl (428 species). Ensembl data came from release 112 for animals and Ensembl Fungi and Ensembl Plants release 59.", "kw": ["RefSeq", "Ensembl"], "info": "Species with parsing-breaking errors were excluded. One example is Actinidia eriantha, where a gene extends beyond the end of its sequence. Ensembl species were grouped into the same five clades as RefSeq.", "concl": ""}, {"type": "qa", "section": "Methods - Data sources and processing", "q": "Why was RefSeq chosen over Ensembl for training?", "a": "For each clade they picked the database with the higher average BUSCO score of its species. RefSeq won for all five clades.", "kw": ["database selection"], "info": "Ensembl was used only as a supplementary evaluation of ANNEVO's completeness.", "concl": ""}, {"type": "qa", "section": "Methods - Data sources and processing", "q": "How were training, validation and test species chosen?", "a": "Each clade was divided into subclades. Within each subclade, the top percentile of species by BUSCO score was selected so every subclade had at least one species. Total genome size was capped at about 50-60 Gb per clade (12 Gb for fungi).", "kw": ["species selection", "data leakage"], "info": "For Mammalia, the top 5.5% per subclade gave 61 Gb. Selected species were split randomly into training and validation at a genome-size ratio of about 5:1, partitioned at a high taxonomic level so validation species were not close relatives of training species. All remaining species became test candidates: all were tested for Fungi and Embryophyta, and 50 per animal clade.", "concl": "The design is cross-species, so test genomes were never seen in training."}, {"type": "qa", "section": "Methods - ANNEVO methodology", "q": "How are genome segments built and encoded?", "a": "The genome is cut by sliding window into 30,720-bp core regions, each extended by 5,120 bp of flank on both sides, with zero padding where needed. Sequence is one-hot encoded, and ambiguous bases (N) are coded as [0.25, 0.25, 0.25, 0.25].", "kw": ["one-hot encoding", "sliding window"], "info": "Core plus flanks gives 40,960 bp, which matches the stated ~40 kb modelling range. Only the sequence of the flanks is used, not their annotation labels.", "concl": ""}, {"type": "qa", "section": "Methods - ANNEVO methodology", "q": "What labels does the model predict for each nucleotide?", "a": "Five classes taken from the longest transcript: intergenic, CDS0, CDS1, CDS2 (coding sequence in reading-frame phases 0, 1 and 2) and intron.", "kw": ["CDS phase", "labels"], "info": "Separate phase labels are critical for modelling codon structure and keeping the reading frame consistent.", "concl": ""}, {"type": "qa", "section": "Methods - ANNEVO methodology", "q": "What are the key architecture parameters of the network?", "a": "Five residual ConvBlocks expand channels from C = 64 to 320 and compress every 32 nucleotides into one bin. A 6-layer Transformer encoder follows (8 attention heads, hidden dimension 768), then 8 EvoExperts and a gating network (RelaCalNet).", "kw": ["ConvBlock", "EvoExpert", "Transformer encoder"], "info": "Each EvoExpert is two linear layers (320 to 768 to 320). The RelaCalNet gate is one linear layer mapping 320 to 8 expert weights. The resolution restorer is 5 transposed-convolution blocks, and its per-nucleotide probabilities are used as emission probabilities for decoding.", "concl": ""}, {"type": "qa", "section": "Methods - ANNEVO methodology", "q": "How did they deal with class imbalance and annotation errors during training?", "a": "Focal loss was the main objective, supplemented by dice loss to help minority classes (CDS, intron). Intergenic to CDS ratios can reach tens of thousands to one. Flank sites and preidentified erroneous sites were given loss weight zero.", "kw": ["focal loss", "dice loss", "loss masking"], "info": "Only the focal-loss focusing parameter was tuned; class weights were left unchanged so the model stays reusable on datasets with different class ratios. Examples of masked errors: implied introns of only 2 bp, and loci annotated without internal structure. The Fig. 1 legend calls this soft masking while the Methods say weight zero. Training used 4 Tesla V100S GPUs, about 2 GB per sample, and took 6-7 days for mammals.", "concl": ""}, {"type": "qa", "section": "Methods - ANNEVO methodology", "q": "How does gene structure decoding work?", "a": "Broad candidate gene regions are first identified so segments can be decoded in parallel, unlike HMMs that parallelise only per contig. Then the Viterbi algorithm finds the most probable state path, using a minimal set of states.", "kw": ["Viterbi", "splice site types"], "info": "States: intergenic, start codon, end codon, six CDS states (three phases) and intron state groups for GT-AG, GC-AG and AT-AC splicing. An intron always exits to the next CDS phase (CDS0 to CDS1), which fully prevents in-frame premature stop codons, including codons split across splice junctions. Emission probabilities need no manual tuning, unlike Augustus.", "concl": ""}, {"type": "qa", "section": "Methods - Evaluation metrics", "q": "What do the three evaluation metrics capture, and what are their weaknesses?", "a": "Nucleotide-level F1 covers all sites but misses gene structure. BUSCO captures structure but only for a small conserved core and ignores false positives. Gene-level F1 covers the whole gene set and does account for false positives.", "kw": ["BUSCO", "gene-level F1"], "info": "BUSCO genes in the Embryophyta database are only about 6% of Arabidopsis thaliana genes. BUSCO v5.3.2 was used.", "concl": ""}, {"type": "qa", "section": "Methods - Evaluation metrics", "q": "When is a predicted gene counted as correct for gene-level F1?", "a": "Predicted and reference proteins are compared with blastp. The top hit must have a bit score of at least 50 and an e-value below 1 x 10^-5, the genes must lie in the same genomic region, and the hit must cover more than 70% of both proteins.", "kw": ["blastp", "gene-level F1"], "info": "Only the longest-CDS transcript of each reference gene was used. Recall = TP/P (reference genes), precision = TP/PP (predicted genes), F1 = 2 x recall x precision/(recall + precision). The protein-level approach follows the BUSCO protein-mode protocol and reduces penalties for correct alternative isoforms.", "concl": ""}, {"type": "qa", "section": "Methods - Evaluation metrics", "q": "Which software versions were used for comparison and evidence processing?", "a": "Augustus v3.5.0, BRAKER3 v3.0.8, GeneMark-ETP (latest from GitHub), Helixer (downloaded 2025-03) and Tiberius (downloaded 2025-06). RNA-seq was processed with fastp v0.23.4, HISAT2 v2.2.1 and SAMtools v1.12; proteins were aligned with miniprot v0.13.", "kw": ["software versions"], "info": "Other tools: gffread v0.12.7, AGAT v1.4.2, SeqKit v2.8.2, GNU Parallel for Augustus, BUSCO v5.3.2. Code is at github.com/xjtu-omics/ANNEVO, free for non-commercial academic use only.", "concl": ""}, {"type": "note", "section": "Results - Comparison with evidence-based pipelines", "text": "Danio rerio and Oryzias latipes were benchmark species in Vertebrate_other. Check Supplementary Tables 23-27 to see whether Astyanax mexicanus was in training or test. Worth trying the Vertebrate_other model on cavefish and surface fish assemblies to look for missed or fused genes in the current annotation."}, {"type": "note", "section": "Discussion", "text": "ANNEVO predicts only the longest CDS transcript and no UTRs or ncRNAs. How useful is it for regulatory genomics work that depends on TSS and UTR positions, or on lncRNAs?"}, {"type": "note", "section": "Results - Improving reference annotations", "text": "ANNEVO usually beat Ensembl but not RefSeq on BUSCO, and the Brassica corrections were checked in only one species. How often are ANNEVO's disagreements with RefSeq actually right?"}], "key": "general/Zhang_2026_NatMethods_ANNEVO_gene_annotation", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Sudasinghe_2026", "title": "Phylogenomics of Cypriniformes, the most diverse order of freshwater fishes: consensus, challenges, and limitations", "category": "Genome & chromosome evolution", "link": "https://doi.org/10.1093/molbev/msag261", "note": "", "source_pdf": "papers/general/Sudasinghe_2026_MolBiolEvol_Cypriniformes_phylogenomics.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is the main goal and scope of this study?", "a": "To build the first phylogenomic tree of Cypriniformes that includes every family and many genera. It covers 316 species, about 30% of all described genera.", "kw": ["Cypriniformes", "phylogenomics"], "info": "Cypriniformes is the most species-rich order of freshwater fishes, with about 5,000 species. The dataset combines 257 newly assembled genomes with public genomes.", "concl": "The backbone topology of Cypriniformes is now established, so well-supported clades and regions of persistent conflict can be told apart clearly."}, {"type": "qa", "section": "Abstract", "q": "What kinds of phylogenetic conflict did the authors find?", "a": "Some relationships remain hard to resolve. The conflict comes from biological processes (ILS) and from possible model artifacts, and both can produce similar-looking patterns of discordance.", "kw": ["incomplete lineage sorting", "long-branch attraction", "gene tree discordance"], "info": "The placements of several miniaturized lineages are now better supported.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why are Cypriniformes an important group to study?", "a": "They are the most species-rich clade of freshwater fishes, with nearly 5,000 species in Asia, Europe, Africa and North America. They include several model organisms used in development, genetics, physiology and neuroscience, and they matter for fisheries, aquaculture and the aquarium trade.", "kw": ["Cypriniformes"], "info": "Ray-finned fishes make up about half of all vertebrate species (over 35,000). Freshwater covers less than 1% of Earth's surface but holds nearly 50% of all fish species.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What limited earlier molecular phylogenies of Cypriniformes?", "a": "Sparse taxon sampling, reliance on a few markers (mostly mtDNA or a few nuclear loci) or targeted capture, and missing major lineages. Some relationships were congruent across studies, but others stayed in persistent conflict.", "kw": ["taxon sampling"], "info": "The previous largest genomic dataset was Stout et al. 2016, which used anchored hybrid enrichment.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why are the miniaturized lineages hard to place?", "a": "They combine extreme morphological reduction, faster molecular evolution and possible long-branch attraction (LBA). Paedocypris, for example, has been placed as sister to all other Cypriniformes, as sister to Cyprinoidei, or inside Danionidae.", "kw": ["Paedocypris", "long-branch attraction", "progenetic miniaturization"], "info": "The problematic miniature taxa are Paedocypris, Sundadanio, Fangfangia and Danionella. Paedocypris includes some of the smallest known vertebrates.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How does polyploidy complicate phylogenetic inference in Cypriniformes?", "a": "Both autopolyploidy and allopolyploidy occur. The resulting whole-genome duplications create paralogs, and if paralogs are mistaken for orthologs they can distort the inferred relationships, especially in Cyprinidae and Catostomidae.", "kw": ["polyploidy", "whole-genome duplication", "paralogy"], "info": "Other sources of incongruence listed: ILS, introgression, rate heterogeneity, compositional bias, and model misspecification as a systematic source.", "concl": ""}, {"type": "qa", "section": "Results - Expanding the phylogenomic framework", "q": "How much larger is this dataset than earlier ones?", "a": "Taxon sampling (316 species) is about 84% larger than in Stout et al. 2016. The largest combined matrix, BUSCO.NT.C12+UCE, has 541,983 bp, about a 229% increase in total alignment size (sites x species).", "kw": ["BUSCO", "UCE"], "info": "The main tree in Fig. 1 is an ASTRAL-IV species tree with 335 species (including outgroups) and 1,167 loci.", "concl": ""}, {"type": "qa", "section": "Results - Expanding the phylogenomic framework", "q": "Did different inference methods agree?", "a": "Yes, broadly. Concatenation (IQ-TREE2) and coalescent-aware species trees (ASTRAL-IV, wASTRAL) gave congruent relationships. The reference-free, orthology-free ROADIES trees were also largely consistent, across three independent runs.", "kw": ["ASTRAL-IV", "wASTRAL", "ROADIES"], "info": "Concatenation trees were similar across all datasets. Coalescent-aware trees varied modestly between marker sets.", "concl": ""}, {"type": "qa", "section": "Results - Expanding the phylogenomic framework", "q": "Did paralogy from polyploidy distort the tree?", "a": "No evidence of that. ROADIES, which handles paralogs, agreed with the concatenation trees within Cyprinidae and Catostomidae. A neighbor-net of the BUSCO data showed no extra non-tree-like signal in the polyploid families compared with nonpolyploid ones.", "kw": ["neighbor-net", "paralogy", "polyploidy"], "info": "", "concl": "Paralogy does not appear to distort relationships within the polyploid families."}, {"type": "qa", "section": "Results - Expanding the phylogenomic framework", "q": "Were the results robust to models that target systematic error?", "a": "Yes. Three approaches gave broadly congruent relationships: the GHOST heterotachy model on a reduced dataset, Bayesian CAT-GTR (site-heterogeneous), and ML on RY-recoded data (which reduces compositional heterogeneity).", "kw": ["GHOST", "CAT-GTR", "RY-recoding"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Expanding the phylogenomic framework", "q": "How should high support values be read next to concordance factors?", "a": "Support for major relationships was uniformly high, which is expected for genome-scale data with low sampling variance. Concordance factors still showed considerable topological heterogeneity between loci.", "kw": ["concordance factors", "gCF", "sCF"], "info": "BUSCO.NT.C12 and UCE had the highest overall concordance. HUGHES.NT.C12 and MALMSTROM.NT.C12 showed more discordance.", "concl": ""}, {"type": "qa", "section": "Results - Expanding the phylogenomic framework", "q": "Were the families monophyletic?", "a": "Yes. Every family represented by more than one species was consistently recovered as monophyletic with strong support, although the amount of gene-tree discordance varied a lot between families.", "kw": ["monophyly"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Stable phylogenetic relationships", "q": "What are the stable relationships among the loaches (Cobitoidei)?", "a": "Botiidae is sister to all other loaches, followed in turn by Vaillantellidae and Cobitidae. Gastromyzontidae+Serpenticobitidae is usually sister to Balitoridae+Barbuccidae, and these four form a clade that is mostly sister to Nemacheilidae+Ellopostomatidae.", "kw": ["Cobitoidei", "loaches"], "info": "Ellopostomatidae as sister to Nemacheilidae had weaker support and a short internal branch.", "concl": ""}, {"type": "qa", "section": "Results - Stable phy
