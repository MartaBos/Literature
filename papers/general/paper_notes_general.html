impossible to study in vivo or very complex traits such as feed efficiency. However, immortalised cell lines represent the physiology of the target tissue poorly and do not capture genetic background differences between individuals or populations.", "kw": ["CRISPR screens", "cell lines"], "info": "", "concl": ""}, {"type": "qa", "section": "BFSP contribution - standards for in vitro systems", "q": "Which in vitro metadata rule sets does the FAANG Data Portal currently have?", "a": "Purified cells, cell culture, cell lines and organoid. These link each cell model to its original organism and tissue, and to the data generated at all levels.", "kw": ["metadata", "FAANG"], "info": "Expanding these rules is ongoing and draws on requirements from other species, for example the Organoid network of the Human Cell Atlas portal.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - standards for in vitro systems", "q": "What has the EuroFAANG RI done for in vitro model users since 2023?", "a": "Promoted best practices (sharing protocols, identifying new metadata), mapped European animal biobanks and set biobanking rules for tissues, germplasm, stem cells and edited cell lines, supported bilateral competitive research for breeding industry stakeholders, and documented state-of-the-art technologies for the in vitro to in vivo challenge.", "kw": ["biobanks", "EuroFAANG RI"], "info": "", "concl": ""}, {"type": "qa", "section": "BFSP contribution - standards for in vitro systems", "q": "What are digital twins in livestock?", "a": "AI-based in silico virtual models of individual animals, herds or populations. They use real-time sensor data (for example from wearables) to monitor and predict phenotypes such as health and behaviour, and to simulate management strategies before they are applied.", "kw": ["digital twins", "in silico"], "info": "Examples: anticipating disease outbreaks in poultry, and optimising dairy cattle feeding based on pasture health. Caveat: as data-derived entities they depend heavily on accurate metadata.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - real-world outcomes", "q": "What example shows multi-omics revealing host-pathogen mechanisms in livestock?", "a": "In vitro macrophage infection models for the mycobacteria that cause bovine tuberculosis (bTB) and Johne's disease. Combining transcriptomics (RNA-seq, microRNA-seq) with epigenomics (ChIP-seq) revealed how bovine alveolar macrophages are profoundly reprogrammed after infection with Mycobacterium bovis.", "kw": ["bovine tuberculosis", "ChIP-seq", "Mycobacterium bovis"], "info": "Such multi-omics work could guide breeding for disease resilience through biology-driven selection and genome editing, including high-throughput CRISPR screens to find functional variants.", "concl": ""}, {"type": "qa", "section": "BFSP contribution - real-world outcomes", "q": "What other real-world outcomes are proposed?", "a": "Data standards for biobanking to conserve biodiversity, tools for pangenome analysis and structural variant effect prediction (such as Ensembl Compara), and using MGnify and Ensembl microbes to characterise the microbiomes of low- and high-methane-emitting ruminants.", "kw": ["Ensembl Compara", "methane", "pangenome"], "info": "The microbiome datasets could help industry breed efficient, low-methane-emitting animals.", "concl": ""}, {"type": "qa", "section": "Global network of projects and infrastructures", "q": "What are the five aims of the GenoPHEnix ESFRI proposal?", "a": "1. Produce healthier farmed animals with the highest welfare standards. 2. Exploit animal variability through better phenotyping and genotyping. 3. Contribute to the 3Rs with in vitro and in vivo models for deep phenotyping. 4. Advance genome function analysis together with deep phenotyping from cell to farm and population level. 5. Provide tools for precise breeding, sustainable management and conservation of genetic diversity.", "kw": ["GenoPHEnix"], "info": "Its data infrastructure would expand the FAANG Data Portal to include phenotype data, in line with ELIXIR BFSP priorities.", "concl": ""}, {"type": "qa", "section": "Global network of projects and infrastructures", "q": "Which international initiatives is DAGP linked to?", "a": "ICAR (animal recording standards), the Ruminant T2T genome project, the Bovine PanGenome Project, and the steering committees of FAANG and FarmGTEx. After a workshop at ELIXIR All Hands 2025, there were discussions with AG2PI (USA) on encryption and sharing proprietary data.", "kw": ["FarmGTEx", "AG2PI", "ICAR"], "info": "Over the next five years they also expect shared training with the US Animal Breeding RCN: Farm Animal Genomics Collective. The COST Actions EU-LI-PHE and Insect-IMP could bring in additional species and European countries not yet represented.", "concl": ""}, {"type": "qa", "section": "Conclusions", "q": "What are the six initial key priorities of the DAGP Community?", "a": "1. Standardise phenomic data and metadata, including longitudinal behavioural and image data. 2. Consolidate data and metadata across submission platforms (for example single-cell data). 3. Share proprietary industry data with secure encryption. 4. Harmonise biobanking best practices. 5. Establish Persistent Unique Identifiers (PUIDs) for all data types from a given animal. 6. Better integrate omics with phenotype data, for example through the FAANG Data Portal.", "kw": ["PUIDs", "phenomics", "biobanking"], "info": "", "concl": "The core aim is to connect omics and phenotype data for domestic animals in ELIXIR core resources, so that the data are more visible, accessible and interoperable."}, {"type": "qa", "section": "Conclusions", "q": "Which Focus Group activities took place in 2025?", "a": "A workshop at the ELIXIR All Hands Meeting in June 2025 on expanding the FAANG Data Portal, an ELIXIR BioHackathon in November 2025 on minimal reporting standards for farmed animals based on the Plant Science standards, and an industry day with ELIXIR Norway in Oslo in October 2025 on big data in aquaculture.", "kw": ["BioHackathon", "aquaculture"], "info": "", "concl": ""}, {"type": "qa", "section": "Conclusions", "q": "What is the timeline for setting up the community (Figure 1)?", "a": "The idea came in April 2022 and the INFRA-DEV project started in January 2023. The Focus Group was approved in May 2024, GenoPHEnix was submitted in April 2025, and the Community was approved in December 2025. The white paper and roadmap were published in February 2026.", "kw": ["timeline"], "info": "Also: the idea was discussed at All Hands in Dublin (June 2023), the group was presented at All Hands in Uppsala (June 2024), and intent to become a community was formally notified to ELIXIR Heads of Nodes in May 2025. The GenoPHEnix outcome is expected in late 2026.", "concl": ""}, {"type": "qa", "section": "Conclusions", "q": "How will the priorities be funded and carried out?", "a": "Through ELIXIR implementation calls, development of the BFSP Science Tier Work Programme, other EU and international funding, and the GenoPHEnix proposal to the 2026 ESFRI Road Map update.", "kw": ["roadmap"], "info": "A separate RoadMap for 2025 to 2030 describes the main objectives and example tasks.", "concl": ""}, {"type": "note", "section": "DAGP community - organisational opportunities and role of ELIXIR", "text": "AQUA-FAANG produced omics data for six teleost species, but the paper does not name them. Worth checking the FAANG Data Portal for teleost regulatory and functional annotation datasets that could be compared with zebrafish and cavefish."}, {"type": "note", "section": "DAGP community - connections with ELIXIR platforms and communities", "text": "How would homomorphic encryption work in practice for joint G2P analysis of proprietary industry genotype and phenotype data? The paper names a case study but gives no method or results."}, {"type": "note", "section": "Conclusions", "text": "Follow up on the outcome of the GenoPHEnix ESFRI proposal (expected late 2026) and on the separate DAGP RoadMap 2025-2030 document."}], "key": "general/Clark_2026_F1000Res_ELIXIR_domestic_animals", "shared": "", "preprint": "", "tags": ["Damir's paper"], "nostar": false, "source_note": ""}, {"id": "Cisneros_2026", "title": "Evolutionary causes and consequences of gene duplication", "category": "Genome & chromosome evolution", "link": "https://doi.org/10.1038/s41576-026-00935-5", "note": "", "source_pdf": "papers/general/Cisneros_2026_NatRevGenet_gene_duplication.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is the main way new genes emerge, and why are paralogues kept?", "a": "Gene duplication is the main way new genes emerge. Models and empirical studies show that paralogues are kept because of dosage benefits, the partitioning of ancestral functions, or the gain of new functions.", "kw": ["gene duplication", "paralogues"], "info": "The gap the review addresses: the molecular mechanisms and the relative importance of the factors that push duplicates toward one fate or another have been hard to quantify.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Which recent methods made molecular studies of duplicate gene evolution possible?", "a": "Gene editing, deep mutational scanning and ancestral sequence reconstruction. Together they let researchers study duplicated gene evolution across timescales.", "kw": ["deep mutational scanning", "ancestral sequence reconstruction", "gene editing"], "info": "", "concl": "These approaches show how both adaptive and non-adaptive evolutionary forces shape the modern fates of gene duplicates."}, {"type": "qa", "section": "Introduction", "q": "How do paralogues originate?", "a": "At the gene level, they arise through mechanisms such as translocation and unequal crossing over. At the genome scale, they arise through genome doubling, either from errors in cell division or chromosome segregation (autopolyploidization) or from hybridization between species (allopolyploidization).", "kw": ["autopolyploidization", "allopolyploidization", "WGD"], "info": "Only a fraction of duplicates becomes fixed and is retained over evolutionary time. This reflects a combination of biochemical and evolutionary constraints.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What fraction of genes in modern genomes are duplicates?", "a": "Duplicates from whole-genome duplications and small-scale duplications make up about 17% of genes in Haemophilus influenzae, about 48% in Saccharomyces cerevisiae and more than 70% in humans.", "kw": ["WGD", "small-scale duplication"], "info": "All duplicates start out redundant and then diverge genetically and functionally over time.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What did Ohno propose, and how has the view changed since?", "a": "Ohno argued that gene duplication was an important mechanism of evolution, and duplicate retention was generally attributed to neofunctionalization. Since then, support has grown for other models: beneficial dosage effects and subfunctionalization.", "kw": ["Ohno", "neofunctionalization"], "info": "Ohno's model dates from 1970.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the scope of this review?", "a": "It focuses on duplications that produce full-length paralogues, because these share the same post-duplication functional properties. It covers function-fitness relationships, gene expression and physical molecular interactions, from fixation to functional divergence.", "kw": [], "info": "Partial and chimeric duplications are common but are left out. General rules are harder to set for them because functional overlap depends on which region was duplicated.", "concl": "Fates of paralogues are driven not only by natural selection but also by non-adaptive forces and contextual factors, such as evolutionary contingencies and arrival biases shaped by the mutational spectrum."}, {"type": "qa", "section": "Box 1 - Foundational models of duplicated genes", "q": "What is nonfunctionalization, and why is it the most likely fate?", "a": "Nonfunctionalization is the return of a duplicate pair to a single copy. It is the most likely fate because two copies relax selection, most mutations cause loss of function, and those mutations are thought to be neutral because of redundancy.", "kw": ["nonfunctionalization", "relaxed selection"], "info": "Here gene function means the biochemical activities of a gene that are under selection (selected effect). Examples include expression level, protein localization, substrate or protein binding, enzymatic activity and expression across cell types.", "concl": ""}, {"type": "qa", "section": "Box 1 - Foundational models of duplicated genes", "q": "What is the difference between neofunctionalization and subfunctionalization?", "a": "In neofunctionalization (Ohno, 1970), one copy gains mutations that give it a new beneficial function while the other keeps the ancestral functions. In subfunctionalization, the copies lose different subsets of ancestral functions, so both must be kept to perform all of them. This can be a neutral process.", "kw": ["neofunctionalization", "subfunctionalization"], "info": "Subfunctionalization should be more likely than gaining new functions because most mutations are loss-of-function mutations.", "concl": ""}, {"type": "qa", "section": "Box 1 - Foundational models of duplicated genes", "q": "Which is more common, neofunctionalization or subfunctionalization?", "a": "This is still unknown. Models of protein-protein interaction networks suggest that subfunctionalization is faster, because interactions are lost more easily than gained. Large-scale expression profiling suggests that regulatory neofunctionalization is more common in various species.", "kw": ["neofunctionalization", "subfunctionalization"], "info": "The prevalent mechanism may depend on the protein function studied. Each function needs a different approach.", "concl": "Overall rates of neo- and subfunctionalization remain to be fully quantified."}, {"type": "qa", "section": "Box 2 - Ancestral sequence reconstruction", "q": "How is ancestral sequence reconstruction (ASR) used to study paralogues?", "a": "Homologous sequences from many organisms are used to build a phylogeny. From it, the authors infer the pre-duplication ancestor (AncPD) and the two post-duplication ancestral paralogues (AncP1, AncP2). The branches between them contain the mutations (delta m) that may have changed function.", "kw": ["ASR", "AncPD"], "info": "Phylogeny quality is critical. Because ASR is probabilistic, good practice is to infer and resurrect two or more of the most probable sequences at each node of interest, which cheaper DNA synthesis now makes affordable. The ancestral proteins are then synthesized and either purified or expressed in a cell host for assays. The framework was proposed about 60 years ago.", "concl": ""}, {"type": "qa", "section": "Box 2 - Ancestral sequence reconstruction", "q": "How do ASR results distinguish subfunctionalization from neofunctionalization?", "a": "If AncPD has an activity, AncP1 keeps it and AncP2 loses it, the result supports subfunctionalization for that function. If one ancestral paralogue has an activity that AncPD and the other paralogue lack, the result supports neofunctionalization.", "kw": ["ASR", "subfunctionalization"], "info": "The other paralogue may have kept a different ancestral function. Analysing the delta m mutations shows which substitutions caused the change.", "concl": ""}, {"type": "qa", "section": "Gene dosage - Immediate dosage effects and fixation", "q": "Why can a duplication be harmful right after it happens?", "a": "Both copies make identical products, so total expression is expected to rise. Higher expression can disrupt stoichiometry and complex assembly for complex subunits, add metabolic and energetic costs, cause spurious molecular interactions, or disrupt metabolic pathways.", "kw": ["dosage", "stoichiometric imbalance"], "info": "Fixation probability rises with beneficial fitness effects, so immediate dosage effects matter for whether a duplicate is retained at all.", "concl": ""}, {"type": "qa", "section": "Gene dosage - Immediate dosage effects and fixation", "q": "When is increased dosage beneficial?", "a": "In genes involved in metabolism and stress responses. In some species, increased expression from gene dosage is even the main mechanism of adaptive change.", "kw": ["copy number variants", "drug resistance"], "info": "These effects depend on the environment and genetic background. In some fungal pathogens, drug-resistance CNVs rise in frequency with antifungal drugs and fall once the drug is removed. The size of the effect differs across closely related species and their hybrids.", "concl": ""}, {"type": "qa", "section": "Gene dosage - Immediate dosage effects and fixation", "q": "What is a fitness function?", "a": "It is the relationship between fitness and a gene's expression level. It usually has a plateau of optimal expression, with fitness falling when expression is too low or too high.", "kw": ["fitness function"], "info": "Fitness functions can be asymmetric because benefits diminish while the cost of expression rises linearly.", "concl": ""}, {"type": "qa", "section": "Gene dosage - Immediate dosage effects and fixation", "q": "How have fitness functions been measured experimentally?", "a": "In bacteria and yeast, native promoters were replaced with inducible promoters or with promoter libraries of different strengths, which allows pooled, high-throughput fitness measurements. CRISPR interference and CRISPR activation were also used to block or activate transcription.", "kw": ["CRISPRi", "CRISPRa", "promoter library"], "info": "Observed shapes include gradual responses, sensitivity only to low expression, sensitivity only to high expression, concave functions and dosage insensitivity. A missing optimum may partly reflect the limited range of expression tested.", "concl": "The variety of fitness function shapes explains why the immediate fitness effects of duplication vary so much between genes."}, {"type": "qa", "section": "Gene dosage - Immediate dosage effects and fixation", "q": "Why does the fitness effect of a duplication depend on context?", "a": "The same expression shift can be beneficial, neutral or deleterious depending on the shape of the fitness function and the starting expression level. The same gene can also have different expression or fitness functions across environments, cell types and tissues, which creates trade-offs.", "kw": ["context dependence", "trade-offs"], "info": "A fixed WGD does not mean every individual duplication was beneficial, because the fitness effect is the combined effect of all of them. Small-scale duplicates, such as tandem duplicates or retrotransposed copies, often have different expression because of a new gene context, such as new promoters or UTRs.", "concl": ""}, {"type": "qa", "section": "Gene dosage - Immediate dosage effects and fixation", "q": "What is expression attenuation?", "a": "mRNA and protein levels are rarely doubled, even when regulatory sequences are duplicated too. For some genes, post-transcriptional or post-translational regulation keeps expression below the expected doubling, for example through feedback loops that maintain complex stoichiometry.", "kw": ["expression attenuation"], "info": "This could explain why most small-scale duplications have been reported as neutral, and why studies disagree on the effects of dosage increases for complex subunits. Attenuation has been shown in adaptive CNVs.", "concl": "Attenuation buffers duplication toxicity. It can also make a duplication immediately beneficial if the pre-duplication level was suboptimal and doubling would overshoot the optimum."}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "What first suggested that paralogues co-evolve in expression?", "a": "Paralogues are often expressed at lower levels than their singleton orthologues. After fixation, fitness depends on the summed expression of both copies, so the copies can diverge while keeping total output constant.", "kw": ["cumulative expression"], "info": "The two copies do not need to contribute equally. In allopolyploidization, expression can differ right after duplication.", "concl": ""}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "How does expression divergence relate to duplicate loss after WGD?", "a": "In paramecia, yeast and plants, gene loss was more frequent in pairs with diverged expression, and the less expressed paralogue was lost more often. The same pattern was later shown in salmonids.", "kw": ["WGD", "gene loss", "salmonids"], "info": "", "concl": "Losses with minimal impact on cumulative expression are more readily tolerated."}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "What is the absolute dosage subfunctionalization (ADS) model?", "a": "Selection acts jointly on two duplicates to keep their combined protein abundance near an optimum. Expression changes in either copy are tolerated as long as the total stays close to the optimum, which produces compensatory drift along a line of constant cumulative expression.", "kw": ["ADS", "compensatory drift"], "info": "When one copy becomes lowly expressed, its contribution becomes negligible. It can then be lost neutrally, or its small contribution to the ancestral function may open the way to neofunctionalization.", "concl": "ADS explains why expression divergence is associated with gene loss and why the copy with lower expression is lost preferentially."}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "What does ADS assume, and does compensatory drift extend beyond transcription?", "a": "ADS assumes the two paralogues are functionally redundant. This is plausible even after allopolyploidization, because hybridizing species are usually closely related. Compensatory drift seems to extend beyond transcription: paralogue pairs show widespread reductions in translational efficiency and faster evolution of post-translational regulatory signals.", "kw": ["functional redundancy", "translational efficiency"], "info": "", "concl": ""}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "How has the ADS model been extended?", "a": "Selection acts not only on total abundance but also on total function, that is, abundance times specific activity for each copy. In Paramecium, mutations accumulated in the coding region of the lowly expressed paralogue, including loss-of-function mutations, before it was lost.", "kw": ["ADS", "Paramecium", "relaxed selection"], "info": "Other studies show that the less expressed duplicate evolves faster, loses protein-protein interactions and carries more segregating loss-of-function variants. Caveat: the link between abundance and evolutionary rate can exist without duplication. However, in Paramecium, loss-of-function alleles are more frequent in lowly expressed paralogues than in singletons with similar expression.", "concl": "Selection acts on both cumulative expression and cumulative function. This helps explain why some paralogues keep similar functions for long periods."}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "Which yeast example shows that ADS can persist for millions of years?", "a": "TUB1 and TUB3 are ancient WGD-derived paralogues with almost identical expression-fitness functions, so fitness depends mainly on their summed abundance. That sum is very similar to the native expression of TUB2 and TUB4, which assemble with them into microtubules.", "kw": ["TUB1", "TUB3", "ADS"], "info": "Fitness functions were measured with a promoter library, varying one paralogue while the other stayed at wild-type expression. Relative fitness was measured as yeast cell doublings per wild-type generation time.", "concl": "Selection can keep acting on total function for some paralogue pairs long after duplication."}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "What is active compensation between paralogues?", "a": "It is the up- or downregulation of a gene in response to a change in expression or loss of its paralogue, through shared cis-regulatory motifs or shared regulators. In yeast, TDH2 is upregulated when its paralogue TDH3 is deleted, through two shared regulators that are part of a broader regulation of glycolysis.", "kw": ["active compensation", "TDH2", "TDH3"], "info": "It has also been shown experimentally in Drosophila. Compensation can occur at the level of localization as well, when a protein moves to its deleted paralogue's usual location.", "concl": "Active compensation is rare overall, but it shows that substantial functional redundancy can persist between paralogues."}, {"type": "qa", "section": "Gene dosage - Expression divergence and long-term retention", "q": "How might ADS affect how long duplicates are retained?", "a": "ADS may lengthen retention time, which gives subfunctionalizing or neofunctionalizing mutations more time to arise. Experimental work showed that duplication does not speed up the gain of new molecular functions if one copy can be quickly lost.", "kw": ["retention time", "Ohno's hypothesis"], "info": "According to the reference annotation, the experiment evolved E. coli carrying one or two copies of a fluorescent protein.", "concl": "How long ADS lasts and how this varies across genes and species is still not precisely characterized."}, {"type": "qa", "section": "Gene dosage - Evolutionary contingency and new functions", "q": "How does compensatory drift create evolutionary contingency?", "a": "Changes in one copy are offset by changes in the other, so early mutations set the future trajectory. One copy keeps most of the ancestral function, while the other becomes a minor contributor that degenerates or gains new functions.", "kw": ["evolutionary contingency", "asymmetric divergence"], "info": "Asymmetry has been reported in protein evolutionary rates, protein-protein interactions, environmental responsiveness and tissue expression patterns.", "concl": "One copy is marked early for loss or neofunctionalization and then tends to accumulate further degenerative mutations."}, {"type": "qa", "section": "Gene dosage - Evolutionary contingency and new functions", "q": "What examples show that contingency can lead to parallel evolution of duplicate fates?", "a": "In Brassicaceae, one of two duplicated transcription factors was lost independently in several species, and it is much less expressed where it remains. In teleosts, two lineages convergently evolved electric organs by neofunctionalizing the same, lower-expressed copy of a WGD-derived pair.", "kw": ["parallel evolution", "teleost WGD", "electric organ"], "info": "According to the cited reference title, the teleost gene is a sodium channel gene. The paralogue first evolved lower expression in the ancestral tissue, which let it gain a new tissue specificity, an extension of ADS to tissue expression patterns.", "concl": "Early expression-reducing mutations, which probably occurred by chance in one copy, primed that paralogue for loss or functional divergence."}, {"type": "qa", "section": "Gene dosage - Evolutionary contingency and new functions", "q": "Does expression divergence come before activity divergence?", "a": "It is unclear whether expression or specific activity changes first. The order may depend on whether mutational biases favour changes in regulatory or in coding regions.", "kw": ["mutational bias"], "info": "This may matter especially in allopolyploids, where the two copies are already divergent and may be differentially expressed when they come together in the hybrid genome.", "concl": ""}, {"type": "qa", "section": "Gene dosage - Evolutionary contingency and new functions", "q": "How does compensatory drift limit which new functions a minor copy can gain?", "a": "A neofunctionalizing mutation in the minor copy is selected only if its benefit outweighs the loss of ancestral function. Because fitness functions differ between molecular functions, some new functions are only beneficial within a narrow range of expression or activity.", "kw": ["neofunctionalization", "fitness function"], "info": "Shown conceptually in Fig. 2c,d: the same new function can be beneficial or deleterious depending on when along the drift trajectory it arises.", "concl": "Some functional changes may never become accessible if compatible expression or activity levels are never sampled."}, {"type": "qa", "section": "Gene dosage - Evolutionary contingency and new functions", "q": "How could expression noise and arrival biases shape neofunctionalization?", "a": "Mutations affecting expression act mostly on transcription. A minor copy downregulated at the transcriptional level would show more expression noise, which could favour functions that need high responsiveness to environmental change.", "kw": ["expression noise", "arrival biases"], "info": "The authors call this speculative. These constraints add to those imposed by the ancestral gene's sequence and function.", "concl": "Together, these mechanisms might explain the high parallelism in new metabolic functions arising from copy number changes in different yeast species."}, {"type": "qa", "section": "Box 3 - Mutational and arrival biases", "q": "What are mutational biases?", "a": "They are asymmetries in the rates at which different mutation types occur. Examples are transitions being more frequent than transversions, and de novo mutations in many species, including humans, being biased towards A and T.", "kw": ["mutational bias", "AT bias"], "info": "The AT bias may come from cytosine deamination, which is worse in organisms with CpG methylation. AT-rich codons tend to encode hydrophobic amino acids, and these can create new protein interfaces. Such interfaces may later become needed for stability as more hydrophobic substitutions accumulate.", "concl": ""}, {"type": "qa", "section": "Box 3 - Mutational and arrival biases", "q": "What are arrival biases, and how strong can they be?", "a": "When several mutations have identical fixation probability, the first to appear is the most likely to fix. In RNA secondary structure maps, arrival biases can make a less fit but frequent phenotype fix over a rarer one whose fitness effect is 50 times more advantageous.", "kw": ["arrival biases", "fixation probability"], "info": "Simulations, experiments and comparative genomics show that, among several adaptive trajectories, those using more frequent mutation types are more likely. Arrival biases are usually modelled in haploids but may apply to diploids, depending on effect sizes and how efficient selection is.", "concl": ""}, {"type": "qa", "section": "Molecular interactions - Evolution of novel interaction specificity", "q": "How did steroid receptors neofunctionalize after duplication?", "a": "After multiple rounds of WGD in vertebrates, one paralogue kept its ancestral interactions. The other gained mutations that let it bind different hormones and DNA motifs.", "kw": ["steroid receptors", "neofunctionalization", "interaction specificity"], "info": "Once their molecular functions diverge, paralogues stop evolving under ADS. Transcription factor paralogues in plants, yeast and other organisms diverged in binding-site and distal regulatory element specificity, which created new regulatory modules.", "concl": ""}, {"type": "qa", "section": "Molecular interactions - Evolution of novel interaction specificity", "q": "Is binding divergence driven by positive selection or by relaxed selection?", "a": "Both play a role. Positive selection drove new inhibitors of snake venom metalloproteases through multiple duplications. In steroid receptors, however, ASR combined with deep mutational scanning showed that activity-decreasing mutations had been fixed, often on the same branches as duplications, which fits relaxed selection.", "kw": ["relaxed selection", "positive selection", "deep mutational scanning"], "info": "Right after duplication, both paralogues share the same interactions, so redundancy relaxes selection on each copy.", "concl": ""}, {"type": "qa", "section": "Molecular interactions - Evolution of novel interaction specificity", "q": "How do biophysical properties make some proteins prone to binding divergence?", "a": "Bacterial histidine kinases and their response regulators often duplicate together. Some paralogous pairs differ only slightly in affinity, driven by as few as three mutations, and single mutations can cause crosstalk between systems.", "kw": ["histidine kinases", "two-component systems"], "info": "", "concl": "When binding specificity is highly sensitive to mutation, divergence after duplication is easier."}, {"type": "qa", "section": "Molecular interactions - Chance and contingency in novel specificity", "q": "What two factors determine whether a new binding specificity can evolve?", "a": "First, the new specificity must not be deleterious, for example by creating spurious interactions. Second, mutations that change specificity must be reachable from the current sequence. Selection can act on the first factor but not the second, which depends on the protein's past evolution.", "kw": ["contingency", "sequence space"], "info": "Adaptive neofunctionalizing mutations are often destabilizing. Their fixation therefore depends on other mutations, including earlier ones, that compensate for the loss of stability.", "concl": ""}, {"type": "qa", "section": "Molecular interactions - Chance and contingency in novel specificity", "q": "How did permissive mutations enable new specificity in steroid receptors?", "a": "Neofunctionalizing mutations that gave specificity for new ligands and DNA motifs could only fix after 7 to 11 neutral mutations, which stabilized the binding interface, were already in place. More neofunctionalizing mutations were accessible in paralogues that had accumulated permissive mutations.", "kw": ["permissive mutations", "specific epistasis", "global epistasis"], "info": "Specific epistasis: a permissive mutation changes the local biophysical landscape. Global epistasis: a neutral mutation stabilizes the whole protein and opens access to many adaptive mutations.", "concl": "Permissive mutations had no effect on fitness and could have been fixed by drift. So whether an adaptive mutation can fix depends on chance history."}, {"type": "qa", "section": "Molecular interactions - Chance and contingency in novel specificity", "q": "What chance events besides drift have produced new specificities?", "a": "An ancestral receptor bound oestrogen. Because aldosterone, an intermediate in the oestrogen synthesis pathway, is structurally similar, a duplicated receptor evolved aldosterone specificity with just two mutations. In cyanobacteria, a horizontally transferred protein that happened to interact with a paralogue family evolved into an allosteric regulator.", "kw": ["aldosterone", "horizontal gene transfer", "retrograde model"], "info": "The receptor case resembles the retrograde model of enzyme evolution. The authors say it would not have been possible without duplication, because oestrogen constrains the ancestral receptor.", "concl": ""}, {"type": "qa", "section": "Molecular interactions - Chance and contingency in novel specificity", "q": "How can subfunctionalization of binding arise from a promiscuous ancestor?", "a": "Paralogues can stay redundant and promiscuous for a long time while accumulating neutral mutations. With epistasis, which mutations later reduce promiscuity depends on the mutations already fixed. In a pair of myosin paralogues with 81% sequence identity, about 15% of single amino acid substitutions caused partial loss of an interaction in one paralogue but not the other.", "kw": ["promiscuity", "cryptic genetic variation", "myosin"], "info": "", "concl": "Seemingly inconsequential mutations accumulated since duplication strongly shape future evolution."}, {"type": "qa", "section": "Homomeric proteins - Overview", "q": "Why are duplicated homomeric proteins a special case?", "a": "About 30% of proteins form homomers. After duplication, the paralogues share the same interface and can form heteromers with each other. When all binding affinities are equal, heteromers make up 50% of dimers, 75% of trimers and 87.5% of tetramers.", "kw": ["homomers", "heteromers"], "info": "This also applies to some allopolyploid paralogues, because proteins form interspecific complexes in hybrids, even between species more distant than those that usually hybridize. Mutations that change relative affinities shift the heteromer fraction.", "concl": ""}, {"type": "qa", "section": "Homomeric proteins - Paralogue interference", "q": "What is paralogue interference?", "a": "It is when a mutant copy impairs the wild-type paralogue, for example by forming inactive or partially inactive heteromers that titrate away the functional copy. It is analogous to dominant-negative mutations at biallelic loci.", "kw": ["paralogue interference", "dominant-negative"], "info": "Each homomer is affected only by mutations in its own gene, but the heteromer depends on both genes. Dominant-negative mutations tend to be mildly destabilizing and to cluster in active sites and interfaces, and paralogue interference shows similar trends.", "concl": ""}, {"type": "qa", "section": "Homomeric proteins - Paralogue interference", "q": "What did the single-mutant library of a homotetrameric enzyme show about interference?", "a": "The library of a dimer-of-dimers enzyme was expressed alongside a wild-type copy. Interfering mutations were depleted at the dimerization interface and enriched at the tetramerization interface. Tetramerization-interface mutants were less deleterious than active-site mutants because they sequester fewer wild-type copies.", "kw": ["paralogue interference", "assembly pathway"], "info": "In the Fig. 4c model, disrupting interface 1 leaves 50% activity, disrupting interface 2 leaves 25%, and disrupting catalysis leaves 6.25%.", "concl": "Interference exposes mutations to selection that redundancy would otherwise mask. This can help keep redundant homomeric paralogues and expand gene families linked to dominant deleterious diseases."}, {"type": "qa", "section": "Homomeric proteins - Paralogue interference", "q": "How does interference work for the yeast MADS-box factors Arg80 and Mcm1?", "a": "Arg80-Mcm1 heterodimers regulate arginine-responsive genes, and Mcm1 homodimers regulate another set of specific sites. The reconstructed ancestor's homodimers could do both. Raising Arg80 DNA-binding affinity back to the pre-duplication state, or raising Arg80 abundance, recruited Mcm1 to arginine sites and interfered with its other role.", "kw": ["Arg80", "Mcm1", "MADS-box"], "info": "The PDF text drops a symbol before -specific sites, so the exact site class is unclear from the extracted text.", "concl": "Divergence between the two paralogues minimized interference and subfunctionalized their roles."}, {"type": "qa", "section": "Homomeric proteins - Paralogue interference", "q": "What is a human example of paralogue interference?", "a": "SRGAP2A is a homodimer involved in neuronal synapse formation. Its truncated, human-specific paralogue SRGAP2C can still dimerize with SRGAP2A but blocks its function because it lacks other functional domains.", "kw": ["SRGAP2A", "SRGAP2C"], "info": "SRGAP2C seems to have evolved a role as a co-regulator of SRGAP2A during synapse formation. Because many duplications produce truncated genes, this kind of interference could be common, depending on how much paralogues are co-expressed.", "concl": ""}, {"type": "qa", "section": "Homomeric proteins - Maintenance or loss of heteromers", "q": "How can paralogue interference be reduced?", "a": "Through dosage, since an excess of wild-type copies overcomes the mutant. It can also be reduced by preventing heterodimerization, for example through different subcellular compartments, tissues or cell types, or through differences in assembly order and preference.", "kw": ["paralogue interference", "compartmentalization"], "info": "Increasing mutant abundance raises the fraction of heteromers and mutant homodimers, which can amplify deleterious effects.", "concl": ""}, {"type": "qa", "section": "Homomeric proteins - Maintenance or loss of heteromers", "q": "Why do heteromers of paralogues tend to persist, and why does that matter?", "a": "Mutations tend to destabilize the two homomers more than the heteromer, so heteromers are unlikely to be lost unless selection favours it. Human paralogues that do not form heteromers show stronger signatures of adaptive evolution and functional divergence than those that do.", "kw": ["heteromers", "functional divergence"], "info": "High-throughput protein-protein interaction data show heteromers are often retained, but many paralogues are selectively homomeric.", "concl": "Losing heteromerization could free paralogues to accumulate sub- or neofunctionalizing mutations independently."}, {"type": "qa", "section": "Homomeric proteins - Maintenance or loss of heteromers", "q": "How can heteromerizing paralogues become dependent on each other?", "a": "If the heteromer becomes the only functional complex, deleting one paralogue reduces the other's abundance, interactions or localization, so the copies are not redundant. A combinatorial deep mutational scanning library of a homodimeric enzyme identified more than 200 pairs of loss-of-function alleles that complement each other as heterodimers.", "kw": ["paralogue dependency", "compensatory mutations"], "info": "Natural examples include heteromers with functions their homomers lack, and interfering paralogues co-opted into regulatory roles.", "concl": "Dependency can arise from compensatory co-evolution and contradicts the usual assumption that duplicates are redundant."}, {"type": "qa", "section": "Homomeric proteins - Maintenance or loss of heteromers", "q": "What determines whether paralogues become selective homomers or heteromers?", "a": "As few as one to three mutations can be enough. AT-biased mutation introduces hydrophobic residues that can make stability depend on the paralogue partner. Complex structure also matters: slight structural asymmetry in haemoglobin made substitutions favour heterotetramers.", "kw": ["haemoglobin", "heterospecificity"], "info": "Purifying selection on a shared interface tends to preserve both homomers and heteromers.", "concl": ""}, {"type": "qa", "section": "Homomeric proteins - Maintenance or loss of heteromers", "q": "How does co-translational assembly prevent heteromerization?", "a": "Homomers whose interfaces are encoded at the N-terminus can assemble during translation with other nascent chains from polysomes on the same mRNA, so each copy pairs with itself. The determinants are encoded in the ancestral sequence, so duplicates would preferentially homomerize right after duplication.", "kw": ["co-translational assembly", "homospecificity"], "info": "Other barriers include different subcellular localization or expression timing, which are probably acquired later. Genome-wide analyses show these cellular barriers affect large fractions of non-heteromerizing human paralogues.", "concl": "Selective homomerization caused by inherited barriers tends to lead to faster functional divergence."}, {"type": "qa", "section": "Conclusions", "q": "What is the main conclusion of the review?", "a": "Fitness functions, deep mutational scanning and ASR show that fixing function-altering mutations often depends on earlier mutations that originally had no fitness effect. Paralogues can also become dependent when their heteromer is the only functional unit.", "kw": ["non-adaptive evolution", "contingency"], "info": "", "concl": "Multiple lines of evidence highlight the role of non-adaptive processes in the evolution of duplicated genes."}, {"type": "qa", "section": "Conclusions", "q": "Which open questions remain?", "a": "Functional divergence becomes more likely as duplications age, but the time needed may vary between paralogue pairs, for example with the type of function. Gradual changes in catalysis or binding specificity probably alter fitness functions until selection can tell the paralogues apart.", "kw": ["functional divergence"], "info": "The authors suggest that assaying subtle, progressive mutational effects on function will help trace paralogue histories.", "concl": ""}, {"type": "note", "section": "Box 1 - Foundational models of duplicated genes", "text": "The overall rates of neofunctionalization and subfunctionalization have not been quantified, and the answer may depend on which protein function is studied (interactions vs expression)."}, {"type": "note", "section": "Gene dosage - Expression divergence and long-term retention", "text": "How long does ADS keep paralogues redundant, how does this vary across genes and species, and does expression divergence come before activity divergence or after? Worth revisiting for teleost WGD paralogues (salmonid and electric organ examples)."}, {"type": "note", "section": "Homomeric proteins - Maintenance or loss of heteromers", "text": "Are the order and timescale of transitions (duplication, divergence in interactions, functional divergence) the same for every paralogue pair, and do specific paralogue properties change their probability?"}], "key": "general/Cisneros_2026_NatRevGenet_gene_duplication", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "AlfonsoGonzalez_2025", "title": "Elucidating the coordination of RNA processing using short-read and long-read RNA-sequencing methods", "category": "RNA & transcriptomics", "link": "https://doi.org/10.1038/s41580-025-00895-4", "note": "", "source_pdf": "papers/general/AlfonsoGonzalez_2025_NatRevMCB_RNA_processing_sequencing.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this review address?", "a": "Short-read RNA-seq can accurately measure alternative TSS usage, alternative splicing and alternative polyadenylation. However, the timing, coordination and functional outcomes of alternative RNA processing are hard to work out, especially in vivo.", "kw": ["ATSS", "AS", "APA"], "info": "The review covers short-read and long-read methods that measure transcripts in their nascent and mature state and at single-cell resolution. It links ATSS, AS and APA to cancer and to neurodevelopmental and neurodegenerative disorders, and it discusses CRISPR tools for manipulating RNA processing.", "concl": "Long-read sequencing makes it possible to characterize co-transcriptional RNA processing, and each LRS method has its own perspectives and limitations."}, {"type": "qa", "section": "Introduction", "q": "What are the three types of alternative RNA processing the review focuses on?", "a": "Alternative transcription start site usage (ATSS), alternative splicing (AS) and alternative cleavage and polyadenylation (APA). Together they define where transcription begins, which exons are included and where transcription ends.", "kw": ["ATSS", "AS", "APA"], "info": "The review focuses on processing steps that change exon structure. RNA editing and chemical modifications are mentioned only briefly, in relation to detectability and alternative processing.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How much do ATSS, AS and APA contribute to transcriptome diversity?", "a": "Through AS alone, about 95% of multi-exonic genes generate multiple isoforms. APA affects more than 70% of human genes, and ATSS contributes to around 50% of transcriptome diversity.", "kw": ["transcriptome diversity"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why do the authors think that different RNA processing steps are co-regulated?", "a": "The number of possible exon combinations of a gene is far larger than the number of mRNA isoforms that gene actually expresses.", "kw": ["co-regulation"], "info": "How the regulatory elements converge to produce distinct isoforms in a context-specific manner is still poorly understood, especially in vivo.", "concl": "Different RNA processing steps are co-regulated, not independent."}, {"type": "qa", "section": "Introduction", "q": "What does ATSS change in the mRNA, and what regulates it?", "a": "ATSS produces isoforms with a different 5' UTR or protein-coding sequence. It is regulated by promoter sequence, promoter-enhancer interactions, transcription factor availability and chromatin modifications.", "kw": ["ATSS", "5' UTR"], "info": "Box 1: TSS choice affects the sequence of the first exon or first few exons, and it also modulates AS and APA.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are the possible outcomes of AS and APA?", "a": "AS joins different exon combinations, so one gene can encode different proteins. It can also change the ratio of functional to incorrectly spliced transcripts that are removed by nonsense-mediated decay. APA usually produces longer 3' UTRs, but when the alternative PAS lies upstream of the stop codon (typically in an intron), the isoforms differ in coding potential.", "kw": ["NMD", "intronic PAS"], "info": "Box 1.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What determines which method to use for quantifying RNA processing?", "a": "The temporal and spatial dynamics of the biological events being studied and the type of intermediates they produce. In developmental transitions RNA regulation happens over minutes to hours, whereas in established lineages RNA signatures represent a ground state.", "kw": [], "info": "Steady-state measurements (nascent RNA-seq, LRS, scRNA-seq) give snapshots. Combining many snapshots is compared to assembling still frames into a movie.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - alternative TSS, splicing and 3' end", "q": "How does a typical short-read RNA-seq experiment work?", "a": "Ribosomal RNA is depleted, and the RNA is fragmented, reverse-transcribed into cDNA, amplified and sequenced. This gives millions of reads, usually 50 to 300 bp long, which are aligned to a reference genome to determine transcript abundance and exon structure.", "kw": ["RNA-seq"], "info": "", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - alternative TSS, splicing and 3' end", "q": "How is alternative TSS usage measured from short reads?", "a": "One approach compares exon-exon junction reads spanning the first and second exons. Another detects differences in coverage between the first and later exons. Methods that sequence from the capped 5' end, such as cap analysis of gene expression, distinguish TSSs more precisely.", "kw": ["CAGE", "5'-end reads"], "info": "Junction and coverage approaches depend heavily on exon annotation and can be confounded by exons that act as either exons or TSSs depending on context. Single-cell TSS profiling showed that most genes use multiple TSSs within the same cell.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - alternative TSS, splicing and 3' end", "q": "Which tools detect alternative splicing from RNA-seq, and how do they differ?", "a": "DEXseq and DSGseq test for significant differences in total exon read counts. rMATS and MISO quantify exon-exon junctions relative to total gene expression.", "kw": ["DEXseq", "rMATS", "MISO"], "info": "These tools were used to characterize cell-type-specific AS, especially in neural tissue, and to find RBP targets by comparing exon expression after RBP perturbation. Recent studies model RBP motifs near splice sites to improve target identification.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - alternative TSS, splicing and 3' end", "q": "What example of RBP-dependent neuronal RNA processing is shown in Fig. 1b?", "a": "In fruit fly embryos, neurons express longer 3' UTRs than non-neuronal cells. This neuronal 3' UTR extension is lost in embryos lacking the RBP ELAV, and hundreds of exons and 3' UTRs are deregulated in Delta-elav neurons.", "kw": ["ELAV", "3' UTR extension"], "info": "Shown as RNA-seq heat maps of Delta-elav neurons compared with normal neurons, one line per gene.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - alternative TSS, splicing and 3' end", "q": "How can non-canonical splicing be detected in total RNA-seq?", "a": "Intron lariats are detected by reads that span the branchpoint and the 3' splice site. Recursive splicing gives a sawtooth pattern in read coverage. CircRNAs from back-splicing (a splice donor joined to an upstream acceptor) are detected by back-splice junction reads.", "kw": ["recursive splicing", "circRNA", "back-splicing"], "info": "The large amount of available RNA-seq data has made it possible to characterize thousands of circRNAs, including their expression, tissue specificity and RBP regulators.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - alternative TSS, splicing and 3' end", "q": "What are the strengths and limitations of 3'-end sequencing for APA?", "a": "Because 3'-end sequencing targets specific regions, it reaches high coverage with fewer reads and needs little RNA input, which made large 3'-end atlases possible. However, it relies on oligo(dT) priming, which can cause internal priming at A-rich regions, and it cannot capture ATSS or AS in the same experiment.", "kw": ["3'-end sequencing", "oligo(dT)", "internal priming"], "info": "An alternative is 3'-end-centric computational analysis of ordinary RNA-seq data. It infers 3' ends indirectly from read density, so it has lower resolution and accuracy, but it can be applied to any dataset.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - nascent RNA dynamics", "q": "Why is steady-state RNA-seq not enough to study processing mechanisms?", "a": "Nascent pre-mRNA intermediates are short-lived, while mature polyadenylated RNAs accumulate until they are degraded. This imbalance hides the sequence of processing events.", "kw": ["nascent RNA"], "info": "Nascent RNA methods fall into two groups. Nucleotide labelling gives temporal resolution (time since transcription started). Chromatin fractionation enriches Pol II-associated RNA and reports distance from the site of transcription.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - nascent RNA dynamics", "q": "What are nuclear run-on assays and what have they shown?", "a": "In assays such as GRO-seq and PRO-seq, isolated nuclei continue transcription in the presence of modified nucleotides. The labelled RNAs are biotinylated and pulled down. These methods are sensitive enough to detect Pol II pausing at 3'-end processing sites, and they revealed 3'-end cleavage dynamics and links to splicing efficiency.", "kw": ["NRO", "GRO-seq", "PRO-seq"], "info": "NRO has been adapted to whole organisms: C. elegans (RNA stability), Drosophila embryos (zygotic genome activation), Arabidopsis (stress response) and mouse liver (circadian activation). The main in vivo challenge is isolating enough high-quality nuclei.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - nascent RNA dynamics", "q": "How does metabolic labelling measure splicing dynamics?", "a": "Modified nucleotides (4sU in 4sUDRB-seq and TT-seq, bromouridine in BrU-seq) are added to the medium and incorporated into new RNA. Comparing early and late labelling periods gives processing rates: intron-exon (pre-mRNA) reads decrease over the labelling time, while exon-exon (mRNA) reads increase.", "kw": ["4sU", "TT-seq", "BrU-seq"], "info": "Unlike NRO, these methods label RNA without compromising cell integrity.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - nascent RNA dynamics", "q": "What is SLAM-seq and what does it add?", "a": "SLAM-seq is an enrichment-free method. 4sU is incorporated into nascent RNA and then chemically converted, which creates mutations that show up in sequencing (T-to-C mismatches, per the glossary). Comparing labelled and unlabelled RNA gives synthesis and decay rates for each gene.", "kw": ["SLAM-seq", "RNA decay"], "info": "It is sensitive enough to detect changes in transient RNA species and to assess causal links between transcription factor binding and gene expression. Because mutations accumulate without bias, it also helps measure isoform-specific and region-specific transcript stability.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - nascent RNA dynamics", "q": "What do NET-seq and mNET-seq measure?", "a": "Nascent RNA is immunoprecipitated with Pol II antibodies or co-purified with chromatin. Sequencing the 3'-most nucleotide gives the position of the elongating polymerase. Nucleotide frequency in a region estimates Pol II pausing.", "kw": ["NET-seq", "mNET-seq", "Pol II CTD"], "info": "Targeting specific post-translational modifications of the Pol II C-terminal domain shows where modified Pol II sits at splice sites, 3'-end processing sites and termination sites.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - nascent RNA dynamics", "q": "How can metabolic labelling be made to work in whole animals and in specific tissues?", "a": "Whole tissues take up and incorporate modified nucleotides poorly. A solution is targeted expression of uracil phosphoribosyltransferase (UPRT), which converts 4-thiouracil (4tU) into 4sU monophosphate, so nascent RNA is labelled only in the chosen tissue or developmental stage.", "kw": ["UPRT", "4tU", "SLAM-ITseq"], "info": "In many systems, the pathways that process and convert modified nucleotides are inactive, which is another reason labelling in vivo is hard.", "concl": ""}, {"type": "qa", "section": "Short-read RNA-seq - nascent RNA dynamics", "q": "What zebrafish examples of in vivo metabolic labelling are discussed?", "a": "SLAMseq around the maternal-to-zygotic transition showed that mir430 mutant embryos, which lack transcription bodies, first transcribe some genes prematurely and then transcribe hundreds of zygotic genes at reduced levels. In a second example, SLAM-ITseq with UPRT expressed in hepatocytes and 3'-end sequencing after liver injury found distinct groups of metabolic genes upregulated at different times.", "kw": ["zebrafish", "mir430", "SLAM-ITseq"], "info": "The liver injury study identified transcriptional programmes involved in the injury response and the start of regeneration.", "concl": "Transcription bodies are important for zygotic genome activation. The authors suggest these methods could be applied to rapid changes in RNA processing and isoform switching."}, {"type": "qa", "section": "Long-read sequencing - platforms", "q": "How does PacBio long-read sequencing work, and how long are its reads?", "a": "PacBio uses single-molecule real-time sequencing, in which zero-mode waveguides track fluorescent nucleotides during DNA synthesis in real time. Reads are typically 1 to 2 kb, with some 10 to 25 kb. MAS-ISO-seq concatenates cDNAs to maximize throughput.", "kw": ["PacBio", "SMRT", "MAS-ISO-seq"], "info": "Table 1: Iso-seq has low throughput, 5'-end bias and high cost. HiFi reaches more than 99.9% accuracy by repeatedly sequencing circularized cDNA (circular consensus sequencing).", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - platforms", "q": "How does Oxford Nanopore sequencing work, and how long are its reads?", "a": "Protein pores measure changes in ionic current as DNA or RNA passes through them. ONT can produce reads of hundreds of kilobases, but cDNA reads typically have a median of about 1 kb, which size selection raises to an average of 4 to 5 kb. Direct RNA-seq needs no reverse transcription or amplification and detects base modifications on native RNA.", "kw": ["ONT", "dRNA-seq", "cDNA-seq"], "info": "Box 2: R10.4.1 pores with Bonito or Dorado base-calling reach about 98 to 99% accuracy, and about 99.6 to 99.8% when both DNA strands are sequenced. Table 1: dRNA-seq has a median read length under 1,000 bases and a 3'-end bias.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - platforms", "q": "How does LRS differ from short-read RNA-seq for transcript quantification?", "a": "Each long read represents a single RNA molecule or a large fragment of one. In principle this removes the need to assemble reads to reconstruct the transcript, and keeping several exon-exon junctions in one read allows accurate isoform detection.", "kw": ["full-length isoforms"], "info": "LRS finds rare and context-specific isoforms that short reads miss or mis-annotate.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - poly(A) tails, modifications and editing", "q": "How is poly(A) tail length measured with long reads, and what has it shown?", "a": "In dRNA-seq, base-callers estimate tail length from how long the A-stretch dwells in the pore. FLAM-seq and PAiso-seq (PacBio) ligate anchors to the tail end. Three main findings: tail length correlates positively with 3' UTR length, polyadenylated but unspliced transcripts are abundant on chromatin (so post-transcriptional splicing is common), and tail length is regulated in an allele-dependent way.", "kw": ["poly(A) tail", "FLAM-seq", "PAiso-seq"], "info": "The key advantage over short-read methods such as TAIL-seq is that the tail and the transcript isoform are read in the same molecule.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - poly(A) tails, modifications and editing", "q": "How does nanopore dRNA-seq detect RNA modifications, and how reliable is it?", "a": "Each modification shifts the ionic current signal, the 'wiggle', and machine-learning models trained on modification-specific patterns detect these shifts. m6A detection is promising, but other modifications remain hard to detect, especially when they are rare, because the signal is variable and patterns overlap.", "kw": ["m6A", "dRNA-seq", "epitranscriptomics"], "info": "m6A-LAIC-seq, an RNA immunoprecipitation-based method, showed that m6A at specific sites is associated with AS and APA.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - poly(A) tails, modifications and editing", "q": "What has LRS shown about A-to-I RNA editing and splicing?", "a": "Both dRNA-seq and PacBio can find editing and processing in the same transcript. This revealed editing within introns and a correlation between how close an editing site is to a splice junction and AS at that junction.", "kw": ["A-to-I editing", "ADAR"], "info": "", "concl": "Adenosine-to-inosine editing promotes alternative splicing."}, {"type": "qa", "section": "Long-read sequencing - splicing coordination", "q": "What are the exon definition model and the 'polar' splicing mechanism?", "a": "The exon definition model proposes that splice sites pair across an exon, so recognizing one exon helps adjacent exons get spliced. In the Fn1 gene, mutations that affected splicing of one exon also changed splicing of a distant exon. This is called 'polar' because it acts in the 5' to 3' direction, and it is enhanced when transcription elongation is inhibited.", "kw": ["exon definition", "Fn1", "polar mechanism"], "info": "The elongation effect suggested that splice site selection is coordinated co-transcriptionally. Earlier EST, microarray and short-read studies found co-expressed exons, but they could not show that the coordination happens within the same molecule.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - splicing coordination", "q": "What has steady-state and single-cell LRS shown about co-splicing?", "a": "Specific splicing patterns are over-represented, and more than 60% of multi-exon genes show consistent co-splicing of specific exon pairs. Single-cell LRS of mouse and human brain found exon connectivity and cell-type-specific splicing that changes with developmental stage.", "kw": ["co-splicing", "SnISOr-seq", "single-cell LRS"], "info": "Fig. 2b: CADM1 exon inclusion differs between human brain cell types (SnISOr-seq). For Dnm2 in mouse visual cortex excitatory neurons (postnatal days 14, 21, 28 and 56), inclusion of specific exons increases during development.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - splicing coordination", "q": "What did long-read sequencing of chromatin-associated nascent RNA reveal?", "a": "It showed both elongation state and splicing status of a single pre-mRNA in one read. Introns are not removed in the order they are transcribed, splicing events in the same molecule are coordinated even across large distances, and fully elongated but incompletely spliced pre-mRNAs are common.", "kw": ["nano-COP", "POINT-nano", "post-transcriptional splicing"], "info": "nano-COP uses 4sU labelling, chromatin enrichment and dRNA-seq. POINT-nano uses chromatin enrichment, Pol II pulldown and cDNA-seq. The 3' end of each read marks the active Pol II position. Caveat: introns are usually longer than 1,000 nt, so a read rarely contains more than one intron.", "concl": "Post-transcriptional splicing is more common than previously thought."}, {"type": "qa", "section": "Long-read sequencing - splicing coordination", "q": "Is splicing order random?", "a": "No. dRNA-seq of chromatin-associated polyadenylated transcripts in human cells showed that post-transcriptional splicing largely follows a predetermined order. An analysis of adjacent introns in short-read and long-read datasets found that most genes are spliced in one of a few predominant patterns.", "kw": ["splicing order"], "info": "", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - splicing coordination", "q": "What do Nano-ID and Nanodynamo add?", "a": "Both combine nucleotide labelling with dRNA-seq, so RNA synthesis and decay can be measured per isoform and with modifications preserved. Nano-ID follows RNA from nascent to mature and identifies transcript features linked to stability. Nanodynamo compares subcellular fractions, including 4sU-labelled and polysome-associated RNA, and found extensive crosstalk between stages of the RNA life cycle.", "kw": ["Nano-ID", "Nanodynamo", "4sU"], "info": "Both are limited by dRNA-seq read length, so transcripts are incompletely covered. Nanodynamo is conceptually similar to the short-read subcellular TimeLapse-seq.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - technical considerations (Box 2)", "q": "Why does RNA integrity matter more for LRS than for short-read RNA-seq?", "a": "In LRS, isoform annotation and quantification depend directly on intact molecules, and degradation is harder to correct computationally. In ONT dRNA-seq, degradation causes severe 3' bias and false 5' ends, so reliable results need a RIN above 7. In cDNA-based LRS, small 3' fragments are over-amplified, which distorts isoform quantification.", "kw": ["RIN", "3' bias"], "info": "These effects are worst for long genes with many isoforms, where degradation can mask ATSS, AS and APA sites.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - technical considerations (Box 2)", "q": "How can 3' and 5' ends of transcripts be annotated accurately with LRS?", "a": "For 3' ends, reading from the poly(A) tail into the templated sequence (dRNA-seq, FLAM-seq, PAiso-seq) avoids false ends caused by oligo(dT) internal priming. For 5' ends, CapTrap-seq combines cap-trapping with oligo(dT) priming on ONT or PacBio.", "kw": ["CapTrap-seq", "internal priming"], "info": "Internal priming is a particular problem for transcripts with long AU-rich 3' UTRs. CapTrap-seq improves 5'-to-3' coverage but needs a lot of input and gives shorter reads. FLEP-seq, nano-COP and NERD-seq can capture 3' ends of non-adenylated RNA.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - technical considerations (Box 2)", "q": "How can LRS transcript annotation and quantification be improved?", "a": "The SQANTI framework compares detected transcripts with existing annotations and corrects them. Adding data from other LRS platforms, CAGE, chromatin profiling and Pol II binding improves exon-structure resolution, and comparing with RNA-seq and using error correction improves expression estimates and splice junction mapping.", "kw": ["SQANTI", "error correction"], "info": "LRS generally has higher per-base error rates than short-read RNA-seq. The authors call for more robust computational frameworks.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - coordination between maturation steps", "q": "Why were short-read models insufficient to show coordination between ATSS, AS and APA?", "a": "Short-read studies found evidence that the steps are coordinated, and probabilistic models reconstructed isoforms. However, the fragmented reads made these models struggle with complex or rare isoforms, and they could not confirm that the processing events occur together in the same transcript.", "kw": ["isoform reconstruction"], "info": "LRS reads the 5' end, exon combination and 3' end of the same molecule. This provides a way to validate the short-read models and has revealed previously unseen isoforms.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - coordination between maturation steps", "q": "How are splicing and 3'-end processing coordinated?", "a": "Through terminal-exon definition, splicing of the last intron is coupled to cleavage and polyadenylation. In erythrocyte differentiation, nascent LRS showed that readthrough reads beyond the PAS usually still contain introns, while spliced reads rarely extend past the PAS.", "kw": ["terminal-exon definition", "readthrough"], "info": "RNA-seq and nanopore cDNA-seq showed that, for a subset of genes, transcripts cleaved at the distal 3' end stay at or near chromatin. There they serve as substrates for proximal 3'-end processing, terminal-intron splicing and m6A methylation (sequential polyadenylation).", "concl": "Splicing affects the efficiency of 3'-end processing, or vice versa."}, {"type": "qa", "section": "Long-read sequencing - coordination between maturation steps", "q": "How did targeted LRS overcome the bias towards short, abundant transcripts, and what did it find?", "a": "Pull-a-long-seq enriches specific genes and 3' UTR isoforms with biotinylated probes. In fruit fly embryos and adult brain, it found complex isoforms for about 30 genes, with specific AS events (cassette exon inclusion or exclusion) linked to specific APA events such as 3' UTR extension.", "kw": ["PL-seq", "TEQUILA-seq"], "info": "This gave the first direct evidence of cooperativity between AS and APA. TEQUILA-seq captures transcripts with probes amplified from array-synthesized oligos and is cheaper and more scalable. An alternative is cDNA size selection above 3 kb, which loses most of the sample and so needs a lot of input.", "concl": ""}, {"type": "qa", "section": "Long-read sequencing - coordination between maturation steps", "q": "What is promoter dominance?", "a": "Promoter dominance means the TSS used influences which 3' end is chosen and, to a lesser extent, which splice sites are used. About 60% of genes show it in fruit fly and human neural tissues. Dominant promoters have p300 (CBP) binding, depletion of the histone variant H2A.Z and enrichment of H3K18ac.", "kw": ["promoter dominance", "H3K18ac", "H2A.Z"], "info": "Based on size-selected RNA and cDNA giving reads with a median of 4 to 5 kb (standard methods give 1 to 2 kb), plus ONT dRNA-seq to identify true 3' ends. How TSSs impose this constraint is unknown.", "concl": "TSS choice shapes downstream splicing and polyadenylation."}, {"type": "qa", "section": "Long-read sequencing - coordination between maturation steps", "q": "What is the positional initiation-termination axis?", "a": "TSS and PAS choices are paired by position along the gene: upstream TSSs pair with upstream PASs, and downstream TSSs with downstream PASs.", "kw": ["TSS-PAS coupling"], "info": "This coupling coincides with chromatin structural domains and fast Pol II elongation. It comes from a recent study that, per the reference list, includes a bioRxiv preprint.", "concl": ""}, {"type": "qa", "section": "In vivo function - disease-associated QTLs", "q": "What are molecular QTLs, and what has GTEx contributed?", "a": "Molecular QTL studies map associations between DNA sequence variants (such as SNPs) and molecular traits such as expression, TSS usage, exon inclusion or 3' UTR extension in large cohorts. Using more than 15,000 RNA-seq samples from 838 individuals, GTEx built a large catalogue of eQTLs, many of which affect expression and splicing in highly tissue-specific patterns.", "kw": ["eQTL", "GTEx"], "info": "Glossary: QTL types include eQTLs (expression), sQTLs (splicing), 3'aQTLs (APA) and puQTLs (promoter usage).", "concl": ""}, {"type": "qa", "section": "In vivo function - disease-associated QTLs", "q": "What is known about sQTLs and 3'aQTLs?", "a": "sQTLs are a primary link between genetic variation and phenotype, often altering protein function independently of expression level. Many affect RBP binding sites rather than the splice sites themselves. About 1.49 million SNPs are associated with APA, and many 3'aQTLs respond strongly to cellular challenges.", "kw": ["sQTL", "3'aQTL"], "info": "Deep learning that places PAS usage in its genomic context showed an interaction between 3'aQTLs and sQTLs. LRS atlases are starting to link isoform changes to risk loci in neurodegenerative disease.", "concl": "3'aQTLs may drive cellular adaptation, so genetic variants should be studied in different physiological contexts."}, {"type": "qa", "section": "In vivo function - disease-associated QTLs", "q": "What is special about promoter-usage QTLs (puQTLs)?", "a": "puQTLs rarely overlap with eQTLs and are missed by analyses at the gene level rather than the exon level. They sit in active enhancers and TSS regions, unlike 3'aQTLs, which are distributed symmetrically around 3' UTRs. Across 49 tissues, most puQTLs were tissue-specific and fell into two main clusters: brain-related and non-neural tissues.", "kw": ["puQTL", "enhancers"], "info": "The authors take this as evidence for the importance of ATSS in regulating neuronal genes, with possible implications for neurological disease.", "concl": ""}, {"type": "qa", "section": "In vivo function - disease-associated QTLs", "q": "How complete is the human isoform catalogue?", "a": "It is not complete. GTEx short reads found more than 260,000 transcripts from protein-coding genes, double the number in RefSeq. LRS added more than 70,000 isoforms, and microglia samples alone added another 35,000.", "kw": ["isoform annotation", "allele-specific expression"], "info": "Allele-specific LRS analyses show that variants affect isoform structure and expression in an allele-dependent way. sQTLs associated with tissue-specific isoforms are linked to ATSS.", "concl": "QTLs should be interpreted in the broader context of coordinated RNA processing."}, {"type": "qa", "section": "In vivo function - CRISPR manipulation", "q": "What have CRISPR-Cas9 deletions and prime editing shown about RNA processing?", "a": "Deletions of intronic elements, specific TSSs and 3' UTR sequences showed, for individual genes, that 3' UTR editing can strongly change expression, that promoter usage influences splice site and PAS selection, and that distal PAS use is coupled to specific exon skipping. Prime editing introduces precise mutations at splice sites without double-strand breaks, which can disrupt splicing or switch isoforms.", "kw": ["Cas9", "prime editing"], "info": "Prime editing reduces off-target effects and repair errors. The authors expect LRS to soon describe the outcomes of these manipulations at the level of full-length isoforms.", "concl": ""}, {"type": "qa", "section": "In vivo function - CRISPR manipulation", "q": "How has dCas9 been used to manipulate RNA processing?", "a": "Activating a dominant promoter with CRISPR switched 3' end use towards the PAS associated with that promoter, usually the distal one. dCas9 placed at proximal polyadenylation signals acted as a Pol II roadblock, promoting proximal and cryptic PASs and inhibiting extended 3' UTRs, with little effect on splicing.", "kw": ["dCas9", "Pol II roadblock", "CD44"], "info": "Recruiting the catalytic domain of DNA methyltransferase 3B to CD44 increased exon inclusion, showing that DNA methylation modulates AS.", "concl": ""}, {"type": "qa", "section": "In vivo function - CRISPR manipulation", "q": "Why is Cas13 useful for studying RNA processing?", "a": "Cas13 targets RNA without touching DNA. Dead Cas13 (dCas13) can block regulatory elements in nascent RNA: recruiting splicing factors to change exon inclusion, blocking polyadenylation signals to induce APA, or blocking splice sites. With multiple gRNAs, several processing sites can be perturbed in parallel.", "kw": ["Cas13", "dCas13", "circRNA"], "info": "Targeting back-splice junctions knocked down thousands of circRNAs without affecting their linear counterparts, revealing roles in human cell proliferation and mouse preimplantation development.", "concl": ""}, {"type": "qa", "section": "In vivo function - CRISPR manipulation", "q": "What have genome-wide CRISPR screens contributed to RNA processing research?", "a": "Screens with single-cell RNA-seq readouts (Perturb-seq, TAP-seq, CROP-seq, CaRPool-seq) link each perturbation to transcriptome changes. A screen that exploited the 3'-end bias of scRNA-seq found that knocking out regulators of Pol II elongation, RNA export, translation and splicing all changed PAS usage. CHyMErA, which uses Cas9 plus Cas12a to excise exons, found more than 2,000 frame-preserving exons that affect cell fitness.", "kw": ["Perturb-seq", "CHyMErA"], "info": "Limitations are the high cost of single-cell sequencing and the limited coverage of mRNA 5' and 3' ends. A dCas13 gRNA library tiling the introns of a dual-colour splicing reporter (RFP for inclusion, GFP for exclusion) identified new splicing regulatory elements.", "concl": ""}, {"type": "qa", "section": "Future perspective", "q": "What do the authors see as the most important future directions?", "a": "Two things: integrating observations from different methods, both protein-centric and RNA-centric, and studying gene expression in vivo in the context of genetic variation. Combining RNA LRS with single-molecule DNA footprinting such as FIBER-seq and DiMeLo-seq could capture 'coordination states' at single-allele level.", "kw": ["FIBER-seq", "DiMeLo-seq", "LR-Ribo-STAMP"], "info": "FIBER-seq combined with PacBio Iso-Seq linked allele-specific chromatin changes in an unresolved Mendelian condition to transcriptional readthrough and harmful isoforms. LR-Ribo-STAMP links isoform features to translation rates.", "concl": "Coordination of RNA processing should be studied from chromatin through to the encoded protein."}, {"type": "qa", "section": "Future perspective", "q": "Why are timescales a key limitation in studying RNA processing?", "a": "The processes run on very different timescales. TF binding takes milliseconds, elongation seconds to hours, splicing minutes to hours, and export minutes. Cell cycles range from under 10 minutes (fly embryos before the MZT) to days (human somatic cells), while ageing-related processing changes take decades. Current sequencing gives snapshots that miss intermediates.", "kw": ["timescales", "RNA velocity", "scRNA-seq"], "info": "The authors suggest combining LRS with scRNA-seq and using RNA velocity
