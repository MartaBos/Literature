<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper notes · Astyanax mexicanus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2632; --muted:#5A6878; --rule:#D3DAE1; --hover:#E3E8ED;
  --focus:#2F6FB3; --good:#2E7D4F; --again:#B4562E;
  --c-mex:#C9DAF8; --c-mex-d:#3D6DBF;
  --c-emb:#FCE5CD; --c-emb-d:#C47A2C;
  --c-gen:#D9EAD3; --c-gen-d:#4E8A3E;
  --c-dam:#EAD1DC; --c-dam-d:#A3527A;
  --c-oth:#D8D1EE; --c-oth-d:#6B57B0;
  --c-ali:#FFF2CC; --c-ali-d:#B08A12;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
    --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
    --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
    --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
    --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
  --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
  --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
  --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
  --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--rule);padding:22px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{padding:0 22px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0;letter-spacing:-.01em;cursor:pointer}
.brand small{color:var(--muted);font-size:.82rem}
.search{margin:0 22px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px}
.cat{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 10px 4px 8px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist{list-style:none;margin:0;padding:0 12px}
.pitem{display:grid;grid-template-columns:6px 1fr auto;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 10px 10px 8px;align-items:start}
.pitem:hover{background:var(--hover)}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--rule)}
.pitem .tab{align-self:stretch;border-radius:3px}
.pitem b{display:block;font-weight:600;font-size:.92rem}
.pitem span.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.pitem .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.theme{margin:auto 22px 0;align-self:flex-start;background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--muted)}

main{padding:40px clamp(20px,5vw,64px) 80px;max-width:900px;width:100%}
.mtop{display:none}
.phead{border-left:6px solid var(--cd);padding-left:20px;margin-bottom:28px}
.phead .who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.9rem}
.tag{background:var(--cl);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.8rem}
.shared{border:1px solid var(--rule);border-radius:6px;padding:1px 8px;font-size:.8rem;color:var(--muted)}
.badge{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:600}
.star{color:var(--cd);margin-left:4px}
.phead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;letter-spacing:-.015em;margin:10px 0 12px;max-width:34ch}
.phead .srcnote{font-size:.88rem;color:var(--again);border-left:3px solid var(--again);padding:2px 0 2px 10px;margin:8px 0 6px;max-width:68ch}
.phead .note{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 4px;max-width:62ch}
.phead a.open{font-size:.9rem;font-weight:500;color:var(--cd);text-decoration:none;border-bottom:1px solid currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 26px}
.secnav button{text-align:left;background:none;border:0;border-bottom:1px dashed var(--rule);padding:2px 0;margin-right:12px;font-size:.84rem;color:var(--muted)}
.secnav button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.prog{font-size:.85rem;color:var(--muted);margin-left:auto}

h3.sec{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.qa{border-bottom:1px solid var(--rule)}
.qa:last-child{border-bottom:0}
.qbtn{display:grid;grid-template-columns:1fr auto;gap:16px;width:100%;text-align:left;background:none;border:0;padding:14px 0;font-weight:500;font-size:1rem;line-height:1.4}
.qbtn:hover .qt{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.qmeta{display:flex;gap:8px;align-items:center;padding-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
.qa.open .chev{transform:rotate(90deg)}
.known{font-size:.72rem;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.novel{font-size:.72rem;color:var(--cd);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.ans{display:none;padding:0 0 18px}
.qa.open .ans{display:block;animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ans p.a{font-family:var(--serif);font-size:1.04rem;line-height:1.65;margin:0 0 12px;max-width:66ch}
.extra{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;font-size:.92rem;margin:0 0 12px;max-width:72ch}
.extra dt{color:var(--muted);font-size:.84rem;padding-top:2px}
.extra dd{margin:0;line-height:1.55}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:var(--cl);border:0;border-radius:6px;padding:2px 9px;font-size:.8rem}
.kw:hover{outline:1px solid var(--cd)}
.notep{font-family:var(--serif);font-style:italic;color:var(--muted);padding:12px 0 12px 14px;border-left:2px solid var(--rule);margin:8px 0}
.empty{font-family:var(--serif);color:var(--muted);padding:30px 0;max-width:52ch}
.comments{margin-top:44px}
.comments textarea{width:100%;min-height:140px;resize:vertical;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);font-family:var(--serif);font-size:1rem;line-height:1.6}
.comments textarea[readonly]{opacity:.8}
.cmtstatus{font-size:.82rem;color:var(--muted);margin-top:6px}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:2px}

/* home */
.home h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em;margin:0 0 6px}
.home .lead{color:var(--muted);margin:0 0 34px;max-width:58ch}
.grp{margin-bottom:30px}
.grp h3{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;margin:0 0 8px}
.prow{display:grid;grid-template-columns:120px 1fr 120px;gap:16px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:12px 4px;text-align:left}
.prow:hover{background:var(--hover)}
.prow b{font-weight:600;font-size:.92rem}
.prow span{font-family:var(--serif);font-size:.95rem;line-height:1.35}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cd)}
.barlab{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* search results */
.rgroup{margin-bottom:26px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0 0 4px}
.rgroup h3 button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}

/* flashcards */
.study{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.study.on{display:flex}
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stop .ttl{font-weight:600}
.stop .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stop .x{margin-left:auto}
.track{height:4px;background:var(--rule);border-radius:2px;margin:14px 0 0;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stage{flex:1;display:grid;place-items:center;perspective:1600px;padding:24px 0;min-height:0}
.card{width:min(720px,100%);height:min(440px,100%);position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:18px;border:1px solid var(--rule);border-top:10px solid var(--cd);padding:28px clamp(20px,4vw,40px);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .src{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.face .q{font-family:var(--serif);font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.3;font-weight:500;margin:auto 0;letter-spacing:-.01em}
.face .bq{font-size:.9rem;color:var(--muted);margin:12px 0 10px}
.face .ba{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.25rem);line-height:1.6;margin:0 0 14px}
.face .hint{font-size:.82rem;color:var(--muted);text-align:center}
.sctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.again{color:var(--again);border-color:currentColor}
.btn.good{color:var(--good);border-color:currentColor}
.done{text-align:center;font-family:var(--serif)}
.done h3{font-size:1.8rem;font-weight:500;margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 20px}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

@media (max-width:820px){
  .shell{display:block}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);height:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  body.drawer .scrim{display:block}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px;align-items:center;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .mtop b{font-family:var(--serif);font-weight:600}
  main{padding-top:24px}
  .prow{grid-template-columns:1fr;gap:6px}
  .extra{grid-template-columns:1fr;gap:2px}
  .extra dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mtop"><button class="btn" id="menu" aria-label="Show paper list">Papers</button><b id="mtitle">Astyanax mexicanus</b></div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="side">
    <div class="brand"><h1 id="home" tabindex="0" role="link">Astyanax mexicanus</h1><small id="tot"></small></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search all notes" aria-label="Search all notes"></label>
    <div class="cats" id="cats"></div>
    <ul class="plist" id="plist"></ul>
    <button class="theme" id="theme">Theme: auto</button>
  </aside>
  <main id="main"></main>
</div>

<section class="study" id="study" aria-label="Flashcards">
  <div class="stop">
    <span class="ttl" id="sTitle"></span><span class="count" id="sCount"></span>
    <div class="opts"><label><input type="checkbox" id="sShuffle"> Shuffle</label><label><input type="checkbox" id="sNew"> Skip cards I know</label></div>
    <button class="btn x" id="sClose">Close</button>
  </div>
  <div class="track"><i id="sTrack"></i></div>
  <div class="stage" id="stage"></div>
  <div class="sctl" id="sctl">
    <button class="btn again" id="bAgain">Review again <small>(1)</small></button>
    <button class="btn" id="bFlip">Flip <small>(space)</small></button>
    <button class="btn good" id="bGood">Got it <small>(2)</small></button>
  </div>
</section>

<script>
const DATA = {"page": {"label": "Astyanax mexicanus", "folder": "amexicanus", "updated": "2026-11-23"}, "legend": ["Genetics of cave traits", "Eye loss", "Genomes & structural variation", "Gene regulation & metabolism", "Brain & behaviour"], "catKeys": {"Genetics of cave traits": "mex", "Eye loss": "ali", "Genomes & structural variation": "gen", "Gene regulation & metabolism": "emb", "Brain & behaviour": "oth"}, "papers": [{"id": "Wiese_2025", "title": "Quantitative trait loci concentrate in specific regions of the Mexican cavefish genome and reveal key candidate genes for cave-associated evolution", "category": "Genetics of cave traits", "link": "https://doi.org/10.1093/jhered/esae040", "note": "", "source_pdf": "papers/amexicanus/Wiese_2025_JHered_QTL_cavefish_genome_regions.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What is the central research question?", "a": "Do cave-associated quantitative trait loci (QTL) cluster in particular genomic regions of Astyanax mexicanus, and can integrated QTL, expression and selection data reveal candidate genes for repeated cave adaptation?", "kw": ["QTL", "clustering", "cave adaptation"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What are the main results?", "a": "The authors remapped 206 previously published cave-trait QTL to the AstMex3 surface genome. QTL are significantly clustered beyond uniform and gene-density null expectations, but tested genomic features do not explain the clusters. Integrating QTL, differential expression and selective sweeps identifies 36 candidate genes.", "kw": ["206 QTL", "36 candidate genes", "AstMex3"], "info": "", "concl": "Some genomic regions are disproportionately associated with cave-derived traits, but causal genes and mechanisms require further validation."}, {"type": "qa", "section": "Introduction", "q": "Why is Astyanax mexicanus suited to QTL mapping?", "a": "Surface and cave ecotypes can interbreed and produce viable hybrid offspring; segregation of genetic markers and phenotypes in crosses permits linkage-based QTL mapping. Multiple cave populations have independently evolved reductions in eyes and pigmentation and behavioral and physiological changes.", "kw": ["Astyanax mexicanus", "hybrid crosses", "repeated evolution"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What does QTL mapping establish and what does it not?", "a": "A QTL is a genomic region statistically associated with phenotypic variation in a mapping cross. Mapping does not, by itself, identify the causal gene or prove a molecular mechanism.", "kw": ["QTL", "linkage mapping"], "info": "Individual mapping studies can miss loci and overestimate effect sizes; integrated analyses can consolidate evidence across studies.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What two mechanisms can cause different phenotypic QTL to overlap?", "a": "Pleiotropy (one locus influences several phenotypes) and tight physical linkage (distinct causal genes lie near one another). The compiled QTL map alone cannot distinguish these explanations.", "kw": ["pleiotropy", "linkage"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why update earlier QTL maps?", "a": "The earlier integrated map was anchored to a fragmented Pachón cave reference, whereas the chromosome-level AstMex3 surface genome is more contiguous and can recover regions missing or fragmented in older references.", "kw": ["AstMex3", "genome assembly"], "info": "AstMex3 has 25 chromosomes, 109 unplaced scaffolds, contig N50 47.1 Mb and scaffold N50 51.9 Mb; the older cave draft had 10,735 scaffolds, contig N50 14.7 kb and scaffold N50 1.775 Mb.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which populations and cave traits motivate this comparison?", "a": "The paper highlights Pachón, Tinaja and Molino cave populations and morphological traits such as eye degeneration and pigment loss, alongside behavior, metabolism, sensory morphology and regeneration.", "kw": ["Pachón", "Tinaja", "Molino", "phenotypes"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Literature review", "q": "How were prior QTL studies collected?", "a": "PubMed and Web of Science were searched with Astyanax/cavefish and QTL/quantitative trait locus terms. Papers without de novo QTL or available marker sequences were excluded, and only studies published before June 6, 2022 were considered.", "kw": ["literature search", "QTL"], "info": "Table 1 summarizes 20 published studies considered in the review; the discussion describes 206 retained QTL mapped from 16 studies.", "concl": ""}, {"type": "qa", "section": "Methods - Marker remapping", "q": "How were legacy genetic markers remapped to AstMex3?", "a": "Available marker sequences were aligned to the AstMex3 surface genome using BLAST+ v2.8.1. The best hit was ranked by highest bitscore, then lowest E-value, then highest percent identity.", "kw": ["BLASTn", "AstMex3", "genetic markers"], "info": "Ambiguous equally ranked hits and hits inconsistent with other markers on the original linkage group were removed; three gene markers (igf1, shhb/twhh and pax6) were added manually from known coordinates.", "concl": ""}, {"type": "qa", "section": "Results - Integrated QTL map", "q": "How many markers were collected and successfully integrated?", "a": "9023 marker sequences were collected; 200 had no BLAST hit, 126 mapped to a discordant chromosome, and 96 could not be uniquely resolved. The resulting integrated map retained 8486 markers (94%).", "kw": ["9023 markers", "8486 markers", "BLAST"], "info": "", "concl": "Most historical markers could be anchored to AstMex3, with filtering for uncertain mappings."}, {"type": "qa", "section": "Methods - QTL assignment", "q": "How were QTL coordinates represented?", "a": "When confidence-interval flanking markers were available, the genomic span between the markers defined a QTL interval. Otherwise, the mapped peak marker represented a QTL peak. QTL without usable peak or interval markers were discarded.", "kw": ["QTL interval", "LOD peak", "confidence interval"], "info": "The authors caution that coordinates from heterogeneous historical studies are approximate.", "concl": ""}, {"type": "qa", "section": "Results - Integrated QTL map", "q": "How many QTL have intervals versus only peaks?", "a": "Of 206 mapped QTL, 168 were represented by LOD confidence intervals and 38 only by the genetic marker at the LOD peak.", "kw": ["206 QTL", "168 intervals", "38 peaks"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - QTL assignment", "q": "Which phenotype categories were assigned?", "a": "Eight categories: Eye, Pigment, Skeletal, Non-Eye Sensory, Metabolic, Behavior, Cardiac and Other morphological.", "kw": ["trait classes", "phenotypes"], "info": "The last category covers traits such as length that do not fit clearly elsewhere.", "concl": ""}, {"type": "qa", "section": "Methods - QTL clusters", "q": "How were QTL windows constructed?", "a": "The 25 AstMex3 chromosomes were partitioned into 118 nonoverlapping, centered windows of 10 Mb with GenomicRanges::tileGenome. The 10 Mb choice approximated the filtered QTL interval length (mean 11.4 Mb; median 9.64 Mb).", "kw": ["GenomicRanges", "10 Mb windows", "QTL intervals"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - QTL clusters", "q": "Why did the authors count distinct QTL rather than all overlapping records?", "a": "Overlapping QTL for closely related eye-size traits and melanophore phenotypes were consolidated as a single distinct QTL per window to limit inflation from redundant phenotype definitions.", "kw": ["distinct QTL", "trait redundancy"], "info": "All overlapping QTL were located with valr bed_intersect.", "concl": ""}, {"type": "qa", "section": "Methods - QTL clusters", "q": "What null models and test defined QTL clustering?", "a": "A Monte Carlo chi-square test (XNomial::xmonte) compared observed counts with (1) uniform genomic distribution and (2) counts proportional to protein-coding gene density. Windows with standardized residual >3 against either model were considered putative clusters.", "kw": ["Monte Carlo", "chi-square", "gene density", "standardized residual"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - QTL clustering", "q": "Do QTL cluster more than expected by chance?", "a": "Yes. Uniform null: chi-square = 192.9, P = 0.00002; gene-density null: chi-square = 216.1, P < 0.00001. Both expectations are rejected.", "kw": ["QTL clustering", "chi-square", "P-value"], "info": "", "concl": "The distribution is nonrandom and cannot be explained solely by the number of protein-coding genes."}, {"type": "qa", "section": "Results - QTL clustering", "q": "How many candidate QTL cluster windows were identified?", "a": "Six 10 Mb windows across four chromosomes had more QTL than expected under the tested distributions.", "kw": ["six windows", "four chromosomes"], "info": "Figure 1 marks enriched windows with asterisks, and Supplementary Table S7 lists the locations.", "concl": ""}, {"type": "qa", "section": "Discussion - Chromosome 1", "q": "What is the strongest genomic hotspot?", "a": "An approximately 40 Mb region on chromosome 1, spanning roughly 2–42 Mb, contains QTL associated with 10 distinct traits, including eye size, vibration attraction, relative condition, tastebuds and melanophores.", "kw": ["chromosome 1", "QTL hotspot", "40 Mb"], "info": "", "concl": "Chromosome 1 is a prominent shared target for mapping cave-derived traits, but the data do not identify a single causal locus."}, {"type": "qa", "section": "Methods - Genomic predictors", "q": "Which genomic factors were tested as explanations for QTL clusters?", "a": "Thirteen metrics incorporating repeat masking, GC content, CpG dinucleotide frequency, TGTGTG/CACACA repeats, gene counts by biotype, coding-gene lengths, transcription-factor counts and recombination rate were assessed.", "kw": ["GC content", "CpG", "repeats", "recombination", "transcription factors"], "info": "Genomic features were summarized in 10 Mb windows; recombination was derived from Pachón, Tinaja and Molino × surface F2 linkage maps as weighted cM/Mb.", "concl": ""}, {"type": "qa", "section": "Methods - Genomic predictors", "q": "How were cluster and noncluster windows compared?", "a": "Wilcoxon rank-sum tests compared the six QTL-enriched 10 Mb windows with 22 windows having no known QTL.", "kw": ["Wilcoxon", "n=6", "n=22"], "info": "The small number of cluster windows and broad spatial scale constrain interpretation.", "concl": ""}, {"type": "qa", "section": "Results - Genomic predictors", "q": "Did genomic features predict the location of QTL clusters?", "a": "No. None of the 13 tested variables differed significantly between QTL-rich and QTL-free windows (all Wilcoxon P > 0.05).", "kw": ["negative result", "genomic predictors"], "info": "", "concl": "This does not establish that mutational biases are absent; coarse QTL localization and 10 Mb windows can obscure localized signals."}, {"type": "qa", "section": "Methods - QTL effect sizes", "q": "What is PVE and how was it assessed?", "a": "PVE is the proportion of phenotypic variance explained by a mapped QTL, as reported in the original studies. The authors compiled PVE by trait class and measured skewness and kurtosis with the R moments package.", "kw": ["PVE", "effect size", "skewness", "kurtosis"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - QTL effect sizes", "q": "What is the overall shape of the QTL effect-size distribution?", "a": "Reported PVE values have strong positive skew (skewness 2.04) and kurtosis 8.02; most reported QTL have relatively smaller effects with a few large-effect outliers.", "kw": ["PVE", "skewness 2.04", "kurtosis 8.02"], "info": "The text calls the distribution light-tailed, although the reported kurtosis >3 conventionally denotes heavier tails under ordinary kurtosis definitions; retain the reported statistic without treating that wording as resolved.", "concl": ""}, {"type": "qa", "section": "Results - QTL effect sizes", "q": "How does the PVE distribution differ by trait?", "a": "Eye (skewness 2.08) and Skeletal (2.55) have strongly positively skewed PVE; Non-Eye Sensory (0.77) and Behavior (0.73) are less skewed. Pigmentation includes some of the largest PVE outliers.", "kw": ["Eye", "Skeletal", "Behavior", "Pigment"], "info": "The albinism QTL linked to oca2 is the highest-PVE example; albinism is a Mendelian trait.", "concl": ""}, {"type": "qa", "section": "Discussion - Limitations", "q": "What biases affect interpretation of reported PVE?", "a": "QTL mapping favors loci with moderate or large measurable effects; small-effect loci may be missed. Estimated PVE for detected loci can be inflated, especially in smaller crosses (Beavis effect), so cross-study PVE comparisons are approximate.", "kw": ["Beavis effect", "PVE bias", "sample size"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Candidate genes", "q": "Which three evidence layers defined the core candidate-gene set?", "a": "A candidate protein-coding gene had to overlap at least one cave-trait QTL, show a selective sweep in Pachón, Tinaja and Molino but not Río Choy or Rascón, and be differentially expressed in all three cave populations relative to Río Choy in the same direction.", "kw": ["QTL", "selective sweeps", "differential expression"], "info": "The selective-sweep gene set came from Moran et al. (2023); their older Ensembl IDs were translated to AstMex3 IDs via the homology table.", "concl": ""}, {"type": "qa", "section": "Methods - Whole-body RNA-seq", "q": "Which whole-body transcriptomes were analyzed?", "a": "Previously published whole-body larval RNA-seq from Pachón, Tinaja and Molino caves and Río Choy surface fish (Mack et al. 2021) was reprocessed. STAR v2.7.1 alignment to AstMex3, HTSeq v0.11.0 counts and DESeq2 v1.38.1 contrasts (each cave versus Río Choy) were used.", "kw": ["RNA-seq", "STAR", "HTSeq", "DESeq2"], "info": "Cave samples were compared at time 0 in the original study; adjusted P < 0.1 defined differential expression.", "concl": ""}, {"type": "qa", "section": "Methods - Whole-body RNA-seq", "q": "What qualifies as shared differential expression?", "a": "Genes had to meet the adjusted P < 0.1 threshold in all three cave-versus-Río Choy contrasts and change in the same direction in all three (all upregulated or all downregulated).", "kw": ["shared expression", "FDR", "three cave populations"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Eye RNA-seq", "q": "What additional eye-specific RNA-seq was examined?", "a": "Previously published eye tissue RNA-seq at 54 hpf from Pachón embryos versus surface fish (Gore et al. 2018) was remapped to AstMex3 and reanalyzed with STAR, HTSeq and DESeq2.", "kw": ["eye RNA-seq", "54 hpf", "Pachón"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Candidate genes", "q": "How many candidate genes passed all three main evidence criteria?", "a": "36 protein-coding genes overlapped a cave-derived QTL, showed repeated cave-selective sweeps and had shared differential expression in Pachón, Tinaja and Molino versus surface fish.", "kw": ["36 genes", "QTL", "selection", "expression"], "info": "Full gene list is in Supplementary Table S13, not enumerated in the article text.", "concl": "These are prioritized candidates, not experimentally verified causal genes."}, {"type": "qa", "section": "Results - Candidate genes", "q": "How many shortlisted genes were also altered in developing eyes?", "a": "Fourteen of 36 candidates were significantly downregulated in 54 hpf Pachón eye tissue versus surface fish; none of the 36 were significantly upregulated in that comparison.", "kw": ["14 genes", "eye", "downregulation"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion - rgrb", "q": "Why is rgrb highlighted?", "a": "rgrb encodes retinal G-protein-coupled receptor b, predicted to function in phototransduction. It falls within a retinal-thickness QTL, is downregulated in whole-body cave fry and 54 hpf Pachón eye tissue, and carries repeated cave-specific selective-sweep evidence.", "kw": ["rgrb", "phototransduction", "retinal thickness"], "info": "Its associated QTL concerns the outer plexiform layer; the whole-body stage is described as 30 dpf.", "concl": ""}, {"type": "qa", "section": "Discussion - rgrb", "q": "What structural observation supports a role for rgrb?", "a": "Exons 4 and 5 of rgrb are nearly completely deleted in multiple cave populations across both lineages, whereas examined surface populations retain intact reading frames.", "kw": ["rgrb", "exon deletion", "convergent evolution"], "info": "Named caves include Escondido, Molino and Jineo (lineage 1), plus Jos, Monticellos, Pachón, Palma Seca, Tinaja and Yerbaniz (lineage 2).", "concl": "The paper proposes rgrb loss/downregulation as a candidate mechanism for abnormal cavefish retinal development; causality was not established."}, {"type": "qa", "section": "Discussion - stra6", "q": "Why is stra6 a plausible candidate?", "a": "stra6, involved in retinoic acid-related biology, is downregulated in cavefish and lies within a QTL for maxillary bone length, which tends to be greater in cavefish.", "kw": ["stra6", "retinoic acid", "maxillary bone"], "info": "", "concl": "A possible link between stra6 expression and craniofacial morphology remains a hypothesis."}, {"type": "qa", "section": "Discussion - rab8a", "q": "Why is rab8a a plausible candidate?", "a": "rab8a is upregulated in cavefish and occurs under QTL for relative condition and peduncle depth. Its known involvement in glucose transporter regulation offers a possible metabolic connection.", "kw": ["rab8a", "glucose homeostasis", "condition factor"], "info": "", "concl": "Its association with multiple QTL raises, but does not prove, pleiotropic functions."}, {"type": "qa", "section": "Discussion - Pleiotropy", "q": "What established gene provides an example of pleiotropy?", "a": "oca2 is implicated in both albinism and sleep duration in cavefish, demonstrating that a locus involved in a conspicuous morphological trait can also affect behavior.", "kw": ["oca2", "albinism", "sleep", "pleiotropy"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion - Pleiotropy", "q": "How might pleiotropy be distinguished from closely linked genes experimentally?", "a": "CRISPR–Cas9 perturbation of one gene followed by multiple-trait phenotyping could support pleiotropy if several traits respond. Perturbing neighboring genes with different trait effects could favor linkage.", "kw": ["CRISPR–Cas9", "functional validation", "linkage"], "info": "Both mechanisms could operate together; this paper does not experimentally separate them.", "concl": ""}, {"type": "qa", "section": "Discussion - Genomic architecture", "q": "Could rearrangements influence QTL clustering?", "a": "The authors discuss structural linkage mechanisms, including possible roles for inversions, as future research directions rather than demonstrated explanations of the observed QTL hotspots.", "kw": ["inversions", "linkage", "genomic architecture"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion - Limitations", "q": "Why are broad QTL intervals a limitation for discovering causal genes?", "a": "Historical confidence intervals can span roughly 10 Mb and overlap hundreds of genes. A QTL overlap is therefore low-resolution positional evidence and is not equivalent to a causal promoter, variant or gene assignment.", "kw": ["resolution", "QTL intervals", "candidate genes"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion - Limitations", "q": "What limitations arise from merging QTL data across studies?", "a": "Studies vary in cross, population, traits, markers, mapping resolution and sample size. Some phenotype definitions overlap, and some markers could not be localized unambiguously, so aggregate hotspots require cautious interpretation.", "kw": ["heterogeneity", "cross-study comparison", "mapping bias"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion - Main conclusions", "q": "What does the integrated QTL resource establish?", "a": "Historical cave-trait QTL can be placed on one high-quality surface reference, allowing genomic hotspot analysis and multi-evidence candidate prioritization. Enriched regions occur across four chromosomes; no tested coarse genomic predictor explains them; 36 genes receive convergent support from QTL, expression and selection.", "kw": ["integrated QTL map", "candidate prioritization"], "info": "", "concl": ""}, {"type": "note", "section": "Discussion - Main conclusions", "text": "Wiese et al. 2025 integrates positional associations, RNA-seq and selection signals; the 36 candidates are hypotheses for follow-up, not validated regulatory or structural mechanisms."}, {"type": "note", "section": "Methods - Reference assemblies", "text": "All genomic coordinates and mapped marker positions in this study are relative to the AstMex3 surface assembly. They should not be combined directly with cave AMEX_1.1 positions without reliable coordinate translation."}, {"type": "note", "section": "Discussion - Limitations", "text": "The paper’s 2022 literature cutoff and dependence on archived marker sequences mean that this is not an exhaustive current catalog of all cavefish QTL."}, {"type": "qa", "section": "Methods - Data and tools", "q": "Which computational resources were used for mapping and visualization?", "a": "BLAST+ v2.8.1 mapped markers; GenomicRanges v1.49.0 tiled the genome; valr v0.6.6 counted overlaps; karyoploteR v1.24.0 displayed QTL; XNomial v1.0.4 performed Monte Carlo chi-square testing.", "kw": ["BLAST+", "GenomicRanges", "valr", "karyoploteR", "XNomial"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Genomic predictors", "q": "How were repeat, CpG and TGTGTG statistics obtained?", "a": "Repeat proportion was inferred from N bases in the hard-masked AstMex3 genome. GC and CpG fractions were computed on the unmasked genome; Biostrings::oligonucleotideFrequency quantified CpG and TGTGTG/CACACA motifs.", "kw": ["hard masking", "Biostrings", "CpG", "TGTGTG"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Genomic predictors", "q": "How were transcription-factor density and recombination represented?", "a": "TF genes were obtained from Animal TFDB 4.0 and intersected with windows. Linkage-map recombination values for cave × surface crosses were calculated in cM/Mb between markers and averaged with overlap-length weights per window.", "kw": ["Animal TFDB", "TF density", "cM/Mb"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion - Experimental directions", "q": "What follow-up experiments do the authors propose?", "a": "Targeted genetic editing and phenotype assays of genes in enriched QTL regions, alongside higher-resolution genetic mapping, could test whether repeated trait evolution reflects pleiotropy, linked genes and specific causal variants.", "kw": ["CRISPR", "fine mapping", "functional experiments"], "info": "", "concl": ""}], "key": "amexicanus/Wiese_2025_JHered_QTL_cavefish_genome_regions", "shared": "", "preprint": "", "tags": ["External notes"], "nostar": false, "source_note": ""}, {"id": "daSilva_2023", "title": "Discovery of putative long non-coding RNAs expressed in the eyes of Astyanax mexicanus (Actinopterygii: Characidae)", "category": "Eye loss", "link": "https://doi.org/10.1038/s41598-023-34198-5", "note": "", "source_pdf": "papers/amexicanus/daSilva_2023_SciRep_eye_lncRNAs.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this paper address?", "a": "Most eye studies in A. mexicanus focus on protein-coding genes, and almost nothing is known about lncRNAs. The aim was to identify, describe, classify and annotate the lncRNAs expressed in the embryonic eye of cavefish (CF) and surface fish (SF).", "kw": ["lncRNA", "eye development"], "info": "Their workflow assembles and evaluates the transcriptomes, annotates protein-coding genes and ncRNA families, predicts coding potential, identifies putative lncRNAs, maps them and predicts their interactions.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "How many putative lncRNAs did they find?", "a": "33,069 putative lncRNAs mapped in cavefish and 19,493 in surface fish. Thousands were annotated as conserved in human and several fish species, and hundreds were validated in silico with ESTs.", "kw": ["lncRNA"], "info": "", "concl": "This is one of the first studies describing lncRNAs in A. mexicanus. It gives a catalogue of lncRNA targets for future work."}, {"type": "qa", "section": "Abstract", "q": "Which eye-related lncRNAs do they highlight?", "a": "A few lncRNAs associated with sox2. The authors suggest they are isoforms of SOX2-OT, a lncRNA that can regulate sox2 expression.", "kw": ["sox2", "SOX2-OT"], "info": "The paper uses the word 'isomorphs'. Isoform status is not experimentally confirmed.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Where do surface fish and cavefish populations live?", "a": "Surface fish live in rivers from northwest Mexico to south Texas. Cavefish live in caves of the Sierra de Guatemala, Sierra de Colmena and Sierra de El Abra, where more than 30 populations are known.", "kw": ["morphotypes"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What troglomorphic traits do cavefish have?", "a": "Craniofacial changes, more and larger neuromasts, more taste buds, and reduced or absent eyes and pigmentation. They also differ in behaviour, circadian rhythm, sleep and metabolism.", "kw": ["troglomorphic traits"], "info": "How strong these traits are varies between cave populations, from intermediate to extreme morphotypes. Pachón is an example of the extreme type.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "When does eye degeneration start in cavefish embryos?", "a": "Eye development is quite similar in cavefish and surface fish until 20 hpf. After 40 hpf the cavefish lens becomes apoptotic, which leads to progressive degeneration and no eyes in the adult.", "kw": ["lens apoptosis", "hpf"], "info": "Eye loss has been studied through retinal morphology, lens defects and transplants, QTL, genomics and transcriptomics.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which protein-coding genes have been proposed for eye development and degeneration in A. mexicanus?", "a": "Crystallin genes (αA-crys, cryaa, crybb1, crybb1c, crybgx), the transcription factor sox2, retinal homeobox rx3, cone-rod homeobox crx, cbsa and dusp26.", "kw": ["crystallins", "sox2", "rx3"], "info": "The authors say this list is not exhaustive. Apart from genome annotations, non-coding RNAs have not been studied in this species.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How are ncRNAs split into small and long ncRNAs?", "a": "By length. ncRNAs under 200 nt are small ncRNAs (sncRNA), and those of 200 nt or more are lncRNAs. ncRNAs make up more than 98% of eukaryotic genomes.", "kw": ["sncRNA", "lncRNA"], "info": "sncRNAs fall into at least 5 classes: miRNA, snRNA, snoRNA, siRNA and piRNA. Disrupting miRNA genes can cause developmental defects, including retinal degeneration.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How are lncRNAs classified?", "a": "By genomic position, as in GENCODE: sense, antisense, intronic and intergenic (lincRNA). For transcripts, the classification also uses position, localization and direction of transcription relative to the nearest protein-coding gene.", "kw": ["GENCODE", "lincRNA"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why might lncRNAs matter for eye loss?", "a": "lncRNAs regulate gene expression at the transcriptional, post-transcriptional and epigenetic levels. Some are involved in eye diseases such as corneal neovascularization, glaucoma, cataract and diabetic retinopathy.", "kw": ["ANRIL", "gene regulation"], "info": "ANRIL (antisense noncoding RNA in the INK4 locus) is suggested to modulate optic nerve degeneration.", "concl": "lncRNAs may have a role in cavefish eye degeneration, so they first need to be identified broadly."}, {"type": "qa", "section": "Methods - library acquisition and pre-processing", "q": "Where did the RNA-seq data come from?", "a": "They reused eye RNA-seq libraries from Gore et al.: eyes from embryos at 54 hpf, two biological replicates per morphotype, poly(A)-enriched TruSeq libraries, sequenced on an Illumina HiSeq 2500 (paired-end 2x100 bp).", "kw": ["SRA", "public data"], "info": "BioProject PRJNA429434, GEO GSE109006. CF libraries SRR6456919/20, SRR6456921/22. Total RNA was isolated with the ZR-Duet DNA/RNA MiniPrep Kit. The paper does not say which cave population the eyes came from.", "concl": ""}, {"type": "qa", "section": "Methods - library acquisition and pre-processing", "q": "How were the reads quality-checked and trimmed?", "a": "Quality was checked with FastQC v0.11.9 and summarized with MultiQC v1.11. Adapters, contaminants and low-quality reads were removed with fastP v0.20.1 (quality above Q30).", "kw": ["FastQC", "fastP"], "info": "All tool versions and options are listed in Supplementary Table ST1-S1.", "concl": ""}, {"type": "qa", "section": "Methods - de novo assembly and metrics", "q": "How were the transcriptomes assembled and evaluated?", "a": "Each morphotype was assembled de novo with Trinity v2.9.1 on the Galaxy Europe server. Completeness was checked with BUSCO v5.0.0 (Actinopterygii OrthoDB v10, 3,640 groups), and quality with rnaQUAST v2.2.1 against the reference genomes.", "kw": ["Trinity", "BUSCO", "rnaQUAST"], "info": "CF was compared to the Pachón cavefish genome and SF to the surface fish genome. TrinityStats gave assembly metrics, and the align-reads-and-estimate-abundance script gave FPKM values.", "concl": ""}, {"type": "qa", "section": "Methods - functional and ncRNA annotation", "q": "How were the transcripts annotated functionally?", "a": "With EnTAP v5.0.0. First a blastx similarity search (e-value of e-5 or lower, at least 50% coverage) against a custom FishProteinDB and EggNOG. Then functional annotation with EggNOG to assign GO terms, KEGG terms and SMART/PFAM domains.", "kw": ["EnTAP", "FishProteinDB", "EggNOG"], "info": "FishProteinDB has 171,502 RefSeq proteins from Hyperoartia, Myxini, Chondrichthyes, Actinopterygii and Sarcopterygii (tetrapods excluded), plus A. mexicanus proteins from Ensembl.", "concl": ""}, {"type": "qa", "section": "Methods - functional and ncRNA annotation", "q": "How did they identify known ncRNA families?", "a": "With cmscan from Infernal v1.1.4 against Rfam v14.6. Only hits passing the Rfam bit-score gathering threshold were kept.", "kw": ["Infernal", "Rfam"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - lncRNA prediction", "q": "How was coding potential predicted?", "a": "Transcripts of 200 bp or longer were run through five tools: CPC2 py3 v1.0.1, RNAsamba v0.2.5, CPAT v3.0.4, RNAmining v1.0.4 and PLEK v1.2. A transcript was called coding or non-coding only if at least 4 of the 5 tools agreed. If only 3 agreed, it was called undetermined.", "kw": ["coding potential", "CPC2", "CPAT"], "info": "Earlier studies in zebrafish (6 tools) and cobia (3 tools) kept only transcripts that every tool called non-coding. The 4/5 rule is meant to reduce single-tool bias and misclassification.", "concl": ""}, {"type": "qa", "section": "Methods - lncRNA prediction", "q": "What criteria define a lncRNA candidate here?", "a": "At least 200 nt long, called non-coding by at least 4 coding-potential tools, not annotated by EnTAP or Infernal, non-redundant, and FPKM of 1 or more.", "kw": ["FPKM", "CD-HIT-EST"], "info": "Redundant sequences were removed with CD-HIT-EST v4.6 (similarity threshold 1.0, word size 8).", "concl": ""}, {"type": "qa", "section": "Methods - mapping and classification of lncRNAs", "q": "How were lncRNAs mapped to the genome and classified?", "a": "Candidates were mapped with GMAP v2021-12-17 to the chromosomes of their own morphotype's genome, leaving out unplaced scaffolds and chimeric alignments. The GFF3 was converted to GTF with AGAT v0.9.1. The FEELnc v0.2 classifier then classified the lncRNAs and predicted lncRNA-mRNA interactions.", "kw": ["GMAP", "FEELnc", "AGAT"], "info": "FEELnc uses four categories (type, subtype, transcription direction, localization), giving 16 possible classes. Only the best interaction per lncRNA was kept (isBest=1).", "concl": ""}, {"type": "qa", "section": "Methods - mapping and classification of lncRNAs", "q": "How did they summarise the FEELnc classes?", "a": "Following GENCODE, lncRNAs were split into genic and intergenic. Genic lncRNAs were exonic, intronic or overlapping. Intergenic lncRNAs were same-strand, convergent or divergent.", "kw": ["genic", "intergenic"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - annotation of lncRNAs", "q": "How did they find lncRNAs shared between cavefish and surface fish?", "a": "With a Reciprocal Best Hits (RBH) BLAST analysis on Galaxy Europe, using megablast with at least 70% identity and 70% coverage.", "kw": ["RBH", "megablast"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - annotation of lncRNAs", "q": "How were lncRNAs validated in silico?", "a": "Mapped candidates were aligned with megablast against A. mexicanus ESTs from GenBank, requiring an e-value of e-5 or lower and at least 95% identity and coverage.", "kw": ["ESTs", "in silico validation"], "info": "189,864 ESTs were downloaded and reduced to 148,690 unique ESTs with CD-HIT-EST (same parameters as before).", "concl": ""}, {"type": "qa", "section": "Methods - annotation of lncRNAs", "q": "Which lncRNA databases were used, and with what thresholds?", "a": "AmexLNC DB (7,773 lncRNAs predicted in the Pachón and surface genomes) at 70% identity and 70% coverage. ZFLNC (21,128 zebrafish lncRNAs) at 50% and 50%. LncBook 2.0 (323,950 human lncRNA transcripts) at 50% identity and 25% coverage. All used an e-value of e-5 or lower and the top 3 hits.", "kw": ["AmexLNC", "ZFLNC", "LncBook"], "info": "Thresholds were relaxed with phylogenetic distance because lncRNA sequences are poorly conserved. Top hits were filtered with BLAST top hit descriptions v0.1.1, and Venn diagrams were made with InteractiVenn.", "concl": ""}, {"type": "qa", "section": "Methods - lncRNA conservation among fishes", "q": "How did they test whether lncRNAs are conserved across fishes?", "a": "They downloaded ncRNA sequences for all 90 Ensembl 'Fish' assemblies and ran BLAST in two rounds. First each assembly was searched separately to drop those with no hits. Then the remaining assemblies were merged into one database and searched again, keeping hits with at least 60% query coverage.", "kw": ["Ensembl", "BLAST"], "info": "The e-value cutoff is written as 'e-value >= e-3', which is probably a typo for e-3 or lower. Alignments were viewed with BlastViewer v5.5.2. Hits per species were plotted as a dendrogram with taxize, myTAI and ggtree.", "concl": ""}, {"type": "qa", "section": "Methods - interactions with candidate genes for eye loss", "q": "How did they link lncRNAs to eye-loss genes?", "a": "They built a list of protein-coding eye-loss candidates from Casane and Rétaux and from Warren et al. The list covers CF vs SF differentially expressed genes, genes in eye QTL and other candidates, limited to genes annotated in the Ensembl A. mexicanus genomes. They then took the mapped lncRNAs whose FEELnc partner was on the list.", "kw": ["candidate genes", "qgraph"], "info": "Interaction networks were drawn with an in-house R script and the qgraph package. The gene list is in Supplementary Table ST1-S3.", "concl": ""}, {"type": "qa", "section": "Methods - conservation of SOX2-OT transcripts", "q": "How did they compare the SOX2-OT candidates between morphotypes?", "a": "They filtered the RBH results for sox2-associated lncRNAs, then compared the secondary structures of each RBH pair with ExpaRNA using default parameters.", "kw": ["ExpaRNA", "secondary structure"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - transcriptome assembly and completeness", "q": "What were the read numbers and assembly sizes?", "a": "CF: 178.7 M and 152.4 M raw reads (97.8% and 97.3% kept after trimming), assembled into 270,293 transcripts with 43.89% GC. SF: 185.8 M and 197.6 M raw reads (181.2 M and 192.2 M kept), assembled into 244,721 transcripts with 44.43% GC.", "kw": ["Trinity"], "info": "FPKM was below 1.0 for 127,764 CF and 123,415 SF transcripts.", "concl": ""}, {"type": "qa", "section": "Results - transcriptome assembly and completeness", "q": "How complete were the assemblies according to BUSCO?", "a": "78.0% (2,840) complete BUSCOs in CF and 80.0% (2,911) in SF. The split differed: 27.1% single-copy and 50.9% duplicated in CF, versus 50.3% and 29.7% in SF.", "kw": ["BUSCO"], "info": "The paper calls the proportions 'significantly different' but reports no statistical test. The high duplication in CF is not explained.", "concl": ""}, {"type": "qa", "section": "Results - transcriptome assembly and completeness", "q": "What did rnaQUAST show?", "a": "99.88% of CF and 98.54% of SF transcripts aligned to their reference genomes. 319 CF and 3,574 SF transcripts were unaligned. Misassemblies were 4.86% in CF and 6.34% in SF.", "kw": ["rnaQUAST", "misassemblies"], "info": "Uniquely aligned: 93.75% CF, 91.24% SF. Multiply aligned: 1.28% CF, 0.96% SF. About 48% of CF and 46% of SF transcripts are longer than 500 bp.", "concl": ""}, {"type": "qa", "section": "Results - functional annotation", "q": "How much of each transcriptome was functionally annotated?", "a": "Against FishProteinDB, 105,850 (39.2%) CF and 96,100 (39.3%) SF transcripts were annotated, mostly with A. mexicanus proteins as hits. Protein domains were assigned to 34.4% (CF) and 34.2% (SF), and KEGG terms to 11.0% and 10.9%.", "kw": ["EnTAP", "GO", "KEGG"], "info": "GO biological process: 65,711 CF and 59,550 SF. Molecular function: 64,798 and 58,979. Cellular component: 49,158 and 44,097.", "concl": ""}, {"type": "qa", "section": "Results - annotated ncRNA families", "q": "Which known ncRNA families did Infernal find?", "a": "In CF, 739 transcripts matched 174 Rfam RNAs. Of these, 137 were sncRNAs (88 snoRNAs and 49 miRNAs). In SF, 699 transcripts matched 173 Rfam RNAs, with 136 sncRNAs (90 snoRNAs and 46 miRNAs).", "kw": ["snoRNA", "miRNA", "Rfam"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - lncRNA candidates", "q": "How did the 4/5 consensus classify the transcripts?", "a": "CF: 217,970 (80.65%) non-coding, 26,766 (9.90%) coding and 25,528 (9.45%) undetermined. SF: 197,313 (80.64%) non-coding, 24,025 (9.82%) coding and 23,357 (9.54%) undetermined.", "kw": ["coding potential"], "info": "Tool agreements and disagreements are shown as a Venn diagram in Supplementary File 1.", "concl": ""}, {"type": "qa", "section": "Results - lncRNA candidates", "q": "How many candidates were left after filtering?", "a": "33,092 lncRNA candidates in CF and 22,453 in SF.", "kw": ["filtering"], "info": "Removed from the non-coding set: EnTAP-annotated (55,933 CF, 50,794 SF), Infernal-annotated (357 CF, 325 SF), redundant by CD-HIT (824 CF, 326 SF) and FPKM below 1 (127,764 CF, 123,415 SF).", "concl": "Most transcripts that tools call non-coding are removed by the annotation and expression filters."}, {"type": "qa", "section": "Results - mapped lncRNAs", "q": "How many candidates mapped to the genome, and how were they spread across chromosomes?", "a": "33,069 (99.93%) CF candidates mapped to the Pachón genome, but only 19,493 (86.82%) SF candidates mapped to the surface genome. In CF, chromosome 1 had the most (2,873, 8.69%) and chromosome 18 the fewest (664). In SF, chromosome 1 had only 656 (3.29%) and chromosome 21 had the fewest (390).", "kw": ["GMAP", "chromosome distribution"], "info": "The counts differ on almost every chromosome. The Discussion attributes this mainly to differences between the two genome assemblies.", "concl": ""}, {"type": "qa", "section": "Results - shared and validated lncRNAs", "q": "How many lncRNAs are shared between morphotypes, and how many were validated?", "a": "5,741 lncRNAs are shared. 27,328 are found only in CF and 13,752 only in SF. EST alignment validated 941 CF and 526 SF lncRNAs.", "kw": ["RBH", "ESTs"], "info": "The 'exclusive' sets come from presence or absence in each transcriptome, not from a differential expression test.", "concl": "Most lncRNAs appear to be specific to one morphotype."}, {"type": "qa", "section": "Results - conserved lncRNAs", "q": "How many lncRNAs matched each lncRNA database?", "a": "AmexLNC: 1,980 CF and 1,423 SF. ZFLNC: 495 CF and 361 SF. LncBook (human): 269 CF and 214 SF. Matches to all three databases: 29 in CF and 23 in SF.", "kw": ["AmexLNC", "ZFLNC", "LncBook"], "info": "CF overlaps: 135 AmexLNC+ZFLNC, 46 ZFLNC+LncBook, 16 AmexLNC+LncBook. SF overlaps: 78, 37 and 10.", "concl": ""}, {"type": "qa", "section": "Results - conserved lncRNAs", "q": "In which other fish species were the lncRNAs conserved?", "a": "In 21 other species. The most hits were to Oncorhynchus kisutch (55 CF, 36 SF) and Cyprinus carpio (55 CF, 31 SF). By order: Salmoniformes 120/80, Cypriniformes 87/49 and Clupeiformes 32/22 (CF/SF).", "kw": ["conservation", "Ensembl"], "info": "There were 1,707 CF and 1,207 SF hits to the A. mexicanus assembly itself, excluded here. Hit numbers do not follow phylogenetic distance or the number of ncRNAs per assembly: S. salar has 28,609 lncRNAs but only 46/30 hits, and O. kisutch has 3,425 sequences but the most hits. DN2011_c0_g1_i7 (CF) is conserved in D. rerio, S. salar, O. mykiss, O. kisutch and O. tshawytscha.", "concl": "The number of conserved hits does not follow phylogenetic proximity to A. mexicanus."}, {"type": "qa", "section": "Results - conserved lncRNAs", "q": "How many lncRNAs are known and how many are novel?", "a": "Known (annotated by at least one database): 2,860 CF and 2,080 SF. Novel (no match in any database): 30,209 CF and 17,413 SF.", "kw": ["novel lncRNAs"], "info": "", "concl": "Most of the eye lncRNAs found here are novel."}, {"type": "qa", "section": "Results - lncRNA classification", "q": "What share of lncRNAs is intergenic, and of which types?", "a": "Intergenic: 22,888 (69.88%) in CF and 9,599 (49.74%) in SF. In both, same-strand was most common (49.71% CF, 49.83% SF), then convergent (43.22% CF, 38.91% SF), then divergent (7.07% CF, 11.26% SF).", "kw": ["lincRNA", "FEELnc"], "info": "The percentages appear to use the lncRNAs with a FEELnc partner as denominator (32,755 CF, 19,298 SF), not all mapped lncRNAs. The paper does not state this explicitly.", "concl": ""}, {"type": "qa", "section": "Results - lncRNA classification", "q": "How do genic lncRNAs differ between morphotypes?", "a": "CF has 9,867 (30.12%) genic lncRNAs: 59.11% intronic, 23.12% exonic and 17.77% overlapping. SF has 9,699 (50.26%): 42.52% intronic, 42.41% exonic and 15.07% overlapping.", "kw": ["genic lncRNA", "intronic"], "info": "The authors suggest the different genome assemblies may partly cause the genic/intergenic differences.", "concl": ""}, {"type": "qa", "section": "Results - lncRNA interactions with partners", "q": "How many lncRNAs had predicted partners, and how many involved eye candidate genes?", "a": "In CF, 32,755 (99.05%) lncRNAs interacted with 12,633 partners. In SF, 19,298 lncRNAs interacted with 8,389 partners. With eye-loss candidate genes: 205 lncRNAs and 57 partners in CF, 143 lncRNAs and 72 partners in SF.", "kw": ["FEELnc", "interaction network"], "info": "Some partners have many lncRNAs, for example ENSAMXG00000015728 with 35 in CF and ENSAMXG00000029878 with 46 in SF.", "concl": ""}, {"type": "qa", "section": "Results - lncRNA interactions with partners", "q": "Which lncRNAs interact with sox2?", "a": "Seven in CF: 5 genic sense intronic-containing and 2 intergenic antisense convergent. Eight in SF, all intronic-containing. Intronic-containing means the lncRNA is transcribed in the same direction as sox2 and sox2 lies within it.", "kw": ["sox2", "intronic containing"], "info": "Lengths range from 345 nt (DN1425_c0_g1_i45) to 1,189 nt (DN1425_c0_g1_i26). CF transcripts are mostly from the DN21854_c0_g1 cluster and SF transcripts from DN1425_c0_g1.", "concl": ""}, {"type": "qa", "section": "Results - lncRNA interactions with partners", "q": "Are the sox2-associated lncRNAs shared between cavefish and surface fish?", "a": "Three RBH pairs are shared, with near-identical sequences: pident 99.621%, 99.566% and 99.533%. ExpaRNA (LCS-EPM) showed that the pairs are also similar in secondary-structure motifs, not only in sequence.", "kw": ["RBH", "ExpaRNA", "SOX2-OT"], "info": "Pairs (CF/SF): DN21854_c0_g1_i13 / DN1425_c0_g1_i7 (530 bp), DN21854_c0_g1_i2 / DN1425_c0_g1_i27 (463 bp), and DN21854_c0_g1_i10 (642 bp) / DN1425_c0_g1_i19 (662 bp).", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How do the authors view the 4-6% misassemblies?", "a": "They consider it acceptable for Trinity, which has one of the highest misassembly rates among de novo assemblers (3.9% and 17.9% in two earlier studies). Some misassemblies may be real chimeric transcripts from chromosomal rearrangement or trans-splicing.", "kw": ["Trinity", "chimeric transcripts"], "info": "Calling 4-6% 'under the expected' does not fit well with the 3.9% reference value. They suggest exploring the misassembled transcripts further.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why is the 'undetermined' coding class interesting?", "a": "Coding-potential tools usually give a binary call. The undetermined class may contain bifunctional transcripts, such as lncRNAs with small ORFs encoding regulatory peptides, or non-coding isoforms of protein-coding genes.", "kw": ["sORF", "bifunctional RNA"], "info": "This still needs to be confirmed. The authors recommend combining several coding-potential tools with annotation against a protein database to reduce bias.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why do the chromosomal lncRNA counts differ between CF and SF?", "a": "Probably because of assembly differences, not biology. Chromosome 1 is 133,971,750 bp in the Pachón genome but only 26,953,843 bp in the surface genome. The Pachón assembly has 170 unplaced scaffolds (29,150,210 bp), the surface assembly 2,390 (404,626,875 bp).", "kw": ["assembly bias", "reference genome"], "info": "These differences may also affect the genic and intergenic proportions. The authors say this should be revisited once equivalent assemblies exist.", "concl": "Comparisons of lncRNA location and class between morphotypes are confounded by the different reference genomes."}, {"type": "qa", "section": "Discussion", "q": "What is SOX2-OT and why does it matter here?", "a": "SOX2-OT is a lncRNA that overlaps sox2, which sits in one of its introns, and is transcribed in the same direction. Unlike most lncRNAs it is quite conserved in sequence among vertebrates. It has multiple transcription start sites that give transcripts of different lengths.", "kw": ["SOX2-OT", "miRNA sponge"], "info": "SOX2-OT can act as a miRNA sponge and raise or lower sox2 expression depending on the tissue. It is linked to cell regulation, proliferation and differentiation. The varying lengths of the intronic sox2 lncRNAs found here fit the multiple-TSS pattern.", "concl": "The sox2-associated lncRNAs are proposed as SOX2-OT isoforms, but this is not confirmed."}, {"type": "qa", "section": "Discussion", "q": "What is known about sox2 in eye development and in A. mexicanus?", "a": "sox2 acts at several stages of retinal development and controls Wnt/β-catenin activity in the retina. Ma et al. found sox2 downregulated in the cavefish lens, and knocking down sox2 in surface fish reduced cryaa expression and caused lens apoptosis.", "kw": ["sox2", "cryaa", "Wnt"], "info": "In zebrafish, sox2 is highly expressed in eye and brain at 28 hpf and in the retina around 48 hpf. Why sox2 is downregulated in cavefish is still unknown.", "concl": "Regulation of sox2 by SOX2-OT should be considered as a possible part of cavefish lens degeneration."}, {"type": "qa", "section": "Discussion", "q": "What are the main limitations and the authors' take-home message?", "a": "The predicted interactions may be undercounted because of the reference genomes, the SOX2-OT isoform status is unconfirmed, and conservation was tested on primary sequence only. The authors present the catalogue as a starting point for targeted studies, including differential expression.", "kw": ["limitations"], "info": "The assembly is deposited as TSA DANNHJ000000000 (version DANNHJ010000000). Databases, sequences and scripts are on OSF (doi 10.17605/OSF.IO/3Z7QN). The data are two replicates per morphotype from one time point (54 hpf), and no differential expression was tested.", "concl": "Thousands of eye-expressed lncRNAs were found in A. mexicanus, many of them morphotype-specific, and some are linked to eye-development genes such as sox2."}, {"type": "note", "section": "Results - shared and validated lncRNAs", "text": "Are the morphotype-exclusive lncRNAs (27,328 CF vs 13,752 SF) real, or partly caused by the different genome assemblies and mapping rates (99.93% vs 86.82%)? Recheck with equivalent assemblies or one common reference."}, {"type": "note", "section": "Discussion", "text": "Are the sox2-associated intronic lncRNAs real SOX2-OT isoforms, and could SOX2-OT explain sox2 downregulation in the cavefish lens? Worth checking with expression data across eye stages (e.g. 20, 40, 54 hpf)."}, {"type": "note", "section": "Discussion", "text": "The undetermined coding-potential class (about 25,000 transcripts per morphotype) may hold bifunctional or sORF-containing transcripts. Worth going back to with ribosome profiling or proteomics data."}], "key": "amexicanus/daSilva_2023_SciRep_eye_lncRNAs", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Warren_2021", "title": "A chromosome-level genome of Astyanax mexicanus surface fish for comparing population-specific genetic differences contributing to trait evolution", "category": "Genomes & structural variation", "link": "https://doi.org/10.1038/s41467-021-21733-z", "note": "", "source_pdf": "papers/amexicanus/Warren_2021_NatCommun_surface_fish_genome.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What does this paper present, and why use the surface fish?", "a": "A high-resolution, chromosome-level genome of A. mexicanus surface fish. It allows the first genome-wide comparison between surface fish and cavefish populations. Surface populations serve as a proxy for the ancestral form.", "kw": ["chromosome-level genome", "surface fish"], "info": "Many cave populations appear to have evolved troglomorphic traits independently.", "concl": "The surface fish reference is a more complete resource for comparative, functional and genetic studies of drastic trait differences within one species."}, {"type": "qa", "section": "Abstract", "q": "What are the main findings named in the abstract?", "a": "QTL mapping found new candidate genes for eye loss, such as dusp26. CRISPR editing confirmed that rx3, a gene within an eye size QTL, is essential for eye formation. They also made the first genome-wide evaluation of deletion variability across cavefish populations.", "kw": ["dusp26", "rx3", "deletions"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is the surface-to-cave transition a tractable system for studying trait evolution?", "a": "The direction (polarity) of evolutionary change is known. Subterranean animals worldwide have converged on reduced metabolic rate, eye size and pigmentation, so the strong phenotypic differences from surface relatives can be used to study the mechanisms of evolution.", "kw": ["convergence", "polarity of change"], "info": "Examples of subterranean animals: fish, salamanders, rodents and many invertebrates.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How many cave populations of A. mexicanus are there, and where do they live?", "a": "At least 30 cave-dwelling populations in the Sierra de El Abra, Sierra de Colmena and Sierra de Guatemala regions of northeastern Mexico. Surface fish of the same species live in rivers and lakes throughout Mexico and southern Texas.", "kw": ["Astyanax mexicanus"], "info": "Cavefish differ in traits relevant to human disease: sleep duration, circadian rhythmicity, anxiety, aggression, heart regeneration, eye and retina development, craniofacial structure, insulin resistance, appetite and obesity. Fertile surface-cave hybrids made in the lab allow genetic mapping.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What gap does the paper address?", "a": "The earlier Pachón cavefish genome (Astyanax mexicanus 1.0.2) was fragmented because it was built from short reads. Also, without a surface fish genome, surface and cave populations could not be compared directly at the genomic level.", "kw": ["Astyanax mexicanus 1.0.2", "short-read fragmentation"], "info": "As a proof of principle, they first confirmed known mutations for pigmentation and eye loss. They then looked for novel QTL and for coding and deletion mutations.", "concl": "First de novo surface fish genome assembly using long-read sequencing."}, {"type": "qa", "section": "Results - genome assembly and annotation", "q": "Which fish was sequenced, and how was the genome assembled?", "a": "A single lab-reared female descended from wild-caught surface fish. The genome was sequenced with PacBio SMRT at about 73x coverage and assembled with wtdbg2 to an ungapped size of 1.29 Gb.", "kw": ["PacBio SMRT", "wtdbg2"], "info": "Methods: the female (Asty152) came from a lab cross of Río Sabinas and Río Valles surface fish. It was sequenced on a PacBio RSII with an average read length of about 12 kb. Methods give coverage as more than 50-fold for an estimated 1.3 Gb genome, while Results say about 73x.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and annotation", "q": "How were the contigs scaffolded into chromosomes, and what are the final assembly stats?", "a": "Contigs were scaffolded with a BioNano physical map. Then 70% of the assembly scaffolds were assigned by hand to 25 chromosomes using genetic linkage map markers. The final assembly, Astyanax mexicanus 2.0, has 2415 scaffolds, a contig N50 of 1.7 Mb and a scaffold N50 of 35 Mb.", "kw": ["BioNano", "linkage map", "N50"], "info": "These stats are comparable to other teleost genomes sequenced and assembled in a similar way.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and annotation", "q": "Why could 394 Mb of the assembly not be assigned to chromosomes?", "a": "Mostly because 3.36% of the linkage markers (out of 2235 total) did not align to the surface genome. Other reasons: some contigs had only one marker, so their orientation could not be set, and some markers mapped to several places.", "kw": ["synteny", "GBS markers"], "info": "Uniquely mapped markers showed few ordering discrepancies and significant synteny with the linkage map. This validates the order and orientation of most of the assembly. Fig. 1 reports synteny based on 96.6% of genotype markers.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and annotation", "q": "How repetitive is the A. mexicanus genome compared with other teleosts?", "a": "Total interspersed repeats estimated with WindowMasker are 41%. This is intermediate between Xiphophorus maculatus (27%) and Danio rerio (50%). Astyanax mexicanus 2.0 has 11% more total masked repeats than 1.0.2.", "kw": ["WindowMasker", "repeats"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and annotation", "q": "How did they test for mapping bias between the cave and surface references?", "a": "They mapped population resequencing reads from Herman et al. to both genomes. Every population had fewer unmapped reads and more properly paired reads on Astyanax mexicanus 2.0, and also more nonprimary alignments with greater variation.", "kw": ["mapping bias", "resequencing"], "info": "The best-fit lines for the two references have similar slopes, so population identity affects the mapping rate to each genome in a similar way. The authors expect phased assembly approaches to resolve more chromosomal sequence in the future.", "concl": "Astyanax mexicanus 2.0 has more resolved sequence regions than 1.0.2."}, {"type": "qa", "section": "Results - genome assembly and annotation", "q": "How many genes were annotated?", "a": "The NCBI pipeline predicted 25,293 protein-coding genes and Ensembl predicted 26,698. Compared with 1.0.2, 1665 new protein-coding genes were added, and lncRNA genes rose from 1062 to 5314.", "kw": ["NCBI", "Ensembl", "lncRNA"], "info": "Annotation used transcript data from whole adult fish, embryos and 12 tissues in the NCBI short-read archive. Targeted noncoding RNA sequencing is still needed to reach zebrafish-level noncoding annotation.", "concl": ""}, {"type": "qa", "section": "Results - genome assembly and annotation", "q": "How complete is the gene annotation?", "a": "By BUSCO (benchmarking universal single-copy orthologs) with vertebrate genes, 94.6% of genes are complete, 4% are missing and 4.2% are duplicated. With NCBI Splign, same-species RefSeq or GenBank transcripts show 98.4% coverage.", "kw": ["BUSCO", "Splign"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - albinism and oca2", "q": "What did the new albinism QTL mapping in surface/Pachón F2 hybrids show?", "a": "Each of the two F2 groups had a single albinism QTL. Group A: LOD 47.31 on LG 3, 69% of variance. Group B: LOD 22.56 on LG 21, 37.8% of variance. Both mapped to surface fish chromosome 13, and F2 fish homozygous for the cave allele were albino.", "kw": ["QTL", "albinism", "oca2"], "info": "Earlier QTL studies in Pachón and Molino, done before any reference genome existed, had found one major QTL colocalizing with oca2.", "concl": ""}, {"type": "qa", "section": "Results - albinism and oca2", "q": "Why is the albinism QTL easier to interpret on the surface genome?", "a": "LG 3 from group A corresponds almost completely to surface chromosome 13, but in 1.0.2 it is split across many contigs. The group B QTL is a 2.8 Mb region on chromosome 13 that contains oca2.", "kw": ["contiguity", "1.5-LOD interval"], "info": "The region was found by using sequences flanking the 1.5-LOD support interval as Ensembl BLAST queries.", "concl": ""}, {"type": "qa", "section": "Results - albinism and oca2", "q": "How did they confirm that oca2 causes albinism in the mapping population?", "a": "They crossed an albino surface/Pachón F2 fish with an engineered surface fish heterozygous for an oca2 exon 21 deletion. In this complementation test, 46.5% of offspring (40/86) completely lacked pigment.", "kw": ["complementation test", "oca2"], "info": "Methods: the engineered allele is a 4 bp deletion (oca2 delta4bp/+). Larvae were scored at 5 dpf. All 8 genotyped albino larvae carried the engineered deletion, and all 8 genotyped pigmented larvae had the wild-type allele.", "concl": "A change at the oca2 locus causes pigment loss in this mapping population."}, {"type": "qa", "section": "Results - albinism and oca2", "q": "What oca2 deletions were found in wild-caught fish?", "a": "9 of 10 Pachón fish carried the exon 24 deletion, and no other population did. Exon 21 was absent in all Molino fish (n = 9). Smaller heterozygous or homozygous exon 21 deletions occurred in some Pachón (5/9), Río Choy (1/9) and Tinaja (5/9) fish.", "kw": ["oca2", "exon 24", "exon 21"], "info": "These could not have been found with 1.0.2, because exon 24 is missing in the Pachón reference, so no reads aligned there. The text says 'nine out of ten' Pachón fish but n = 9 elsewhere.", "concl": "A surface reference lets you see regions that are deleted in cavefish."}, {"type": "qa", "section": "Results - remapping published QTL", "q": "How many published QTL markers mapped to the surface genome?", "a": "With BLAST, 1060 of 1124 markers (94.3%) mapped and went into the surface fish QTL database. 77 mapped only to the surface genome, 52 only to the cavefish genome, and 12 to neither.", "kw": ["QTL database", "BLAST"], "info": "Methods give 1156 markers, 687 of which had previously been mapped to the cavefish genome. The counts do not match the Results, and the paper does not explain why.", "concl": ""}, {"type": "qa", "section": "Results - remapping published QTL", "q": "Give an example of a QTL region found only with the surface genome.", "a": "Markers Am205D and Am208E map to a region of about 1 Mb on surface chromosome 6 (46,516,926-47,425,713 bp) but not to 1.0.2. This region is linked to feeding angle, eye size, vibration attraction behavior (VAB), suborbital neuromasts and maxillary tooth number.", "kw": ["rhodopsin", "ubiad1", "GABA A receptor delta"], "info": "Candidate genes here: rhodopsin (vision), ubiad1 (eye development) and GABA A receptor delta (behavior, possibly VAB). In 1.0.2, the scaffold with these genes (KB871939.1) was not linked to this QTL.", "concl": ""}, {"type": "qa", "section": "Results - remapping published QTL", "q": "How did the new assembly link rx3 to an eye QTL?", "a": "rx3 falls inside the QTL for eye size, third suborbital bone size and body condition. In 1.0.2, the QTL marker Am55A and rx3 were on separate scaffolds, so their proximity could not be seen.", "kw": ["rx3", "Am55A"], "info": "rx3 had also been suggested to lie in a QTL for the outer plexiform layer of the eye. Older studies had low marker density and low power, which gave broad QTL intervals. There are no amino acid changes in rx3 between cave and surface fish, but its expression is reduced in Pachón.", "concl": ""}, {"type": "qa", "section": "Results - remapping published QTL", "q": "How does rx3 expression differ between surface fish, Pachón and F1 hybrids?", "a": "By in situ hybridization at tailbud stage, the rx3 expression area was 34876.3 square micrometers in surface fish (n = 17), 28674.8 in Pachón (n = 14) and 32617.8 in F1 hybrids (n = 11). Surface vs Pachón was significant (p = 0.004), and surface vs F1 was not (p = 0.294).", "kw": ["rx3", "in situ hybridization", "eye field"], "info": "Expression is restored in F1 hybrids, which points to recessive inheritance in cavefish. In zebrafish, rx3 is expressed in the eye field of the anterior neural plate during gastrulation and is essential for the eye vs telencephalon fate decision.", "concl": ""}, {"type": "qa", "section": "Results - remapping published QTL", "q": "What happened when rx3 was mutated in surface fish?", "a": "Adult CRISPR/Cas9 crispant surface fish completely lacked externally visible eyes (n = 5). At 6 days post fertilization, crispants already had smaller eyes than Cas9-only injected or uninjected siblings.", "kw": ["CRISPR/Cas9", "crispant", "rx3"], "info": "This matches other species, where rx3 (fish) or Rx (mouse) mutations cause a complete lack of eyes.", "concl": "rx3's role in eye development is conserved in A. mexicanus. Regulatory changes in rx3 may contribute to eye loss through a smaller eye field."}, {"type": "qa", "section": "Results - remapping published QTL", "q": "What did rescreening the locomotor activity QTL find?", "a": "They confirmed 20 previously reported candidate genes and found 96 more with relevant GO terms, including rx3. New c
