genetic characterisation relied on zebrafish data, which may not fully capture the A. mexicanus epigenetic landscape.", "kw": ["limitations"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - CNE identification", "q": "How were the genomes aligned?", "a": "Assemblies of 12 teleosts from Ensembl and NCBI were aligned pairwise with LASTZ in order of phylogenetic closeness to A. mexicanus. Chain files were converted to axt format with UCSC Kent utilities.", "kw": ["LASTZ", "UCSC Kent utilities"], "info": "The assembly list is in Table S1. The chain files are available on GitHub (mohan9955/cavefish-manuscript, liftOver_chain).", "concl": ""}, {"type": "qa", "section": "Methods - CNE identification", "q": "How were CNEs called and with which thresholds?", "a": "Pairwise axt files were turned into CNE objects with the CNEr package, and CNEs were called with ceScan at 90% or higher sequence identity and at least 50 bp length, filtering out exonic and repeat sequences.", "kw": ["CNEr", "ceScan"], "info": "They chose the 90% identity cutoff because the species are phylogenetically close and cave and surface morphs are the same species. Conserved, cave-lost and surface-lost sets were extracted with bedtools intersect. No CNEr version is given.", "concl": ""}, {"type": "qa", "section": "Methods - CNE identification", "q": "How did they check that cave-lost CNEs are real deletions and not alignment artefacts?", "a": "They examined synteny of the regions flanking cave-lost CNEs. The flanks were mappable in both morphs, and the complete or partial CNE deletions were specific to cave morphs.", "kw": ["synteny", "deletion validation"], "info": "Shown in Fig. S3.", "concl": ""}, {"type": "qa", "section": "Methods - CNE identification", "q": "How were CNEs assigned to genes?", "a": "With bedtools closest, using a 100 kb distance threshold. Genes were grouped as near cave-lost, near surface-lost or near conserved CNEs, and the cave-lost and surface-lost gene sets were mutually exclusive.", "kw": ["bedtools closest", "100 kb"], "info": "The CNE-gene distance distribution saturates at about 250 kb. They chose 100 kb as a conservative cutoff to keep high-confidence links and reduce false positives (Fig. S4).", "concl": ""}, {"type": "qa", "section": "Methods - histone and Hi-C data", "q": "Where did the histone data come from and how were they plotted?", "a": "Processed bigwig files for H3K4me3, H3K4me1, H3K27ac and H3K27me3 from 48 hpf zebrafish embryos came from DANIO-CODE. CNE-centred heatmaps were made with deepTools.", "kw": ["DANIO-CODE", "deepTools"], "info": "Figure 4 also shows 24 hpf tracks, but the methods only mention 48 hpf.", "concl": ""}, {"type": "qa", "section": "Methods - histone and Hi-C data", "q": "Which Hi-C data and processing were used?", "a": "KR-normalised .hic files for 48 hpf zebrafish embryos came from GEO GSE156099 and adult brain Hi-C from GSE134055. Matrices were built at 5 kb resolution with Juicer, and TADs were called with HiTAD.", "kw": ["Juicer", "HiTAD", "KR normalization"], "info": "Aggregation plots across TAD borders were made with in-house scripts.", "concl": ""}, {"type": "qa", "section": "Methods - histone and Hi-C data", "q": "How was the virtual 4C analysis set up?", "a": "They took rows for gene TSSs and considered bins within 1 Mb of each TSS, excluding CNE-gene pairs in adjacent bins. The region between CNE and TSS was split into two relative bins, and each side was extended by the CNE-gene distance and split into two bins each.", "kw": ["virtual 4C"], "info": "Each bin got the mean normalised Hi-C count of the 5 kb windows inside it. Heatmaps and boxplots were drawn in R.", "concl": ""}, {"type": "qa", "section": "Methods - histone and Hi-C data", "q": "How was HiChIP processed?", "a": "H3K4me3 HiChIP SRA files from 48 hpf embryos (GSE175706) were mapped to GRCz10 with HiCUP, and loops were called with FitHiChIP.", "kw": ["HiChIP", "HiCUP", "FitHiChIP"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - enrichment and motif analysis", "q": "Which tools were used for GO and expression enrichment?", "a": "GREAT v3.0.0 and the ToppGene suite for GO terms, and TopAnat (Bgee) with in situ hybridization data for expression terms. Terms supported by only one gene were removed, and terms were sorted by Benjamini-Hochberg FDR.", "kw": ["GREAT", "ToppGene", "TopAnat"], "info": "GREAT accounts for region-based bias in functional terms, which makes it well suited to noncoding elements. P-values come from region-based binomial tests.", "concl": ""}, {"type": "qa", "section": "Methods - enrichment and motif analysis", "q": "How was the motif analysis done?", "a": "Motif enrichment in cave-lost, surface-lost and conserved CNEs was tested with peak-motifs on RSAT. TFs significantly enriched in cave-lost CNEs (P < 0.05) were run through GO analysis in ToppGene, with TFs enriched in conserved CNEs as the background.", "kw": ["RSAT peak-motifs"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - expression data", "q": "Where did the expression data come from?", "a": "A. mexicanus developmental expression came from the supplementary dataset of Stahl and Gross 2017, and cave versus surface log2 fold changes were computed with DESeq2. Zebrafish single-cell data (up to 5 dpf) came from Farrell et al. 2018 and Farnsworth et al. 2020.", "kw": ["DESeq2", "Daniocell", "Stahl and Gross 2017"], "info": "Mean expression per cell-type cluster came from Farnsworth et al. table S1. UMAPs of the Farrell data were made with Daniocell. The cited Stahl and Gross study covers two cavefish populations, but this paper does not say which population(s) were used. Statistics used Mann-Whitney U tests in R.", "concl": ""}, {"type": "note", "section": "Results and discussion - functional enrichment", "text": "Is surface-specific CNE loss (111 CNEs) neutral, or does it reflect relaxed constraint in surface fish? The authors leave this unexplored."}, {"type": "note", "section": "Results and discussion - conclusions and limitations", "text": "Main next step: CNE knockouts (e.g. upstream of Lhx9 or near Chd4/Fezf2) in surface fish, plus Astyanax-specific chromatin data instead of the zebrafish proxy."}, {"type": "note", "section": "Methods - CNE identification", "text": "Check Table S1 for which cave population's genome was used, and whether cave-lost CNEs are shared across independently evolved cave populations (Pachon, Tinaja, Molino) or specific to one."}], "key": "amexicanus/Lal_2025_GBE_conserved_noncoding_element_loss", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Krishnan_2022", "title": "Genome-wide analysis of cis-regulatory changes underlying metabolic adaptation of cavefish", "category": "Gene regulation & metabolism", "link": "https://doi.org/10.1038/s41588-022-01049-4", "note": "", "source_pdf": "papers/amexicanus/Krishnan_2022_NatGenet_cis_regulatory_metabolic_adaptation.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What question does this paper address?", "a": "How cis-regulatory changes contribute to metabolic adaptation, using Astyanax mexicanus surface fish from nutrient-rich water and cavefish from nutrient-deprived water.", "kw": ["cis-regulatory elements", "metabolic adaptation"], "info": "Genome-wide epigenetic profiling was done in liver tissue.", "concl": "Many liver CREs have genetically diverged and differ in chromatin features between morphotypes, yet are remarkably similar between independently derived cave populations."}, {"type": "qa", "section": "Abstract", "q": "What is the main example of a cis-regulatory change found?", "a": "A CRE in the hpdb gene carries a genomic deletion in cavefish that abolishes IRF2 repressor binding and derepresses enhancer activity in reporter assays.", "kw": ["hpdb", "IRF2"], "info": "The mutation is present in multiple independent cave populations.", "concl": "Gives molecular insight into a trade-off between loss of pigmentation and adaptation to food-deprived caves."}, {"type": "qa", "section": "Introduction", "q": "Why is Astyanax mexicanus a good system for this?", "a": "It has river surface fish and cave morphotypes that colonized caves around 150,000 years ago, and several cave populations adapted independently, so one can ask whether the same genes and networks were reused.", "kw": ["repeated evolution"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was already known about genetic changes behind cavefish metabolism?", "a": "Missense mutations in metabolic genes such as insra and mc4r help cavefish survive low-nutrient conditions, but the contribution of regulatory changes had not been investigated.", "kw": ["insra", "mc4r"], "info": "", "concl": "This is the gap the paper fills: noncoding regulatory contribution to metabolic phenotypes."}, {"type": "qa", "section": "Introduction", "q": "Why the liver?", "a": "Because of its central role in glucose and fat metabolism.", "kw": ["liver"], "info": "No Astyanax liver cell line exists, so reporter assays later used zebrafish ZFL and human HepG2 cells.", "concl": ""}, {"type": "qa", "section": "Results - Genome-wide annotation of CREs", "q": "What samples and assays were used?", "a": "Liver tissue from surface fish and two independently derived cave populations, Pachon and Tinaja, profiled with ATAC-seq, ChIP-seq for H3K4me3, H3K27ac and H3K27me3, and bulk RNA-seq.", "kw": ["ATAC-seq", "ChIP-seq", "RNA-seq"], "info": "The surface fish genome astMex_2.0 was the reference for all analyses unless stated otherwise.", "concl": ""}, {"type": "qa", "section": "Results - Genome-wide annotation of CREs", "q": "How many putative CREs were identified?", "a": "94,175 accessible chromatin regions across the three populations: 68,002 in surface, 69,178 in Pachon and 73,762 in Tinaja. 44.87% were within 10 kb of a TSS.", "kw": ["putative CREs"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Genome-wide annotation of CREs", "q": "How were chromatin states defined?", "a": "With ChromHMM. H3K4me3 marked active promoters, H3K27ac active enhancers, H3K27me3 repressed regions, all three marks together poised regions, and low intensity of all marks gave low signal states.", "kw": ["ChromHMM"], "info": "Active and poised CREs had accessible chromatin; repressed and low-signal states were relatively inaccessible.", "concl": ""}, {"type": "qa", "section": "Results - Genome-wide annotation of CREs", "q": "Did chromatin state track gene expression?", "a": "Yes. Expression correlated positively with active and poised marks and inversely with repressed marks.", "kw": [], "info": "", "concl": "Chromatin accessibility can be used to identify putative CREs that correlate with expression of associated genes in this system."}, {"type": "qa", "section": "Results - Genome-wide annotation of CREs", "q": "How conserved are the putative CREs?", "a": "Regions marked by a chromatin feature were about 30% more conserved across 11 fish species than random regions, and 94 of 441 human liver-specific enhancers were conserved and open in this dataset.", "kw": ["GERP", "conservation"], "info": "Suggests some CREs take part in conserved vertebrate metabolic gene regulatory networks.", "concl": ""}, {"type": "qa", "section": "Results - Morphotype-biased CREs and metabolic pathways", "q": "How many regions were differentially accessible between populations?", "a": "47,241 loci were invariant; 33,176 differed between surface and Pachon, 35,140 between surface and Tinaja, and only 25,777 between the two cave populations.", "kw": ["differential accessibility"], "info": "Active histone mark patterns largely mirrored accessibility.", "concl": "Divergence is greater between surface and cave than between the two cave populations."}, {"type": "qa", "section": "Results - Morphotype-biased CREs and metabolic pathways", "q": "How similar are Pachon and Tinaja in gains and losses of accessibility?", "a": "Of the highly differential regions near genes, 74.4% of surface-accessible CREs lost accessibility in both cave populations, and 77.4% of regions gaining accessibility in Pachon also gained it in Tinaja.", "kw": ["parallel evolution"], "info": "The Venn diagram in Fig. 1e gives 77.3% while the text says 77.4%. Histone marks and expression showed the same trend.", "concl": "Points to repeated or parallel evolution at the epigenetic level through modification of existing surface fish regulatory circuitry."}, {"type": "qa", "section": "Results - Morphotype-biased CREs and metabolic pathways", "q": "What are s-CREs and c-CREs?", "a": "s-CREs are surface-accessible CREs (1,880 peaks in the heatmaps) and c-CREs are cave-accessible CREs biased the same way in both Pachon and Tinaja (1,698 peaks).", "kw": ["s-CREs", "c-CREs"], "info": "Differential peaks had q < 0.05 for both Pachon vs surface and Tinaja vs surface; invariant peaks had q > 0.90 in all three comparisons (1,991 peaks).", "concl": ""}, {"type": "qa", "section": "Results - Morphotype-biased CREs and metabolic pathways", "q": "Do morphotype-biased CREs correlate with nearby gene expression?", "a": "Yes, for CREs within 10 kb of a TSS there was a significant correlation (P < 0.05) between the CRE bias and expression of the nearby gene.", "kw": ["CRE-gene association"], "info": "One-sided t-test P values: 0.014 surface vs Pachon and 0.052 surface vs Tinaja for surface-biased peaks; 0.033 and 0.031 for cave-biased peaks. The 0.052 value is above the stated threshold, so the claim is not strict for every comparison.", "concl": ""}, {"type": "qa", "section": "Results - Morphotype-biased CREs and metabolic pathways", "q": "Which pathways are enriched near s-CREs versus c-CREs?", "a": "Genes near s-CREs were enriched for circadian rhythm, lipid metabolism and TGF-beta signaling; genes near c-CREs for lipid metabolism and immune function.", "kw": ["GSEA", "TGF-beta"], "info": "Pathway analysis used GSEA reactomes on genes within 10 kb of the TSS whose expression had the same bias as the CRE.", "concl": ""}, {"type": "qa", "section": "Results - Morphotype-biased CREs and metabolic pathways", "q": "How do lipid genes near s-CREs and c-CREs differ?", "a": "s-CRE lipid genes are catabolic (lipases lipca and lpl, fatty acid binding proteins) and up in surface fish; c-CRE lipid genes are signaling and anabolic (fasn, aacs, acsl1a, acss2l) and up in cavefish.", "kw": ["fasn", "lipid anabolism"], "info": "Network analysis of c-CRE genes also showed fasn, g6pd and slc30a8 upregulated in cavefish. Circadian genes per1b and cry1b were higher in surface fish.", "concl": "Consistent with previously reported increased fat accumulation in cavefish."}, {"type": "qa", "section": "Results - Morphotype-biased CREs and metabolic pathways", "q": "Which TF motifs are enriched in each class of CRE?", "a": "s-CREs are enriched for RAR:RXR, LXR, HNF4A and NF-kB motifs; c-CREs for NF-Y, KLF14, ETS and c-Myc. CTCF was the top motif in both (P = 1e-13 in s-CREs, 1e-51 in c-CREs).", "kw": ["HOMER", "CTCF", "HNF4A"], "info": "NF-Y regulates lipid metabolism via the leptin pathway; KLF14 represses TGF-beta signaling, which is enriched in surface but not cave.", "concl": ""}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "Could differential TF expression (trans) explain the accessibility differences?", "a": "Largely not for the TFs tested: those with enriched motifs showed little or no significant expression difference between morphotypes.", "kw": ["trans-acting factors", "hnf4a"], "info": "A previously reported hnf4a mutation may change downstream targets, and many direct and indirect Hnf4a targets were differentially expressed between surface and Pachon.", "concl": ""}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "How many variants were found under the CREs?", "a": "GATK called 527,644 SNPs and 183,958 indels between morphotypes from the ATAC-seq reads. 27.4% of peaks had no SNPs (the rest 1 to 169) and 27.1% had no indels (the rest 1 to 44).", "kw": ["GATK", "SNPs", "indels"], "info": "123,611 SNPs between surface and Pachon, 138,278 between surface and Tinaja, and only 66,056 shared between both comparisons.", "concl": ""}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "Which morphotype is more heterozygous?", "a": "Surface fish, for both SNPs and indels.", "kw": ["heterozygosity"], "info": "Matches earlier reports of greater genetic diversity in surface fish and more inbreeding in cave populations.", "concl": ""}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "Do cave-accessible peaks carry more SNPs?", "a": "Yes, a small but significant increase over surface-accessible peaks: P = 3.52e-4 for Pachon-accessible and P = 4.29e-10 for Tinaja-accessible (Mann-Whitney U-test).", "kw": ["SNP density"], "info": "Differential peaks here used P < 0.001, and SNP density was counted in a 200-bp window around the peak center.", "concl": "Suggests sequence differences drive the evolution of newly accessible regions in cavefish."}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "How many SNPs could alter TF binding?", "a": "48.2% of SNPs (254,554) could alter TF motifs, giving 1,497,297 altered motifs. At least one altered motif was present in 33% of Pachon-accessible and 41% of surface-accessible CREs.", "kw": ["motifbreakR", "HNF1B"], "info": "HNF1B, which regulates glucose metabolism and is implicated in diabetes, was in the top 15 altered-motif TFs for surface-accessible CREs but not for Pachon-accessible CREs. Forkhead motifs dominate both lists.", "concl": ""}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "How were 25 CREs chosen for functional testing?", "a": "From 3,620 differential CREs within 10 kb of a TSS: 2,157 after requiring a SNP or indel, 1,631 with an annotated gene, 466 where ATAC bias matched RNA bias, then manual curation to 25.", "kw": ["candidate selection"], "info": "Manual criteria: flanking regions keeping the biased epigenetic signature with no major unbiased flanking peaks, strongly differential gene expression (for example Nos, hpdb), and a metabolic or tissue-health role for the gene.", "concl": ""}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "How were CREs tested in vivo?", "a": "By Tol2-mediated transient transgenesis in Astyanax and zebrafish embryos with surface or cave constructs driving GFP, scored 3 to 5 days after fertilization; several CREs gave enhanced GFP over vector control.", "kw": ["Tol2", "GFP"], "info": "Tol2 vector with minimal c-fos promoter; at least 100 embryos per construct because of mosaicism and position effects. Results are qualitative, which motivated the cell-line assays.", "concl": ""}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "What did the luciferase assays show?", "a": "In ZFL cells 20 of 25 CREs (80%) drove at least twofold expression over empty vector, and 32% were also functional in HepG2. Surface and Pachon alleles differed for 7 of 20 functional CREs in ZFL and 5 of 8 in HepG2.", "kw": ["luciferase", "ZFL", "HepG2"], "info": "CRE-1, CRE-7, CRE-15 and CRE-20 stayed differential in both cell lines, so their sequence polymorphisms are causal for the reporter difference.", "concl": "Function is conserved across large evolutionary distance for some CREs, but the selection criteria did not predict the in vitro outcome."}, {"type": "qa", "section": "Results - Genetic changes in CREs", "q": "What caveats do the authors give for the reporter assays?", "a": "The cell lines come from other species and differ from adult Astyanax liver, the CREs were tested outside their genomic context, and not every SNP or indel has a functional consequence.", "kw": ["limitations"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - CRE-15 and IRF2", "q": "What is CRE-15 (CRE-hpdb)?", "a": "A cave-biased CRE 744 bp from the hpdb gene (ENSAMXG00000015502). Stable transgenic zebrafish lines for the surface and Pachon alleles drove reporter expression in the anterior gut and liver region, matching hpdb expression.", "kw": ["CRE-hpdb"], "info": "hpdb catalyzes the first unidirectional step of tyrosine catabolism.", "concl": ""}, {"type": "qa", "section": "Results - CRE-15 and IRF2", "q": "How is hpdb expressed between morphotypes?", "a": "hpdb was the most upregulated gene in the Pachon liver transcriptome and was also upregulated in Tinaja, confirmed by qPCR.", "kw": ["hpdb", "qPCR"], "info": "In the qPCR panel Pachon values are in the thousands relative to surface normalized to 1.", "concl": ""}, {"type": "qa", "section": "Results - CRE-15 and IRF2", "q": "How did they show the hpdb difference acts in cis?", "a": "Pachon-surface F1 hybrid livers showed intermediate hpdb levels (incompletely dominant Pachon allele), and using a synonymous SNP in exon 12 both alleles were present in DNA but only the Pachon allele appeared in mRNA.", "kw": ["allele-specific expression", "F1 hybrids"], "info": "qPCR was done on 5 F1 fish.", "concl": "Increased hpdb expression in Pachon is mediated by changes in cis."}, {"type": "qa", "section": "Results - CRE-15 and IRF2", "q": "What is the sequence change, and does IRF2 bind it?", "a": "Pachon has several small deletions predicted to abolish an IRF2 repressor motif. In EMSA, recombinant human IRF2 bound the 20-bp surface oligo but showed very weak or no binding to the Pachon oligo.", "kw": ["EMSA", "IRF2"], "info": "Human IRF2 was used because the DNA-binding domain is highly conserved with Astyanax. Binding was competed by 200x and 400x unlabeled self oligo but not by nonspecific oligo, and irf2 expression did not differ between morphotypes.", "concl": ""}, {"type": "qa", "section": "Results - CRE-15 and IRF2", "q": "Is losing the IRF2 site sufficient to derepress the CRE?", "a": "Yes. Deleting the IRF2 motif in the surface allele (surface IRF2-del) restored high luciferase expression, similar to the Pachon allele.", "kw": ["surface IRF2-del"], "info": "", "concl": "IRF2 acts as a repressor of CRE-hpdb."}, {"type": "qa", "section": "Results - CRE-15 and IRF2", "q": "Did adding the IRF2 site back to the Pachon allele restore repression?", "a": "Not on its own; Pachon IRF2-ins was not significantly repressed. Repression was restored only after two further sites were converted to the surface alleles (Pachon IRF2-ins-ATA and IRF2-ins-ATA-TT, P = 0.008).", "kw": ["rescue"], "info": "", "concl": "Deleting the IRF2 site is sufficient to release repression, but other mutations also contribute to the CRE's differential activity."}, {"type": "qa", "section": "Results - IRF2 deletion as adaptive trait", "q": "What is the proposed trade-off with pigmentation?", "a": "Tyrosine feeds melanin, dopamine, ketone bodies and TCA intermediates. Cavefish lacking melanin accumulate excess tyrosine, so higher hpdb could divert it to fumarate and acetoacetate for energy.", "kw": ["tyrosine", "melanin", "TCA cycle"], "info": "Liver expression of tyrosinase and tyrosine hydroxylase was very low. Excess tyrosine was previously reported in melanin-deficient cave populations and in oca2 knockdown surface fish.", "concl": "A thrifty strategy for using any available nutrient in a nutrient-deprived cave."}, {"type": "qa", "section": "Results - IRF2 deletion as adaptive trait", "q": "Is the IRF2 site deletion present in wild fish?", "a": "They genotyped 23 wild surface fish, 23 wild Pachon and one each of Tinaja, Yerbaniz, Piedras and Japones. The deletion was fixed in all cavefish except the heterozygous Japones individual, and absent in all surface fish.", "kw": ["genotyping", "positive selection"], "info": "Wild Pachon livers also had higher hpdb than wild surface (P = 0.018). Only a single individual was sampled for the non-Pachon cave populations.", "concl": "The authors argue the mutation is under positive selection."}, {"type": "qa", "section": "Results - IRF2 deletion as adaptive trait", "q": "Are other tyrosine catabolism genes also changed?", "a": "Yes. hpdb, hgd and fah, encoding enzymes for unidirectional steps of tyrosine catabolism, all have higher expression in Pachon than surface livers.", "kw": ["hgd", "fah"], "info": "", "concl": "Supports the idea that excess tyrosine is repurposed through the TCA cycle."}, {"type": "qa", "section": "Discussion", "q": "What is the main conclusion about the two cave populations?", "a": "The genome-wide chromatin architecture of Pachon and Tinaja is more similar to each other than to surface fish, matching their phenotypic convergence (loss of eyes and pigment, excess fat, insulin resistance).", "kw": ["convergence"], "info": "", "concl": "Their hypothesis is that selection repeatedly acted on existing transcriptional gene regulatory networks when the fish met a new environment."}, {"type": "qa", "section": "Discussion", "q": "What do the authors say about cis versus trans overall?", "a": "Cell culture assays suggested a large proportion of CREs have altered activities potentially from trans-acting effects, while some arise from underlying genetic changes, and genetic variation contributes to the gain of accessible regions in cavefish.", "kw": ["cis vs trans"], "info": "This inference is loosely argued: the reporter assay tests sequence differences in a constant cellular environment, so how trans effects are deduced from it is not spelled out.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What do the authors propose for future work?", "a": "That many other differentially accessible regions found here are involved in metabolic adaptation, and that Astyanax mexicanus is an effective system for uncovering gene regulatory networks behind physiological adaptation to new environments.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Animals and sampling", "q": "How were fish housed and livers collected?", "a": "Surface fish and cavefish were kept under identical lab conditions, same food and 14/10 h light/dark cycle, to negate environmental effects. Livers were dissected in the morning, 3 h after lights on, after overnight fasting, and split for RNA-seq and ATAC-seq.", "kw": ["husbandry"], "info": "Fish were 9 to 12 months old, mixed sexes for ATAC-seq. Methods say livers from three fish per population, while GEO lists two ATAC-seq and two RNA-seq samples per population.", "concl": ""}, {"type": "qa", "section": "Methods - ATAC-seq", "q": "How was ATAC-seq adapted to whole liver tissue?", "a": "Livers were Dounce-homogenized with 30 to 40 strokes of the loose pestle in lysis buffer to release nuclei; about 70,000 nuclei were tagmented with Nextera Tn5 at 37 C for 22 to 24 min, then sequenced paired-end on Illumina NextSeq Mid-Output.", "kw": ["ATAC-seq", "Tn5"], "info": "Nuclei were checked with Trypan blue. Over 80% of reads mapped, duplication was under 0.4% per sample, and ATACseqQC gave a mean fragment length of 200 bases with 200-bp periodicity.", "concl": ""}, {"type": "qa", "section": "Methods - ChIP-seq and RNA-seq", "q": "What were the ChIP-seq and RNA-seq details?", "a": "ChIP used about 200,000 cells and 1 ug antibody per sample: H3K4me3 (Millipore 07-473), H3K27ac (Abcam ab4729), H3K27me3 (Abcam ab195477). RNA-seq used TruSeq Stranded mRNA; both were sequenced as 50-bp single reads on a HiSeq 2500.", "kw": ["ChIP-seq"], "info": "Livers were fixed in 1% formaldehyde for 15 min and chromatin prepared with the MAGnify Low Cell ChIP-Seq kit. Antibodies were validated by western blot.", "concl": ""}, {"type": "qa", "section": "Methods - Data analysis", "q": "Which tools and thresholds were used for alignment, peaks and differential tests?", "a": "Bowtie 2 v2.3.4.1 to astMex_2.0 (ATAC with -X 2000 --very-sensitive), MACS2 v2.1.2 default peak calling, consensus peaks required in at least 2 replicates, and edgeR for differential accessibility with mean CPM of at least 1 and Benjamini-Hochberg adjusted P < 0.0001.", "kw": ["Bowtie2", "MACS2", "edgeR"], "info": "RNA-seq used STAR v2.6.1c (--outFilterMultimapNmax 2, --quantMode GeneCounts) with Ensembl 96 models, then edgeR. Peaks were mapped to the nearest gene with GenomicRanges in R 3.6.1. Note different thresholds in different analyses: P < 0.0001 globally, q < 0.05 for heatmaps, P < 0.001 for the SNP density comparison.", "concl": ""}, {"type": "qa", "section": "Methods - Data analysis", "q": "How was ChromHMM run?", "a": "ChromHMM v1.15 on the three histone marks, BinarizeBam with 200-bp bins and Poisson threshold 0.001, then a seven-state HMM with learnModel defaults.", "kw": ["ChromHMM"], "info": "ATAC peaks were resized to 400 bp; a state had to cover at least 50% of a peak or genome bin. Enrichment was computed against 1,000 bedtools shuffle randomizations. The ChromHMM genome was built from the Ensembl 94 release.", "concl": ""}, {"type": "qa", "section": "Methods - Data analysis", "q": "How were variants called and motif disruptions predicted?", "a": "ATAC reads were aligned with BWA mem v0.7.17 and variants called with GATK 3.8 HaplotypeCaller under a best practices Snakemake pipeline with two bootstrapping rounds for BQSR, then GATK hard filters. motifbreakR used HOCOMOCO from MotifDb 1.30 with threshold 1e-4, method ic and uniform background.", "kw": ["GATK", "motifbreakR", "HOCOMOCO"], "info": "SNP filters QD < 2.0, FS > 60.0, MQ < 40.0, ReadPosRankSum < -8.0; indel filters QD < 2.0, FS > 200.0, ReadPosRankSum < -20.0. Lab stocks are probably somewhat inbred, giving little power for allele frequencies, so only fixed differences were analyzed.", "concl": ""}, {"type": "qa", "section": "Methods - Data analysis", "q": "How were conservation, motif and pathway analyses done?", "a": "Conservation used GERP constrained regions for 11 fish from Ensembl on the astMex1 genome with exons removed and 1,000 size-matched random background sets. Motifs used HOMER findMotifsGenome.pl -size given with known vertebrate motifs, and pathways used GSEA reactomes after converting gene IDs to human.", "kw": ["GERP", "HOMER", "GSEA"], "info": "Human liver enhancers were mapped through UCSC multiz100way hg19 to astMex1 pairwise alignments (mafSpeciesSubset) and bedtools v2.26.0. Conservation used astMex1 while everything else used astMex_2.0.", "concl": ""}, {"type": "qa", "section": "Methods - Reporter assays and EMSA", "q": "What were the reporter and EMSA conditions?", "a": "CREs were cloned into pGL4.23 upstream of a minimal promoter driving firefly luciferase, co-transfected with pRLTK Renilla control (350 ng test, 150 ng control, Lipofectamine LTX) and read 48 h later, with empty vector normalized to 1. EMSA used recombinant human IRF2 (0.25 ug), 100 fmol 32P-labeled probe and 25 pmol competitor on 6% retardation gels.", "kw": ["pGL4.23", "EMSA"], "info": "Constructs were made by Gibson assembly; assays had two or more replicates (figures state three biological replicates) and significance came from a two-tailed Student's t-test.", "concl": ""}, {"type": "qa", "section": "Methods - Data availability", "q": "Where are the data?", "a": "ATAC-seq, ChIP-seq and RNA-seq data are at GEO accession GSE153052, and original data plus all analysis code are in the Stowers Original Data Repository (libpb-1538).", "kw": ["GSE153052"], "info": "A UCSC Genome Browser session with all AstMex2 tracks is also provided.", "concl": ""}, {"type": "note", "section": "Results - Genetic changes in CREs", "text": "Only 7 of 20 functional CREs showed allele-specific differences in ZFL cells. Worth going back to how much of the morphotype-biased accessibility is really cis-encoded versus driven by trans or tissue context, since cell lines from other species may miss the relevant trans environment."}, {"type": "note", "section": "Results - IRF2 deletion as adaptive trait", "text": "The selection claim rests on genotyping one individual each from Tinaja, Yerbaniz, Piedras and Japones. A population-level sample of the IRF2 deletion frequency across cave populations would be needed to test for positive selection properly."}, {"type": "note", "section": "Discussion", "text": "The proposed tyrosine-to-TCA flux is inferred from expression of hpdb, hgd and fah plus reporter data. No metabolite measurements (fumarate, acetoacetate, tyrosine) were made in this paper, so the metabolic trade-off remains a hypothesis."}], "key": "amexicanus/Krishnan_2022_NatGenet_cis_regulatory_metabolic_adaptation", "shared": "", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Gross_2013", "title": "Albinism in phylogenetically and geographically distinct populations of Astyanax cavefish arises through the same loss-of-function Oca2 allele", "category": "Genetics of cave traits", "link": "https://doi.org/10.1038/hdy.2013.26", "note": "", "source_pdf": "papers/amexicanus/Gross_2013_Heredity_albinism_cavefish_populations.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What question does this paper address?", "a": "Where the albinism that appeared in a captive stock of originally pigmented Micos cavefish comes from. The fish were collected in 1970, and albinos appeared over the past two decades.", "kw": ["albinism", "Micos", "Oca2"], "info": "They combined new coloration analyses, comparisons of coding sequence and measurements of mRNA expression level.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the main finding?", "a": "Albino Micos cavefish carry two copies of the same loss-of-function Oca2 allele that was first found in the geographically distant Pachón cave population.", "kw": ["Oca2", "Pachón"], "info": "Micos is phylogenetically young (younger stock, about 2.8 MYa) and Pachón is phylogenetically old (older stock, about 6.7 MYa).", "concl": "Geographically and phylogenetically distinct cave populations can evolve the same troglomorphic phenotype from standing genetic variation in the ancestral surface fish."}, {"type": "qa", "section": "Abstract", "q": "How many cave populations does A. mexicanus have, and when did the ancestral surface stocks invade?", "a": "There are 29 cave-adapted populations in a karst region of northeastern Mexico. They descend from an 'old' surface stock that invaded about 6.7 MYa and a 'young' stock that invaded about 2.8 MYa.", "kw": ["old and young stocks"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are regressive phenotypes, and how might they evolve?", "a": "Regressive phenotypes are traits that are reduced or lost in a derived lineage. Proposed mechanisms are direct selection, neutral forces, or indirect effects through pleiotropy.", "kw": ["regressive evolution", "pleiotropy", "neutral forces"], "info": "Past studies give mixed support for each hypothesis. It is unclear whether one mechanism governs all regressive traits.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Where are the Astyanax cave populations located geographically?", "a": "In northeastern Mexico, in three main regions: the eastern Sierra de El Abra, the northern Sierra de Guatemala and the western Sierra de Colmena.", "kw": ["El Abra", "Guatemala", "Colmena"], "info": "La Cueva Chica, a southern El Abra cave, was the first locality where Astyanax cavefish were discovered. Many populations have converged on eye loss and reduced pigmentation.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which ancestral stock colonized which caves?", "a": "The older stock colonized the El Abra caves, including Pachón, about 6.7 MYa. The younger stock, related to the extant local surface population, colonized the northern Guatemala and western Colmena caves about 2.8 MYa.", "kw": ["two-wave colonization"], "info": "The authors call this the consensus view.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is special about the Micos cave population?", "a": "It is the most geographically isolated Astyanax cave population. Its three cave entrances to an underground river (Río Subterráneo) lie about 35 km west of the southern El Abra cave network, separated by the Sierra de Nicolás Perez and Sierra de Colmena ranges.", "kw": ["Micos"], "info": "The population was discovered in the late 1960s. The founding captive stock was uniformly pigmented, with as many melanophores under daylight as surface fish.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was already known about the genetics of albinism in Astyanax?", "a": "Albinism is recessive and was mapped to Oca2 (ocular and cutaneous albinism type II). Oca2 encodes a 12-transmembrane domain channel protein that is thought to transport small molecules in pigment cells.", "kw": ["Oca2", "recessive"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which cave populations are albino in the wild, and what Oca2 lesions do they carry?", "a": "Four populations are albino in the wild: Pachón, Molino, Yerbaniz and Japonés. Pachón and Molino carry different coding mutations that each abolish Oca2 function in a melan-P cell assay. Yerbaniz and Japonés are presumed to carry cis-regulatory changes that affect Oca2 transcript levels.", "kw": ["melan-P assay", "cis-regulatory", "convergence"], "info": "The cis-regulatory inference comes from complementation: all offspring of albino Pachón x Japonés crosses were albino.", "concl": ""}, {"type": "qa", "section": "Methods - Fish collection and husbandry", "q": "Where did the Micos fish come from, and how were they kept?", "a": "15 pigmented fish were collected in the Micos cave in 1970 and kept at the Zoological Museum, University of Hamburg. All fish studied descend from this wild-caught stock.", "kw": [], "info": "To avoid contamination with other populations, they were kept in separate, unconnected tanks and observed daily. Conditions: Middle European light:dark cycle, 24 degrees C, fed once daily (flake food, Artemia, Daphnia).", "concl": ""}, {"type": "qa", "section": "Methods - Fish breeding", "q": "How was the Micos stock bred, and when did albinos appear?", "a": "The stock was kept as one group and bred naturally by group mating roughly once every 4 years. Albinos first appeared within a single generation in the 1990s, after about six or seven generations in the lab.", "kw": ["group mating"], "info": "Astyanax is sexually mature at about 1 year. The Micos stock was bred less often, only to maintain it.", "concl": ""}, {"type": "qa", "section": "Methods - Fish breeding", "q": "Which crosses produced the albinos used in this study, and how many albinos appeared?", "a": "Four females and five males were used in two group breedings. The first gave about 1000 offspring, 8 of them albino. The second gave roughly the same number of offspring, with three or four albinos.", "kw": [], "info": "All fish were raised under the same lighting in the same 100-liter glass tanks.", "concl": ""}, {"type": "qa", "section": "Methods - Coloration analysis", "q": "How did they measure coloration quantitatively?", "a": "This was a new method. They bound protein extract from caudal fin clips, including melanin, onto the filter of a DNeasy spin column. The filter was imaged at x13.7, and its color was scored digitally in Adobe Photoshop (CMYK) and ImageJ (grayscale darkness).", "kw": ["DNeasy", "CMYK", "ImageJ"], "info": "Fin clips were digested in 180 ul Buffer ATL plus 20 ul proteinase K. Because the kit gives variable DNA yields, several parameters were standardized before imaging (Supplementary Figure S1).", "concl": ""}, {"type": "qa", "section": "Methods - Coloration analysis", "q": "Which groups were compared in the coloration analysis, and with how many fish?", "a": "Seven individuals from each of five groups: surface fish, Pachón cavefish, surface x Pachón F1 hybrids, pigmented Micos and albino Micos.", "kw": [], "info": "The dorsal part of the caudal fin was cut from live, anesthetized fish.", "concl": ""}, {"type": "qa", "section": "Methods - Coloration analysis", "q": "How exactly were the CMYK and grayscale values obtained?", "a": "For CMYK, a circular grid of 13 dots was overlaid on each filter image, and the Photoshop eyedropper recorded 0 to 100 percent for each channel at each dot; the values were then averaged. For grayscale, images were converted to grayscale and inverted, and mean darkness (0 = white, 255 = black) was measured three times in ImageJ and averaged.", "kw": ["Photoshop", "ImageJ"], "info": "Statistics were done in SPSS v18.", "concl": ""}, {"type": "qa", "section": "Methods - Quantitative PCR", "q": "How did they measure Oca2 expression?", "a": "By qPCR on cDNA from tail fin RNA of albino Micos (n = 5) and surface fish (n = 5). Expression was normalized to GAPDH, with EvaGreen supermix on a Bio-Rad MiniOpticon.", "kw": ["qPCR", "GAPDH", "EvaGreen"], "info": "RNA was extracted with RNeasy, and 1 ug was reverse transcribed with oligo dT and the Roche Transcriptor RT kit (50 degrees C for 1 h). The Oca2 primers give a 96-bp product. There were 40 cycles with annealing at 55.1 degrees C. Each template was run in triplicate in two experiments, with genomic DNA as a positive amplification control. Analysis used CFX Manager v1.6. The listed step times (95 degrees C for 30 min initially, then 5 min and 10 min steps) are as printed in the paper and look unusually long.", "concl": ""}, {"type": "qa", "section": "Methods - Oca2 genotyping and sequencing", "q": "How did they sequence the Oca2 coding sequence in Micos fish?", "a": "They amplified Oca2 cDNA with full-length primers and four overlapping tiling primer sets, subcloned the products into pGEM-T Easy, Sanger sequenced them with M13F/M13R, and assembled the sequences in LaserGene (DNAStar).", "kw": ["Sanger", "pGEM-T Easy", "LaserGene"], "info": "n = 6 individuals each from pigmented and albino Micos were sequenced. LaserGene v9.1.1 (EditSeq, SeqMan, MegAlign) was used for assembly and analysis.", "concl": ""}, {"type": "qa", "section": "Methods - Oca2 genotyping and sequencing", "q": "How did they test for the known Molino and Pachón deletions in genomic DNA?", "a": "With PCR using the diagnostic primers from the earlier Oca2 mapping study: exon 14 and exon 23 as controls, exon 21 for the Molino deletion, and exon 24 to 3' UTR for the Pachón deletion.", "kw": ["exon deletion", "diagnostic PCR"], "info": "The control regions were expected to amplify in every specimen because they showed no changes in earlier work. The Figure 4 legend describes set C as intron 23, while the methods call it exon 23.", "concl": ""}, {"type": "qa", "section": "Methods - Oca2 genotyping and sequencing", "q": "How was the A1252G SNP genotyped?", "a": "The SNP region was PCR amplified and sequenced directly by Sanger sequencing with the reverse primer. They genotyped n = 6 fish from each of four groups: surface, Pachón, albino Micos and pigmented Micos.", "kw": ["A1252G", "SNP"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - Microscopy and imaging", "q": "Which imaging setup did they use?", "a": "A Leica M205 FA stereomicroscope with a DFC310FX camera. Images were taken with the MultiFocus module of Leica Application Suite v3.8, which merges multiple focal planes into one image.", "kw": ["Leica M205 FA"], "info": "Figures were assembled in Adobe Photoshop CS3.", "concl": ""}, {"type": "qa", "section": "Results - Albino individuals in captive Micos stock", "q": "Are the depigmented Micos fish truly albino or just weakly pigmented?", "a": "They are truly albino. Light microscopy of tail fins found no pigmented melanophores or eumelanin at all, while pigmented Micos fins from the same stock had spindly melanophores.", "kw": ["melanophores", "eumelanin"], "info": "None of the fish collected in 1970 were albino.", "concl": ""}, {"type": "qa", "section": "Results - Digital coloration analysis", "q": "What were the mean CMYK values for each group?", "a": "Surface: C 51.65, M 45.25, Y 54.08, K 16.68. F1 hybrid: 46.59, 40.75, 49.62, 9.40. Pigmented Micos: 24.68, 20.90, 27.24, K 0.05. Albino Micos: 18.58, 13.51, 17.58, K 0.00. Albino Pachón: 17.97, 13.33, 18.30, K 0.00.", "kw": ["CMYK"], "info": "Surface and F1 profiles were very similar. Pigmented Micos was lower than surface. Albino Micos and albino Pachón were nearly identical in all channels.", "concl": ""}, {"type": "qa", "section": "Results - Digital coloration analysis", "q": "Which statistical tests did they use for coloration, and what did they show?", "a": "One-way ANOVA was significant for every channel: cyan F(4,30) = 130.53, magenta F(4,30) = 133.63, yellow F(4,30) = 144.88, all P < 0.0001. In Tukey HSD post hoc tests, albino Micos and albino Pachón did not differ from each other in any of the three channels.", "kw": ["ANOVA", "Tukey HSD"], "info": "The K channel could not be tested by ANOVA because all albino Micos and albino Pachón fish had K = 0, so there was no variance in those groups.", "concl": ""}, {"type": "qa", "section": "Results - Digital coloration analysis", "q": "What did the grayscale darkness analysis show?", "a": "Surface fish were darkest, F1 hybrids slightly lower, and pigmented Micos lower again. Albino Micos and albino Pachón were very similar. ANOVA gave F(4,30) = 109.48, P < 0.0001, and Tukey HSD found no difference between the two albino groups.", "kw": ["grayscale", "melanin"], "info": "Grayscale was used instead of the K channel to measure overall darkness. Exact group means appear only as bars in Figure 2l.", "concl": "Depigmented Micos cavefish are formally albino and match albino Pachón in coloration."}, {"type": "qa", "section": "Results - Oca2 expression", "q": "Is albinism in Micos caused by reduced Oca2 expression, as presumed for Japonés?", "a": "No. Albino Micos fins expressed slightly more Oca2 than surface fins, a more than 1.7-fold difference normalized to GAPDH (n = 5 per group).", "kw": ["Oca2", "qPCR"], "info": "They expected lower expression if a cis-regulatory change were responsible. Because expression was not reduced, they examined the coding sequence next.", "concl": "A cis-regulatory loss of Oca2 expression is not the cause of Micos albinism."}, {"type": "qa", "section": "Results - Oca2 coding deletion", "q": "Do albino Micos carry the Molino exon 21 deletion?", "a": "No. The 102-bp exon 21 amplicon (B) was missing in Molino fish, as expected, but was present in both albino and pigmented Micos.", "kw": ["exon 21", "Molino"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Oca2 coding deletion", "q": "Do albino Micos carry the Pachón exon 24 to 3' UTR deletion?", "a": "Yes. The exon 24 to 3' UTR amplicon (D) failed to amplify in albino Micos, just as in Pachón. It did amplify in pigmented Micos, surface fish and Japonés fish.", "kw": ["exon 24", "3' UTR deletion", "Pachón allele"], "info": "Amplicon size is reported inconsistently: 235 bp in the results text and about 300 bp in the Figure 4 legend. Ladder: Roche VIII (110 to 1114 bp).", "concl": "Albino Micos carry the same Oca2 deletion as albino Pachón."}, {"type": "qa", "section": "Results - Oca2 coding deletion", "q": "What does the Pachón Oca2 deletion do to the protein?", "a": "It produces an Oca2 protein truncated at the C-terminus, missing 19 amino acids compared with the surface protein. In the earlier melan-P cell assay, this allele could not produce melanin.", "kw": ["truncation", "melan-P"], "info": "The functional data come from the earlier Oca2 study, not this paper.", "concl": ""}, {"type": "qa", "section": "Results - Oca2 coding deletion", "q": "How large is the Oca2 gene?", "a": "Based on the zebrafish (Danio rerio) genome, Oca2 is predicted to be a multi-exon gene of more than 170 kb, about 171.707 kb in the figure.", "kw": ["Oca2 gene structure"], "info": "This is an estimate extrapolated from zebrafish, not measured in Astyanax.", "concl": ""}, {"type": "qa", "section": "Results - A1252G SNP genotyping", "q": "What is the A1252G SNP?", "a": "A nonsynonymous SNP at nucleotide 1252 in exon 13 of the Pachón Oca2 allele, causing a valine/methionine substitution at amino acid 418. This position is highly conserved across vertebrates.", "kw": ["A1252G", "exon 13"], "info": "Unlike the exon 24 deletion, this SNP did not impair Oca2 function in the melan-P assay of the earlier study. The paper's wording ('substitution of a valine residue for a methionine residue') does not make the direction of the change clear.", "concl": ""}, {"type": "qa", "section": "Results - A1252G SNP genotyping", "q": "What genotypes did they find at position 1252?", "a": "Albino Micos and albino Pachón were all homozygous 1252G. Pigmented Micos were either homozygous 1252A or heterozygous A/G.", "kw": ["genotype", "heterozygote"], "info": "This assumes that 1252G and the exon 24 deletion are on the same allele, as reported for Pachón.", "concl": "One intact Oca2 allele is enough for pigmentation. Heterozygous pigmented Micos explain how albinos arose through random matings."}, {"type": "qa", "section": "Results - A1252G SNP genotyping", "q": "How far apart are the SNP and the deletion, and is their phase known?", "a": "About 44.1 kb apart, estimated from zebrafish Oca2 structure. Their gametic phase in the Micos parents is unknown because the albinos came from group breedings of few fish.", "kw": ["linkage", "gametic phase"], "info": "The authors presume a cis configuration, as in Pachón. The text cites Figure 3 for the zebrafish structure, but this is shown in Figure 4.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How do the authors explain finding the same Oca2 allele in Micos and Pachón?", "a": "The allele was standing genetic variation in the ancestral surface fish. It came into Micos with the young colonizing stock and introgressed into the old Pachón population.", "kw": ["standing genetic variation", "introgression"], "info": "", "concl": "Shared loss-of-function allele from the ancestral surface population, not convergent new mutation."}, {"type": "qa", "section": "Discussion", "q": "What is mitochondrial capture, and why does it matter for Pachón?", "a": "Early mtDNA data clustered Pachón with the distant Micos population, while geography and microsatellites grouped it with the old El Abra caves. The conflict is explained by introgressive hybridization with surface fish, which led to capture of surface mtDNA by Pachón.", "kw": ["mitochondrial capture", "gene flow"], "info": "Together with the Oca2 result, this suggests historical and/or recent gene flow between the populations.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why is this result surprising compared with earlier work?", "a": "Earlier studies found different lesions in the same genes behind convergent pigment loss (Oca2 for albinism, Mc1r for the brown phenotype), and different genes behind eye loss in different caves. None of these studies found the cave alleles in surface populations.", "kw": ["convergent evolution", "Mc1r", "complementation"], "info": "Pachón x Sabinos hybrids had larger, more differentiated eyes. Pachón x Tinaja hybrids had a functional visual system. Both crosses, however, involved El Abra populations from the same old stock.", "concl": ""}, {"type": "qa", "section": "Discussion - Appearance of albinism in Micos", "q": "Do eye loss and loss of pigmentation evolve by the same mechanism?", "a": "Possibly not. In an earlier QTL polarity analysis, every eye and lens QTL cave allele reduced size, which suggests selection. QTL for melanophore number had mixed polarities, which suggests drift or pleiotropy.", "kw": ["QTL polarity", "genetic drift"], "info": "Eye reduction might also be a pleiotropic result of selection on constructive traits such as lateral line sensitivity.", "concl": ""}, {"type": "qa", "section": "Discussion - Appearance of albinism in Micos", "q": "What does it suggest that Micos carry the allele but are not albino in the wild?", "a": "That pigmentation may not be under selection in Micos. Albinism may give no selective advantage there and may be evolving neutrally.", "kw": ["neutral evolution"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion - Standing variation vs de novo mutation", "q": "Why do they reject a de novo origin of Micos albinism?", "a": "A de novo origin would require the identical exon 24 deletion and A1252G SNP to arise independently in each cave population, which they consider unlikely.", "kw": ["de novo mutation"], "info": "This argument assumes that both changes are on the same chromosome in all individuals.", "concl": ""}, {"type": "qa", "section": "Discussion - Standing variation vs de novo mutation", "q": "Why is direct transfer of the allele from Pachón to Micos considered unlikely?", "a": "Because of geography. The caves are about 64 km apart in a straight line, Pachón fish live in isolated perched pools, and Micos lies three valleys and two mountain ranges further west.", "kw": ["geographic barriers"], "info": "Pachón entrance is about 210 m above sea level and Micos about 230 m. Pachón water drains into the Río Choy, more than 40 km from Micos. Whether an underground connection exists is unknown.", "concl": ""}, {"type": "qa", "section": "Discussion - Standing variation vs de novo mutation", "q": "Which parallel from another fish do they cite?", "a": "Stickleback. Repeated loss of lateral plate armor in freshwater populations comes from selection on ancient Eda alleles present at low frequency in marine fish.", "kw": ["Eda", "stickleback"], "info": "They also cite Bradic et al. 2012, who argued that cavefish genetic variation mostly reflects standing variation and gene flow rather than new mutations.", "concl": "The authors present this as the first evidence that a causal regressive allele in different caves was inherited from surface populations."}, {"type": "qa", "section": "Discussion - Alternative explanations", "q": "What is the main caveat about the A1252G SNP?", "a": "The SNP is used as a marker linked to the deletion, but it does not itself impair Oca2 function. If the two changes are not fully linked, the association could be misleading.", "kw": ["linkage disequilibrium"], "info": "If they are unlinked, one change might be standing variation while the other arose independently, or each cave might have gained one change and exchanged it through gene flow. At about 44.1 kb apart they could recombine, and the small sample size prevents estimating linkage disequilibrium.", "concl": ""}, {"type": "qa", "section": "Discussion - Alternative explanations", "q": "What does the allele's presence in the founders imply about its frequency?", "a": "The allele must have been common enough in the ancestral surface fish to be captured in each colonization or hybridization event, despite founder effects. This raises the possibility that it is not rare in caves and may have a 'cryptic' selective value there.", "kw": ["founder effect", "cryptic selection"], "info": "If so, the assumption that this allele is rare and deleterious may need revising. They call for more sampling of wild Micos, Pachón and surface fish to measure allele frequencies.", "concl": ""}, {"type": "qa", "section": "Conclusions", "q": "What are the authors' overall conclusions?", "a": "Micos albinism is caused by the same Oca2 allele as Pachón albinism. Cave traits in young populations can arise from ancestral standing variation, and rare ancestral polymorphisms offer a route to rapid evolution in caves.", "kw": ["rapid evolution"], "info": "Albinism appeared very quickly (about 6 to 7 generations) in captive fish from a population that is not albino in nature. It is unclear whether other traits such as eye loss can appear as quickly after a bottleneck.", "concl": "First demonstration of regressive phenotypic change in Astyanax through standing genetic variation in the ancestral population."}, {"type": "qa", "section": "Conclusions", "q": "Where are the raw data deposited?", "a": "In Dryad (doi:10.5061/dryad.jh8j7). The deposit includes coloration measurements and statistics, filter images with and without the grid, raw qPCR values for Oca2 and GAPDH, and fin clip images.", "kw": ["Dryad"], "info": "", "concl": ""}, {"type": "note", "section": "Discussion", "text": "Did younger cave populations get other regressive traits, such as eye loss, from ancestral standing variation, or does this apply only to albinism?"}, {"type": "note", "section": "Discussion - Alternative explanations", "text": "Is the exon 24 deletion really in cis with 1252G in Micos? Phase was not resolved, and the zebrafish-based 44.1 kb estimate leaves room for recombination. Direct haplotype data would resolve this."}, {"type": "note", "section": "Conclusions", "text": "How common are loss-of-function Oca2 alleles in wild Micos, Pachón and surface populations? Could they have a cryptic selective value in caves?"}], "key": "amexicanus/Gross_2013_Heredity_albinism_cavefish_populations", "shared": "", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Gore_2018", "title": "An epigenetic mechanism for cavefish eye degeneration", "category": "Eye loss", "link": "https://doi.org/10.1038/s41559-018-0569-4", "note": "", "source_pdf": "papers/amexicanus/Gore_2018_NatEcolEvol_epigenetic_eye_degeneration.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this paper address?", "a": "Coding and non-coding DNA mutations are known to drive phenotypic variation in evolution, but much less is known about the role of epigenetics. Eye development genes have been linked to eye loss in Pachón cavefish, yet no inactivating mutations have been found in any of them.", "kw": ["epigenetics", "Pachón cavefish"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What is the main finding of the paper?", "a": "Excess DNA methylation-based epigenetic silencing promotes eye degeneration in blind cave A. mexicanus. DNA methylation represses eye-specific genes and globally regulates early eye development.", "kw": ["DNA methylation", "eye degeneration"], "info": "They ran parallel analyses in A. mexicanus cave and surface morphs and in zebrafish (Danio rerio).", "concl": "Changes in DNA methylation-based gene repression can be an important molecular mechanism for generating phenotypic diversity during development and evolution."}, {"type": "qa", "section": "Abstract", "q": "How do the hypermethylated cavefish genes relate to human disease?", "a": "The most significantly hypermethylated and downregulated genes in the cave morph are linked to human eye disorders.", "kw": ["human eye disorders"], "info": "", "concl": "Suggests that the function of these genes is conserved across vertebrates."}, {"type": "qa", "section": "Introduction", "q": "Why might cavefish have lost their eyes in the first place?", "a": "Recent studies suggest that eye regression evolved as part of a strategy to save energy in fish adapted to dark, nutrient-poor caves.", "kw": ["energy conservation"], "info": "Blind cave morphs evolved from surface fish over a few million years of isolation in dark Mexican caves.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How does eye loss in the naked mole rat differ from that in Pachón cavefish?", "a": "The naked mole rat genome shows functional loss of more than a dozen key eye genes through inactivating mutations. The Pachón cavefish genome and other studies found no inactivating null mutations in essential eye development genes.", "kw": ["naked mole rat", "Heterocephalus glaber", "null mutations"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What hypothesis did the authors propose to explain eye loss without null mutations?", "a": "Pachón cavefish may carry cis-regulatory mutations that change the expression of eye genes and epigenetic regulators. Epigenetic regulation would then indirectly affect many target eye genes at the same time.", "kw": ["cis-regulatory mutations", "epigenetic regulators"], "info": "DNA methylation was chosen because it is known to change the expression of large cohorts of genes simultaneously.", "concl": ""}, {"type": "qa", "section": "Results and discussion - eye phenotypes and dnmt3bb.1", "q": "When does the cavefish eye phenotype appear during development?", "a": "At 36 hpf, cave and surface embryos look the same, with properly formed lenses and optic cups. By 5 days of development, eye degeneration is clearly visible, and adult cavefish have no eyes.", "kw": ["eye regression", "optic cup"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - eye phenotypes and dnmt3bb.1", "q": "Which genes show reduced expression before eye regression in cavefish?", "a": "The crystallins crybb1, crybb1c and cryaa are reduced in cavefish heads at 54 hpf compared with surface fish (qRT-PCR, P<0.005). The control gene myod is not significantly changed.", "kw": ["crybb1", "cryaa", "crystallins"], "info": "Three biological replicates, isolated heads, normalized to surface fish levels.", "concl": ""}, {"type": "qa", "section": "Results and discussion - eye phenotypes and dnmt3bb.1", "q": "What are de novo DNMTs, and where is dnmt3bb.1 expressed?", "a": "De novo DNA methyltransferases (DNMTs) add new methyl marks to DNA. Zebrafish dnmt3bb.1 is expressed in haematopoietic stem and progenitor cells and in the ciliary marginal zone of the developing eye.", "kw": ["dnmt3bb.1", "DNMT", "ciliary marginal zone"], "info": "The ciliary marginal zone is a stem-cell-containing tissue around the lens that generates neurons and other eye cell types. Expression in this zone was shown by whole-mount in situ hybridization at 36 hpf. The authors had shown earlier that loss of dnmt3bb.1 causes failure to maintain haematopoietic stem and progenitor cells.", "concl": ""}, {"type": "qa", "section": "Results and discussion - eye phenotypes and dnmt3bb.1", "q": "What eye phenotype do zebrafish dnmt3bb.1 mutants show?", "a": "dnmt3bb.1 y258 null mutant larvae and adults have enlarged eyes with retinal hyperplasia compared with wild-type siblings. Their eyes also have higher expression of opn1lw1, gnb3a and crx.", "kw": ["dnmt3bb.1", "retinal hyperplasia", "opn1lw1"], "info": "Eye size was measured in 3-week-old fish (n = 18, two-tailed t-test, P<0.05). qRT-PCR was done on adult eyes (3 biological replicates, P<0.005). The text writes the allele as y258 while the figure panel labels show y358, an inconsistency in the PDF.", "concl": ""}, {"type": "qa", "section": "Results and discussion - eye phenotypes and dnmt3bb.1", "q": "How is dnmt3bb.1 expressed in Pachón cavefish?", "a": "Its expression is 1.5-fold higher in Pachón cavefish than in surface fish (qRT-PCR, P<0.05). The A. mexicanus dnmt3bb.1 gene also maps to an eye size QTL.", "kw": ["dnmt3bb.1", "QTL"], "info": "", "concl": "The inverse correlation between eye size and dnmt3bb.1 expression in both species led to the hypothesis that excess Dnmt3bb.1-dependent methylation globally represses eye genes in cavefish."}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "What genome-wide experiment did they do on cavefish and surface fish eyes?", "a": "They ran combined RNA-seq and whole-genome bisulfite sequencing on RNA and DNA co-isolated from eyes dissected at 54 hpf. This is a critical period for eye development in Pachón cavefish.", "kw": ["RNA-seq", "WGBS", "co-isolation"], "info": "Two biological replicates per morph.", "concl": ""}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "What did the RNA-seq show?", "a": "It confirmed higher dnmt3bb.1 expression in cavefish eyes and showed reduced expression of many eye development genes. Downregulated genes included cryaa, crybgx, opn1lw and rom1a, and upregulated genes included lyz and isl1l.", "kw": ["differential expression", "dnmt3bb.1"], "info": "dnmt3bb.1 was compared as FPKM normalized to surface fish (P<0.05).", "concl": ""}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "Which biological processes and pathways are most downregulated in cavefish eyes?", "a": "Visual perception (GO:0007601) was the top downregulated GO term, and eye electrophysiology was the top hit in Ingenuity Pathway Analysis. IPA predicted phototransduction as the most affected signalling pathway.", "kw": ["Gene Ontology", "IPA", "phototransduction"], "info": "Other downregulated GO terms were sensory perception, cell-cell adhesion, neurological process, system process, synaptic transmission, cell adhesion and biological adhesion.", "concl": "The same top downregulated processes were found in the naked mole rat."}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "How many genes are both promoter-hypermethylated and downregulated in cavefish eyes?", "a": "128 genes have at least 15% more methylation within 2 kb upstream of the TSS (P≤0.05) and at least 1.5-fold lower expression (P≤0.05) in cavefish compared with surface fish.", "kw": ["promoter methylation", "TSS"], "info": "Of these, 39 are annotated as expressed in the eye in mice and 26 in humans. The rationale is that promoter methylation is highly correlated with gene repression.", "concl": ""}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "How many of the hypermethylated, downregulated genes are linked to human eye disease, and which are the extremes?", "a": "19 genes are linked to human eye disorders (Table 1). OPN1LW has the largest methylation increase (47.98%, log2FC -4.15, cone-rod dystrophy), and OPN1MW has the largest expression drop (log2FC -7.26, 36.78% methylation increase).", "kw": ["Table 1", "OPN1LW", "OPN1MW"], "info": "Other examples: RS1 (log2FC -4.81, retinoschisis), PRPH2 (-4.61, retinitis pigmentosa), GRK1 (-4.39, Oguchi disease), CRYGB (-4.13, polar cataract), CRX (-1.34, 20.36%, retinitis pigmentosa) and GNB3 (-2.15, 15.75%, congenital night blindness).", "concl": ""}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "What are opn1lw1, gnb3a and crx, and why focus on them?", "a": "opn1lw1 is an opsin associated with cone-rod dystrophy and colour blindness. gnb3a is defective in autosomal recessive congenital stationary night blindness, and crx is a photoreceptor-specific transcription factor whose loss causes blindness in humans.", "kw": ["opn1lw1", "gnb3a", "crx"], "info": "These three genes were used for validation throughout the paper.", "concl": ""}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "How did targeted bisulfite sequencing confirm promoter hypermethylation in cavefish?", "a": "At 54 hpf, promoter CpG methylation was higher in cavefish than in surface fish: opn1lw1 rose from 68% to 98%, gnb3a from 34% to 65%, and crx from 2% to 54%.", "kw": ["targeted bisulfite sequencing", "CpG"], "info": "The values are percentages of methylated residues shown as pie charts in Fig. 2.", "concl": ""}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "How was the reduced expression of these three genes validated?", "a": "Whole-mount in situ hybridization with opn1lw1, gnb3a and crx probes showed strongly reduced expression in cavefish eyes compared with surface fish eyes.", "kw": ["WISH"], "info": "At least 20-25 embryos were analysed by in situ hybridization.", "concl": ""}, {"type": "qa", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "q": "Can eye genes be downregulated without being methylated themselves?", "a": "Yes. crx is needed for proper expression of many other eye genes, and many of these crx targets are strongly reduced in cavefish eyes even though most are not methylated.", "kw": ["crx", "indirect regulation"], "info": "Shown in Supplementary Fig. 5.", "concl": "Methylation of a key transcription factor could spread repression to downstream eye genes."}, {"type": "qa", "section": "Results and discussion - tet2/tet3 zebrafish mutants", "q": "What do TET enzymes do, and how do they differ from DNMTs?", "a": "DNMTs add methyl groups to cytosines to make 5-methylcytosine. TET enzymes oxidize methylcytosine to hydroxymethylcytosine, which promotes DNA demethylation.", "kw": ["TET", "5hmC", "demethylation"], "info": "Zebrafish, like mammals, have three partially redundant TET enzymes (Tet1, Tet2, Tet3). Tet2 and Tet3 are the main ones, and tet1/2/3 triple mutants show no extra phenotypes compared with tet2/3 double mutants.", "concl": ""}, {"type": "qa", "section": "Results and discussion - tet2/tet3 zebrafish mutants", "q": "Why use tet2-/- tet3-/- double mutant zebrafish?", "a": "These mutants have global DNA hypermethylation. They let the authors test experimentally whether more DNA methylation reduces eye gene expression and eye development.", "kw": ["tet2", "tet3", "hypermethylation"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - tet2/tet3 zebrafish mutants", "q": "What eye phenotype do tet2/tet3 double mutants have?", "a": "At 48 hpf they have smaller eyes than wild-type siblings, with increased promoter methylation and reduced expression of crx and gnb3a in isolated eyes.", "kw": ["tet2/tet3 double mutant", "crx", "gnb3a"], "info": "crx promoter methylation rose from 14% to 60% and gnb3a from 41% to 92%. Eye size: n = 10, two-tailed t-test, P<0.05. qRT-PCR: 3 biological replicates, P<0.005.", "concl": "Increasing DNA methylation is enough to repress eye genes and reduce eye size, mirroring the cavefish."}, {"type": "qa", "section": "Results and discussion - tet2/tet3 zebrafish mutants", "q": "What other phenotypes do tet2/tet3 double mutants have?", "a": "Like dnmt3bb.1 mutants, they have haematopoietic defects. After 48 hpf they also start to deteriorate with defects in brain development and do not survive beyond 5 dpf.", "kw": ["pleiotropy"], "info": "The authors suggest these extra phenotypes may result from global DNA hypermethylation. They are a caveat when reading the eye phenotype.", "concl": ""}, {"type": "qa", "section": "Results and discussion - Aza rescue of cavefish eyes", "q": "What is 5-azacytidine, and why was it injected into the eye instead of given systemically?", "a": "5-Azacytidine (Aza) is a well-characterized inhibitor of DNA methylation, approved for treating aberrant methylation in myelodysplastic syndrome. Giving Aza systemically to zebrafish embryos causes severe pleiotropic defects and early death.", "kw": ["5-Azacytidine", "DNA methylation inhibitor"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - Aza rescue of cavefish eyes", "q": "How was the Aza rescue experiment designed?", "a": "A single dose of Aza or DMSO carrier was injected into the vitreous chamber of the left eye of cavefish embryos at 42-48 hpf. Phenotypes were scored in the injected left eye and the uninjected right eye at 5 dpf.", "kw": ["microinjection", "internal control"], "info": "The uninjected right eye serves as an internal control within each animal. DMSO group n = 18, Aza group n = 12.", "concl": ""}, {"type": "qa", "section": "Results and discussion - Aza rescue of cavefish eyes", "q": "What did Aza injection do to cavefish eyes?", "a": "Aza-injected left eyes were larger than the uninjected right eyes and the DMSO-injected eyes (P<0.05). Histology showed a more organized structure with well-defined lens and retinal layers.", "kw": ["partial rescue", "histology"], "info": "Four to eight embryos per condition were sectioned and stained with H&E.", "concl": "Inhibiting excess methylation partially rescues cavefish eye development."}, {"type": "qa", "section": "Results and discussion - Aza Zebrafish dnmt3bb.1 y258 mutants, tet2 mk17 and tet3 mk18 mutants, and the EkkWill wild-type line. They also used surface and Pachón cave populations of A. mexicanus.", "kw": ["EkkWill", "Pachón"], "info": "Fish were spawned naturally. Embryos and larvae up to 5 days were used. Work followed NICHD IACUC protocols 12-039 and 18-016.", "concl": ""}, {"type": "qa", "section": "Methods - DNA isolation and whole-genome bisulfite sequencing", "q": "How were eye DNA and RNA obtained and the WGBS libraries made?", "a": "Eyes were removed with fine tungsten needles from dechorionated embryos in PBS without Ca and Mg, and DNA and RNA were co-isolated with the ZR-Duet DNA/RNA MiniPrep Kit. For WGBS, 200 ng of DNA was converted with the EZ DNA Methylation-Lightning kit, and libraries were made with the TruSeq DNA Methylation Kit.", "kw": ["ZR-Duet", "EZ DNA Methylation-Lightning", "TruSeq DNA Methylation"], "info": "Two biological replicates per morph were run on two flow cells of an Illumina HiSeq 2500 (rapid run, V2 chemistry), giving about 400 million 2x100 bp read pairs per sample.", "concl": ""}, {"type": "qa", "section": "Methods - DNA isolation and whole-genome bisulfite sequencing", "q": "How were the WGBS reads processed and differential methylation tested?", "a": "Reads were trimmed with Trimmomatic and aligned with Bismark to a bisulfite-converted Pachón genome using non-directional alignment. Conversion rates were summed per gene body and per promoter (2 kb upstream of the TSS) and compared between conditions with a two-proportion z-test.", "kw": ["Trimmomatic", "Bismark", "two-proportion z-test"], "info": "Trimming removed leading or trailing bases with quality below 5 and used a 4 bp sliding window requiring average quality above 15. Reads trimmed below 50 bp were discarded. The methods call the raw data single-end even though paired reads were sequenced, which is unclear. No multiple testing correction is described.", "concl": ""}, {"type": "qa", "section": "Methods - DNA isolation and whole-genome bisulfite sequencing", "q": "How was targeted bisulfite sequencing done?", "a": "Bisulfite-converted DNA was PCR-amplified with primers designed in MethPrimer using OneTaq Hot Start Master Mix. Amplicons were cloned into pCRII-TOPO, individual clones were Sanger-sequenced with T7 or SP6 primers, and methylation was analysed with QUMA.", "kw": ["MethPrimer", "QUMA", "pCRII-TOPO"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - RNA-seq", "q": "How was RNA-seq done and analysed?", "a": "300-900 ng of poly-A-enriched RNA was made into TruSeq Standard mRNA libraries and sequenced on one HiSeq 2500 flow cell (rapid run, V2), with 100 million paired-end reads per sample. Reads were trimmed with Trimmomatic, aligned to the Pachón genome with RNA-STAR, counted with subread featureCounts, and tested with DESeq2.", "kw": ["STAR", "featureCounts", "DESeq2"], "info": "Two biological replicates per morph. Human, mouse and zebrafish homologues were found with Ensembl BioMart. Pathway and GO analyses used Ingenuity Pathway Analysis and PANTHER.", "concl": ""}, {"type": "qa", "section": "Methods - qRT-PCR, in situ hybridization and histology", "q": "How were qRT-PCR and in situ hybridization done?", "a": "For qRT-PCR, cDNA was made with the ThermoScript RT-PCR System and run with SsoAdvanced Universal SYBR Green on a Bio-Rad CFX96, with at least three biological replicates. For in situ hybridization, DIG- and FITC-labelled antisense riboprobes were used, with 5% dextran sulfate in the hybridization buffer and antibodies pre-adsorbed to whole cavefish powder.", "kw": ["qRT-PCR", "riboprobes", "dextran sulfate"], "info": "The ISH modifications were made to reduce non-specific hybridization and improve signal-to-noise. For histology, samples were fixed in 4% PFA overnight at 4 °C, embedded in paraffin, and stained with H&E.", "concl": ""}, {"type": "qa", "section": "Methods - microinjection and eye size", "q": "What were the injection parameters and how was eye size measured?", "a": "A single 1-2 nl bolus of 100 µM Aza or 5-Aza-2'-deoxycytidine in 5% DMSO, or 5% DMSO alone, was delivered into the left eye vitreous with a Pneumatic PicoPump. Eye area was normalized to head area and compared with a paired Student's t-test.", "kw": ["PicoPump", "eye size normalization"], "info": "Embryos were mounted laterally in low-melting-point agarose. Injected embryos with axis or brain deformities were excluded. The figure legends report two-tailed t-tests while the methods say paired t-test, which is not fully consistent. Investigators were not blinded (stated in the reporting summary).", "concl": ""}, {"type": "qa", "section": "Methods - data availability", "q": "Where are the sequencing data?", "a": "In the Gene Expression Omnibus under accession GSE109006.", "kw": ["GEO"], "info": "", "concl": ""}, {"type": "note", "section": "Introduction", "text": "What makes dnmt3bb.1 expression higher in Pachón cavefish? The paper suggests cis-regulatory mutations and notes that dnmt3bb.1 maps to an eye size QTL, but the causal variant is not identified."}, {"type": "note", "section": "Results and discussion - RNA-seq and methylome of cavefish eyes", "text": "The genome-wide data rest on two biological replicates at a single stage (54 hpf), and the link between methylation and expression is correlational. Is the hypermethylation causal or a consequence of degeneration, and does it also occur in other cave populations such as Tinaja or Molino?"}, {"type": "note", "section": "Results and discussion - conclusions", "text": "The Aza rescue was only partial, and tet2/3 mutants have pleiotropic defects. Does targeted demethylation of specific promoters such as crx rescue the eye, and has altered epigenetic regulation been used in other rapidly evolved animals?"}], "key": "amexicanus/Gore_2018_NatEcolEvol_epigenetic_eye_degeneration", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}] const CAT = DATA.catKeys;
const catVars = c => { const k = CAT[c]||"gen"; return `--cl:var(--c-${k});--cd:var(--c-${k}-d)`; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const papers = DATA.papers.map(p => {
  let n = 0;
  p.items.forEach(it => { if (it.type==="qa") it.uid = p.id + ":" + (n++); });
  return {...p, slug: slug(p.id), qas: p.items.filter(i => i.type==="qa")};
});
const bySlug = Object.fromEntries(papers.map(p => [p.slug, p]));
const cats = DATA.legend.filter(c => papers.some(p => p.category===c));

/* storage */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let known = new Set(store.get("pn-known", []));
const saveKnown = () => store.set("pn-known", [...known]);
let theme = store.get("pn-theme", "auto");

  else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = "Theme: " + theme;
}
document.getElementById("theme").onclick = () => {
  theme = theme==="auto" ? "light" : theme==="light" ? "dark" : "auto";

applyTheme();

const totalQ = papers.reduce((a,p) => a + p.qas.length, 0);
document.getElementById("tot").textContent = `${papers.length} papers, ${totalQ} questions`;

/* state */
let activeCats = new Set();
let current = null;
let query = "";
const main = document.getElementById("main");

function renderCats(){
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat" style="${catVars(c)}" aria-pressed="${activeCats.has(c)}" data-cat="${esc(c)}"><span class="dot" style="background:var(--cd)"></span>${esc(c)}</button>`).join("");
}
document.getElementById("cats").onclick = e => {
