andidates include opsins (opn7a, opn8a, opn8b, tmtopsa and two putative green-sensitive opsins) and circadian genes (id2b, nfil3-5, cipcb, clocka, npas2).", "kw": ["activity QTL", "clocka", "npas2"], "info": "Marker locations came from the high-density GBS linkage map anchored to the surface genome. Expression and sequence-variation data are still needed to see which candidates actually differ between morphs.", "concl": "clocka and npas2 matter because the earlier 1.0.2 analysis gave no evidence for core circadian clock genes in Pachón vs surface activity differences."}, {"type": "qa", "section": "Results - eye size QTL mapping", "q": "What eye size QTL was found in F2 population A?", "a": "In group A (n = 188), normalized eye perimeter had QTLs spread across four LGs. The QTL on LG 1 was significant at p < 0.01, and the surface allele looked dominant. LG 1 markers fall on surface chromosome 3, but on separate contigs in 1.0.2.", "kw": ["eye size QTL", "shisa2a", "eya1"], "info": "This region was identified before and contains shisa2a, shisa2b and eya1.", "concl": ""}, {"type": "qa", "section": "Results - eye size QTL mapping", "q": "Which new candidate gene lies between the highest-LOD markers in group A?", "a": "ENSAMXG00000005961, in region 3:9301997-9505868. It is homologous to orofacial cleft 1 (ofcc1), also called ojoplano (opo). In medaka, knocking out opo impairs optic cup folding, giving an abnormal lens and neural retina.", "kw": ["opo", "ofcc1", "ojoplano"], "info": "Pachón and surface opo differ by several coding changes, but none affect evolutionarily conserved residues. Future studies are needed.", "concl": ""}, {"type": "qa", "section": "Results - eye size QTL mapping", "q": "What eye size QTL was found in F2 population B?", "a": "In group B (n = 219), there was a single QTL for normalized left eye diameter on LG 13: LOD 11.98, explaining 24.3% of variance. Cave homozygotes had the smallest eyes and heterozygotes were intermediate. The QTL is a 633 kb region with 22 genes.", "kw": ["eye size QTL", "LG 13"], "info": "The same peak appeared for right eye diameter and when eye phenotype was coded as binary (eyed vs eyeless). None of the earlier Pachón eye size QTL map here. Inconsistency: the text places the region on surface chromosome 13, but Fig. 3h labels it chromosome 20.", "concl": "This is a new eye size QTL."}, {"type": "qa", "section": "Results - eye size QTL mapping", "q": "Why is dusp26 a candidate for eye loss?", "a": "In zebrafish, morpholino knockdown of dusp26 gives small eyes with defective retina development and a less developed lens. There are no dusp26 coding changes among surface, Tinaja, Pachón and Molino fish. However, its expression is reduced in Pachón at 36 hpf (p < 0.05) and 72 hpf (p < 0.01).", "kw": ["dusp26"], "info": "Expression data come from previously published embryonic transcriptomes. The authors say they cannot rule out other genes or regions in the interval.", "concl": ""}, {"type": "qa", "section": "Results - deletion structural variants", "q": "How were deletions identified across populations?", "a": "Population samples from Herman et al. were aligned to Astyanax mexicanus 2.0, and deletions were called with Manta and LUMPY. Only deletions called by both tools were kept and then classified as coding, intronic, regulatory or intergenic.", "kw": ["Manta", "LUMPY", "structural variation"], "info": "LUMPY called more short deletions and Manta fewer long ones, but per-sample call counts correlated well (R2 = 0.78).", "concl": ""}, {"type": "qa", "section": "Results - deletion structural variants", "q": "How do the populations differ in deletions?", "a": "412 genes had deletions with allele frequency above 5%. Molino had the fewest heterozygous deletions and Río Choy surface fish the fewest homozygous ones, mirroring SNP heterozygosity. Tinaja showed the most individual variability (SD 427). Pachón and Tinaja had the most protein-coding genes altered by a deletion, and Río Choy the fewest.", "kw": ["deletions", "heterozygosity"], "info": "Regulatory sequence was defined as 1000 bp up- or downstream of annotated protein-coding genes.", "concl": ""}, {"type": "qa", "section": "Results - deletion structural variants", "q": "What do the per3 and ephx2 examples show?", "a": "Deletions that likely alter these protein-coding genes varied between populations in how common they were, how many bases they removed and whether they were heterozygous or homozygous. per3 is a circadian rhythm gene and ephx2 a cholesterol regulatory gene.", "kw": ["per3", "ephx2"], "info": "Discussion: per3 has low-frequency deletions and ephx2 high-frequency ones. Every sampled Molino fish carries a heterozygous per3 deletion.", "concl": ""}, {"type": "qa", "section": "Results - deletion structural variants", "q": "What pathways are enriched among genes hit by deletions?", "a": "109 of the 412 genes had GO annotation, and WebGestalt found significant enrichment (p < 0.05) for AMPK, Wnt and MAPK signaling (each p = 0.01), metabolism (p = 0.02) and circadian clock (per3, p = 0.05). Disease terms included hypercholesterolemia (ephx2), diabetes mellitus (hnf4a), albinism (oca2) and sialorrhea.", "kw": ["WebGestalt", "AMPK", "hnf4a"], "info": "The enrichment recovered oca2, the known main cause of pigment loss. The authors say these disease and pathway inferences need further validation.", "concl": ""}, {"type": "qa", "section": "Results - hcrtr2 coding changes", "q": "Why look at hcrtr2 in cavefish?", "a": "Hypocretin is a wake-promoting hypothalamic neuropeptide that regulates sleep. It was previously found elevated in Pachón, and blocking hypocretin signaling restores sleep in cavefish. In teleosts, hypocretin signals through a single receptor, Hcrtr2.", "kw": ["hypocretin", "hcrtr2", "sleep loss"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - hcrtr2 coding changes", "q": "What hcrtr2 mutations were found in cavefish?", "a": "Pachón has two missense mutations, S293V and E295K, and E295K is shared with Tinaja. Molino has a 6 bp deletion that removes amino acids 140 and 141 (S140, V141).", "kw": ["hcrtr2", "missense", "Molino"], "info": "The variants were validated by PCR and Sanger sequencing in lab populations. E295K and the Molino deletion affect evolutionarily conserved amino acids.", "concl": ""}, {"type": "qa", "section": "Results - hcrtr2 coding changes", "q": "What effect are the hcrtr2 variants predicted to have on the protein?", "a": "iStable predicted that E295K destabilizes the protein (confidence 0.842) and that S293V stabilizes it (0.772), and MUpro agreed. Homology models in SWISS-MODEL suggest the Molino deletion breaks an alpha helix in the transmembrane region, while the Tinaja and Pachón models differ only slightly from surface.", "kw": ["iStable", "MUpro", "SWISS-MODEL"], "info": "Models were based on the human HCRTR2 crystal structure (PDB 5wqc) and overlaid in VMD. iStable and MUpro cannot handle deletions, which is why the Molino variant was analyzed by modeling. In situ and in vivo protein work is needed to confirm.", "concl": "Coding changes in three cave populations suggest hypocretin signaling is under selection at the receptor level. hcrtr2 is also in the top 5% of FST outliers between Rascon surface fish and Pachón."}, {"type": "qa", "section": "Discussion", "q": "How much better is the surface assembly than the cavefish assembly?", "a": "It has 40-fold fewer assembled contigs (an indirect measure of gaps) and a 71-fold longer contig N50. It shows high synteny with the linkage map and adds 1665 protein-coding genes.", "kw": ["chromonome", "contiguity"], "info": "The authors credit updated long-read and mapping technology.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What limited the contiguity of the surface assembly?", "a": "High heterozygosity in surface fish populations, plus the use of two surface populations for de novo assembly. This prevented sequence connectivity as complete as in genomes like Xiphophorus maculatus, which come from a lab-reared lineage.", "kw": ["heterozygosity", "limitation"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How do the new eye QTL fit with earlier work?", "a": "Earlier multi-QTL models found eight eye size QTL in Pachón, so eye loss probably involves many genes. Here a single-QTL model shifted a known LOD peak just outside the earlier region, revealing opo. A second population gave a new QTL containing dusp26.", "kw": ["single-QTL model", "opo", "dusp26"], "info": "Next steps are to identify regulatory changes linked to these candidates.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why do structural variants matter for adaptation, and what are the limits of this study?", "a": "SVs are a significant source of standing variation, and studies in some teleosts show they outnumber single-nucleotide variants. This is the first study of cavefish SVs, but it only looked at deletions.", "kw": ["structural variation", "standing variation"], "info": "Example cited: rampant copy number variation during population differentiation in stickleback. Some disrupted genes fit cave phenotypes, while others are of unknown significance (e.g., sms, beta-alanine metabolism).", "concl": "A catalog of thousands of cave population deletions awaits investigation and validation."}, {"type": "qa", "section": "Discussion", "q": "What future work do the authors propose?", "a": "Genome-wide analysis of GPCR differences between surface fish and cavefish, combined with allele-swapping functional studies. Also, better assemblies of both cave and surface genomes to understand the population-genetic processes behind cave colonization.", "kw": ["GPCR", "allele swapping"], "info": "Shared synteny with zebrafish, proven gene editing and interbreeding should help reveal both genic and regulatory contributions to troglomorphic traits.", "concl": ""}, {"type": "qa", "section": "Methods - genome sequencing and assembly", "q": "How was the assembly built and error-corrected?", "a": "HMW DNA was extracted with the Qiagen MagAttract kit. The assembly used wtdbg (fuzzy de Bruijn graph), then indel-dominated base errors were corrected by mapping raw reads with minimap2. Pilon with default settings and about 60x of Illumina PCR-free 150 bp reads from Asty152 then corrected homozygous indels and single-base errors.", "kw": ["wtdbg2", "minimap2", "Pilon"], "info": "SMRT data: NCBI BioProject PRJNA533584. The Data availability section gives PRJNA89115 for the raw and final assembly data.", "concl": ""}, {"type": "qa", "section": "Methods - genome sequencing and assembly", "q": "How was the BioNano optical map made?", "a": "A BioNano Irys restriction map was made from another surface fish, Asty168, the offspring of a Río Valles fish (Asty02) and a Río Sabinas fish (Asty04). It was used to order and orient contigs and to find possible misassemblies.", "kw": ["BioNano Irys", "optical map"], "info": "Nicked sites were labeled with Alexa Fluor 546 and DNA was counterstained with YOYO-1. Fragments over 150 kbp were assembled into a whole-genome optical map with BioNano's proprietary algorithm.", "concl": ""}, {"type": "qa", "section": "Methods - genome sequencing and assembly", "q": "What is a chromonome, and which tool builds it?", "a": "Chromonomer aligns scaffolds to the high-density linkage map. It picks the best set of nonconflicting markers that places the most scaffolds while minimizing ordering discrepancies. Its FASTA output, giving scaffold locations by chromosome, is called a chromonome.", "kw": ["Chromonomer", "chromonome"], "info": "Run with default parameters after chimeric contig correction and BioNano scaffolding.", "concl": ""}, {"type": "qa", "section": "Methods - genome sequencing and assembly", "q": "How were syntenic regions between the cave and surface assemblies defined?", "a": "2235 GBS markers were mapped to 1.0.2 with the Ensembl BLAST/BLAT web tool and to 2.0 with Magic-BLAST v1.3.0. Marker positions were visualized with Circos.", "kw": ["Magic-BLAST", "Circos", "GBS markers"], "info": "Chromonome errors found through these synteny alignments were corrected by hand where orthologous data (e.g., 1.0.2 scaffold alignments) were available. Assembly-to-assembly coordinates are in Supplementary Data 1.", "concl": ""}, {"type": "qa", "section": "Methods - genome sequencing and assembly", "q": "How was reference bias assessed with population samples?", "a": "100 bp resequencing reads from Herman et al. were aligned to both references. RepeatMasker and WindowMasker repeat BED files were intersected with BEDTools v2.27.1, and alignments were filtered and summarized with SAMtools 1.9.", "kw": ["BEDTools", "SAMtools", "RepeatMasker"], "info": "Plots were made in R 3.6. Annotation followed the NCBI RefSeq and Ensembl release 98 pipelines with RNA-seq evidence from cave and surface tissues.", "concl": ""}, {"type": "qa", "section": "Methods - genetic mapping", "q": "How was QTL mapping done in the two surface x Pachón F2 populations?", "a": "R/qtl v1.44-9 in R v3.5.3, with scanone using a binary model for albinism and a normal model for normalized eye size. Significance was the 95th percentile of 1000 permutations, and confidence intervals were 1.5-LOD support intervals (lodint). Marker sequences were aligned to both references with Bowtie v2.2.6 in sensitive mode.", "kw": ["R/qtl", "scanone", "Bowtie"], "info": "Fig. 3 uses Haley-Knott regression. Group A: 188 F2 fish from an earlier study, eye perimeter divided by body length, measured in ImageJ. Group B: 219 F2 fish from three clutches of paired F1 siblings, eye diameter normalized to standard length (length correlated with eye diameter). Eyeless fish were excluded (21/195 left, 22/172 right).", "concl": ""}, {"type": "qa", "section": "Methods - genetic mapping", "q": "How was the database of published QTL built for the surface genome?", "a": "Markers from earlier QTL studies were placed by BLAST, taking the top hit ranked by e-value, then bitscore, then alignment length. Genes inside the regions were pulled out with BEDTools intersect and the surface annotation.", "kw": ["QTL database", "BEDTools intersect"], "info": "Genes were called candidates only because they lie in the QTL confidence interval. A gene with no known relevant function was not excluded.", "concl": ""}, {"type": "qa", "section": "Methods - rx3 functional work", "q": "How were rx3 crispants made and phenotyped?", "a": "A gRNA against exon 2 (5'-GTGTAGCTGAAACGTGGTGA-3') was made with T7 Megascript, and nls-Cas9-nls mRNA with mMessage mMACHINE T3. Single-cell embryos were injected with 25 pg gRNA and 150 pg Cas9 mRNA (about 1 nl). Mutagenesis was checked by PCR and gel electrophoresis.", "kw": ["CRISPR/Cas9", "gRNA", "rx3"], "info": "Adult eye size: crispants vs uninjected siblings, n = 5 each. Larvae at 6 dpf: crispants vs Cas9-only vs uninjected, n = 10 each, measured in Fiji and corrected for standard length; ANOVA with Tukey post hoc test in GraphPad Prism. In situ: DIG-labeled full-length rx3 probe, 65% formamide at 65 C, area measured in NIS Elements F 2.30.", "concl": ""}, {"type": "qa", "section": "Methods - SV detection", "q": "What was the SV calling pipeline, and what filters were used?", "a": "Reads were aligned with BWA-MEM v0.7.17 and processed with SAMtools v1.9 (view, fixmate -m, sort, markdup -r). Calls came from manta v1.6.0 and from lumpy via smoove v0.2.3. Because coverage was low (about 9x per sample), only deletions called by both tools, with 50% reciprocal overlap, in the 500-100 kb size range were kept.", "kw": ["BWA-MEM", "smoove", "Nextflow"], "info": "The size range is written as '500-100 kb', presumably 500 bp to 100 kb, but the paper does not say. Enrichment: WebGestalt with zebrafish protein-coding genes as reference; KEGG, Panther, OMIM and DisGeNET; hypergeometric test with Benjamini-Hochberg correction. Workflows were run in Nextflow.", "concl": ""}, {"type": "note", "section": "Results - eye size QTL mapping", "text": "Check the group B eye size QTL location: the text says surface chromosome 13 (633 kb, 22 genes), but Fig. 3h labels it chromosome 20. Look in Supplementary Table 4 and 6."}, {"type": "note", "section": "Results - eye size QTL mapping", "text": "Which regulatory changes reduce rx3 (recessive, restored in F1) and dusp26 expression in Pachón, given that neither gene has coding changes?"}, {"type": "note", "section": "Results - hcrtr2 coding changes", "text": "Do the hcrtr2 variants (destabilizing E295K, stabilizing S293V, helix-breaking Molino deletion) really change receptor function in different ways in vivo? This remains untested beyond in silico predictions."}], "key": "amexicanus/Warren_2021_NatCommun_surface_fish_genome", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Roback_2026", "title": "A pangenome framework uncovers the role of deletions in repeated evolution of cave-derived traits", "category": "Genomes & structural variation", "link": "https://doi.org/10.1101/gr.281719.125", "note": "", "source_pdf": "papers/amexicanus/Roback_2026_GenomeRes_pangenome_deletions_cave_traits.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What gap does this paper address?", "a": "Structural variants (SVs) are increasingly seen as drivers of adaptation, but they have been studied much less than single-nucleotide variation. The authors ask how large-scale genomic changes shape repeated evolution of cave traits in Astyanax mexicanus.", "kw": ["structural variants", "repeated evolution"], "info": "They built one of the first pangenome graphs from a naturally evolving vertebrate and used it to find SVs in 120 fish from 11 populations.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What are the main findings in the abstract?", "a": "More than 2400 high-confidence cave-specific deletions are enriched in pathways for vision, metabolism and behavior, and they cluster nonrandomly in QTL for cavefish traits. In 67 genes, each independent cave lineage has its own different deletion. 99% of these reused genes contain selective sweeps, compared with 8% to 15% of genes without SVs.", "kw": ["deletions", "QTL", "selective sweeps"], "info": "", "concl": "Deletions probably rose in frequency through repeated positive selection rather than drift. Recurrent deletions have repeatedly contributed to cave-adapted phenotypes."}, {"type": "qa", "section": "Introduction", "q": "How are SVs defined?", "a": "SVs are sequence variants of 50 bp or more. They include inversions, translocations, duplications or insertions of novel sequence, and deletions.", "kw": ["structural variants"], "info": "Because they are large and abundant, SVs account for much more sequence variation than SNPs. SVs matter under strong selection, for example high-elevation hypoxia and domestication. Convergent SVs are known in sheep and goats and in ragweed.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Can loss-of-function SVs like deletions be adaptive?", "a": "Yes. Deletions are generally assumed to be deleterious, but they can create evolutionary novelties such as protection against disease, and they can contribute to adaptation.", "kw": ["loss of function", "deletions"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why have SVs been hard to study at the population level?", "a": "SVs are large and complex, short-read sequencing has limits, and detection sensitivity is reduced. Together these have made genome-wide discovery and genotyping of SVs across populations difficult.", "kw": ["short reads"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is a pangenome and why use one for SVs?", "a": "A pangenome is an alignment of several contiguous whole-genome assemblies that captures more of the diversity within a species. Compared with a linear reference, it allows SVs to be genotyped from short reads and reduces false negatives when discovering polymorphic SV alleles.", "kw": ["pangenome graph"], "info": "First conceptualized by Tettelin et al. 2005. Pangenomes exist mostly for agricultural species. Only a few exist for wild populations, for example Heliconius butterflies (SVs linked to nervous system development) and the house finch (disease resistance).", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is A. mexicanus a good system for studying repeated evolution?", "a": "It has colonized caves independently at least twice, which produced two lineages (lineage 1 and lineage 2), each with surface and cave populations. Cave populations probably diverged fewer than 200,000 generations ago and still exchange genes with surface fish and with other caves.", "kw": ["Astyanax mexicanus", "lineages"], "info": "Phenotypic adaptation to dark, resource-poor caves has proceeded similarly across cave populations, even though the caves differ somewhat in ecology.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which cave-derived traits are relevant here, and what was already known about their genetics?", "a": "Cavefish have lost eyes and pigment, cannot regenerate heart tissue normally after injury, have altered metabolism, and behave differently (no schooling, reduced aggression, hyperphagia). Before this study only a few causal SNPs were known: missense mutations in mc4r (appetite) and insra (insulin signaling), and a premature termination codon in pde6c (vision).", "kw": ["mc4r", "insra", "pde6c"], "info": "The main structural variant known before this study was the set of different oca2 deletions in the two lineages, linked to depigmentation and sleep loss (from the Discussion).", "concl": "There is a substantial gap in understanding the genetic basis of repeated cave evolution, which this paper addresses with SVs."}, {"type": "qa", "section": "Results - Overview of study design", "q": "Which samples and data types were used?", "a": "They used 120 A. mexicanus genomes from 4 surface and 7 cave populations: 56 in lineage 1 and 64 in lineage 2. The data are 4 reference assemblies (Río Choy surface; Molino, Pachón and Tinaja caves), short-read WGS from 107 fish, and linked-read WGS from 9 individuals.", "kw": ["WGS", "linked reads"], "info": "Lineage 1: Río Choy, Mante and Jalpan (surface); Molino, Escondido and Vásquez (cave). Lineage 2: Rascón (surface); Pachón, Japones, Tigre and Tinaja (cave). The 107 short-read samples are 19 surface and 31 cave fish in lineage 1, and 12 surface and 45 cave fish in lineage 2.", "concl": ""}, {"type": "qa", "section": "Results - Overview of study design", "q": "What do the terms pangenome SVs, PGsr, focal deletions and control genes mean?", "a": "Pangenome SVs are insertions and deletions found in the graph built from the 4 assemblies. PGsr (pangenome plus short-read WGS) is the genotype data set from mapping short reads to the graph. Focal deletions are cave-associated deletions that were called by both methods, are absent from all sampled surface fish, and reach an allele frequency of at least 0.8 in a cave.", "kw": ["PGsr", "focal deletions"], "info": "Control genes have no SV insertions or deletions anywhere in the gene structure in any population in the pangenome. All further analyses focus only on deletions.", "concl": ""}, {"type": "qa", "section": "Results - Pangenome graph construction", "q": "How large is the pangenome graph?", "a": "The graph has 52,571,860 nodes and 72,140,066 edges. The three cave genomes added about 400 Mbp of non-surface sequence: 176 Mbp from Tinaja, 131 Mbp from Molino and 94 Mbp from Pachón.", "kw": ["pangenome graph"], "info": "The number of new nonreference nodes did not plateau, so adding more genomes would keep growing the graph. Río Choy surface is the reference frame, so all variation and coordinates are relative to Río Choy.", "concl": ""}, {"type": "qa", "section": "Results - Characteristics of pangenome SVs", "q": "How many indel and SV sites were found in the pangenome?", "a": "Among top-level variants (LV = 0) on chromosomes, there were 1,100,450 sites with 1 bp indels, 1,359,534 with small insertions, 1,489,289 with small deletions, 236,786 with SV insertions and 216,339 with SV deletions. Because some sites are multiallelic, these correspond to 338,631 unique SV insertion alleles and 255,331 unique SV deletion alleles.", "kw": ["indels", "multiallelic sites"], "info": "Small means under 50 bp. SVs are 50 bp to 100,000 bp. 80.31% of SV insertions and deletions are 1 kb or shorter. SV alleles are shared more often within a lineage than between lineages.", "concl": ""}, {"type": "qa", "section": "Results - Characteristics of pangenome SVs", "q": "How much sequence do SVs affect per cave genome?", "a": "Insertion alleles add up to an average of 138 Mbp per cave morph and deletion alleles to 106 Mbp. Lineage 2 genomes (Pachón, Tinaja) have more base pairs affected, probably because the Río Choy reference belongs to lineage 1 and is closer to Molino.", "kw": ["reference bias"], "info": "That insertions cover more base pairs than deletions matches subterranean isopods, decapods and mollusks, which have larger genomes than their surface relatives.", "concl": ""}, {"type": "qa", "section": "Results - Characteristics of pangenome SVs", "q": "How common are duplications and translocations between the four assemblies?", "a": "Each pairwise comparison gave about 1000 to 2300 calls for both duplications and translocations, far fewer than insertions and deletions. The Pachón vs Tinaja comparison had fewer of them (1027 translocations, 1366 duplications) than either compared with Molino.", "kw": ["SyRI", "duplications", "translocations"], "info": "This fits other within-species studies, where indels outnumber translocations and duplications by more than two orders of magnitude.", "concl": "Pachón and Tinaja (same lineage) are structurally more similar to each other than to Molino."}, {"type": "qa", "section": "Results - Characteristics of pangenome SVs", "q": "How many genes carry SVs, and does gene length matter?", "a": "Of 26,736 protein-coding genes, 18,016 (67%) have SV deletions and 17,715 (66%) have SV insertions in an intron, exon or UTR. Median gene length is 4847 bp for genes without SVs, 6538 bp with insertions, 7177 bp with deletions and 23,880 bp with both.", "kw": ["gene length", "mutational target"], "info": "All groups differ (Wilcoxon rank-sum, all P < 0.01, average Cohen's d = 0.33). The fraction of each gene deleted is bimodal: most genes lose 25% or less, but a notable group is deleted completely.", "concl": ""}, {"type": "qa", "section": "Results - Characteristics of pangenome SVs", "q": "Where in the genome do SVs fall compared with random placement?", "a": "50.85% of SV deletions and 41.55% of SV insertions are in introns. In permutation tests, both overlap CDS less often than random (P < 0.005) and introns more often than random (deletions P = 0.04, insertions P < 0.005). Intergenic regions have more insertions and fewer deletions than expected (P < 0.005).", "kw": ["permutation test", "negative selection"], "info": "SV deletions hit exons of 2397 protein-coding genes and SV insertions hit exons of 1332. Insertions are much more overrepresented in introns than deletions are.", "concl": "Negative selection probably removes SVs from coding regions."}, {"type": "qa", "section": "Results - Characteristics of pangenome SVs", "q": "What are the cave SV insertions made of?", "a": "On average 78.6% of insertion sequence is repetitive. The largest contributors are retroelements (30.7%, of which 21.3% are LTR elements) and DNA transposons (19.3%).", "kw": ["transposable elements", "RepeatMasker"], "info": "Transposable elements tend to land in noncoding regions, especially introns and gene flanks. This may explain why insertions are more overrepresented than deletions in introns and intergenic regions.", "concl": ""}, {"type": "qa", "section": "Results - Characteristics of pangenome SVs", "q": "What share of predicted high-impact variants are SVs?", "a": "According to SnpEff, SV deletions make up 30.92% of all high-impact variants and SV insertions 10.65%.", "kw": ["SnpEff"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - Linked-read deletions", "q": "How does linked-read SV calling compare with the pangenome?", "a": "Linked reads aligned to the linear Río Choy reference gave fewer deletion calls. The pangenome found about 1.7 times more deletions in Molino and 1.5 times more in Pachón and Tinaja.", "kw": ["linked reads", "linear reference"], "info": "Linked reads give an independent deletion call set that does not use the graph. It is used later as a consensus filter.", "concl": "SV detection is more sensitive with a pangenome graph than with a linear reference."}, {"type": "qa", "section": "Results - Linked-read deletions", "q": "Which populations had the fewest and most deletions in the linked-read data?", "a": "Jalpan, the lineage 1 surface population closest to Río Choy, had the fewest (75,975). Rascón, the lineage 2 surface population, had the most (94,619), which reflects the deepest divergence in A. mexicanus, between lineage 1 and lineage 2.", "kw": ["Jalpan", "Rascón"], "info": "Even surface fish of the same lineage and ecotype differ by nearly 76,000 deletions. Deletions counted as shared needed 90% reciprocal overlap and were shared more often within lineages than between them, consistent with at least two cave lineages.", "concl": "Surface populations from different lineages differ a lot structurally, not only in SNP-based measures such as DXY."}, {"type": "qa", "section": "Results - Focal deletions", "q": "How were deletions genotyped across populations?", "a": "107 short-read WGS samples from nine populations were mapped to the pangenome and genotyped, giving 279,995 PGsr deletions.", "kw": ["vg giraffe", "genotyping"], "info": "This only genotypes SVs already in the graph and does not discover new variants in the WGS data, so there are probably many false negatives. The data set is not an exhaustive list of A. mexicanus SVs.", "concl": ""}, {"type": "qa", "section": "Results - Focal deletions", "q": "How did they find deletions associated with the cave morph?", "a": "They ran SnpSift CaseControl separately for each lineage: allelic model, Fisher's exact test, Holm-Bonferroni correction, cave fish as cases and surface fish as controls. This gave 23,032 cave-associated deletions in lineage 1 and 6606 in lineage 2 (adjusted P < 0.05). Of these, 14,050 (lineage 1) and 5246 (lineage 2) were supported by linked-read calls.", "kw": ["SnpSift CaseControl", "Fisher's exact test"], "info": "Controls were Río Choy and Mante for lineage 1 and Rascón for lineage 2. The authors attribute the lower lineage 2 count to SnpSift artifacts rather than truly fewer deletions (see Methods).", "concl": ""}, {"type": "qa", "section": "Results - Focal deletions", "q": "Are cave-associated deletions present as standing variation in surface fish?", "a": "In lineage 1, 3437 linked-read-supported cave-associated deletions (24%) are minor alleles in Río Choy and/or Mante (mean deletion frequency 0.11 and 0.10). In lineage 2, 3222 (61%) are minor alleles in Rascón (mean 0.09).", "kw": ["standing genetic variation"], "info": "A minor allele here means a surface frequency above 0 and at most 0.2. The lower lineage 1 share is probably an artifact of the reference: a deletion carried by the Río Choy reference genome cannot be called.", "concl": ""}, {"type": "qa", "section": "Results - Focal deletions", "q": "How was the final set of focal deletions defined, and how many are there?", "a": "Cave-associated deletions from both lineages were combined. Any deletion present at any frequency in any sampled surface population was removed, and a deletion frequency of at least 0.8 in at least one cave was required. This left 2431 unique focal deletions.", "kw": ["focal deletions"], "info": "73% of lineage 1 focal deletions and 79% of lineage 2 focal deletions are unique to their lineage. 99% and 97% of these unique deletions occur in two or more caves of that lineage. About 26% are shared between lineages, which could reflect introgression, standing variation not sampled in surface fish, or similar de novo mutations.", "concl": "The 2431 focal deletions are strong candidates for contributing to cave-derived phenotypes."}, {"type": "note", "section": "Results - Focal deletions", "text": "About 26% of focal deletions are shared between lineages. The paper leaves open whether this comes from introgression between caves, surface standing variation that was not sampled, or similar de novo mutations."}, {"type": "qa", "section": "Results - Characteristics of focal deletions", "q": "What do focal deletions look like in size and location?", "a": "96% are 1 kb or shorter (mean 202 bp, median 80 bp). Only 14 fall in exons, fewer than expected (permutation P < 0.003). They are not over- or underrepresented in introns (P = 0.303) or intergenic regions (P = 0.376).", "kw": ["purifying selection"], "info": "For the 1530 focal deletions inside protein-coding genes, start positions along the gene follow a uniform distribution (chi-squared X = 9.098, df = 9, P = 0.4283).", "concl": "Purifying selection removes deletions from coding regions. Focal deletions are not concentrated at particular positions along genes."}, {"type": "qa", "section": "Results - Characteristics of focal deletions", "q": "Are focal deletions associated with mutagenic TG repeats, as in the stickleback pelvic enhancer?", "a": "Only a few are: 6 deletions in lineage 1 and 4 in lineage 2 contain a TG repeat of 20 bp or more (TG10+), and none of them are shared between lineages or overlap. One notable case is a 1410 bp deletion at a 54 bp TG repeat (TG27), fixed in Molino and Escondido, starting 5413 bp upstream of ptprdb.", "kw": ["TG repeats", "ptprdb"], "info": "In humans, ptprdb is associated with diabetes risk and insulin resistance.", "concl": ""}, {"type": "qa", "section": "Results - Characteristics of focal deletions", "q": "How often is the same deletion or the same gene hit in both lineages?", "a": "Only 13 focal deletions are significantly cave-associated in both lineages. However, 67 protein-coding genes carry focal deletions at different positions in each lineage (gene reuse). These reuse genes are about three times longer than other genes with focal deletions (median 231,341 vs 74,387 bp, Wilcoxon P < 0.0001).", "kw": ["gene reuse", "mutational target size"], "info": "", "concl": "Genomic biases such as gene length influence which genes are hit repeatedly in independent bouts of evolution."}, {"type": "qa", "section": "Results - Functional impacts of focal deletions", "q": "Which pathways are enriched among genes with focal deletions?", "a": "Ingenuity pathway analysis (IPA) found 224 enriched pathways in lineage 1 and 6 in lineage 2 (Benjamini-Hochberg adjusted P < 0.05). All 6 lineage 2 pathways were also enriched in lineage 1: RHO GTPase cycle, autism signaling, synaptic adhesion-like molecules, ROBO SLIT signaling, GABAergic receptor signaling (enhanced), and neurexins and neuroligins.", "kw": ["IPA", "pathway enrichment"], "info": "Lineage 2 has fewer pathways because it had fewer cave-associated deletions to start with. Genes with deletions within 5 kb upstream gave 4 pathways in lineage 1 and 1 in lineage 2, none shared. Genes with deletions within 5 kb downstream gave none. Enriched pathways relate to metabolism, eyes, heart and behavior.", "concl": "Within shared pathways, mostly different genes carry deletions in each lineage, so convergence is at the pathway level rather than the gene level."}, {"type": "qa", "section": "Results - Functional impacts of focal deletions", "q": "Do fixed focal deletions affect gene expression in Pachón?", "a": "They used 155 deletions fixed in Pachón (FST = 1 vs Río Choy), which affect 134 genes in the gene body or within 5 kb up- or downstream. Compared with control genes, these genes were not more likely to be differentially expressed in 54 hpf eyes or liver. They were more likely to be differentially expressed in heart at 7 days after injury (Fisher's exact P < 0.05), but not at 3 or 14 days.", "kw": ["RNA-seq", "differential expression", "heart regeneration"], "info": "A hypergeometric test gave the same pattern. The authors suggest that multiple time points capture dynamic expression that single time-point data (liver, eye) miss.", "concl": ""}, {"type": "qa", "section": "Results - Functional impacts of focal deletions", "q": "How many genes with fixed deletions are differentially expressed in each tissue?", "a": "Of the 134 genes, 20 are differentially expressed in eye, 30 in liver and 33 in heart (all time points), and 14 in more than one tissue. 85% of the differentially expressed deletion genes in eye are downregulated in cavefish.", "kw": ["downregulation"], "info": "WGS genotypes and RNA-seq do not come from the same individuals, which is why only fixed deletions were used.", "concl": "A subset of deletions probably affects expression and therefore cave phenotypes."}, {"type": "qa", "section": "Results - Functional impacts of focal deletions", "q": "Are focal deletions enriched in QTL for cave traits?", "a": "Yes. Of the 155 deletions fixed in Pachón, 98 lie inside Pachón QTL regions, more than expected by chance (permutation P < 0.005). This is also more than expected from the background rate of Pachón pangenome deletions in QTL (Fisher's exact P < 0.0005).", "kw": ["QTL", "permutation test"], "info": "QTL from Pachón x Río Choy crosses, mapped to the Río Choy reference by Wiese et al. 2024. Examples are reduced pigmentation and expanded taste buds.", "concl": "Focal deletions are enriched in regions linked to cave-derived traits, which supports a role in their genetic basis."}, {"type": "qa", "section": "Results - Selection", "q": "How did they test whether genes with deletions are under selection?", "a": "They called selective sweeps in 5 kb windows with diploS/HIC in Molino, Pachón and Tinaja. A gene counted as under selection in a population if at least one window had a hard or soft sweep call, and the deletion and the sweep had to occur in the same population.", "kw": ["diploS/HIC", "selective sweeps"], "info": "Three gene sets were compared. PG genes (n = 16,617) have pangenome deletions not associated with caves. Focal genes (n = 1260) have focal deletions. Reuse genes (n = 67) have different focal deletions in each lineage. Each gene goes into its highest category.", "concl": ""}, {"type": "qa", "section": "Results - Selection", "q": "What fraction of each gene set shows evidence of selection?", "a": "53% of PG genes, 62% of focal genes and 99% of reuse genes (pairwise chi-squared, all P < 0.0001). For control genes without SVs (n = 5265), only 8% in Molino, 9% in Pachón and 15% in Tinaja.", "kw": ["gene reuse", "control genes"], "info": "Caveat: this shows that a deletion and a sweep co-occur in a gene in the same population, not that selection acted on the deletion itself.", "concl": "Genes with cave-associated deletions, especially reused genes, are much more likely to show population-specific selection. This supports a role for deletions in cave adaptation."}, {"type": "qa", "section": "Discussion", "q": "Why is gene reuse with different deletions in each lineage notable?", "a": "There are often many mutational routes to the same phenotype, which makes reuse of the same gene unlikely. Finding it suggests constraints on evolutionary paths and/or especially advantageous changes at certain loci. Since 99% of reuse genes have sweeps vs 8% to 15% of control genes, the pattern is unlikely to come from chance or relaxed constraint.", "kw": ["genotypic redundancy", "drift vs selection"], "info": "Since Darwin, loss-of-function traits in cave animals have often been attributed to drift and disuse. Earlier genomic work in Astyanax showed that selection also plays a role.", "concl": "High-frequency deletions in the same genes in both lineages likely reflect repeated selection in cave populations."}, {"type": "qa", "section": "Discussion", "q": "Why is pcsk2 a strong candidate?", "a": "pcsk2 has different deletions in the two lineages: an 81 bp deletion in the fifth of 11 introns in lineage 2 and a 59 bp deletion in the last intron in lineage 1. It also shows evidence of selection. Reduced PCSK2 (PC2) is implicated in Prader-Willi syndrome (insatiable hunger, often abnormal eyesight), and Pcsk2-null mice have impaired insulin and glucagon processing.", "kw": ["pcsk2", "Prader-Willi syndrome"], "info": "Possible inconsistency: Fig. 6A seems to label the 81 bp deletion as lineage 1 (Molino, Escondido, Vásquez) and the 59 bp deletion as lineage 2 (Pachón, Tinaja, Tigre), the opposite of the text. Check the supplement.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why is ksr2 a strong candidate?", "a": "ksr2 has three focal deletions: 67 bp in the first of 22 introns (lineage 2), 57 bp in the sixth intron (lineage 1) and 66 bp in the penultimate intron (lineage 2). Ksr2 knockout mice are obese and glucose intolerant and show hyperphagia that does not respond to leptin. They are more obese and glucose intolerant than Mc4r knockouts.", "kw": ["ksr2", "hyperphagia", "insulin resistance"], "info": "Human KSR2 lies in a region associated with obesity and type 2 diabetes. These phenotypes match cavefish traits: weight maintenance under starvation, hyperphagia, extra visceral fat, insulin resistance and high blood glucose.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What might drive gene reuse besides selection?", "a": "Repeated, similar environmental pressures, as seen in stickleback pelvic loss, Poeciliidae in hydrogen sulfide springs and high-altitude waterfowl. Genomic biases such as gene length also play a role, since reuse genes are three times longer.", "kw": ["convergence", "gene length"], "info": "Differences in methods, timescales and selection strength limit comparisons with other pangenome studies of local adaptation.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What is the ndst1b example?", "a": "ndst1b is one of 14 genes with focal deletions that are differentially expressed in several tissues, which suggests pleiotropy. It has a lineage 2 deletion in its second intron, is downregulated in cavefish eye, liver and heart, and lies in Pachón QTL for eye size, dentition and body condition.", "kw": ["ndst1b", "neural crest", "pleiotropy"], "info": "Knockdown in zebrafish and mice alters neural crest development: craniofacial and eye defects, shorter body and pectoral fins, and changed chromatophore distribution. The intronic location and downregulation suggest a possible regulatory effect.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What lines of evidence support a role for deletions in cave phenotypes?", "a": "Fixed deletions fall nonrandomly within cave-trait QTL. Focal deletions affect genes with known roles in cave-like traits. Focal deletions are enriched in relevant pathways (for example circadian rhythm, melatonin, insulin secretion, phototransduction and cardiac hypertrophy signaling). In addition, genes with deletions more often carry selection signatures than control genes.", "kw": ["convergence"], "info": "The authors propose transgenesis and gene editing to test candidate deletions functionally.", "concl": "Deletions may contribute to adaptive trait evolution and enable convergent solutions to similar ecological challenges."}, {"type": "note", "section": "Discussion", "text": "Functional tests are still needed. Do the intronic deletions in pcsk2, ksr2 and ndst1b actually change expression or regulation? CRISPR or transgenic tests in surface fish would show this."}, {"type": "qa", "section": "Methods - Pangenome construction and genotyping", "q": "How was the pangenome built and postprocessed?", "a": "They ran Minigraph-Cactus (cactus v2.4.2 Docker image) on autosomal sequences of AstMex3_surface (Río Choy), AstMex3_Molino, AstMex3_Tinaja and AMEX_1.1 (Pachón), with Río Choy as the reference. The VCF was restricted to top-level variants (vcfbub -l 0) and then to lines where at least one cave assembly carried an alternate allele.", "kw": ["Minigraph-Cactus", "vcfbub"], "info": "They did not left-align with BCFtools norm because it gave variants new coordinates that were incompatible with the HAL, GFA and VG formats and with each other. Because the assemblies are haploid, each pangenome genotype is a single allele (1 instead of 1/1). Variants on unplaced scaffolds were excluded from summary statistics.", "concl": ""}, {"type": "qa", "section": "Methods - Pangenome construction and genotyping", "q": "How were variant types classified and short reads genotyped?", "a": "After multiallelic sites were split, variants were classified by REF and ALT length: SVs are 50 bp to 100 kbp, insertions above 100 kbp are large structural insertions, and small indels are 2 to 49 bp. Short reads were mapped with vg giraffe (defaults) and surjected to BAM against the surface genome with vg surject.", "kw": ["vg giraffe", "vg surject"], "info": "Only SVs from 50 bp to 100 kbp were kept for downstream analyses.", "concl": ""}, {"type": "qa", "section": "Methods - Repeats, rearrangements and annotation", "q": "Which tools were used for repeats, rearrangements and functional annotation?", "a": "Repeat libraries were built with RepeatModeler 2.0.4 (-LTRStruct) for each assembly, and insertion sequences were masked with RepeatMasker v4.1.7-p1. Duplications and translocations came from SyRI v1.6 with default parameters. Variant effects were annotated with SnpEff 5.2a using a database built from the AstMex3_surface NCBI GTF.", "kw": ["RepeatModeler", "SyRI", "SnpEff"], "info": "Custom SnpEff interval annotations added population-specific sweeps, QTL from Wiese et al. 2024 and CDS IDs. Duplication counts include tandem and interspersed duplications but not tandem repeats.", "concl": ""}, {"type": "qa", "section": "Methods - Linked reads", "q": "How were linked-read SVs called?", "a": "10x Genomics linked reads from 9 individuals (Jalpan and Rascón surface fish; Escondido, Molino, Japones, Pachón, Tigre, Tinaja and Vásquez cave fish) were processed with Long Ranger v2.2.2 (mkfastq, mkref on GCF_023375975.1, wgs mode). Only SVs of 50 bp to 100 kb that passed all filters were kept.", "kw": ["Long Ranger", "10x Genomics"], "info": "Long Ranger filters use barcode and phasing information to reduce false positives. Deletions were counted as shared between populations with BEDTools intersect at 90% or more reciprocal overlap.", "concl": ""}, {"type": "qa", "section": "Methods - Cave candidate deletions", "q": "How were high-confidence cave-specific deletions filtered?", "a": "SnpSift CaseControl v5.2 was run per lineage, and P-values were Holm-Bonferroni corrected (pysam 0.22.1, statsmodels 0.14.0, adjusted P < 0.05). A PGsr deletion had to overlap a linked-read deletion from a cave fish of the same lineage by at least 50% reciprocally. Deletions overlapping linked-read surface calls (Jalpan or Rascón) by 50% or more were removed, and the ALT frequency had to be zero in all surface populations.", "kw": ["SnpSift", "reciprocal overlap", "Holm-Bonferroni"], "info": "Lineage 2 likely has fewer hits because of lower power (12 controls and 45 cases vs 19 controls and 31 cases in lineage 1). Another reason is a reference artifact: SnpSift excludes multiallelic sites where Rascón carries an alternate allele, because no reference genotype exists in the controls. The known oca2 deletions are in the PGsr data but are not significant because of low genotype coverage.", "concl": ""}, {"type": "note", "section": "Methods - Cave candidate deletions", "text": "The well-known oca2 deletions did not pass the significance threshold because of low coverage. Lineage 2 is probably underdetected because of the lineage 1 reference and few Rascón controls. How many real cave deletions are missing from the 2431 focal set?"}, {"type": "qa", "section": "Methods - Selective sweeps", "q": "How was diploS/HIC set up?", "a": "SNPs were genotyped against Río Choy with GATK v4.4.0 GenotypeGVCFs for Río Choy, Rascón, Molino, Pachón and Tinaja. SNPs within indels or a 3 bp buffer were removed, SNPs were hard-filtered following GATK best practices, and repeats were masked with NCBI WindowMasker. Neutral, hard-sweep and soft-sweep data were simulated with discoal under separate surface and cave demographic models (from Moran et al. 2023) to train the network.", "kw": ["diploS/HIC", "discoal", "GATK"], "info": "The cave model includes a harsh bottleneck at colonization, which reduces false sweep calls caused by low diversity after a bottleneck. Hard and soft sweeps were grouped because diploS/HIC separates them poorly. Only windows with consistent calls after swapping the demographic models were kept.", "concl": ""}, {"type": "qa", "section": "Methods - Permutation tests", "q": "How did the permutation tests work?", "a": "A custom script placed SVs at random positions within the chromosome lengths and created 300 permuted VCFs, which were then annotated with SnpEff. Observed overlaps with CDS, introns, intergenic regions, QTL and sweeps were compared with this random distribution.", "kw": ["permutation test"], "info": "Fisher's exact test compared focal deletions with all population-specific pangenome deletions.", "concl": ""}, {"type": "qa", "section": "Methods - Orthology and pathway analysis", "q": "How were orthologs found and pathway analysis run?", "a": "Human orthologs were inferred with OrthoFinder v3.0.1b1 from NCBI gene predictions. Only genes with single-copy human orthologs (1:1 and multi:1) went into IPA, run separately for gene-body, 5 kb upstream and 5 kb downstream deletion sets in each lineage (six runs; BH adjusted P < 0.05).", "kw": ["OrthoFinder", "IPA"], "info": "Caveat: several Astyanax genes can map to the same human ortholog. This can falsely suggest that the same gene is affected in both lineages and inflates apparent pathway overlap.", "concl": ""}, {"type": "qa", "section": "Methods - Gene expression", "q": "How was the expression analysis done?", "a": "Published Pachón vs Río Choy RNA-seq (liver, injured heart at 3, 7 and 14 days, 54 hpf eye) was mapped with STAR v2.7.11b (quantMode, no trimming) to the Amex 3.0 NCBI annotation and analyzed with DESeq2 (adjusted P < 0.05). Fixed deletions were defined by Weir and Cockerham FST = 1 (VCFtools). Enrichment was tested with Fisher's exact test and a hypergeometric test (R phyper, lower.tail = FALSE).", "kw": ["STAR", "DESeq2", "FST"], "info": "The RNA-seq individuals were not genotyped, so only deletions fixed in Pachón were used. Control genes had no SVs in the gene or within 5 kb of the start and stop sites.", "concl": ""}], "key": "amexicanus/Roback_2026_GenomeRes_pangenome_deletions_cave_traits", "shared": "", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Richards_2026", "title": "Cave evolution on repeat: reuse of the same genomic regions across lineages but not across traits in Astyanax mexicanus", "category": "Genetics of cave traits", "link": "https://doi.org/10.1093/genetics/iyag223", "note": "", "source_pdf": "papers/amexicanus/Richards_2026_bioRxiv_QTL_repeatability_cave_traits.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What question does this paper address?", "a": "Whether independent cave populations of Astyanax mexicanus evolved the same cave traits (sleep loss, more feeding, early fat deposition, eye loss) through shared or independent genetic architecture, and whether QTL for these traits co-localize in the genome.", "kw": ["repeated evolution", "QTL"], "info": "They used QTL mapping in three cave x surface F2 mapping populations (Pachón, Tinaja, Molino) that share one surface female.", "concl": "Genetic repeatability is common but varies by trait, and there is little evidence that sleep, eye and metabolic QTL co-localize across the genome."}, {"type": "qa", "section": "Abstract", "q": "Which trait had the most genetic repeatability across lineages, and how much?", "a": "Eye loss, with about 43% of QTL shared across lineages. Sleep loss and metabolic traits (feeding, adiposity) were less repeatable, with only about 25-33% of QTL shared.", "kw": ["eye loss", "genetic repeatability"], "info": "", "concl": "Repeatability shows up at the level of genomic regions rather than specific genes."}, {"type": "qa", "section": "Introduction", "q": "What is repeated evolution?", "a": "Independent lineages shifting to similar phenotypes in response to similar environments. These systems act as natural replicates for studying the genetic and developmental mechanisms of evolutionary change.", "kw": ["repeated evolution"], "info": "Examples of gene reuse: stickleback armor plates and pelvic spines (eda, pitx1), Heliconius red patterns (optix enhancers) and Mimulus red floral spots (rto). Other systems reach similar phenotypes through different genetic paths.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why might gene flow favour pleiotropic or linked genetic architectures?", "a": "Theory suggests that when adaptation happens despite gene flow, pleiotropic or tightly linked loci behave like large-effect loci, which selection can more easily drive to fixation. If only a few loci can produce such architectures, independent populations may reuse the same loci.", "kw": ["pleiotropy", "linkage", "gene flow"], "info": "Pleiotropic mutations were once thought unlikely to contribute to adaptation because of their potential negative fitness effects.", "concl": "Whether repeatedly evolved suites of traits share genomic regions through pleiotropy or linkage is central to understanding repeated evolution."}, {"type": "qa", "section": "Introduction", "q": "Why is A. mexicanus a good system for this question?", "a": "The cave morph is found in at least 35 caves and evolved independently from at least two surface lineages. Across these origins it repeatedly evolved eye and pigment loss, altered circadian rhythms, reduced sleep and increased adiposity, and many cave populations still hybridize with surface fish.", "kw": ["Astyanax mexicanus", "cavefish"], "info": "Earlier evidence for co-localized architectures includes oca2 affecting both sleep and pigmentation, and genomic hotspots where many cave-trait QTL map (Wiese et al. 2025).", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What was the gap in earlier cavefish genotype-to-phenotype studies?", "a": "Most were done with a single cave population, mostly Pachón, so it was unclear how repeatable the genetic architectures are across independent cave populations.", "kw": [], "info": "Cave populations also differ in sleep duration, fat deposition, fasting responses and early eye morphology, which suggests a mix of shared and lineage-specific mechanisms.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why would sleep, eye and metabolic traits be expected to co-evolve?", "a": "They are phenotypically correlated across many systems: eye loss reduces metabolic demand, metabolism influences sleep, sleep and circadian genes affect energy balance, and eye disorders affect circadian function. Feeding and sleep also share neuropeptides, neurocircuitry and circadian controllers.", "kw": ["sleep", "metabolism", "circadian rhythm"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What were the three specific aims?", "a": "To test whether the genetic basis of the traits is repeatable across independent populations, whether suites of traits co-localize in the genome, and whether any co-localization is repeated across populations.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - crosses and phenotyping", "q": "How were the mapping populations built?", "a": "A single lab-reared surface female was crossed with one male from each of three cave populations (Pachón, Tinaja, Molino), giving three F1 families. F1 siblings were intercrossed within each family to produce three F2 mapping populations.", "kw": ["F2 intercross"], "info": "Figure 1 indicates that the surface fish are Río Choy. Molino is Lineage 1; Tinaja and Pachón are Lineage 2. The cladogram shows a split of about 260 Kya.", "concl": "The shared surface grandmother made joint mapping across all three crosses possible."}, {"type": "qa", "section": "Methods - crosses and phenotyping", "q": "How was sleep measured in the larvae?", "a": "Larvae at 20 dpf were placed in 24-well plates, acclimated for about 15 h, fed Artemia for 10 min, and recorded for 24 h (14 h light : 10 h dark) starting at ZT0. A sleep bout was any period of inactivity longer than 60 s, with inactivity defined as velocity not exceeding 6 mm/s.", "kw": ["sleep assay"], "info": "Measured traits were bout length, bout number and total sleep, also split into day and night. Earlier work showed these inactivity periods correlate with a higher arousal threshold. F0 parental fish were assayed at 21 dpf.", "concl": ""}, {"type": "qa", "section": "Methods - crosses and phenotyping", "q": "How were feeding and early adiposity measured?", "a": "Feeding: at 21 dpf each fish got about 70 Artemia nauplii for 2 h, and the leftovers were counted in Fiji/ImageJ v1.5. Adiposity: after a 20 h fast, 22 dpf fish were stained with Nile red (1 µg/mL, 30 min at 28°C), imaged on a Nikon SMZ25 with a GFP filter, and scored for presence and area of staining.", "kw": ["Nile red", "Artemia", "Fiji"], "info": "Eye diameter was divided by standard length to correct for body size. The feeding-assay paragraph says 'we also measured sleep behaviors' in F0 fish, which looks like a copy error for feeding.", "concl": ""}, {"type": "qa", "section": "Methods - crosses and phenotyping", "q": "How did they test for phenotypic correlations among traits in the hybrids?", "a": "They used Spearman's rank correlation (rcorr in Hmisc v5.2-3) because most trait pairs were roughly linear or monotonic. Adiposity versus sleep was non-monotonic, so they compared median sleep between hybrids with and without adipose tissue using a Kruskal-Wallis test (base R v4.5.0).", "kw": ["Spearman correlation", "Kruskal-Wallis"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - sequencing and genotyping", "q": "How were the F2 hybrids genotyped?", "a": "Single-digest RAD-seq with the restriction enzyme SbfI, predicted to give about 40k cut sites. The first 384 samples were sequenced at Floragenex (150 bp SE, HiSeq) and the remaining 977 at the University of Minnesota Genomics Center (100 bp SE, NovaSeq S1 SP).", "kw": ["RAD-seq", "SbfI"], "info": "Read totals were 2.64, 1.69 and 1.73 billion for 582 Surface x Pachón, 386 Surface x Molino and 393 Surface x Tinaja F2s. Removing the first 384 samples did not change the QTL detected.", "concl": ""}, {"type": "qa", "section": "Methods - sequencing and genotyping", "q": "What read processing and alignment pipeline did they use?", "a": "Stacks v2.54 process_radtags removed cut sites and low-quality reads (window average phred below 10). Reads were then mapped with bwa-mem v0.7.17 to AstMex3_surface (GCA_023375975.1), and duplicates were marked with Picard v2.0.1.", "kw": ["Stacks", "bwa-mem", "AstMex3"], "info": "The reference is 1.4 Gbp with 25 chromosomes, 109 extra scaffolds and a scaffold N50 of 51.8 Mbp. Median read depth was 69.2 (Molino), 73.3 (Pachón) and 69.9 (Tinaja) reads per locus.", "concl": ""}, {"type": "qa", "section": "Methods - sequencing and genotyping", "q": "How were variants called and filtered?", "a": "With GATK v3.5 HaplotypeCaller and GenotypeGVCFs, using hard filters (QD < 2.0, FS > 60, MQRankSum < -12.5, ReadPosRankSum < -8) because no high-quality known-allele resource exists. They removed SNPs in WindowMasker repeats or within 3 bp of indels and genotypes with GQ < 20, and kept only biallelic sites (vcftools v0.1.16).", "kw": ["GATK", "vcftools"], "info": "This left 326,073 (Pachón), 135,672 (Molino) and 158,326 (Tinaja) biallelic sites. After requiring complete parental genotypes and no more than 200 missing hybrids: 102,399, 64,311 and 76,499 SNPs.", "concl": ""}, {"type": "qa", "section": "Methods - sequencing and genotyping", "q": "Which markers were kept for linkage mapping?", "a": "Only sites fixed for alternative alleles in the two F0 parents of each cross, and only individuals with at least 1,000 genotyped markers. Markers with strong segregation distortion from 1:2:1 (Bonferroni p < 10^-5) were set aside.", "kw": ["R/qtl", "segregation distortion"], "info": "Fixed-difference sites: 2,979 (Pachón), 4,306 (Molino), 3,126 (Tinaja). Individuals retained: 572, 367 and 389. Map input after the distortion filter: 2,319, 3,664 and 2,439 markers, with median spacing of 0.220, 0.301 and 0.398 Mb.", "concl": ""}, {"type": "qa", "section": "Methods - linkage maps and QTL mapping", "q": "How were the linkage maps built and what did they look like?", "a": "In R/qtl they removed likely genotyping errors (error.lod with LOD > 4, assuming a 0.01 error rate), estimated maps with the Kosambi function and 0.05 error probability, fixed misplaced markers, and dropped markers that expanded a group by 20 cM or more (qtlTools dropByDropone). Each final map had 25 linkage groups, matching the 25 chromosomes.", "kw": ["linkage map", "Kosambi", "qtlTools"], "info": "Pachón: 2,308 markers, 3,550 cM. Molino: 2,656 markers, 3,099 cM. Tinaja: 1,884 markers, 3,127 cM. Average inter-marker distance was 1.2-1.7 cM, and 213 markers were shared by all three maps.", "concl": ""}, {"type": "qa", "section": "Methods - linkage maps and QTL mapping", "q": "Which traits were mapped and why those?", "a": "Eight traits: total 24 h sleep, night sleep, night bout number, night and day average bout length, total Artemia eaten, eye size, and early-onset adiposity. These were the traits that differed significantly between at least one cave and the surface parent population at 21 dpf.", "kw": ["lme4"], "info": "The parental comparison used lmer (lme4 v1.1-32), with population and day period as fixed effects and individual ID and well position as random effects.", "concl": ""}, {"type": "qa", "section": "Methods - linkage maps and QTL mapping", "q": "What is the joint mapping approach and why was it used?", "a": "Because all three crosses share one F0 surface female, all hybrids were combined in a single scan with statgenMPP v1.0.2. This method combines identity-by-descent from each parent with linear mixed models that estimate random QTL effects while accounting for polygenic and family background, which increases power to find small-effect QTL shared across crosses.", "kw": ["statgenMPP", "joint mapping", "IBD"], "info": "It needs one map, so a consensus map was made with LPmerge v1.7. LOD was computed in 10 cM windows, with significance at -log10 P > 2 (Bonferroni, alpha 0.10). Run on the 7 traits variable in all three crosses.", "concl": "Single-population mapping found fewer shared QTL peaks than the joint approach."}, {"type": "qa", "section": "Methods - linkage maps and QTL mapping", "q": "How was early-onset adiposity mapped differently?", "a": "Adipose tissue at 22 dpf varied only among Surface x Pachón F2s, so it was mapped in that population alone. They used a binary (logistic) multi-QTL model with R/qtl2 scan1, and a 10% permutation threshold from scan1perm with 1000 permutations.", "kw": ["R/qtl2", "binary trait"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - repeatability and selective sweeps", "q": "How did they define co-localization of QTL for different traits?", "a": "QTL from two or more trait categories were counted as overlapping if they had the same peak and boundary markers, or if one QTL's interval was nested inside another's.", "kw": ["co-localization"], "info": "Changing the minimum spacing between QTL (10 vs 20 cM) did not change the conclusions, except for two consecutive sleep QTL on chromosome 5 (Table S13).", "concl": ""}, {"type": "qa", "section": "Methods - repeatability and selective sweeps", "q": "How did they find out which cave parent drove each joint QTL?", "a": "With a drop-one strategy: they removed one cross at a time and reran statgenMPP. A QTL that disappeared when a cross was dropped meant that cave parent's ancestry contributed significantly. They also compared statgenMPP parental effect estimates, where effects near zero mean no contribution.", "kw": ["drop-one", "parental effects"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - repeatability and selective sweeps", "q": "How were selective sweeps detected in wild populations?", "a": "They reused a published dataset of wild genomes from Molino (n=14), Pachón (n=19), Tinaja (n=21), Río Choy surface (n=9) and Rascón surface (n=13, representing Lineage 2 surface). Sweeps were classified in 5 kb windows with diploS/HIC v1.0.6, a neural network trained on simulations that include demographic history.", "kw": ["diploS/HIC", "selective sweep"], "info": "Hard and soft sweeps were pooled, since cave bottlenecks make them hard to tell apart. Only sweeps called under both the cave and surface demographic models were kept, a conservative filter against model misspecification.", "concl": "Genes with sweeps in caves from both lineages but not in either surface population were treated as candidates for repeated, independent selection."}, {"type": "qa", "section": "Methods - tgfa validation", "q": "How did they functionally test a candidate sleep gene?", "a": "They made surface-fish crispants for tgfa, a gene in the chromosome 5 sleep and eye QTL that reduces sleep when disrupted in zebrafish. At 22 dpf, crispants and uninjected wild-type siblings were compared in a 24 h sleep assay using Kruskal-Wallis tests.", "kw": ["tgfa", "CRISPR-Cas9", "crispant"], "info": "Fish were injected with Cas9 protein and a gRNA targeting tgfa. Full details are in supplementary methods S6.", "concl": ""}, {"type": "qa", "section": "Results - trait correlations", "q": "Which traits differed between cave and surface parents at 21 dpf?", "a": "Eight: eye size, total 24 h sleep, average bout length over 24 h, night bout length, day bout length, night bout number, night sleep, and total Artemia eaten.", "kw": [], "info": "Per Figure 1B, Tinaja was the only cave population that ate more than surface fish, and only Pachón showed early-onset adipose.", "concl": ""}, {"type": "qa", "section": "Results - trait correlations", "q": "Were sleep, feeding and eye traits correlated in the F2 hybrids?", "a": "Weakly and depending on the population. Sleep metrics were most strongly correlated with each other. Total sleep was weakly positively correlated with Artemia eaten (Molino and Tinaja F2s) and with eye size (Molino and Pachón F2s), and eye size correlated with feeding only in Molino F2s.", "kw": ["genetic correlation"], "info": "Pachón F2s with and without adipose tissue did not differ significantly in sleep.", "concl": "The traits seem only partially correlated at the genetic level."}, {"type": "qa", "section": "Results - QTL architecture", "q": "How many QTL were found and how were they distributed?", "a": "Joint mapping found 48 QTL for the traits variable in all three crosses, and the Pachón-only scan found 1 adiposity QTL. Together they fall in 31 distinct regions on 19 of the 25 chromosomes.", "kw": ["polygenic"], "info": "15 regions were associated with eye size, 10 only with sleep, 3 only with Artemia eaten, and 1 only with adiposity. The text says 15 eye-size regions here but '16' later, and Table 1 lists ES1-ES16.", "concl": "Sleep, feeding and eye development have highly polygenic architectures."}, {"type": "qa", "section": "Results - repeatability across lineages", "q": "How repeatable were the eye size QTL?", "a": "The text says 9 of 16 eye-size regions (43%) were associated with cave genotypes from both Lineage 1 (Molino) and Lineage 2 (Tinaja and/or Pachón). Adding Molino-specific QTL ES4 and ES5, which overlap earlier Pachón eye QTL, up to 56% may be repeatedly involved.", "kw": ["eye size", "ES QTL"], "info": "The numbers do not add up: 9 of 16 is 56%, not 43%. Table 1 lists 7 regions as parallel across lineages (ES1, ES2, ES6, ES8, ES9, ES11, ES12), which fits 43%, and 7 plus ES4/ES5 gives 56%. The strongest QTL was ES2 on chr1 (LOD 18.54).", "concl": "Eye loss is the most genetically repeatable trait."}, {"type": "qa", "section": "Results - repeatability across lineages", "q": "How repeatable were the sleep and feeding QTL?", "a": "Of the 12 sleep QTL regions, 33% were shared across lineages, 25% only within Lineage 2, and 42% unique to one population. For Artemia eaten, 1 QTL was shared across lineages (TE3), 1 within Lineage 2, and 2 were Tinaja-only.", "kw": ["sleep QTL", "hyperphagia"], "info": "Tinaja was the only population significantly more hyperphagic than surface fish at this stage. Early-onset adiposity was not a repeated trait, so it was not assessed for repeatability.", "concl": ""}, {"type": "qa", "section": "Results - selective sweeps", "q": "Did shared QTL contain genes repeatedly swept in caves?", "a": "Rarely. Of 2,433 genes in QTL regions, only 2 had sweeps in all three wild cave populations but not in surface fish (klhl43 in sleep QTL S3 and zbtb17 in feeding QTL TE1), and both were in lineage-specific QTL. Allowing at least one cave per lineage raised this to 30 genes, 11 of them in three shared eye QTL and two shared sleep QTL.", "kw": ["klhl43", "zbtb17"], "info": "The Discussion gives 3,331 genes in QTL regions (30 of 3,331 = 0.9%), not 2,433, so the denominator is unclear. Only 2 of 31 QTL regions had no cave-unique sweeps, and in the other 29, 7-47% of protein-coding genes were under cave-only selection.", "concl": "Genetic repeatability is probably not constrained by a need for rare, singularly advantageous mutations in a few large-effect genes."}, {"type": "qa", "section": "Results - co-localization", "q": "Where did QTL for different traits co-localize?", "a": "In only two regions: chromosome 25, where sleep and total eaten overlap (S11 and TE4, driven only by Tinaja ancestry), and chromosome 5, where eye size and sleep overlap (ES5 and S4).", "kw": ["chromosome 25", "chromosome 5"], "info": "At chr25, Tinaja ancestry was linked to shorter total sleep, fewer night bouts and less Artemia eaten. The single adiposity QTL (EOA1, chr23, LOD 20.11) overlapped no other trait, though an eye QTL lies about 6 Mb upstream.", "concl": "There is limited shared genetic architecture between these co-evolving cave traits."}, {"type": "qa", "section": "Results - co-localization", "q": "Which candidate genes are in the chromosome 25 and adiposity QTL?", "a": "At chr25: acsl1a and mtnr1aa. In the adiposity QTL: cebpa and arhgap1.", "kw": ["acsl1a", "mtnr1aa", "cebpa"], "info": "Results says only Río Choy and Rascón surface show sweeps in acsl1a, but the Discussion says acsl1a is under selection in Pachón, Tinaja and Rascón (Lineage 2), so the paper is inconsistent. mtnr1aa shows sweeps in Molino, Tinaja, Río Choy and Rascón. The adiposity gene is written 'cepba' in the text, likely meaning cebpa.", "concl": ""}, {"type": "qa", "section": "Results - co-localization", "q": "What did the tgfa crispant experiment show?", "a": "tgfa crispant surface fish slept a median of 36% less than wild-type siblings over 24 h. Their sleep bouts were significantly shorter, but bout number was similar.", "kw": ["tgfa", "sleep"], "info": "On chr5, sleep was associated with all three cave ancestries, but eye size only with Molino ancestry. Earlier Pachón crosses also mapped eye size to this region. Other candidates there include oca2, ube3a and ghrl.", "concl": "Natural variation in tgfa can plausibly modify sleep in A. mexicanus."}, {"type": "qa", "section": "Discussion", "q": "What are the three main findings according to the authors?", "a": "Genetic repeatability differs between traits, with eye size most consistent across lineages. Sleep and metabolic traits have more population-specific architectures. QTL for multiple traits rarely co-localize, which suggests pleiotropy or linkage generally do not shape these cave traits.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why might eye loss be more genetically repeatable than sleep and metabolism?", "a": "Perpetual darkness is the same in every cave and vision needs light, so the visual system is affected uniformly. Circadian rhythms can also be entrained by food and other organisms (such as bats moving in and out of caves), and diets and hydrology differ among caves, which may open more evolutionary paths for sleep and metabolic traits.", "kw": ["circadian cues", "cave environment"], "info": "This is a hypothesis; the paper does not test it directly.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Is repeatability driven by the same genes or by genomic regions?", "a": "By regions. Only 0.9% (30 of 3,331) of genes in QTL regions show repeated strong selection across both lineages, while 6% (214 of 3,331) show sweeps in individual cave populations. A previous study found about 30% of sweeps in one cave were also found in the other lineage, far more than seen here.", "kw": ["genomic regions", "clustering"], "info": "Unequal power to detect selection, from differences in demography and selection intensity, could partly explain the low overlap.", "concl": "The authors propose that clusters of functionally related loci with a range of effect sizes, rather than repeated mutations in single genes, underlie repeated sleep and eye loss."}, {"type": "qa", "section": "Discussion", "q": "How might gene flow explain the regional repeatability?", "a": "Theory predicts that large-effect architectures underlying locally favoured traits are easier to maintain under divergent selection with gene flow. Both lineages have experienced or still experience introgression from surface fish, so similar gene flow histories may have favoured reuse of the same regions.", "kw": ["migration-selection balance", "introgression"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why is mtnr1aa an interesting candidate for the Tinaja chr25 QTL?", "a": "mtnr1aa is a homolog of the MT1 melatonin receptor gene, which is linked to sleep/wake cycles and glucose homeostasis. Tinaja is the only cave population that appears to have lost melatonin rhythms entirely, which matches the Tinaja-only sleep and feeding QTL.", "kw": ["mtnr1aa", "melatonin"], "info": "acsl1a, the other chr25 candidate and an ortholog of the fatty acid metabolism gene acsl1, is upregulated in Tinaja and Pachón livers and associated with a cave-specific open chromatin region near the gene.", "concl": "Tinaja-specific mutations or expression patterns in mtnr1aa may help explain why circadian loss differs among caves."}, {"type": "qa", "section": "Discussion", "q": "How does the rare co-localization compare with earlier cavefish QTL work?", "a": "It contrasts with a synthesis of earlier QTL studies, mostly Surface x Pachón crosses, where co-localization was frequent across the genome. None of those studies mapped sleep or feeding, but eye size there co-localizes with pigmentation, taste buds, tooth count and body condition.", "kw": ["QTL hotspots"], "info": "", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Which chromosome 5 gene best explains the eye-sleep co-localization?", "a": "None clearly. tgfa affects sleep, but its crispants had only subtly smaller eyes, not significant after FDR correction. ghrl had no feeding association, is not differentially expressed in the degenerating Pachón eye, and shows no cave sweeps. oca2 null fish sleep less and lack pigment but do not have smaller eyes.", "kw": ["tgfa", "ghrl", "oca2"], "info": "tgfa is downregulated in degenerating 54 hpf Pachón eyes, so regulatory changes are possible. No cave population has strong intragenic sweeps in tgfa, but one surface population does.", "concl": "The evidence favours linkage of several variants, each affecting a separate trait, over a single pleiotropic mutation."}, {"type": "qa", "section": "Discussion", "q": "Which CRISPR-validated sleep genes fall inside the sleep QTL?", "a": "Three: tgfa, oca2 and rorca. rorca is a circadian clock gene whose crispants sleep less at night, and both cave lineages have lost its rhythmic expression.", "kw": ["rorca", "oca2", "tgfa"], "info": "The text says the nighttime sleep QTL containing rorca is on chromosome 16, but Table 2 lists rorca under S5 (ASN3, chr12:6.5-8.8), so the location is inconsistent in the paper.", "concl": "The authors say these are the highest marker density and largest sample size QTL maps in A. mexicanus to date."}, {"type": "qa", "section": "Discussion", "q": "What is the overall conclusion?", "a": "Extending QTL mapping to several populations revealed extensive genetic repeatability at the level of genomic regions, but not of specific genes. Eye loss, sleep loss and metabolic shifts do not co-evolve through widespread genetic correlation, and co-localized architectures are not strongly repeated across caves.", "kw": [], "info": "The authors describe this as the first mapping of the genetic basis of sleep in a natural system.", "concl": "Genetic repeatability through correlation among co-evolving traits is not a highly predictable outcome of repeated evolution."}, {"type": "note", "section": "Results - repeatability across lineages", "text": "Check the eye QTL repeatability numbers against Table 1 and Tables S14-S16. The text says 9 of 16 = 43%, but the table lists 7 parallel regions. Also check 2,433 vs 3,331 genes in QTL regions and the rorca chromosome (16 vs 12)."}, {"type": "note", "section": "Discussion", "text": "Could non-coding or structural variation (e.g. cis-regulatory changes near tgfa or acsl1a) explain regional repeatability where coding-region sweeps do not? The sweep analysis only covered coding regions and conservative calls."}, {"type": "note", "section": "Discussion", "text": "Why is QTL co-localization frequent in earlier Surface x Pachón studies but rare here? Is it trait choice (sleep and feeding were never mapped before), larval stage, or population?"}], "key": "amexicanus/Richards_2026_bioRxiv_QTL_repeatability_cave_traits", "shared": "Damir · 2026", "preprint": "https://doi.org/10.64898/2026.01.31.703033", "tags": [], "nostar": false, "source_note": "Notes are from the bioRxiv preprint (version 1, Feb 2026), not from the peer-reviewed Genetics version (no access). The title and some results may differ in the journal version."}, {"id": "Ricemeyer_2026", "title": "Cave adaptation drives coordinated transcriptional remodeling across diverse cell types in the brain of a teleost fish", "category": "Brain & behaviour", "link": "https://doi.org/10.64898/2026.06.19.733352", "note": "", "source_pdf": "papers/amexicanus/Ricemeyer_2026_bioRxiv_cavefish_brain_cell_atlas.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What does this paper present?", "a": "A spatially integrated comparative cell atlas of whole adult brains of surface and cave Astyanax mexicanus. It combines single-nucleus RNA-seq with spatial transcriptomics and defines the molecular signatures of 35 cell types.", "kw": ["cell atlas", "snRNA-seq", "spatial transcriptomics"], "info": "Cavefish behavioural changes they want to explain include sleep loss, increased appetite and reduced aggression. These are thought to be complex traits that needed coordinated changes across multiple cell types to evolve, which is why their mechanisms have been hard to
