 find.", "concl": "Cave colonization drove canalized regulatory changes to gene expression across diverse cell types."}, {"type": "qa", "section": "Abstract", "q": "What are the main findings in short?", "a": "Cavefish brains differ from surface brains in cell-type composition and show complex regulatory changes in hypoxia response and circadian rhythm pathways. Microglia are extensively remodelled (senescence and AMPK pathways), and a cave-enriched ligand-receptor pattern centres on signals sent from glia to diverse neurons.", "kw": ["microglia", "HIF1", "circadian rhythm"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is it hard to find the mechanisms of adaptation, even now that genomes are cheap to assemble?", "a": "Much of the change that drives adaptation over short evolutionary time is regulatory rather than in coding sequence. Bulk RNA-seq can find differentially expressed genes but is hard to interpret when many complex traits evolved through coordinated changes to the regulatory programs of multiple cell types.", "kw": ["regulatory evolution", "bulk RNA-seq"], "info": "Long-read sequencing and new assembly algorithms make it straightforward to compare closely related genomes adapted to different environments.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What common themes do subterranean animals show?", "a": "Energetic and developmental resources are moved away from vision and its neural circuitry and towards non-visual senses that detect movement, vibration, smell or electric fields. Caves are also dark, hypoxic and have different food availability and parasite load.", "kw": ["subterranean adaptation"], "info": "Examples: the naked mole-rat has degraded eyes and reduced visual pathways but higher tactile sensitivity and pain tolerance. The cave salamander Proteus anguinus has reduced eyes and visual nerves but can navigate using magnetic fields. These perturbed processes often mimic human disease phenotypes.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why is A. mexicanus a good natural experiment for rapid adaptation?", "a": "One species has river populations in the Sierra del Abra region of northeastern Mexico and at least 35 cave populations that adapted independently. Cave evolution happened several times over roughly the last 20,000 years, is still ongoing, and surface and cave populations keep hybridizing.", "kw": ["Astyanax mexicanus", "repeated evolution"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which cavefish traits are known, and which behavioural mechanisms were already explained?", "a": "Known traits include eye loss, starvation resistance, enhanced olfaction, and loss of aggression, schooling, circadian rhythm and prey response. Previously explained mechanisms include more superficial neuromasts for vibration attraction and a mao mutation that reduces aggression.", "kw": ["mao", "neuromasts"], "info": "Brains are highly heterogeneous and most behavioural changes are likely polygenic, so finding the causal genetic changes has been largely intractable. Single-cell and spatial RNA-seq can break the changes down by cell type and brain region.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What central question about brain cell types does the paper ask?", "a": "Whether brain cell types evolved similarly during cave adaptation, or whether the new environment put different evolutionary pressures on different cell types.", "kw": ["microglia", "brain immunity"], "info": "Big immune differences between surface and cavefish were already known outside the brain (Peuss et al. 2020), but immunity inside the brain had not been studied. Microglial dysfunction plays a role in Alzheimer's and Parkinson's disease.", "concl": ""}, {"type": "qa", "section": "Results - spatially integrated comparative brain atlas", "q": "Which samples make up the atlas?", "a": "Nuclei from the brains of 7 Rio Choy surface fish (3 males, 4 females) and 9 Pachon cavefish (4 males, 5 females), plus spatial data from one female Rio Choy surface fish.", "kw": ["Rio Choy", "Pachon"], "info": "There are no spatial data from cavefish, so spatial annotation is based on a single surface brain.", "concl": ""}, {"type": "qa", "section": "Results - spatially integrated comparative brain atlas", "q": "How many nuclei and clusters, and how were the clusters labelled?", "a": "After QC, unsupervised network-based clustering split 117k nuclei into 35 clusters. Cell type labels came from canonical marker genes and from where each cluster's expression pattern mapped in the spatial data.", "kw": ["leiden clustering", "UMAP"], "info": "Spatial examples: Bergmann glia (slc1a3b, gabp7a, glula, s100b) concentrate in the molecular cell layer of the cerebellum. One of three VGLUT1+/VGLUT2b+ clusters concentrates in the torus longitudinalis. Unclear point: the Supplementary Figure 1 caption numbers clusters from 0 to 35, which would be 36 clusters.", "concl": ""}, {"type": "qa", "section": "Results - spatially integrated comparative brain atlas", "q": "How did they refine the clusters after annotation?", "a": "They merged clusters that could not be told apart by differentially expressed genes or spatial patterns, for example clusters 0 and 1 (both VGLUT1+ with non-specific brain-wide patterns). They also set the immune clusters aside for higher-resolution reclustering.", "kw": ["VGLUT1"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - spatially integrated comparative brain atlas", "q": "Which top-level cell groups did they find?", "a": "Five neuron groups: 9 glutamatergic groups (split by location and VGLUT type), 4 multi-neurotransmitter clusters, 1 purely GABAergic cluster, 1 diencephalic projection neuron cluster and 1 Purkinje cluster. Three glia groups: oligodendrocytes with their precursors; quiescent radial glia, astrocytes and Bergmann glia; and cerebellar ventricular zone neurogenic progenitors. They also found barrier endothelium and one immune category.", "kw": ["glutamatergic neurons", "glia"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - cell type composition", "q": "Which brain region size differences between surface and cavefish were already known?", "a": "Cavefish have an enlarged hypothalamus and habenula and a smaller optic tectum.", "kw": ["optic tectum", "hypothalamus"], "info": "Region size changes can reflect more neurons of one type (for example more serotonergic neurons in the cavefish hypothalamus) or lost sensory input (the smaller tectum is linked to lost visual innervation).", "concl": ""}, {"type": "qa", "section": "Results - cell type composition", "q": "How does cell type composition differ between surface and cave brains?", "a": "Surface brains have proportionally more oligodendrocytes and more VGLUT1+/VGLUT2b+ neurons in the torus longitudinalis. Cave brains have proportionally more cerebellar ventricular-zone neurogenic progenitors, Purkinje cells, immune cells, VGLUT1+ eurydendroid neurons and unlocalized VGLUT1+ neurons (FDR = 0.05).", "kw": ["scCODA", "differential composition"], "info": "Tested with a Bayesian model for differential composition, with population and sex as covariates.", "concl": ""}, {"type": "qa", "section": "Results - ecotype as driver of gene expression", "q": "How did they check which factor drives overall expression patterns?", "a": "They grouped cells by sample and cell type and ran UPGMA hierarchical clustering on the first 20 principal components. Qualitatively, cell type was the top-level factor, with ecotype and sex at lower levels.", "kw": ["UPGMA", "hierarchical clustering"], "info": "Sex was included because it is a major determinant of brain gene expression in other organisms.", "concl": ""}, {"type": "qa", "section": "Results - ecotype as driver of gene expression", "q": "How did they quantify the importance of cell type, ecotype and sex, and what were the values?", "a": "For each factor they computed NMI-weighted mean node depth, where a lower depth means higher-level organization. Cell type was 9.3 (bootstrapped 95% CI 8.2-10.6), ecotype 12.3 (11.9-12.7) and sex 13.3 (13.0-13.6).", "kw": ["normalized mutual information", "NMI"], "info": "NMI was calculated at each internal node between tree topology (left or right descendant) and the factor of the leaves.", "concl": "Ecotype organizes expression at a higher level than sex."}, {"type": "qa", "section": "Results - ecotype as driver of gene expression", "q": "What did the per-cell-type DEG analysis between cave and surface show?", "a": "Every cell type had some DEGs, with more genes up than down in cave. VGLUT2+/CHOL/NORA, VGLUT1+ GCL, unlocalized VGLUT1+ and unlocalized VGLUT2+ neurons had the most DEGs.", "kw": ["DEG", "pseudobulk"], "info": "Those cell types also have the most cells, so their high DEG counts are probably partly due to more statistical power. Figure 2c: every cell type except Purkinje cells has more cave-biased genes than surface-biased or sex-biased genes. Sex was a covariate.", "concl": ""}, {"type": "qa", "section": "Results - ecotype as driver of gene expression", "q": "Which controls did they use to put the cave vs surface DEG numbers in context?", "a": "They compared ecotype DEGs to sex DEGs, which were fewer. They also split individuals randomly into two equal groups regardless of sex or ecotype, which gave only 3 DEGs across all cell types.", "kw": ["null control"], "info": "", "concl": "Cave vs surface is the major determinant of within-cell-type expression variation in the brain, more important than sex."}, {"type": "qa", "section": "Results - circadian-regulated genes", "q": "Which pathways were differentially regulated across many cell types?", "a": "Circadian rhythm signaling (10 cell types), serotonin receptor signaling (9) and synaptic long-term potentiation (9). The last one suggests neuronal remodelling in cavefish.", "kw": ["Fisher's exact test", "pathway enrichment"], "info": "Some pathways were cell-type specific, for example HIF1 signaling enriched in cavefish astrocytes.", "concl": "Cave adaptation changed key pathways at both the system level and the cell level."}, {"type": "qa", "section": "Results - circadian-regulated genes", "q": "What did they see for core clock genes across cell types?", "a": "Subsets of A. mexicanus orthologs of BMAL, CLOCK, CRY and PER were differentially expressed in all cell types, but no single gene was differentially expressed in every cell type.", "kw": ["TTFL", "circadian clock"], "info": "Earlier bulk RNA-seq showed many core transcriptional-translational feedback loop (TTFL) genes lose rhythmicity in cavefish, but the cellular basis was unresolved.", "concl": "This shows why expression changes need to be measured at the cell-type level."}, {"type": "qa", "section": "Results - circadian-regulated genes", "q": "How do cry and per repressor genes differ between cave and surface brain cell types?", "a": "cry1a and cry3a are higher in cavefish, and cry1b and cry3b are higher in surface fish, each in different but overlapping cell types. per1a, per1b and per3 are higher in many cavefish cell types.", "kw": ["cry1a", "per3"], "info": "In bulk data (Mack et al. 2021) all four cry genes are rhythmic in surface fish and all except cry1b lose rhythmicity in Pachon. per1a, per1b and per3 keep their rhythmicity in Pachon.", "concl": ""}, {"type": "qa", "section": "Results - circadian-regulated genes", "q": "How do Pachon and Molino differ for per3?", "a": "per3 transcription is increased in Pachon cavefish, but in Molino per3 expression is reduced by a high-frequency heterozygous deletion of its canonical start codon.", "kw": ["per3", "Molino"], "info": "So the same gene changes in opposite directions in two cave morphs, by a coding deletion in Molino and a regulatory change in Pachon.", "concl": "Different cave lineages perturbed the circadian TTFL by multiple routes."}, {"type": "qa", "section": "Results - circadian-regulated genes", "q": "Why is cry1a an example of conserved repeated evolution?", "a": "The cry1a mutation in Pachon is a substitution of the same amino acid also found in Somalian cavefish and in subterranean mammals such as the naked mole rat. This suggests circadian dysregulation is adaptive underground.", "kw": ["cry1a", "convergent evolution"], "info": "Cry1a is directly photoentrained by light in fishes. The authors speculate that constant rather than rhythmic expression may allow continuous regulation of downstream processes that depend on cry1a.", "concl": ""}, {"type": "qa", "section": "Results - circadian-regulated genes", "q": "What happens to the clock activators clocka and arntl1a/b?", "a": "clocka is reduced in cavefish only in Purkinje cells. arntl1a is down in cavefish VGLUT2+/CHOL/NORA neurons, while arntl1b is up in cavefish VGLUT1+ neurons, so the two paralogs may have taken on different roles or been selected in opposite directions.", "kw": ["arntl1", "clocka"], "info": "In mice, ARNTL1 knockdown in the suprachiasmatic nucleus causes anxiety-like behaviour, higher stress sensitivity and a longer free-running locomotor period in constant darkness. The authors suggest cell-specific trade-offs that could relate to higher locomotion and lower stress responses in cavefish.", "concl": ""}, {"type": "qa", "section": "Results - circadian-regulated genes", "q": "What is the overall conclusion on circadian genes, and what are its limits?", "a": "There is no clear pattern linking differential expression to a gene's role as activator or repressor, or to loss of rhythmicity. Adaptation to the arrhythmic cave probably involved coordinated multigenic regulatory changes across different cell types.", "kw": ["multigenic adaptation"], "info": "Limitation: they need time-course single-cell experiments with repeated sampling over a day, plus genomic data beyond RNA-seq.", "concl": "This is the first demonstration that circadian gene expression can be broken down by cell type in the cavefish brain."}, {"type": "qa", "section": "Results - hypoxia signaling in astrocytes", "q": "What is HIF1A, and what was already known about it in cavefish?", "a": "HIF1A is a transcription factor that is hydroxylated and degraded under normoxia but becomes stable under hypoxia and turns on genes that help cells cope with low oxygen. Cavefish upregulate the HIF1A orthologs hif1aa and hif1al2 and their targets during development, even under normoxia.", "kw": ["HIF1A", "hypoxia"], "info": "Caves are relatively hypoxic because there is no photosynthesis. Effects proposed downstream of the HIF1 pathway, especially via upregulated sonic hedgehog signaling, include enhanced olfaction, taste bud amplification and heart asymmetry reversal.", "concl": ""}, {"type": "qa", "section": "Results - hypoxia signaling in astrocytes", "q": "Which HIF1 pathway genes differ in cavefish astrocytes?", "a": "16 HIF1 pathway genes were differentially expressed. The biggest difference was slc2a1, much higher in cavefish (LFC = 3.23, adjusted p = 4.27e-7). Also up in cave were hk2 (LFC 1.22), mmp14b (1.44), mmp16b (2.46) and igf2b (1.22), while vegfc was down (LFC -1.44, p = 5.90e-5).", "kw": ["slc2a1", "astrocytes", "vegfc"], "info": "These genes cover glucose metabolism (slc2a1, hk2), ECM remodelling (mmp14b, mmp16b), cell survival (igf2b) and angiogenesis (vegfc). Possible inconsistency: the Supplementary Table 4 caption says LFC > 0 means higher in surface, but the text reports positive LFCs as higher in cave.", "concl": "This is the first evidence that astrocyte evolution is involved in cave evolution."}, {"type": "qa", "section": "Results - immune subclustering", "q": "Why and how were immune cells reclustered, and which types were found?", "a": "The resolution that best split neurons and glia was too low to resolve immune subtypes, so the immune nuclei were reclustered starting from raw counts. They found a full repertoire: B cells, T cells (including gamma-delta and double-positive clusters), macrophages, microglia and their precursors, basophils/mast cells and neutrophils.", "kw": ["immune subclustering", "microglia"], "info": "Immune cell types showed no spatial pattern, so they got no spatial annotation. Figure 4a also shows megakaryocytes/platelets, red blood cells and a neuronal cluster.", "concl": ""}, {"type": "qa", "section": "Results - immune subclustering", "q": "How does immune composition differ by ecotype and by sex?", "a": "Cavefish brains have proportionally more T cells, gamma delta T cells and macrophages (FDR = 0.05). Male brains have proportionally more microglia and fewer B cells than female brains.", "kw": ["T cells", "macrophages"], "info": "The cave result fits the longer, more sensitive pro-inflammatory cytokine response and greater adaptive immune investment seen outside the brain (Peuss et al. 2020). The male microglia result fits mammalian evidence that microglia contribute to brain sex differences.", "concl": ""}, {"type": "qa", "section": "Results - immune pathways", "q": "Which immune cell types were used for pathway analysis, and why?", "a": "Only microglia, macrophages and T cells, because only they had enough DEGs (in the hundreds) for pathway enrichment. As in neurons and glia, each had more genes higher in cavefish than in surface fish.", "kw": ["pathway enrichment"], "info": "Earlier work (Shafer et al. 2022) reported fewer immune cells in the cave hypothalamus, but molecular phenotypes of immune cells in whole brains were unknown.", "concl": "The authors read this as system-wide remodelling of regulatory networks in cavefish brains."}, {"type": "qa", "section": "Results - immune pathways", "q": "What changed in cavefish microglia, and why look for senescence?", "a": "521 genes had at least twofold differential expression (p < 0.05), the most of any immune cell type. Cell senescence was the top enriched pathway (-log BH p = 3.44), with the transcription factor orthologs chp1, phf1 and smad1 up in cavefish microglia.", "kw": ["microglia", "senescence", "smad1"], "info": "Rationale: sleep deprivation reduces microglial function and synaptic pruning in other organisms, and cavefish sleep less. The threshold here (p < 0.05) differs from the DEG threshold in Methods (adjusted p < 0.01). The authors note that comparing DEG counts is prone to bias.", "concl": "The authors read this as adaptation towards non-inflammatory tissue maintenance and microglia that are more resilient to sleep deprivation."}, {"type": "qa", "section": "Results - immune pathways", "q": "Why is AMPK enrichment in cavefish microglia interesting?", "a": "AMPK is activated by low glucose, yet these fish were lab-reared with good food. Activation may therefore reflect a canalized low-glucose response that persists regardless of actual glucose, which is generally higher in cavefish because of insulin resistance.", "kw": ["AMPK", "canalization"], "info": "They report a z-score of -2.27 from 12 of 110 genes whose direction is consistent with a decrease in movement disorders. How this score relates to the AMPK result is not clearly explained.", "concl": ""}, {"type": "qa", "section": "Results - immune pathways", "q": "What did they find in brain macrophages?", "a": "324 DEGs between ecotypes and 17 enriched pathways, several pointing to altered immune surveillance and inflammatory signaling. The macrophage alternative activation pathway showed FcERI upregulation leading to SYK activation, a kinase strongly implicated in microglia-mediated synapse removal.", "kw": ["macrophages", "SYK", "M2 polarization"], "info": "Macrophages are normally excluded from the brain and enter through the blood-brain barrier after injury, inflammation, infection or developmental remodelling. Figure 4d suggests an M2 anti-inflammatory subtype.", "concl": ""}, {"type": "qa", "section": "Results - immune pathways", "q": "What did they find in brain T cells?", "a": "34 enriched pathways, mostly related to cytokine signaling, with FLT3 signaling among the top (-log10 corrected p = 3.55). Upstream regulators include a TCR activation network (JUNB, MYC, MAX), and higher BTLA, SOCS2 and CFLAR may be how the shift towards homeostasis-promoting T cells happens in the cavefish brain.", "kw": ["FLT3", "TCR", "BTLA"], "info": "BTLA negatively regulates T cell activation, SOCS2 inhibits cytokine signaling and CFLAR blocks apoptotic signaling. FLT3 expression in T cells usually marks early progenitor-like states. The authors say more data are needed to validate these states.", "concl": "The brain immune system is highly divergent between ecotypes. Microglia may play a role in the synaptic pruning that reduces optic tectum size in cavefish."}, {"type": "qa", "section": "Results - astrocyte to neuron communication", "q": "Which approaches did they use for cell-cell communication, and what did tensor decomposition show?", "a": "They used tensor decomposition (Tensor-cell2cell) and a DEG-based ligand-receptor analysis. Tensor decomposition gave five factors, and only Factor 4 differed by ecotype: it was enriched in cavefish, with astrocytes, Bergmann glia and quiescent radial glia as senders and neurons as receivers.", "kw": ["Tensor-cell2cell", "ligand-receptor"], "info": "Factor 4 sample loadings were compared with a two-sided independent t-test and Bonferroni correction (p < 0.05). Possible effects include more metabolic support for neurons, homeostatic regulation, synaptic plasticity and neuromodulation.", "concl": ""}, {"type": "qa", "section": "Results - astrocyte to neuron communication", "q": "What did the DEG-based ligand-receptor analysis show?", "a": "11,294 ligand-receptor interactions were differentially regulated between surface and cavefish (BH-corrected p < 0.05). VGLUT2+ OT, OPCs, VGLUT1+/2b+ dDien, VGLUT1+/2b+ TL, oligodendrocytes, VZ neural progenitors and Bergmann glia took part more often in cave interactions. Astrocytes, VGLUT2+/CHOL/NORA, quiescent radial glia, VGLUT1+, GABA/GLYC/NORA, VGLUT1+ LCa and VGLUT2+/CHOL took part more often in surface interactions.", "kw": ["LIANA+", "CellPhoneDB"], "info": "Possible tension: astrocytes and quiescent radial glia are key senders in the cave-enriched Factor 4, but they are among the most surface-biased cell types in the DEG-based counts. The paper does not discuss this.", "concl": ""}, {"type": "qa", "section": "Results - astrocyte to neuron communication", "q": "What did the overlap of both analyses show, and why is mdkb highlighted?", "a": "The top Factor 4 interactions (above mean + 2 SD, n = 81) overlapped with differentially expressed interactions in 61 cases. mdkb, an ortholog of mammalian MDK, had enriched interactions with four receptors, each in more than 10 glia-to-neuron cell type pairs.", "kw": ["mdkb", "midkine"], "info": "MDK promotes neurite outgrowth and mediates signaling between the nervous and immune systems. Figure 5e shows mdkb with sdc3, sorl1, lrp1ab and alk.", "concl": "Suggests an astrocyte-led reconfiguration of neural connectivity and modulation of nervous system inflammation in cavefish."}, {"type": "qa", "section": "Discussion", "q": "What are the main themes the authors take from the atlas?", "a": "First, expression differences are large and found throughout the brain even under identical lab rearing, not just in vision-linked regions like the optic tectum. Second, changes are spread across many cell types, which fits coordinated multigenic regulatory evolution. Third, the brain immune system is extensively remodelled, in line with known immune differences between ecotypes.", "kw": ["regulatory evolution"], "info": "They call it the first single-cell-resolution, spatially integrated, comparative brain atlas of a vertebrate adapted to an extreme environment.", "concl": "Adaptation to an extreme environment needed pervasive, cell-type-distributed remodelling of transcription across neurons, glia and immune cells at the same time."}, {"type": "qa", "section": "Discussion", "q": "How can the atlas be used as a resource?", "a": "To deconvolve bulk RNA-seq into cell types, to project new single-cell datasets onto it instead of annotating them by hand, and as an expression reference across cell types and ecotypes.", "kw": ["UCSC Cell Browser", "deconvolution"], "info": "Data: GEO GSE335564 and the UCSC Cell Browser (astyanax-adult-brain.cells.ucsc.edu). Code: GitHub WarrenLab/astyanax-adult-brain-atlas.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What is the main limitation of their pathway and interaction analyses?", "a": "Few pathway resources exist for teleosts, so they projected A. mexicanus genes onto mammalian orthologs to use mouse and human databases. The teleost whole-genome duplication produced a and b paralogs that were often neo- or subfunctionalized, and even in closely related species the target genes and cis-regulatory elements turn over quickly.", "kw": ["orthology", "teleost whole-genome duplication"], "info": "They argue that recovering known differences (sleep, hypoxia) supports the approach. Lineage-specific, cell-type-resolved gene regulatory networks from single-cell multi-omics will be needed.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What follow-up do they propose for HIF1A signaling in astrocytes?", "a": "Map HIF1A-targeted response elements in astrocytes and their differences between ecotypes using single-cell ATAC-seq, then perturb these sequences with CRISPR to find which changes cause phenotypic differences.", "kw": ["scATAC-seq", "CRISPR"], "info": "Astrocytes take part in circadian rhythm and nervous system repair, so a link to sleep loss is worth testing. Other suggested studies: whether the pro-senescence microglial state is neuroprotective under chronic metabolic stress, and what the reorganized glia-neuron network does functionally.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "Why do the authors see cavefish as relevant for disease research?", "a": "Signatures such as microglial AMPK activation and hypoxia-dependent astrocyte reprogramming resemble mammalian neurodegenerative disease models. The cavefish brain is a natural model where disease-relevant transcriptional states have been canalized by selection, so they can be studied outside a pathological context.", "kw": ["neurodegeneration", "canalization"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - sample collection", "q": "How were the brains collected?", "a": "Fish aged 1-2 years were reared at the Stowers Institute, euthanised by hypothermal shock in an ice bath, and whole brains were flash frozen in liquid nitrogen. Dissections alternated between cave and surface fish to avoid circadian bias and took about 8 hours over two days, with females dissected in March 2023 and males in January 2024.", "kw": [], "info": "Nuclei were isolated with the Singulator2 instrument (S2 Genomics) with 0.4 U/ul RNase inhibitor in all buffers, and counted and checked for debris on a Cellometer. IACUC protocol 2021-126.", "concl": ""}, {"type": "qa", "section": "Methods - snRNA-seq library prep and sequencing", "q": "How were the single-nucleus libraries made and sequenced?", "a": "With 10x Genomics Chromium Single Cell 3' v3 chemistry (GEM encapsulation), checked on a Bioanalyzer high-sensitivity chip, and sequenced on an Illumina NovaSeq 6000.", "kw": ["10x Chromium", "NovaSeq 6000"], "info": "Read structure: 26 bp read 1, 8 bp i7 index, 98 bp read 2, on a 200-cycle run.", "concl": ""}, {"type": "qa", "section": "Methods - snRNA-seq data processing", "q": "How were reads aligned, counted and cleaned of ambient RNA?", "a": "Reads were aligned to the AstMex3_surface reference (NCBI GCF_023375975.1) with CellRanger v7.2.0 (mkref and count, default parameters). Ambient signal was removed with cellbender remove-background v0.3.0 using default parameters.", "kw": ["CellRanger", "CellBender", "AstMex3"], "info": "The NCBI GTF was converted to a CellRanger-compatible format with a custom script (WarrenLab/cleanup-ncbi-gtf).", "concl": ""}, {"type": "qa", "section": "Methods - snRNA-seq data processing", "q": "What QC filters and clustering steps were used?", "a": "In scanpy v1.9.8 they removed cells with fewer than 200 or more than 4,000 genes, more than 10,000 counts, or more than 2% ribosomal counts. They then normalized, log-scaled, chose highly variable genes, regressed out counts per cell, ran PCA, integrated by sample with harmony, and ran leiden clustering at resolution 1.0, visualized with UMAP.", "kw": ["scanpy", "harmony", "leiden"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - spatial data", "q": "How were the spatial data generated and filtered?", "a": "With the Curio Seeker Slide-seq workflow on sagittal cryosections of one OCT-embedded female surface brain. Reads were processed with a STAR v2.6.1d reference (--sjdbOverhang 50) and the Curio Seeker pipeline v2.0.0, and barcodes with log10 counts below 1.9 were removed, along with barcodes in 40 um windows with fewer than 7 barcodes and 100 um windows with fewer than 17.", "kw": ["Slide-seq", "Curio Seeker", "STAR"], "info": "Sectioning targeted the optic lobe, pituitary, pineal gland, cerebellum and olfactory lobe.", "concl": ""}, {"type": "qa", "section": "Methods - spatial data", "q": "How were spatial barcodes labelled with nuclei clusters?", "a": "Spatial and nuclei PCA bases were integrated with harmony (15 iterations). Each spatial barcode got the most common cluster among its 5 nearest nuclei, and no label if all five were in different clusters.", "kw": ["label transfer", "harmony"], "info": "Genes present in fewer than 3 cells in the spatial data were filtered out before processing.", "concl": ""}, {"type": "qa", "section": "Methods - cluster annotation", "q": "How were cell types annotated?", "a": "Marker genes per cluster came from a t-test with overestimated variance (|log2FC| > 1, p < 0.01). These were compared manually with known markers, especially a zebrafish brain atlas (Pandey et al. 2023), and with mouse and human databases such as ScType, plus spatial location.", "kw": ["ScType", "elavl3", "apoeb"], "info": "Neurons were identified by elavl3/elavl4 (HuC), then split by neurotransmitter markers and VGLUT type. Immune types were based on an earlier A. mexicanus head kidney study (Peuss et al. 2020). apoeb marks microglia.", "concl": ""}, {"type": "qa", "section": "Methods - differential composition", "q": "Which tool tested composition differences?", "a": "scCODA v0.1.9, with population (cave vs surface) and sex as covariates and FDR = 0.05.", "kw": ["scCODA"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - hierarchical clustering and NMI", "q": "How exactly was NMI-weighted node depth computed?", "a": "At each internal node of the UPGMA tree they made one vector coding leaves as left (0) or right (1) descendants and another coding the factor as integers, then computed normalized mutual information between them. They took the NMI-weighted mean of node depth per factor, with 95% CIs from 10,000 bootstrap iterations.", "kw": ["NMI", "bootstrap"], "info": "The tree came from scanpy's dendrogram function with method=average on the first 20 PCs.", "concl": ""}, {"type": "qa", "section": "Methods - differential expression", "q": "How was differential expression tested?", "a": "Pseudobulk: counts were summed per sample within each cell type and run in pydeseq2 v0.4.8 with sex and population as design factors. A gene was a DEG at |log2FC| > 1 and adjusted p < 0.01.", "kw": ["pydeseq2", "pseudobulk"], "info": "As the null control, they split all individuals randomly into two equal groups and reran the analysis with that grouping as the only covariate.", "concl": ""}, {"type": "qa", "section": "Methods - pathway enrichment", "q": "How was pathway enrichment done?", "a": "With Ingenuity Pathway Analysis (IPA), using a right-tailed Fisher's exact test and Benjamini-Hochberg-adjusted p-values. A z-score estimates whether the direction of expression changes matches predicted activation or inhibition.", "kw": ["IPA", "z-score"], "info": "IPA uses mammalian knowledge, so it relies on orthology projection (see the Discussion limitation).", "concl": ""}, {"type": "qa", "section": "Methods - cell-cell communication", "q": "Which tools and databases were used for cell-cell communication?", "a": "LIANA+ with a database built from an A. mexicanus to human ortholog set (Roback et al. 2025), using ligand-receptor pairs curated in CellPhoneDB. Only interactions with p at most 0.05 were plotted, and Tensor-cell2cell was used for the multi-dimensional sender-receiver analysis.", "kw": ["LIANA+", "CellPhoneDB", "Tensor-cell2cell"], "info": "Normalized raw counts were the input.", "concl": ""}, {"type": "note", "section": "Methods - sample collection", "text": "Females were dissected in March 2023 and males in January 2024, so sex is confounded with dissection batch. How much of the sex effect (sex DEGs, more microglia and fewer B cells in males) could be a batch effect?"}, {"type": "note", "section": "Results - astrocyte to neuron communication", "text": "Astrocytes and quiescent radial glia are key senders in the cave-enriched Factor 4 but among the most surface-biased cell types in the DEG-based interaction counts. How do these fit together? Spatial data exist only for one surface female, so cave-specific spatial changes cannot be checked."}, {"type": "note", "section": "Discussion", "text": "Is the HIF1 change in astrocytes causally linked to sleep loss, and does the pro-senescence microglial state protect neurons under chronic metabolic stress? Worth checking the follow-up scATAC-seq and CRISPR work."}], "key": "amexicanus/Ricemeyer_2026_bioRxiv_cavefish_brain_cell_atlas", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "McGaugh_2014", "title": "The cavefish genome reveals candidate genes for eye loss", "category": "Genomes & structural variation", "link": "https://doi.org/10.1038/ncomms6307", "note": "", "source_pdf": "papers/amexicanus/McGaugh_2014_NatCommun_cavefish_genome.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "Which traits evolved repeatedly in cave populations of Astyanax mexicanus?", "a": "Eye degeneration, pigment loss, larger and more numerous taste buds and mechanosensory organs, and shifts in many behavioural traits.", "kw": ["repeated evolution", "troglomorphic traits"], "info": "Cavefish are presented as natural populations under strong environmental selection, which makes them useful for studying the genetics of evolutionary change.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What gap does the paper address, and what did they do?", "a": "Surface and cave forms are interfertile, so the system suits genetic study, but there was no reference genome to identify the genes behind cave traits. They produced the first de novo cavefish genome assembly, compared its repeats to other teleosts, found candidate genes under QTL and tested them for coding and expression differences.", "kw": ["de novo assembly", "QTL"], "info": "The authors also expect the genome to help understanding of analogous human diseases, such as retinal dysfunction.", "concl": "First reference genome for A. mexicanus, used to move from QTL regions to candidate genes for eye loss."}, {"type": "qa", "section": "Introduction", "q": "How many times did cave traits evolve independently in A. mexicanus?", "a": "Surface Mexican tetras colonized several caves in northeastern Mexico and evolved extreme cave-associated traits at least four independent times over the past 2 to 3 Myr.", "kw": ["parallel evolution", "convergent evolution"], "info": "The direction of trait change is known: the traits are derived in cavefish. These natural replicates can be used to study the genetics of parallel and convergent evolution.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which behavioural and physiological differences do cavefish show compared with surface fish?", "a": "Stronger attraction to vibrations, better olfaction, altered feeding angles, and loss of schooling and aggression. They also lose body weight more slowly and sleep much less than surface fish.", "kw": ["behaviour", "sleep loss"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How were candidate genes under cavefish QTL found before this genome existed, and why was that limited?", "a": "Candidates were inferred through syntenic comparisons with zebrafish. A de novo cavefish assembly allows more precise identification of the genes under each QTL.", "kw": ["synteny", "QTL"], "info": "Earlier QTL studies of surface x cave crosses had mapped many behavioural and morphological traits to genomic regions.", "concl": ""}, {"type": "qa", "section": "Results - sequencing and annotation", "q": "Which fish was sequenced?", "a": "A first-generation offspring of two wild-caught parents from Pachón cave, Tamaulipas, Mexico. Pachón cavefish are the most studied population and have the most extreme troglomorphic phenotypes.", "kw": ["Pachón"], "info": "At least 29 caves contain Astyanax cavefish. Methods: DNA came from the heart, liver, spleen and gill of a single 7-year-old adult female Pachón cavefish (Jeffery lab).", "concl": ""}, {"type": "qa", "section": "Results - sequencing and annotation", "q": "What are the main assembly statistics?", "a": "The draft is 964 Mb in 10,735 scaffolds, with contig N50 of 14.7 kb, scaffold N50 of 1.775 Mb and a longest scaffold of 9.823 Mb.", "kw": ["N50", "assembly"], "info": "The size is similar to that of a congeneric species in Brazil.", "concl": ""}, {"type": "qa", "section": "Results - sequencing and annotation", "q": "How many genes were annotated, and how many are one-to-one orthologs with zebrafish?", "a": "The Ensembl pipeline, using RNAseq evidence from eight tissues, predicted 23,042 protein-coding genes, similar to other teleosts. Of these, 16,480 are one-to-one orthologs with zebrafish.", "kw": ["Ensembl annotation", "orthologs"], "info": "Zebrafish is the closest sequenced relative of cavefish; they diverged about 250 Myr ago.", "concl": ""}, {"type": "qa", "section": "Results - sequencing and annotation", "q": "How did they check how much of the gene space the assembly captured?", "a": "Across tissue-specific transcriptomes, a median of 81% of transcripts aligned over at least 75% of their length with at least 90% identity. CEGMA found 95% of the 248 ultra-conserved core eukaryotic genes present and 69% complete.", "kw": ["CEGMA", "completeness"], "info": "They aligned the best open reading frames from assembled cavefish transcripts to the genome scaffolds.", "concl": "The assembly captured most of the protein-coding sequence."}, {"type": "qa", "section": "Results - transposable elements", "q": "How much of the cavefish genome is transposable elements, and which types dominate?", "a": "About one-third of the genome is TEs, similar to most fish genomes; the exceptions are zebrafish (52.2%) and Fugu (2.8%). DNA transposons (at least 12 superfamilies, 12.7% of the genome) are more abundant and diverse than retrotransposons (2.3%).", "kw": ["transposable elements", "DNA transposons"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - transposable elements", "q": "Which TE superfamilies made up the recent transposition wave in cavefish?", "a": "Mostly Tc-Mariner and hAT, which together make up about 9.5% of the cavefish genome.", "kw": ["Tc-Mariner", "hAT"], "info": "Zebrafish also had a recent large expansion of repeat families including Tc-Mariner and hAT. Stickleback did not.", "concl": ""}, {"type": "qa", "section": "Results - transposable elements", "q": "What is the Kimura distance, and how was it used for TEs?", "a": "It estimates the age of TE copies from their divergence to the family consensus, assuming most mutations in TE copies are neutral. K = -1/2 ln(1 - 2p - q) - 1/4 ln(1 - 2q), where p is the transition rate and q the transversion rate.", "kw": ["Kimura distance"], "info": "In Fig. 1, values run from 0 (recent copies) to 50 (old insertions). Only superfamilies above 0.1% genome content were plotted.", "concl": ""}, {"type": "qa", "section": "Results - transposable elements", "q": "Are the Tc-Mariner and hAT elements still active in cavefish?", "a": "Probably not many. Unlike zebrafish, the cavefish genome seems to lack very young elements, so it is unlikely that many copies are still active, and transcriptome analyses support this.", "kw": ["TE activity"], "info": "The authors note that assembly artefacts could explain the missing young elements.", "concl": ""}, {"type": "qa", "section": "Results - candidate genes under eye QTL", "q": "How does eye degeneration proceed during cavefish development?", "a": "Lens vesicles and optic cups form as in surface fish but are already smaller at 14 h.p.f. Lens apoptosis starts after 25 h.p.f. and retinal apoptosis at about 35 h.p.f. Apoptosis continues for days to weeks and arrests eye development.", "kw": ["apoptosis", "eye degeneration"], "info": "The eye is called the most distinct cavefish trait and was derived independently in several cave invasions.", "concl": ""}, {"type": "qa", "section": "Results - candidate genes under eye QTL", "q": "How many eye QTL were used, and how many genes fall under them?", "a": "Across studies they counted 15 non-overlapping QTL for eye-related phenotypes in the Pachón population. All genes on any scaffold carrying a QTL-linked marker were included, giving 2,408 of the 23,042 annotated genes.", "kw": ["QTL", "candidate genes"], "info": "Scaffolds often did not span a whole QTL critical region, so one QTL can be spread over several scaffolds. Many of these genes are probably linked to the causal variant without causing the phenotype themselves.", "concl": ""}, {"type": "qa", "section": "Results - candidate genes under eye QTL", "q": "Which developmental RNAseq data were used to narrow down the candidates?", "a": "A time course at 10 h.p.f., 24 h.p.f., 1.5 d.p.f. and 3 d.p.f. Each time point used RNA from 50 pooled whole individuals, sequenced separately for cave and surface fish on Illumina.", "kw": ["RNAseq", "time course"], "info": "Caveat: cavefish eyes are smaller even early on, so fewer transcripts may reflect smaller eyes rather than true downregulation. The same reads were used to call coding variants between morphs.", "concl": ""}, {"type": "qa", "section": "Results - candidate genes under eye QTL", "q": "What did the integrated pathway analysis predict from the expression data?", "a": "It implicated 30 genes under the QTL in congenital eye anomalies. Expression direction favoured more eye anomalies in cavefish at 10 h.p.f., 24 h.p.f. and 1.5 d.p.f. (12/27, 12/19 and 11/30 genes consistent; bias-corrected z >= 2.266, P < 0.0001).", "kw": ["Ingenuity Pathway Analysis", "congenital eye anomaly"], "info": "The analysis uses prior knowledge of how transcriptional regulators affect their targets. At 3 d.p.f. the direction was still consistent, but z scores shrank as development progressed and were not significant.", "concl": ""}, {"type": "qa", "section": "Results - candidate genes under eye QTL", "q": "Were eye QTL enriched for eye-related genes?", "a": "Yes for congenital eye anomaly genes: 30/1,560 in the QTL versus 159/12,040 overall (Yates chi-square = 4.48, P < 0.034, OR 1.57, 95% CI 1.05 to 2.35). Broader eye development, function and disease genes were not significantly enriched (129/1,560 vs 921/12,040, P = 0.35, OR 1.10).", "kw": ["enrichment test", "chi-square"], "info": "Data were combined across time points.", "concl": "Eye QTL are qualitatively enriched for eye genes, and quantitatively more likely to contain genes linked to congenital eye defects."}, {"type": "qa", "section": "Results - specific candidate genes", "q": "How were expression differences between cave and surface fish tested, and what is the caveat for linkage group names?", "a": "Log fold change tests in Cuffdiff 2.1.0, used for all differential expression P values unless stated otherwise. Linkage group names differ between studies, so each LG follows the naming of the original QTL study.", "kw": ["Cuffdiff"], "info": "Candidates were narrowed to genes with expression differences between morphs. The Methods name the expression step as Cufflinks 2.1.0.", "concl": ""}, {"type": "qa", "section": "Results - specific candidate genes", "q": "Why is cryaa a candidate?", "a": "It encodes an antiapoptotic chaperone whose missing expression had been proposed to play a role in cavefish eye degeneration. It lies under a QTL for eye size on LG27 (scaffold with marker Am229b, Protas et al.).", "kw": ["cryaa", "crystallin"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - specific candidate genes", "q": "What did they find for pitx3?", "a": "pitx3 is essential for lens development in zebrafish. Cavefish expression is significantly lower at 24 h.p.f. and 3 d.p.f. (P < 0.002) and qualitatively lower at all times, with only two synonymous coding differences.", "kw": ["pitx3", "lens"], "info": "In zebrafish, knockdown gives degenerate lens and retina and a misshapen lower jaw. pitx3 lies under a QTL for lens length on LG14 and for eye size on LG4.", "concl": ""}, {"type": "qa", "section": "Results - specific candidate genes", "q": "What about rx3?", "a": "rx3 lies under an eye size QTL on LG4 and its mutation causes eye loss in zebrafish (chokh) and medaka (eyeless). It is expressed significantly less in cavefish at 10 h.p.f. and 3 d.p.f. (P < 0.0003) and has no coding variants.", "kw": ["rx3", "chokh", "eyeless"], "info": "Qualitatively lower at all time points.", "concl": ""}, {"type": "qa", "section": "Results - specific candidate genes", "q": "Why are olfm2a and BCoR candidates?", "a": "olfm2a (eye size QTL, LG4) is significantly lower in cavefish at 3 d.p.f. (P < 0.001) and has no coding differences. BCoR (LG19) is linked to ocular colobomas, is lower at 10 h.p.f. (P < 0.013) and has four nonsynonymous differences, all at evolutionarily labile sites.", "kw": ["olfm2a", "BCoR", "coloboma"], "info": "Zebrafish olfm2 knockdown causes defects in olfactory pits, eyes and optic tectum, with reduced Pax6 in the eye. No data were available for olfml2a. The BCoR binding partner BCL6 controls optic cup morphogenesis through p53 in zebrafish.", "concl": ""}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "What is the potentially pleiotropic QTL on LG2?", "a": "One region where vibration attraction behaviour, eye size and superficial neuromast number at the orbit co-localize (LG2, Yoshizawa et al.). The same region appears as an eye size QTL in other studies (LG7, LG8, LG1) and as an inner nuclear layer thickness QTL (LG2, O'Quin et al.), so it is counted as a single QTL.", "kw": ["pleiotropy", "vibration attraction behaviour"], "info": "Co-localization has been taken as evidence that selection for some cave traits caused eye loss through pleiotropy. They focused on genes expressed in both morphs and not pseudogenized in cavefish.", "concl": ""}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "What does shisa2 do, and how is it expressed in cavefish RNAseq?", "a": "shisa2 inhibits Wnt and FGF signalling by keeping their receptors, Frizzled and FGFR, in the endoplasmic reticulum. It is expressed higher in cavefish at all time points (significant at 10 h.p.f., 24 h.p.f. and 1.5 d.p.f., P < 0.005) and has only one synonymous change.", "kw": ["shisa2", "Wnt", "FGF"], "info": "A paralog lies under an eye QTL on LG6. It has no coding differences, is higher in cavefish at 24 h.p.f. (P < 0.0003), not significant at 10 h.p.f. and 1.5 d.p.f., and lower at 3 d.p.f. (P < 0.0002).", "concl": ""}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "What did qPCR and in situ hybridization show for the two shisa2 genes at 36 h.p.f.?", "a": "qPCR showed no significant difference between morphs (Mann-Whitney U, P > 0.05), meaning less than twofold. In situ, shisa2-LG2 was in epidermis, olfactory epithelium and lens in surface fish, but lens expression was missing in cavefish. shisa2-LG6 had a more complex pattern with no obvious morph difference.", "kw": ["in situ hybridization", "qPCR", "shisa2"], "info": "shisa2-LG6 was expressed in branchial arches, cranial ganglia, epidermis, olfactory epithelium, retina and lens, as described in Xenopus and zebrafish.", "concl": "The missing shisa2 (LG2) lens expression suggests regulatory changes in this gene may contribute to cavefish eye loss."}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "Why did they look at otx2, and what did they find?", "a": "In Xenopus, shisa2 knockdown or mRNA injection changes expression of otx2, a key homeobox gene for head and eye development. In cavefish, otx2 head and brain expression looked like surface fish, but lens expression was much weaker at 48 h.p.f. Semi-quantitative RT-PCR at 40 h.p.f. also showed lower levels.", "kw": ["otx2", "lens"], "info": "otx2 could not be placed on a specific linkage group.", "concl": "A possible regulatory cascade involving shisa2 and otx2 in the developing lens may lead to cavefish eye loss."}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "Why should prox1 be looked at again?", "a": "prox1 was earlier considered unlikely to matter because its lens expression pattern is similar in both morphs. Here it had no sequence differences but significantly lower whole-organism expression in cavefish at 24 h.p.f., 1.5 d.p.f. and 3 d.p.f. (P < 0.022), consistent with more lens apoptosis.", "kw": ["prox1", "lens fibre"], "info": "prox1 regulates lens fibre elongation and the exit of retinal progenitors from the cell cycle. Knockdown disrupts gamma-crystallin expression and causes lens apoptosis. Expression was marginally higher in cavefish at 10 h.p.f. (P = 0.083). In neuromast hair cells and taste bud cells it is only expressed from 96 h.p.f.", "concl": ""}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "What did they find for AIFM1 and its paralog AIFM2?", "a": "AIFM1 loss causes progressive optic atrophy in Harlequin mice. In cavefish it is lower at 24 h.p.f. (P < 0.003) and has an intronic splice region variant plus five nonsynonymous variants, two apparently derived in cavefish but predicted tolerated by SIFT. AIFM2, under the LG14/LG4 eye QTL, is lower at 10 h.p.f., 24 h.p.f. and 3 d.p.f. (P < 0.022) and has two splice region variants fixed between morphs.", "kw": ["AIFM1", "AIFM2", "SIFT"], "info": "The Harlequin phenotype can be rescued with an AIFM1 expression vector. One AIFM2 splice variant is also nonsynonymous, putatively derived in cavefish and predicted tolerated. AIFM2 at 1.5 d.p.f.: P = 0.095.", "concl": ""}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "What about crxa and tbx2a, which were also found by O'Quin et al.?", "a": "crxa (photoreceptor differentiation) is lower in cavefish at 1.5 and 3 d.p.f. (P < 0.001) with no sequence differences. tbx2a is lower at all time points and has three nonsynonymous differences, of which only D401E seems derived in cavefish, and SIFT predicts it tolerated.", "kw": ["crxa", "tbx2a"], "info": "crxa knockdown in zebrafish downregulates phototransduction genes, and crxa is implicated in eye reduction in Sinocyclocheilus anophtalmus. crxa could not be tested at the other time points. For tbx2a, P < 0.07 at 1.5 d.p.f. and P < 0.001 elsewhere, so 'lower at all time points' includes one value that is only marginal.", "concl": ""}, {"type": "qa", "section": "Results - pleiotropic QTL", "q": "Why is the second co-localizing QTL (LG17) less informative?", "a": "The scaffolds did not cover several markers in the centre of the QTL (208e, 205d and 221a). The genes found there were less compelling than those on LG2.", "kw": ["scaffold coverage"], "info": "The authors expect future genome drafts to reveal more candidates in this region.", "concl": ""}, {"type": "qa", "section": "Results - other cave phenotypes", "q": "Which candidate genes did they note for pigmentation, taste buds and teeth?", "a": "mc1r, known to be mutated in Pachón, lies under the QTL for melanocyte number in four body regions (LG9). A taste bud number QTL (LG5) contains the serotonin receptor htr2a. A maxillary tooth number QTL (LG13) contains dact2, which inhibits dlx2 during mouse tooth formation.", "kw": ["mc1r", "htr2a", "dact2"], "info": "Serotonin signalling is involved in taste cell development and signal transduction. dlx2 knockout mice have fewer molars.", "concl": ""}, {"type": "qa", "section": "Results - putative gene losses", "q": "How did they look for genes lost in the cavefish lineage?", "a": "They looked for genes present in zebrafish and eight other actinopterygian teleosts in Ensembl but missing in cavefish. These genes were not enriched for 305 GO accessions related to eye development or function, and ZFIN anatomical expression and predicted phenotype data gave similar results.", "kw": ["gene loss", "gene ontology", "ZFIN"], "info": "", "concl": ""}, {"type": "qa", "section": "Results - putative gene losses", "q": "How did they check whether a missing gene was still transcribed?", "a": "They assembled 10 transcriptomes with Trinity (8 tissues plus the surface and cave time courses), predicted ORFs with Transdecoder and ran BLASTn of the longest ORFs against zebrafish coding sequences (Ensembl Genes 74) with an e-value cutoff below 1E-100. Some genes seemed to lack a cavefish transcript but had a surface fish one.", "kw": ["Trinity", "Transdecoder", "BLASTn"], "info": "Results were robust for e-value cutoffs from 1E-20 to 1E-100. Every putatively missing cavefish transcript they tried to confirm by reverse transcription was in fact detected.", "concl": "There is no confirmed cavefish-specific gene loss."}, {"type": "qa", "section": "Results - putative gene losses", "q": "Which gene families are preliminary candidates for gene loss?", "a": "Families involved in vision (retinol dehydrogenases, crystallins, sine oculis homeoboxes, opsins and rhodopsins including melanopsin), development, and sleep and circadian regulation (FGFs, GABA-A receptors, dopamine receptors). Several genes whose knockout causes hyperlocomotion in mice or zebrafish also seem absent.", "kw": ["opsins", "melanopsin", "circadian"], "info": "Members were not annotated in the genome and not found in surface or cave transcriptomes. The naked mole rat, which also lives in darkness with reduced eyes, lost genes from similar families. Large gene families are often misassembled or misannotated in draft genomes, so these results are very preliminary.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What are the strengths and limits of the pathway approach?", "a": "The pathway analysis predicted the reduced-eye phenotype from expression direction, and this was one of the most significant predicted downstream phenotypes. But IPA contains only human, mouse and rat orthologs, and about 89% of QTL genes (2,013/2,408) matched.", "kw": ["Ingenuity Pathway Analysis", "orthology"], "info": "The Methods say only 65% (1,560/2,408) were 'analysis-ready', because some genes lacked enough expression data.", "concl": "Pathway databases need nonmammalian models such as zebrafish and Drosophila."}, {"type": "qa", "section": "Discussion", "q": "What do crosses between different caves tell us about the genetics of cave traits?", "a": "Crosses between fish from different caves complement and restore some cave phenotypes, such as rudimentary eyes. So at least some of the genetic changes are unique to each cave lineage.", "kw": ["complementation", "repeated evolution"], "info": "Surface populations provide standing genetic variation for the caves, and the system can be used to study adaptation in the face of gene flow.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "What limitations and next steps do the authors name?", "a": "The genome is not anchored to a chromosome-scale map, which population genomic work needs. A better draft using long reads and a genotyping-by-sequencing linkage map was underway, alongside population genomics of several cave and surface localities.", "kw": ["chromosome-scale assembly", "population genomics"], "info": "The improved draft should help study selection, drift, migration and genetic architecture behind the replicated phenotypes.", "concl": ""}, {"type": "qa", "section": "Discussion", "q": "How can candidate genes be validated in this system, and what is the wider relevance?", "a": "In cavefish: mRNA injection into embryos and meganuclease- or transposase-based transgenesis. In the close relative zebrafish: methods such as TALEN gene editing.", "kw": ["transgenesis", "TALENs"], "info": "", "concl": "The genome should help dissect constructive and degenerative cave traits, study repeated evolution, and model human conditions such as sleep disorders and congenital eye defects."}, {"type": "qa", "section": "Methods - genome sequencing and assembly", "q": "How was the genome sequenced and assembled?", "a": "With a genome size estimate of 1.19 Gb, they generated about 95x Illumina coverage (short-insert paired-end plus 3, 8 and 40 kb mate-pair libraries) and assembled with ALLPATHS to 70x assembled coverage. The assembly is called Astyanax mexicanus 1.0.2.", "kw": ["ALLPATHS", "Illumina", "mate-pair"], "info": "Gaps were filled with a version of IMAGE modified for large genomes. Contaminating contigs were removed with MegaBLAST against adapter, bacterial and vertebrate databases.", "concl": ""}, {"type": "qa", "section": "Methods - QTL location in the assembly", "q": "How were QTL markers placed on scaffolds?", "a": "689 RAD-tag, microsatellite and cDNA markers with linkage map positions were aligned to scaffolds with BLASTn, keeping only the top hit with an e-value of 1E-20. This placed 340 scaffolds (574 Mb) on linkage groups.", "kw": ["BLASTn", "RAD-tag", "linkage map"], "info": "Microsatellites with only primer sequences: word size 7, e-value < 1E-1, identity > 99%. Two Danio rerio cDNAs: identity of 85% or more. Nine scaffolds mapping to different LGs were excluded, and three single incongruent markers were dropped. A. mexicanus has 25 haploid chromosomes, and the markers covered 24 LGs. 219 single-marker scaffolds got random orientation; 121 scaffolds (about 339 Mb) with two or more markers were oriented.", "concl": ""}, {"type": "qa", "section": "Methods - repetitive landscape", "q": "How were repeats annotated?", "a": "With RepeatModeler (default parameters), following the universal TE classification. The library was filtered against Uniprot proteins and supplemented by manual BLAST searches with known TE proteins. Scaffolds were masked with RepeatMasker 3.3.0 using the cavefish-specific library (--lib, --align).", "kw": ["RepeatModeler", "RepeatMasker"], "info": "For TE transcription, three assembled transcriptomes (muscle, brain and whole eye of surface fish) were masked the same way. Over- or under-representation was measured as the family percentage times 100 divided by total repeat content in the genome or transcriptome.", "concl": ""}, {"type": "qa", "section": "Methods - RNAseq", "q": "Which RNAseq data were generated for annotation?", "a": "Tissue-specific 100 bp paired-end Illumina reads from brain, heart, kidney, liver, muscle, nasal cavity and skin of adult Pachón cavefish, plus eyes of adult surface fish from Texas. One to six individuals were pooled per tissue, except eyes, which came from one surface fish.", "kw": ["RNAseq", "genome annotation"], "info": "Gene models came from iterative Ensembl steps using similarity to teleost gene models plus ab initio prediction. Models were extended into UTRs and validated with RNAseq. A second, unused NCBI gene set also exists.", "concl": ""}, {"type": "qa", "section": "Methods - RNAseq", "q": "How was the developmental time-course RNAseq processed?", "a": "Each time point had three TruSeq2 libraries made from the same RNA pool (technical replicates). Reads were trimmed with Fastx_trimmer (first base) and Trimmomatic v0.30 (Q30 over a 4 bp sliding window, reads under 30 nt removed), then aligned with TopHat2 (max intron length 10,000).", "kw": ["Trimmomatic", "TopHat2", "Cufflinks"], "info": "Cufflinks 2.1.0 was run with --frag-bias-correct --multi-read-correct --upper-quartile-norm --compatible-hits-norm. Cuffdiff was run with --frag-bias-correct --multi-read-correct --FDR 0.1 --dispersion-method per-condition. Replicates are technical only, not biological.", "concl": ""}, {"type": "qa", "section": "Methods - transcript variant analyses", "q": "How were coding variants between cave and surface fish called?", "a": "Reads were pooled per morph, mapped with TopHat2 and turned into mpileups with Samtools v0.1.19. VarScan v2.3.6 called 'somatic' variants with surface as 'normal' and cave as 'tumour'. Only differences fully fixed between morphs were kept, and Variant Effect Predictor v73 classified them.", "kw": ["VarScan", "Variant Effect Predictor", "SIFT"], "info": "At most 15 Pachón parents (9 from Line 163, 6 from Line 138) and 3 surface fish contributed. These lab stocks are likely somewhat inbred, giving little power for allele frequencies. Derived states were inferred by ClustalW alignment with zebrafish, coelacanth, spotted gar, stickleback and platyfish orthologs, and SIFT predicted impact. Caveat: a 'derived' cavefish variant may exist in unsampled surface standing variation.", "concl": ""}, {"type": "qa", "section": "Methods - identification of candidate genes", "q": "Which criteria were used to prioritize candidate genes outside IPA?", "a": "Genes were prioritized if they (1) were differentially expressed at one or more time points, (2) carried at least one fixed nonsense or missense difference, or (3) were expressed in an eye structure during zebrafish development (ZFIN) or had eye, retina, lens or optic GO annotations.", "kw": ["prioritization", "ZFIN"], "info": "IPA's analysis-ready pool contained 65% (1,560/2,408) of QTL genes. Enrichment tests used only this filtered set, which excludes duplicate Entrez gene names and genes without expression data.", "concl": ""}, {"type": "qa", "section": "Methods - qPCR and in situ hybridization", "q": "How were the shisa2 qPCR and otx2 RT-PCR done?", "a": "shisa2: 36 h.p.f. embryos, SYBR green qPCR on a QuantStudio 12K Flex with Gapdh and Actb1 as references, n = 3 pools of 10 to 15 larvae per morph. otx2: semi-quantitative RT-PCR on 40 h.p.f. larvae (857 bp product, 35 cycles), with 18S rRNA (343 bp, 25 cycles) as control.", "kw": ["qPCR", "semi-quantitative RT-PCR"], "info": "shisa2 work used surface fish from San Solomon Spring (Balmorhea State Park, Texas) and Pachón fish from the Jeffery lab (obtained 2004 to 2006). In situ hybridization used DIG-labelled riboprobes. otx2 embryos were also sectioned at 15 micrometres.", "concl": ""}, {"type": "note", "section": "Results - pleiotropic QTL", "text": "Is the missing shisa2-LG2 lens expression a cause of lens degeneration or a consequence of a smaller, degenerating lens? The cis-regulatory change was proposed but not tested."}, {"type": "note", "section": "Results - candidate genes under eye QTL", "text": "Whole-embryo pooled RNAseq cannot separate true downregulation from smaller eyes in cavefish. How many 'lower expression' candidates survive tissue-specific or allele-specific expression tests?"}, {"type": "note", "section": "Results - putative gene losses", "text": "Revisit the putative losses of vision, sleep and circadian gene families (Supplementary Data 19) with the chromosome-scale, long-read assemblies to separate real losses from draft assembly errors."}], "key": "amexicanus/McGaugh_2014_NatCommun_cavefish_genome", "shared": "Damir · 2026", "preprint": "", "tags": [], "nostar": false, "source_note": ""}, {"id": "Lal_2025", "title": "Loss of Conserved Noncoding Elements Likely Shaped the Evolution of Regressed Phenotypes in Cavefish", "category": "Genomes & structural variation", "link": "https://doi.org/10.1093/gbe/evaf211", "note": "", "source_pdf": "papers/amexicanus/Lal_2025_GBE_conserved_noncoding_element_loss.pdf", "items": [{"type": "qa", "section": "Abstract", "q": "What problem does this paper address?", "a": "Only a small number of protein-coding variants have been found in Astyanax mexicanus cave morphs, so most of the large phenotypic gap between cave and surface morphs is still unexplained.", "kw": ["Astyanax mexicanus", "regressive evolution"], "info": "Traits that differ between the morphs include vision, brain morphology, behavior, pigmentation, metabolism and hypoxia tolerance.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did they do and what was the headline result?", "a": "They aligned the genomes of five closely related teleosts and identified 46,914 conserved noncoding elements (CNEs). Of these, 473 were specifically lost in cave morphs.", "kw": ["CNEs", "genome alignment"], "info": "46,914 matches the sum of 46,330 CNEs conserved in all five fishes, 473 cave-lost and 111 surface-lost CNEs (Fig. 1c). The abstract total therefore includes the lost sets.", "concl": "Loss of distal regulatory elements may have dampened developmental pathways and contributed to phenotypic regression in cave morphs."}, {"type": "qa", "section": "Abstract", "q": "How were the CNEs characterised functionally?", "a": "Using zebrafish data, the CNEs carried activating histone modifications, contained binding sites for neuronal transcription factors and contacted their cognate genes through chromatin loops. Genes next to cave-lost CNEs were important for eye and nervous system development and were gradually downregulated during cave morph embryonic development.", "kw": ["zebrafish", "chromatin loops", "histone marks"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Which convergent phenotypes do cave-adapted species show?", "a": "Species from several phyla have independently adapted to caves and show convergent loss of vision, albinism, hypoxia tolerance, distinct neuroanatomy and altered behavior.", "kw": ["convergent evolution", "troglomorphy"], "info": "The authors say the genetic basis of these phenotypes is not fully understood.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Is apoptosis of the lens the only mechanism behind eye loss in cavefish?", "a": "No. Cavefish lens primordia form and then degenerate by apoptosis, but the optic vesicles are already smaller than in surface fish before any degeneration, and the optic cup is absent.", "kw": ["eye regression", "apoptosis", "optic vesicle"], "info": "This is the basis for their hypothesis that other mechanisms, independent of apoptosis, also contribute to eye regression.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What other cave morph phenotypes besides the eye do they list?", "a": "Smaller brain mass with a regressed optic tectum and periventricular grey zone, an enlarged hypothalamus, and craniofacial changes such as bone fragmentation and fusion. Behavioral changes include loss of circadian rhythm, swimming handedness, a more sensitive lateral line, more foraging and social avoidance.", "kw": ["neuroanatomy", "behavior", "craniofacial"], "info": "Several craniofacial changes arose independently of eye regression. A protruded lower jaw is probably a constructive adaptation for altered feeding. Some behavioral changes are partly attributed to the enlarged hypothalamus.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Why look at regulatory elements rather than coding mutations?", "a": "Apart from a few lesions that partly explain eye and melanin loss, few inactivating gene mutations have been found in cavefish. Between human and mouse, expression divergence driven by cis-regulatory changes correlates more strongly with phenotypic divergence than coding divergence does.", "kw": ["cis-regulatory elements", "expression divergence"], "info": "Precedents they cite: noncoding element changes linked to human cognition, social behavior, vocal tract, wrist and digit development and loss of the penile spine, and divergence of limb regulatory elements in limb-regressed snakes.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are CNEs and why are they relevant in teleosts?", "a": "Conserved noncoding elements are noncoding sequences conserved across vertebrates. Most act as binding sites for DNA-binding proteins and often lie near development-related genes. Teleosts show rapid evolutionary turnover and divergence of CNEs.", "kw": ["CNEs", "teleost CNE turnover"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What hypothesis did they test?", "a": "That mutations in regulatory elements serving as transcription factor binding sites changed gene regulatory circuitry in cave morphs. They tested this as whether CNE loss in cave morphs explains the evolution of regressed and diverged phenotypes.", "kw": ["hypothesis"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - CNE identification", "q": "How did they choose how many species to use for defining CNEs?", "a": "They aligned 12 teleost genomes one after another in order of phylogenetic closeness and counted CNEs as a function of the number of species in which each CNE was conserved. The steepest drop in CNE number came after five fishes (four species).", "kw": ["species selection", "phylogenetic closeness"], "info": "Fig. 1a plots CNE number and the fold change from i to i+1 fishes.", "concl": ""}, {"type": "qa", "section": "Results and discussion - CNE identification", "q": "Which five fishes were used?", "a": "A. mexicanus surface morph, A. mexicanus cave morph, Pygocentrus nattereri, Ictalurus punctatus and Danio rerio.", "kw": ["Pygocentrus nattereri", "Ictalurus punctatus", "Danio rerio"], "info": "These had chromosome-level assemblies at 33 to 77x coverage with scaffold N50 of 26 to 52 Mb, except D. rerio (N50 = 2.2 Mb). Zebrafish was included mainly so the CNEs could be characterised functionally. The main text does not say which cave population's assembly was used (assembly details are in Table S1).", "concl": ""}, {"type": "qa", "section": "Results and discussion - CNE identification", "q": "How many CNEs were conserved, cave-lost and surface-lost?", "a": "46,330 CNEs were conserved across all five fishes. The cave morph independently lost 473 CNEs and the surface morph lost 111.", "kw": ["cave-lost CNEs", "surface-lost CNEs"], "info": "", "concl": "The cave morph lost about four times as many CNEs as the surface morph."}, {"type": "qa", "section": "Results and discussion - CNE identification", "q": "Which chromatin marks do the CNEs carry in zebrafish embryos?", "a": "Mainly the enhancer marks H3K27ac and H3K4me1, to a lesser extent the promoter mark H3K4me3, and not the repressive mark H3K27me3. This was in 48 hpf zebrafish embryos.", "kw": ["H3K27ac", "H3K4me1", "enhancers"], "info": "Heatmaps are centred on conserved, cave-lost and surface-lost CNEs (Fig. 1d).", "concl": "The CNEs behave like enhancer-type distal regulatory elements."}, {"type": "qa", "section": "Results and discussion - CNE identification", "q": "Where are the CNEs located relative to TADs?", "a": "They are enriched in TAD interiors and depleted at the gene-rich TAD borders.", "kw": ["TADs"], "info": "TADs come from 48 hpf zebrafish Hi-C. The authors say this fits the known link between CNE synteny and TAD structure.", "concl": ""}, {"type": "qa", "section": "Results and discussion - CNE identification", "q": "What evidence shows the CNEs contact their nearby genes?", "a": "Virtual 4C from 48 hpf zebrafish embryo Hi-C showed that CNEs contact the TSS of the proximal gene more often than flanking regions of matched size do.", "kw": ["Hi-C", "virtual 4C"], "info": "Shown in Fig. 1f for conserved, cave-lost and surface-lost CNEs.", "concl": "Supports the idea that the CNEs regulate nearby genes."}, {"type": "qa", "section": "Results and discussion - functional enrichment", "q": "What functions are enriched among genes near cave-lost CNEs?", "a": "Cell adhesion, peripheral nervous system development, retina morphogenesis in a camera-type eye, rhombomere development, neuromast hair cell differentiation and related terms. To a lesser extent, steroid hormone mediated signaling was also enriched.", "kw": ["GREAT", "GO enrichment", "eye development"], "info": "They suggest steroid hormone enrichment may relate to starvation-resistant fertility and larger maternal deposits in cave morph embryos. Several genes in this term (Esrrg, Rorb, Nr2e3) are also linked to eye development and downregulated in cave morphs.", "concl": "Cave-lost CNEs are non-randomly associated with vision, brain and lateral line phenotypes."}, {"type": "qa", "section": "Results and discussion - functional enrichment", "q": "What about genes near surface-lost CNEs?", "a": "They showed only moderate fold enrichment of broad terms such as regulation of gene expression, muscle development and regulation of RNA metabolism.", "kw": ["surface-lost CNEs"], "info": "These terms are common around CNEs across clades. The authors say surface CNE loss may be evolutionarily neutral, or may reflect a relaxation of constraint that has not been explored.", "concl": ""}, {"type": "qa", "section": "Results and discussion - functional enrichment", "q": "What did the expression ontology (in situ) analysis show?", "a": "Genes near cave-lost CNEs were significantly enriched for nervous system expression terms. Genes near surface-lost CNEs showed no enriched term.", "kw": ["TopAnat", "in situ hybridization"], "info": "Enriched terms shown have Benjamini-Hochberg FDR at or below 0.1. Examples include central nervous system, brain, telencephalon, retina, ganglionic layer of retina and optic stalk, plus some tooth and pharyngeal skeleton terms (Fig. 2c).", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell expression and motifs", "q": "In which zebrafish cell types are genes near cave-lost CNEs most highly expressed?", "a": "Compared with genes near conserved CNEs, they have higher expression in retinal and brain neurons of zebrafish embryos.", "kw": ["scRNA-seq", "zebrafish"], "info": "Cell types were ranked by the difference in mean expression and only the top 50 are shown. The top-ranked cell types include epiphysis, mid-hindbrain boundary neurons, oligodendrocytes and cranial ganglia (Fig. 3a).", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell expression and motifs", "q": "Which example genes did they show on the zebrafish UMAP?", "a": "Lhx1a and Pcdh17, both key genes in teleost retinal development, are expressed specifically in eye and neural cells.", "kw": ["Lhx1a", "Pcdh17"], "info": "Controls were Gna12a and Rras2, genes from the bottom of the GO enrichment list.", "concl": ""}, {"type": "qa", "section": "Results and discussion - single-cell expression and motifs", "q": "Which transcription factor motifs are enriched in cave-lost CNEs?", "a": "Compared with conserved CNEs, cave-lost CNEs were enriched for binding sites of nervous system related transcription factors. Lhx4 and Meis2 ranked near the top, and both are known to act in eye and nervous system development.", "kw": ["Lhx4", "Meis2", "motif enrichment"], "info": "Fig. 3d gives e-values of 0.00019 for Lhx4 and 0.00085 for Meis2, and both are expressed in eye and neural cells. GO analysis of the enriched TFs gave terms such as nervous system process, cognition, and learning or memory. No GO terms were enriched for TFs whose sites were specific to surface-lost CNEs.", "concl": ""}, {"type": "qa", "section": "Results and discussion - developmental expression", "q": "Are genes near cave-lost CNEs expressed less in cavefish?", "a": "Yes. Using developmental time-course data from cave and surface morphs, genes near cave-lost CNEs were progressively downregulated during embryonic development compared with genes near conserved or surface-lost CNEs.", "kw": ["downregulation", "developmental time course"], "info": "Fig. 4a shows log2 cave-to-surface fold change at 10, 24, 36 and 72 hpf and in adult brain, tested with Mann-Whitney U tests.", "concl": "CNE loss goes together with reduced expression of nearby genes in cave morphs."}, {"type": "qa", "section": "Results and discussion - developmental expression", "q": "When does the downregulation appear?", "a": "It coincides with post-segmentation eye growth and brain patterning stages, around 36 hours post-fertilization, when eye growth is known to arrest in cave morphs.", "kw": ["36 hpf", "eye growth arrest"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - developmental expression", "q": "Did nervous system genes alone show the same pattern?", "a": "The pattern was consistent with the full gene sets, but the P-values were not significant because the samples were small.", "kw": [], "info": "Shown in Fig. S1. They ran this because each gene set was enriched for different functional terms.", "concl": ""}, {"type": "qa", "section": "Results and discussion - example loci", "q": "What is the Lhx9 example?", "a": "Cave-lost CNEs lie in the upstream intergenic region of Lhx9, a LIM homeodomain TF needed for retinal amacrine cell types that regulate nitric oxide release. Lhx9 is downregulated in cave morph embryos.", "kw": ["Lhx9", "amacrine cells", "nitric oxide"], "info": "NO regulates other retinal cells and ocular blood flow, and is implicated in glaucoma and diabetic retinopathy. Fig. 4b combines PhyloP/MultiZ conservation, zebrafish histone marks at 24 and 48 hpf, cave/surface expression ratios and single-cell expression.", "concl": "Loss of the CNE together with Lhx9 downregulation may have contributed to eye regression."}, {"type": "qa", "section": "Results and discussion - example loci", "q": "What is the Chd4 / Fezf2 example?", "a": "Two CNEs near the Chd4, Fezf2 and Orgf gene cluster are lost in cave morphs, and nearby genes are downregulated during embryogenesis. Chd4 remodels chromatin to control retinal cell type specification. Fezf2 acts in differentiation and maturation of cone ON/OFF bipolar cells.", "kw": ["Chd4", "Fezf2", "Orgf"], "info": "Chromatin loops are shown from H3K4me3 HiChIP of 48 hpf embryos and from adult brain Hi-C. Orgf pathway dysregulation is linked to corneal surface problems in mammals. The figure labels the gene 'cdh4' and 'Orgf1/2' while the text says Chd4. The naming is inconsistent in the paper.", "concl": ""}, {"type": "qa", "section": "Results and discussion - example loci", "q": "Which other example genes are mentioned?", "a": "Rorb, a key gene in retina differentiation, and Emx2, which works with Pax6 to regionalise the cerebral cortex.", "kw": ["Rorb", "Emx2"], "info": "Shown in Fig. S2. In most examples the CNEs or their immediate flanks had activating histone marks in zebrafish embryos.", "concl": ""}, {"type": "qa", "section": "Results and discussion - conclusions and limitations", "q": "What do the authors conclude?", "a": "CNE loss probably weakened developmental pathways for the eye and nervous system in cave morphs, contributing to regression of those phenotypes.", "kw": ["regressive evolution"], "info": "They suggest CNE knockouts in surface morphs as the next experiment.", "concl": "Turnover of noncoding regulatory elements may have shaped cavefish adaptation."}, {"type": "qa", "section": "Results and discussion - conclusions and limitations", "q": "What limitations do the authors acknowledge?", "a": "The results are correlative, so genetic experiments are needed to validate them. The epi
