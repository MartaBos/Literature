 hotspots in the genome where a catalogue of diverse cave traits have been mapped to.", "concl": "Issue is that only single cave population has been used, mostly."}, {"type": "qa", "section": "Introduction", "q": "Do individual cave populations exhibit variation in traits shifts?", "a": "Yes, there are differences in differences in sleep duration, fat deposition, metabolic responses to fasting, and early eye morphology.", "kw": [], "info": "", "concl": "Mixture of shared and lineage-specific genetic mechanisms."}, {"type": "qa", "section": "Introduction", "q": "What is the possible connection between eye loss, sleep loss and other traits?", "a": "Eye loss reduces metabolic demand, metabolic shifts influence sleep regulation, sleep and circadian rhythm genes in turn affect energy balance and eye disorders impact circadian functioning and sleep quality.", "kw": [], "info": "", "concl": "Phenotypic correlations might stem from that shared molecular mechanisms as feeding and sleep behaviors are regulated by some of the same neuropeptides, neurocircuitry, and circadian rhythm controllers."}, {"type": "qa", "section": "Introduction", "q": "What is QTL used for in this study?", "a": "Three cave x surface F2 populations. 1) whether the genetic bases of a variety of traits is repeatable across independent populations, 2) whether suites of traits co-localize in the genome, 3) whether co-localization of traits in the genome is repeated across multiple populations.", "kw": [], "info": "The extent of genetic repeatability varies by trait. Little evidence for widespread co-localization of sleep, eye loss, and metabolic traits in the genome both within a single population or repeated across populations.", "concl": "One instance shared genetic architecture among independent lineages of cavefish."}, {"type": "note", "section": "Introduction", "text": "Methods are skipped for now."}, {"type": "qa", "section": "Results", "q": "They used eye, sleep, and metabolic phenotypes among 21 dpf larval fish, from how many populations?", "a": "Three cave and one surface parent population.", "kw": [], "info": "Eight of the traits we measured were significantly different between one or more cave and surface populations at 21 dpf.", "concl": "Traits are eye size, total sleep duration across 24 hours, average sleep bout duration across 24 hours, average sleep bout duration during the night, average sleep bout duration during the day, total number of nighttime sleep bouts, nighttime total sleep duration, and total Artemia nauplii eaten"}, {"type": "qa", "section": "Results", "q": "Why they used correlation between phenotypes in the F2 hybrid individuals?", "a": "To see are the traits inherited together - the weak positive correlations among eye size, sleep, and total eaten traits in hybrids suggests that they are partially correlated at the genetic level.", "kw": [], "info": "", "concl": "Repeated yet weak correlations among phenotypes within populations"}, {"type": "qa", "section": "Results", "q": "What is Joint Mapping Approach?", "a": "Combining data from all three groups into one master search instead of analyzing each group separately.", "kw": [], "info": "Combining the data gives scientists much more statistical power to find hidden genes that might be missed in smaller groups.", "concl": "Sleep, feeding, and eye development have a highly polygenic architectures in cavefish"}, {"type": "qa", "section": "Results", "q": "What was found with previous?", "a": "48 QTL across 31 Regions: Scientists found 48 individual genetic signposts connected to cave traits. Many of these overlap, reducing them to 31 master regions across 19 chromosomes.", "kw": [], "info": "15 regions for eye size: Many genes influence how eyes shrink or disappear in cave fish.; 0 regions for sleep loss: Multiple genetic zones govern how cave fish adapt to needing less sleep.; 3 regions for total Artemia eaten: A few genetic regions drive feeding appetite/behavior (Artemia are brine shrimp). 1 region for early onset of adiposity: Exactly one region triggers the fish to start storing body fat earlier in life (helpful for surviving long stretches without food in dark caves).", "concl": "Sleep, feeding, and eye development have a highly polygenic architectures in cavefish"}, {"type": "qa", "section": "Results", "q": "Genomic repeatability?", "a": "Repeated evolution of cave traits in distinct cavefish lineages (originating from at least independent surface ancestral lineages) consistently involves divergence in the same genomic regions across all repeated traits examined.", "kw": [], "info": "Exception: Early onset of adipose tissue did not exhibit genetic repeatability.", "concl": "Genetic architectures repeated across independent cave populations"}, {"type": "qa", "section": "Results", "q": "Which trait showed greatest repeatability?", "a": "Highest Repeatability: Eye size reduction showed the highest degree of genetic repeatability among independent cave populations.", "kw": [], "info": "Shared QTLs Between Lineages: 9 out of 16 (43%) eye size quantitative trait loci (QTL) regions were associated with cave genotypes from both Lineage 1 (Molino) and Lineage 2 (Tinaja/Pachón). -Up to 56% of eye size QTL regions are likely repeatedly involved in independent eye loss across cavefish lineages.", "concl": "Genetic architectures repeated across independent cave populations"}]}, {"id": "Carnie_2024", "title": "Transcription-coupled repair of DNA–protein cross-links depends on CSA and CSB", "category": "Embryo exposures", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11098753/", "note": "", "items": [{"type": "qa", "section": "Abstract", "q": "What are DPCs?", "a": "Covalent DNA-protein cross links; DNA lesions that block replication and require repair.", "kw": ["DPCs"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What effect DPSs have directly on transcription?", "a": "General question of the paper, it is unknown whether that contrifutes to the toxicity. They found thatut arresrts transcription and induces ubiquitilation and degradation of RNA polymerase II.", "kw": [], "info": "They used genetic screenings, genome wide mapping of DNA- protein adducts, DPC seq.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "How is Cockayne syndrome connected to DPCs?", "a": "Proteins CSB and CSA provide resistance to\nDPC-inducing agents by promoting DPC repair in actively transcribed\ngenes.", "kw": ["CSB", "CSA", "Cockayne syndrome"], "info": "CSB- or CSA-deficient cells fail to efficiently restart\ntranscription after induction of DPCs. In contrast, nucleotide excision repair\nfactors that act downstream of CSB and CSA at ultraviolet light-induced DNA\nlesions are dispensable.", "concl": ""}]}, {"id": "Denby_2016", "title": "The mechanism of a formaldehyde-sensing transcriptional regulator", "category": "Embryo exposures", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5146963/", "note": "", "items": [{"type": "qa", "section": "Abstract", "q": "Main two routes of exposure to formaldehyde?", "a": "Endogenous and environmental.", "kw": [], "info": "", "concl": "Because of that, biology has evolved systems to percieve and detoxify FA.", "novel": true}, {"type": "qa", "section": "Abstract", "q": "What bacterial systems for detoxifying FA you know?", "a": "frmRA(B) operon", "kw": ["FrmR", "FrmA", "FrmB"], "info": "", "concl": "FrmR protein is transcriptional repressor; it is onactivated in presence of FA. --> FrmA and FrmB", "novel": true}, {"type": "qa", "section": "Abstract", "q": "How is mechanisam explaind? (x-ray structure)", "a": "Methylene bridges that link adjacent Pro2 and Cys35 residues in the EcFrmR tetramer. It changes the pattern of surface charge.", "kw": ["EcFrmR"], "info": "", "concl": "They made mechanistic model.", "novel": true}, {"type": "qa", "section": "Introduction", "q": "What do you know about FA in general?", "a": "Electrophilic chemical, generated endogenously and environmentaly.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How is FA generated endogenously?", "a": "(i) as an intermediate in methylotrophic metabolism; (ii) in the degradation of glycine, either by the glycolytic byproduct methylgloxal or by Fenton chemistry; (iii) in the degradation of heme, during iron acquisition by some Gram-positive bacteria; (iv) by lipid peroxidation of sugars; (v) by the demethylation of histones; (vi) as a product of methylated-DNA repair by AlkB; and (vii) by the action of N-methyltryptophan oxidase (SolA)", "kw": [], "info": "", "concl": "", "novel": true}, {"type": "qa", "section": "Introduction", "q": "What effect does FA have on cell components?", "a": "It causes DNA-DNA and DNA-protein crosslinks. But also covalent DNA monoadducts. It can covalently modify proteins, inhibiting their function.", "kw": [], "info": "", "concl": "As a response to FA, specific response regulators.", "novel": true}, {"type": "qa", "section": "Introduction", "q": "When is FA generated in E. coli?", "a": "When E. coli adapts to the presence of the alternative electron acceptor trimethylamine-N-oxide.", "kw": [], "info": "", "concl": "An inability to respond (by induction of the frmRAB operon) to this endogenous formaldehyde challenge resulted in growth inhibition, rather than growth promotion, when anaerobic E. coli cultures were provided with trimethylamine-N-oxide.", "novel": true}, {"type": "qa", "section": "Introduction", "q": "What does frmRAB operon codes for?", "a": "A regulator, FrmR (EcFrmR); a formaldehyde dehydrogenase, FrmA; and an S-formylglutathione hydrolase, FrmB.", "kw": [], "info": "", "concl": "", "novel": true}, {"type": "qa", "section": "Introduction", "q": "How FA reacts in cytosol with gluthantiol?", "a": "It yields S-hydroxymethylglutathione, which is then oxidized by FrmA to S-formylglutathione.", "kw": [], "info": "", "concl": "In E. coli S-formylglutathione is hydrolyzed to formate and glutathione by the product of the final gene of the frmRAB operon, FrmB, or by a second, less-eficient hydrolase YeiG.", "novel": true}]}, {"id": "Winter_2025", "title": "Modelling and design of transcriptional enhancers", "category": "General", "link": "https://www.nature.com/articles/s44222-025-00280-y", "note": "", "items": [{"type": "qa", "section": "Abstract", "q": "What are genomic sequence to function models?", "a": "Models that take DNA seq as input and predict gene regulatory features", "kw": [], "info": "", "concl": ""}]}, {"id": "Mahmoud_2019", "title": "Structural variant calling: the long and the short of it", "category": "Alignment", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6868818/", "note": "Interesting review but not priority at the moment.", "items": [{"type": "qa", "section": "Introduction", "q": "What are structural variants (SV)?", "a": "Large genomic alterations, where large is typically (and somewhat arbitrarily) defined as encompassing at least 50 bp.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "GV are tipically classified as?", "a": "Deletions, duplications, insertions, inversions, and translocations", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Copy number variations (CNVs)?", "a": "Represented by deletions and duplications.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Are SV single or multiple events?", "a": "Usually single but can also be combination of SV.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is Chromothripsis?", "a": "A large and complex combination of rearrangements reported in cancer", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the percentage of genomic variation between humans?", "a": "While the average genomic variation between two humans is 0.1% in terms of single nucleotide variants (SNVs), when taking SVs into account, this increases to 1.5%", "kw": [], "info": "In particular, telomeric regions are affected by a higher rate of SVs", "concl": ""}]}, {"id": "Jiao_2020", "title": "Chromosome-level assemblies of multiple Arabidopsis genomes reveal hotspots of rearrangements with altered evolutionary dynamics", "category": "Alignment", "link": "https://www.nature.com/articles/s41467-020-14779-y", "note": "", "items": []}, {"id": "Robach_2026", "title": "A pangenome framework uncovers the role of deletions in repeated evolution of cave-derived traits", "category": "Mexican tetra", "link": "https://genome.cshlp.org/content/36/9/1921#s3", "note": "", "items": [{"type": "qa", "section": "Abstract", "q": "Cave specific deletions?", "a": "More than 2400 high-confidence cave-specific deletions are enriched in biological pathways involved in vision, metabolism, and behavior and cluster nonrandomly in quantitative trait loci linked to cavefish traits.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Between cavefish popukations?", "a": "67 genes harbor unique deletions between independent cavefish lineages.", "kw": [], "info": "These reused genes show evidence of population-specific selection (99% contain selective sweeps compared with 8%–15% in genes lacking SVs), indicating that deletions likely rose in frequency through repeated positive selection rather than drift.", "concl": "Recurrent deletion events have repeatedly contributed to the evolution of cave-adapted phenotypes and highlight deletions as underexplored contributors of adaptive evolution in extreme environments"}, {"type": "qa", "section": "Abstract", "q": "Structural variants (SVs) are generally defined as what", "a": "sequence variants ≥50 bp in size", "kw": [], "info": "inversions, translocations, duplications or insertion of novel sequence, and deletions.", "concl": ""}, {"type": "note", "section": "Abstract", "text": "SVs account for substantially more sequence variation compared with SNPs"}]}, {"id": "Warren_2024", "title": "Astyanax mexicanus surface and cavefish chromosome-scale assemblies for trait variation discovery", "category": "Mexican tetra", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11304944/", "note": "Okey, more about sv and long read assembly reconstuction than SNP. Very large scale, no gene level analysis.", "items": [{"type": "qa", "section": "Abstract", "q": "Repeated colonization of cave environments resulted in what?", "a": "Independent evolution of troglomorphic phenotypes.", "kw": ["independent evolution"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "Whole-genome synteny alignments show what?", "a": "Highly conserved gene order among cave forms (higher number of chromosomal rearrangements when compared with other phylogenetically close or distant teleost species).", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "By phylogenetically assessing gene orthology across distant branches of amniotes, they discovered what?", "a": "Gene orthogroups unique to A. mexicanus.", "kw": ["orthogroups"], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What was the time of transition from surface to cave fish?", "a": "Around 150 000 years.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What recent long read assembly improved in cavefish?", "a": "Identification of candidate genes underlying QTLs, discovered fixed or variable deletions in each cave form, and guided gene-editing experiments", "kw": ["long reads assembly"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Issues with the same surface fish assembly?", "a": "High level of gene fragmentation due to the use of high-error long reads.", "kw": ["fragmentations of assembly"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - seq and assembly", "q": "What fish were used?", "a": "Surface, Molino, and Tinaja origins", "kw": [], "info": "salting-out method, 10X genomics demonstrated protocol; from muscle tissue to generate single-molecule real-time (SMRT) sequences using HiFi sequence base-calling output mode from the Sequel II instrument (Pacific Biosciences) according to the manufacturer's protocols.", "concl": "total HiFi coverage ranged from 27 to 46x using a genome size estimate of 1.4 Gb with average read lengths across all samples of 21 kb"}, {"type": "qa", "section": "Methods - seq and assembly", "q": "What was used to assemble reads to contigs?", "a": "Reads into contigs using hifiasm v0.13-r308 with default options", "kw": ["hifiasm"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - seq and assembly", "q": "What are haplotogs?", "a": "Haplotigs represent assembled sequences that are essentially a copy of the other haplotype and thus are removed to avoid redundancy in genome representation.", "kw": ["haplotogs"], "info": "To look for haplotigs, we aligned circular long reads to the contigs using minimap v2.20 with arguments “-ax map-pb”. We ran purge_haplotigs v1.1.1 . The Molino and Tinaja assemblies had detectable signals of haplotigs but surface did not", "concl": ""}, {"type": "qa", "section": "Methods - seq and assembly", "q": "How was scaffolding performed?", "a": "A sibling of the reference fish was used to generate and sequence a HiC library developed with the Proximo Hi-C kit", "kw": ["scaffolding"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - seq and assembly", "q": "How they assebmled the contigs into scaffolds?", "a": "Custom pipline that aligns the Hi-C reads to the contigs with bwa mem v0.7.17 postprocesses the alignments, and finally scaffolds with SALSA v2.2 and Juicebox", "kw": ["bwa mem", "SALSA", "Juicebox"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - seq and assembly", "q": "How they curated scaffolds?", "a": "Combination of synteny and manual examination of the Hi-C heatmaps", "kw": ["curation of scaffolds"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - seq and assembly", "q": "How was chromosome assignment finalized?", "a": "Agptools was used to finalize chromosome assignments to be consistent with chromosome nomenclature of the surface assembled genome reported in Warren et al. 2021", "kw": ["agptools"], "info": "Chromosomes were numbered by aligned synteny to assembled chromosomes of the previously assembled surface form of A. mexicanus", "concl": ""}, {"type": "qa", "section": "Methods - seq and assembly", "q": "How was the completeness of gene representation assesed?", "a": "using benchmarking universal single-copy ortholog (BUSCO) v4.1.2", "kw": ["BUSCO"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - whole-genome interspecies and intraspecies analysis", "q": "How they tried to better understand shared gene organisation with other teleos species?", "a": "Through syntenic orthology of surface fish chromosomes (AstMex3) to widely used fish experimental models including zebrafish (GRCz11), medaka (ASM223467v1), and platyfish (X_maculatus-5.0) chromosomes using the Genespace R package", "kw": ["syntenic orthology"], "info": "Parse annotation function of Genespace, we generated the gene bed file from the gff files of each species", "concl": "To evaluate possible assembly errors or natural structural variation (SV)."}, {"type": "qa", "section": "Methods - gene orthology", "q": "What they used?", "a": "OrthoFinder version 2.5.4 on 15 species total.", "kw": ["OrthoFInder"], "info": "To mitigate the effect of multiple transcripts per gene, we used primary transcripts (the longest version) only, per OrthoFinder recommendations", "concl": ""}, {"type": "qa", "section": "Methods - gene orthology", "q": "Multiple sequence alignment?", "a": "MAFFT", "kw": ["MAFFT"], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - gene orthology", "q": "Gene tree inference?", "a": "Fasttree", "kw": ["Fasttree"], "info": "We ran a secondary analysis for comparison using IQtree for gene tree inference.", "concl": ""}, {"type": "qa", "section": "Methods - gene orthology", "q": "IQtree for gene tree inference?", "a": "Just as a secondary analysis,", "kw": ["IQtree"], "info": "We generated orthogroups across all species which included protein sequences from primary transcripts of A. mexicanus surface genome, zebrafish...", "concl": ""}, {"type": "qa", "section": "Methods - gene orthology", "q": "Why were the previous specis chosen?", "a": "(1) because they all have available Ensembl annotations, thus easily compatible with Orthofinder algorithms, and (2) establish an even phylogenetic sampling across amniotes and anamniotes.", "kw": [], "info": "Spotted gar was used because this species originated prior to the teleost whole-genome duplication, making it an important bridge for ortholog predictions between teleosts and other vertebrates", "concl": ""}, {"type": "qa", "section": "Methods - gene orthology", "q": "What is orthougroup?", "a": "An orthogroup is a family of related genes found across different species that evolved from a common ancestral gene. Think of them like extended family members living in different countries.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods - SV analysis", "q": "What have they used to initially estimate the distribution and the number of SVs present?", "a": "Assemblytics 1.2.1", "kw": ["Assemblytics 1.2.1"], "info": "It estimates tandem or repeat sequence contractions and expansions, as well as deletions or insertions when compared with the surface genome", "concl": "This approach can reflect uniqueness to a cave morph or similarity across morphs when compared with the surface genome"}, {"type": "qa", "section": "Methods - SV analysis", "q": "What was run to slign assemblies at contig levels to minimise false positives?", "a": "nucmer algorithm of MUMmer release 4.x", "kw": ["nucmer", "MUMmer"], "info": "Resulting delta file was input into the Assemblytics browser and run using default parameters: a unique contig sequence anchoring size of 10,000 bp, and the variants classified by type and size ranging from 50 to 500 bp and 500 to 10,000 bp for plot visualization.", "concl": ""}, {"type": "qa", "section": "Results and discussion - assembly of the surface and cavefish forms", "q": "All genomes were sequenced and assembles using what?", "a": "SMRT CCS (circular consensus sequencing)", "kw": ["SMRT CCS"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - assembly of the surface and cavefish forms", "q": "What was the genome coverage depth?", "a": "27.4–46.2", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - assembly of the surface and cavefish forms", "q": "The final de novo assemblies resulted in what?", "a": "Ungapped assembly length ranges of 1.36–1.41 Gb, total contigs of 123–292, and N50 contig lengths of 12–47 Mb.", "kw": ["ungapped assembly"], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - assembly of the surface and cavefish forms", "q": "How was chromosome-scale scaffolding done?", "a": "Average 200 million 150 bp Hi-C reads for chromosome-scale scaffolding resulted in the generation of 25 total chromosomes for the surface and each cave morph.", "kw": ["Hi-C"], "info": "Due to the exceptional contiguity of the surface assembly (47 Mb N50 contig length), we established the chromosome structure of this assembly first and then investigated discrepancies of the other cavefish assemblies using multiple pairwise alignments.", "concl": ""}, {"type": "qa", "section": "Results and discussion - assembly of the surface and cavefish forms", "q": "Issues with chromosomes?", "a": "Few order or orientation errors were found and corrected; however, three chromosomes with complete orientation differences in all cave forms must be further investigated for possible curation fixes", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - structural differnces", "q": "Is gene order highly conserved among surface and cave morph chromosomes despite their demographic origin differences?", "a": "No major chromosomal discrepancies in chromosome order when performing pairwise comparisons of the Pachón, Tinaja, or Molino cave morphs to the representative surface fish ancestor", "kw": [], "info": "Overall, 56% of A. mexicanus chromosomes display complex genomic rearrangements relative to all three distantly related teleost species", "concl": ""}, {"type": "qa", "section": "Results and discussion - structural differnces", "q": "Examples?", "a": "The largest A. mexicanus chr1 (134 Mb) aligns with four zebrafish chromosomes: 5, 16, 20, and 24; some chromosomes that are nearly syntenic for gene order, such as A. mexicanus chr14 vs zebrafish chr17.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene annotation", "q": "What they used for assessed the sequence completeness of the assemblies?", "a": "BUSCO scores.", "kw": ["BUSCO scores"], "info": "96.8% of BUSCOs present in their complete and unfragmented form, 2.4% missing, and 1.3% duplicated", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene annotation", "q": "How were protein coding genes were predicted?", "a": "Protein-coding genes from all four genomes were predicted using Ensembl with the average being 26,974.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene annotation", "q": "How was surface genome additionally annotated?", "a": "The surface genome was also annotated using the NCBI workflow, with small differences in the total protein-coding genes count", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene annotation", "q": "Where were larege differences seen in the surface genome pseudogene annotation?", "a": "Large differences were seen in the surface genome pseudogene annotation, 1,376 vs 183, when comparing the NCBI and Ensembl output", "kw": [], "info": "A small increase in Ensembl-predicted pseudogenes in cave morphs compared to the surface is observed, apart from Pachon.", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene annotation", "q": "Pseudogenes?", "a": "These are sections of DNA that used to be working genes millions of years ago, but through evolution, they picked up mutations and stopped working. Scientists often call them \"genomic fossils\" or \"molecular junk.\"", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene annotation", "q": "Noncoding genes were improved?", "a": "Predicted numbers of noncoding genes were substantially improved (a 36-fold increase;", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene annotation", "q": "Gene sympols not found?", "a": "The surface genome had 1,041, 978, and 1,054 gene symbols not found in Pachón, Molino, and Tinaja annotations. imilarly, each cave population had over 800 gene symbols not found in the surface genome.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - gene orthology", "q": "OrthoFinder analysis?", "a": "95% of all genes were assigned to 20,612 orthogroups", "kw": [], "info": "Fifty percent of genes assigned to orthogroups are in orthogroups of 19 genes or more, and over 25% of orthogroups contained all species (n = 5,285), of which 20.8% are single-copy orthogroups (n = 1,097)", "concl": "Addressing specifically orthologous relationships, 16,582 human genes (70.5%) have an ortholog with A. mexicanus, whereas 16,221 human genes (68.9%) have an ortholog with D. rerio."}, {"type": "note", "section": "Results and discussion - gene orthology", "text": "A lot of details, check paper for more."}, {"type": "qa", "section": "Results and discussion - SV", "q": "What kind of deletions they evaluated?", "a": "Evaluated moderately sized structural variations (50–10,000 bp) ncluding deletions, insertions, and repeat expansions/contractions", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results and discussion - SV", "q": "Genomic impact?", "a": "Deletions and insertions affected an average total size of 19.4 Mb (1.42% of the genome), while repeat expansions and contractions impacted 3.05% and 2.91% of the total genome, respectively.", "kw": [], "info": "", "concl": ""}]}]};
const CAT = {
  "Mexican tetra":"mex","Embryo exposures":"emb","General":"gen","Damir":"dam","Other group members":"oth","Alignment":"ali"
};
const catVars = c => { const k = CAT[c]||"gen"; return `--cl:var(--c-${k});--cd:var(--c-${k}-d)`; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const papers = DATA.papers.map(p => {
  let n = 0;
  p.items.forEach(it => { if (it.type==="qa") it.uid = p.id + ":" + (n++); });
  return {...p, slug: slug(p.id), qas: p.items.filter(i => i.type==="qa")};
});
const bySlug = Object.fromEntries(papers.map(p => [p.slug, p]));
const cats = Object.values(DATA.legend).filter(c => papers.some(p => p.category===c));

/* storage */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let known = new Set(store.get("pn-known", []));
const saveKnown = () => store.set("pn-known", [...known]);
let theme = store.get("pn-theme", "auto");
function applyTheme(){
  if (theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = "Theme: " + theme;
}
document.getElementById("theme").onclick = () => {
  theme = theme==="auto" ? "light" : theme==="light" ? "dark" : "auto";
  store.set("pn-theme", theme); applyTheme();
};
applyTheme();

const totalQ = papers.reduce((a,p) => a + p.qas.length, 0);
document.getElementById("tot").textContent = `${papers.length} papers, ${totalQ} questions`;

/* state */
let activeCats = new Set();
let current = null;
let query = "";
const main = document.getElementById("main");

function renderCats(){
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat" style="${catVars(c)}" aria-pressed="${activeCats.has(c)}" data-cat="${esc(c)}"><span class="dot" style="background:var(--cd)"></span>${esc(c)}</button>`).join("");
}
document.getElementById("cats").onclick = e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  const c = b.dataset.cat; activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
  renderCats(); renderList(); if (!current && !query) renderHome();
};
const visible = () => papers.filter(p => !activeCats.size || activeCats.has(p.category));

function renderList(){
  document.getElementById("plist").innerHTML = visible().map(p => {
    const k = p.qas.filter(q => known.has(q.uid)).length;
    return `<li><button class="pitem" style="${catVars(p.category)}" data-p="${p.slug}" aria-current="${current===p}">
      <span class="tab" style="background:var(--cd)"></span>
      <span><b>${esc(p.id.replace("_"," "))}</b><span class="t">${esc(p.title)}</span></span>
      <span class="n">${p.qas.length ? (k ? k+"/" : "") + p.qas.length : "—"}</span></button></li>`;
  }).join("");
}
document.getElementById("plist").onclick = e => {
  const b = e.target.closest("[data-p]"); if (b) go(b.dataset.p);
};

function go(s){
  document.body.classList.remove("drawer");
  if (location.hash.slice(1) !== s) location.hash = s; else route();
}
function route(){
  const h = location.hash.slice(1);
  if (query){ clearSearch(); }
  current = bySlug[h] || null;
  renderList();
  current ? renderPaper(current) : renderHome();
  document.getElementById("mtitle").textContent = current ? current.id.replace("_"," ") : "Paper notes";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
const homeEl = document.getElementById("home");
homeEl.onclick = () => { history.pushState(null,"",location.pathname); route(); };
homeEl.onkeydown = e => { if (e.key==="Enter") homeEl.click(); };

function renderHome(){
  const list = visible();
  const groups = cats.filter(c => list.some(p => p.category===c));
  const k = papers.reduce((a,p) => a + p.qas.filter(q => known.has(q.uid)).length, 0);
  main.innerHTML = `<div class="home">
    <h2>Your reading notes</h2>
    <p class="lead">${totalQ} questions across ${papers.length} papers. Open a paper to quiz yourself one answer at a time, or study the whole set as flashcards. You know ${k} of them so far.</p>
    <div class="toolbar"><button class="btn primary" id="studyAll">Study ${activeCats.size ? "these categories" : "everything"}</button></div>
    ${groups.map(c => `<div class="grp" style="${catVars(c)}"><h3><span class="dot" style="background:var(--cd)"></span>${esc(c)}</h3>
      ${list.filter(p => p.category===c).map(p => {
        const kn = p.qas.filter(q => known.has(q.uid)).length, pct = p.qas.length ? kn/p.qas.length*100 : 0;
        return `<button class="prow" data-p="${p.slug}"><b>${esc(p.id.replace("_"," "))}</b><span>${esc(p.title)}</span>
          <div>${p.qas.length ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="barlab">${kn} of ${p.qas.length} known</div>` : `<div class="barlab">No notes yet</div>`}</div></button>`;
      }).join("")}</div>`).join("")}
  </div>`;
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => go(b.dataset.p));
  document.getElementById("studyAll").onclick = () => startStudy(list.flatMap(p => p.qas.map(q => [p,q])), activeCats.size ? [...activeCats].join(", ") : "All papers");
}

function hl(text){
  text = esc(text);
  if (!query) return text;
  const re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","gi");
  return text.replace(re, "<mark>$1</mark>");
}
function qaHTML(p, it, open){
  const extra = [["Details", it.info], ["Takeaway", it.concl]].filter(x => x[1]);
  return `<div class="qa${open ? " open" : ""}" style="${catVars(p.category)}">
    <button class="qbtn" aria-expanded="${!!open}"><span class="qt">${hl(it.q || "Note")}</span>
      <span class="qmeta">${it.novel ? `<span class="novel">New to me</span>` : ""}${known.has(it.uid) ? `<span class="known">Known</span>` : ""}
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></span></button>
    <div class="ans">
      ${it.a ? `<p class="a">${hl(it.a)}</p>` : ""}
      ${extra.length ? `<dl class="extra">${extra.map(([k,v]) => `<dt>${k}</dt><dd>${hl(v)}</dd>`).join("")}</dl>` : ""}
      ${it.kw.length ? `<div class="kws">${it.kw.map(k => `<button class="kw" data-kw="${esc(k)}" title="Search for ${esc(k)}">${esc(k)}</button>`).join("")}</div>` : ""}
    </div></div>`;
}
function bindQA(root){
  root.querySelectorAll(".qbtn").forEach(b => b.onclick = () => {
    const qa = b.parentElement; qa.classList.toggle("open"); b.setAttribute("aria-expanded", qa.classList.contains("open"));
  });
  root.querySelectorAll("[data-kw]").forEach(b => b.onclick = () => { qInput.value = b.dataset.kw; doSearch(); });
}

function renderPaper(p){
  const kn = p.qas.filter(q => known.has(q.uid)).length;
  const secs = [];
  p.items.forEach(it => { const s = it.section || "Notes"; if (!secs.includes(s)) secs.push(s); });
  let body = "";
  if (!p.items.length) body = `<p class="empty">There are no notes for this paper yet. Add a sheet named ${esc(p.id)} to the workbook and fill in questions and answers.</p>`;
  secs.forEach((s,i) => {
    body += `<h3 class="sec" id="s-${i}">${esc(s)}</h3>`;
    p.items.filter(it => (it.section || "Notes")===s).forEach(it => {
      body += it.type==="note" ? `<p class="notep">${esc(it.text)}</p>` : qaHTML(p, it, false);
    });
  });
  main.innerHTML = `<header class="phead" style="${catVars(p.category)}">
      <div class="who"><span>${esc(p.id.replace("_",", "))}</span><span class="tag">${esc(p.category)}</span>${p.link ? `<a class="open" href="${esc(p.link)}" target="_blank" rel="noopener">Open paper</a>` : ""}</div>
      <h2>${esc(p.title)}</h2>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
    </header>
    ${p.qas.length ? `<div class="toolbar">
      <button class="btn primary" id="studyP">Study as flashcards</button>
      <button class="btn" id="toggleAll">Show all answers</button>
      <span class="prog">${kn} of ${p.qas.length} known</span></div>` : ""}
    ${secs.length > 2 ? `<nav class="secnav" aria-label="Sections">${secs.map((s,i) => `<button data-s="${i}">${esc(s)}</button>`).join("")}</nav>` : ""}
    <div id="items">${body}</div>`;
  bindQA(main);
  main.querySelectorAll("[data-s]").forEach(b => b.onclick = () => document.getElementById("s-"+b.dataset.s).scrollIntoView({behavior:"smooth"}));
  const t = document.getElementById("toggleAll");
  if (t) t.onclick = () => {
    const all = main.querySelectorAll(".qa"), open = t.textContent.startsWith("Show");
    all.forEach(q => { q.classList.toggle("open", open); q.querySelector(".qbtn").setAttribute("aria-expanded", open); });
    t.textContent = open ? "Hide all answers" : "Show all answers";
  };
  const sp = document.getElementById("studyP");
  if (sp) sp.onclick = () => startStudy(p.qas.map(q => [p,q]), p.id.replace("_"," "));
}

/* search */
const qInput = document.getElementById("q");
let tmr;
qInput.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(doSearch, 120); });
function clearSearch(){ query = ""; qInput.value = ""; }
function doSearch(){
  query = qInput.value.trim();
  document.body.classList.remove("drawer");
  if (!query){ route(); return; }
  const ql = query.toLowerCase();
  const res = visible().map(p => [p, p.qas.filter(it =>
    [it.q, it.a, it.info, it.concl, ...it.kw].join(" ").toLowerCase().includes(ql))]).filter(r => r[1].length);
  const n = res.reduce((a,r) => a + r[1].length, 0);
  main.innerHTML = `<div class="home"><h2>“${esc(query)}”</h2>
    <p class="lead">${n ? `${n} matching question${n>1?"s":""} in ${res.length} paper${res.length>1?"s":""}.` : "Nothing matches. Try a shorter word or a tool name, such as BUSCO or QTL."}</p>
    ${res.map(([p, its]) => `<div class="rgroup" style="${catVars(p.category)}"><h3><span class="dot" style="background:var(--cd)"></span><button data-p="${p.slug}">${esc(p.id.replace("_"," "))}</button></h3>
      ${its.map(it => qaHTML(p, it, true)).join("")}</div>`).join("")}</div>`;
  bindQA(main);
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { clearSearch(); go(b.dataset.p); });
}

/* flashcards */
const study = document.getElementById("study"), stage = document.getElementById("stage");
let deckAll = [], deck = [], pos = 0, flipped = false, sLabel = "";
const sShuffle = document.getElementById("sShuffle"), sNew = document.getElementById("sNew");
function startStudy(cards, label){
  deckAll = cards; sLabel = label; buildDeck();
  study.classList.add("on"); document.body.style.overflow = "hidden";
  document.getElementById("bFlip").focus();
}
function buildDeck(){
  deck = deckAll.filter(([,q]) => !sNew.checked || !known.has(q.uid));
  if (sShuffle.checked) for (let i = deck.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
  pos = 0; showCard();
}
sShuffle.onchange = buildDeck; sNew.onchange = buildDeck;
function showCard(){
  flipped = false;
  document.getElementById("sTitle").textContent = sLabel;
  document.getElementById("sTrack").style.width = (deck.length ? pos/deck.length*100 : 100) + "%";
  const ctl = document.getElementById("sctl");
  if (pos >= deck.length){
    const k = deckAll.filter(([,q]) => known.has(q.uid)).length;
    document.getElementById("sCount").textContent = "";
    ctl.style.visibility = "hidden";
    stage.innerHTML = `<div class="done"><h3>${deck.length ? "Deck finished" : "Nothing left to review"}</h3>
      <p>You know ${k} of ${deckAll.length} cards in this set.</p>
      <button class="btn primary" id="again">Go through again</button> <button class="btn" id="fin">Close</button></div>`;
    document.getElementById("again").onclick = buildDeck;
    document.getElementById("fin").onclick = closeStudy;
    return;
  }
  ctl.style.visibility = "visible";
  document.getElementById("sCount").textContent = `${pos+1} / ${deck.length}`;
  const [p, q] = deck[pos];
  const src = `<div class="src"><span class="tag">${esc(p.id.replace("_"," "))}</span><span>${esc(q.section)}</span></div>`;
  stage.innerHTML = `<div class="card" id="card" style="${catVars(p.category)}" role="button" tabindex="0" aria-label="Flip card">
    <div class="face">${src}<p class="q">${esc(q.q)}</p><p class="hint">Tap the card or press space to see the answer</p></div>
    <div class="face back">${src}<p class="bq">${esc(q.q)}</p><p class="ba">${esc(q.a || "")}</p>
      ${q.concl ? `<dl class="extra"><dt>Takeaway</dt><dd>${esc(q.concl)}</dd></dl>` : ""}</div></div>`;
  document.getElementById("card").onclick = flip;
}
function flip(){ const c = document.getElementById("card"); if (!c) return; flipped = !flipped; c.classList.toggle("flip", flipped); }
function mark(good){
  if (pos >= deck.length) return;
  const q = deck[pos][1];
  good ? known.add(q.uid) : known.delete(q.uid);
  saveKnown(); pos++; showCard();
}
document.getElementById("bFlip").onclick = flip;
document.getElementById("bGood").onclick = () => mark(true);
document.getElementById("bAgain").onclick = () => mark(false);
function closeStudy(){
  study.classList.remove("on"); document.body.style.overflow = "";
  renderList(); if (query) doSearch(); else current ? renderPaper(current) : renderHome();
}
document.getElementById("sClose").onclick = closeStudy;
document.addEventListener("keydown", e => {
  if (!study.classList.contains("on")) return;
  if (e.target.tagName==="INPUT") return;
  if (e.key===" "){ e.preventDefault(); flip(); }
  else if (e.key==="1" || e.key==="ArrowLeft") mark(false);
  else if (e.key==="2" || e.key==="ArrowRight") mark(true);
  else if (e.key==="Escape") closeStudy();
});

/* mobile drawer */
document.getElementById("menu").onclick = () => document.body.classList.add("drawer");
document.getElementById("scrim").onclick = () => document.body.classList.remove("drawer");

renderCats(); route();
</script>
</body>
</html>
