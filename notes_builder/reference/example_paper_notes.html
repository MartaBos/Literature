<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1C2632; --muted:#5A6878; --rule:#D3DAE1; --hover:#E3E8ED;
  --focus:#2F6FB3; --good:#2E7D4F; --again:#B4562E;
  --c-mex:#C9DAF8; --c-mex-d:#3D6DBF;
  --c-emb:#FCE5CD; --c-emb-d:#C47A2C;
  --c-gen:#D9EAD3; --c-gen-d:#4E8A3E;
  --c-dam:#EAD1DC; --c-dam-d:#A3527A;
  --c-oth:#D8D1EE; --c-oth-d:#6B57B0;
  --c-ali:#FFF2CC; --c-ali-d:#B08A12;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
    --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
    --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
    --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
    --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21; --surface:#1C242D; --ink:#E3E8ED; --muted:#98A5B3; --rule:#2E3945; --hover:#25303B;
  --focus:#7FB0E6; --good:#6CC08D; --again:#E39271;
  --c-mex:#26364F; --c-mex-d:#86AEEF; --c-emb:#4A3624; --c-emb-d:#E9A866;
  --c-gen:#283D2A; --c-gen-d:#93C985; --c-dam:#45293A; --c-dam-d:#E19BBE;
  --c-oth:#332B4F; --c-oth-d:#B3A2EE; --c-ali:#433B1E; --c-ali-d:#E3C661;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--rule);padding:22px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{padding:0 22px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0;letter-spacing:-.01em;cursor:pointer}
.brand small{color:var(--muted);font-size:.82rem}
.search{margin:0 22px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px}
.cat{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 10px 4px 8px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist{list-style:none;margin:0;padding:0 12px}
.pitem{display:grid;grid-template-columns:6px 1fr auto;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 10px 10px 8px;align-items:start}
.pitem:hover{background:var(--hover)}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--rule)}
.pitem .tab{align-self:stretch;border-radius:3px}
.pitem b{display:block;font-weight:600;font-size:.92rem}
.pitem span.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.pitem .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.theme{margin:auto 22px 0;align-self:flex-start;background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--muted)}

main{padding:40px clamp(20px,5vw,64px) 80px;max-width:900px;width:100%}
.mtop{display:none}
.phead{border-left:6px solid var(--cd);padding-left:20px;margin-bottom:28px}
.phead .who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:.9rem}
.tag{background:var(--cl);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.8rem}
.phead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;letter-spacing:-.015em;margin:10px 0 12px;max-width:34ch}
.phead .note{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 4px;max-width:62ch}
.phead a.open{font-size:.9rem;font-weight:500;color:var(--cd);text-decoration:none;border-bottom:1px solid currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 26px}
.secnav button{text-align:left;background:none;border:0;border-bottom:1px dashed var(--rule);padding:2px 0;margin-right:12px;font-size:.84rem;color:var(--muted)}
.secnav button:hover{color:var(--ink);border-bottom-color:var(--ink)}
.prog{font-size:.85rem;color:var(--muted);margin-left:auto}

h3.sec{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.qa{border-bottom:1px solid var(--rule)}
.qa:last-child{border-bottom:0}
.qbtn{display:grid;grid-template-columns:1fr auto;gap:16px;width:100%;text-align:left;background:none;border:0;padding:14px 0;font-weight:500;font-size:1rem;line-height:1.4}
.qbtn:hover .qt{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.qmeta{display:flex;gap:8px;align-items:center;padding-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
.qa.open .chev{transform:rotate(90deg)}
.known{font-size:.72rem;color:var(--good);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.novel{font-size:.72rem;color:var(--cd);border:1px solid currentColor;border-radius:999px;padding:0 7px;white-space:nowrap}
.ans{display:none;padding:0 0 18px}
.qa.open .ans{display:block;animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ans p.a{font-family:var(--serif);font-size:1.04rem;line-height:1.65;margin:0 0 12px;max-width:66ch}
.extra{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;font-size:.92rem;margin:0 0 12px;max-width:72ch}
.extra dt{color:var(--muted);font-size:.84rem;padding-top:2px}
.extra dd{margin:0;line-height:1.55}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:var(--cl);border:0;border-radius:6px;padding:2px 9px;font-size:.8rem}
.kw:hover{outline:1px solid var(--cd)}
.notep{font-family:var(--serif);font-style:italic;color:var(--muted);padding:12px 0 12px 14px;border-left:2px solid var(--rule);margin:8px 0}
.empty{font-family:var(--serif);color:var(--muted);padding:30px 0;max-width:52ch}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:2px}

/* home */
.home h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em;margin:0 0 6px}
.home .lead{color:var(--muted);margin:0 0 34px;max-width:58ch}
.grp{margin-bottom:30px}
.grp h3{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;margin:0 0 8px}
.prow{display:grid;grid-template-columns:120px 1fr 120px;gap:16px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:12px 4px;text-align:left}
.prow:hover{background:var(--hover)}
.prow b{font-weight:600;font-size:.92rem}
.prow span{font-family:var(--serif);font-size:.95rem;line-height:1.35}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cd)}
.barlab{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* search results */
.rgroup{margin-bottom:26px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0 0 4px}
.rgroup h3 button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}

/* flashcards */
.study{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(16px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.study.on{display:flex}
.stop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stop .ttl{font-weight:600}
.stop .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stop .x{margin-left:auto}
.track{height:4px;background:var(--rule);border-radius:2px;margin:14px 0 0;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stage{flex:1;display:grid;place-items:center;perspective:1600px;padding:24px 0;min-height:0}
.card{width:min(720px,100%);height:min(440px,100%);position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:18px;border:1px solid var(--rule);border-top:10px solid var(--cd);padding:28px clamp(20px,4vw,40px);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .src{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.face .q{font-family:var(--serif);font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.3;font-weight:500;margin:auto 0;letter-spacing:-.01em}
.face .bq{font-size:.9rem;color:var(--muted);margin:12px 0 10px}
.face .ba{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.25rem);line-height:1.6;margin:0 0 14px}
.face .hint{font-size:.82rem;color:var(--muted);text-align:center}
.sctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.again{color:var(--again);border-color:currentColor}
.btn.good{color:var(--good);border-color:currentColor}
.done{text-align:center;font-family:var(--serif)}
.done h3{font-size:1.8rem;font-weight:500;margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 20px}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

@media (max-width:820px){
  .shell{display:block}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);height:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  body.drawer .scrim{display:block}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 16px;align-items:center;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .mtop b{font-family:var(--serif);font-weight:600}
  main{padding-top:24px}
  .prow{grid-template-columns:1fr;gap:6px}
  .extra{grid-template-columns:1fr;gap:2px}
  .extra dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mtop"><button class="btn" id="menu" aria-label="Show paper list">Papers</button><b id="mtitle">Paper notes</b></div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="side">
    <div class="brand"><h1 id="home" tabindex="0" role="link">Paper notes</h1><small id="tot"></small></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search all notes" aria-label="Search all notes"></label>
    <div class="cats" id="cats"></div>
    <ul class="plist" id="plist"></ul>
    <button class="theme" id="theme">Theme: auto</button>
  </aside>
  <main id="main"></main>
</div>

<section class="study" id="study" aria-label="Flashcards">
  <div class="stop">
    <span class="ttl" id="sTitle"></span><span class="count" id="sCount"></span>
    <div class="opts"><label><input type="checkbox" id="sShuffle"> Shuffle</label><label><input type="checkbox" id="sNew"> Skip cards I know</label></div>
    <button class="btn x" id="sClose">Close</button>
  </div>
  <div class="track"><i id="sTrack"></i></div>
  <div class="stage" id="stage"></div>
  <div class="sctl" id="sctl">
    <button class="btn again" id="bAgain">Review again <small>(1)</small></button>
    <button class="btn" id="bFlip">Flip <small>(space)</small></button>
    <button class="btn good" id="bGood">Got it <small>(2)</small></button>
  </div>
</section>

<script>
const DATA = {"legend": {"C9DAF8": "Mexican tetra", "FCE5CD": "Embryo exposures", "D9EAD3": "General", "EAD1DC": "Damir", "B4A7D6": "Other group members", "FFF2CC": "Alignment"}, "papers": [{"id": "Armstrong_2019", "title": "Whole-Genome Alignment and Comparative Annotation", "category": "Alignment", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6450745/#S1", "note": "Interesting paper for gaining broad info about alignment, but too comlicated for me in sense of alghoritams and methods.", "items": [{"type": "qa", "section": "Abstract", "q": "How can we compare genomes?", "a": "Genome alignment and comparative annoation.", "kw": [], "info": "First on sequence levele and second on gene level.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Pairwise global alignment, who are the pioneers?", "a": "Needleman and Wunsch.", "kw": ["NW"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Specialized version that performs local alignment and optimally aligns subsequences?", "a": "Smith and Waterman.", "kw": ["SW"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are additional issues with above mentiones protocools?", "a": "Insertions, deletions, substitutions are only allowed editing options. At small scale, gene level for example that is okay. At larger windows ans large evolutionaly distances, genomes contain more complex rearrengements.", "kw": ["indels and substitutions"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are those more complex genome rearrengments?", "a": "Inversions, transpositions, duplications.", "kw": ["genomic rearragments"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is used in tools to improve NW and SW?", "a": "High confidence anchors. They are used to partition the alignment into smaller problems.", "kw": ["high confidence anchors"], "info": "Issue: These anchors provided a very efficient and reliable way to break up the alignment problem but relied on a constant order and orientation, which excludes any possibility of noticing rearrangements.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What are the issues connected with applying a local alignment to genome - wide scale?", "a": "Local alignments will miss a homologous sequence that, by chance, happened to be further diverged than the sensitivity of the aligner could detect. They capture spurious alignments.", "kw": ["issues with local alignment"], "info": "The end user is more often interested in orthology rather than homology: Ancient duplications may share similar sequence but often do not share similar function.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the deifnition of whole genoem alignment?", "a": "Any alignment that allows rearrangements (no fix order or orientation) and attempts to determine orthology rather than just homology (even if restricted to just one copy).", "kw": ["whole genome alignment"], "info": "Most wga methods are based on local alignment but do some filtering and postprocessing to construct a useful end product. (Were homology begins and mere similarity ends, and additionally they must make decisions about what is orthologous and not merely homologous.)", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is single copy strategy?", "a": "Choosing a single best target alignment for each region.", "kw": ["single copy strategy"], "info": "Best-fit strategy will not always find a correct ortholog, and indeed even a reciprocally best-fit is not enough to guarantee finding an ortholog. Single best seq ignores lineage specific duplications.", "concl": "Orthology is not  one to one relationship but one to many --> single copy alignment can be very misleading."}, {"type": "qa", "section": "Introduction", "q": "What is the most popular strategy for approimate multiple alignment?", "a": "Since heuristic strategies are needed, progressive alignment.", "kw": ["progressive alignment"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What progressive alignment uses?", "a": "As an additional input it uses a guide tree relating the input sequences.", "kw": ["guide tree"], "info": "The most closely related sequences are aligned first, then the resulting alignment is itself aligned to other sequences or alignments, following the structure of the guide tree.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the first heuristic that is used for multiple alignment problem?", "a": "Using a single reference genome to base the alignment on.", "kw": [], "info": "All others, pairwise fashon.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the issue when using single reference genome?", "a": "Information relating genomes distant from he reference is lost.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Reference-free multiple genome alignment?", "a": "Enredo-Pecan-Ortheus (EPO) pipeline and the A-Bruijn aligner.", "kw": [], "info": "The EPO pipeline especially began to see wide use as part of the Ensembl genome browser.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "How are alignments conventionally described?", "a": "As a set of columns, a set of bases that are all related to each other by some alignment relation. Usually orthology not homology.", "kw": [], "info": "This falls apart awhen considering reference free alignments that can allow a single site in one genome to be alignes to multiple sites in another genome.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What is the idea, how to represent multiple genome alignments [genome histories]?", "a": "The only way to represent a reference-free, multicopy, orthologous multiple genome alignment is by associating the alignment with phylogenetic trees, which are inferred (even if implicitly) during the alignment process.", "kw": [], "info": "A genome history {S, ~, Tc, ts, L} consists of a set of genomes S; a multiple alignment ~ relating the bases of those genomes; a reconciled tree called a column tree t ∈ Tc for each column in that alignment; a species tree ts; and, optionally, a set of links L between columns, indicating the ordering of the ancestral chromosomes.", "concl": "The columns of the genome history reflect the homology rather than the orthology relation. The set of trees (hereafter referred to as column trees) indicate the evolutionary history of the bases in each column."}, {"type": "qa", "section": "Introduction", "q": "Waht happens when we project genoem history onty any genome?", "a": "We get more conventional referenced multiple alignment.", "kw": [], "info": "These projected alignments are useful because they can be represented in conventional formats like the Multiple Alignment Format (MAF) and used as input to existing analysis tools.", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "Connection between local and genome alignment.", "a": "Genome alignment tools usually heavily rely on local alignment of some form.", "kw": ["Connection between la and ga"], "info": "Finding optinal all vs all local alignments is difficult. --> approximate local alignments", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "How aproximate local aligners work?", "a": "They look for short sections of exact matches called seeds. (depending on sensitivity they are alowed to vary) After that they extend the alignment away from seeds.", "kw": ["seeds", "extending seeds"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "Burrows Wheeler Aligner", "a": "Read aligner.", "kw": ["BWA"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "What is the differnce between local aligners for reads and la for genome aligners?", "a": "Second ones use more evolutionaly distance than read aligners.", "kw": ["Differences between la for reads and la for ga"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "Wat do you know about BLAT?", "a": "BLAST like alignment tool. local al. tool good for short evolutionary distances.", "kw": ["BLAT"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "What is translated BLAT?", "a": "Mode for handling longer evolutionary distances. Translated protein vs translated protein mode.", "kw": ["translated BLAT"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "BLASTZ and LASTZ?", "a": "local aligners tuned to be more sensitive than normal BLAST, using PatternHunteresque spaced seeds. Transitions are alowed for increased sensitivity.", "kw": ["LASTZ", "spaced seeds"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "LAST?", "a": "It can use potentially smaller seeds than other aligners without spending time going through uninteresting, highly repetitive alignments, because it extends partial matches until a low enough multiplicity is reached using an efficient substring index", "kw": ["LAST", "smaller seeds"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - local alignment tools", "q": "MashMap2?", "a": "Approximate local aligner, faster than above. It does not generate base level alignment but approximate corrrespondence between long regions combined with a similarity score.", "kw": ["MashMap2", "approximate la"], "info": "Useful for studying large scale phenomena, such as shromosomal rearrangements.", "concl": ""}, {"type": "qa", "section": "Introduction - genome alignment methods", "q": "How most genome aligners work?", "a": "Two stages: filtering (in which a large number of local alignments are generated and filtered down to remove spurious false-positive alignments and identify homologous, rearrangement-free regions ) and refinement, in which the homologous regions undergo alignment with a collinear aligner.", "kw": ["filtering", "refinment"], "info": "Some aligners keep a subset of the original local alignments as anchors to be included in the final alignment, whereas others throw away all the original local alignments and align the rearrangement-free regions from scratch.", "concl": ""}, {"type": "qa", "section": "Introduction - genome alignment methods", "q": "What forms can filtering step take?", "a": "Many involve constructing a graph representation of the alignment.", "kw": ["graph representation"], "info": "A summary of popular or historically significant genome alignment tools is given in Table 1 (for pairwise alignment) and Table 2 (for multiple alignment).", "concl": ""}, {"type": "qa", "section": "Introduction - genome alignment methods", "q": "Chains and nets", "a": "Pairwise genome alignmet tool: Combines fragmented local alignments into larger, high-scoring chains, which are arranged into hierarchical nets representing rearrangements.", "kw": ["chains and nets"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - genome alignment methods", "q": "Cactus", "a": "Multiple genome alignment tool: Graph-based aligner that attempts to remove anchors representing small rearrangements", "kw": ["cactus"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - pgat", "q": "MUMmer", "a": "Fast, it uses sufix tree data structure to find all maximal unique matches between two input genomes.", "kw": ["sufix tree data structure"], "info": "The nucmer script included in the package can perform gapped extension between these matches to generate a more complete alignment. For aligning similar genomes.", "concl": ""}, {"type": "qa", "section": "Introduction - pgat", "q": "Shuffle-LAGAN", "a": "Aims to draw a compromise between the drawbacks of global and local alignment, using a method the authors call glocal alignment.", "kw": [], "info": "Too complicated for me.", "concl": ""}, {"type": "qa", "section": "Introduction - pgat", "q": "Chaining and netting", "a": "A powerful technique for making sense of pairwise local alignments.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - pgat", "q": "What are chains?", "a": "Maximal-scoring combinations of local alignments that maintain a single order and orientation. Good way of filtering out spurious alignments, which are likely to form short, low-scoring chains.", "kw": [], "info": "The set of chains can often include distant paralogs or spurious sequence, which makes it difficult to understand the rearrangements that have taken place between the two input genomes.", "concl": ""}, {"type": "qa", "section": "Introduction - pgat", "q": "What is netting?", "a": "Related technique that makes rearrangements relative to a reference genome much easier to find. In essence, netting finds the best-scoring set of chains that covers the bases of the reference genome only once.", "kw": [], "info": "Easy to find high-confidence rearrangements like transpositions, inversions, and deletions but removes any duplications in the target genome, instead choosing a single copy to align to.", "concl": "Chaining and netting is very fast, but because the process fundamentally relies on local alignments as input, the overall process of generating chained and netted alignments mostly depends on the speed of the local aligner used."}, {"type": "qa", "section": "Introduction - mgat", "q": "ABA", "a": "The A-Bruijn alignment method, A-Bruijn graphs to filter a collection of local alignments, removing inconsistencies and small rearrangements using simplification operations on the graph.", "kw": [], "info": "In principle reference free if the input alignments are generated in an unbiased way. Though the method was mostly applied to protein alignment (where individual domains are often duplicated and shuffled during evolution), it was also shown to be capable of aligning small chloroplast genomes more completely than TBA.", "concl": ""}, {"type": "qa", "section": "Introduction - mgat", "q": "EPO", "a": "reference-free multiple alignment pipeline that, unlike TBA, can handle rearrangements.", "kw": [], "info": "One of the main multiple genome alignments available on the Ensembl genome browser", "concl": ""}, {"type": "qa", "section": "Introduction - mgat", "q": "How EPO works?", "a": "It starts with relativly sparse set of anchor points that are known homologies within a set of genomes.", "kw": [], "info": "Complicated", "concl": ""}, {"type": "qa", "section": "Introduction - mgat", "q": "Cactus?", "a": "The notion of a cactus graph (39) is used to create a filtered, high-confidence set of anchors. The unaligned space between anchors is then aligned using a sensitive pair hidden Markov model (HMM) to create a final multiple alignment. The first step of the Cactus process is to take small, uncertain local alignments captured by LASTZ (21) [which is similar to BLAST (17)] and combine them naively to create a multiple alignment. Given the typical evolutionary distances involved, LASTZ is tuned to be very sensitive but not very precise. The low precision means that the local alignments may be spurious (for example, when a small seed happened to match, and be extended, in a region that is not truly homologous).", "kw": [], "info": "Complicated", "concl": ""}, {"type": "qa", "section": "Introduction - mgat", "q": "ProgressiveCactus?", "a": "The recently developed progressiveCactus, a progressive-alignment extension to the original Cactus algorithm, scales linearly with the number of genomes, allowing efficient alignments of hundreds of genomes.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - alignment formats", "q": "Why is aligned FASTA format not suitable for genome alignment?", "a": "They represent alignments as only a series of insert, delete and substitution operations.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - alignment formats", "q": "What is MAF?", "a": "It can represent referenced multiple alignments with rearrangements. It is column/block-oriented format so it is not possible to represent complex orthology relathioships in a reference free way wwithout extending the format.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - alignment formats", "q": "What is HAL?", "a": "The hierarchical alignment format was designed to be and efficiently accesible format representing genome history, including any availabče ancestral reconstruction.", "kw": [], "info": "HAL allows projection from this genome history onto any reference genome (including ancestors), creating a multiple genome alignment showing what is orthologous (related by ~o) to every base in that genome.", "concl": ""}, {"type": "qa", "section": "Introduction - COMPARATIVE ANNOTATION", "q": "What is genome annotation?", "a": "The process of finding functional elements in a genome assembly.", "kw": [], "info": "Generally, these take the form of protein coding genes, but they can also include noncoding transcripts, chromatin configuration, DNase hypersensitivity, CpG islands, and population variation.", "concl": ""}, {"type": "qa", "section": "Introduction - COMPARATIVE ANNOTATION", "q": "What are the steps in automatic annotation of the genome assemblies?", "a": "Ab initio prediction, or the computational prediction of exon-intron structure using statistical models, and sequence alignment–based approaches, which map any expressed sequence tag (EST), complementary DNA (cDNA), or protein sequences onto an assembled sequence to discover transcripts. Some annotation pipelines combine both sources of transcript prediction to generate a final annotation set", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - COMPARATIVE ANNOTATION", "q": "Which sequencing technologies enabled genome assembly affordable experiment?", "a": "Long read sequencing and linked read sequencing.", "kw": [], "info": "This has led to the formation of consortia that aim to produce genome assemblies on a wide scale, such as the Vertebrate Genome Project", "concl": ""}, {"type": "qa", "section": "Introduction - Seq based Comparative Annotation", "q": "Name some comparative annotation tools?", "a": "TWINSCAN, SGP, SLAM", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - Seq based Comparative Annotation", "q": "How they work?", "a": "They provide probabilistic framework that combines established single - genome gene prediction approaches with informant data obtained through genomic alignments to mprove gene predictions.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - Seq based Comparative Annotation", "q": "Names of tools that use more than one informan species for comparative gene prediction?", "a": "N-SCAN, CONTRAST", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - Seq based Comparative Annotation", "q": "\"Issues\" of these tools?", "a": "These tools require very careful parameter training, which must be performed on every genome in the alignment. Second, these tools require evaluating all pairwise comparisons leading to running times quadratic in the number of genomes.", "kw": [], "info": "Combined with the overall lower efficacy of comparative prediction versus transcriptome and proteome sequence alignment approaches, this has led the field of comparative gene finding to languish for the past 10 years.", "concl": ""}, {"type": "qa", "section": "Introduction - Transcriptome evidence based Comparative Annotation", "q": "Another issue with seq based approach?", "a": "None of the annotation programs described above were capable of incorporating extrinsic information, instead relying entirely on sequence composition.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - Transcriptome evidence based Comparative Annotation", "q": "Name some tools?", "a": "N-SCAN-EST, GenomeWise, AUGUSTUS", "kw": [], "info": "Although these tools were developed for annotating single genomes with extrinsic information from the same genome, they can be applied in a comparative fashion. Alignment of related transcript sequences is used in the gene builds produced by both Ensembl and RefSeq .", "concl": ""}, {"type": "qa", "section": "Introduction - Transcriptome evidence based Comparative Annotation", "q": "What would be a third approach?", "a": "Alignments of protein sequences instead of transcript sequences (they are more robust across long phylogenetic distances)", "kw": ["MAKER2"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - Transcriptome evidence based Comparative Annotation", "q": "What can be used for more distantly related species?", "a": "Approaches that generate profiles of proteins and protein domains may be used", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - Transcriptome evidence based Comparative Annotation", "q": "What is InterPro", "a": "A database that stores precomputed models of protein sequences and motifs that are conserved across long periods of evolutionary history.", "kw": [], "info": "GeneWise can perform gene prediction using a profile HMM like those stored in InterPro. Additionally, AUGUSTUS-PPX  is an extension of the AUGUSTUS annotation program that models protein families and combines them with the existing ab initio model.", "concl": ""}, {"type": "qa", "section": "Introduction - transcript projecton", "q": "How transcript projection works?", "a": "Transcript projection uses sequence alignments to project the coordinates of an existing annotation in one genome to another genome.", "kw": [], "info": "Ab initio gene-finding models rely heavily on the signature of protein coding genes, which limits these models’ ability to predict untranslated region (UTR) sequences; noncoding RNAs, such as long noncoding RNAs; and pseudogenes. Transcript projection methods can be combined with any available extrinsic information from either the genome in question or related genomes and provide the highest-quality annotation", "concl": ""}, {"type": "qa", "section": "Introduction - transcript projecton", "q": "Example of tools?", "a": "Projector, Annotation Integrated Resource (AIR)", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - genome annotation piplines", "q": "MAKER2 ?", "a": "MAKER2 combines multiple forms of extrinsic evidence with ab initio prediction and provides a fully automated end-to-end annotation pipeline. MAKER2 can make use of multiple gene prediction tools, including GeneWise, GeneMark, SNAP, and AUGUSTUS. MAKER2 also performs repeat masking of the assembly.", "kw": [], "info": "It is technically challenging to run the pipeline, and it relies on difficult-to-use parallel computing paradigms. MAKER2 also requires that all extrinsic evidence exist in the form of sequences, and as such requires that RNA-seq data undergo de novo assembly before use.", "concl": ""}, {"type": "qa", "section": "Introduction - genome annotation piplines", "q": "Most vertebrate annotation sets available right now are produced how?", "a": "By large institutional pipelines at either Ensembl (Ensembl Gene Build) or the National Center for Biotechnology Information (RefSeq).", "kw": [], "info": "Both of these pipelines do track orthology relationships and assign gene common names where applicable.", "concl": ""}, {"type": "qa", "section": "Introduction - comparatve annotation toolkit", "q": "CAT pipeline?", "a": "CAT is a comparative annotation pipeline that combines a variety of parameterizations of AUGUSTUS, including Comparative AUGUSTUS, with transMap projections through whole-genome progressiveCactus alignments to produce an annotation set on every genome in a Cactus alignment", "kw": [], "info": "CAT is an attempt to synthesize all of the possible methods of genome annotation, relying on transcript projection, transcriptome and proteome alignments, simultaneous gene finding, and single-genome gene finding with full-length cDNA reads.", "concl": ""}, {"type": "qa", "section": "Introduction - comparatve annotation toolkit", "q": "CAT is connected to GENECODE how?", "a": "CAT leverages high-quality gene sets like those produced by GENCODE on mouse and human to project annotations to other genomes, augmented with predictions that add species specificity and detect gene family expansion and collapse.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - noncoding annotation", "q": "Issue with noncoding regions?", "a": "While standard computational tools easily identify protein-coding genes, annotating noncoding RNAs remains difficult due to their rapid evolution and the frequent risk of mislabeling them, requiring tools like PhyloCSF and careful human curation to get it right.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction - Personal Human Genomes and Intraspecies Annotation", "q": "Steps and chanllanges?", "a": "One step to understanding these personalized de novo assemblies of humans is to annotate them and evaluate them for deleted, duplicated, or rearranged gene content. Rearranged gene content in particular can be difficult to detect with standard short-read resequencing methods.", "kw": [], "info": "", "concl": ""}]}, {"id": "Wiese_2025", "title": "Quantitative trait loci concentrate in specific regions of the Mexican cavefish genome and reveal key candidate genes for cave-associated evolution", "category": "Mexican tetra", "link": "https://academic.oup.com/jhered/article/116/2/89/7724259", "note": "", "items": [{"type": "qa", "section": "Abstract", "q": "What is Mexican cavefish used for in research?", "a": "For studying the genetic mechanisms underlying adaptation to extreme environments.", "kw": ["Adaptation"], "info": "They mappes in the paper 206 previously published QTL for cave derived traits.", "concl": "QTL cluster in the genome more than expected by chance (not explained by the distribution of genes in the genome)."}, {"type": "qa", "section": "Abstract", "q": "Do cetrain characteristics of the genome facilitate phenotypic evolution?", "a": "From what they have tested, highly mutagenic CpG sites, are not reliable predictors of the sites of trait evolution.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What did the combination of QTL map and expression gave them?", "a": "36 candidate genes", "kw": [], "info": "Repeted evolution of cave phenotypes. rgrb --> phototransduction.", "concl": "rgrb had disrupted exons in all non hybrid cave populations but intact reading frmaes in surface fish."}, {"type": "qa", "section": "Abstract", "q": "What is the idea behind evolutionary hotspots?", "a": "They drive adaptation to the cave environment in A.mexicanus.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What understanding the genetic basis of trait evolution help reveal?", "a": "Whether shared or different genetic mechanisms contribute to repeated trait evolution. Also, how often repeated evolution occurs through the same or divergent genetic variants.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What previous studies have revealed about loci?", "a": "They can cluster in specific genomic regions, but it is not known the extent to which specific regions in the genome are commonly used in trait evolution.", "kw": [], "info": "What are the features of thexse regions that make them more likely to harbour genetic variants contributing to phenotypic evolution.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "QTL in general?", "a": "It is used for discovering statistical associations between genotypes and phenotypes.", "kw": [], "info": "First step to understand proximate mechanisms for how traits evolve. Any single QTL study will underestimate the number of loci that influence a given trait and often overestimate their effect sizes.", "concl": "Solution to problem mentioned in additional data is combinig the results of several QTL studies."}, {"type": "qa", "section": "Introduction", "q": "Info about Mexican tetra.", "a": "35 different populations of cavefish, at least.", "kw": [], "info": "Cave populations arose from at least two different colonization events from 2 different ancestral lineages within the last 200 000 years. Since the initial cave col. populations have evolved independently, even thoug there is some evidence of gene flow.", "concl": "Convergently they have evolved common phenotypes. Pachón and Tinaja are most studied populations."}, {"type": "qa", "section": "Introduction", "q": "What ability allows researchers to utilize QTL mapping in A. mexicanus?", "a": "Ability to cross breed and give viable hybrids, this allows researchers to identfy statistical associations between genotypes and phenotypes.", "kw": [], "info": "", "concl": "This facilitates the study of the genetic basis of phenotypic evolution in A. mexicanus"}, {"type": "qa", "section": "Introduction", "q": "How many QTL studies are there for am?", "a": "20 in last 2 decades.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What first QTL study discovered?", "a": "1st study: QTL for three quantitative traits: eye size, pigmentation, and condition factor (a measure of weight scaled by length).", "kw": [], "info": "Two clusters of QTL, one consisting of overlapping QTL for condition factor and pigmentation and another consisting of overlapping QTL for condition factor and eye size.", "concl": "Overlapping QTL raise two possible explanations: (1) that the same genes underlie both traits due to pleiotropic effects, or (2) that different closely linked genes underlie the traits."}, {"type": "qa", "section": "Introduction", "q": "How are QTLs often orginized in the genome?", "a": "Many QTL for cave-derived traits form clusters in the A. mexicanus genome.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "In total, how many significant QTL clusters were known in 2014?", "a": "They mapped all published QTL (through 2014) to the first draft of the A. mexicanus Pachón cavefish genome (McGaugh et al. 2014), and found 13 significant QTL clusters across eight linkage groups.", "kw": ["13 QTLs and 8 linkage groups"], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "When was new surface fish chromosome level genome assembly became available?", "a": "2022., AstMex3", "kw": [], "info": "Mapping QTL to a more complete surface fish genome, instead of the cavefish genome, will yield more comprehensive results if important loci were missing from the fragmented cavefish assembly.", "concl": "Chromosome level, containing 25 chromosomes, 109 unplaced scaffolds, and greatly improved N50 values of 47.1 Mb for contigs and 51.9 Mb for scaffolds."}, {"type": "qa", "section": "Introduction", "q": "What is the state of first draft of cavefish genome?", "a": "Scaffold level assembly, comprised of 10,735 scaffolds with a contig N50 of 14.7 kb and a scaffold N50 of 1.775 Mb.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Goal of this paper?", "a": "Updated analysis of the distribution of QTL across the A. mexicanus genome, incorporating most published QTL studies in this species to date.", "kw": [], "info": "Genetic markers used in prior studies were re-mapped to the AstMex3 genome to create an integrated genomic map, which was utilized to anchor QTL intervals to the new genome.", "concl": "Percent variance explained (PVE) values of cave-derived QTL for different phenotypic classes."}, {"type": "qa", "section": "Methods", "q": "Literature review", "a": "Databases PubMed and Web of Science: “astyanax” AND “qtl”; “cavefish” AND “qtl”; “astyanax” AND “quantitative trait loc*”; “cavefish” AND “quantitative trait loc*”", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "What was used in prior QTL studeis to find QTL regins?", "a": "Marker sequences.", "kw": ["BLAST+"], "info": "They were collected and aligned to surface genome with BLAST+. Best hit = 1. Highest bitscore, 2. Smallest e-value, 3. Highest percent identity.", "concl": "Integrated genomic map (Three genes (igf1, shhb also known as twhh, pax6) that were used as markers in previous QTL studies but did not have sequences included in our marker database were added manually to the integrated map)"}, {"type": "qa", "section": "Methods", "q": "Which markers were discarded?", "a": "The markers with multiple hits were discarded if they could not be ranked using this criteria. Also, markers for which the best BLAST hit mapped to a chromosome discordant with other markers on its original linkage group were discarded.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "The integrated genomic map was used for what?", "a": "To identify the location of each QTL in the AstMex3.", "kw": [], "info": "", "concl": "Compiling QTL peaks --> for future candidate gene identification and to understand traits with potentially co-localizing loci."}, {"type": "qa", "section": "Methods", "q": "What were the the genetic markers designating the 95% confidence interval for each QTL used for?", "a": "To designate the section of the genome in which loci underlying the trait of interest may be found", "kw": [], "info": "If a confidence interval was not available, only the marker representing the QTL peak was used to estimate the location of the QTL in the genome.", "concl": "If the markers designating both the 95% confidence interval and the peak of a given QTL were absent from the integrated genomic map, then that QTL was discarded from the rest of the analysis."}, {"type": "qa", "section": "Methods", "q": "How were the phenotypic categories assigned?", "a": "Manually, one of eight categories (Eye, Pigment, Skeletal, Non-Eye Sensory, Metabolic, Behavior, Cardiac, Other morphological (this category consisted of traits that did not fit clearly into one of the other seven categories, e.g. length).", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "How was analysis of QTL distribution made?", "a": "QTL were filtered to include only the QTL that were mapped to intervals (not just peaks) in the integrated genomic map", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "Why were the QTLs with total interval lenght that was outlier was discarded?", "a": "QTL that were coarsely mapped to vast stretches of the genome may mask any potential trends in genomic QTL distribution", "kw": [], "info": "Outlier formula: Upper limit = Upper quartile + (1.5*IQR), where the upper quartile is the 75th percentile of QTL lengths and the IQR is the interquartile range of QTL lengths (75th percentile – 25th percentile).", "concl": ""}, {"type": "qa", "section": "Methods", "q": "How were the chromosomes divided?", "a": "Into 118 non-overlapping 10 Mb windows using the tileGenome function from the GenomicRanges R package", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "Why they have chosen the window size of 10 Mb?", "a": "It approximates the typical length of a QTL interval in the filtered dataset (mean length = 11.4 Mb, median length = 9.64 Mb).", "kw": [], "info": "Windows were “centered” by finding the largest whole number of 10 Mb windows that could fit in each chromosome, subtracting the total length of these windows from the total length of the chromosome to find the “remaining” chromosome length, and shifting the starting position of the first window to a value equal to one half of the remaining length.", "concl": "The number of QTLs overlapping each window."}, {"type": "qa", "section": "Methods", "q": "How to test whether the number of observed distinct QTLs in each window matches a distribution expected by chance?", "a": "Monte Carlo Chi square test.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "What distributions were tested?", "a": "(1) a null expectation that QTL are distributed uniformly across the genome, and (2) the expectation that QTL are distributed across the genome proportional to protein-coding gene density.", "kw": [], "info": "putative QTL clusters", "concl": ""}, {"type": "qa", "section": "Methods", "q": "What were putative QTL clusters?", "a": "10 Mb windows with high standardized residual values (>3) against either the uniform distribution or the gene density distribution grouped together.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "What can predispose regions to contribute to phenotypic evolution?", "a": "Mutational biases or opportunities", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "How were molecular factors tested for underlying QTL distribution?", "a": "Data was generated for each of the 118 10Mb windows of the AstMex3 surface genome assembly. For each factor listed in commment, we conducted a Wilcox test in R to test for differences between the set of 10 Mb windows that were designated as putative QTL clusters and the set of 10 Mb windows that contain no mapped QTL", "kw": [], "info": "Six 10 Mb windows across four different chromosomes were identified as putative QTL clusters due to having significantly more QTL than expected under either the uniform null distribution or the gene density null distribution.", "concl": ""}, {"type": "qa", "section": "Methods", "q": "What is test for skewness measuring?", "a": "A measure of the symmetry of a distribution", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "What is test for kurtosis measuring?", "a": "A measure of whether the distribution is light-tailed or heavy-tailed", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Methods", "q": "How were the sets of genes overlapping with QTLs found?", "a": "(1) the set of all genes overlapping with a QTL was obtained using the valr package (2) the set of all genes exhibiting evidence of selective sweeps in three independent cave populations (Pachón, Tinaja, and Molino) yet no evidence of selection in two surface populations (i.e., Río Choy, Rascón) (3) RNAseq data, originally collected by (Mack et al. 2021) from whole body samples of larval Pachón, Tinaja, and Molino cavefish as well as Río Choy surface fish, were reanalyzed", "kw": [], "info": "Differential expression between Pachón and Río Choy, Tinaja and Río Choy, and Molino and Río Choy, all at time 0 in the original study, using the DESeq2 package in R", "concl": "The set of genes that were differentially expressed in all three cave populations relative to the surface population, and for which the change in expression followed the same pattern in each population were designated as genes with shared differential expression."}, {"type": "qa", "section": "Methods", "q": "Candidate genes for cave-derived phenotypes (Table S13) were identified by finding the subset of genes...", "a": "1) Have undergone shared selective sweeps in three separate cave populations and not in surface populations as defined by Moran et al. (2023), 2) Have shared differential expression between three cave populations relative to a surface population, and 3) Are found within a QTL for cave-derived traits.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "How many genetic marker seqs from previous studies were found?", "a": "a total of 9023 genetic marker sequences from prior QTL studies were collected and aligned to the AstMex3 surface fish genome using BLASTn", "kw": [], "info": "", "concl": "Final integrated genomic map consisted of the best BLAST hit for the remaining 8486 genetic markers"}, {"type": "qa", "section": "Results", "q": "What was genomic map used for?", "a": "To associate 206 previously published QTL for cave-derived traits to the AstMex3 surface genome", "kw": [], "info": "168 of the QTL, genetic markers marking the ends of the LOD confidence interval were part of the integrated genomic map, and the genomic range spanning the beginning of the first marker to the end of the second marker was denoted as a QTL interval.", "concl": ""}, {"type": "qa", "section": "Results", "q": "QTL peaks?", "a": "38 QTL, only a genetic marker associated with the peak of the LOD curve was present in the integrated genomic map, and the genomic range of this individual marker was denoted as a QTL peak", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "", "a": "They found (1) that the observed QTL distribution does not fit the expected distribution under a null model which assumes a uniform distribution of QTL across the genome. (2) the observed QTL distribution does not fit the expected distribution under a model in which QTL density is proportional to protein-coding gene density", "kw": [], "info": "", "concl": "This supports the hypothesis that QTL for cave-derived traits cluster in the genome. (Six 10 Mb windows across four different chromosomes were identified as putative QTL clusters due to having significantly more QTL than expected under either distribution)"}, {"type": "qa", "section": "Results", "q": "What was the result about \"Distribution of putative QTL clusters is explained by molecular factors?\"", "a": "Not explained, none of the variables tested were significantly different between the two groups.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "How distribution of effect sizes depends on type of trait?", "a": "The distribution is extremely positively skewed (Skewness coefficient = 2.04) and light-tailed (kurtosis coefficient = 8.02).", "kw": [], "info": "", "concl": "Most alleles detected to be associated with cave-derived phenotypes explain a relatively small proportion of phenotypic variation, with just a few outlying mutations that contribute more substantially to cave-derived phenotypes."}, {"type": "qa", "section": "Discussion — rgrb", "q": "Why was rgrb highlighted?", "a": "rgrb overlaps a retinal outer-plexiform-layer thickness QTL, is downregulated in cavefish, and has shared selective-sweep evidence. It encodes retinal G protein-coupled receptor b.", "kw": ["rgrb", "opsin", "retinal thickness"], "info": "Discussion; candidate list Table S13. Predicted opsin function is biological context, not a demonstrated mechanism here.", "concl": "rgrb is a strong candidate for cave-associated retinal differences."}, {"type": "qa", "section": "Discussion — rgrb", "q": "Was rgrb expression examined in eye tissue?", "a": "A separate RNA-seq dataset from developing eyes at 54 hpf was remapped; rgrb was downregulated in Pachón cavefish relative to surface fish.", "kw": ["54 hpf", "eye RNA-seq"], "info": "Gore et al. (2018) dataset; Table S14. This supplements the whole-body 30 dpf evidence.", "concl": "Eye-specific expression supports the candidate’s relevance to retinal development."}, {"type": "qa", "section": "Discussion — rgrb", "q": "What structural differences were reported?", "a": "Exons 4 and 5 were nearly completely deleted in multiple cave populations from both lineages; surface populations retained intact reading frames.", "kw": ["Exon deletion", "cave lineages"], "info": "Supplementary alignment. Listed caves: Escondido, Molino, Jineo, Jos, Monticellos, Pachón, Palma Seca, Tinaja and Yerbaniz.", "concl": "Structural disruption and reduced expression provide complementary evidence."}, {"type": "qa", "section": "Discussion — stra6", "q": "Why is stra6 a candidate?", "a": "stra6 was downregulated in cavefish and overlapped a maxillary-bone-length QTL. The authors propose a connection through retinoid signaling and craniofacial development.", "kw": ["stra6", "retinoids", "maxillary bone"], "info": "Mechanistic interpretation is a hypothesis. STRA6 is commonly described as a retinol-binding-protein receptor; the paper calls it a retinoic acid receptor.", "concl": "The gene links a mapped skeletal trait to a plausible pathway."}, {"type": "qa", "section": "Discussion — rab8a", "q": "Why is rab8a a candidate?", "a": "rab8a was upregulated in cavefish and overlapped QTL for relative condition and peduncle depth. Its known role in glucose transporter regulation offers a possible metabolic connection.", "kw": ["rab8a", "glucose homeostasis", "body condition"], "info": "Function cited from other work; it was not experimentally established for cavefish in this study.", "concl": "rab8a could connect expression divergence with metabolic and morphological traits."}, {"type": "qa", "section": "Discussion — mechanism", "q": "Does QTL overlap demonstrate pleiotropy?", "a": "No. A single gene affecting multiple traits and several tightly linked trait-specific genes can both produce overlapping QTL.", "kw": ["Pleiotropy", "linkage"], "info": "Discussion proposes fine mapping and functional interrogation, including CRISPR-Cas9, to separate hypotheses.", "concl": "Overlap suggests hypotheses rather than resolving mechanism."}, {"type": "qa", "section": "Discussion — limitations", "q": "Why could genomic-feature effects have been missed?", "a": "The broad intervals often span hundreds of genes. Relevant causal sites could occupy a small part of an interval, diluting local effects in 10 Mb averages.", "kw": ["Resolution", "local effects", "statistical power"], "info": "Additional limitations include heterogeneous original designs and dependence where studies reuse mapping populations.", "concl": "Coarse-scale negative results should not be generalized to individual promoters."}, {"type": "qa", "section": "Discussion — conclusion", "q": "What is the central conclusion?", "a": "Cave-associated trait loci concentrate in parts of the genome, and intersecting positional, expression and selection data yields focused candidates for repeated adaptation.", "kw": ["Genetic architecture", "repeated adaptation"], "info": "The study provides an integrated resource and testable hypotheses, rather than comprehensive functional validation.", "concl": "Use the map to guide finer-resolution experiments."}]}, {"id": "Warren_2021", "title": "A chromosome-level genome of Astyanax mexicanus surface fish for comparing population-specific genetic differences contributing to trait evolution", "category": "Mexican tetra", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7933363/", "note": "", "items": [{"type": "qa", "section": "Introduction", "q": "What is the advantage of having surface relatives to cave species?", "a": "Opportunity to investigate the mechnaistic underpinnings of evolution and to determen what genotype - phenotype interactions are deeply conserved.", "kw": ["Genotype - phenotype interactions"], "info": "30 cave dweilling populations (at least) --> functional and genomic comparisons", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "What generating fertile hybrids made possible?", "a": "Genetic mapping.", "kw": [], "info": "Because hybrids are fertile, scientists can cross them across generations (F1, F2, or backcrosses).", "concl": "By tracking which genetic markers get inherited alongside specific traits (like eye loss, sleep patterns, or metabolic changes), researchers can pinpoint the exact regions of the genome (Quantitative Trait Loci) responsible for those traits."}, {"type": "qa", "section": "Introduction", "q": "What obsticles they overcame in this paper?", "a": "First de novo genome assembly of the surface fish morph using long read seq. --> genome wide comparison between surface fish and Pachon cavefish. Novel QTLs.", "kw": ["De novo genome assembly", "long read seq"], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "What sequencing platform was used?", "a": "Pacific Biosciences single molecule real time sequencing (75 x genome coverage)", "kw": ["SMRT"], "info": "wtdbg2 assembler, ungapped size of 1.29 Gb; Initial scaffolding of assembled contigs was accomplished with the aid of an A. mexicanus surface fish physical map (BioNano) followed by manual assignment of 70% of the assembly scaffolds to 25 total chromosomes using the existing A. mexicanus genetic linkage map markers.", "concl": ""}, {"type": "qa", "section": "Results", "q": "Characteristics of the final genome?", "a": "Amex 2.0. --> 2415 scaffolds (including single contig scaffolds) N50 contig and scaffold lengths of 1.7 and 35 Mb", "kw": ["Scaffold characteristics"], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "Assebled regions that they were not able to assign to chromosomes were mostly due to what reasons?", "a": "The assembled regions (394 Mb) that we were unable to assign to chromosomes were mostly due to 3.36% (2235 markers total) of the (1)genetic linkage markers not aligning to the surface fish genome, (2)single markers per contig where the orientation could not be properly assigned, or (3)markers that mapped to multiple places in the genome and thus could not be uniquely mapped.", "kw": ["Non-assigned assemby regions."], "info": "The uniquely mapped markers exhibited few ordering discrepancies and significant synteny between the linkage map30 and the assembled scaffolds of the Astyanax mexicanus 2.0 genome, validating the order and orientation of a majority of the assembly.", "concl": ""}, {"type": "qa", "section": "Results", "q": "How was possible mapping bias investigated?", "a": "Possible mapping bias across cave population sequences to the cave vs surface fish genome references was also investigated by mapping population level resequencing reads to both genomes. We found the number of unmapped reads is greater for all populations aligned to the Astyanax mexicanus 1.0.2 reference compared to Astyanax mexicanus 2.0", "kw": ["Mapping bias"], "info": "The percentage of properly paired reads, that is, pairs where both ends align to the same scaffold, is greater for all resequenced cave populations aligned to the Astyanax mexicanus 2.0 reference (Supplementary Fig. 3) and significantly more nonprimary alignments with greater variation were observed", "concl": "Astyanax mexicanus 2.0 reference has more resolved sequence regions than the Astyanax mexicanus 1.0.2 reference."}, {"type": "qa", "section": "Results", "q": "How were two sets of protein coding genes generated?", "a": "Using NCBI and ENsembl automated piplines: 25,293 and 26,698.", "kw": ["protein coding genes"], "info": "Gene annotation was aided by the diversity of transcript data derived from whole adult fish, embryos, and 12 different tissues available from the NCBI short-read archive.", "concl": "The total predicted protein-coding genes and transcripts (mRNA) were consistent with other annotated teleost species (Supplementary Table 2) and 1665 new protein-coding genes were added compared to Astyanax mexicanus 1.0.2"}, {"type": "qa", "section": "Results", "q": "What was discovered about the lncRNA?", "a": "It is somewhat improved in hte Amex 2.0 compared to the older version (5314 vs 1062).", "kw": ["lncRNAs"], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "How was assessed completness of gene annotation?", "a": "By applying benchmarking universal single - copy ortholog scores -> it measures gene completness among vertebrate genes.", "kw": ["Completness of gene annotation"], "info": "", "concl": "94.6% of genes are complete, 4% are missing, and 4.2% are duplicated"}, {"type": "qa", "section": "Results", "q": "What was NCBIs transcript aligner Splign used for?", "a": "It is used to compute spliced alignments between cDNA/mRNA sequences (including ESTs) and genomic DNA. (...)gene annotation metrics, same-species RefSeq or GeneBank transcripts show 98.4% coverage when aligned to Astyanax mexicanus 2.0.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "What greater lenght of contigs shoud help with? Also, question before, what other data they also used?", "a": "They combined it with syntenic analysis - that unites the physical genome to a previously published linkage map based on genotyping-by-sequencing (GBS) markers - That in combination should greatly aid the correct identification of genetic changes linked to cave traits.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "Albinisam in amex, intro?", "a": "Previously has been mapped in QTL studis in both Pachòn and Molino populations.", "kw": [], "info": "", "concl": "These mapping studies showed that a single major QTL in each population colocalized with a candidate gene oca2."}, {"type": "qa", "section": "Results", "q": "How it was proved that oca2 gene isimportant?", "a": "By CRISPR-mediated mutagenesis in surface fish.", "kw": ["CRISPER"], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "Two separate de novo QTL analyses of surface/Pachón F2 hybrids (group A and B) in the context of the new reference genome were use d for what?", "a": "Identified a single QTL for albinism, with a LOD score of 47.31 at the peak marker on linkage group (LG) 3 (69% variance explained) in group A, and with LOD score of 22.56 at the peak marker on LG 21 (37.8% variance explained) in group B.", "kw": [], "info": "", "concl": "At the peak QTL positions, F2 hybrids homozygous for the cave allele are albino. Mapping the markers associated with each of these LGs to the surface fish genome revealed that they are both located on surface fish chromosome 13."}, {"type": "qa", "section": "Results", "q": "How is the improvment of the mapping to the new genome shown in the paper? (in context of previous question)", "a": "LG 3 from group A almost completely corresponds to surface fish chromosome 13 in Astyanax mexicanus 2.0, whereas it is split up into many contigs in Astyanax mexicanus 1.0.2.", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "How they functionally verified that a change in the oca2 locus is responsible for albinism in the F2 hybrids?", "a": "By crossing an albino surface/Pachón F2 hybrid with a genetically engineered surface fish heterozygous for a deletion in oca2 exon 21.", "kw": ["Functinal verification of oca2 locus"], "info": "", "concl": "46.5% of the offspring completely lacked pigment"}, {"type": "qa", "section": "Results", "q": "Why they aligned sequencing data obtained from wild-caught fish from different surface and cave localities?", "a": "Nine out of ten Pachón cavefish carry the deletion in exon 24 that was previously reported in laboratory-raised fish", "kw": [], "info": "None of the individuals from other populations for which sequence information was available carried the same deletion. Consistent with the laboratory strains, exon 21 of oca2 is absent in all Molino cavefish samples. Smaller heterozygous or homozygous deletions in exon 21 in some wild samples of Pachón and Tinaja fish.", "concl": "Detected deletions in oca2 that would have not been discovered with alignments to Astyanax mexicanus 1.0.2 since exon 24 is missing in Pachón and thus no reference-based alignments were produced in that region"}, {"type": "qa", "section": "Results", "q": "Why they remapped previosly published QTLs?", "a": "1060 out of 1124 markers (94.3%) mapped successfully with BLAST and were included in our surface fish QTL database", "kw": [], "info": "77 markers that did not map to the cavefish genome28 but did map to the surface fish genome, 52 markers that mapped to the cavefish but not the Astyanax mexicanus 2.0 reference, and 12 markers that did not map to either reference.", "concl": ""}, {"type": "qa", "section": "Results", "q": "Why before using more fragmented genome was an isssue?", "a": "They could not identify as much genes connected to some QTLs.", "kw": [], "info": "the markers Am205D and Am208E mapped to an\n~1 Mb region of chromosome 6 of the surface fish genome (46,516,926–47,425,713 bp) but did not map to the Astyanax mexicanus 1.0.2 reference. --> associated with feedsing angle, eye size, vibration attraction behaviour, suborbital neuromasts, maxilliary tooth number.", "concl": "Multiple candidate\ngenes related to cave-specific phenotypes are contained in this\nregion including rhodopsin (vision), ubiad1 (eye development), as\nwell as GABA A receptor delta, which is associated with a variety\nof behaviors and could conceivably be involved in VAB."}, {"type": "qa", "section": "Results", "q": "What do you know about retinal homebox gene 3 (rx3)?", "a": "Previosuly it was suggested that gene for this lies in QTL for outer plexifor layer of eye. But another QTL for eye size, size of the third suborbital bone and body condition may also contain it. --> they coould not prove it before new assemby", "kw": [], "info": "The expression area is significantly smaller in Pachón embryos compared to stage-matched\nsurface fish embryos. The trait is recessive since the expression of rx3 is restored to higher levels in F1 generation.", "concl": "The CRISPR-edited surface fish grew up completely eyeless, perfectly mimicking the blind cavefish"}, {"type": "qa", "section": "Results", "q": "What were surface-anchored locations of markers consered with locomotor activity differences betvene c and s from the high-density linkage map used for?", "a": "They confirmed the presence of 20 previously reported candidate genes, and identified 96 additional genes with relevant GO terms, including rx3. New candidates include additional opsins as well as several genes contributing to circadian rhythmicity (id2b, nfil3-5, cipcb, clocka, and npas2).", "kw": [], "info": "", "concl": ""}, {"type": "qa", "section": "Results", "q": "How they explored eye reduction phenotype?", "a": "Astyanax mexicanus 2.0 reference to de novo genetically map eye size in the two surface/Pachón F2 groups that they used to map albinism.", "kw": [], "info": "Multiple QTLs for normalized eye perimeter that were spread across four LGs. One of these hotspots, located on Linkage Group 1 (LG 1), was incredibly strong. They discovered that the surface fish's version of this DNA region is dominant. The new, high-definition genome map perfectly aligned this region onto Chromosome 3, allowing researchers to accurately read the genes located there. --> ofcc1 gene (also known as ojoplano or opo). in medaka embryos, o gnee knock out -Specifically, a structure called the \"optic cup\" fails to fold into the correct 3D shape, resulting in severely deformed lenses and retinas.", "concl": ""}]}, {"id": "Richards_2026", "title": "Cave evolution on repeat: reuse of the same genomic regions across lineages but not across traits in Astyanax mexicanus", "category": "Mexican tetra", "link": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12889537/", "note": "", "items": [{"type": "qa", "section": "Abstract", "q": "Repeatedly evolved traits, how they evolved?", "a": "Same or different genetic mechanisms, we often dont know", "kw": [], "info": "", "concl": "What constrains evolutionary change."}, {"type": "qa", "section": "Abstract", "q": "Main adaptations of Astyanax mexicanus?", "a": "Reduced sleep duration, eye degeneration, and metabolic shifts to accommodate limited nutrient availability.", "kw": [], "info": "Whether shared or independent genetic architecture govern the repeated evolution of sleep loss, increased food consumption, early onset adipose deposition, and eye loss in different evolutionary origins of the cavefish phenotype.", "concl": ""}, {"type": "qa", "section": "Abstract", "q": "What method they used?", "a": "QTL mapping across three cave x surface F2 mapping populations.", "kw": [], "info": "", "concl": "Eye loss exhibits the most genetic repeatability, with ~43% of QTL shared across lineages.Sleep loss and metabolic traits (i.e., feeding, adiposity) were genetically less repeatable, with only ~25–33% of QTL shared across lineages."}, {"type": "qa", "section": "Abstract", "q": "whether QTL for metabolism, eye loss, and sleep traits in cavefish co-localize in the cavefish genome and could be inherited together?", "a": "Repeatedly co-evolved in cave populations, we did not find evidence for extensive genetic linkage among them.", "kw": [], "info": "", "concl": "Genetic repeatability is a common feature in the repeated evolution of cave traits, the extent of genetic repeatability varies across cave traits, and that there is little evidence for widespread co-localization of sleep, eye loss, and metabolic traits within the genome."}, {"type": "qa", "section": "Summary", "q": "Iconic examples of repeated trait evolution often involve what?", "a": "Repeated mutations in the same genes.", "kw": [], "info": "Multi-trait, multi-population QTL analysis for similar eye loss, sleep loss and metabolic shifts", "concl": "There are limits on the type of genes and mutations that can contribute to phenotypic evolution."}, {"type": "qa", "section": "Introduction", "q": "What is repeated evolution?", "a": "Shift of independent lineages to similar phenotypes in response to similar environments.", "kw": [], "info": "Natural replicates!", "concl": "It enable us to understand genetic and developmental mechanisms underlying evolutionary change."}, {"type": "qa", "section": "Introduction", "q": "What specificly is interesting to explore with it?", "a": "Genetic basis of complex traits.", "kw": [], "info": "", "concl": "Comparative analysis across other systems reveal that repeated trait evolution may also involve using distinct genetic paths to similar phenotypes."}, {"type": "note", "section": "Introduction", "text": "Why some case studies of repeated evolution involve reuse of the same genetic mechanisms or genomic regions while others do not?"}, {"type": "qa", "section": "Introduction", "q": "Mutations affecting pleiotropic genes were once thought to be universally unlikely contributors to adaptation due to their potential negative fitness consequences? But, what they found next..", "a": "Recent theoretical work suggests that when adaptation occurs in the face of gene flow, pleiotropic or linked genetic architectures have a selective advantage over more disparate genetic architectures", "kw": [], "info": "Co-localized genetic architectures act as large-effect loci that selection can more easily drive to fixation in a segregating pool of non-adapted and adapted genotypes.", "concl": "Whether repeatedly evolved suites of traits share genomic regions due to pleiotropy or linkage remains central to the question of what drives repeated evolution."}, {"type": "qa", "section": "Introduction", "q": "How is the problem of gene flow from surface populations solved?", "a": "To survive the constant flood of \"normal\" genes from surface fish, the cave animals can't rely on hundreds of tiny, slow genetic changes. They need powerful genetic shortcuts to keep their cave traits intact. A \"locus\" (plural: loci) is just a specific location or gene on their DNA.", "kw": [], "info": "1. Large-effect loci (The Big Switch): A gene that makes a massive difference all by itself. 2. Pleiotropic loci (The Multitasker): One single gene that controls several entirely different things at once. 3. Linked loci (The Combo Pack): Different genes that happen to sit so close together on the DNA strand that they are always passed on to the next generation together as a single package.", "concl": ""}, {"type": "qa", "section": "Introduction", "q": "Empirical evidence showed proof for what?", "a": "Past QTL and functional gene validation studies in cavefish lend empirical evidence for the existence of co-localized genetic architectures underlying multiple cave traits.", "kw": [], "info": "Example: deletions in single genes like oca2 influencing both sleep and pigmentation loss, etection of several
